<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>Triaging application failures: manual command versus Ansible execution</title>
  <desc>Flowchart and environment comparison diagnosing whether application task failures stem from OS host state or Ansible execution environment discrepancies.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#303a36">
    Triaging application failures: manual command versus Ansible execution
  </text>

  
  <g id="top-node">
    <rect x="250" y="95" width="1100" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(275, 117)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="6" />
      <line x1="0" y1="18" x2="56" y2="18" />
      <circle cx="12" cy="9" r="3" fill="#207448" />
      <circle cx="24" cy="9" r="3" fill="#207448" />
      
      <line x1="20" y1="28" x2="36" y2="44" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="36" y1="28" x2="20" y2="44" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="360" y="138" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      Task fails at application layer (command or shell task returns non-zero rc)
    </text>
    <text x="360" y="172" font-family="sans-serif" font-size="24" fill="#506059">
      Execution terminates abnormally during Ansible playbook run
    </text>
  </g>

  
  <line x1="800" y1="195" x2="800" y2="233" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="action-box">
    <rect x="360" y="235" width="880" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(385, 252)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="6" />
      <polyline points="14,20 24,28 14,36" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="36" x2="42" y2="36" stroke-linecap="round" />
    </g>
    <text x="465" y="291" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      Extract exact command line from -vvv output
    </text>
  </g>

  
  <line x1="800" y1="325" x2="800" y2="368" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="decision-node">
    <rect x="220" y="370" width="1160" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(245, 392)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="18" r="12" />
      <path d="M 8 50 C 8 36 16 32 28 32 C 40 32 48 36 48 50" />
    </g>
    <text x="800" y="412" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      Run command on target host by hand using 'sudo -u user -i'
    </text>
    <text x="800" y="448" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#506059">
      Reproduce exact invocation manually inside the target environment
    </text>
  </g>

  
  
  <line x1="320" y1="470" x2="320" y2="505" stroke="#207448" stroke-width="4" />
  
  <g id="pill-fails">
    <rect x="200" y="505" width="240" height="46" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="320" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Fails manually
    </text>
  </g>
  
  <line x1="320" y1="551" x2="320" y2="588" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="branch-1-container">
    <rect x="50" y="590" width="540" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="70" y="610" width="500" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 624)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="6" width="44" height="44" rx="4" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="28" y1="2" x2="28" y2="6" />
      <line x1="40" y1="2" x2="40" y2="6" />
      <line x1="16" y1="50" x2="16" y2="54" />
      <line x1="28" y1="50" x2="28" y2="54" />
      <line x1="40" y1="50" x2="40" y2="54" />
      <circle cx="28" cy="28" r="8" />
    </g>
    <text x="335" y="662" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      Root cause is in OS or host state
    </text>

    
    <rect x="80" y="715" width="480" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="320" y="761" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      check nvidia-smi for GPU state
    </text>

    
    <rect x="80" y="805" width="480" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="320" y="843" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      verify missing shared libraries
    </text>
    <text x="320" y="875" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      or packages
    </text>

    
    <rect x="80" y="910" width="480" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="320" y="956" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      verify kernel modules loaded
    </text>

    
    <rect x="80" y="1000" width="480" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="320" y="1046" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      verify file permissions
    </text>
  </g>

  
  
  <line x1="1090" y1="470" x2="1090" y2="505" stroke="#db8129" stroke-width="4" />
  
  <g id="pill-succeeds">
    <rect x="940" y="505" width="300" height="46" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="1090" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      Succeeds manually
    </text>
  </g>
  
  <line x1="1090" y1="551" x2="1090" y2="588" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g id="branch-2-container">
    <rect x="625" y="590" width="930" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="645" y="610" width="890" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(665, 624)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="14" />
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28" />
      <path d="M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
    </g>
    <text x="1105" y="645" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      Root cause is Ansible execution
    </text>
    <text x="1105" y="677" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      environment discrepancy
    </text>

    
    <g id="callout-left-column">
      <rect x="645" y="710" width="435" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      
      <rect x="645" y="710" width="435" height="80" rx="12" fill="#e8f1ea" />
      <text x="862" y="744" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
        Manual Login Shell
      </text>
      <text x="862" y="774" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
        (sudo -u user -i)
      </text>
      <line x1="645" y1="790" x2="1080" y2="790" stroke="#207448" stroke-width="2" />

      
      <text x="665" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
        • loads /etc/profile
      </text>
      <text x="685" y="860" font-family="sans-serif" font-size="24" fill="#303a36">
        and ~/.bashrc
      </text>

      
      <text x="665" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
        • has full PATH
      </text>
      <text x="685" y="935" font-family="monospace" font-size="24" fill="#207448">
        (/usr/local/cuda/bin:
      </text>
      <text x="685" y="965" font-family="monospace" font-size="24" fill="#207448">
        /opt/slurm/bin:/usr/bin)
      </text>

      
      <text x="665" y="1015" font-family="sans-serif" font-size="24" fill="#303a36">
        • active locale and
      </text>
      <text x="685" y="1045" font-family="sans-serif" font-size="24" fill="#303a36">
        proxy variables
      </text>
    </g>

    
    <g id="callout-right-column">
      <rect x="1100" y="710" width="435" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      
      <rect x="1100" y="710" width="435" height="80" rx="12" fill="#e8f1ea" />
      <text x="1317" y="760" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
        Ansible Task Execution
      </text>
      <line x1="1100" y1="790" x2="1535" y2="790" stroke="#207448" stroke-width="2" />

      
      <text x="1120" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
        • runs in non-interactive
      </text>
      <text x="1140" y="860" font-family="sans-serif" font-size="24" fill="#303a36">
        non-login shell
      </text>

      
      <text x="1120" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
        • minimal default PATH
      </text>
      <text x="1140" y="942" font-family="monospace" font-size="24" fill="#db8129">
        (/usr/bin:/bin)
      </text>

      
      <text x="1120" y="1015" font-family="sans-serif" font-size="24" fill="#303a36">
        • stripped environment
      </text>
    </g>
  </g>

  
  
  <line x1="1090" y1="1110" x2="1090" y2="1158" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  <g id="resolution-node">
    <rect x="160" y="1160" width="1280" height="120" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(195, 1192)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="14" />
      <line x1="30" y1="30" x2="52" y2="52" stroke-linecap="round" />
      <line x1="42" y1="42" x2="48" y2="36" stroke-linecap="round" />
      <line x1="48" y1="48" x2="54" y2="42" stroke-linecap="round" />
    </g>

    <text x="280" y="1212" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
      Resolution:
    </text>
    <text x="445" y="1212" font-family="sans-serif" font-size="28" fill="#303a36">
      supply required variables explicitly
    </text>
    <text x="280" y="1254" font-family="sans-serif" font-size="28" fill="#303a36">
      using the task environment keyword
    </text>
  </g>
</svg>