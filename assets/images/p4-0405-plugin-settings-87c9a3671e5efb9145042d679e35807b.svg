<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Five plugin settings, and the plugins grouped by purpose</title>
  <desc>Visual comparison table of five essential inventory plugin settings on the left, and inventory plugins grouped by purpose on the right.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="78" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Five plugin settings, and the plugins grouped by purpose</text>

  
  <rect x="40" y="112" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="65" y="150" font-family="monospace" font-size="24" font-weight="bold" fill="#a3e3be">&gt;_</text>
  <text x="105" y="150" font-family="monospace" font-size="24" fill="#ffffff">ansible-doc -t inventory -l <tspan font-family="sans-serif" fill="#d0ebd7">lists what your installation provides</tspan></text>

  
  <g id="settings-table">
    
    <rect x="40" y="195" width="740" height="900" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <rect x="40" y="400" width="740" height="130" fill="#e8f1ea"/>
    <rect x="40" y="660" width="740" height="150" fill="#e8f1ea"/>
    
    <rect x="40" y="810" width="740" height="285" fill="#fff9f2" rx="0"/>
    <rect x="40" y="810" width="8" height="285" fill="#db8129"/>

    
    <rect x="40" y="195" width="740" height="55" rx="10" fill="#207448"/>
    <rect x="40" y="235" width="740" height="15" fill="#207448"/>
    <text x="65" y="234" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Setting</text>
    <text x="315" y="234" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">What it does</text>

    
    <line x1="285" y1="195" x2="285" y2="1095" stroke="#207448" stroke-width="2"/>

    
    <line x1="40" y1="400" x2="780" y2="400" stroke="#207448" stroke-width="1.5"/>
    <line x1="40" y1="530" x2="780" y2="530" stroke="#207448" stroke-width="1.5"/>
    <line x1="40" y1="660" x2="780" y2="660" stroke="#207448" stroke-width="1.5"/>
    <line x1="40" y1="810" x2="780" y2="810" stroke="#db8129" stroke-width="2"/>

    
    <g transform="translate(138, 268)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 26 L26 6 L44 6 L44 24 L24 44 Z"/>
      <circle cx="35" cy="15" r="3" fill="#207448"/>
    </g>
    <text x="162" y="360" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">keyed_groups</text>
    <text x="310" y="300" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="310" dy="0">builds groups from attributes</tspan>
      <tspan x="310" dy="34">such as tags, labels, zone or</tspan>
      <tspan x="310" dy="34">instance type</tspan>
    </text>

    
    <g transform="translate(138, 418)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="15" cy="34" r="9"/>
      <circle cx="35" cy="34" r="9"/>
      <circle cx="25" cy="15" r="9"/>
    </g>
    <text x="162" y="495" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">groups</text>
    <text x="310" y="452" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="310" dy="0">builds groups from</tspan>
      <tspan x="310" dy="34">Jinja conditions</tspan>
    </text>

    
    <g transform="translate(138, 548)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="12" x2="42" y2="12"/>
      <line x1="8" y1="25" x2="42" y2="25"/>
      <line x1="8" y1="38" x2="42" y2="38"/>
      <circle cx="18" cy="12" r="4" fill="#ffffff"/>
      <circle cx="32" cy="25" r="4" fill="#ffffff"/>
      <circle cx="16" cy="38" r="4" fill="#ffffff"/>
    </g>
    <text x="162" y="625" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">compose</text>
    <text x="310" y="582" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="310" dy="0">computes variables,</tspan>
      <tspan x="310" dy="34">including ansible_host</tspan>
    </text>

    
    <g transform="translate(138, 680)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6,8 44,8 30,26 30,42 20,38 20,26"/>
    </g>
    <text x="162" y="765" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">filters</text>
    <text x="310" y="710" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="310" dy="0">makes the server return fewer</tspan>
      <tspan x="310" dy="34">items, which keeps large</tspan>
      <tspan x="310" dy="34">queries fast</tspan>
    </text>

    
    <g transform="translate(138, 860)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="25" cy="12" rx="19" ry="7"/>
      <path d="M6 12 v12 c0 4 8 7 19 7 s19 -3 19 -7 v-12"/>
      <path d="M6 24 v12 c0 4 8 7 19 7 s19 -3 19 -7 v-12"/>
    </g>
    <rect x="92" y="940" width="140" height="42" rx="6" fill="#db8129"/>
    <text x="162" y="970" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff">cache</text>
    <text x="310" y="855" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="310" dy="0">keeps API responses on disk so</tspan>
      <tspan x="310" dy="34">repeated commands do not call</tspan>
      <tspan x="310" dy="34">the API each time; turn on with</tspan>
      <tspan x="310" dy="34" font-family="monospace" fill="#a45300">cache: true,</tspan>
      <tspan x="310" dy="34" font-family="monospace" fill="#a45300">cache_plugin: jsonfile,</tspan>
      <tspan x="310" dy="34" font-family="monospace" fill="#a45300">cache_timeout: 300</tspan>
    </text>
  </g>

  
  <g id="plugins-by-purpose">
    
    <rect x="820" y="195" width="740" height="900" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <rect x="820" y="195" width="740" height="55" rx="10" fill="#207448"/>
    <rect x="820" y="235" width="740" height="15" fill="#207448"/>
    <text x="845" y="234" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Plugins by purpose</text>

    
    <rect x="836" y="262" width="708" height="152" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(856, 313)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 36 A10 10 0 0 1 12 18 A14 14 0 0 1 36 14 A12 12 0 0 1 44 26 A9 9 0 0 1 40 36 Z"/>
    </g>
    <text x="930" y="296" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">cloud providers: </tspan>
      <tspan x="930" dy="32" font-family="monospace" font-size="24">google.cloud.gcp_compute,</tspan>
      <tspan x="930" dy="32" font-family="monospace" font-size="24">amazon.aws.aws_ec2, azure_rm,</tspan>
      <tspan x="930" dy="32" font-family="monospace" font-size="24">VMware, OpenStack, Foreman</tspan>
    </text>

    
    <rect x="836" y="426" width="708" height="138" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(856, 468)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25 6 L45 17 L45 39 L25 50 L5 39 L5 17 Z"/>
      <line x1="25" y1="6" x2="25" y2="50"/>
      <line x1="5" y1="17" x2="45" y2="39"/>
      <line x1="45" y1="17" x2="5" y2="39"/>
    </g>
    <text x="930" y="462" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">container platforms: </tspan>
      <tspan font-family="monospace" font-size="24">kubernetes.core.k8s</tspan>
      <tspan x="930" dy="34">for pods and nodes,</tspan>
      <tspan x="930" dy="34" font-family="monospace" font-size="24">community.docker.docker_containers</tspan>
    </text>

    
    <rect x="836" y="576" width="708" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(856, 638)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="14" r="6"/>
      <circle cx="37" cy="14" r="6"/>
      <circle cx="25" cy="38" r="7"/>
      <path d="M13 20 L25 31 L37 20"/>
    </g>
    <text x="930" y="610" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">derive from data you already have: </tspan>
      <tspan x="930" dy="34" font-family="monospace" font-size="24">ansible.builtin.constructed</tspan>
      <tspan font-size="24"> (needs no cloud</tspan>
      <tspan x="930" dy="34" font-size="24">account; derives groups and variables from</tspan>
      <tspan x="930" dy="34" font-size="24">the variables of existing hosts)</tspan>
    </text>

    
    <rect x="836" y="768" width="708" height="166" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(856, 824)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="38" height="14" rx="3"/>
      <rect x="6" y="28" width="38" height="14" rx="3"/>
      <circle cx="13" cy="15" r="2.5" fill="#207448"/>
      <circle cx="13" cy="35" r="2.5" fill="#207448"/>
      <line x1="22" y1="15" x2="36" y2="15"/>
      <line x1="22" y1="35" x2="36" y2="35"/>
    </g>
    <text x="930" y="804" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">source of truth: </tspan>
      <tspan font-family="monospace" font-size="24">netbox.netbox.nb_inventory</tspan>
      <tspan x="930" dy="34">reads sites, racks, roles, tags and custom</tspan>
      <tspan x="930" dy="34">fields; </tspan>
      <tspan font-family="monospace" font-size="24">cloud.terraform.terraform_state</tspan>
    </text>

    
    <rect x="836" y="946" width="708" height="136" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(856, 988)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6 L30 6 L42 18 L42 46 L10 46 Z"/>
      <path d="M30 6 L30 18 L42 18"/>
      <line x1="16" y1="26" x2="34" y2="26"/>
      <line x1="16" y1="34" x2="28" y2="34"/>
    </g>
    <text x="930" y="984" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">built-in formats: </tspan>
      <tspan x="930" dy="34" font-family="monospace" font-size="24">ansible.builtin.yaml, ini, script,</tspan>
      <tspan x="930" dy="34" font-family="monospace" font-size="24">host_list, auto</tspan>
    </text>
  </g>

  
  <rect x="40" y="1115" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="800" y="1153" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Return to the table whenever a config file needs one of these five jobs</text>
</svg>