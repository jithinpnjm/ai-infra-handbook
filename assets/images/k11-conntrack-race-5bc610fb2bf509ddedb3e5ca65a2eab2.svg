<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>How parallel A and AAAA queries race in conntrack and cause a 5-second stall</title>
  <desc>Infographic illustrating the race condition between parallel A and AAAA DNS queries in Linux netfilter conntrack leading to packet drop and a 5-second timeout, along with mitigations.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#889890" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">How parallel A and AAAA queries race in conntrack</text>
  <text x="800" y="105" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">and cause a 5-second stall</text>

  

  
  <rect x="40" y="140" width="320" height="580" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <rect x="65" y="160" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 73 160 L 73 196 M 83 160 L 83 196 M 93 160 L 93 196" stroke="#207448" stroke-width="2" />
  <text x="115" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">pod</text>

  
  <rect x="60" y="215" width="280" height="235" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="250" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">glibc resolver</text>

  
  <rect x="75" y="270" width="250" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="200" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">one UDP socket</text>

  
  <text x="200" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">same source IP</text>
  <text x="200" y="415" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">and port</text>

  
  <rect x="60" y="470" width="280" height="230" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="505" r="22" fill="#207448" />
  <text x="95" y="513" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <circle cx="155" cy="505" r="22" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="155,492 155,505 167,505" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="200" y="565" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">waits for default</text>
  <text x="200" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">5 s timeout,</text>
  <text x="200" y="645" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">then retries</text>


  
  <rect x="440" y="140" width="340" height="580" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="475" cy="180" r="22" fill="#207448" />
  <text x="475" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <path d="M 520 165 L 545 165 L 555 180 L 545 195 L 520 195 L 510 180 Z" fill="none" stroke="#207448" stroke-width="3" />
  <text x="565" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">conntrack</text>

  
  <rect x="465" y="230" width="135" height="260" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="620" y="230" width="135" height="260" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
  <text x="532" y="270" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">slot 1</text>
  <text x="687" y="270" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">slot 2</text>

  <text x="610" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">two side-by-side</text>
  <text x="610" y="575" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">insertion slots</text>


  
  <rect x="860" y="140" width="340" height="580" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="895" cy="180" r="22" fill="#207448" />
  <text x="895" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <circle cx="945" cy="180" r="16" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 945 158 L 945 202 M 923 180 L 967 180" stroke="#207448" stroke-width="3" />
  <text x="975" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">kube-proxy DNAT</text>

  
  <rect x="880" y="230" width="300" height="200" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1030" y="300" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">CoreDNS pod</text>
  <text x="1030" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">chosen by KUBE-SVC</text>

  <text x="1030" y="500" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the two packets may go to</text>
  <text x="1030" y="535" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">different CoreDNS pods</text>


  
  <rect x="1270" y="140" width="290" height="580" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <circle cx="1305" cy="180" r="22" fill="#db8129" />
  <text x="1305" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1340" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">race collision</text>

  
  <rect x="1290" y="235" width="250" height="58" rx="8" fill="#db8129" />
  <text x="1415" y="273" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff">insert_failed</text>

  
  <line x1="1365" y1="330" x2="1465" y2="430" stroke="#db8129" stroke-width="12" stroke-linecap="round" />
  <line x1="1465" y1="330" x2="1365" y2="430" stroke="#db8129" stroke-width="12" stroke-linecap="round" />

  <text x="1415" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">the packet is</text>
  <text x="1415" y="530" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">silently dropped</text>


  

  
  <path d="M 325 295 L 465 295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" fill="none" />
  <path d="M 600 295 L 880 295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" fill="none" />
  
  <rect x="330" y="260" width="105" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="382" y="288" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">A query</text>

  
  <path d="M 325 365 L 620 365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" fill="none" />
  <path d="M 755 365 L 1270 365" stroke="#db8129" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-orange)" fill="none" />
  
  <rect x="330" y="340" width="145" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="402" y="368" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">AAAA query</text>

  
  
  <path d="M 1415 560 L 1415 680 L 340 680" stroke="#889890" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-return)" fill="none" />


  
  <rect x="40" y="755" width="1520" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="775" width="460" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="95" y="795" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="113" cy="813" r="6" fill="#207448" />
  <text x="145" y="825" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">NodeLocal DNSCache</text>
  <text x="300" y="890" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">removes the DNAT with a</text>
  <text x="300" y="930" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">NOTRACK note</text>

  
  <rect x="570" y="775" width="460" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 595 813 L 635 813 M 620 798 L 635 813 L 620 828" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="645" y="825" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">single-request-reopen</text>
  <text x="800" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">separates the two queries</text>

  
  <rect x="1070" y="775" width="460" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="1100" cy="813" r="8" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="1135" cy="813" r="8" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1108" y1="813" x2="1127" y2="813" stroke="#207448" stroke-width="3" />
  <text x="1155" y="825" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">TCP to DNS</text>
  <text x="1300" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">avoids the UDP path</text>


  
  <rect x="40" y="1030" width="1520" height="100" rx="12" fill="#207448" />
  <text x="800" y="1090" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">two parallel queries on one socket can collide in the kernel, and the lost packet costs a timeout.</text>
</svg>