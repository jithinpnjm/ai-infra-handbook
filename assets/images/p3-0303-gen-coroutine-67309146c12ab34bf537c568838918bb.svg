<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Generator control: prime, send, yield from, close</title>
  <desc>Technical infographic illustrating Python classic coroutine generator control flow, priming, sending values, throwing exceptions, closing, return values, yield from delegation, and usage guidelines.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Generator control: prime, send, yield from, close</text>

  
  <rect x="40" y="95" width="830" height="685" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="70" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="70" dy="0">A vertical timeline for a classic coroutine</tspan>
    <tspan x="70" dy="28" font-family="ui-monospace, monospace" font-weight="normal" fill="#207448">'def gen(): for i in range(10):</tspan>
    <tspan x="420" dy="0" font-family="ui-monospace, monospace" font-weight="normal" fill="#207448">X = yield i' or averager_coro().</tspan>
  </text>

  
  <line x1="85" y1="250" x2="85" y2="284" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="85" y1="344" x2="85" y2="378" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="85" y1="454" x2="85" y2="488" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="85" y1="548" x2="85" y2="582" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="85" y1="648" x2="85" y2="674" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <circle cx="85" cy="226" r="24" fill="#207448"/>
  <text x="85" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <rect x="125" y="194" width="725" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="160" cy="226" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 160 206 L 160 212 M 160 240 L 160 246 M 140 226 L 146 226 M 174 226 L 180 226" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="195" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="195" dy="0" font-family="ui-monospace, monospace" fill="#207448">G = gen()</tspan> creates the generator;
    <tspan x="195" dy="28">the body does not run</tspan>
  </text>

  
  <circle cx="85" cy="320" r="24" fill="#db8129"/>
  <text x="85" y="329" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <rect x="125" y="288" width="725" height="64" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  
  <circle cx="160" cy="320" r="16" fill="none" stroke="#db8129" stroke-width="3"/>
  <polygon points="156,311 168,320 156,329" fill="#db8129"/>
  <text x="195" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="195" dy="0">prime it: <tspan font-family="ui-monospace, monospace" font-weight="normal" fill="#db8129">next(G)</tspan> or <tspan font-family="ui-monospace, monospace" font-weight="normal" fill="#db8129">G.send(None)</tspan></tspan>
    <tspan x="195" dy="28" font-weight="normal">runs to the first yield</tspan>
  </text>

  
  <circle cx="85" cy="424" r="24" fill="#207448"/>
  <text x="85" y="433" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <rect x="125" y="382" width="725" height="84" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="145" y="412" width="30" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 152 424 L 168 424 M 164 419 L 169 424 L 164 429" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="195" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="195" dy="0"><tspan font-family="ui-monospace, monospace" fill="#207448">G.send(77)</tspan> makes the paused yield return 77</tspan>
    <tspan x="195" dy="28">and runs to the next yield; a plain <tspan font-family="ui-monospace, monospace" fill="#207448">next(G)</tspan></tspan>
    <tspan x="195" dy="28">sends None</tspan>
  </text>

  
  <circle cx="85" cy="524" r="24" fill="#207448"/>
  <text x="85" y="533" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <rect x="125" y="492" width="725" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <polygon points="160,509 174,535 146,535" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="160" y1="518" x2="160" y2="526" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="160" cy="531" r="1.5" fill="#207448"/>
  <text x="195" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="195" dy="0"><tspan font-family="ui-monospace, monospace" fill="#207448">G.throw(exc)</tspan> raises inside</tspan>
    <tspan x="195" dy="28">the generator</tspan>
  </text>

  
  <circle cx="85" cy="624" r="24" fill="#207448"/>
  <text x="85" y="633" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  <rect x="125" y="586" width="725" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 148 612 L 172 612 C 172 628 160 637 160 637 C 160 637 148 628 148 612 Z" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="155" y1="620" x2="165" y2="630" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="165" y1="620" x2="155" y2="630" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="195" y="614" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="195" dy="0"><tspan font-family="ui-monospace, monospace" fill="#207448">G.close()</tspan> raises GeneratorExit inside it,</tspan>
    <tspan x="195" dy="28">so with blocks and try/finally clean up</tspan>
  </text>

  
  <circle cx="85" cy="724" r="24" fill="#207448"/>
  <text x="85" y="733" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  <rect x="125" y="678" width="725" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <line x1="150" y1="708" x2="150" y2="742" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <polygon points="150,710 172,720 150,730" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <text x="195" y="704" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="195" dy="0">function returns: StopIteration; the return</tspan>
    <tspan x="195" dy="28">value rides on</tspan>
    <tspan x="195" dy="28" font-family="ui-monospace, monospace" fill="#207448">StopIteration.value</tspan>
  </text>

  
  <rect x="890" y="95" width="670" height="685" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1225" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">yield from</text>

  
  <rect x="910" y="165" width="630" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <rect x="1465" y="180" width="26" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="1477" y="192" width="26" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="930" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="930" dy="0">hands iteration to a sub-iterable:</tspan>
    <tspan x="930" dy="28" font-family="ui-monospace, monospace" fill="#207448">def both(N): yield from range(N);</tspan>
    <tspan x="930" dy="28" font-family="ui-monospace, monospace" fill="#207448">yield from map(lambda x: x ** 2,</tspan>
    <tspan x="930" dy="28" font-family="ui-monospace, monospace" fill="#207448">range(N))</tspan>
  </text>

  
  <rect x="910" y="310" width="630" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <rect x="1462" y="342" width="24" height="14" rx="7" fill="none" stroke="#207448" stroke-width="3" transform="rotate(-30 1474 349)"/>
  <rect x="1476" y="342" width="24" height="14" rx="7" fill="none" stroke="#207448" stroke-width="3" transform="rotate(-30 1488 349)"/>
  <text x="930" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="930" dy="0">chains a to b to c pass items</tspan>
    <tspan x="930" dy="28">through each level</tspan>
  </text>

  
  <rect x="910" y="410" width="630" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <circle cx="1485" cy="432" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="1485" y1="437" x2="1472" y2="452" stroke="#207448" stroke-width="2.5"/>
  <line x1="1485" y1="437" x2="1498" y2="452" stroke="#207448" stroke-width="2.5"/>
  <circle cx="1472" cy="454" r="4" fill="none" stroke="#207448" stroke-width="2.5"/>
  <circle cx="1498" cy="454" r="4" fill="none" stroke="#207448" stroke-width="2.5"/>
  <text x="930" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="930" dy="0"><tspan font-family="ui-monospace, monospace" fill="#207448">tree(cls, level)</tspan> walks BaseException</tspan>
    <tspan x="930" dy="28">subclasses with depth</tspan>
  </text>

  
  <rect x="910" y="510" width="630" height="255" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <path d="M 1465 532 L 1500 532 M 1494 526 L 1500 532 L 1494 538" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1500 548 L 1465 548 M 1471 542 L 1465 548 L 1471 554" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="930" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="930" dy="0">forwards send() and throw() into</tspan>
    <tspan x="930" dy="28">the sub-generator, and</tspan>
    <tspan x="930" dy="28" font-family="ui-monospace, monospace" fill="#207448">result = yield from averager_coro()</tspan>
    <tspan x="930" dy="28">captures the <tspan font-family="ui-monospace, monospace" fill="#207448">Result(count, average)</tspan></tspan>
    <tspan x="930" dy="28">return value</tspan>
  </text>

  
  
  <rect x="40" y="805" width="740" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <path d="M 66 845 L 56 860 L 66 875 M 80 845 L 90 860 L 80 875" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="848" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="110" dy="0">type is</tspan>
    <tspan x="110" dy="28" font-family="ui-monospace, monospace" fill="#207448">Generator[YieldType, SendType, ReturnType]</tspan>
  </text>

  
  <rect x="820" y="805" width="740" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <circle cx="856" cy="860" r="16" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="845" y1="849" x2="867" y2="871" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="890" y="838" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">a StopIteration raised inside a generator</tspan>
    <tspan x="890" dy="28">becomes RuntimeError (PEP 479),</tspan>
    <tspan x="890" dy="28">use return to stop early</tspan>
  </text>

  
  <rect x="40" y="930" width="740" height="130" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <rect x="60" y="985" width="24" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 65 985 L 65 977 C 65 972 79 972 79 977 L 79 985" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="110" y="985" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="110" dy="0">consume the generator fully or close it</tspan>
    <tspan x="110" dy="28">yourself when it holds a resource</tspan>
  </text>

  
  <rect x="820" y="930" width="740" height="130" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <path d="M 850 978 C 843 988 843 1002 850 1012 M 864 978 C 871 988 871 1002 864 1012" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="890" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">a generator expression drops its parentheses</tspan>
    <tspan x="890" dy="28">when it is the only argument:</tspan>
    <tspan x="890" dy="28" font-family="ui-monospace, monospace" fill="#207448">sum(x ** 2 for x in range(3));</tspan>
    <tspan x="890" dy="28">keep them when more arguments follow</tspan>
  </text>

  
  <rect x="40" y="1085" width="1520" height="75" rx="10" fill="#207448"/>
  <text x="800" y="1132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Modern async I/O uses native async def and await instead (chapter 3.6)</text>
</svg>