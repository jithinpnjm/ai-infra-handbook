<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Deleting an object: ownerReferences versus finalizers</title>
  <desc>Visual explanation comparing Kubernetes ownerReferences garbage collection and finalizers pre-deletion hooks.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Deleting an object: ownerReferences versus finalizers</text>

  
  <rect x="50" y="110" width="725" height="1030" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="412" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">ownerReferences (garbage collection)</text>

  
  <rect x="85" y="205" width="380" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(108, 224)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="48" height="42" rx="4" />
    <line x1="0" y1="12" x2="48" y2="12" />
    <circle cx="8" cy="6" r="1.5" fill="#207448" />
    <circle cx="16" cy="6" r="1.5" fill="#207448" />
    <circle cx="24" cy="6" r="1.5" fill="#207448" />
  </g>
  <text x="180" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Deployment</text>

  
  <line x1="275" y1="365" x2="275" y2="299" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="85" y="365" width="380" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(108, 384)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="0" width="36" height="28" rx="4" />
    <path d="M 6 8 L 4 8 A 4 4 0 0 0 0 12 L 0 36 A 4 4 0 0 0 4 40 L 32 40 A 4 4 0 0 0 36 36 L 36 34" />
    <line x1="10" y1="10" x2="46" y2="10" />
  </g>
  <text x="180" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">ReplicaSet</text>

  
  <line x1="275" y1="525" x2="275" y2="459" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="85" y="525" width="380" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(108, 544)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="40" height="40" rx="8" />
    <circle cx="16" cy="16" r="4" fill="#207448" />
    <circle cx="32" cy="16" r="4" fill="#207448" />
    <circle cx="24" cy="30" r="4" fill="#207448" />
  </g>
  <text x="180" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod</text>

  
  <path d="M 295 330 L 485 330 L 485 410 L 500 410 L 485 410 L 485 490 L 295 490" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
  <rect x="500" y="385" width="240" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="620" y="419" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">ownerReference</text>

  
  <rect x="85" y="645" width="655" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="412" y="694" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Delete the owner and the garbage</text>
  <text x="412" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">collector deletes its dependents</text>

  
  
  <rect x="85" y="795" width="205" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(164, 825)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="0" width="34" height="34" rx="4" stroke-dasharray="3 3" />
    <rect x="0" y="14" width="34" height="34" rx="4" fill="#ffffff" />
    <polyline points="8,31 15,38 27,24" />
  </g>
  <text x="187" y="935" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Foreground</text>

  
  <rect x="310" y="795" width="205" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(389, 825)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="10" />
    <path d="M 24 4 L 24 10 M 24 38 L 24 44 M 4 24 L 10 24 M 38 24 L 44 24 M 10 10 L 14 14 M 34 34 L 38 38 M 10 38 L 14 34 M 34 14 L 38 10" />
  </g>
  <text x="412" y="935" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Background</text>

  
  <rect x="535" y="795" width="205" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(614, 825)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="12" width="16" height="24" rx="6" />
    <rect x="30" y="12" width="16" height="24" rx="6" />
    <line x1="18" y1="20" x2="22" y2="16" />
    <line x1="26" y1="32" x2="30" y2="28" />
  </g>
  <text x="637" y="935" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Orphan</text>


  
  <rect x="825" y="110" width="725" height="1030" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1187" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">finalizers (pre-deletion hooks)</text>

  
  <rect x="855" y="205" width="665" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="895" cy="255" r="24" fill="#207448" />
  <text x="895" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="945" y="264" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="25" font-weight="bold" fill="#303a36">kubectl delete pvc data</text>
  <g transform="translate(1455, 233)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="44" height="38" rx="4" />
    <polyline points="8,12 16,19 8,26" />
    <line x1="22" y1="26" x2="34" y2="26" />
  </g>

  
  <rect x="855" y="325" width="665" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="895" cy="397" r="24" fill="#207448" />
  <text x="895" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="945" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">finalizers list not empty, for example</text>
  <text x="945" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan font-family="'SF Mono', Consolas, Menlo, monospace">kubernetes.io/pvc-protection</tspan>, so the</text>
  <text x="945" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">API server does not delete it</text>
  <g transform="translate(1455, 375)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 2 L 40 8 L 40 22 C 40 34 22 42 22 42 C 22 42 4 34 4 22 L 4 8 Z" />
    <polyline points="14,21 20,27 30,16" />
  </g>

  
  <rect x="855" y="490" width="665" height="125" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <circle cx="895" cy="552" r="24" fill="#db8129" />
  <text x="895" y="561" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="945" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">sets <tspan font-family="'SF Mono', Consolas, Menlo, monospace" font-weight="bold">metadata.deletionTimestamp</tspan>,</text>
  <text x="945" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">object is Terminating</text>
  <g transform="translate(1455, 530)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="20" />
    <polyline points="22,10 22,22 32,22" />
  </g>

  
  <rect x="855" y="635" width="665" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="895" cy="707" r="24" fill="#207448" />
  <text x="895" y="716" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <text x="945" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the responsible controller cleans up or</text>
  <text x="945" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">waits for Pods that mount the PVC</text>
  <text x="945" y="744" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">to exit</text>
  <g transform="translate(1455, 685)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="9" />
    <path d="M 22 4 L 22 9 M 22 35 L 22 40 M 4 22 L 9 22 M 35 22 L 40 22 M 9 9 L 13 13 M 31 31 L 35 35 M 9 35 L 13 31 M 31 13 L 35 9" />
  </g>

  
  <rect x="855" y="800" width="665" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="895" cy="862" r="24" fill="#207448" />
  <text x="895" y="871" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  <text x="945" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">controller removes its string from</text>
  <text x="945" y="888" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="25" font-weight="bold" fill="#207448">metadata.finalizers</text>
  <g transform="translate(1455, 840)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="36" height="38" rx="4" />
    <line x1="12" y1="14" x2="28" y2="14" />
    <line x1="12" y1="24" x2="28" y2="24" />
    <line x1="12" y1="32" x2="22" y2="32" />
  </g>

  
  <rect x="855" y="945" width="665" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="895" cy="1007" r="24" fill="#207448" />
  <text x="895" y="1016" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  <text x="945" y="996" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">list empty, API server removes the</text>
  <text x="945" y="1032" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">object from <tspan font-family="'SF Mono', Consolas, Menlo, monospace" font-weight="bold">etcd</tspan></text>
  <g transform="translate(1455, 985)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="22" cy="10" rx="18" ry="7" />
    <path d="M 4 10 L 4 34 C 4 38 12 42 22 42 C 32 42 40 38 40 34 L 40 10" />
    <path d="M 4 22 C 4 26 12 30 22 30 C 32 30 40 26 40 22" />
  </g>
</svg>