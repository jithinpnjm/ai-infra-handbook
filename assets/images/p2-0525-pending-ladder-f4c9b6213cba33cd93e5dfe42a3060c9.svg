<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Six checks for a Pending pod, in order</title>
  <desc>An infographic showing the six ordered diagnostic checks for a Kubernetes pod stuck in Pending state.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Six checks for a Pending pod, in order</text>

  
  <line x1="95" y1="250" x2="95" y2="280" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="95" y1="420" x2="95" y2="450" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="95" y1="590" x2="95" y2="620" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="95" y1="760" x2="95" y2="790" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="95" y1="930" x2="95" y2="960" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="50" y="110" width="940" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="180" r="24" fill="#207448" />
  <text x="95" y="180" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <rect x="148" y="156" width="54" height="48" rx="6" stroke="#207448" stroke-width="3.5" fill="none" />
  <line x1="148" y1="170" x2="202" y2="170" stroke="#207448" stroke-width="2.5" />
  <path d="M 158 184 L 166 190 L 158 196" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="172" y1="196" x2="186" y2="196" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <rect x="230" y="132" width="245" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="352" y="162" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">describe pod:</text>
  <text x="230" y="214" font-family="sans-serif" font-size="25" fill="#303a36">read the <tspan font-family="monospace" font-weight="bold" fill="#207448">FailedScheduling</tspan> message</text>

  
  <rect x="50" y="280" width="940" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="350" r="24" fill="#207448" />
  <text x="95" y="350" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <rect x="154" y="329" width="42" height="42" rx="5" stroke="#207448" stroke-width="3.5" fill="none" />
  <rect x="164" y="339" width="22" height="22" rx="2" stroke="#207448" stroke-width="2.5" fill="none" />
  <line x1="162" y1="322" x2="162" y2="329" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="175" y1="322" x2="175" y2="329" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="188" y1="322" x2="188" y2="329" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="162" y1="371" x2="162" y2="378" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="175" y1="371" x2="175" y2="378" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="188" y1="371" x2="188" y2="378" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <rect x="230" y="298" width="180" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="320" y="327" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Resource:</text>
  <text x="425" y="327" font-family="sans-serif" font-size="24" fill="#303a36">Insufficient <tspan font-family="monospace" font-weight="bold" fill="#207448">nvidia.com/gpu</tspan>,</text>
  <text x="230" y="364" font-family="sans-serif" font-size="24" fill="#303a36">check allocated, fragmentation, taints,</text>
  <text x="230" y="399" font-family="sans-serif" font-size="24" fill="#303a36">device plugin, Kueue workload</text>

  
  <rect x="1030" y="240" width="520" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1055" y="258" width="220" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <rect x="1066" y="267" width="36" height="36" rx="4" fill="#207448" />
  <rect x="1108" y="267" width="36" height="36" rx="4" fill="#207448" />
  <rect x="1150" y="267" width="36" height="36" rx="4" fill="#207448" />
  <rect x="1192" y="267" width="36" height="36" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1305" y="258" width="220" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <rect x="1316" y="267" width="36" height="36" rx="4" fill="#207448" />
  <rect x="1358" y="267" width="36" height="36" rx="4" fill="#207448" />
  <rect x="1400" y="267" width="36" height="36" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="1442" y="267" width="36" height="36" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <text x="1055" y="354" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Free GPUs exist, but in pieces</text>
  <text x="1055" y="388" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">too small for this pod</text>

  
  <rect x="50" y="450" width="940" height="140" rx="14" fill="#fdfaf6" stroke="#db8129" stroke-width="3.5" />
  
  <circle cx="95" cy="520" r="24" fill="#207448" />
  <text x="95" y="520" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <circle cx="162" cy="508" r="7" stroke="#207448" stroke-width="3" fill="none" />
  <circle cx="188" cy="508" r="7" stroke="#207448" stroke-width="3" fill="none" />
  <circle cx="175" cy="534" r="7" stroke="#207448" stroke-width="3" fill="none" />
  <line x1="169" y1="508" x2="181" y2="508" stroke="#207448" stroke-width="2.5" />
  <line x1="166" y1="514" x2="172" y2="528" stroke="#207448" stroke-width="2.5" />
  <line x1="184" y1="514" x2="178" y2="528" stroke="#207448" stroke-width="2.5" />
  
  <rect x="230" y="468" width="195" height="40" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="327" y="497" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">Placement:</text>
  <text x="440" y="497" font-family="sans-serif" font-size="24" fill="#303a36">relax affinity, selectors,</text>
  <text x="230" y="534" font-family="sans-serif" font-size="24" fill="#303a36">taints or topology spread;</text>
  <text x="230" y="569" font-family="sans-serif" font-size="24" fill="#303a36">label typo looks like capacity</text>

  
  <line x1="990" y1="520" x2="1030" y2="520" stroke="#db8129" stroke-width="2" stroke-dasharray="4 4" />
  <rect x="1030" y="465" width="520" height="110" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <path d="M 1075 490 L 1095 526 L 1055 526 Z" stroke="#db8129" stroke-width="2.5" stroke-linejoin="round" fill="none" />
  <line x1="1075" y1="503" x2="1075" y2="513" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="1075" cy="520" r="1.5" fill="#db8129" />
  
  <text x="1110" y="512" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">A label typo looks exactly</text>
  <text x="1110" y="546" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">like a capacity problem</text>

  
  <rect x="50" y="620" width="940" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="690" r="24" fill="#207448" />
  <text x="95" y="690" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <ellipse cx="175" cy="676" rx="22" ry="9" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 153 676 v 28 c 0 5 10 9 22 9 s 22 -4 22 -9 v -28" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 153 690 c 0 5 10 9 22 9 s 22 -4 22 -9" stroke="#207448" stroke-width="2.5" fill="none" />
  
  <rect x="230" y="645" width="145" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="302" y="674" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Volume:</text>
  <text x="390" y="674" font-family="sans-serif" font-size="24" fill="#303a36">unbound <tspan font-family="monospace" font-weight="bold" fill="#207448">PVC</tspan>,</text>
  <text x="230" y="720" font-family="sans-serif" font-size="24" fill="#303a36">zone conflict, attach limits</text>

  
  <rect x="50" y="790" width="940" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="860" r="24" fill="#207448" />
  <text x="95" y="860" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <path d="M 152 872 A 25 25 0 1 1 198 872" stroke="#207448" stroke-width="3.5" fill="none" />
  <line x1="175" y1="870" x2="191" y2="854" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="175" cy="870" r="4" fill="#207448" />
  
  <rect x="230" y="815" width="135" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="297" y="844" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Quota:</text>
  <text x="230" y="890" font-family="sans-serif" font-size="24" fill="#303a36">exceeded quota means rejected, not Pending</text>

  
  <rect x="50" y="960" width="940" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="1030" r="24" fill="#207448" />
  <text x="95" y="1030" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  
  <circle cx="175" cy="1030" r="14" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 175 1010 v -4 M 175 1054 v -4 M 155 1030 h -4 M 199 1030 h -4 M 161 1016 l -3 -3 M 192 1047 l -3 -3 M 161 1044 l -3 3 M 192 1013 l -3 3" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="175" y1="1030" x2="175" y2="1022" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <line x1="175" y1="1030" x2="182" y2="1030" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  
  <rect x="230" y="985" width="195" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="327" y="1014" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Scheduler:</text>
  <text x="230" y="1060" font-family="sans-serif" font-size="24" fill="#303a36">logs, leader lease, API latency</text>

  
  <rect x="50" y="1120" width="1500" height="60" rx="12" fill="#207448" />
  <text x="800" y="1158" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Find the layer that holds the pod before you change labels or limits.</text>
</svg>