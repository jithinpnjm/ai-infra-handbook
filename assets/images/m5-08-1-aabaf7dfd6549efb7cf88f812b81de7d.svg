  <g id="step1">
    <line x1="90" y1="210" x2="246" y2="210" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
    <circle cx="50" cy="210" r="22" fill="#db8129" />
    <text x="50" y="218" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">1</text>
    <rect x="180" y="191" width="600" height="36" rx="8" fill="#fff7f0" stroke="#db8129" stroke-width="2"/>
    <text x="480" y="217" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">create Pod (admission, defaults, SA token, quota)</text>
  </g>

  > S (watch: Pod with no nodeName) -->
  <g id="step2">
    <line x1="260" y1="270" x2="416" y2="270" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrow-green)" />
    <circle cx="220" cy="270" r="22" fill="#207448" />
    <text x="220" y="278" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">2</text>
    <rect x="290" y="251" width="370" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="475" y="277" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">watch: Pod with no nodeName</text>
  </g>

  
  <g id="step3">
    <line x1="430" y1="330" x2="274" y2="330" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="470" cy="330" r="22" fill="#207448" />
    <text x="470" y="338" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">3</text>
    <rect x="280" y="311" width="395" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="477" y="337" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">bind Pod → node (spec.nodeName)</text>
  </g>

  > K (watch: Pod bound to my node) -->
  <g id="step4">
    <line x1="260" y1="390" x2="586" y2="390" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrow-green)" />
    <circle cx="220" cy="390" r="22" fill="#207448" />
    <text x="220" y="398" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">4</text>
    <rect x="330" y="371" width="370" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="515" y="397" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">watch: Pod bound to my node</text>
  </g>

  
  <g id="step5">
    <path d="M 600 440 H 650 V 465 H 614" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="560" cy="450" r="22" fill="#207448" />
