<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Timeline overview</title>
  <desc>Kubernetes Pod lifecycle sequence diagram showing interactions between User, API server, Scheduler, Kubelet, containerd, CNI, CSI, Device plugin, and runc.</desc>

  <defs>
