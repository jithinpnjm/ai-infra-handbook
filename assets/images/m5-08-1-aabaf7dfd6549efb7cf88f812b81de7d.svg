    <circle cx="560" cy="630" r="22" fill="#207448" />
    <text x="560" y="638" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">8</text>
    <rect x="650" y="611" width="220" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="760" y="637" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">RunPodSandbox</text>
  </g>

  
  <g id="step9">
    <line x1="770" y1="690" x2="926" y2="690" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="730" cy="690" r="22" fill="#207448" />
    <text x="730" y="698" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">9</text>
    <rect x="800" y="671" width="310" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="955" y="697" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">ADD (netns, IP, routes)</text>
  </g>

  
  <g id="step10">
