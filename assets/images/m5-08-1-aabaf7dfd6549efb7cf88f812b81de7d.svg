    <rect x="665" y="432" width="760" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1045" y="458" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">admit pod (resources, node-fit, kernel params), create pod dirs</text>
  </g>

  
  <g id="step6">
    <line x1="600" y1="510" x2="1266" y2="510" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="560" cy="510" r="22" fill="#207448" />
    <text x="560" y="518" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">6</text>
    <rect x="680" y="491" width="580" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="970" y="517" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">Allocate(GPU devices) → env/mounts/CDI names</text>
  </g>

  
  <g id="step7">
