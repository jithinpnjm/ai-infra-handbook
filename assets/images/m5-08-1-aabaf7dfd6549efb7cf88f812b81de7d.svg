    <circle cx="730" cy="870" r="22" fill="#207448" />
    <text x="730" y="878" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">12</text>
    <rect x="830" y="851" width="530" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1095" y="877" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">create namespaces, cgroups, mounts, exec</text>
  </g>

  
  <g id="step13">
    <line x1="600" y1="930" x2="274" y2="930" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="640" cy="930" r="22" fill="#207448" />
    <text x="640" y="938" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">13</text>
    <rect x="230" y="911" width="760" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="610" y="937" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">status updates (PodScheduled, Initialized, ContainersReady, Ready)</text>
  </g>

  
  <g id="note">
    <rect x="560" y="976" width="930" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1025" y="1007" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">running: probes, log rotation, cgroup accounting, status heartbeats</text>
  </g>

  
  <g id="step14">
    <line x1="90" y1="1060" x2="246" y2="1060" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="50" cy="1060" r="22" fill="#207448" />
    <text x="50" y="1068" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">14</text>
    <rect x="130" y="1041" width="160" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="210" y="1067" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">delete Pod</text>
  </g>

  > K (deletionTimestamp set) -->
  <g id="step15">
    <line x1="260" y1="1120" x2="586" y2="1120" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrow-green)" />
    <circle cx="220" cy="1120" r="22" fill="#207448" />
    <text x="220" y="1128" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">15</text>
    <rect x="300" y="1101" width="410" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="505" y="1127" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">deletionTimestamp set (grace)</text>
  </g>

  
  <g id="step16">
    <line x1="600" y1="1180" x2="1436" y2="1180" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="560" cy="1180" r="22" fill="#207448" />
    <text x="560" y="1188" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">16</text>
    <rect x="790" y="1161" width="460" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1020" y="1187" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">preStop, SIGTERM, wait, SIGKILL</text>
  </g>

  
  <g id="step17">
    <line x1="600" y1="1240" x2="756" y2="1240" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="560" cy="1240" r="22" fill="#207448" />
    <text x="560" y="1248" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">17</text>
    <rect x="640" y="1221" width="490" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="885" y="1247" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">StopContainer, StopPodSandbox → CNI DEL</text>
  </g>

  
  <g id="step18">
    <line x1="600" y1="1300" x2="1096" y2="1300" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="560" cy="1300" r="22" fill="#207448" />
    <text x="560" y="1308" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">18</text>
    <rect x="740" y="1281" width="260" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="870" y="1307" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">unmount volumes</text>
  </g>

  
  <g id="step19">
    <line x1="600" y1="1360" x2="274" y2="1360" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <circle cx="640" cy="1360" r="22" fill="#207448" />
    <text x="640" y="1368" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">19</text>
    <rect x="250" y="1341" width="370" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="435" y="1367" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">remove Pod object (grace 0)</text>
  </g>

