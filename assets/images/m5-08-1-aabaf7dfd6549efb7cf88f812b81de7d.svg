    <text x="75" y="65" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">CNI</text>
    <text x="75" y="87" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">plugin</text>
