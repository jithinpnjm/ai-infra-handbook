<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1375" width="1600" height="1375">
  <title>ethtool by question: which command answers which hardware question</title>
  <desc>Visual reference guide pairing hardware questions with corresponding ethtool commands, expected output fields, notes, and a worked troubleshooting scenario.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1375" fill="#f5f8f5" />

  
  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="38" font-weight="bold" fill="#207448">ethtool by question: which command answers which hardware question</text>

  

  
  <rect x="40" y="110" width="1020" height="135" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="160">Is the link up and</tspan>
    <tspan x="60" y="195">at what speed?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" x="290" y="180">ethtool eth0</text>
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="690" y="148">Link detected, Speed, Duplex,</tspan>
    <tspan x="690" y="180">auto-negotiation, supported and</tspan>
    <tspan x="690" y="212">advertised modes</tspan>
  </text>

  
  <rect x="40" y="253" width="1020" height="80" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="286">Which driver and</tspan>
    <tspan x="60" y="316">firmware?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" x="290" y="301">ethtool -i eth0</text>
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36" x="690" y="301">driver, firmware, bus info</text>

  
  <rect x="40" y="341" width="1020" height="135" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="395">Is the NIC counting</tspan>
    <tspan x="60" y="427">problems?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" x="290" y="411">ethtool -S eth0</text>
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="690" y="380">per-queue stats, rx_missed,</tspan>
    <tspan x="690" y="412">rx_no_buffer, tx_timeouts,</tspan>
    <tspan x="690" y="444">pause frames, ECN marks</tspan>
  </text>

  
  <rect x="40" y="484" width="1020" height="135" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="538">Are the rings</tspan>
    <tspan x="60" y="570">too small?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="290" y="538">ethtool -g eth0;</tspan>
    <tspan x="290" y="570">ethtool -G eth0 rx 4096 tx 4096</tspan>
  </text>
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="715" y="522">ring buffer sizes: the queue</tspan>
    <tspan x="715" y="554">of packet slots shared</tspan>
    <tspan x="715" y="586">between NIC and driver</tspan>
  </text>

  
  <rect x="40" y="627" width="1020" height="80" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448" x="60" y="675">How many queues?</text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="290" y="660">ethtool -l eth0;</tspan>
    <tspan x="290" y="692">ethtool -L eth0 combined 16</tspan>
  </text>
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36" x="715" y="675">channel counts for RSS</text>

  
  <rect x="40" y="715" width="1020" height="115" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448" x="60" y="777">What is offloaded?</text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="290" y="760">ethtool -k eth0;</tspan>
    <tspan x="290" y="792">ethtool -K eth0 gro off</tspan>
  </text>
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="715" y="748">tso gso gro lro rxhash,</tspan>
    <tspan x="715" y="780">checksums, tunnel</tspan>
    <tspan x="715" y="812">segmentation</tspan>
  </text>

  
  <rect x="40" y="838" width="1020" height="80" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="871">Interrupt</tspan>
    <tspan x="60" y="901">coalescing?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="290" y="871">ethtool -c eth0;</tspan>
    <tspan x="290" y="901">ethtool -C eth0 adaptive-rx on</tspan>
  </text>

  
  <rect x="40" y="926" width="1020" height="65" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448" x="60" y="967">Pause frames?</text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" x="290" y="967">ethtool -a eth0</text>

  
  <rect x="40" y="999" width="1020" height="80" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="1032">RSS table and</tspan>
    <tspan x="60" y="1062">flow rules?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="290" y="1032">ethtool -x eth0;</tspan>
    <tspan x="290" y="1062">ethtool -n eth0</tspan>
  </text>

  
  <rect x="40" y="1087" width="1020" height="80" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#db8129" x="60" y="1136">Optics health?</text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" x="290" y="1136">ethtool -m eth0</text>
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#db8129" x="690" y="1136">power, temperature, vendor</text>

  
  <rect x="40" y="1175" width="1020" height="80" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="60" y="1208">FEC and</tspan>
    <tspan x="60" y="1238">timestamping?</tspan>
  </text>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="290" y="1208">ethtool --show-fec eth0;</tspan>
    <tspan x="290" y="1238">ethtool -T eth0</tspan>
  </text>


  
  <rect x="1090" y="110" width="470" height="540" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="1110" y="130" width="430" height="100" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1125" y="168">A server moved to a new rack</tspan>
    <tspan x="1125" y="202">runs at a fraction of the rate:</tspan>
  </text>

  
  <rect x="1110" y="250" width="430" height="105" rx="8" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1125" y="290" font-weight="bold" fill="#207448">step 1</tspan>
    <tspan x="1195" y="290">the speed line shows</tspan>
    <tspan x="1125" y="324">less than the NIC supports;</tspan>
  </text>

  
  <line x1="1325" y1="355" x2="1325" y2="385" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="1110" y="395" width="430" height="235" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1125" y="432" font-weight="bold" fill="#db8129">step 2</tspan>
    <tspan x="1195" y="432" font-family="ui-monospace, monospace" font-weight="bold">ethtool -m</tspan>
    <tspan x="1335" y="432">shows</tspan>
    <tspan x="1125" y="468">low receive power, which</tspan>
    <tspan x="1125" y="502">points to a dirty connector;</tspan>
    <tspan x="1125" y="546" font-weight="bold" fill="#db8129">cleaning it restores</tspan>
    <tspan x="1125" y="580" font-weight="bold" fill="#db8129">the speed</tspan>
  </text>


  
  <rect x="1090" y="665" width="470" height="590" rx="10" fill="#ffffff" stroke="#cde0d2" stroke-width="2" />

  
  <g transform="translate(1120, 695)">
    <rect x="0" y="0" width="34" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="8" y1="12" x2="26" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="21" x2="26" y2="21" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="30" x2="18" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" y="780" font-weight="bold" fill="#207448">Link detected: no</tspan>
    <tspan x="1325" y="780">means a</tspan>
    <tspan x="1120" y="816">cable pulled or switch port down;</tspan>

    <tspan x="1120" y="886">a 100 GbE NIC negotiating</tspan>
    <tspan x="1120" y="922">25 GbE shows the lower</tspan>
    <tspan x="1120" y="958">figure in Speed;</tspan>

    <tspan x="1120" y="1030">a half-duplex or wrong-speed</tspan>
    <tspan x="1120" y="1066">link is a classic cause of</tspan>
    <tspan x="1120" y="1102">mystery throughput loss</tspan>
  </text>


  
  <rect x="40" y="1275" width="1520" height="75" rx="8" fill="#207448" />
  <text x="800" y="1322" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Check ethtool first whenever a link is slower than you expect</text>

</svg>