<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Volcano batch scheduling action pipeline and plugin interaction</title>
  <desc>Three-tier architecture diagram showing Volcano Custom Resources and Queue, the 5-stage scheduling action pipeline, and the plugin layer with direct node binding.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Volcano batch scheduling action pipeline</tspan>
    <tspan x="800" dy="54">and plugin interaction</tspan>
  </text>

  
  
  
  <rect x="40" y="130" width="1520" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="145" width="655" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(85, 165)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="56" rx="6" />
    <line x1="0" y1="18" x2="56" y2="18" />
    <circle cx="12" cy="9" r="3" fill="#207448" stroke="none" />
    <circle cx="22" cy="9" r="3" fill="#207448" stroke="none" />
    <line x1="12" y1="32" x2="44" y2="32" />
    <line x1="12" y1="42" x2="34" y2="42" />
  </g>

  <text x="160" y="185" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">Custom resources</text>
  <text x="160" y="218" font-family="monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">vcjob / PodGroup</text>
  <text x="160" y="248" font-family="monospace, monospace" font-size="24" fill="#303a36">minMember: 4</text>
  <text x="160" y="276" font-family="monospace, monospace" font-size="24" fill="#303a36">minResources: {nvidia.com/gpu: 32}</text>

  
  <line x1="720" y1="217" x2="855" y2="217" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="865" y="145" width="670" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(890, 165)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="6" width="56" height="14" rx="4" />
    <rect x="0" y="24" width="56" height="14" rx="4" />
    <rect x="0" y="42" width="56" height="14" rx="4" />
    <line x1="14" y1="6" x2="14" y2="20" />
    <line x1="28" y1="24" x2="28" y2="38" />
    <line x1="42" y1="42" x2="42" y2="56" />
  </g>

  <text x="965" y="195" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">Volcano Queue</text>
  <text x="965" y="240" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="965" dy="0">configured weight, capability,</tspan>
    <tspan x="965" dy="30">and reclaimable settings</tspan>
  </text>

  
  
  
  <rect x="40" y="325" width="1520" height="365" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="365" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">The Volcano Scheduler</text>

  
  <rect x="60" y="385" width="280" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(172, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <polyline points="20 28 26 34 38 20" />
  </g>
  <text x="200" y="480" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">1. enqueue</text>
  <text x="200" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="200" dy="0">(admits queued jobs</tspan>
    <tspan x="200" dy="30">based on queue</tspan>
    <tspan x="200" dy="30">capability)</tspan>
  </text>

  
  <line x1="340" y1="507" x2="355" y2="507" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="360" y="385" width="280" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(472, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <circle cx="28" cy="28" r="12" />
    <line x1="28" y1="4" x2="28" y2="52" />
    <line x1="4" y1="28" x2="52" y2="28" />
  </g>
  <text x="500" y="480" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">2. allocate</text>
  <text x="500" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="500" dy="0">(evaluates candidate</tspan>
    <tspan x="500" dy="30">nodes for gang</tspan>
    <tspan x="500" dy="30">allocation)</tspan>
  </text>

  
  <line x1="640" y1="507" x2="655" y2="507" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="660" y="385" width="280" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(772, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 16 L 48 34 C 48 46 28 54 28 54 C 28 54 8 46 8 34 L 8 16 Z" />
    <line x1="20" y1="24" x2="36" y2="40" />
    <line x1="36" y1="24" x2="20" y2="40" />
  </g>
  <text x="800" y="480" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">3. preempt</text>
  <text x="800" y="515" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">(evicts lower-</tspan>
    <tspan x="800" dy="28">priority pods within</tspan>
    <tspan x="800" dy="28">the same queue)</tspan>
  </text>

  
  <line x1="940" y1="507" x2="955" y2="507" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="960" y="385" width="280" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1072, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 28 A 18 18 0 0 1 44 18" />
    <polyline points="44 8 46 19 35 21" />
    <path d="M 44 28 A 18 18 0 0 1 12 38" />
    <polyline points="12 48 10 37 21 35" />
  </g>
  <text x="1100" y="480" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">4. reclaim</text>
  <text x="1100" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">(reclaims quota</tspan>
    <tspan x="1100" dy="28">across queues</tspan>
    <tspan x="1100" dy="28">according to</tspan>
    <tspan x="1100" dy="28">dominant resource</tspan>
    <tspan x="1100" dy="28">fairness weights)</tspan>
  </text>

  
  <line x1="1240" y1="507" x2="1255" y2="507" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1260" y="385" width="280" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1372, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="20" height="20" rx="3" />
    <rect x="30" y="6" width="20" height="20" rx="3" />
    <rect x="6" y="30" width="20" height="20" rx="3" />
    <rect x="30" y="30" width="20" height="20" rx="3" stroke-dasharray="4 3" />
  </g>
  <text x="1400" y="480" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">5. backfill</text>
  <text x="1400" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1400" dy="0">(places small tasks</tspan>
    <tspan x="1400" dy="30">onto idle GPU</tspan>
    <tspan x="1400" dy="30">slots)</tspan>
  </text>

  
  <path d="M 1400 630 L 1400 655 L 200 655 L 200 637" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />

  
  <line x1="800" y1="690" x2="800" y2="723" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  
  <rect x="40" y="725" width="1520" height="435" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="765" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">Plugin layer</text>

  
  <rect x="60" y="785" width="350" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(207, 795)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="22" height="20" rx="3" />
    <rect x="28" y="10" width="22" height="20" rx="3" />
    <rect x="17" y="26" width="22" height="20" rx="3" />
  </g>
  <text x="235" y="870" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">gang</text>
  <text x="235" y="910" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="235" dy="0">(checks minMember</tspan>
    <tspan x="235" dy="28">threshold before</tspan>
    <tspan x="235" dy="28">assigning)</tspan>
  </text>

  
  <rect x="436" y="785" width="350" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(583, 795)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="28" y1="8" x2="28" y2="48" />
    <line x1="12" y1="18" x2="44" y2="18" />
    <polygon points="12 18 6 34 18 34" />
    <polygon points="44 18 38 30 50 30" />
    <line x1="16" y1="48" x2="40" y2="48" />
  </g>
  <text x="611" y="870" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">drf</text>
  <text x="611" y="920" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="611" dy="0">(calculates dominant</tspan>
    <tspan x="611" dy="30">resource shares)</tspan>
  </text>

  
  <rect x="812" y="785" width="350" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(959, 795)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="44" height="44" rx="4" />
    <rect x="12" y="24" width="14" height="20" />
    <rect x="30" y="12" width="14" height="32" />
  </g>
  <text x="987" y="870" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">binpack</text>
  <text x="987" y="920" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="987" dy="0">(maximizes node</tspan>
    <tspan x="987" dy="30">utilization)</tspan>
  </text>

  
  <rect x="1188" y="785" width="350" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1335, 795)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="16" height="16" rx="3" />
    <rect x="32" y="8" width="16" height="16" rx="3" />
    <rect x="8" y="32" width="16" height="16" rx="3" />
    <rect x="32" y="32" width="16" height="16" rx="3" />
    <line x1="24" y1="16" x2="32" y2="16" />
    <line x1="24" y1="40" x2="32" y2="40" />
    <line x1="16" y1="24" x2="16" y2="32" />
    <line x1="40" y1="24" x2="40" y2="32" />
  </g>
  <text x="1363" y="865" text-anchor="middle" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1363" dy="0">task-topology /</tspan>
    <tspan x="1363" dy="32">numa-aware</tspan>
  </text>
  <text x="1363" y="935" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1363" dy="0">(optimizes network hops</tspan>
    <tspan x="1363" dy="28">and socket placement)</tspan>
  </text>

  
  <rect x="60" y="1010" width="1480" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(90, 1045)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="4" width="48" height="50" rx="6" />
    <line x1="12" y1="18" x2="36" y2="18" />
    <line x1="12" y1="30" x2="36" y2="30" />
    <line x1="12" y1="42" x2="26" y2="42" />
  </g>

  
  <g transform="translate(1450, 1045)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="4" width="56" height="22" rx="4" />
    <rect x="0" y="32" width="56" height="22" rx="4" />
    <circle cx="12" cy="15" r="3" fill="#207448" stroke="none" />
    <circle cx="12" cy="43" r="3" fill="#207448" stroke="none" />
    <line x1="24" y1="15" x2="44" y2="15" />
    <line x1="24" y1="43" x2="44" y2="43" />
  </g>

  
  <line x1="155" y1="1075" x2="270" y2="1075" stroke="#db8129" stroke-width="5" stroke-dasharray="8 6" />
  <line x1="1330" y1="1075" x2="1435" y2="1075" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  <rect x="280" y="1045" width="1040" height="60" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="2" />
  <text x="800" y="1086" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    pods directly bound to target nodes via <tspan font-family="monospace, monospace" fill="#db8129">schedulerName: volcano</tspan>
  </text>

</svg>