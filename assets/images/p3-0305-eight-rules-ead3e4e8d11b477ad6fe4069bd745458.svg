<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Eight rules for error handling in tools and services</title>
  <desc>Infographic illustrating the eight rules for error handling in tools and services alongside conventional process exit codes.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Eight rules for error handling in tools and services</text>

  

  
  <g id="rule-1">
    <rect x="40" y="95" width="1010" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M60 135 L85 125 L110 135 C110 157 85 174 85 174 C85 174 60 157 60 135 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M74 148 L82 156 L96 142" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="130" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">1 Fail fast on programmer errors and invalid input: </tspan>
      <tspan dy="0">validate config </tspan>
      <tspan x="130" dy="28">and arguments at the boundary, right away, with clear messages</tspan>
    </text>
  </g>

  
  <g id="rule-2">
    <rect x="40" y="219" width="1010" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M62 290 A23 23 0 1 1 100 305" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="94,310 102,305 102,295" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="290" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    
    <text x="130" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">2 Handle expected operational failures where you can do something sensible: </tspan>
      <tspan x="130" dy="28">network timeouts, missing files, 404s, lock contention; retry with backoff, </tspan>
      <tspan x="130" dy="28">skip with a log, fall back, or translate into a domain error</tspan>
    </text>
  </g>

  
  <g id="rule-3">
    <rect x="40" y="371" width="1010" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="62" y="420" width="46" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="85" y1="432" x2="85" y2="400" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="75,410 85,400 95,410" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="130" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">3 Do not catch what you cannot handle: </tspan>
      <tspan dy="0">let unexpected exceptions bubble </tspan>
      <tspan x="130" dy="28">up to one top-level handler that logs the traceback and exits non-zero</tspan>
    </text>
  </g>

  
  <g id="rule-4">
    <rect x="40" y="495" width="1010" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="63" y="542" width="26" height="16" rx="8" fill="none" stroke="#207448" stroke-width="3.5" transform="rotate(-30 76 550)"/>
    <rect x="81" y="550" width="26" height="16" rx="8" fill="none" stroke="#207448" stroke-width="3.5" transform="rotate(-30 94 558)"/>
    
    <text x="130" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">4 Preserve information: </tspan>
      <tspan dy="0">chain exceptions, include host, path or request id, </tspan>
      <tspan x="130" dy="28">log tracebacks once rather than at every level</tspan>
    </text>
  </g>

  
  <g id="rule-5">
    <rect x="40" y="619" width="1010" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M63 662 A22 22 0 0 1 103 648" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="97,640 105,648 97,656" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M107 662 A22 22 0 0 1 67 676" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="73,684 65,676 73,668" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="130" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">5 Make cleanup unconditional and idempotent: </tspan>
      <tspan font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">with </tspan>
      <tspan font-family="system-ui, sans-serif" font-size="24" fill="#303a36">or </tspan>
      <tspan font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">finally</tspan>
    </text>
  </g>

  
  <g id="rule-6">
    <rect x="40" y="715" width="1010" height="142" rx="8" fill="#fffcf7" stroke="#db8129" stroke-width="2.5"/>
    
    <rect x="62" y="764" width="20" height="18" rx="3" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="72" cy="773" r="3" fill="#207448"/>
    <rect x="88" y="764" width="20" height="18" rx="3" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="98" cy="773" r="3" fill="#207448"/>
    <rect x="62" y="788" width="20" height="18" rx="3" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="72" cy="797" r="3" fill="#207448"/>
    <rect x="88" y="788" width="20" height="18" rx="3" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
    <line x1="94" y1="793" x2="102" y2="801" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="793" x2="94" y2="801" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    
    <text x="130" y="748" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#db8129">6 Be explicit about partial failure: </tspan>
      <tspan dy="0">processing 500 hosts, collect results per host, </tspan>
      <tspan x="130" dy="28">report a summary, exit non-zero if any failed; do not abort at the first error, </tspan>
      <tspan x="130" dy="28">do not hide failures</tspan>
    </text>
  </g>

  
  <g id="rule-7">
    <rect x="40" y="867" width="1010" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M63 938 A22 22 0 1 1 100 955" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="93,960 102,955 101,944" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="85,928 85,938 92,938" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="130" y="900" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">7 Limit retries to transient errors and idempotent operations: </tspan>
      <tspan dy="0">exponential </tspan>
      <tspan x="130" dy="28">backoff with jitter and a cap, limit attempts and total time, log each attempt; </tspan>
      <tspan x="130" dy="28">tenacity, backoff or a small helper from chapter 3.1</tspan>
    </text>
  </g>

  
  <g id="rule-8">
    <rect x="40" y="1019" width="1010" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <circle cx="85" cy="1062" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="85" y1="1038" x2="85" y2="1044" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="81" y1="1038" x2="89" y2="1038" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="85,1052 85,1062 94,1062" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="130" y="1054" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">8 Set timeouts everywhere, </tspan>
      <tspan dy="0">on network and subprocess calls, because the default </tspan>
      <tspan x="130" dy="28">is often forever</tspan>
    </text>
  </g>

  

  <g id="right-panel">
    
    <rect x="1090" y="95" width="470" height="1010" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="1301" y="112" width="48" height="38" rx="5" fill="#ffffff" stroke="#207448" stroke-width="3.5"/>
    <line x1="1301" y1="124" x2="1349" y2="124" stroke="#207448" stroke-width="2"/>
    <circle cx="1309" cy="118" r="2" fill="#207448"/>
    <circle cx="1315" cy="118" r="2" fill="#207448"/>
    <polyline points="1308,133 1314,138 1308,143" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1318" y1="143" x2="1328" y2="143" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

    
    <text x="1325" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Conventional exit codes</text>

    
    <rect x="1110" y="215" width="430" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">0 </tspan>
      <tspan font-weight="bold">success</tspan>
    </text>

    
    <rect x="1110" y="320" width="430" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">1 </tspan>
      <tspan font-weight="bold">general error</tspan>
    </text>

    
    <rect x="1110" y="425" width="430" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="463" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">2 </tspan>
      <tspan font-weight="bold">usage or argument error, </tspan>
      <tspan x="1130" dy="34">also used by argparse</tspan>
    </text>

    
    <rect x="1110" y="555" width="430" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="593" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">126 or 127 </tspan>
      <tspan>command not </tspan>
      <tspan x="1130" dy="34">executable or not found</tspan>
    </text>

    
    <rect x="1110" y="685" width="430" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="723" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">128+N </tspan>
      <tspan>killed by signal N: </tspan>
      <tspan x="1130" dy="34" font-family="ui-monospace, monospace">130 is SIGINT, 143 is SIGTERM</tspan>
    </text>

    
    <rect x="1110" y="815" width="430" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="853" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">EX_TEMPFAIL 75 </tspan>
      <tspan x="1130" dy="34">requests a retry</tspan>
    </text>

    
    <rect x="1110" y="945" width="430" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1130" y="987" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">use documented codes when </tspan>
      <tspan x="1130" dy="34">CI, systemd or schedulers </tspan>
      <tspan x="1130" dy="34">must tell them apart</tspan>
    </text>
  </g>

  

  <g id="bottom-bar">
    <rect x="40" y="1120" width="1520" height="60" rx="8" fill="#207448"/>
    <text x="800" y="1158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">The exit code is the only part of a failure that the caller always sees</text>
  </g>
</svg>