<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Building capture filters</title>
  <desc>Visual infographic explaining how to build packet capture filters using primitives, operators, and practical tcpdump examples.</desc>

  <rect width="1600" height="1020" fill="#f5f8f5"/>

  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Building capture filters</text>

  <g id="row-primitives-1">
    <rect x="50" y="115" width="345" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(70, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="44" height="32" rx="6"/>
      <line x1="14" y1="14" x2="34" y2="14" stroke-width="3"/>
      <line x1="14" y1="22" x2="28" y2="22" stroke-width="3"/>
      <circle cx="34" cy="22" r="2" fill="#207448"/>
    </g>
    <rect x="136" y="132" width="100" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="186" y="163" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">tcp</text>
    <text x="136" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">TCP packets</text>

    <rect x="435" y="115" width="345" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(455, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 8 L 38 8 L 44 20 L 38 32 L 4 32 Z"/>
      <line x1="12" y1="20" x2="32" y2="20" stroke-width="3"/>
    </g>
    <rect x="521" y="132" width="100" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="571" y="163" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">udp</text>
    <text x="521" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">UDP packets</text>

    <rect x="820" y="115" width="345" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(840, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="20" r="18"/>
      <line x1="6" y1="20" x2="42" y2="20" stroke-width="3"/>
      <ellipse cx="24" cy="20" rx="8" ry="18" stroke-width="3"/>
    </g>
    <rect x="906" y="132" width="100" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="956" y="163" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">ip</text>
    <text x="906" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">IPv4</text>

    <rect x="1205" y="115" width="345" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1225, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 42 14 L 42 34 L 24 44 L 6 34 L 6 14 Z"/>
      <circle cx="24" cy="24" r="6" stroke-width="3"/>
    </g>
    <rect x="1291" y="132" width="100" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1341" y="163" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">ip6</text>
    <text x="1291" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">IPv6</text>
  </g>

  <g id="row-primitives-2">
    <rect x="50" y="280" width="473" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(70, 310)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="40" height="36" rx="6"/>
      <rect x="14" y="16" width="20" height="14" rx="2" stroke-width="3"/>
      <line x1="18" y1="10" x2="18" y2="16" stroke-width="3"/>
      <line x1="24" y1="10" x2="24" y2="16" stroke-width="3"/>
      <line x1="30" y1="10" x2="30" y2="16" stroke-width="3"/>
    </g>
    <rect x="134" y="295" width="240" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="254" y="326" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">port &lt;port&gt;</text>
    <text x="134" y="372" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="134" dy="0">TCP and/or UDP</tspan>
      <tspan x="134" dy="28">to or from the port</tspan>
    </text>

    <rect x="563" y="280" width="474" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(583, 310)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="36" height="28" rx="4"/>
      <line x1="24" y1="32" x2="24" y2="42" stroke-width="4"/>
      <line x1="14" y1="42" x2="34" y2="42" stroke-width="4"/>
      <circle cx="24" cy="18" r="3" fill="#207448"/>
    </g>
    <rect x="647" y="295" width="240" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="767" y="326" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">host &lt;host&gt;</text>
    <text x="647" y="382" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">to or from the host</text>

    <rect x="1077" y="280" width="473" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1097, 310)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="14" r="8"/>
      <circle cx="34" cy="14" r="8"/>
      <circle cx="24" cy="34" r="8"/>
      <line x1="18" y1="18" x2="20" y2="28" stroke-width="3"/>
      <line x1="30" y1="18" x2="28" y2="28" stroke-width="3"/>
    </g>
    <rect x="1155" y="295" width="270" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1290" y="326" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">net &lt;network&gt;</text>
    <text x="1155" y="382" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">to or from the network</text>
  </g>

  <g id="row-operators">
    <rect x="50" y="455" width="345" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(70, 482)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 H 22 C 34 8 38 18 38 24 C 38 30 34 40 22 40 H 6 Z"/>
      <line x1="12" y1="18" x2="20" y2="18" stroke-width="3"/>
      <line x1="12" y1="30" x2="20" y2="30" stroke-width="3"/>
    </g>
    <rect x="136" y="472" width="100" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="186" y="503" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">and</text>
    <text x="136" y="552" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(both true)</text>

    <rect x="435" y="455" width="345" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(455, 482)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 C 14 16 14 32 6 40 C 22 40 34 32 42 24 C 34 16 22 8 6 8 Z"/>
    </g>
    <rect x="521" y="472" width="100" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="571" y="503" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">or</text>
    <text x="521" y="552" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(either true)</text>

    <rect x="820" y="455" width="345" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(840, 482)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6,8 34,24 6,40" stroke-width="3"/>
      <circle cx="40" cy="24" r="3.5" stroke-width="3"/>
    </g>
    <rect x="906" y="472" width="70" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="941" y="504" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">!</text>
    <text x="906" y="552" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(negates)</text>

    <rect x="1205" y="455" width="345" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1225, 482)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 6 C 6 15 6 33 16 42" stroke-width="4"/>
      <path d="M 32 6 C 42 15 42 33 32 42" stroke-width="4"/>
    </g>
    <text x="1280" y="512" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1280" dy="0">parentheses</tspan>
      <tspan x="1280" dy="36">to group</tspan>
    </text>
  </g>

  <g id="example-1">
    <rect x="50" y="625" width="1500" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(75, 648)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="44" height="36" rx="6"/>
      <polyline points="10,18 18,24 10,30" stroke-width="3"/>
      <line x1="22" y1="30" x2="34" y2="30" stroke-width="3"/>
    </g>
    <rect x="145" y="643" width="360" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="325" y="682" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">sudo tcpdump tcp</text>
    <rect x="535" y="643" width="985" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1027" y="681" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">(only TCP packets)</text>
  </g>

  <g id="example-2">
    <rect x="50" y="760" width="1500" height="95" rx="14" fill="#fffbf5" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(75, 783)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="44" height="36" rx="6"/>
      <polyline points="10,18 18,24 10,30" stroke-width="3"/>
      <line x1="22" y1="30" x2="34" y2="30" stroke-width="3"/>
    </g>
    <rect x="145" y="778" width="700" height="60" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="495" y="817" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">sudo tcpdump udp or port 80 or port 443</text>
    <rect x="875" y="778" width="645" height="60" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="1197" y="816" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">(UDP plus any packet on port 80 or 443)</text>
  </g>

  <g id="footer-bar">
    <rect x="50" y="895" width="1500" height="76" rx="14" fill="#207448"/>
    <g transform="translate(85, 911)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 6 L 20 6 C 24 6 28 8 30 11 C 32 8 36 6 40 6 L 56 6 L 56 38 L 40 38 C 36 38 32 40 30 43 C 28 40 24 38 20 38 L 4 38 Z"/>
      <line x1="30" y1="11" x2="30" y2="43"/>
    </g>
    <text x="800" y="943" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Read <tspan font-family="monospace">pcap-filter(7)</tspan> for the full primitives list</text>
  </g>
</svg>