<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Why --limit breaks cross-host templates</title>
  <desc>Visual comparison showing why running ansible-playbook with --limit breaks cross-host templates when facts are not gathered.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L17 9 L1 17 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L17 9 L1 17 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="#f5f8f5"/>

  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why --limit breaks cross-host templates</text>

  <rect x="40" y="110" width="740" height="660" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="70" y="155" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Full run</text>

  <rect x="70" y="175" width="680" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(92, 190)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 4h26l12 12v30H6z"/>
    <path d="M32 4v12h12M14 26h18M14 36h22"/>
  </g>
  <text x="160" y="224" font-family="sans-serif" font-size="26" fill="#303a36">the play covers the whole cluster</text>

  <rect x="70" y="275" width="216" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(155, 288)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="42" height="26" rx="4"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <circle cx="36" cy="17" r="2" fill="#207448"/>
  </g>
  <text x="178" y="348" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">lb01</text>
  <g transform="translate(178, 376)">
    <circle cx="0" cy="0" r="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <path d="M-6 0l4 4 8-8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="178" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">facts gathered</text>

  <rect x="302" y="275" width="216" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(387, 288)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="42" height="26" rx="4"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <circle cx="36" cy="17" r="2" fill="#207448"/>
  </g>
  <text x="410" y="348" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web1..3</text>
  <g transform="translate(410, 376)">
    <circle cx="0" cy="0" r="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <path d="M-6 0l4 4 8-8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="410" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">facts gathered</text>

  <rect x="534" y="275" width="216" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(619, 288)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="42" height="26" rx="4"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <circle cx="36" cy="17" r="2" fill="#207448"/>
  </g>
  <text x="642" y="348" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">gpu001..032</text>
  <g transform="translate(642, 376)">
    <circle cx="0" cy="0" r="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <path d="M-6 0l4 4 8-8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="642" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">facts gathered</text>

  <rect x="70" y="470" width="680" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(95, 486)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="44" height="46" rx="6"/>
    <path d="M14 18l5 5 13-13M14 34h20"/>
  </g>
  <text x="165" y="523" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">hostvars is complete</text>

  <path d="M410 555 V595" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="70" y="597" width="680" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(95, 642)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="44" height="46" rx="6"/>
    <path d="M14 20h24M14 32h16"/>
  </g>
  <text x="165" y="654" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">template writes every</tspan>
    <tspan x="165" dy="38">backend address</tspan>
  </text>

  <rect x="820" y="110" width="740" height="660" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="850" y="155" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Run with --limit lb01</text>

  <rect x="850" y="175" width="680" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(868, 192)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="44" height="38" rx="5"/>
    <path d="M10 16l7 7-7 7M22 30h14"/>
  </g>
  <text x="930" y="224" font-family="monospace" font-size="24" fill="#303a36">ansible-playbook site.yml --limit lb01</text>

  <rect x="850" y="275" width="216" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(935, 288)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="42" height="26" rx="4"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <circle cx="36" cy="17" r="2" fill="#207448"/>
  </g>
  <text x="958" y="348" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">lb01</text>
  <g transform="translate(958, 376)">
    <circle cx="0" cy="0" r="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <path d="M-6 0l4 4 8-8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="958" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">facts gathered</text>

  <rect x="1082" y="275" width="216" height="175" rx="12" fill="#f0f2f0" stroke="#8e9e96" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g transform="translate(1167, 288)" fill="none" stroke="#8e9e96" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="42" height="26" rx="4"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <circle cx="36" cy="17" r="2" fill="#8e9e96"/>
  </g>
  <text x="1190" y="348" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#7a8a82">web1..3</text>
  <g transform="translate(1190, 376)">
    <circle cx="0" cy="0" r="12" fill="#e4e8e5" stroke="#8e9e96" stroke-width="2.5"/>
    <path d="M-6 0h12" stroke="#8e9e96" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1190" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a8a82">not gathered</text>

  <rect x="1314" y="275" width="216" height="175" rx="12" fill="#f0f2f0" stroke="#8e9e96" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g transform="translate(1399, 288)" fill="none" stroke="#8e9e96" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="42" height="26" rx="4"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <circle cx="36" cy="17" r="2" fill="#8e9e96"/>
  </g>
  <text x="1422" y="348" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#7a8a82">gpu001..032</text>
  <g transform="translate(1422, 376)">
    <circle cx="0" cy="0" r="12" fill="#e4e8e5" stroke="#8e9e96" stroke-width="2.5"/>
    <path d="M-6 0h12" stroke="#8e9e96" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1422" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a8a82">not gathered</text>

  <path d="M1190 450 V468" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="850" y="470" width="680" height="85" rx="12" fill="#ffffff" stroke="#8e9e96" stroke-width="2.5"/>
  <g transform="translate(875, 486)" fill="none" stroke="#8e9e96" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="44" height="46" rx="6"/>
    <line x1="14" y1="16" x2="38" y2="38"/>
    <line x1="38" y1="16" x2="14" y2="38"/>
  </g>
  <text x="945" y="503" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="945" dy="0">hostvars for web1..3 or gpu001..032</tspan>
    <tspan x="945" dy="34">is empty or undefined</tspan>
  </text>

  <path d="M1190 555 V595" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <rect x="850" y="597" width="680" height="145" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(875, 642)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 6 L48 46 H4 Z"/>
    <line x1="26" y1="20" x2="26" y2="30"/>
    <circle cx="26" cy="38" r="2" fill="#db8129"/>
  </g>
  <text x="945" y="654" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
    <tspan x="945" dy="0">the template fails, or</tspan>
    <tspan x="945" dy="38">writes blank addresses</tspan>
  </text>

  <rect x="40" y="790" width="1520" height="185" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  <rect x="70" y="808" width="840" height="148" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(95, 856)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="44" height="48" rx="6"/>
    <path d="M14 20l6-6-6-6M24 36h12"/>
  </g>
  <text x="175" y="842" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="175" dy="0">- hosts: cluster</tspan>
    <tspan x="175" dy="30">  gather_facts: true</tspan>
    <tspan x="175" dy="30">  tasks: []</tspan>
    <tspan x="175" dy="30">  tags: [always]</tspan>
  </text>

  <rect x="940" y="808" width="590" height="148" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1010, 856)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="26" cy="14" rx="22" ry="9"/>
    <path d="M4 14v18c0 5 10 9 22 9s22-4 22-9V14"/>
    <path d="M4 23c0 5 10 9 22 9s22-4 22-9"/>
  </g>
  <text x="1090" y="895" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">cache</text>

  <rect x="40" y="995" width="1520" height="85" rx="14" fill="#207448"/>
  <text x="800" y="1048" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Before a limited run that templates across hosts, gather facts for the whole group.</text>
</svg>