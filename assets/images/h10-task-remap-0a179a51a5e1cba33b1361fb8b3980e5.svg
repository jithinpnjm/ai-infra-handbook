<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A job sees its GPUs renumbered from zero</title>
  <desc>Infographic demonstrating how Slurm cgroups hide unallocated GPUs and renumber allocated physical GPUs starting from zero inside tasks.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="64" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A job sees its GPUs renumbered from zero</text>

  
  
  <rect x="40" y="115" width="940" height="690" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 135)">
    <rect x="0" y="0" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="10" y1="14" x2="20" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="10" y1="24" x2="20" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="42" cy="14" r="3" fill="#207448" />
    <circle cx="42" cy="24" r="3" fill="#207448" />
    <line x1="0" y1="34" x2="56" y2="34" stroke="#207448" stroke-width="2" />
  </g>

  
  <text x="135" y="172" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">gpu node</text>

  
  <path d="M 444 260 L 444 235 L 896 235 L 896 260" fill="none" stroke="#207448" stroke-width="2" />
  <rect x="610" y="215" width="120" height="38" rx="6" fill="#207448" />
  <text x="670" y="242" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">allocated</text>

  
  
  <rect x="62" y="275" width="102" height="255" rx="8" fill="#e8eee9" stroke="#b6c7b9" stroke-width="2" />
  <g transform="translate(101, 295)">
    <rect x="3" y="10" width="18" height="15" rx="3" fill="none" stroke="#526356" stroke-width="2.5" />
    <path d="M 7 10 L 7 6 A 5 5 0 0 1 17 6 L 17 10" fill="none" stroke="#526356" stroke-width="2.5" />
  </g>
  <text x="113" y="380" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="113" dy="0">/dev/</tspan>
    <tspan x="113" dy="36">nvidia</tspan>
    <tspan x="113" dy="36">0</tspan>
  </text>

  
  <rect x="172" y="275" width="102" height="255" rx="8" fill="#e8eee9" stroke="#b6c7b9" stroke-width="2" />
  <g transform="translate(211, 295)">
    <rect x="3" y="10" width="18" height="15" rx="3" fill="none" stroke="#526356" stroke-width="2.5" />
    <path d="M 7 10 L 7 6 A 5 5 0 0 1 17 6 L 17 10" fill="none" stroke="#526356" stroke-width="2.5" />
  </g>
  <text x="223" y="380" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="223" dy="0">/dev/</tspan>
    <tspan x="223" dy="36">nvidia</tspan>
    <tspan x="223" dy="36">1</tspan>
  </text>

  
  <rect x="282" y="275" width="102" height="255" rx="8" fill="#e8eee9" stroke="#b6c7b9" stroke-width="2" />
  <g transform="translate(321, 295)">
    <rect x="3" y="10" width="18" height="15" rx="3" fill="none" stroke="#526356" stroke-width="2.5" />
    <path d="M 7 10 L 7 6 A 5 5 0 0 1 17 6 L 17 10" fill="none" stroke="#526356" stroke-width="2.5" />
  </g>
  <text x="333" y="380" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="333" dy="0">/dev/</tspan>
    <tspan x="333" dy="36">nvidia</tspan>
    <tspan x="333" dy="36">2</tspan>
  </text>

  
  <rect x="392" y="275" width="104" height="255" rx="8" fill="#207448" stroke="#144d2f" stroke-width="2" />
  <text x="444" y="380" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="444" dy="0">/dev/</tspan>
    <tspan x="444" dy="36">nvidia</tspan>
    <tspan x="444" dy="36">3</tspan>
  </text>

  
  <rect x="504" y="275" width="102" height="255" rx="8" fill="#e8eee9" stroke="#b6c7b9" stroke-width="2" />
  <g transform="translate(543, 295)">
    <rect x="3" y="10" width="18" height="15" rx="3" fill="none" stroke="#526356" stroke-width="2.5" />
    <path d="M 7 10 L 7 6 A 5 5 0 0 1 17 6 L 17 10" fill="none" stroke="#526356" stroke-width="2.5" />
  </g>
  <text x="555" y="380" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="555" dy="0">/dev/</tspan>
    <tspan x="555" dy="36">nvidia</tspan>
    <tspan x="555" dy="36">4</tspan>
  </text>

  
  <rect x="614" y="275" width="102" height="255" rx="8" fill="#e8eee9" stroke="#b6c7b9" stroke-width="2" />
  <g transform="translate(653, 295)">
    <rect x="3" y="10" width="18" height="15" rx="3" fill="none" stroke="#526356" stroke-width="2.5" />
    <path d="M 7 10 L 7 6 A 5 5 0 0 1 17 6 L 17 10" fill="none" stroke="#526356" stroke-width="2.5" />
  </g>
  <text x="665" y="380" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="665" dy="0">/dev/</tspan>
    <tspan x="665" dy="36">nvidia</tspan>
    <tspan x="665" dy="36">5</tspan>
  </text>

  
  <rect x="724" y="275" width="102" height="255" rx="8" fill="#e8eee9" stroke="#b6c7b9" stroke-width="2" />
  <g transform="translate(763, 295)">
    <rect x="3" y="10" width="18" height="15" rx="3" fill="none" stroke="#526356" stroke-width="2.5" />
    <path d="M 7 10 L 7 6 A 5 5 0 0 1 17 6 L 17 10" fill="none" stroke="#526356" stroke-width="2.5" />
  </g>
  <text x="775" y="380" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="775" dy="0">/dev/</tspan>
    <tspan x="775" dy="36">nvidia</tspan>
    <tspan x="775" dy="36">6</tspan>
  </text>

  
  <rect x="844" y="275" width="104" height="255" rx="8" fill="#207448" stroke="#144d2f" stroke-width="2" />
  <text x="896" y="380" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="896" dy="0">/dev/</tspan>
    <tspan x="896" dy="36">nvidia</tspan>
    <tspan x="896" dy="36">7</tspan>
  </text>

  
  <path d="M 72 545 L 72 565 L 213 565 L 213 585 L 233 585 L 233 565 L 374 565 L 374 545" fill="none" stroke="#718776" stroke-width="2" />
  <path d="M 514 545 L 514 565 L 655 565 L 655 585 L 675 585 L 675 565 L 816 565 L 816 545" fill="none" stroke="#718776" stroke-width="2" />
  <path d="M 223 585 L 223 605 L 490 605 M 665 585 L 665 605 L 530 605" fill="none" stroke="#718776" stroke-width="2" />
  <text x="510" y="640" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">hidden by ConstrainDevices=yes</text>

  
  <text x="510" y="745" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">the cgroup exposes /dev/nvidia3 and /dev/nvidia7</text>

  
  
  <rect x="1040" y="350" width="170" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1097, 370)">
    <circle cx="28" cy="28" r="20" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 4" />
    <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="1125" y="480" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1125" dy="0">SLURM_</tspan>
    <tspan x="1125" dy="32">JOB_GPUS</tspan>
    <tspan x="1125" dy="32">=3,7</tspan>
  </text>

  
  <path d="M 444 530 L 444 680 L 980 680 L 980 470 L 1038 470" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 896 530 L 896 680" fill="none" stroke="#207448" stroke-width="3" />

  
  
  <rect x="1340" y="115" width="220" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="1450" y="153" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">--gpus-per-task=1</text>

  
  <rect x="1340" y="215" width="220" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1360, 235)">
    <rect x="0" y="0" width="38" height="30" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="9" x2="38" y2="9" stroke="#207448" stroke-width="2" />
    <circle cx="6" cy="5" r="1.5" fill="#207448" />
    <circle cx="12" cy="5" r="1.5" fill="#207448" />
  </g>
  <text x="1410" y="260" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Task 0</text>

  <text x="1450" y="325" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="1450" dy="0">CUDA_VISIBLE_</tspan>
    <tspan x="1450" dy="32">DEVICES=0</tspan>
  </text>
  <rect x="1360" y="405" width="180" height="46" rx="6" fill="#ffffff" stroke="#b6c7b9" stroke-width="1.5" />
  <text x="1450" y="437" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">physical GPU 3</text>

  
  <rect x="1340" y="525" width="220" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1360, 545)">
    <rect x="0" y="0" width="38" height="30" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="9" x2="38" y2="9" stroke="#207448" stroke-width="2" />
    <circle cx="6" cy="5" r="1.5" fill="#207448" />
    <circle cx="12" cy="5" r="1.5" fill="#207448" />
  </g>
  <text x="1410" y="570" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Task 1</text>

  <text x="1450" y="635" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="1450" dy="0">CUDA_VISIBLE_</tspan>
    <tspan x="1450" dy="32">DEVICES=1</tspan>
  </text>
  <rect x="1360" y="715" width="180" height="46" rx="6" fill="#ffffff" stroke="#b6c7b9" stroke-width="1.5" />
  <text x="1450" y="747" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">physical GPU 7</text>

  
  <path d="M 1210 440 L 1245 440 L 1245 345 L 1338 345" fill="none" stroke="#db8129" stroke-width="2" marker-end="url(#arrow-orange)" />
  <path d="M 1210 500 L 1245 500 L 1245 655 L 1338 655" fill="none" stroke="#db8129" stroke-width="2" marker-end="url(#arrow-orange)" />

  
  <rect x="1225" y="445" width="100" height="78" rx="8" fill="#db8129" />
  <text x="1275" y="477" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="1275" dy="0">relative to</tspan>
    <tspan x="1275" dy="30">the job</tspan>
  </text>

  
  <rect x="40" y="910" width="1520" height="60" rx="8" fill="#207448" />
  <text x="800" y="948" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">The job sees a renumbered world, so scripts should follow the renumbering, not the physical labels.</text>
</svg>