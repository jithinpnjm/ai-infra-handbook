<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>A plugin asks the cloud for the current hosts at run time</title>
  <desc>Infographic showing a plugin config file querying the cloud API at run time, returning attributes to build groups and variables, and producing dynamic inventory on each run.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 14 8 L 1 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="950" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A plugin asks the cloud</text>
  <text x="800" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">for the current hosts at run time</text>

  
  <rect x="40" y="195" width="250" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="90" cy="245" r="24" fill="#207448" />
  <text x="90" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <g transform="translate(190, 218)">
    <path d="M 0 0 L 26 0 L 40 14 L 40 52 L 0 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 26 0 L 26 14 L 40 14" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="8" y1="24" x2="32" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="8" y1="34" x2="32" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="8" y1="44" x2="24" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="165" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Plugin</text>
  <text x="165" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">config file</text>

  <line x1="60" y1="385" x2="270" y2="385" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <text x="165" y="425" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">plugin:</text>
  <text x="165" y="460" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">google.cloud.</text>
  <text x="165" y="495" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">gcp_compute</text>

  <line x1="60" y1="525" x2="270" y2="525" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <text x="165" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">File name</text>
  <text x="165" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">ends with the</text>
  <text x="165" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">required suffix</text>

  
  <line x1="290" y1="442" x2="450" y2="442" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <text x="370" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">query at</text>
  <text x="370" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">run time</text>

  
  <rect x="450" y="195" width="250" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="500" cy="245" r="24" fill="#207448" />
  <text x="500" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  
  <g transform="translate(595, 222)">
    <path d="M 12 36 A 12 12 0 0 1 12 16 A 16 16 0 0 1 40 10 A 14 14 0 0 1 50 26 A 10 10 0 0 1 46 36 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>

  
  <text x="575" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Cloud API</text>

  <line x1="470" y1="375" x2="680" y2="375" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <text x="575" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">filters:</text>
  <text x="575" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">labels.env =</text>
  <text x="575" y="481" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">prod and</text>
  <text x="575" y="514" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">status =</text>
  <text x="575" y="547" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">RUNNING, so</text>
  <text x="575" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">only matching</text>
  <text x="575" y="613" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">instances</text>
  <text x="575" y="646" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">come back</text>

  
  <rect x="445" y="730" width="260" height="155" rx="12" fill="#edf2ef" stroke="#7a8880" stroke-width="2" />
  <text x="575" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">cache: true</text>
  <text x="575" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">keeps responses</text>
  <text x="575" y="856" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">on disk.</text>

  
  <line x1="700" y1="442" x2="865" y2="442" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <text x="782" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">returned</text>
  <text x="782" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">attributes</text>

  
  <rect x="865" y="195" width="295" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="915" cy="245" r="24" fill="#207448" />
  <text x="915" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  
  <g transform="translate(1080, 220)">
    <circle cx="26" cy="26" r="9" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 23 2 L 29 2 L 31 9 L 36 11 L 42 7 L 46 11 L 42 17 L 44 22 L 51 24 L 51 30 L 44 32 L 42 37 L 46 43 L 42 47 L 36 43 L 31 45 L 29 52 L 23 52 L 21 45 L 16 43 L 10 47 L 6 43 L 10 37 L 8 32 L 1 30 L 1 24 L 8 22 L 10 17 L 6 11 L 10 7 L 16 11 L 21 9 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  </g>

  
  <text x="1012" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Build the</text>
  <text x="1012" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">groups and</text>
  <text x="1012" y="389" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">variables</text>

  <line x1="885" y1="418" x2="1140" y2="418" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <text x="1012" y="452" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">keyed_groups:</text>
  <text x="1012" y="486" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">role_gpu,</text>
  <text x="1012" y="520" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">role_login</text>

  <line x1="885" y1="550" x2="1140" y2="550" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <text x="1012" y="586" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">compose:</text>
  <text x="1012" y="620" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">ansible_host from</text>
  <text x="1012" y="654" font-family="monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">networkInterfaces</text>

  
  <line x1="1160" y1="442" x2="1320" y2="442" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1240" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">groups</text>
  <text x="1240" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">and hosts</text>

  
  <rect x="1320" y="195" width="240" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="1370" cy="245" r="24" fill="#207448" />
  <text x="1370" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  
  <g transform="translate(1475, 220)">
    <rect x="0" y="0" width="38" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="9" cy="14" r="2.5" fill="#207448" />
    <line x1="17" y1="14" x2="30" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="9" cy="26" r="2.5" fill="#207448" />
    <line x1="17" y1="26" x2="30" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="9" cy="38" r="2.5" fill="#207448" />
    <line x1="17" y1="38" x2="30" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="1440" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Inventory</text>

  <line x1="1340" y1="375" x2="1540" y2="375" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <text x="1440" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Current hosts,</text>
  <text x="1440" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">every time the</text>
  <text x="1440" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">command runs</text>

  
  <rect x="1290" y="730" width="300" height="185" rx="12" fill="#fef5ec" stroke="#db8129" stroke-width="3" />
  <text x="1440" y="775" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Static files go</text>
  <text x="1440" y="812" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">stale. This list</text>
  <text x="1440" y="849" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">is read fresh</text>
  <text x="1440" y="886" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">on each run.</text>
</svg>