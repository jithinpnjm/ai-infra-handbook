<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Translating Slurm variables into PyTorch variables</title>
  <desc id="figDesc">Two columns of five boxes, Slurm environment variables on the left and PyTorch variables on the right, joined by five parallel horizontal arrows labelled with their translation rules. A dist_env() box sits above the arrows, a dashed loop beneath the last two right-hand boxes shows that a value already set in the environment wins, and the MASTER_PORT rule is highlighted in orange.</desc>

  <defs>
    <marker id="ag" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L17 9L1 17Z" fill="#207448"/>
    </marker>
    <marker id="ao" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L17 9L1 17Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1170" fill="#f5f8f5"/>

  <text x="800" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#303a36">Translating Slurm variables into PyTorch variables</text>

  <text x="322" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#207448">Slurm variables</text>
  <text x="1308" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#207448">PyTorch variables</text>

  
  <rect x="670" y="166" width="320" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="830" y="202" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#207448">dist_env()</text>

  
  <rect x="60" y="240" width="525" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(84,264)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="32" height="32" rx="4"/>
    <rect x="20" y="20" width="12" height="12" rx="2"/>
    <path d="M18 10V4M26 10V4M34 10V4M18 42V48M26 42V48M34 42V48M10 18H4M10 26H4M10 34H4M42 18H48M42 26H48M42 34H48"/>
  </g>
  <text x="156" y="282" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">SLURM_PROCID</text>
  <text x="156" y="316" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55655d">(global task number)</text>

  <line x1="585" y1="290" x2="1075" y2="290" stroke="#207448" stroke-width="4" marker-end="url(#ag)"/>
  <text x="830" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">global task number</text>

  <rect x="1075" y="240" width="465" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1099,264)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="32" height="32" rx="4"/>
    <rect x="20" y="20" width="12" height="12" rx="2"/>
    <path d="M18 10V4M26 10V4M34 10V4M18 42V48M26 42V48M34 42V48M10 18H4M10 26H4M10 34H4M42 18H48M42 26H48M42 34H48"/>
  </g>
  <text x="1171" y="298" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">RANK</text>

  
  <rect x="60" y="380" width="525" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(84,404)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="9" width="36" height="15" rx="3"/>
    <rect x="8" y="29" width="36" height="15" rx="3"/>
    <circle cx="16" cy="16.5" r="2.6" fill="#207448" stroke="none"/>
    <circle cx="16" cy="36.5" r="2.6" fill="#207448" stroke="none"/>
    <path d="M24 16.5H36M24 36.5H36"/>
  </g>
  <text x="156" y="422" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">SLURM_LOCALID</text>
  <text x="156" y="456" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55655d">(position on its own node)</text>

  <line x1="585" y1="430" x2="1075" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#ag)"/>
  <text x="830" y="414" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">position on node</text>

  <rect x="1075" y="380" width="465" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1099,404)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="9" width="36" height="15" rx="3"/>
    <rect x="8" y="29" width="36" height="15" rx="3"/>
    <circle cx="16" cy="16.5" r="2.6" fill="#207448" stroke="none"/>
    <circle cx="16" cy="36.5" r="2.6" fill="#207448" stroke="none"/>
    <path d="M24 16.5H36M24 36.5H36"/>
  </g>
  <text x="1171" y="438" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">LOCAL_RANK</text>

  
  <rect x="60" y="520" width="525" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(84,544)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="3"/>
    <rect x="20" y="6" width="12" height="12" rx="3"/>
    <rect x="34" y="6" width="12" height="12" rx="3"/>
    <rect x="6" y="20" width="12" height="12" rx="3"/>
    <rect x="20" y="20" width="12" height="12" rx="3"/>
    <rect x="34" y="20" width="12" height="12" rx="3"/>
    <rect x="6" y="34" width="12" height="12" rx="3"/>
    <rect x="20" y="34" width="12" height="12" rx="3"/>
    <rect x="34" y="34" width="12" height="12" rx="3"/>
  </g>
  <text x="156" y="562" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">SLURM_NTASKS</text>
  <text x="156" y="596" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55655d">(total number of tasks)</text>

  <line x1="585" y1="570" x2="1075" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#ag)"/>
  <text x="830" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">total tasks</text>

  <rect x="1075" y="520" width="465" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1099,544)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="3"/>
    <rect x="20" y="6" width="12" height="12" rx="3"/>
    <rect x="34" y="6" width="12" height="12" rx="3"/>
    <rect x="6" y="20" width="12" height="12" rx="3"/>
    <rect x="20" y="20" width="12" height="12" rx="3"/>
    <rect x="34" y="20" width="12" height="12" rx="3"/>
    <rect x="6" y="34" width="12" height="12" rx="3"/>
    <rect x="20" y="34" width="12" height="12" rx="3"/>
    <rect x="34" y="34" width="12" height="12" rx="3"/>
  </g>
  <text x="1171" y="578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">WORLD_SIZE</text>

  
  <rect x="60" y="660" width="525" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(84,684)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="12" r="2.6" fill="#207448" stroke="none"/>
    <circle cx="9" cy="26" r="2.6" fill="#207448" stroke="none"/>
    <circle cx="9" cy="40" r="2.6" fill="#207448" stroke="none"/>
    <path d="M18 12H45M18 26H45M18 40H45"/>
  </g>
  <text x="156" y="702" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">SLURM_JOB_NODELIST</text>
  <text x="156" y="736" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55655d">(compressed nodelist)</text>

  <line x1="585" y1="710" x2="1075" y2="710" stroke="#207448" stroke-width="4" marker-end="url(#ag)"/>
  <text x="830" y="694" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">first host in the nodelist</text>

  <rect x="1075" y="660" width="465" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1099,684)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="26" r="19"/>
    <ellipse cx="26" cy="26" rx="9" ry="19"/>
    <path d="M7 26H45"/>
  </g>
  <text x="1171" y="718" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">MASTER_ADDR</text>

  
  <rect x="60" y="800" width="525" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(84,824)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 12H28L42 26L28 40H8Z"/>
    <circle cx="18" cy="26" r="3.6"/>
  </g>
  <text x="156" y="842" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">SLURM_JOB_ID</text>
  <text x="156" y="876" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55655d">(job number)</text>

  <line x1="585" y1="850" x2="1075" y2="850" stroke="#db8129" stroke-width="4" marker-end="url(#ao)"/>
  <text x="830" y="834" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#db8129">10000 plus job ID modulo 20000</text>

  <rect x="1075" y="800" width="465" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1099,824)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="18" width="24" height="22" rx="6"/>
    <path d="M20 18V8M32 18V8M26 40V48"/>
  </g>
  <text x="1171" y="858" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#303a36">MASTER_PORT</text>

  
  <path d="M1540 710H1560V1020H1100V900" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="1308" y="956" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1308" y="956">a value already set in</tspan>
    <tspan x="1308" y="988">the environment wins</tspan>
  </text>

  
  <rect x="60" y="1060" width="1480" height="70" rx="14" fill="#207448"/>
  <text x="800" y="1104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">The glue only maps variables; it does not prove the network is fast.</text>
</svg>