<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Three-Column Comparison and Suppression Flags in comm</title>
  <desc>Visual infographic explaining standard three-column output of the comm command and suppression flags mapping to set operations.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Three-Column Comparison and Suppression Flags in comm</text>

  
  <rect x="50" y="110" width="370" height="830" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(75, 136)">
    <rect x="0" y="0" width="48" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="16" x2="36" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="40" x2="26" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="140" y="174" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Two sorted input files</text>

  
  <rect x="75" y="225" width="320" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="75" y="225" width="320" height="58" rx="12" fill="#207448"/>
  <rect x="75" y="265" width="320" height="18" fill="#207448"/>
  <text x="235" y="265" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">File A</text>

  <rect x="95" y="305" width="280" height="52" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
  <text x="115" y="340" font-family="monospace" font-size="26px" fill="#303a36">apple</text>

  <rect x="95" y="375" width="280" height="52" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
  <text x="115" y="410" font-family="monospace" font-size="26px" fill="#303a36">banana</text>

  <rect x="95" y="445" width="280" height="52" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
  <text x="115" y="480" font-family="monospace" font-size="26px" fill="#303a36">cherry</text>

  
  <rect x="75" y="565" width="320" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="75" y="565" width="320" height="58" rx="12" fill="#207448"/>
  <rect x="75" y="605" width="320" height="18" fill="#207448"/>
  <text x="235" y="605" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">File B</text>

  <rect x="95" y="645" width="280" height="52" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
  <text x="115" y="680" font-family="monospace" font-size="26px" fill="#303a36">banana</text>

  <rect x="95" y="715" width="280" height="52" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
  <text x="115" y="750" font-family="monospace" font-size="26px" fill="#303a36">cherry</text>

  <rect x="95" y="785" width="280" height="52" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
  <text x="115" y="820" font-family="monospace" font-size="26px" fill="#303a36">date</text>

  
  <path d="M 420 545 L 458 545" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="470" y="110" width="530" height="830" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(495, 136)">
    <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="8" r="3" fill="#207448"/>
    <circle cx="20" cy="8" r="3" fill="#207448"/>
    <circle cx="30" cy="8" r="3" fill="#207448"/>
    <path d="M 12 28 L 22 34 L 12 40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="568" y="156" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Standard output of</text>
  <text x="568" y="188" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">comm fileA fileB</text>

  
  <rect x="495" y="215" width="480" height="695" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="515" y="235" width="440" height="195" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="535" y="272" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448">Column 1 (no leading tab)</text>
  <text x="535" y="306" font-family="sans-serif" font-size="24px" fill="#303a36">Lines unique to File A:</text>
  <rect x="535" y="325" width="400" height="85" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
  <text x="555" y="375" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">apple</text>

  
  <rect x="515" y="450" width="440" height="195" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="535" y="487" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448">Column 2 (one leading tab)</text>
  <text x="535" y="521" font-family="sans-serif" font-size="24px" fill="#303a36">Lines unique to File B:</text>
  <rect x="535" y="540" width="400" height="85" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
  <text x="645" y="590" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">&#x21e5; date</text>

  
  <rect x="515" y="665" width="440" height="245" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="535" y="702" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448">Column 3 (two leading tabs)</text>
  <text x="535" y="736" font-family="sans-serif" font-size="24px" fill="#303a36">Lines common to both files:</text>
  <rect x="535" y="755" width="400" height="135" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
  <text x="645" y="802" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">&#x21e5; &#x21e5; banana</text>
  <text x="645" y="852" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">&#x21e5; &#x21e5; cherry</text>

  
  <path d="M 1000 545 L 1038 545" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1050" y="110" width="500" height="830" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1075, 136)">
    <rect x="0" y="0" width="54" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="18" y1="0" x2="18" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="0" x2="36" y2="50" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1145" y="174" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Decision table</text>

  
  <rect x="1075" y="215" width="450" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1075" y="215" width="450" height="52" rx="12" fill="#207448"/>
  <rect x="1075" y="255" width="450" height="12" fill="#207448"/>
  <text x="1095" y="251" font-family="monospace" font-size="25px" font-weight="bold" fill="#ffffff">comm -12 fileA fileB</text>
  <text x="1095" y="302" font-family="sans-serif" font-size="24px" fill="#303a36">-1 hiding Column 1</text>
  <text x="1095" y="334" font-family="sans-serif" font-size="24px" fill="#303a36">-2 hiding Column 2</text>
  <line x1="1095" y1="350" x2="1505" y2="350" stroke="#e8f1ea" stroke-width="2"/>
  <text x="1095" y="385" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Intersection: lines in both</text>
  <text x="1095" y="415" font-family="sans-serif" font-size="24px" fill="#303a36">Leaving only Column 3</text>

  
  <rect x="1075" y="455" width="450" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1075" y="455" width="450" height="52" rx="12" fill="#207448"/>
  <rect x="1075" y="495" width="450" height="12" fill="#207448"/>
  <text x="1095" y="491" font-family="monospace" font-size="25px" font-weight="bold" fill="#ffffff">comm -23 fileA fileB</text>
  <text x="1095" y="542" font-family="sans-serif" font-size="24px" fill="#303a36">-2 and -3 hiding Columns 2 and 3</text>
  <line x1="1095" y1="565" x2="1505" y2="565" stroke="#e8f1ea" stroke-width="2"/>
  <text x="1095" y="605" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Set difference: File A minus File B</text>
  <text x="1095" y="640" font-family="sans-serif" font-size="24px" fill="#303a36">Leaving only Column 1</text>

  
  <rect x="1075" y="695" width="450" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1075" y="695" width="450" height="52" rx="12" fill="#207448"/>
  <rect x="1075" y="735" width="450" height="12" fill="#207448"/>
  <text x="1095" y="731" font-family="monospace" font-size="25px" font-weight="bold" fill="#ffffff">comm -13 fileA fileB</text>
  <text x="1095" y="782" font-family="sans-serif" font-size="24px" fill="#303a36">-1 and -3 hiding Columns 1 and 3</text>
  <line x1="1095" y1="805" x2="1505" y2="805" stroke="#e8f1ea" stroke-width="2"/>
  <text x="1095" y="845" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Set difference: File B minus File A</text>
  <text x="1095" y="880" font-family="sans-serif" font-size="24px" fill="#303a36">Leaving only Column 2</text>

  
  <rect x="50" y="970" width="1500" height="105" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>

  
  <g transform="translate(80, 996)">
    <circle cx="26" cy="26" r="20" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="26" y1="14" x2="26" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="26" cy="37" r="2.5" fill="#db8129"/>
  </g>

  
  <text x="145" y="1033" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">comm flags suppress columns rather than select them, and inputs must be sorted beforehand.</text>
</svg>