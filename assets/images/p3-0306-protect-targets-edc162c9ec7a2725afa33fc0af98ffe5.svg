<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Protecting targets and yourself: limits, breaker, and the final report</title>
  <desc>Visual guide for fleet management: concurrency limits, circuit breakers, error aggregation, and safe batch execution.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Protecting targets and yourself:</tspan>
    <tspan x="800" dy="54">limits, breaker, and the final report</tspan>
  </text>

  
  <rect x="60" y="145" width="710" height="935" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <path d="M 60 165 A 20 20 0 0 1 80 145 L 750 145 A 20 20 0 0 1 770 165 L 770 215 L 60 215 Z" fill="#207448" />
  <text x="415" y="192" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Protect the targets</text>

  
  <rect x="85" y="235" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(109, 282)">
    <path d="M 10 12 L 46 12 L 40 50 L 16 50 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6 12 C 6 0 50 0 50 12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="26" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="23" cy="38" r="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="33" cy="38" r="4" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="189" y="285" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="189" dy="0">token bucket (aiolimiter, or an</tspan>
    <tspan x="189" dy="30">asyncio semaphore plus a sleep)</tspan>
    <tspan x="189" dy="30">limits the rate</tspan>
  </text>

  
  <rect x="85" y="403" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(109, 450)">
    <rect x="4" y="4" width="48" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="4" y="24" width="48" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="14" cy="11" r="2" fill="#207448"/>
    <circle cx="14" cy="31" r="2" fill="#207448"/>
    <line x1="4" y1="48" x2="52" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="48" r="5" fill="#207448"/>
  </g>
  <text x="189" y="453" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="189" dy="0">per-host concurrency limits: one</tspan>
    <tspan x="189" dy="30">semaphore per host, rack or</tspan>
    <tspan x="189" dy="30">BMC network</tspan>
  </text>

  
  <rect x="85" y="571" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(109, 618)">
    <circle cx="10" cy="28" r="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="28" x2="5" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="46" cy="28" r="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="51" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="25" x2="40" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 28 4 L 24 14 L 32 14 L 28 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="189" y="621" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="189" dy="0">circuit breaker stops calling a</tspan>
    <tspan x="189" dy="30">failing dependency for a cool-down</tspan>
    <tspan x="189" dy="30">so it can recover</tspan>
  </text>

  
  <rect x="85" y="739" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(109, 786)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="28" x2="28" y2="15" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 48 13 A 24 24 0 0 1 50 43" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <polyline points="45,45 51,46 53,39" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="189" y="789" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="189" dy="0">honour Retry-After; adaptive</tspan>
    <tspan x="189" dy="30">concurrency such as AIMD, the</tspan>
    <tspan x="189" dy="30">approach TCP uses</tspan>
  </text>

  
  <rect x="85" y="907" width="660" height="150" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(109, 954)">
    <rect x="4" y="10" width="48" height="26" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
    <rect x="10" y="19" width="6" height="8" rx="1" fill="none" stroke="#db8129" stroke-width="2"/>
    <rect x="20" y="19" width="6" height="8" rx="1" fill="none" stroke="#db8129" stroke-width="2"/>
    <rect x="30" y="19" width="6" height="8" rx="1" fill="none" stroke="#db8129" stroke-width="2"/>
    <rect x="40" y="19" width="6" height="8" rx="1" fill="none" stroke="#db8129" stroke-width="2"/>
    <circle cx="13" cy="15" r="1.5" fill="#db8129"/>
    <circle cx="23" cy="15" r="1.5" fill="#db8129"/>
    <circle cx="33" cy="15" r="1.5" fill="#db8129"/>
    <circle cx="43" cy="15" r="1.5" fill="#db8129"/>
    <path d="M 13 36 L 13 44 M 28 36 L 28 48 M 43 36 L 43 44" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="189" y="957" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="189" dy="0">for BMC and Redfish fleets limit</tspan>
    <tspan x="189" dy="30">concurrency per rack so management</tspan>
    <tspan x="189" dy="30">switches are not overwhelmed</tspan>
  </text>

  
  <rect x="830" y="145" width="710" height="935" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <path d="M 830 165 A 20 20 0 0 1 850 145 L 1520 145 A 20 20 0 0 1 1540 165 L 1540 215 L 830 215 Z" fill="#207448" />
  <text x="1185" y="192" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Aggregating results</text>

  
  <rect x="855" y="235" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(879, 282)">
    <rect x="4" y="6" width="48" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 12 26 L 20 34 L 34 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="959" y="297" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="959" dy="0">return Result(host, ok, value or</tspan>
    <tspan x="959" dy="34">error, duration) for each item</tspan>
  </text>

  
  <rect x="855" y="403" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(879, 450)">
    <polyline points="6,6 6,50 52,50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="13" y="28" width="6" height="22" fill="#207448"/>
    <rect x="24" y="16" width="6" height="34" fill="#207448"/>
    <rect x="35" y="34" width="6" height="16" fill="#207448"/>
    <line x1="10" y1="12" x2="46" y2="12" stroke="#207448" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  <text x="959" y="465" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="959" dy="0">summarise: success and failure</tspan>
    <tspan x="959" dy="34">counts, slowest items, error classes</tspan>
  </text>

  
  <rect x="855" y="571" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(879, 618)">
    <polygon points="28,6 6,48 50,48" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="20" x2="28" y2="33" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="41" r="2" fill="#207448"/>
  </g>
  <text x="959" y="633" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="959" dy="0">exit non-zero if a critical</tspan>
    <tspan x="959" dy="34">failure occurred</tspan>
  </text>

  
  <rect x="855" y="739" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(879, 786)">
    <circle cx="24" cy="22" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="36" y1="34" x2="50" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="18" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="25" x2="28" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="959" y="821" font-family="sans-serif" font-size="24" fill="#303a36">keep raw errors for diagnosis</text>

  
  <rect x="855" y="907" width="660" height="150" rx="12" fill="#ffffff" stroke="#c2d8c7" stroke-width="2" />
  
  <g transform="translate(879, 954)">
    <path d="M 6 8 Q 28 2 50 8 Q 50 32 28 48 Q 6 32 6 8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 18 25 L 25 32 L 38 19" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="959" y="945" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="959" dy="0">do not let one exception abort</tspan>
    <tspan x="959" dy="29">everything unless you mean it to:</tspan>
    <tspan x="959" dy="29">return_exceptions=True or catch</tspan>
    <tspan x="959" dy="29">inside the worker</tspan>
  </text>

  
  <rect x="60" y="1100" width="1480" height="70" rx="16" fill="#207448" />
  <text x="800" y="1146" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">A fleet run ends with a report, not a crash</text>
</svg>