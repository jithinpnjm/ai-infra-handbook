<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The ClusterPolicy flow</title>
  <desc>Flowchart of ClusterPolicyReconciler reconciliation logic, including node discovery, singleton handling, control function states, and readiness conditions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The ClusterPolicy flow</text>

  
  
  <g id="node-CP">
    <rect x="50" y="80" width="350" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(68, 107)">
      <path d="M 8 12 C 8 6 28 6 28 6 C 28 6 48 6 48 12 C 48 18 28 18 28 18 C 28 18 8 18 8 12 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 8 12 L 8 42 C 8 48 28 48 28 48 C 28 48 48 48 48 42 L 48 12" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 8 27 C 8 33 28 33 28 33 C 28 33 48 33 48 27" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="140" y="146" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">ClusterPolicy CR</text>
  </g>

  
  <g id="node-N">
    <rect x="440" y="75" width="680" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(460, 110)">
      <rect x="6" y="10" width="40" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="12" y1="20" x2="28" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="38" cy="20" r="2.5" fill="#207448"/>
      <line x1="12" y1="32" x2="24" y2="32" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="38" cy="32" r="2.5" fill="#207448"/>
      <path d="M 50 16 C 55 21 55 33 50 38 M 56 10 C 63 19 63 35 56 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="545" y="112" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Node events:</text>
    <text x="545" y="148" font-family="monospace" font-size="24" fill="#303a36">gpu.present, workload config,</text>
    <text x="545" y="180" font-family="monospace" font-size="24" fill="#303a36">OS label, upgrade labels</text>
  </g>

  
  <g id="node-DS">
    <rect x="1160" y="80" width="390" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1185, 107)">
      <rect x="8" y="28" width="38" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 14 20 L 52 20 L 52 34" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 20 12 L 58 12 L 58 26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <text x="1265" y="146" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Owned DaemonSets</text>
  </g>

  
  
  <g id="node-RC">
    <rect x="440" y="245" width="720" height="90" rx="16" fill="#fffcf7" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(465, 262)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 18 L 42 14" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="7" fill="none" stroke="#db8129" stroke-width="3"/>
    </g>
    <text x="545" y="302" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">ClusterPolicyReconciler.Reconcile</text>
  </g>

  
  
  <g id="node-S">
    <rect x="600" y="375" width="400" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(620, 400)">
      <polygon points="26,6 48,28 26,50 4,28" fill="none" stroke="#207448" stroke-width="3.5"/>
      <text x="26" y="37" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">1</text>
    </g>
    <text x="690" y="418" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Singleton?</text>
    <text x="690" y="455" font-family="sans-serif" font-size="24" fill="#303a36">oldest CR wins</text>
  </g>

  
  <g id="node-IG">
    <rect x="1190" y="375" width="350" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1215, 400)">
      <circle cx="28" cy="28" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="14" y1="14" x2="42" y2="42" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="1295" y="440" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Mark Ignored</text>
  </g>

  
  
  <g id="node-INIT">
    <rect x="460" y="525" width="680" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(485, 552)">
      <circle cx="24" cy="24" r="16" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="36" y1="36" x2="48" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="560" y="568" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">init: discover GPU nodes,</text>
    <text x="560" y="608" font-family="sans-serif" font-size="24" fill="#303a36">runtime, OS, load states</text>
  </g>

  
  
  <g id="node-LOOP">
    <rect x="520" y="675" width="560" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(545, 689)">
      <path d="M 12 28 A 16 16 0 1 1 28 44" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="20,44 28,44 28,36" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 44 28 A 16 16 0 1 1 28 12" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="36,12 28,12 28,20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="625" y="728" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">For each state in order</text>
  </g>

  
  <g id="node-OUT">
    <rect x="1190" y="675" width="360" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1210, 690)">
      <polygon points="26,6 48,28 26,50 4,28" fill="none" stroke="#207448" stroke-width="3.5"/>
      <text x="26" y="38" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">?</text>
    </g>
    <text x="1280" y="728" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">any not ready?</text>
  </g>

  
  
  <g id="node-ST">
    <rect x="460" y="795" width="680" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(480, 830)">
      <line x1="8" y1="14" x2="44" y2="14" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="20" cy="14" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="34" cy="28" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="42" x2="44" y2="42" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="18" cy="42" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="550" y="832" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">step: run control funcs</text>
    <text x="550" y="870" font-family="monospace" font-size="24" fill="#303a36">ServiceAccount, Role, ConfigMap,</text>
    <text x="550" y="902" font-family="monospace" font-size="24" fill="#303a36">DaemonSet, Service, ...</text>
  </g>

  
  <g id="node-RQ">
    <rect x="1190" y="835" width="360" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1210, 862)">
      <circle cx="26" cy="26" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="26,14 26,26 34,26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 42 12 L 44 18 L 38 18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1275" y="878" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Set NotReady,</text>
    <text x="1275" y="918" font-family="monospace" font-size="24" fill="#303a36">RequeueAfter 5s</text>
  </g>

  
  
  <g id="node-MARK">
    <rect x="75" y="955" width="415" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(95, 982)">
      <path d="M 12 8 L 38 8 L 38 46 L 25 36 L 12 46 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="18" y1="18" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="26" x2="28" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="160" y="998" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">remember not ready</text>
    <text x="160" y="1038" font-family="sans-serif" font-size="24" fill="#303a36">continue to next state</text>
  </g>

  
  <g id="node-RDY">
    <rect x="620" y="965" width="360" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(645, 982)">
      <polygon points="26,6 48,28 26,50 4,28" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 17 28 L 24 35 L 36 21" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="725" y="1022" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">ready?</text>
  </g>

  
  <g id="node-OK">
    <rect x="1170" y="985" width="390" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1190, 1002)">
      <path d="M 28 8 L 44 14 L 44 26 C 44 37 28 46 28 46 C 28 46 12 37 12 26 L 12 14 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <polyline points="20,26 26,32 36,20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1260" y="1042" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Set Ready condition</text>
  </g>

  
  
  <path d="M 225 190 L 225 290 L 440 290" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 780 205 L 780 245" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 1355 190 L 1355 290 L 1160 290" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 800 335 L 800 375" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 1000 427 L 1190 427" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1035" y="407" width="120" height="34" rx="6" fill="#f5f8f5"/>
  <text x="1095" y="432" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">other CR</text>

  
  <path d="M 800 480 L 800 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="812" y="488" width="85" height="32" rx="6" fill="#f5f8f5"/>
  <text x="854" y="512" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">active</text>

  
  <path d="M 800 635 L 800 675" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 800 760 L 800 795" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 800 920 L 800 965" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 800 1055 L 800 1130 L 40 1130 L 40 705 L 520 705" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="290" y="1112" width="220" height="34" rx="6" fill="#f5f8f5"/>
  <text x="400" y="1137" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">yes or disabled</text>

  
  <path d="M 620 1010 L 490 1010" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="525" y="992" width="60" height="34" rx="6" fill="#f5f8f5"/>
  <text x="555" y="1017" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">no</text>

  
  <path d="M 282 955 L 282 735 L 520 735" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 1080 717 L 1190 717" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1095" y="698" width="75" height="34" rx="6" fill="#f5f8f5"/>
  <text x="1132" y="723" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">done</text>

  
  <path d="M 1370 760 L 1370 835" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1385" y="778" width="60" height="34" rx="6" fill="#f5f8f5"/>
  <text x="1415" y="803" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">yes</text>

  
  <path d="M 1190 735 L 1150 735 L 1150 1030 L 1170 1030" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1115" y="760" width="55" height="34" rx="6" fill="#f5f8f5"/>
  <text x="1142" y="785" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">no</text>
</svg>