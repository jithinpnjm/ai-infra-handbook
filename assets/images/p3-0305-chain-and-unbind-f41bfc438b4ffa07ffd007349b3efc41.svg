<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Chaining errors with from, and why the as variable disappears</title>
  <desc>Visual infographic explaining Python exception chaining forms and the scope and cleanup of except as variables</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Chaining errors with from,</text>
  <text x="800" y="108" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">and why the as variable disappears</text>

  
  <rect x="40" y="140" width="740" height="940" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(68, 158)">
    <rect x="2" y="2" width="52" height="52" rx="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 18 34 L 26 26 M 22 22 L 30 14 C 34 10 40 10 44 14 C 48 18 48 24 44 28 L 36 36 C 32 40 26 40 22 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 34 18 L 26 26 M 30 30 L 22 38 C 18 42 12 42 8 38 C 4 34 4 28 8 24 L 16 16 C 20 12 26 12 30 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="140" y="198" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Exception chaining</text>

  
  <rect x="70" y="225" width="680" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(678, 238)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 18 28 L 38 28 M 30 20 L 38 28 L 30 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="92" y="260" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="92" dy="0" font-family="monospace">raise ConfigError(...) from exc:</tspan>
    <tspan x="92" dy="32">sets __cause__, makes the translation from</tspan>
    <tspan x="92" dy="32">a low-level error to a domain error explicit</tspan>
    <tspan x="92" dy="44" font-family="monospace">load_config: FileNotFoundError becomes</tspan>
    <tspan x="92" dy="32" font-family="monospace">ConfigError(config file not found: path)</tspan>
    <tspan x="92" dy="32" font-family="monospace">from exc</tspan>
  </text>

  
  <rect x="70" y="480" width="680" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(678, 492)">
    <rect x="8" y="8" width="40" height="40" rx="8" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
    <path d="M 20 28 L 36 28 M 28 20 L 36 28 L 28 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="92" y="515" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="92" dy="0" font-family="monospace">raise NewError(...) with no from:</tspan>
    <tspan x="92" dy="32">Python still chains implicitly and shows</tspan>
    <tspan x="92" dy="32">During handling of the above exception,</tspan>
    <tspan x="92" dy="32">another exception occurred</tspan>
  </text>

  
  <rect x="70" y="650" width="680" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(678, 662)">
    <path d="M 28 10 L 44 16 L 44 28 C 44 38 36 46 28 48 C 20 46 12 38 12 28 L 12 16 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="20" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="92" y="688" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="92" dy="0" font-family="monospace">raise ... from None:</tspan>
    <tspan x="92" dy="32">use when the original error is only noise</tspan>
  </text>

  
  <rect x="70" y="765" width="680" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(678, 778)">
    <circle cx="28" cy="28" r="20" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 28 38 L 28 18 M 20 26 L 28 18 L 36 26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="92" y="798" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="92" dy="0" font-family="monospace">bare raise:</tspan>
    <tspan x="92" dy="32">re-raises the current exception</tspan>
    <tspan x="92" dy="32">with its traceback</tspan>
  </text>

  
  <rect x="70" y="895" width="680" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(678, 908)">
    <rect x="10" y="8" width="36" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="16" y1="18" x2="38" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="38" x2="30" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="92" y="928" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="92" dy="0">exc.args, str(exc), repr(exc),</tspan>
    <tspan x="92" dy="30">exc.__traceback__,</tspan>
    <tspan x="92" dy="30">exc.add_note(hint) (3.11),</tspan>
    <tspan x="92" dy="30">traceback.format_exc(),</tspan>
    <tspan x="92" dy="30">logging.exception() inside a handler</tspan>
  </text>

  
  <rect x="820" y="140" width="740" height="940" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(848, 158)">
    <rect x="2" y="2" width="52" height="52" rx="10" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 18 16 L 38 16 M 28 16 L 28 36 M 20 40 L 36 40" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="920" y="198" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">except Exc as var scope</text>

  
  <rect x="850" y="225" width="680" height="140" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  
  <circle cx="886" cy="256" r="20" fill="#207448" />
  <text x="886" y="264" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(1458, 238)">
    <rect x="8" y="10" width="40" height="34" rx="6" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 16 22 L 24 27 L 16 32 M 26 32 L 36 32" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="924" y="262" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="924" dy="0">X = 99; try: 1 / 0;</tspan>
    <tspan x="924" dy="32">except Exception as X:</tspan>
    <tspan x="924" dy="32">print(X); saveit = X</tspan>
  </text>

  
  <line x1="1190" y1="365" x2="1190" y2="408" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="850" y="415" width="680" height="165" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  
  <circle cx="886" cy="446" r="20" fill="#207448" />
  <text x="886" y="454" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(1458, 428)">
    <circle cx="28" cy="28" r="20" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="18" y1="18" x2="38" y2="38" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="18" x2="18" y2="38" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="924" y="450" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="924" dy="0">after the block: X is unbound</tspan>
    <tspan x="924" dy="32">(NameError: name X is not defined);</tspan>
    <tspan x="924" dy="32">saveit is ZeroDivisionError</tspan>
    <tspan x="924" dy="32">(division by zero)</tspan>
  </text>

  
  <rect x="850" y="605" width="680" height="255" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  
  <g transform="translate(1458, 618)">
    <circle cx="28" cy="28" r="18" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="24 8" />
    <path d="M 38 12 L 46 16 L 42 24" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 18 44 L 10 40 L 14 32" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="876" y="642" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="876" dy="0">the traceback's frames hold local variables;</tspan>
    <tspan x="876" dy="30">if var stayed bound the exception would point</tspan>
    <tspan x="876" dy="30">back at itself through the frame,</tspan>
    <tspan x="876" dy="30">a reference cycle that delays</tspan>
    <tspan x="876" dy="30">garbage collection; Python runs del var</tspan>
    <tspan x="876" dy="30">when the block exits, even if var held</tspan>
    <tspan x="876" dy="30">a value before the try</tspan>
  </text>

  
  <rect x="850" y="885" width="680" height="180" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  
  <g transform="translate(1458, 898)">
    <rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 18 28 L 26 36 L 40 18" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="876" y="942" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="876" dy="0">assign the exception to a separate</tspan>
    <tspan x="876" dy="35">variable inside the handler</tspan>
    <tspan x="876" dy="35">if you need it later</tspan>
  </text>

  
  <rect x="40" y="1105" width="1520" height="70" rx="12" fill="#207448" />
  <text x="800" y="1149" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Chain to translate errors, and copy the exception if you need it after the block</text>
</svg>