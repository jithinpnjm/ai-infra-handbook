<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="1600" height="1250">
  <title>Two writers and a 409 Conflict</title>
  <desc>Swimlane diagram showing Kubernetes optimistic concurrency control and conflict resolution between two engineers and the API server.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c53030" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1250" fill="#f5f8f5" />

  
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Two writers and a 409 Conflict</text>
  </g>

  
  
  <rect x="70" y="110" width="400" height="960" rx="16" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  
  <rect x="520" y="110" width="560" height="960" rx="16" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  
  <rect x="1130" y="110" width="400" height="960" rx="16" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />

  
  <line x1="270" y1="230" x2="270" y2="1050" stroke="#b2c9b8" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="800" y1="230" x2="800" y2="1050" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />
  <line x1="1330" y1="230" x2="1330" y2="1050" stroke="#b2c9b8" stroke-width="3" stroke-dasharray="8 8" />

  
  
  <g transform="translate(90, 125)">
    <rect width="360" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="42" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 26 70 C 26 56 36 52 50 52 C 64 52 74 56 74 70" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="95" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Engineer A</text>
  </g>

  
  <g transform="translate(600, 125)">
    <rect width="400" height="85" rx="12" fill="#207448" filter="url(#card-shadow)" />
    
    <ellipse cx="50" cy="30" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 30 30 v 14 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -14" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 30 44 v 14 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -14" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <text x="92" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">API server (etcd)</text>
  </g>

  
  <g transform="translate(1150, 125)">
    <rect width="360" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="42" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 26 70 C 26 56 36 52 50 52 C 64 52 74 56 74 70" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="95" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Engineer B</text>
  </g>

  
  
  <g transform="translate(630, 240)">
    <rect width="340" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    <text x="170" y="41" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">resourceVersion: 5012</text>
  </g>

  
  <line x1="270" y1="272" x2="620" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="390" y="244" width="110" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="445" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">read</text>

  
  <line x1="1330" y1="272" x2="980" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1100" y="244" width="110" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1155" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">read</text>


  
  
  <circle cx="120" cy="390" r="24" fill="#207448" />
  <text x="120" y="399" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="156" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#207448">Step 1</text>

  
  <line x1="270" y1="420" x2="620" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="300" y="365" width="310" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="455" y="396" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">write at resourceVersion 5012</text>

  
  <g transform="translate(630, 420)">
    <rect width="340" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    <text x="170" y="41" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">stored, now 5013</text>
  </g>

  
  <line x1="630" y1="465" x2="280" y2="465" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="345" y="480" width="220" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="455" y="509" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">stored, now 5013</text>


  
  
  <circle cx="1470" cy="580" r="24" fill="#207448" />
  <text x="1470" y="589" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="1360" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#207448">Step 2</text>

  
  <line x1="1330" y1="610" x2="980" y2="610" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="990" y="560" width="330" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1155" y="591" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">write at resourceVersion 5012</text>

  
  <g transform="translate(630, 610)">
    <rect width="340" height="64" rx="10" fill="#fbebe8" stroke="#c53030" stroke-width="2" filter="url(#card-shadow)" />
    <text x="170" y="41" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#c53030" text-anchor="middle">5012 ≠ current 5013</text>
  </g>

  
  <line x1="970" y1="680" x2="1320" y2="680" stroke="#c53030" stroke-width="3" marker-end="url(#arrow-red)" />
  
  <g transform="translate(950, 660)">
    <circle cx="20" cy="20" r="16" fill="#c53030" />
    <path d="M 12 12 L 28 28 M 28 12 L 12 28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  
  <rect x="1000" y="695" width="460" height="50" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="2" />
  <text x="1230" y="729" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#c53030" text-anchor="middle">409 Conflict, the object has been modified</text>

  
  <g transform="translate(610, 720)">
    <rect width="380" height="80" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="40" cy="40" r="18" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 40 28 v 14 M 40 48 v 4" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="75" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">the server refuses to guess,</text>
    <text x="75" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">so no edit is lost</text>
  </g>


  
  
  <circle cx="1470" cy="830" r="24" fill="#207448" />
  <text x="1470" y="839" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1360" y="838" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#207448">Step 3</text>

  
  <line x1="1330" y1="860" x2="980" y2="860" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1080" y="830" width="160" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1160" y="859" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">read latest</text>

  
  <line x1="1330" y1="925" x2="980" y2="925" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1060" y="895" width="200" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1160" y="924" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">write at 5013</text>

  
  <g transform="translate(630, 920)">
    <rect width="340" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    <text x="170" y="41" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">stored: updated to 5014</text>
  </g>

  
  <line x1="980" y1="980" x2="1320" y2="980" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1100" y="995" width="120" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1160" y="1024" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">stored</text>


  
  <g transform="translate(100, 1100)">
    <rect width="1400" height="85" rx="14" fill="#207448" filter="url(#card-shadow)" />
    
    <circle cx="50" cy="42" r="22" fill="#ffffff" />
    <path d="M 38 42 L 46 50 L 62 34" fill="none" stroke="#207448" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="90" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">optimistic concurrency checks only at write time</text>
  </g>
</svg>