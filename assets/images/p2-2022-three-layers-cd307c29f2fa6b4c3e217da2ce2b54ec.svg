<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Engine, server and orchestrator: place each tool on its layer</title>
  <desc>Visual guide placing LLM serving tools, engines, servers, and orchestrators on their respective architectural layers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5px">Engine, server and orchestrator: place each tool on its layer</text>

  
  <g id="client-node">
    <rect x="660" y="115" width="280" height="60" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="686" y="127" width="34" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="695" y1="151" x2="711" y2="151" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="703" y1="151" x2="703" y2="156" stroke="#207448" stroke-width="3" />
    <path d="M 693 139 L 699 139" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="736" y="156" font-size="30" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">Client</text>
  </g>

  
  <line x1="800" y1="175" x2="800" y2="213" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="orchestrator-band">
    <rect x="60" y="215" width="1480" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="80" y="230" width="470" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="266" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="105" dy="0" font-size="30" font-weight="bold" fill="#207448">Orchestrator:</tspan>
      <tspan x="105" dy="36" font-size="24" fill="#303a36">how many copies,</tspan>
      <tspan x="105" dy="30" font-size="24" fill="#303a36">where they run,</tspan>
      <tspan x="105" dy="30" font-size="24" fill="#303a36">how requests reach them</tspan>
    </text>

    
    <rect x="610" y="245" width="420" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(640, 272)">
      <circle cx="28" cy="12" r="8" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="44" r="8" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="44" r="8" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="19" x2="16" y2="37" stroke="#207448" stroke-width="3" />
      <line x1="32" y1="19" x2="40" y2="37" stroke="#207448" stroke-width="3" />
    </g>
    <text x="720" y="310" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Ray Serve LLM</text>

    
    <rect x="1070" y="245" width="420" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1100, 272)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="28" r="6" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="4" x2="28" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="7" y1="16" x2="49" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="7" y1="40" x2="49" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1180" y="310" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Kubernetes</text>
  </g>

  
  <line x1="800" y1="385" x2="800" y2="423" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="server-layer-band">
    <rect x="60" y="425" width="1480" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="80" y="440" width="470" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="476" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="105" dy="0" font-size="30" font-weight="bold" fill="#207448">Server layer:</tspan>
      <tspan x="105" dy="36" font-size="24" fill="#303a36">wraps engines in an API,</tspan>
      <tspan x="105" dy="30" font-size="24" fill="#303a36">model repository,</tspan>
      <tspan x="105" dy="30" font-size="24" fill="#303a36">health and metrics</tspan>
    </text>

    
    <rect x="590" y="455" width="290" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(712, 466)">
      <rect x="0" y="0" width="46" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 8 10 L 16 16 L 8 22" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="20" y1="22" x2="34" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="735" y="538" text-anchor="middle" font-size="25" font-weight="bold" fill="#303a36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">vllm serve</text>

    
    <rect x="900" y="455" width="290" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1022, 466)">
      <rect x="0" y="0" width="46" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 26 5 L 14 18 L 24 18 L 18 29" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="1045" y="538" text-anchor="middle" font-size="25" font-weight="bold" fill="#303a36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">trtllm-serve</text>

    
    <rect x="1210" y="455" width="290" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1332, 466)">
      <rect x="3" y="2" width="40" height="9" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <rect x="3" y="14" width="40" height="9" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <rect x="3" y="26" width="40" height="9" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="9" cy="6.5" r="1.5" fill="#207448" />
      <circle cx="9" cy="18.5" r="1.5" fill="#207448" />
      <circle cx="9" cy="30.5" r="1.5" fill="#207448" />
    </g>
    <text x="1355" y="538" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Triton</text>
  </g>

  
  <line x1="800" y1="595" x2="800" y2="633" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="engine-band">
    <rect x="60" y="635" width="1480" height="220" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

    
    <rect x="80" y="650" width="470" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="682" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="105" dy="0" font-size="30" font-weight="bold" fill="#207448">Engine:</tspan>
      <tspan x="105" dy="34" font-size="24" fill="#303a36">runs the model on the GPU,</tspan>
      <tspan x="105" dy="28" font-size="24" fill="#303a36">batches requests,</tspan>
      <tspan x="105" dy="28" font-size="24" fill="#303a36">manages the KV cache</tspan>
    </text>

    
    <rect x="590" y="650" width="290" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(712, 662)">
      <rect x="4" y="4" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <rect x="24" y="4" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <rect x="4" y="20" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <rect x="24" y="20" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    <text x="735" y="734" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">vLLM</text>

    
    <rect x="900" y="650" width="290" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1022, 662)">
      <rect x="5" y="5" width="34" height="26" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="16" y1="5" x2="16" y2="31" stroke="#207448" stroke-width="2" />
      <line x1="28" y1="5" x2="28" y2="31" stroke="#207448" stroke-width="2" />
      <line x1="5" y1="18" x2="39" y2="18" stroke="#207448" stroke-width="2" />
    </g>
    <text x="1045" y="734" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">TensorRT-LLM</text>

    
    <rect x="1210" y="650" width="290" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1332, 662)">
      <circle cx="10" cy="18" r="5" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="34" cy="9" r="5" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="34" cy="27" r="5" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 15 18 C 22 18, 24 9, 29 9" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 15 18 C 22 18, 24 27, 29 27" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    <text x="1355" y="734" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">SGLang</text>

    
    <rect x="80" y="785" width="1420" height="50" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
    <text x="790" y="818" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Triton is the older general server; the engines are built for LLMs</text>
  </g>

  
  <line x1="800" y1="855" x2="800" y2="893" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="gpus-block">
    <rect x="60" y="895" width="1480" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(480, 915)">
      <rect x="10" y="8" width="34" height="34" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <rect x="18" y="16" width="18" height="18" fill="none" stroke="#207448" stroke-width="2" />
      
      <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="27" y1="2" x2="27" y2="8" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="38" y1="2" x2="38" y2="8" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="16" y1="42" x2="16" y2="48" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="27" y1="42" x2="27" y2="48" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="38" y1="42" x2="38" y2="48" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="16" x2="10" y2="16" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="25" x2="10" y2="25" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="34" x2="10" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="44" y1="16" x2="50" y2="16" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="44" y1="25" x2="50" y2="25" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="44" y1="34" x2="50" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="560" y="952" font-size="30" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">GPUs: weights and KV cache</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="1015" width="1480" height="70" rx="12" fill="#207448" />
    <text x="800" y="1058" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">Before you compare tools, place each one on its layer.</text>
  </g>
</svg>