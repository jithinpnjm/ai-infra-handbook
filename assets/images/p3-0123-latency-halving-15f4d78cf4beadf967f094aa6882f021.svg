<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" style="background:#f5f8f5; font-family:sans-serif;">
  <title>Halving the problem: p99 time to first token, one question at a time</title>
  <desc>Binary descent tree troubleshooting inference p99 TTFT alongside training step profiler breakdown.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#a0aba5" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Halving the problem: p99 time to first token,</text>
  <text x="800" y="108" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">one question at a time</text>

  

  
  <g id="top-problem">
    <rect x="150" y="140" width="520" height="74" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(170, 149)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="24"/>
      <polyline points="28,14 28,28 38,28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="250" y="188" font-size="30" font-weight="bold" fill="#303a36">p99 TTFT is high</text>
  </g>

  
  <line x1="410" y1="214" x2="410" y2="252" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="diamond-1">
    <polygon points="410,252 700,332 410,412 120,332" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="165" cy="332" r="20" fill="#207448"/>
    <text x="165" y="339" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(205, 304)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="12" y="12" width="32" height="32" rx="4"/>
      <line x1="20" y1="4" x2="20" y2="12"/><line x1="28" y1="4" x2="28" y2="12"/><line x1="36" y1="4" x2="36" y2="12"/>
      <line x1="20" y1="44" x2="20" y2="52"/><line x1="28" y1="44" x2="28" y2="52"/><line x1="36" y1="44" x2="36" y2="52"/>
      <line x1="4" y1="20" x2="12" y2="20"/><line x1="4" y1="28" x2="12" y2="28"/><line x1="4" y1="36" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="52" y2="20"/><line x1="44" y1="28" x2="52" y2="28"/><line x1="44" y1="36" x2="52" y2="36"/>
    </g>
    <text x="445" y="341" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">On the GPU, or before it?</text>
  </g>

  
  <path d="M 120 332 L 65 332 L 65 382" fill="none" stroke="#a0aba5" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-grey)"/>

  
  <line x1="410" y1="412" x2="410" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="425" y="426" width="135" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="492" y="451" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">before it</text>

  
  <g id="diamond-2">
    <polygon points="410,480 720,570 410,660 100,570" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="150" cy="570" r="20" fill="#207448"/>
    <text x="150" y="577" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(190, 542)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="6" y="8" width="44" height="12" rx="3"/>
      <rect x="6" y="24" width="44" height="12" rx="3"/>
      <rect x="6" y="40" width="44" height="12" rx="3"/>
    </g>
    <text x="445" y="555" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Waiting in the queue,</text>
    <text x="445" y="590" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">or in tokenization?</text>
  </g>

  
  <path d="M 100 570 L 55 570 L 55 620" fill="none" stroke="#a0aba5" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-grey)"/>

  
  <line x1="410" y1="660" x2="410" y2="728" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="425" y="674" width="145" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="497" y="699" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">the queue</text>

  
  <g id="diamond-3">
    <polygon points="410,728 750,838 410,948 70,838" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="115" cy="838" r="20" fill="#207448"/>
    <text x="115" y="845" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(150, 810)" stroke="#207448" stroke-width="4" fill="none">
      <line x1="28" y1="8" x2="28" y2="48"/>
      <line x1="10" y1="16" x2="46" y2="16"/>
      <polygon points="6,34 14,34 10,16"/>
      <polygon points="42,34 50,34 46,16"/>
      <line x1="16" y1="48" x2="40" y2="48"/>
    </g>
    <text x="445" y="812" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Is the queue long because arrivals</text>
    <text x="445" y="844" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">exceed service capacity,</text>
    <text x="445" y="876" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">or because batches are held?</text>
  </g>

  
  <path d="M 70 838 L 45 838 L 45 888" fill="none" stroke="#a0aba5" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-grey)"/>

  
  <line x1="410" y1="948" x2="410" y2="1006" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="425" y="960" width="220" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="535" y="985" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">batches are held</text>

  
  <g id="result-box">
    <rect x="45" y="1008" width="730" height="88" rx="14" fill="#fff7f0" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(65, 1024)" stroke="#db8129" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="14"/>
      <path d="M28,6 L28,14 M28,42 L28,50 M6,28 L14,28 M42,28 L50,28 M12,12 L18,18 M38,38 L44,44 M12,44 L18,38 M38,18 L44,12"/>
    </g>
    <text x="145" y="1046" font-size="24" font-weight="bold" fill="#303a36">The batch scheduler waits for a fill timeout:</text>
    <text x="145" y="1078" font-size="24" font-weight="bold" fill="#db8129">adjust the policy</text>
  </g>

  

  <g id="right-panel">
    
    <rect x="810" y="140" width="750" height="956" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(835, 155)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="22"/>
      <path d="M28,14 A14,14 0 0,1 42,28 L46,28 M28,42 A14,14 0 0,1 14,28 L10,28"/>
      <polyline points="44,24 46,28 42,32"/>
      <polyline points="12,24 10,28 14,32"/>
    </g>
    <text x="910" y="193" font-size="30" font-weight="bold" fill="#303a36">The same procedure on a training step</text>

    
    <g transform="translate(835, 230)">
      <rect x="0" y="0" width="700" height="92" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 18)" stroke="#207448" stroke-width="4" fill="none">
        <ellipse cx="28" cy="14" rx="20" ry="8"/>
        <path d="M8,14 v20 c0,4.4 9,8 20,8 s20,-3.6 20,-8 v-20"/>
      </g>
      <text x="95" y="55" font-size="28" font-weight="bold" fill="#303a36">data wait</text>
    </g>

    
    <g transform="translate(835, 334)">
      <rect x="0" y="0" width="700" height="92" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 18)" stroke="#207448" stroke-width="4" fill="none">
        <rect x="6" y="12" width="44" height="32" rx="4"/>
        <line x1="16" y1="28" x2="40" y2="28"/>
        <polyline points="32,20 40,28 32,36"/>
      </g>
      <text x="95" y="55" font-size="28" font-weight="bold" fill="#303a36">host-to-device copies (H2D)</text>
    </g>

    
    <g transform="translate(835, 438)">
      <rect x="0" y="0" width="700" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
      
      <g transform="translate(20, 24)" stroke="#207448" stroke-width="4" fill="none">
        <rect x="10" y="10" width="36" height="36" rx="4"/>
        <circle cx="28" cy="28" r="8"/>
        <line x1="20" y1="2" x2="20" y2="10"/><line x1="28" y1="2" x2="28" y2="10"/><line x1="36" y1="2" x2="36" y2="10"/>
        <line x1="20" y1="46" x2="20" y2="54"/><line x1="28" y1="46" x2="28" y2="54"/><line x1="36" y1="46" x2="36" y2="54"/>
        <line x1="2" y1="20" x2="10" y2="20"/><line x1="2" y1="28" x2="10" y2="28"/><line x1="2" y1="36" x2="10" y2="36"/>
        <line x1="46" y1="20" x2="54" y2="20"/><line x1="46" y1="28" x2="54" y2="28"/><line x1="46" y1="36" x2="54" y2="36"/>
      </g>
      <text x="95" y="62" font-size="34" font-weight="bold" fill="#207448">compute</text>

      
      <g transform="translate(20, 115)">
        <rect x="0" y="0" width="660" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        
        <g transform="translate(20, 37)" stroke="#207448" stroke-width="4" fill="none">
          <circle cx="28" cy="28" r="22"/>
          <line x1="28" y1="14" x2="28" y2="42"/>
          <polyline points="20,34 28,42 36,34"/>
        </g>
        <text x="90" y="55" font-size="25" font-weight="bold" fill="#207448">descend into the largest; profilers time each part for you</text>
      </g>
    </g>

    
    <g transform="translate(835, 720)">
      <rect x="0" y="0" width="700" height="92" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 18)" stroke="#207448" stroke-width="4" fill="none">
        <circle cx="14" cy="28" r="8"/>
        <circle cx="42" cy="16" r="8"/>
        <circle cx="42" cy="40" r="8"/>
        <line x1="21" y1="24" x2="35" y2="19"/>
        <line x1="21" y1="32" x2="35" y2="37"/>
      </g>
      <text x="95" y="55" font-size="28" font-weight="bold" fill="#303a36">communication</text>
    </g>

    
    <g transform="translate(835, 824)">
      <rect x="0" y="0" width="700" height="92" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 18)" stroke="#207448" stroke-width="4" fill="none">
        <rect x="10" y="10" width="36" height="36" rx="6"/>
        <path d="M18,34 L28,18 L38,34"/>
      </g>
      <text x="95" y="55" font-size="28" font-weight="bold" fill="#303a36">optimizer</text>
    </g>

    
    <g transform="translate(835, 928)">
      <rect x="0" y="0" width="700" height="92" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 18)" stroke="#207448" stroke-width="4" fill="none">
        <rect x="10" y="8" width="36" height="40" rx="4"/>
        <line x1="18" y1="8" x2="18" y2="22"/>
        <line x1="38" y1="8" x2="38" y2="22"/>
        <rect x="16" y="32" width="24" height="12" rx="2"/>
      </g>
      <text x="95" y="55" font-size="28" font-weight="bold" fill="#303a36">checkpoint</text>
    </g>
  </g>

  
  <rect x="40" y="1120" width="1520" height="60" rx="12" fill="#207448"/>
  <text x="800" y="1158" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Each step is a measurement, not a guess, which is what makes the halving safe</text>
</svg>