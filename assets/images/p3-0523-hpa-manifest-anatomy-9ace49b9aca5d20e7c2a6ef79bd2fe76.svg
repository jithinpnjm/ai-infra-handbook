<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Anatomy of the embeddings HPA manifest</title>
  <desc>Visual breakdown of the Horizontal Pod Autoscaler manifest for embeddings in namespace serving, detailing target deployment, replica bounds, three metrics evaluated for the largest result, behavior policies for scale-up and scale-down, and operational side facts.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Anatomy of the embeddings HPA manifest</text>

  
  <g id="target-reference-panel">
    <rect x="50" y="95" width="1500" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(75, 127)">
      <rect x="10" y="0" width="36" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="0" y="32" width="24" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="32" y="32" width="24" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 16 V 24 M 12 24 H 44 M 12 24 V 32 M 44 24 V 32" fill="none" stroke="#207448" stroke-width="4"/>
    </g>

    <text x="155" y="140" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Annotated manifest for HPA embeddings in namespace serving</text>

    
    <rect x="155" y="156" width="540" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="170" y="186" font-family="monospace" font-size="24" fill="#207448">scaleTargetRef Deployment embeddings</text>

    <rect x="715" y="156" width="360" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="730" y="186" font-family="monospace" font-size="24" fill="#303a36">minReplicas 2 (floor)</text>

    <rect x="1095" y="156" width="435" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1110" y="186" font-family="monospace" font-size="24" fill="#303a36">maxReplicas 40 (ceiling)</text>
  </g>

  
  <g id="metrics-section">
    <rect x="50" y="240" width="1500" height="380" rx="12" fill="none" stroke="#207448" stroke-width="2"/>
    <path d="M 50 252 A 12 12 0 0 1 62 240 H 1538 A 12 12 0 0 1 1550 252 V 305 H 50 Z" fill="#e8f1ea"/>
    
    <text x="75" y="284" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Three metrics, each asks its own question and the controller uses the</text>
    
    
    <rect x="1275" y="252" width="250" height="44" rx="8" fill="#db8129"/>
    <text x="1400" y="283" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">LARGEST result</text>

    
    <g id="metric-card-cpu">
      <rect x="75" y="325" width="460" height="270" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(100, 345)">
        <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
        <rect x="20" y="20" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M 20 4 V 12 M 28 4 V 12 M 36 4 V 12 M 20 44 V 52 M 28 44 V 52 M 36 44 V 52 M 4 20 H 12 M 4 28 H 12 M 4 36 H 12 M 44 20 H 52 M 44 28 H 52 M 44 36 H 52" fill="none" stroke="#207448" stroke-width="3"/>
      </g>
      
      <text x="175" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Resource cpu</text>
      <text x="175" y="416" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Utilization</text>
      
      <line x1="95" y1="440" x2="515" y2="440" stroke="#e8f1ea" stroke-width="2"/>
      
      <text x="100" y="490" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">averageUtilization 60</text>
      <text x="100" y="545" font-family="sans-serif" font-size="24" fill="#303a36">(percent of CPU request)</text>
    </g>

    
    <g id="metric-card-pods">
      <rect x="570" y="325" width="460" height="270" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(595, 345)">
        <rect x="2" y="14" width="16" height="30" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
        <rect x="20" y="6" width="16" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
        <rect x="38" y="14" width="16" height="30" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      </g>
      
      <text x="670" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pods</text>
      <text x="670" y="416" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">inflight_requests</text>
      
      <line x1="590" y1="440" x2="1010" y2="440" stroke="#e8f1ea" stroke-width="2"/>
      
      <text x="595" y="490" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">AverageValue 8</text>
      <text x="595" y="545" font-family="sans-serif" font-size="24" fill="#303a36">(custom metric per pod)</text>
    </g>

    
    <g id="metric-card-external">
      <rect x="1065" y="325" width="465" height="270" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(1090, 345)">
        <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
        <path d="M 6 14 V 42 A 22 8 0 0 0 50 42 V 14" fill="none" stroke="#207448" stroke-width="4"/>
        <path d="M 6 28 A 22 8 0 0 0 50 28" fill="none" stroke="#207448" stroke-width="3"/>
      </g>
      
      <text x="1165" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">External</text>
      <text x="1165" y="416" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">queue_depth</text>
      
      <line x1="1085" y1="440" x2="1510" y2="440" stroke="#e8f1ea" stroke-width="2"/>
      
      <text x="1090" y="490" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">AverageValue 30</text>
      <text x="1090" y="545" font-family="sans-serif" font-size="24" fill="#303a36">(total divided by replicas)</text>
    </g>
  </g>

  
  <g id="behavior-section">
    <rect x="50" y="645" width="1500" height="325" rx="12" fill="none" stroke="#207448" stroke-width="2"/>
    <path d="M 50 657 A 12 12 0 0 1 62 645 H 1538 A 12 12 0 0 1 1550 657 V 700 H 50 Z" fill="#e8f1ea"/>
    <text x="75" y="686" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Behavior:</text>

    
    <g id="scaleup-panel">
      <rect x="75" y="715" width="695" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(95, 730)">
        <rect x="4" y="30" width="10" height="20" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
        <rect x="20" y="18" width="10" height="32" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
        <rect x="36" y="6" width="10" height="44" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M 4 24 L 46 4 M 34 4 H 46 V 16" fill="none" stroke="#207448" stroke-width="3"/>
      </g>
      
      <text x="165" y="755" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">scaleUp stabilizationWindowSeconds 0</text>
      <text x="165" y="790" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">selectPolicy Max</text>

      <text x="95" y="835" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="95" dy="0">with policies Percent 100 per 60 s</tspan>
        <tspan x="95" dy="34">(at most double per minute)</tspan>
        <tspan x="95" dy="34">and Pods 4 per 60 s</tspan>
      </text>
    </g>

    
    <g id="scaledown-panel">
      <rect x="795" y="715" width="735" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(815, 730)">
        <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
        <path d="M 28 14 V 28 L 38 28" fill="none" stroke="#207448" stroke-width="4"/>
        <path d="M 28 6 V 10 M 28 46 V 50 M 6 28 H 10 M 46 28 H 50" fill="none" stroke="#207448" stroke-width="3"/>
      </g>
      
      <text x="885" y="755" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">scaleDown stabilizationWindowSeconds 600</text>
      <text x="885" y="795" font-family="sans-serif" font-size="24" fill="#303a36">(highest recommendation over 10 min)</text>
      
      <line x1="815" y1="825" x2="1510" y2="825" stroke="#e8f1ea" stroke-width="2"/>

      <text x="815" y="875" font-family="monospace" font-size="24" fill="#303a36">with policy Percent 10 per 120 s</text>
    </g>
  </g>

  
  <g id="side-facts-section">
    <rect x="50" y="990" width="1500" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="1028" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side facts:</text>

    
    <g id="fact-1">
      <rect x="75" y="1045" width="695" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(95, 1060)">
        <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M 16 20 H 32 M 24 12 V 28 M 16 34 H 32" fill="none" stroke="#207448" stroke-width="3"/>
      </g>

      <text x="160" y="1080" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="160" dy="0">plus or minus 10 percent tolerance band</tspan>
        <tspan x="160" dy="30">around the target</tspan>
      </text>
    </g>

    
    <g id="fact-2">
      <rect x="795" y="1045" width="735" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(815, 1060)">
        <rect x="18" y="6" width="12" height="26" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
        <circle cx="24" cy="36" r="10" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M 36 12 Q 42 16 36 20 Q 42 24 36 28" fill="none" stroke="#207448" stroke-width="3"/>
      </g>

      <text x="880" y="1080" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="880" dy="0">cpu initialisation period 5 min so warm-up</tspan>
        <tspan x="880" dy="30">CPU is not read as load</tspan>
      </text>
    </g>
  </g>
</svg>