    <line x1="38" y1="15" x2="45" y2="15" stroke="#207448" stroke-width="2"/>
    <line x1="38" y1="23" x2="45" y2="23" stroke="#207448" stroke-width="2"/>
    <line x1="38" y1="31" x2="45" y2="31" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="1215" y="585" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Resource managers</text>
  <text x="1215" y="622" font-family="sans-serif" font-size="24" fill="#303a36">CPU / memory /</text>
  <text x="1215" y="652" font-family="sans-serif" font-size="24" fill="#303a36">topology / device</text>

  
  
  <rect x="30" y="740" width="440" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(50, 775)">
