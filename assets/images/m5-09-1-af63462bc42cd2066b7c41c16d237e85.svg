  </g>
  <text x="1215" y="271" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Prober</text>
  <text x="1215" y="306" font-family="sans-serif" font-size="24" fill="#303a36">(startup/readiness/</text>
  <text x="1215" y="336" font-family="sans-serif" font-size="24" fill="#303a36">liveness)</text>

  
  <rect x="1140" y="390" width="430" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1160, 427)">
