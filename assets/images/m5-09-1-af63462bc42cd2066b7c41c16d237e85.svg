  </g>
  <text x="655" y="462" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod manager</text>
  <text x="655" y="498" font-family="sans-serif" font-size="24" fill="#303a36">/ config merge</text>

  
  <rect x="570" y="560" width="460" height="115" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(592, 592)">
    <circle cx="24" cy="24" r="10" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="24" cy="24" r="18" fill="none" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6,4"/>
    <path d="M 24 1 L 24 47 M 1 24 L 47 24 M 8 8 L 40 40 M 8 40 L 40 8" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="5" fill="#fff8f0" stroke="#db8129" stroke-width="2"/>
  </g>
  <text x="660" y="604" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Per-pod workers</text>
  <text x="660" y="642" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">(syncPod)</text>

  
  
  <rect x="1140" y="100" width="430" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1160, 128)">
    <rect x="0" y="6" width="30" height="38" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="8" y="0" width="14" height="8" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
    <path d="M 6 26 L 12 32 L 24 18" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1215" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Status manager</text>
  <text x="1215" y="176" font-family="sans-serif" font-size="24" fill="#303a36">→ API server</text>

  
  <rect x="1140" y="235" width="430" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1160, 271)">
    <circle cx="20" cy="24" r="20" fill="none" stroke="#207448" stroke-width="2.5"/>
