<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>What the kubelet does</title>
  <desc>Flowchart diagram showing the architecture, pod sources, control loops, workers, and managers of the Kubernetes kubelet.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What the kubelet does</text>

  
  <rect x="500" y="90" width="600" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8,6"/>
  <path d="M 522 106 L 536 106 L 542 114 L 565 114 L 565 130 L 522 130 Z" fill="none" stroke="#207448" stroke-width="2.5"/>
  <text x="575" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pod sources</text>

  
  <rect x="520" y="140" width="560" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(534, 155)">
    <rect x="0" y="8" width="38" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="6" y1="21" x2="10" y2="21" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="21" x2="18" y2="21" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 24 16 L 30 21 L 24 26" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="585" y="170" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">API server</text>
  <text x="585" y="199" font-family="sans-serif" font-size="24" fill="#303a36">(watch pods with</text>
  <text x="585" y="227" font-family="monospace" font-size="24" fill="#303a36">spec.nodeName=this node)</text>

  
  <rect x="520" y="250" width="560" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(536, 258)">
    <path d="M 0 0 L 18 0 L 26 8 L 26 34 L 0 34 Z" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 18 0 L 18 8 L 26 8" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="6" y1="16" x2="20" y2="16" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="16" y2="24" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="585" y="288" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Static pod manifests dir</text>

  
  <rect x="520" y="315" width="560" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(536, 323)">
    <circle cx="16" cy="19" r="15" fill="none" stroke="#207448" stroke-width="2.5"/>
    <ellipse cx="16" cy="19" rx="7" ry="15" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="1" y1="19" x2="31" y2="19" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="585" y="353" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">HTTP manifest URL (rare)</text>

  
  
  <rect x="20" y="135" width="430" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(42, 166)">
    <rect x="0" y="0" width="34" height="44" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 6 24 L 12 24 L 15 16 L 19 32 L 22 21 L 25 24 L 28 24" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="100" y="170" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node lease</text>
  <text x="100" y="202" font-family="sans-serif" font-size="24" fill="#303a36">+ node status</text>
  <text x="100" y="232" font-family="sans-serif" font-size="24" fill="#303a36">heartbeats</text>

  
  <rect x="20" y="295" width="430" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(42, 342)">
    <rect x="0" y="0" width="38" height="38" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="9" y1="28" x2="9" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="19" y1="28" x2="19" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="29" y1="28" x2="29" y2="14" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="100" y="333" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">cAdvisor/cgroup stats</text>
  <text x="100" y="370" font-family="monospace" font-size="24" fill="#303a36">→ /metrics,</text>
  <text x="100" y="404" font-family="monospace" font-size="24" fill="#303a36">/stats/summary</text>

  
  <rect x="20" y="480" width="430" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(40, 512)">
    <path d="M 22 2 L 44 40 L 0 40 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="22" y1="14" x2="22" y2="26" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="34" r="1.5" fill="#207448"/>
  </g>
  <text x="100" y="525" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Eviction manager</text>
  <text x="100" y="562" font-family="sans-serif" font-size="24" fill="#303a36">(node pressure)</text>

  
  
  <rect x="570" y="425" width="460" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(592, 450)">
