    <text x="144" y="788" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Playbook slow</text>

    
    <rect x="520" y="712" width="1040" height="132" rx="12" fill="#ffffff" stroke="#b6d5be" stroke-width="1.5"/>
    
    <rect x="544" y="728" width="245" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
