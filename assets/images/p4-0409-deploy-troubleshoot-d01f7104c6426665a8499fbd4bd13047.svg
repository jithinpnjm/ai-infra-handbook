    <rect x="799" y="284" width="165" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="815" y="315" font-family="monospace" font-size="24" fill="#303a36">nginx -t</text>
    
    <rect x="544" y="340" width="150" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="371" font-family="monospace" font-size="24" fill="#303a36">ss -ltnp</text>
    
    <rect x="714" y="340" width="195" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="730" y="371" font-family="monospace" font-size="24" fill="#303a36">ufw status</text>
  </g>

  
