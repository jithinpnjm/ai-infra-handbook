      <line x1="68" y1="186" x2="78" y2="186"/>
      <line x1="106" y1="186" x2="116" y2="186"/>
      <line x1="75" y1="169" x2="82" y2="176"/>
      <line x1="102" y1="196" x2="109" y2="203"/>
