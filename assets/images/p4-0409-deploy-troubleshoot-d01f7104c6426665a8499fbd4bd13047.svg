      <tspan x="144" dy="36">from nginx</tspan>
    </text>

    
    <rect x="520" y="268" width="1040" height="132" rx="12" fill="#ffffff" stroke="#b6d5be" stroke-width="1.5"/>
    
    <rect x="544" y="284" width="235" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
