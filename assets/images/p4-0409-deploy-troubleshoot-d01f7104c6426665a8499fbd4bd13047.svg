      <path d="M 70 456 v 32 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -32"/>
      <path d="M 70 472 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8"/>
