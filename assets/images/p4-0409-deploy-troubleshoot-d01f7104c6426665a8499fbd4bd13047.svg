      <tspan x="144" dy="36">per host</tspan>
    </text>

    
    <rect x="520" y="564" width="1040" height="132" rx="12" fill="#ffffff" stroke="#b6d5be" stroke-width="1.5"/>
    
    <rect x="544" y="608" width="190" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="639" font-family="monospace" font-size="24" fill="#303a36">pip freeze</text>
    
    <rect x="754" y="608" width="405" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="770" y="639" font-family="monospace" font-size="24" fill="#303a36">ansible-inventory --host</text>
  </g>

  
  <g>
    
    <rect x="40" y="712" width="460" height="132" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="92" cy="778" r="22"/>
      <line x1="92" y1="778" x2="92" y2="764"/>
      <line x1="92" y1="778" x2="105" y2="784"/>
      <circle cx="92" cy="778" r="3" fill="#207448"/>
