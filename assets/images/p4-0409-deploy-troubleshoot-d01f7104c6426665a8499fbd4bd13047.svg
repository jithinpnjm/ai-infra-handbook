      <tspan x="144" dy="0">Handler restarted</tspan>
      <tspan x="144" dy="36">too often</tspan>
    </text>

    
    <rect x="520" y="860" width="1040" height="132" rx="12" fill="#ffffff" stroke="#b6d5be" stroke-width="1.5"/>
    
    <rect x="544" y="876" width="380" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="907" font-family="sans-serif" font-size="24" fill="#303a36">non-idempotent templates</text>
    
    <rect x="544" y="932" width="415" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="963" font-family="sans-serif" font-size="24" fill="#303a36">two handlers on one topic</text>
  </g>

  
  <g>
    
    <rect x="40" y="1008" width="460" height="132" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
