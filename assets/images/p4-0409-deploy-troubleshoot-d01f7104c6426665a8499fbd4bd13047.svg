    <rect x="1029" y="728" width="305" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="1045" y="759" font-family="sans-serif" font-size="24" fill="#303a36">git clone per host</text>
    
    <rect x="544" y="784" width="120" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="815" font-family="sans-serif" font-size="24" fill="#303a36">forks</text>
    
    <rect x="684" y="784" width="185" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="700" y="815" font-family="sans-serif" font-size="24" fill="#303a36">pipelining</text>
  </g>

  
  <g>
    
    <rect x="40" y="860" width="460" height="132" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
