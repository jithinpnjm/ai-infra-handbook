    <rect x="520" y="120" width="1040" height="132" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    
    <rect x="544" y="136" width="475" height="44" rx="8" fill="#fef2e6" stroke="#db8129" stroke-width="1.5"/>
    <text x="560" y="167" font-family="monospace" font-size="24" fill="#303a36">journalctl -u fleetapp -n 100</text>
    
    <rect x="1039" y="136" width="280" height="44" rx="8" fill="#fef2e6" stroke="#db8129" stroke-width="1.5"/>
    <text x="1055" y="167" font-family="monospace" font-size="24" fill="#303a36">systemctl status</text>
    
    <rect x="544" y="192" width="565" height="44" rx="8" fill="#fef2e6" stroke="#db8129" stroke-width="1.5"/>
    <text x="560" y="223" font-family="sans-serif" font-size="24" fill="#303a36">run ExecStart manually as app user</text>
    
    <rect x="1129" y="192" width="235" height="44" rx="8" fill="#fef2e6" stroke="#db8129" stroke-width="1.5"/>
    <text x="1145" y="223" font-family="monospace" font-size="24" fill="#303a36">env file mode</text>
  </g>

  
  <g>
    
    <rect x="40" y="268" width="460" height="132" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
