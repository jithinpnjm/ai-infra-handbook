    <rect x="544" y="488" width="165" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="519" font-family="monospace" font-size="24" fill="#303a36">run_once</text>
    
    <rect x="729" y="488" width="135" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="745" y="519" font-family="sans-serif" font-size="24" fill="#303a36">backup</text>
  </g>

  
  <g>
    
    <rect x="40" y="564" width="460" height="132" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
