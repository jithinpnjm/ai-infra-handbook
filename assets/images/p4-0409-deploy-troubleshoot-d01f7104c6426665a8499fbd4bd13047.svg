<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Failed deploy symptom checks</title>
  <desc>Troubleshooting guide mapping deployment symptoms to specific operational checks and system commands</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Failed deploy symptom checks</text>

  
  <text x="56" y="104" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Symptom</text>
  <text x="536" y="104" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Checks</text>

  
  <g>
    
    <rect x="40" y="120" width="460" height="132" rx="12" fill="#fdf7f0" stroke="#db8129" stroke-width="3"/>
    
    <g stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round">
