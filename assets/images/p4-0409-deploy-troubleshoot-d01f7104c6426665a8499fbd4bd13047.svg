      <tspan x="144" dy="36">mid-way</tspan>
    </text>

    
    <rect x="520" y="416" width="1040" height="132" rx="12" fill="#ffffff" stroke="#b6d5be" stroke-width="1.5"/>
    
    <rect x="544" y="432" width="320" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="463" font-family="sans-serif" font-size="24" fill="#303a36">backward compatible</text>
    
