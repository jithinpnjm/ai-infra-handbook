    <rect x="520" y="1008" width="1040" height="132" rx="12" fill="#ffffff" stroke="#b6d5be" stroke-width="1.5"/>
    
    <rect x="544" y="1024" width="245" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="1055" font-family="sans-serif" font-size="24" fill="#303a36">LB not drained</text>
    
    <rect x="809" y="1024" width="335" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="825" y="1055" font-family="sans-serif" font-size="24" fill="#303a36">no graceful shutdown</text>
    
    <rect x="544" y="1080" width="305" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="1111" font-family="sans-serif" font-size="24" fill="#303a36">no readiness check</text>
    
    <rect x="869" y="1080" width="275" height="44" rx="8" fill="#eef5f0" stroke="#207448" stroke-width="1.5"/>
    <text x="885" y="1111" font-family="sans-serif" font-size="24" fill="#303a36">serial too large</text>
