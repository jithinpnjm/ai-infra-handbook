      <line x1="88" y1="627" x2="96" y2="627" stroke-width="2"/>
      <line x1="88" y1="633" x2="96" y2="633" stroke-width="2"/>
      <line x1="87" y1="636" x2="97" y2="624" stroke-width="2"/>
