<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Cutting a path apart with parameter expansion, no external commands</title>
  <desc>Visual explanation of shell parameter expansion for string manipulation and path parsing without external commands.</desc>

  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="60" dy="0">Cutting a path apart with parameter expansion,</tspan>
    <tspan x="60" dy="56">no external commands</tspan>
  </text>

  
  <rect x="60" y="165" width="1020" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(85, 202)">
    <path d="M 4 12 L 20 12 L 26 20 L 52 20 A 4 4 0 0 1 56 24 L 56 48 A 4 4 0 0 1 52 52 L 4 52 A 4 4 0 0 1 0 48 L 0 16 A 4 4 0 0 1 4 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="16" y1="36" x2="40" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <text x="155" y="212" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">path=/data/run42/model.final.ckpt</text>

  
  <rect x="360" y="228" width="225" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="472" y="263" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">/data/run42</text>

  
  <rect x="585" y="228" width="50" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="610" y="263" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">/</text>

  
  <rect x="635" y="228" width="215" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="742" y="263" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">model.final</text>

  
  <rect x="850" y="228" width="50" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="875" y="263" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">.</text>

  
  <rect x="900" y="228" width="160" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="980" y="263" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">ckpt</text>

  
  <rect x="60" y="310" width="1020" height="145" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  
  
  <g transform="translate(85, 326)">
    <circle cx="14" cy="14" r="8" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <circle cx="14" cy="38" r="8" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <line x1="20" y1="18" x2="46" y2="44" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="34" x2="46" y2="8" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="145" y="358" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#db8129">${path##*/}</text>
  
  
  <rect x="360" y="330" width="275" height="34" rx="6" fill="#e2e8e5" stroke="#9aa39e" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="375" y1="347" x2="620" y2="347" stroke="#9aa39e" stroke-width="2"/>
  <rect x="635" y="330" width="425" height="34" rx="6" fill="#fbeada" stroke="#db8129" stroke-width="2.5"/>

  
  <text x="85" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">removes the longest matching prefix up to the last slash:</tspan>
    <tspan x="85" dy="32">result 'model.final.ckpt' (same as basename)</tspan>
  </text>

  
  <rect x="60" y="470" width="1020" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(85, 486)">
    <circle cx="14" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="14" cy="38" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="20" y1="18" x2="46" y2="44" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="34" x2="46" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="145" y="518" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">${path%/*}</text>
  
  
  <rect x="360" y="490" width="225" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <rect x="585" y="490" width="475" height="34" rx="6" fill="#e2e8e5" stroke="#9aa39e" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="600" y1="507" x2="1045" y2="507" stroke="#9aa39e" stroke-width="2"/>

  
  <text x="85" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">removes the shortest matching suffix starting at the last slash:</tspan>
    <tspan x="85" dy="32">result '/data/run42' (same as dirname)</tspan>
  </text>

  
  <rect x="60" y="630" width="1020" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(85, 646)">
    <circle cx="14" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="14" cy="38" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="20" y1="18" x2="46" y2="44" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="34" x2="46" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="145" y="678" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">${path%.*}</text>
  
  
  <rect x="360" y="650" width="490" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <rect x="850" y="650" width="210" height="34" rx="6" fill="#e2e8e5" stroke="#9aa39e" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="865" y1="667" x2="1045" y2="667" stroke="#9aa39e" stroke-width="2"/>

  
  <text x="85" y="722" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">removes the shortest suffix starting at the last dot:</tspan>
    <tspan x="85" dy="32">result '/data/run42/model.final'</tspan>
  </text>

  
  <rect x="60" y="790" width="1020" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(85, 806)">
    <circle cx="14" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="14" cy="38" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="20" y1="18" x2="46" y2="44" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="34" x2="46" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="145" y="838" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">${path##*.}</text>
  
  
  <rect x="360" y="810" width="540" height="34" rx="6" fill="#e2e8e5" stroke="#9aa39e" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="375" y1="827" x2="885" y2="827" stroke="#9aa39e" stroke-width="2"/>
  <rect x="900" y="810" width="160" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <text x="85" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">removes the longest prefix up to the last dot:</tspan>
    <tspan x="85" dy="32">result 'ckpt'</tspan>
  </text>

  
  <rect x="1110" y="165" width="430" height="770" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1145, 195)">
    <circle cx="18" cy="18" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 28 28 L 52 52 L 44 60 M 42 42 L 52 32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <rect x="1135" y="280" width="380" height="175" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1155" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1155" dy="0" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448"># / ##</tspan>
    <tspan x="1155" dy="44">remove shortest /</tspan>
    <tspan x="1155" dy="34">longest prefix</tspan>
  </text>

  
  <rect x="1135" y="480" width="380" height="175" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1155" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1155" dy="0" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">% / %%</tspan>
    <tspan x="1155" dy="44">remove shortest /</tspan>
    <tspan x="1155" dy="34">longest suffix</tspan>
  </text>

  
  <rect x="1135" y="680" width="380" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1155" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1155" dy="0" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">${#path}</tspan>
    <tspan x="1155" dy="46">length</tspan>
  </text>

  
  <rect x="60" y="965" width="1480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(85, 992)">
    <path d="M 28 6 L 50 14 L 50 32 C 50 46 28 56 28 56 C 28 56 6 46 6 32 L 6 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 20 30 L 26 36 L 38 24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <rect x="170" y="985" width="410" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="375" y="1029" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">${var:-default}</text>

  
  <rect x="620" y="985" width="410" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="825" y="1029" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">${var:=default}</text>

  
  <rect x="1070" y="985" width="440" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1290" y="1029" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">${var:?message}</text>

</svg>