<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Common variable mistakes in two groups</title>
  <desc>Infographic illustrating common Ansible variable mistakes grouped into Defaults, facts and scope, and Formatting and types.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Common variable mistakes in two groups</text>

  
  <g id="opening-strip">
    <rect x="40" y="85" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="65" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">variable mistakes look like random behaviour: a value changes between runs or a task uses</tspan>
      <tspan x="65" dy="32">an old value you thought was gone; most come from a variable defined in two places,</tspan>
      <tspan x="65" dy="32">where nobody noticed the second definition</tspan>
    </text>
  </g>

  
  <g id="group-1">
    <rect x="40" y="215" width="740" height="745" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="60" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Defaults, facts and scope</text>

    
    <rect x="60" y="280" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <polygon points="102,318 126,362 78,362" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="102" y1="332" x2="102" y2="346" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="102" cy="354" r="2.5" fill="#207448"/>
    </g>
    <text x="144" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">variables without defaults or</tspan>
      <tspan x="144" dy="30">validation: missing values surface in</tspan>
      <tspan x="144" dy="30">the middle of a fleet run</tspan>
    </text>

    
    <rect x="60" y="415" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <line x1="80" y1="457" x2="124" y2="457" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="92" cy="457" r="5" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="80" y1="475" x2="124" y2="475" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="112" cy="475" r="5" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="80" y1="493" x2="124" y2="493" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="98" cy="493" r="5" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="144" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">overridable settings in role <tspan font-family="ui-monospace, monospace">vars/</tspan>, or <tspan font-family="ui-monospace, monospace">-e</tspan></tspan>
      <tspan x="144" dy="30">as the normal way to configure</tspan>
      <tspan x="144" dy="30">a role</tspan>
    </text>

    
    <rect x="60" y="550" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <rect x="80" y="593" width="44" height="28" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="92" y1="621" x2="112" y2="621" stroke="#207448" stroke-width="4"/>
      <line x1="102" y1="621" x2="102" y2="628" stroke="#207448" stroke-width="4"/>
      <circle cx="102" cy="607" r="4" fill="#207448"/>
    </g>
    <text x="144" y="586" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="144" dy="0"><tspan font-family="ui-monospace, monospace">set_fact</tspan> treated as global assignment:</tspan>
      <tspan x="144" dy="30">forgetting its host scope and</tspan>
      <tspan x="144" dy="30"><tspan font-family="ui-monospace, monospace">run_once</tspan> behaviour</tspan>
    </text>

    
    <rect x="60" y="685" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <rect x="78" y="730" width="20" height="28" rx="2" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="83" y1="738" x2="93" y2="738" stroke="#207448" stroke-width="3"/>
      <rect x="106" y="730" width="20" height="28" rx="2" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="111" y1="738" x2="121" y2="738" stroke="#207448" stroke-width="3"/>
      <line x1="99" y1="741" x2="105" y2="747" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="99" y1="747" x2="105" y2="741" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="144" y="721" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">cross-host templates relying on</tspan>
      <tspan x="144" dy="30"><tspan font-family="ui-monospace, monospace">hostvars</tspan> facts that were</tspan>
      <tspan x="144" dy="30">never gathered</tspan>
    </text>

    
    <rect x="60" y="820" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <circle cx="102" cy="888" r="4" fill="#207448"/>
      <path d="M 92 880 A 14 14 0 0 1 112 880" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 83 871 A 26 26 0 0 1 121 871" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="102" y1="892" x2="102" y2="903" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="144" y="856" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">gathering all facts everywhere on</tspan>
      <tspan x="144" dy="30">huge fleets, or disabling facts and</tspan>
      <tspan x="144" dy="30">then using <tspan font-family="ui-monospace, monospace">ansible_*</tspan> variables</tspan>
    </text>
  </g>

  
  <g id="group-2">
    <rect x="820" y="215" width="740" height="745" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="840" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Formatting and types</text>

    
    <rect x="840" y="280" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <polyline points="872,328 860,340 872,352" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="886" y1="324" x2="878" y2="356" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polyline points="892,328 904,340 892,352" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="924" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="924" dy="0">mixing old injected names such as</tspan>
      <tspan x="924" dy="30"><tspan font-family="ui-monospace, monospace">ansible_distribution</tspan> with</tspan>
      <tspan x="924" dy="30"><tspan font-family="ui-monospace, monospace">ansible_facts[...]</tspan></tspan>
    </text>

    
    <rect x="840" y="415" width="700" height="120" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(0, 0)">
      <path d="M 882 453 A 19 19 0 1 1 865 478" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      <polygon points="882,447 882,459 893,453" fill="#db8129"/>
      <circle cx="882" cy="475" r="3" fill="#db8129"/>
      <line x1="882" y1="475" x2="882" y2="465" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="882" y1="475" x2="891" y2="475" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="924" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="924" dy="0">non-deterministic output: unsorted</tspan>
      <tspan x="924" dy="30">dicts, sets or timestamps restart</tspan>
      <tspan x="924" dy="30">handlers for no reason</tspan>
    </text>

    
    <rect x="840" y="550" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <rect x="862" y="593" width="40" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="871" y1="603" x2="871" y2="612" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="875" y1="603" x2="875" y2="612" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="882" y1="601" x2="882" y2="619" stroke="#207448" stroke-width="2" stroke-dasharray="2 2"/>
      <circle cx="892" cy="610" r="4.5" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="924" y="601" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="924" dy="0">booleans kept as strings, or</tspan>
      <tspan x="924" dy="32">version strings parsed as floats</tspan>
    </text>

    
    <rect x="840" y="685" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <path d="M 865 726 L 891 726 L 899 734 L 899 764 L 865 764 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 891 726 L 891 734 L 899 734" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="872" y1="744" x2="884" y2="744" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="872" y1="752" x2="892" y2="752" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="924" y="721" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="924" dy="0">complex Jinja inside YAML where a</tspan>
      <tspan x="924" dy="30">small module, filter plugin or</tspan>
      <tspan x="924" dy="30">precomputed variable would be clearer</tspan>
    </text>

    
    <rect x="840" y="820" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(0, 0)">
      <rect x="867" y="868" width="30" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 874 868 L 874 861 A 8 8 0 0 1 890 861 L 890 868" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="882" cy="878" r="2.5" fill="#207448"/>
      <line x1="882" y1="881" x2="882" y2="886" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="924" y="871" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="924" dy="0">secrets printed in debug output, or in</tspan>
      <tspan x="924" dy="32">registered variables shown at <tspan font-family="ui-monospace, monospace">-v</tspan></tspan>
    </text>
  </g>

  
  <g id="closing-strip">
    <rect x="40" y="980" width="1520" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="65" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">give every optional value a default and gather facts before you template across hosts;</tspan>
      <tspan x="65" dy="32">write down which layer owns each variable you add</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1090" width="1520" height="70" rx="10" fill="#207448"/>
    <text x="800" y="1134" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The fix is rarely a clever trick, it is a habit</text>
  </g>
</svg>