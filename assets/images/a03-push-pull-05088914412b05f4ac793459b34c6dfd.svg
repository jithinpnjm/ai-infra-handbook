<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>Push sends work out, pull lets each machine ask for it</title>
  <desc>Visual comparison between push-based architecture like Ansible and pull-based agent architecture like Puppet, Chef, and Salt.</desc>

  <defs>
    <marker id="arrow-down" viewBox="0 0 12 12" refX="6" refY="11" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 6 11 L 11 1 Z" fill="#207448" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 12 12" refX="6" refY="1" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 11 L 6 1 L 11 11 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Push sends work out, pull lets each machine ask for it</text>

  
  <g id="push-panel">
    
    <rect x="50" y="110" width="730" height="700" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="415" y="155" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Push (Ansible)</text>

    
    <rect x="245" y="185" width="340" height="95" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(295, 232)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="0" cy="0" r="6" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="0" y1="-23" x2="0" y2="-16" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="16" x2="0" y2="23" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="-23" y1="0" x2="-16" y2="0" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="16" y1="0" x2="23" y2="0" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="-16" y1="-16" x2="-11" y2="-11" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="11" y1="11" x2="16" y2="16" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="16" y1="-16" x2="11" y2="-11" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <line x1="-11" y1="11" x2="-16" y2="16" stroke="#207448" stroke-width="6" stroke-linecap="round" />
    </g>
    <text x="340" y="242" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Control node</text>

    
    <line x1="415" y1="280" x2="415" y2="320" stroke="#207448" stroke-width="3" />
    
    
    <rect x="255" y="320" width="320" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="415" y="352" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">SSH: sends the task</text>
    
    
    <line x1="415" y1="368" x2="415" y2="420" stroke="#207448" stroke-width="3" />
    <line x1="190" y1="420" x2="640" y2="420" stroke="#207448" stroke-width="3" />
    <line x1="190" y1="420" x2="190" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />
    <line x1="415" y1="420" x2="415" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />
    <line x1="640" y1="420" x2="640" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

    
    <rect x="95" y="480" width="190" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(190, 525)">
      <rect x="-22" y="-14" width="44" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-12" y1="-1" x2="4" y2="-1" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="-1" r="2.5" fill="#207448" />
      <line x1="-8" y1="12" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="-14" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" />
    </g>
    <text x="190" y="585" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web1</text>

    
    <rect x="320" y="480" width="190" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(415, 525)">
      <rect x="-22" y="-14" width="44" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-12" y1="-1" x2="4" y2="-1" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="-1" r="2.5" fill="#207448" />
      <line x1="-8" y1="12" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="-14" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" />
    </g>
    <text x="415" y="585" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web2</text>

    
    <rect x="545" y="480" width="190" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(640, 525)">
      <rect x="-22" y="-14" width="44" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-12" y1="-1" x2="4" y2="-1" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="-1" r="2.5" fill="#207448" />
      <line x1="-8" y1="12" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="-14" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" />
    </g>
    <text x="640" y="585" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web3</text>

    
    <rect x="75" y="650" width="680" height="80" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="415" y="682" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">No agent is installed on the targets.</text>
    <text x="415" y="714" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">The control node decides when work happens.</text>
  </g>

  
  <g id="pull-panel">
    
    <rect x="820" y="110" width="730" height="700" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1185" y="155" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Pull (agent-based)</text>

    
    <rect x="1015" y="185" width="340" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(1060, 232)">
      <rect x="-24" y="-18" width="48" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="-14" cy="-10" r="2" fill="#207448" />
      <circle cx="-6" cy="-10" r="2" fill="#207448" />
      <line x1="8" y1="-10" x2="16" y2="-10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <rect x="-24" y="3" width="48" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="-14" cy="11" r="2" fill="#207448" />
      <circle cx="-6" cy="11" r="2" fill="#207448" />
      <line x1="8" y1="11" x2="16" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1100" y="242" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Central server</text>

    
    <line x1="1185" y1="320" x2="1185" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-up)" />
    
    
    <rect x="1060" y="320" width="250" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1185" y="352" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">asks for work</text>
    
    
    <line x1="1185" y1="420" x2="1185" y2="368" stroke="#207448" stroke-width="3" />
    <line x1="960" y1="420" x2="1410" y2="420" stroke="#207448" stroke-width="3" />
    <line x1="960" y1="480" x2="960" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-up)" />
    <line x1="1185" y1="480" x2="1185" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-up)" />
    <line x1="1410" y1="480" x2="1410" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-up)" />

    
    <rect x="865" y="480" width="190" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(960, 510)">
      <rect x="-22" y="-14" width="44" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-12" y1="-1" x2="4" y2="-1" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="-1" r="2.5" fill="#207448" />
      <line x1="-8" y1="12" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="-14" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" />
    </g>
    <text x="960" y="555" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web1</text>
    <rect x="910" y="575" width="100" height="36" rx="6" fill="#207448" />
    <text x="960" y="601" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">agent</text>

    
    <rect x="1090" y="480" width="190" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(1185, 510)">
      <rect x="-22" y="-14" width="44" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-12" y1="-1" x2="4" y2="-1" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="-1" r="2.5" fill="#207448" />
      <line x1="-8" y1="12" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="-14" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" />
    </g>
    <text x="1185" y="555" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web2</text>
    <rect x="1135" y="575" width="100" height="36" rx="6" fill="#207448" />
    <text x="1185" y="601" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">agent</text>

    
    <rect x="1315" y="480" width="190" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(1410, 510)">
      <rect x="-22" y="-14" width="44" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-12" y1="-1" x2="4" y2="-1" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="-1" r="2.5" fill="#207448" />
      <line x1="-8" y1="12" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="-14" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" />
    </g>
    <text x="1410" y="555" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">web3</text>
    <rect x="1360" y="575" width="100" height="36" rx="6" fill="#207448" />
    <text x="1410" y="601" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">agent</text>

    
    <rect x="845" y="650" width="680" height="80" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="1185" y="682" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Each machine decides when to ask.</text>
    <text x="1185" y="714" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">An agent runs on every machine.</text>
  </g>

  
  <rect x="490" y="845" width="620" height="52" rx="26" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="880" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Puppet, Chef and Salt pull. Ansible pushes.</text>
</svg>