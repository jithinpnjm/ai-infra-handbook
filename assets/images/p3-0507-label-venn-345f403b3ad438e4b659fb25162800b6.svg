<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Labels cut across the same pods in different slices</title>
  <desc>Visual infographic explaining Kubernetes label selectors cutting across Deployments and Pods in multiple slices.</desc>

  
  <rect width="1600" height="1260" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Labels cut across the same pods in different slices</text>

  
  <g id="operator-strip">
    <rect x="50" y="95" width="1500" height="72" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(70, 108)">
      <rect width="215" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="107" y="31" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">key=value</text>
    </g>

    <g transform="translate(310, 108)">
      <rect width="215" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="107" y="31" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">key!=value</text>
    </g>

    <g transform="translate(550, 108)">
      <rect width="235" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="117" y="31" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">key in (a,b)</text>
    </g>

    <g transform="translate(810, 108)">
      <rect width="275" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="137" y="31" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">key notin (a,b)</text>
    </g>

    <g transform="translate(1110, 108)">
      <rect width="180" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="90" y="31" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">key</text>
    </g>

    <g transform="translate(1315, 108)">
      <rect width="215" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="107" y="31" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">!key</text>
    </g>
  </g>

  
  
  
  <g id="alpaca-prod-group">
    <rect x="50" y="210" width="320" height="580" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="186" y="232" width="48" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="186" y1="246" x2="234" y2="246" stroke="#207448" stroke-width="3"/>
    <circle cx="196" cy="239" r="2.5" fill="#207448"/>
    <circle cx="206" cy="239" r="2.5" fill="#207448"/>

    <text x="210" y="304" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">alpaca-prod</text>
    <text x="210" y="338" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(app=alpaca,</text>
    <text x="210" y="368" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">env=prod, ver=1)</text>
    <text x="210" y="408" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">two pods</text>

    
    <rect x="75" y="445" width="270" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="210" cy="495" r="24" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="198" y="483" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="210" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod</text>

    
    <rect x="75" y="615" width="270" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="210" cy="665" r="24" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="198" y="653" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="210" y="725" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod</text>
  </g>

  
  <g id="ring-ver-2">
    
    <rect x="395" y="210" width="1155" height="580" rx="22" fill="#eaf2ec" fill-opacity="0.45" stroke="#207448" stroke-width="3" stroke-dasharray="12 8"/>

    
    <g transform="translate(425, 188)">
      <rect width="170" height="44" rx="22" fill="#207448"/>
      <text x="85" y="30" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff">ver=2</text>
    </g>

    
    <g id="alpaca-test-group">
      <rect x="420" y="250" width="310" height="515" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <rect x="551" y="272" width="48" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="551" y1="286" x2="599" y2="286" stroke="#207448" stroke-width="3"/>
      <circle cx="561" cy="279" r="2.5" fill="#207448"/>
      <circle cx="571" cy="279" r="2.5" fill="#207448"/>

      <text x="575" y="344" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">alpaca-test</text>
      <text x="575" y="378" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(app=alpaca,</text>
      <text x="575" y="408" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">env=test, ver=2)</text>
      <text x="575" y="448" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">one pod</text>

      
      <rect x="445" y="485" width="260" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="575" cy="585" r="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="561" y="571" width="28" height="28" rx="5" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="575" y="665" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod</text>
    </g>

    
    <g id="ring-bandicoot">
      
      <rect x="755" y="245" width="770" height="525" rx="18" fill="#e2ede5" stroke="#db8129" stroke-width="3.5"/>

      
      <g transform="translate(780, 260)">
        <rect width="720" height="85" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
        <text x="360" y="38" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">app=bandicoot,ver=2</text>
        <text x="360" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(comma means AND)</text>
      </g>

      
      <g id="bandicoot-prod-group">
        <rect x="780" y="360" width="345" height="390" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        
        <text x="952" y="398" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">bandicoot-prod</text>
        <text x="952" y="430" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(app=bandicoot,</text>
        <text x="952" y="460" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">env=prod, ver=2)</text>
        <text x="952" y="496" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">two pods</text>

        
        <rect x="802" y="520" width="300" height="98" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <rect x="822" y="547" width="44" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="952" y="578" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod</text>

        
        <rect x="802" y="632" width="300" height="98" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <rect x="822" y="659" width="44" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="952" y="690" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod</text>
      </g>

      
      <g id="bandicoot-staging-group">
        <rect x="1155" y="360" width="345" height="390" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        
        <text x="1327" y="398" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">bandicoot-staging</text>
        <text x="1327" y="430" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(app=bandicoot,</text>
        <text x="1327" y="460" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">env=staging, ver=2)</text>
        <text x="1327" y="496" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">one pod</text>

        
        <rect x="1178" y="520" width="300" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="1327" cy="605" r="28" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <rect x="1313" y="591" width="28" height="28" rx="5" fill="none" stroke="#207448" stroke-width="2.5"/>
        <text x="1327" y="680" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod</text>
      </g>
    </g>
  </g>

  
  
  
  <g id="result-table">
    <rect x="50" y="820" width="940" height="390" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(80, 845)">
      <rect width="880" height="72" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="40" y="45" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">ver=2 -&gt; 4 pods</text>
    </g>

    
    <g transform="translate(80, 935)">
      <rect width="880" height="72" rx="10" fill="#fef6ed" stroke="#db8129" stroke-width="2"/>
      <text x="40" y="45" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">app=bandicoot,ver=2 -&gt; 3 pods</text>
    </g>

    
    <g transform="translate(80, 1025)">
      <rect width="880" height="72" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="40" y="45" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">app in (alpaca,bandicoot) -&gt; all 6</text>
    </g>

    
    <g transform="translate(80, 1115)">
      <rect width="880" height="72" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="40" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">canary (key is set) -&gt; only alpaca-test after kubectl label</text>
    </g>
  </g>

  
  <g id="warning-panel">
    <rect x="1020" y="820" width="530" height="390" rx="18" fill="#ffffff" stroke="#db8129" stroke-width="2"/>

    
    <g transform="translate(1257, 855)">
      <polygon points="28,4 54,48 2,48" fill="#fef6ed" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="41" r="2.5" fill="#db8129"/>
    </g>

    
    <text x="1285" y="960" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="1285" dy="0">kubectl label on a Deployment</tspan>
      <tspan x="1285" dy="42">changes only the Deployment,</tspan>
      <tspan x="1285" dy="42">not its ReplicaSets or Pods</tspan>
    </text>
  </g>
</svg>