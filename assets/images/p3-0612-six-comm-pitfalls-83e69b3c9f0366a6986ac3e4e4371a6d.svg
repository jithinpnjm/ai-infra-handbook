<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Six multinode communication pitfalls with numbers</title>
  <desc>Visual infographic detailing six key multinode communication pitfalls, performance costs, and diagnostic remedies.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Six multinode communication pitfalls with numbers</text>

  
  <g transform="translate(50, 105)">
    
    <rect width="730" height="320" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(28, 24)">
      <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
      <rect x="18" y="18" width="20" height="20" fill="none" stroke="#db8129" stroke-width="3"/>
      
      <line x1="16" y1="0" x2="16" y2="8" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="0" x2="28" y2="8" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="0" x2="40" y2="8" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="48" x2="16" y2="56" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="48" x2="28" y2="56" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="48" x2="40" y2="56" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="8" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="28" x2="8" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="40" x2="8" y2="40" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="56" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="28" x2="56" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="40" x2="56" y2="40" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="96" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">1 gloo instead of nccl:</text>

    
    <text x="28" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">collectives go through host memory and TCP</tspan>
      <tspan x="28" dy="35">not GPUDirect RDMA; lower bound 400 MB</tspan>
      <tspan x="28" dy="35">over a 2 GB/s TCP path takes at least 200 ms</tspan>
      <tspan x="28" dy="35">while 100 GB/s InfiniBand takes about 4 ms</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 105)">
    
    <rect width="730" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(28, 24)">
      <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="4" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="3"/>
      <circle cx="12" cy="11" r="2" fill="#207448"/>
      <circle cx="18" cy="11" r="2" fill="#207448"/>
      <circle cx="24" cy="11" r="2" fill="#207448"/>
      <line x1="14" y1="30" x2="42" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="40" x2="30" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="96" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="96" dy="0">2 Mismatched NCCL versions</tspan>
      <tspan x="96" dy="34">across nodes</tspan>
    </text>

    
    <text x="28" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">(PyTorch bundled NCCL versus system libnccl):</tspan>
      <tspan x="28" dy="35">hangs or silent fallbacks; print</tspan>
      <tspan x="28" dy="35" font-family="monospace, monospace">torch.cuda.nccl.version()</tspan>
      <tspan x="28" dy="35">on every rank at startup</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 465)">
    
    <rect width="730" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(28, 24)">
      <circle cx="28" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
      <line x1="28" y1="6" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="12" x2="17" y2="17" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="39" y1="39" x2="44" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="44" x2="17" y2="39" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="39" y1="17" x2="44" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="96" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="96" dy="0">3 TCP port exhaustion</tspan>
      <tspan x="96" dy="34">in bootstrap:</tspan>
    </text>

    
    <text x="28" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">narrow <tspan font-family="monospace, monospace">ip_local_port_range</tspan>; widen in</tspan>
      <tspan x="28" dy="35"><tspan font-family="monospace, monospace">/etc/sysctl.conf</tspan> and set</tspan>
      <tspan x="28" dy="35"><tspan font-family="monospace, monospace">NCCL_SOCKET_IFNAME</tspan> and <tspan font-family="monospace, monospace">MASTER_PORT</tspan></tspan>
      <tspan x="28" dy="35">explicitly</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 465)">
    
    <rect width="730" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(28, 24)">
      <rect x="6" y="10" width="44" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 20 46 L 20 38 L 36 38 L 36 46" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="14" y1="18" x2="22" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="18" x2="42" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="26" x2="34" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="96" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="96" dy="0">4 Silent fallback to</tspan>
      <tspan x="96" dy="34"><tspan font-family="monospace, monospace">eth0</tspan>, <tspan font-family="monospace, monospace">docker0</tspan> or <tspan font-family="monospace, monospace">lo</tspan>:</tspan>
    </text>

    
    <text x="28" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">missing <tspan font-family="monospace, monospace">/dev/infiniband</tspan> mounts in</tspan>
      <tspan x="28" dy="35">containers or wrong RoCE GID index; read</tspan>
      <tspan x="28" dy="35"><tspan font-family="monospace, monospace">NCCL_DEBUG=INFO</tspan> transport lines,</tspan>
      <tspan x="28" dy="35" font-family="monospace, monospace">lsmod | grep nvidia_peermem</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 825)">
    
    <rect width="730" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(28, 24)">
      <circle cx="28" cy="30" r="20" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 18 L 28 30 L 37 30" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="4" x2="34" y2="4" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="4" x2="28" y2="10" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="96" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">5 Straggler nodes:</text>

    
    <text x="28" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">the slowest GPU sets step time for everyone;</tspan>
      <tspan x="28" dy="35" font-family="monospace, monospace">TORCH_NCCL_ENABLE_MONITORING=1</tspan>,
      <tspan x="28" dy="35" font-family="monospace, monospace">TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC</tspan>,
      <tspan x="28" dy="35" font-family="monospace, monospace">TORCH_NCCL_ASYNC_ERROR_HANDLING=1</tspan>
      <tspan x="28" dy="35">so stalled ranks abort instead of hanging</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 825)">
    
    <rect width="730" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(28, 24)">
      <rect x="6" y="6" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="12" y="12" width="12" height="12" fill="#207448" rx="2"/>
      <rect x="28" y="12" width="16" height="12" fill="none" stroke="#207448" stroke-width="3" rx="2"/>
      <rect x="12" y="28" width="18" height="16" fill="none" stroke="#207448" stroke-width="3" rx="2"/>
      <rect x="34" y="28" width="10" height="16" fill="#207448" rx="2"/>
    </g>

    
    <text x="96" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="96" dy="0">6 Allocator fragmentation</tspan>
      <tspan x="96" dy="34">under UCX and RDMA:</tspan>
    </text>

    
    <text x="28" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">PyTorch caching allocator keeps freed blocks,</tspan>
      <tspan x="28" dy="34">reserved memory can grow while allocated</tspan>
      <tspan x="28" dy="34">reads zero; <tspan font-family="monospace, monospace">PYTORCH_ALLOC_CONF</tspan> with</tspan>
      <tspan x="28" dy="34"><tspan font-family="monospace, monospace">max_split_size_mb:128</tspan> and</tspan>
      <tspan x="28" dy="34" font-family="monospace, monospace">expandable_segments</tspan>
    </text>
  </g>
</svg>