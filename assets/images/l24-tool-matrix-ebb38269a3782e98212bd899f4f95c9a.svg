<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Which kind of tool</title>
  <desc>A two-by-three matrix comparing system-wide and per-process tools across counters, profiling, and tracing.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Which kind of tool</text>

  

  
  <g id="col-system-wide">
    <rect x="360" y="120" width="410" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(378, 137)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="19" x2="56" y2="19" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="37" x2="56" y2="37" stroke="#207448" stroke-width="3"/>
      <circle cx="12" cy="10" r="3" fill="#207448"/>
      <circle cx="12" cy="28" r="3" fill="#207448"/>
      <circle cx="12" cy="46" r="3" fill="#207448"/>
      <line x1="26" y1="10" x2="44" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="46" x2="44" y2="46" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="454" y="176" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">System-wide</text>
  </g>

  
  <g id="col-per-process">
    <rect x="790" y="120" width="410" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(808, 137)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="3"/>
      <circle cx="10" cy="9" r="2.5" fill="#207448"/>
      <circle cx="19" cy="9" r="2.5" fill="#207448"/>
      <circle cx="28" cy="9" r="2.5" fill="#207448"/>
      <path d="M 14 30 L 22 37 L 14 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="44" x2="42" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="884" y="176" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Per-process</text>
  </g>

  
  <g id="col-side-note">
    <rect x="1220" y="120" width="330" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1238, 137)">
      <rect x="4" y="0" width="48" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="14" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="40" x2="32" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="1312" y="176" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side note</text>
  </g>

  

  
  <g id="row-counters">
    <rect x="50" y="234" width="290" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 280)">
      <path d="M 6 44 A 24 24 0 1 1 50 44" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="32" x2="42" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="32" r="4" fill="#207448"/>
      <line x1="9" y1="22" x2="15" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="12" x2="28" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="47" y1="22" x2="41" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="195" y="410" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Counters</text>
  </g>

  
  <g id="cell-counters-system-wide">
    <rect x="360" y="234" width="410" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="565" y="348" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="565" dy="0">vmstat, mpstat,</tspan>
      <tspan x="565" dy="44">iostat, sar</tspan>
    </text>
  </g>

  
  <g id="cell-counters-per-process">
    <rect x="790" y="234" width="410" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="995" y="348" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="995" dy="0">ps, top, pidstat,</tspan>
      <tspan x="995" dy="44">/proc/PID/*</tspan>
    </text>
  </g>

  
  <g id="note-counters">
    <rect x="1220" y="234" width="330" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1357, 266)">
      <path d="M 6 36 A 20 20 0 1 1 50 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="26" x2="39" y2="15" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="26" r="3" fill="#207448"/>
    </g>
    <text x="1385" y="352" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1385" dy="0">counters are like</tspan>
      <tspan x="1385" dy="36">an odometer,</tspan>
      <tspan x="1385" dy="36">read twice</tspan>
    </text>
  </g>

  

  
  <g id="row-profiling">
    <rect x="50" y="518" width="290" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 560)">
      <rect x="2" y="14" width="52" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 16 14 L 20 6 L 36 6 L 40 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="28" cy="33" r="11" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="44" cy="22" r="2" fill="#207448"/>
    </g>
    <text x="195" y="675" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#207448">
      <tspan x="195" dy="0" font-size="30">Profiling</tspan>
      <tspan x="195" dy="38" font-size="26">(sampling)</tspan>
    </text>
  </g>

  
  <g id="cell-profiling-system-wide">
    <rect x="360" y="518" width="410" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="565" y="632" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="565" dy="0">perf record,</tspan>
      <tspan x="565" dy="44">perf top</tspan>
    </text>
  </g>

  
  <g id="cell-profiling-per-process">
    <rect x="790" y="518" width="410" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="995" y="632" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="995" dy="0">py-spy, gprof,</tspan>
      <tspan x="995" dy="44">cProfile</tspan>
    </text>
  </g>

  
  <g id="note-profiling">
    <rect x="1220" y="518" width="330" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1357, 545)">
      <rect x="6" y="10" width="44" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 18 10 L 21 4 L 35 4 L 38 10 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="28" cy="25" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1385" y="618" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1385" dy="0">profiling is a camera</tspan>
      <tspan x="1385" dy="34">taking one photo</tspan>
      <tspan x="1385" dy="34">per interval,</tspan>
      <tspan x="1385" dy="34">e.g. 99 Hz</tspan>
    </text>
  </g>

  

  
  <g id="row-tracing">
    <rect x="50" y="802" width="290" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 846)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="2 3"/>
      <path d="M 6 28 L 16 28 L 22 8 L 28 48 L 34 20 L 40 36 L 46 28 L 50 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="8" r="3" fill="#207448"/>
      <circle cx="34" cy="20" r="3" fill="#207448"/>
    </g>
    <text x="195" y="960" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#207448">
      <tspan x="195" dy="0" font-size="30">Tracing</tspan>
      <tspan x="195" dy="38" font-size="26">(every event)</tspan>
    </text>
  </g>

  
  <g id="cell-tracing-system-wide">
    <rect x="360" y="802" width="410" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="565" y="916" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="565" dy="0">perf trace, Ftrace,</tspan>
      <tspan x="565" dy="44">bpftrace, tcpdump</tspan>
    </text>
  </g>

  
  <g id="cell-tracing-per-process">
    <rect x="790" y="802" width="410" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="995" y="916" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="995" dy="0">strace, ltrace,</tspan>
      <tspan x="995" dy="44">gdb</tspan>
    </text>
  </g>

  
  <g id="note-tracing">
    <rect x="1220" y="802" width="330" height="260" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(1357, 826)">
      <path d="M 28 6 L 50 44 L 6 44 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="30" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="37" r="2" fill="#db8129"/>
    </g>
    <text x="1385" y="904" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="1385" dy="0">tracing records</tspan>
      <tspan x="1385" dy="34">every event so</tspan>
      <tspan x="1385" dy="34">overhead grows with</tspan>
      <tspan x="1385" dy="34">the event rate</tspan>
    </text>
  </g>
</svg>