<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Delegation, glue records and zone replication</title>
  <desc>Visual explanation of DNS delegation, glue records, resolver roles, and primary-secondary zone replication.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Delegation, glue records and zone replication</text>

  
  <rect x="40" y="100" width="940" height="855" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 125)">
    
    <circle cx="20" cy="10" r="7" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="10" cy="30" r="6" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="30" cy="30" r="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 20 17 L 20 22 M 20 22 L 10 24 M 20 22 L 30 24" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="115" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Delegation with glue</text>

  
  <rect x="65" y="180" width="190" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="95" cy="212" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <ellipse cx="95" cy="212" rx="7" ry="14" fill="none" stroke="#207448" stroke-width="2" />
  <line x1="81" y1="212" x2="109" y2="212" stroke="#207448" stroke-width="2" />
  <text x="175" y="222" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">root</text>

  
  <line x1="160" y1="244" x2="160" y2="310" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <text x="215" y="272" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="215" dy="0">NS records point to the</tspan>
    <tspan x="215" dy="28">child zone's servers</tspan>
  </text>

  
  <rect x="65" y="318" width="190" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <path d="M 83 203 L 93 203 L 97 208 L 110 208 L 110 222 L 83 222 Z" transform="translate(0, 138)" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <text x="175" y="360" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">com</text>

  
  <line x1="160" y1="382" x2="160" y2="448" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="456" width="225" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="80" y="471" width="30" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="80" y1="480" x2="110" y2="480" stroke="#207448" stroke-width="2" />
  <text x="195" y="498" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">example.com</text>

  
  <g>
    
    <path d="M 160 415 L 310 415" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" />
    <rect x="310" y="325" width="645" height="195" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(330, 345)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#db8129" stroke-width="3" />
      <path d="M 24 24 L 38 38 M 32 32 L 38 26 M 36 36 L 42 30" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="385" y="358" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">glue A and AAAA records: when the name server</tspan>
      <tspan x="330" dy="30">ns1.example.com sits inside the delegated</tspan>
      <tspan x="330" dy="30">zone, the parent also holds its address,</tspan>
      <tspan x="330" dy="30">otherwise you would have to resolve a name</tspan>
      <tspan x="330" dy="30">inside example.com to find the server for</tspan>
      <tspan x="330" dy="30">example.com (chicken and egg)</tspan>
    </text>
  </g>

  
  
  <rect x="65" y="545" width="890" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(85, 563)">
    <ellipse cx="20" cy="12" rx="18" ry="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 2 12 L 2 36 A 18 7 0 0 0 38 36 L 38 12" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 2 24 A 18 7 0 0 0 38 24" fill="none" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="145" y="582" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Authoritative server: </tspan>
    <tspan>holds the zone and</tspan>
    <tspan x="145" dy="32">answers with the aa flag, the source of truth</tspan>
  </text>

  
  <rect x="65" y="647" width="890" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(85, 665)">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="25" y1="25" x2="36" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 16 L 20 16 M 16 12 L 16 20" stroke="#207448" stroke-width="2" />
  </g>
  <text x="145" y="684" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Recursive resolver: </tspan>
    <tspan>the caching DNS server</tspan>
    <tspan x="145" dy="32">listed in resolv.conf, walks the tree for clients</tspan>
  </text>

  
  <rect x="65" y="749" width="890" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(85, 767)">
    <rect x="4" y="6" width="32" height="22" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="34" x2="28" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="28" x2="20" y2="34" stroke="#207448" stroke-width="3" />
  </g>
  <text x="145" y="786" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Stub resolver: </tspan>
    <tspan>libc or systemd-resolved on each</tspan>
    <tspan x="145" dy="32">host, simply asks a recursive resolver</tspan>
  </text>

  
  <rect x="65" y="851" width="890" height="90" rx="10" fill="#ffffff" stroke="#303a36" stroke-width="2" stroke-dasharray="6,4" />
  
  <g transform="translate(85, 870)">
    <path d="M 20 4 L 34 9 L 34 22 C 34 31 20 38 20 38 C 20 38 6 31 6 22 L 6 9 Z" fill="none" stroke="#303a36" stroke-width="3" stroke-linejoin="round" />
    <line x1="20" y1="13" x2="20" y2="22" stroke="#303a36" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="28" r="1.5" fill="#303a36" />
  </g>
  <text x="145" y="888" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">a server that is both authoritative and open-recursive</tspan>
    <tspan x="145" dy="32">is a security problem: reflection and amplification</tspan>
  </text>


  
  <rect x="1020" y="100" width="540" height="855" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1045, 125)">
    
    <path d="M 28 8 A 14 14 0 1 0 34 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <polyline points="26,3 30,9 23,11" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1095" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Replication</text>

  
  <rect x="1050" y="180" width="480" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1075, 218)">
    <ellipse cx="20" cy="10" rx="16" ry="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 10 L 4 30 A 16 6 0 0 0 36 30 L 36 10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 28 22 L 38 12 M 38 12 L 40 14 M 28 22 L 26 26 L 30 24 Z" fill="none" stroke="#207448" stroke-width="2" />
  </g>
  <text x="1140" y="230" font-family="sans-serif" font-size="28" fill="#303a36">
    <tspan x="1140" dy="0" font-weight="bold">Primary (master):</tspan>
    <tspan x="1140" dy="36" font-size="24">holds the editable zone</tspan>
  </text>

  
  <line x1="1290" y1="300" x2="1290" y2="395" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1310" y="332" width="125" height="38" rx="6" fill="#e8f1ea" />
  <text x="1315" y="360" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">NOTIFY</text>

  
  <rect x="1050" y="405" width="480" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1075, 435)">
    <ellipse cx="20" cy="10" rx="16" ry="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 10 L 4 32 A 16 6 0 0 0 36 32 L 36 10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 21 A 16 6 0 0 0 36 21" fill="none" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="1140" y="465" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Secondary (slave)</text>

  
  <line x1="1290" y1="505" x2="1290" y2="565" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="1050" y="575" width="480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(1075, 610)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 16 14 Q 20 8 24 14 Q 24 18 20 21 L 20 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="29" r="1.5" fill="#207448" />
  </g>
  <text x="1140" y="622" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1140" dy="0">has the SOA serial</tspan>
    <tspan x="1140" dy="32">gone up?</tspan>
  </text>

  
  <line x1="1290" y1="685" x2="1290" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="1050" y="750" width="480" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1075, 805)">
    <path d="M 6 12 L 32 12 M 24 4 L 32 12 L 24 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 32 28 L 6 28 M 14 20 L 6 28 L 14 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1140" y="798" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1140" dy="0" font-weight="bold">AXFR full copy or</tspan>
    <tspan x="1140" dy="32" font-weight="bold">IXFR incremental</tspan>
    <tspan x="1140" dy="32" font-weight="bold">zone transfer</tspan>
  </text>


  
  <rect x="40" y="975" width="1520" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="70" y="1012" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">A zone is an administrative portion of the tree served by a set of authoritative servers,</tspan>
    <tspan x="70" dy="32">a domain is a position in the tree: a domain is a place on the map and a zone is the area one</tspan>
    <tspan x="70" dy="32">office looks after; modern setups often use API-driven zone management (Route 53, Cloud DNS)</tspan>
  </text>


  
  <rect x="40" y="1115" width="1520" height="55" rx="10" fill="#207448" />
  <text x="800" y="1151" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Decide early which server holds the editable copy of each zone</text>

</svg>