<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>The fleet failure-domain diagram</title>
  <desc>Visual failure-domain hierarchy from site down to GPU, with cross-domain dependencies connecting to host trays.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The fleet failure-domain diagram</text>

  
  
  <line x1="800" y1="205" x2="800" y2="245" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <line x1="800" y1="365" x2="800" y2="405" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <line x1="800" y1="515" x2="800" y2="555" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <line x1="800" y1="701" x2="800" y2="745" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <line x1="800" y1="865" x2="800" y2="910" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 360 658 L 460 658 L 460 780 L 580 780" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-dashed)" />
  <rect x="365" y="688" width="190" height="62" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="460" y="713" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="460" dy="0">one NIC</tspan>
    <tspan x="460" dy="28">per node</tspan>
  </text>

  
  <line x1="360" y1="835" x2="580" y2="835" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-dashed)" />
  <rect x="365" y="804" width="190" height="62" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="460" y="829" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="460" dy="0">checkpoints,</tspan>
    <tspan x="460" dy="28">weights</tspan>
  </text>

  
  <line x1="1240" y1="810" x2="1020" y2="810" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-dashed)" />
  <rect x="1055" y="784" width="150" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1130" y="819" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">fleet wide</text>

  

  
  <g id="node-site">
    <rect x="580" y="85" width="440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(604, 117)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 52 L 28 4 L 44 52" />
      <path d="M 6 18 L 50 18" />
      <path d="M 10 32 L 46 32" />
      <path d="M 18 32 L 38 18" />
      <path d="M 38 32 L 18 18" />
      <circle cx="28" cy="4" r="2" fill="#207448" />
    </g>
    <text x="680" y="127" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Site:</tspan>
      <tspan x="680" dy="34" font-size="24">grid and regional</tspan>
      <tspan x="680" dy="30" font-size="24">network</tspan>
    </text>
  </g>

  
  <g id="node-hall">
    <rect x="580" y="245" width="440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(604, 277)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="14" width="48" height="38" rx="3" />
      <path d="M 4 24 L 28 6 L 52 24" />
      <circle cx="28" cy="35" r="9" />
      <path d="M 28 26 L 28 44" />
      <path d="M 19 35 L 37 35" />
    </g>
    <text x="680" y="287" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Hall:</tspan>
      <tspan x="680" dy="34" font-size="24">power distribution,</tspan>
      <tspan x="680" dy="30" font-size="24">cooling plant</tspan>
    </text>
  </g>

  
  <g id="node-row">
    <rect x="580" y="405" width="440" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(604, 432)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="16" width="12" height="34" rx="2" />
      <rect x="22" y="16" width="12" height="34" rx="2" />
      <rect x="38" y="16" width="12" height="34" rx="2" />
      <path d="M 12 16 C 12 6, 44 6, 44 16" />
    </g>
    <text x="680" y="449" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Row:</tspan>
      <tspan x="680" dy="36" font-size="24">cooling loop? unknown</tspan>
    </text>
  </g>

  
  <g id="node-rack">
    <rect x="580" y="555" width="440" height="146" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(604, 600)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="4" width="40" height="48" rx="4" />
      <line x1="8" y1="16" x2="48" y2="16" />
      <line x1="8" y1="28" x2="48" y2="28" />
      <line x1="8" y1="40" x2="48" y2="40" />
      <circle cx="16" cy="10" r="1.5" fill="#207448" />
      <circle cx="22" cy="10" r="1.5" fill="#207448" />
      <circle cx="16" cy="22" r="1.5" fill="#207448" />
      <circle cx="22" cy="22" r="1.5" fill="#207448" />
    </g>
    <text x="680" y="591" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Rack:</tspan>
      <tspan x="680" dy="32" font-size="24">power feeds,</tspan>
      <tspan x="680" dy="28" font-size="24">NVLink switches,</tspan>
      <tspan x="680" dy="28" font-size="24">liquid loop</tspan>
    </text>
  </g>

  
  <g id="node-tray">
    <rect x="580" y="745" width="440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(604, 777)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="14" width="44" height="28" rx="3" />
      <line x1="14" y1="42" x2="14" y2="48" />
      <line x1="24" y1="42" x2="24" y2="48" />
      <line x1="34" y1="42" x2="34" y2="48" />
      <line x1="42" y1="42" x2="42" y2="48" />
      <rect x="14" y="20" width="12" height="12" rx="2" />
      <line x1="34" y1="20" x2="42" y2="20" />
      <line x1="34" y1="26" x2="42" y2="26" />
      <line x1="34" y1="32" x2="42" y2="32" />
    </g>
    <text x="680" y="789" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Node or tray:</tspan>
      <tspan x="680" dy="36" font-size="24">host, NICs, driver</tspan>
    </text>
  </g>

  
  <g id="node-gpu">
    <rect x="580" y="910" width="440" height="130" rx="16" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(604, 947)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="8" width="40" height="40" rx="5" />
      <rect x="19" y="19" width="18" height="18" rx="2" />
      
      <line x1="12" y1="19" x2="15" y2="19" />
      <line x1="12" y1="37" x2="15" y2="37" />
      <line x1="41" y1="19" x2="44" y2="19" />
      <line x1="41" y1="37" x2="44" y2="37" />
      
      <line x1="20" y1="2" x2="20" y2="8" />
      <line x1="36" y1="2" x2="36" y2="8" />
      <line x1="20" y1="48" x2="20" y2="54" />
      <line x1="36" y1="48" x2="36" y2="54" />
    </g>
    <text x="680" y="950" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#db8129">GPU:</tspan>
      <tspan x="680" dy="34" font-size="24">die, HBM, ECC,</tspan>
      <tspan x="680" dy="30" font-size="24">NVLink ports</tspan>
    </text>
  </g>

  

  
  <g id="node-leaf">
    <rect x="40" y="600" width="320" height="116" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(64, 630)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="16" width="48" height="24" rx="4" />
      <circle cx="14" cy="28" r="2" fill="#207448" />
      <circle cx="24" cy="28" r="2" fill="#207448" />
      <circle cx="34" cy="28" r="2" fill="#207448" />
      <circle cx="42" cy="28" r="2" fill="#207448" />
      <path d="M 12 16 L 20 6" />
      <path d="M 36 16 L 44 6" />
    </g>
    <text x="136" y="648" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Fabric leaf</tspan>
      <tspan x="136" dy="36" font-size="24">per rail</tspan>
    </text>
  </g>

  
  <g id="node-store">
    <rect x="40" y="775" width="320" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(64, 807)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="14" rx="22" ry="7" />
      <path d="M 6 14 L 6 42 C 6 46, 50 46, 50 42 L 50 14" />
      <path d="M 6 28 C 6 32, 50 32, 50 28" />
    </g>
    <text x="136" y="818" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="28" font-weight="bold">Shared</tspan>
      <tspan x="136" dy="32" font-size="24">filesystem</tspan>
      <tspan x="136" dy="28" font-size="24">servers</tspan>
    </text>
  </g>

  
  <g id="node-fw">
    <rect x="1240" y="750" width="320" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1264, 782)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="10" y="10" width="36" height="36" rx="4" />
      <path d="M 21 21 L 16 28 L 21 35" />
      <path d="M 35 21 L 40 28 L 35 35" />
      <line x1="28" y1="2" x2="28" y2="10" />
      <line x1="28" y1="46" x2="28" y2="54" />
      <line x1="2" y1="28" x2="10" y2="28" />
      <line x1="46" y1="28" x2="54" y2="28" />
    </g>
    <text x="1336" y="793" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="28" font-weight="bold">Driver and</tspan>
      <tspan x="1336" dy="32" font-size="24">firmware</tspan>
      <tspan x="1336" dy="28" font-size="24">version</tspan>
    </text>
  </g>
</svg>