<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Incident 8: one external lookup becomes several DNS queries</title>
  <desc>Infographic explaining how ndots 5 causes query amplification with multiple search suffix NXDOMAIN failures before an external name resolves, overloading CoreDNS.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Canvas Title (48px bold) -->
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Incident 8: one external lookup becomes several DNS queries</text>

  <!-- ==================== LEFT COLUMN: RESOLVER & RULE & QUERIES ==================== -->
  <!-- Card 1: Resolver Anatomy -->
  <g id="card-resolver-anatomy">
    <rect x="40" y="130" width="730" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- File / Config Outline Icon (56px) on Left -->
    <g transform="translate(65, 167)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 4 L 34 4 L 46 16 L 46 50 L 8 50 Z" />
      <polyline points="34,4 34,16 46,16" />
      <line x1="16" y1="26" x2="36" y2="26" />
      <line x1="16" y1="36" x2="36" y2="36" />
    </g>
    <text x="145" y="180" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0" font-family="monospace">pod /etc/resolv.conf:</tspan>
      <tspan font-family="sans-serif"> nameserver 10.0.0.10;</tspan>
      <tspan x="145" dy="32">three search domains; options ndots:5</tspan>
    </text>
  </g>

  <!-- Card 2: Rule -->
  <g id="card-rule">
    <rect x="40" y="285" width="730" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Scale / Logic Balance Outline Icon (56px) on Left -->
    <g transform="translate(65, 347)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="8" x2="28" y2="48" />
      <line x1="12" y1="18" x2="44" y2="18" />
      <polyline points="6,34 12,18 18,34 Z" />
      <polyline points="38,34 44,18 50,34 Z" />
      <line x1="18" y1="48" x2="38" y2="48" />
    </g>
    <text x="145" y="332" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">a name with fewer dots than ndots is tried</tspan>
      <tspan x="145" dy="32">with each search suffix first; a combined</tspan>
      <tspan x="145" dy="32">name that does not exist returns NXDOMAIN;</tspan>
      <tspan x="145" dy="32">then the real name is asked</tspan>
    </text>
  </g>

  <!-- Card 3: Query Picture Container (CENTERPIECE WITH ORANGE STROKE) -->
  <g id="container-query-picture">
    <rect x="40" y="490" width="730" height="490" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <!-- Search / DNS Query Outline Icon (56px) on Left -->
    <g transform="translate(65, 510)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="15" />
      <line x1="33" y1="33" x2="48" y2="48" />
      <line x1="14" y1="22" x2="30" y2="22" />
      <line x1="22" y1="14" x2="22" y2="30" />
    </g>

    <!-- Query Row 1: suffix 1 -> NXDOMAIN -->
    <g id="query-row-1">
      <rect x="65" y="580" width="680" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="95" y="622" font-family="monospace" font-size="24" fill="#303a36">suffix 1 -> NXDOMAIN</text>
      <line x1="430" y1="622" x2="660" y2="622" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
      <rect x="660" y="595" width="65" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <line x1="680" y1="610" x2="705" y2="635" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="705" y1="610" x2="680" y2="635" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Query Row 2: suffix 2 -> NXDOMAIN -->
    <g id="query-row-2">
      <rect x="65" y="680" width="680" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="95" y="722" font-family="monospace" font-size="24" fill="#303a36">suffix 2 -> NXDOMAIN</text>
      <line x1="430" y1="722" x2="660" y2="722" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
      <rect x="660" y="695" width="65" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <line x1="680" y1="710" x2="705" y2="735" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="705" y1="710" x2="680" y2="735" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Query Row 3: suffix 3 -> NXDOMAIN -->
    <g id="query-row-3">
      <rect x="65" y="780" width="680" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="95" y="822" font-family="monospace" font-size="24" fill="#303a36">suffix 3 -> NXDOMAIN</text>
      <line x1="430" y1="822" x2="660" y2="822" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
      <rect x="660" y="795" width="65" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <line x1="680" y1="810" x2="705" y2="835" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="705" y1="810" x2="680" y2="835" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Query Row 4: idp.example.test -> answer -->
    <g id="query-row-4">
      <rect x="65" y="880" width="680" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="95" y="922" font-family="monospace" font-size="24" fill="#303a36">idp.example.test -> answer</text>
      <line x1="510" y1="922" x2="660" y2="922" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
      <rect x="660" y="895" width="65" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <polyline points="675,922 688,935 710,910" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: LOAD, RESULT, FIX, RISKY ==================== -->
  <!-- Card 4: Load Box -->
  <g id="card-load">
    <rect x="830" y="130" width="730" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- CPU / Metering / Throttling Outline Icon (56px) -->
    <g transform="translate(855, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 44 A 20 20 0 1 1 46 44" />
      <line x1="28" y1="32" x2="40" y2="18" stroke-width="4" />
      <circle cx="28" cy="32" r="3" fill="#207448" />
    </g>
    <text x="935" y="172" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">gateway release at 10:05 added a per-request</tspan>
      <tspan x="935" dy="32">call to an external identity provider; query</tspan>
      <tspan x="935" dy="32">rate 12,000 per second up from 3,000;</tspan>
      <tspan x="935" dy="32">CoreDNS has two replicas, CPU limit 200m,</tspan>
      <tspan x="935" dy="32">throttled; DNS latency p99 up to 2 s, some</tspan>
      <tspan x="935" dy="32">queries time out; no NodeLocal DNSCache;</tspan>
      <tspan x="935" dy="32">upstream resolver healthy, 5 ms from a node</tspan>
    </text>
  </g>

  <!-- Card 5: Result -->
  <g id="card-result">
    <rect x="830" y="455" width="730" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Alert Window / Error Outline Icon (56px) -->
    <g transform="translate(855, 502)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="6" y1="20" x2="50" y2="20" />
      <circle cx="14" cy="14" r="2" fill="#207448" />
      <circle cx="22" cy="14" r="2" fill="#207448" />
      <line x1="22" y1="28" x2="34" y2="40" stroke-width="3.5" />
      <line x1="34" y1="28" x2="22" y2="40" stroke-width="3.5" />
    </g>
    <text x="935" y="500" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">about 5 percent of requests fail with 502</tspan>
      <tspan x="935" dy="32">because token validation cannot resolve its</tspan>
      <tspan x="935" dy="32">host; inference path works</tspan>
    </text>
  </g>

  <!-- Card 6: Fix from outside in -->
  <g id="card-fix">
    <rect x="830" y="630" width="730" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Wrench / Tools Outline Icon (56px) -->
    <g transform="translate(855, 700)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 38 8 A 14 14 0 0 0 22 24 L 8 38 A 4 4 0 0 0 14 44 L 28 30 A 14 14 0 0 0 44 14 L 38 14 L 38 8 Z" />
    </g>
    <text x="935" y="675" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">roll back or flag off the lookup; scale</tspan>
      <tspan x="935" dy="32">CoreDNS and lift its CPU limit; trailing-dot</tspan>
      <tspan x="935" dy="32">name or lower ndots through dnsConfig; plan</tspan>
      <tspan x="935" dy="32">NodeLocal DNSCache</tspan>
    </text>
  </g>

  <!-- Card 7: Risky -->
  <g id="card-risky">
    <rect x="830" y="850" width="730" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Warning Triangle Outline Icon (56px) -->
    <g transform="translate(855, 887)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 50,46 6,46" />
      <line x1="28" y1="20" x2="28" y2="32" stroke-width="3.5" />
      <circle cx="28" cy="39" r="2" fill="#207448" />
    </g>
    <text x="935" y="908" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">removing every CoreDNS pod; hard-coded</tspan>
      <tspan x="935" dy="32">hosts entries</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM STRIP: TEST NOTE ==================== -->
  <g id="strip-test-note">
    <rect x="40" y="1030" width="1520" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Laptop / Terminal Pod Outline Icon (56px) -->
    <g transform="translate(68, 1062)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="8" width="36" height="26" rx="4" />
      <line x1="4" y1="42" x2="52" y2="42" stroke-width="4" />
      <line x1="22" y1="34" x2="34" y2="34" />
      <polyline points="18,18 24,21 18,24" stroke-width="3" />
    </g>
    <text x="145" y="1100" font-family="sans-serif" font-size="24" fill="#303a36">test from a pod, not a laptop, because a laptop uses its own resolver</text>
  </g>
</svg>