<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The model tree: go deeper, then climb back when the evidence stops fitting</title>
  <desc>Visual infographic contrasting a multi-level mental model tree with an incident troubleshooting ladder where climbing back up enables solving root causes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    The model tree: go deeper, then climb back
    <tspan x="50" dy="55">when the evidence stops fitting</tspan>
  </text>

  
  <rect x="40" y="140" width="820" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="890" y="140" width="670" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  

  
  <rect x="270" y="170" width="370" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(425, 185)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="22" r="5" />
    <circle cx="32" cy="10" r="5" />
    <circle cx="50" cy="22" r="5" />
    <line x1="15" y1="20" x2="27" y2="12" />
    <line x1="37" y1="12" x2="45" y2="20" />
    <path d="M 5 22 L 0 22 M 55 22 L 60 22" stroke-dasharray="2 2" />
  </g>
  <text x="455" y="250" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Network path</text>

  
  <rect x="95" y="330" width="310" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(225, 345)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="25" cy="18" r="14" />
    <circle cx="25" cy="18" r="4" fill="#207448" />
    <line x1="25" y1="4" x2="25" y2="8" />
    <line x1="25" y1="28" x2="25" y2="32" />
    <line x1="11" y1="18" x2="15" y2="18" />
    <line x1="35" y1="18" x2="39" y2="18" />
  </g>
  <text x="250" y="415" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Control plane</text>

  
  <rect x="505" y="330" width="310" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(635, 345)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="10" x2="45" y2="10" />
    <line x1="5" y1="26" x2="45" y2="26" />
    <rect x="15" y="14" width="10" height="8" rx="2" fill="#207448" />
    <rect x="30" y="14" width="10" height="8" rx="2" fill="#207448" />
  </g>
  <text x="660" y="415" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Data plane</text>

  
  <rect x="95" y="480" width="310" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(225, 495)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="4" />
    <circle cx="10" cy="26" r="4" />
    <circle cx="40" cy="18" r="5" fill="#207448" />
    <line x1="14" y1="11" x2="35" y2="17" />
    <line x1="14" y1="25" x2="35" y2="19" />
  </g>
  <text x="250" y="565" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Convergence and
    <tspan x="250" dy="35">shortest paths</tspan>
  </text>

  
  <rect x="505" y="480" width="310" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(635, 495)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="16" width="10" height="14" rx="2" />
    <rect x="19" y="16" width="10" height="14" rx="2" />
    <rect x="33" y="16" width="10" height="14" rx="2" />
    <path d="M 5 8 Q 12 2 19 8 T 33 8 T 45 8" />
  </g>
  <text x="660" y="565" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    QoS, queueing
    <tspan x="660" dy="35">and jitter</tspan>
  </text>

  
  
  <path d="M 360 270 L 360 300 L 250 300 L 250 330" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 550 270 L 550 300 L 660 300 L 660 330" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <line x1="250" y1="440" x2="250" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <line x1="660" y1="440" x2="660" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  
  <path d="M 660 620 L 660 675 L 610 675" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" />

  
  <rect x="110" y="645" width="500" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
  <text x="360" y="670" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    new evidence changes the picture:
    <tspan x="360" dy="24">return to the top</tspan>
  </text>

  
  <path d="M 110 675 L 65 675 L 65 220 L 270 220" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />


  
  
  <text x="920" y="175" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">the EIGRP incident</text>

  
  <rect x="920" y="195" width="610" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(945, 217)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="44" height="32" rx="4" />
    <path d="M 4 10 L 26 24 L 48 10" />
  </g>
  <text x="1015" y="237" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Model 1:
    <tspan x="1015" dy="36">EIGRP protocol behaviour</tspan>
  </text>

  
  <line x1="1225" y1="290" x2="1225" y2="325" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="920" y="325" width="610" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(945, 347)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="40" height="30" rx="4" />
    <line x1="6" y1="18" x2="46" y2="18" />
    <line x1="20" y1="8" x2="20" y2="18" />
  </g>
  <text x="1015" y="367" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Model 2:
    <tspan x="1015" dy="36">packet transport</tspan>
  </text>

  
  <line x1="1225" y1="420" x2="1225" y2="455" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="920" y="455" width="610" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(945, 477)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="40" height="26" rx="4" />
    <line x1="16" y1="10" x2="16" y2="36" />
    <line x1="26" y1="10" x2="26" y2="36" />
    <line x1="36" y1="10" x2="36" y2="36" />
  </g>
  <text x="1015" y="497" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Model 3:
    <tspan x="1015" dy="36">router input queues</tspan>
  </text>

  
  <line x1="1225" y1="550" x2="1225" y2="585" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="920" y="585" width="610" height="185" rx="12" fill="#fdf2e9" stroke="#db8129" stroke-width="3.5" />
  <g transform="translate(945, 625)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="6" width="24" height="38" rx="4" />
    <line x1="20" y1="36" x2="22" y2="36" />
    <line x1="20" y1="28" x2="32" y2="28" />
    <path d="M 8 16 Q 2 24 8 32" />
    <path d="M 44 16 Q 50 24 44 32" />
  </g>
  <text x="1015" y="625" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Cause: a broadcast flood;
    <tspan x="1015" dy="40">a backup server installed</tspan>
    <tspan x="1015" dy="40">in server mode was</tspan>
    <tspan x="1015" dy="40">scanning every subnet</tspan>
  </text>


  

  
  <rect x="40" y="805" width="820" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(70, 835)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 4 L 52 46 L 4 46 Z" />
    <line x1="28" y1="18" x2="28" y2="30" />
    <circle cx="28" cy="38" r="1.5" fill="#207448" />
  </g>
  <text x="145" y="890" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    the classic mistake is to stay deep in one
    <tspan x="145" dy="42">branch, staring at jitter, without asking</tspan>
    <tspan x="145" dy="42">how another branch could cause it</tspan>
  </text>

  
  <rect x="890" y="805" width="670" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(915, 835)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="34" height="42" rx="4" />
    <line x1="14" y1="16" x2="32" y2="16" />
    <line x1="14" y1="24" x2="32" y2="24" />
    <line x1="14" y1="32" x2="24" y2="32" />
  </g>
  <text x="980" y="845" font-family="sans-serif" font-size="24" fill="#303a36">
    the team stayed at the protocol layer
    <tspan x="980" dy="33">while the evidence kept refusing to fit;</tspan>
    <tspan x="980" dy="33">each extra test at that layer cost time</tspan>
    <tspan x="980" dy="33">without a new answer; the turn came</tspan>
    <tspan x="980" dy="33">when they climbed back up and asked</tspan>
    <tspan x="980" dy="33">what sat below the protocol</tspan>
  </text>


  
  <rect x="40" y="1090" width="1520" height="75" rx="14" fill="#207448" />
  <text x="800" y="1137" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
    When the evidence stops fitting your current model, climb back to the top of the tree and try another branch
  </text>
</svg>