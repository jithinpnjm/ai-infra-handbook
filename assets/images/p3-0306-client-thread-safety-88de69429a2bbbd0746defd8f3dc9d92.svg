<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Which objects you may share between threads</title>
  <desc>Infographic table showing thread safety of various Python objects, clients, and database drivers.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Which objects you may share between threads</text>

  
  <g id="table-headers">
    
    <rect x="65" y="114" width="515" height="60" rx="8" fill="#207448"/>
    <text x="322" y="155" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Object</text>

    
    <rect x="595" y="114" width="450" height="60" rx="8" fill="#207448"/>
    <text x="820" y="155" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Safe to share?</text>

    
    <rect x="1060" y="114" width="475" height="60" rx="8" fill="#207448"/>
    <text x="1297" y="155" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Note</text>
  </g>

  
  <g id="row-1">
    <rect x="65" y="186" width="515" height="68" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="186" width="450" height="68" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="186" width="475" height="68" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 200)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="40" height="40" rx="6"/>
      <line x1="8" y1="12" x2="32" y2="12"/>
      <line x1="8" y1="20" x2="32" y2="20"/>
      <line x1="8" y1="28" x2="32" y2="28"/>
    </g>

    <text x="145" y="228" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">queue.Queue</text>
    
    <rect x="760" y="199" width="120" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="820" y="228" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

    <text x="1297" y="228" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">-</text>
  </g>

  
  <g id="row-2">
    <rect x="65" y="264" width="515" height="68" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="264" width="450" height="68" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="264" width="475" height="68" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 278)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M6 4h22l8 8v24H6z"/>
      <path d="M28 4v8h8"/>
      <line x1="12" y1="18" x2="24" y2="18"/>
      <line x1="12" y1="24" x2="28" y2="24"/>
      <line x1="12" y1="30" x2="22" y2="30"/>
    </g>

    <text x="145" y="306" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">logging</text>

    <rect x="760" y="277" width="120" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="820" y="306" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

    <text x="1297" y="306" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">-</text>
  </g>

  
  <g id="row-3">
    <rect x="65" y="342" width="515" height="94" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="342" width="450" height="94" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="342" width="475" height="94" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 368)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M12 6H6v28h6"/>
      <path d="M28 6h6v28h-6"/>
      <line x1="14" y1="14" x2="26" y2="14"/>
      <line x1="14" y1="20" x2="22" y2="20"/>
      <line x1="14" y1="26" x2="26" y2="26"/>
    </g>

    <text x="145" y="378" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">single list.append and pop;</tspan>
      <tspan x="145" dy="32">single dict operations</tspan>
    </text>

    <rect x="760" y="368" width="120" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="820" y="397" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

    <text x="1085" y="397" font-family="sans-serif" font-size="24" fill="#303a36">compound operations are not safe</text>
  </g>

  
  <g id="row-4">
    <rect x="65" y="446" width="515" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="446" width="450" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="446" width="475" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 470)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M10 28a8 8 0 0 1-2-15.7 12 12 0 0 1 23-3.3 9 9 0 0 1 7 9 8 8 0 0 1-6 10z"/>
    </g>

    <text x="145" y="498" font-family="sans-serif" font-size="24" fill="#303a36">boto3 low-level client</text>

    <text x="615" y="498" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">documented thread-safe</text>

    <text x="1085" y="498" font-family="sans-serif" font-size="24" fill="#303a36">boto3 sessions and resources are not</text>
  </g>

  
  <g id="row-5">
    <rect x="65" y="544" width="515" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="544" width="450" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="544" width="475" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 568)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="16"/>
      <ellipse cx="20" cy="20" rx="8" ry="16"/>
      <line x1="4" y1="20" x2="36" y2="20"/>
    </g>

    <text x="145" y="596" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">requests.Session</text>

    <text x="615" y="596" font-family="sans-serif" font-size="24" fill="#303a36">mostly, for simple use</text>

    <text x="1085" y="596" font-family="sans-serif" font-size="24" fill="#303a36">documentation makes no strong guarantee</text>
  </g>

  
  <g id="row-6">
    <rect x="65" y="642" width="515" height="88" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>
    <rect x="595" y="642" width="450" height="88" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>
    <rect x="1060" y="642" width="475" height="88" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>

    
    <g transform="translate(85, 666)" stroke="#db8129" stroke-width="3" fill="none">
      <rect x="2" y="4" width="36" height="30" rx="4"/>
      <path d="M10 14l6 5-6 5"/>
      <line x1="20" y1="24" x2="28" y2="24"/>
    </g>

    <text x="145" y="694" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">paramiko SSHClient</text>

    <rect x="760" y="665" width="120" height="42" rx="21" fill="#db8129"/>
    <text x="820" y="694" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">no</text>

    <text x="1085" y="694" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">open one connection per worker</text>
  </g>

  
  <g id="row-7">
    <rect x="65" y="740" width="515" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="740" width="450" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="740" width="475" height="88" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 764)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="20" cy="10" rx="16" ry="6"/>
      <path d="M4 10v20c0 3.3 7.2 6 16 6s16-2.7 16-6V10"/>
      <path d="M4 20c0 3.3 7.2 6 16 6s16-2.7 16-6"/>
    </g>

    <text x="145" y="792" font-family="sans-serif" font-size="24" fill="#303a36">sqlite3 connection</text>

    <text x="615" y="792" font-family="sans-serif" font-size="24" fill="#303a36">refuses another thread by default</text>

    <text x="1297" y="792" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">-</text>
  </g>

  
  <g id="row-8">
    <rect x="65" y="838" width="515" height="118" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="595" y="838" width="450" height="118" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>
    <rect x="1060" y="838" width="475" height="118" rx="8" fill="#ffffff" stroke="#c0d6c7" stroke-width="1.5"/>

    
    <g transform="translate(85, 876)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="20" cy="8" rx="16" ry="5"/>
      <path d="M4 8v10c0 2.8 7.2 5 16 5s16-2.2 16-5V8"/>
      <path d="M4 18v10c0 2.8 7.2 5 16 5s16-2.2 16-5V18"/>
    </g>

    <text x="145" y="903" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Database drivers</text>

    <text x="615" y="886" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="615" dy="0">check the DB-API threadsafety</tspan>
      <tspan x="615" dy="32">attribute of the driver module</tspan>
    </text>

    <text x="1085" y="886" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">tells you whether threads may share</tspan>
      <tspan x="1085" dy="32">the module, a connection or neither</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="65" y="976" width="1470" height="74" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1022" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">when in doubt create one client per thread with threading.local()</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="65" y="1070" width="1470" height="74" rx="10" fill="#207448"/>
    <text x="800" y="1116" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Never assume a client object is safe to share</text>
  </g>
</svg>