<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Top k with a min-heap of size k: the root is the weakest member</title>
  <desc>Visual infographic explaining how a min-heap of size k tracks the top k slowest samples, keeping the fastest of those k at the root to decide replacements.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <g id="header">
    <text x="50" y="68" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="50" dy="0">Top k with a min-heap of size k:</tspan>
      <tspan x="825" dy="0" fill="#db8129">the root is the weakest member</tspan>
    </text>
  </g>

  
  <g id="top-notes">
    
    <rect x="50" y="125" width="670" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <g transform="translate(68, 144)">
      <rect x="2" y="2" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 28 L 26 38 L 42 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="140" y="162" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="140" dy="0">tuples are (ms, endpoint) so</tspan>
      <tspan x="140" dy="32">the root is the smallest ms</tspan>
    </text>

    
    <rect x="740" y="125" width="810" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <g transform="translate(758, 144)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 14 L 28 42 M 16 30 L 28 42 L 40 30" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="830" y="162" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="830" dy="0">first k samples: heappush</tspan>
      <tspan x="830" dy="32">until the heap has k items</tspan>
    </text>
  </g>

  

  
  <g id="conveyor-stream">
    
    <rect x="50" y="445" width="210" height="14" rx="4" fill="#207448" />
    <circle cx="75" cy="475" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="75" cy="475" r="4" fill="#207448" />
    <circle cx="155" cy="475" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="155" cy="475" r="4" fill="#207448" />
    <circle cx="235" cy="475" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="235" cy="475" r="4" fill="#207448" />

    
    <rect x="50" y="375" width="25" height="55" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    
    
    <rect x="85" y="370" width="170" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    <text x="170" y="411" font-size="24" font-family="monospace" fill="#303a36" font-weight="bold" text-anchor="middle">endpoint, ms</text>

    
    <path d="M 260 402 L 310 402" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  </g>

  
  <g id="decision-diamond">
    
    <polygon points="450,272 580,402 450,532 320,402" fill="#e8f1ea" stroke="#207448" stroke-width="4" filter="url(#card-shadow)" />
    
    
    <text x="450" y="362" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif" text-anchor="middle">
      <tspan x="450" dy="0">Is the</tspan>
      <tspan x="450" dy="28">new sample</tspan>
      <tspan x="450" dy="28">slower than</tspan>
      <tspan x="450" dy="28">the root?</tspan>
    </text>

    
    <path d="M 450 536 L 450 635" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
    <text x="465" y="582" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="465" dy="0">no:</tspan>
      <tspan x="465" dy="28">ignored at once</tspan>
    </text>

    
    <rect x="390" y="645" width="120" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    <g transform="translate(422, 665)">
      
      <path d="M 8 16 L 48 16 M 22 16 L 22 10 L 34 10 L 34 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      
      <path d="M 12 16 L 16 52 L 40 52 L 44 16" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      
      <line x1="22" y1="24" x2="24" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="34" y1="24" x2="32" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <path d="M 584 402 L 870 402" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
    <text x="595" y="325" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="595" dy="0">yes: heapreplace,</tspan>
      <tspan x="595" dy="28">the root leaves and</tspan>
      <tspan x="595" dy="28">the new sample enters</tspan>
    </text>
  </g>

  
  <g id="min-heap">
    
    <rect x="880" y="245" width="370" height="520" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />

    
    <g transform="translate(900, 260)">
      
      <circle cx="28" cy="12" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="12" cy="40" r="7" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="44" cy="40" r="7" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 23 18 L 15 34 M 33 18 L 41 34" stroke="#207448" stroke-width="3" />
    </g>
    <text x="968" y="295" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">
      <tspan x="968" dy="0">min-heap of size k (k = 10)</tspan>
    </text>

    
    <rect x="900" y="340" width="330" height="125" rx="12" fill="#db8129" stroke="#db8129" stroke-width="2" filter="url(#card-shadow)" />
    <text x="1065" y="376" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">
      <tspan x="1065" dy="0">root = the fastest of</tspan>
      <tspan x="1065" dy="28">the current top k,</tspan>
      <tspan x="1065" dy="28">the weakest member</tspan>
    </text>

    
    
    <line x1="1010" y1="465" x2="975" y2="520" stroke="#207448" stroke-width="4" />
    <line x1="1120" y1="465" x2="1155" y2="520" stroke="#207448" stroke-width="4" />

    
    <circle cx="975" cy="535" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="1155" cy="535" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="4" />

    
    <line x1="960" y1="555" x2="935" y2="610" stroke="#207448" stroke-width="3" />
    <line x1="990" y1="555" x2="1015" y2="610" stroke="#207448" stroke-width="3" />
    <line x1="1140" y1="555" x2="1115" y2="610" stroke="#207448" stroke-width="3" />
    <line x1="1170" y1="555" x2="1195" y2="610" stroke="#207448" stroke-width="3" />

    
    <circle cx="935" cy="625" r="18" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="1015" cy="625" r="18" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="1115" cy="625" r="18" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="1195" cy="625" r="18" fill="#e8f1ea" stroke="#207448" stroke-width="4" />

    
    <line x1="925" y1="642" x2="915" y2="695" stroke="#207448" stroke-width="3" />
    <line x1="945" y1="642" x2="955" y2="695" stroke="#207448" stroke-width="3" />
    <line x1="1010" y1="642" x2="1005" y2="695" stroke="#207448" stroke-width="3" />

    
    <circle cx="915" cy="710" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="955" cy="710" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="1005" cy="710" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  </g>

  
  <g id="result-box">
    <rect x="1275" y="245" width="275" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />

    
    <g transform="translate(1385, 290)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 18 L 26 28 L 14 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="30" y1="38" x2="42" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="1412" y="405" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif" text-anchor="middle">
      <tspan x="1412" dy="0">At the end the</tspan>
      <tspan x="1412" dy="32">heap holds the</tspan>
      <tspan x="1412" dy="32">k slowest, sort</tspan>
      <tspan x="1412" dy="32">those k and</tspan>
      <tspan x="1412" dy="32">print slowest</tspan>
      <tspan x="1412" dy="32">first</tspan>
    </text>
  </g>

  
  <g id="comparison-strip">
    
    <rect x="50" y="795" width="730" height="155" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(80, 845)">
      <path d="M 6 42 A 24 24 0 1 1 50 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="32" x2="40" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="32" r="5" fill="#207448" />
    </g>
    <text x="160" y="865" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">
      <tspan x="160" dy="0">Cost: O(n log k) time,</tspan>
      <tspan x="160" dy="38">O(k) memory</tspan>
    </text>

    
    <rect x="805" y="795" width="745" height="155" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(835, 845)">
      <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 14 L 6 28 A 22 8 0 0 0 50 28 L 50 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 28 L 6 42 A 22 8 0 0 0 50 42 L 50 28" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="915" y="865" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="915" dy="0">sort everything: O(n log n)</tspan>
      <tspan x="915" dy="38">and holds everything</tspan>
    </text>
  </g>

  
  <g id="footnote">
    <rect x="50" y="975" width="1500" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <g transform="translate(75, 1030)">
      <circle cx="28" cy="32" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="12" x2="28" y2="4" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="22" y1="4" x2="34" y2="4" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="32" x2="38" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="150" y="1025" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="150" dy="0">Measured, k = 10: heap 0.0045 s for 100,000 samples and 0.0185 s for 400,000;</tspan>
      <tspan x="150" dy="34">sort and slice 0.0154 s and 0.0735 s.</tspan>
      <tspan x="150" dy="34">Honest claim: the memory, not a dramatic speedup.</tspan>
    </text>
  </g>
</svg>