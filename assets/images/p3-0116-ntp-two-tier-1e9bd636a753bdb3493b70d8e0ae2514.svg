<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1330" width="1600" height="1330">
  <title>Two-tier time on a cluster: head nodes face outward, compute nodes point at the head</title>
  <desc>Infographic illustrating cluster NTP hierarchy with outward-facing head nodes and internal compute nodes</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1330" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Two-tier time on a cluster: head nodes face outward,</text>
  <text x="800" y="104" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">compute nodes point at the head</text>

  
  <g transform="translate(40, 135)">
    <rect width="1520" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="36" cy="32" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="36" y1="22" x2="36" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="36" cy="42" r="2" fill="#207448" />
    <text x="68" y="40" font-family="sans-serif" font-size="24" fill="#303a36">
      Use exactly one time service on each host: <tspan font-family="monospace">systemctl disable --now systemd-timesyncd before installing chrony</tspan>
    </text>
  </g>

  
  <g transform="translate(25, 230)">
    <rect width="215" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(79, 35)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
      <path d="M 28 6 A 22 22 0 0 1 50 28" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4,3" />
      <path d="M 6 28 A 22 22 0 0 1 28 50" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4,3" />
      <line x1="28" y1="28" x2="28" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="107" y="160" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Stratum 0:</text>
    <text x="107" y="210" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">reference</text>
    <text x="107" y="245" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">clocks</text>
    <text x="107" y="300" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(GPS, atomic)</text>
  </g>

  
  <line x1="240" y1="460" x2="268" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(270, 230)">
    <rect width="215" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(79, 35)">
      <rect x="4" y="6" width="48" height="20" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="16" r="3" fill="#207448" />
      <line x1="24" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="3" />
      <rect x="4" y="32" width="48" height="20" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="42" r="3" fill="#207448" />
      <line x1="24" y1="42" x2="42" y2="42" stroke="#207448" stroke-width="3" />
    </g>
    <text x="107" y="160" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Stratum 1</text>
    <text x="107" y="200" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">servers</text>
    <text x="107" y="255" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">connect to</text>
    <text x="107" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">those clocks</text>
  </g>

  
  <line x1="485" y1="460" x2="513" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(515, 230)">
    <rect width="260" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(102, 35)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
      <ellipse cx="28" cy="28" rx="13" ry="26" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" />
    </g>
    <text x="130" y="150" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Site NTP servers</text>
    <text x="130" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">or the internet</text>
    <text x="130" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(stratum 2 and</text>
    <text x="130" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">below</text>
    <text x="130" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">synchronise</text>
    <text x="130" y="370" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">upward)</text>
  </g>

  
  <line x1="775" y1="460" x2="833" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(805, 460)">
    
    <line x1="-8" y1="-32" x2="8" y2="32" stroke="#db8129" stroke-width="5" stroke-dasharray="6,4" />
    
    <rect x="-85" y="-72" width="170" height="36" rx="18" fill="#fff" stroke="#db8129" stroke-width="2" />
    <text x="0" y="-47" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">upstream lost</text>
  </g>

  
  <g transform="translate(835, 230)">
    <rect width="390" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(167, 25)">
      <rect x="4" y="4" width="48" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="11" r="2.5" fill="#207448" />
      <rect x="4" y="23" width="48" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="30" r="2.5" fill="#207448" />
      <rect x="4" y="42" width="48" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="49" r="2.5" fill="#207448" />
    </g>
    <text x="195" y="115" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Head or</text>
    <text x="195" y="152" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">management node</text>

    
    <rect x="18" y="175" width="354" height="265" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="32" y="220" font-family="monospace" font-size="24" fill="#303a36">pool 2.pool.ntp.org</text>
    <text x="52" y="255" font-family="monospace" font-size="24" fill="#303a36">iburst maxsources 4</text>
    <line x1="32" y1="285" x2="358" y2="285" stroke="#e8f1ea" stroke-width="2" />
    <text x="32" y="325" font-family="monospace" font-size="24" fill="#303a36">allow 10.0.0.0/16</text>
    <line x1="32" y1="355" x2="358" y2="355" stroke="#e8f1ea" stroke-width="2" />
    <text x="32" y="400" font-family="monospace" font-size="24" fill="#303a36">local stratum 10 orphan</text>
  </g>

  
  <line x1="1225" y1="460" x2="1258" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(1260, 230)">
    <rect width="315" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(15, 20)">
      <rect width="285" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="28" cy="38" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="38" r="4" fill="#207448" />
      <text x="54" y="46" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">node01</text>
      <text x="24" y="96" font-family="monospace" font-size="24" fill="#303a36">server head iburst</text>
    </g>

    
    <g transform="translate(15, 165)">
      <rect width="285" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="28" cy="38" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="38" r="4" fill="#207448" />
      <text x="54" y="46" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">node02</text>
      <text x="24" y="96" font-family="monospace" font-size="24" fill="#303a36">server head iburst</text>
    </g>

    
    <g transform="translate(15, 310)">
      <rect width="285" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="28" cy="38" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="38" r="4" fill="#207448" />
      <text x="54" y="46" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">node03</text>
      <text x="24" y="96" font-family="monospace" font-size="24" fill="#303a36">server head iburst</text>
    </g>
  </g>

  
  
  <path d="M 805 500 Q 805 710 825 718" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

  <g transform="translate(450, 720)">
    <rect width="780" height="160" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(30, 48)">
      <circle cx="32" cy="32" r="28" fill="none" stroke="#db8129" stroke-width="4" />
      <polyline points="32,18 32,32 44,38" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="110" y="55" font-family="sans-serif" font-size="24" fill="#303a36">the head node keeps serving time through</text>
    <text x="110" y="95" font-family="sans-serif" font-size="24" fill="#303a36">local stratum 10 orphan, so the cluster</text>
    <text x="110" y="135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">stays consistent with itself</text>
  </g>

  
  <g transform="translate(50, 915)">
    <rect width="900" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 22)">
      <path d="M 16 38 A 12 12 0 0 1 26 18 A 18 18 0 0 1 54 18 A 12 12 0 0 1 66 38 Z" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="115" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Cloud alternative</text>

    
    <g transform="translate(35, 80)">
      <rect width="830" height="48" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="32" font-family="monospace" font-size="24" fill="#303a36">169.254.169.123 on AWS</text>
    </g>
    <g transform="translate(35, 138)">
      <rect width="830" height="48" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="32" font-family="monospace" font-size="24" fill="#303a36">metadata.google.internal on GCP</text>
    </g>
    <text x="40" y="222" font-family="sans-serif" font-size="24" fill="#303a36">work without Internet access and smear leap seconds consistently</text>
  </g>

  
  <g transform="translate(980, 915)">
    <rect width="570" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(35, 30)">
      <rect x="4" y="4" width="48" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="22" r="8" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="36" x2="40" y2="36" stroke="#207448" stroke-width="3" />
    </g>
    <text x="105" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Diskless boot:</text>
    <text x="40" y="135" font-family="sans-serif" font-size="24" fill="#303a36">put the NTP address in DHCP option 42</text>

    
    <g transform="translate(40, 168)">
      <rect width="490" height="64" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="20" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">DHCP option 42 = NTP servers</text>
    </g>
  </g>

  
  <g transform="translate(50, 1220)">
    <rect width="1500" height="76" rx="10" fill="#207448" />
    <text x="750" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Compute nodes point only at the head nodes</text>
  </g>
</svg>