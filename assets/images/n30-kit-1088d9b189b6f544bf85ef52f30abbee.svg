<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What the diagnostic kit collects</title>
  <desc>Visual overview of netdiag.sh read-only collector and the eight command groups it collects into an archive.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What the diagnostic kit collects</text>

  
  
  <path d="M 600 450 V 428 Q 600 420 592 420 H 268 Q 260 420 260 412 V 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 800 450 V 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 1000 450 V 428 Q 1000 420 1008 420 H 1332 Q 1340 420 1340 412 V 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 520 600 H 480" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 1080 600 H 1120" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 600 750 V 772 Q 600 780 592 780 H 268 Q 260 780 260 788 V 810" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 800 750 V 810" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  
  <path d="M 1000 750 V 772 Q 1000 780 1008 780 H 1332 Q 1340 780 1340 788 V 810" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)" />

  

  
  <g id="branch-system">
    <rect x="40" y="120" width="440" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(70, 142)">
      <circle cx="28" cy="28" r="26" stroke="#207448" stroke-width="4" fill="none" />
      <polyline points="28 12, 28 28, 42 28" stroke="#207448" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>
    <text x="145" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">system</text>
    <text x="70" y="240" font-family="monospace" font-size="24" fill="#303a36">date</text>
    <text x="70" y="285" font-family="monospace" font-size="24" fill="#303a36">uname</text>
    <text x="70" y="330" font-family="monospace" font-size="24" fill="#303a36">uptime</text>
  </g>

  
  <g id="branch-addresses-routes">
    <rect x="520" y="120" width="560" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(552, 142)">
      <circle cx="10" cy="28" r="8" stroke="#207448" stroke-width="4" fill="none" />
      <circle cx="46" cy="14" r="8" stroke="#207448" stroke-width="4" fill="none" />
      <circle cx="46" cy="42" r="8" stroke="#207448" stroke-width="4" fill="none" />
      <path d="M 18 28 H 28 Q 38 28 38 18 V 14" stroke="#207448" stroke-width="4" fill="none" />
      <path d="M 18 28 H 28 Q 38 28 38 38 V 42" stroke="#207448" stroke-width="4" fill="none" />
    </g>
    <text x="625" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">addresses and routes</text>
    <text x="552" y="232" font-family="monospace" font-size="24" fill="#303a36">ip -br addr</text>
    <text x="552" y="270" font-family="monospace" font-size="24" fill="#303a36">ip route show table all</text>
    <text x="552" y="308" font-family="monospace" font-size="24" fill="#303a36">ip rule</text>
    <text x="552" y="346" font-family="monospace" font-size="24" fill="#303a36">ip neigh</text>
  </g>

  
  <g id="branch-sockets">
    <rect x="1120" y="120" width="440" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1150, 142)">
      <rect x="0" y="8" width="18" height="40" rx="4" stroke="#207448" stroke-width="4" fill="none" />
      <rect x="38" y="8" width="18" height="40" rx="4" stroke="#207448" stroke-width="4" fill="none" />
      <line x1="18" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="1225" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">sockets</text>
    <text x="1150" y="255" font-family="monospace" font-size="24" fill="#303a36">ss -s</text>
    <text x="1150" y="305" font-family="monospace" font-size="24" fill="#303a36">ss -tanpi</text>
  </g>

  

  
  <g id="branch-counters">
    <rect x="40" y="465" width="440" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(70, 487)">
      <path d="M 4 44 A 26 26 0 1 1 52 44" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" />
      <line x1="28" y1="36" x2="44" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="36" r="4" fill="#207448" />
    </g>
    <text x="145" y="525" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">counters</text>
    <text x="70" y="585" font-family="monospace" font-size="24" fill="#303a36">nstat -az</text>
    <text x="70" y="630" font-family="monospace" font-size="24" fill="#303a36">/proc/net/softnet_stat</text>
    <text x="70" y="675" font-family="monospace" font-size="24" fill="#303a36">/proc/net/dev</text>
  </g>

  
  <g id="central-box">
    <rect x="520" y="450" width="560" height="300" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(772, 475)">
      <rect x="0" y="0" width="56" height="46" rx="6" stroke="#db8129" stroke-width="4" fill="none" />
      <line x1="0" y1="16" x2="56" y2="16" stroke="#db8129" stroke-width="4" />
      <line x1="28" y1="16" x2="28" y2="46" stroke="#db8129" stroke-width="4" />
      <rect x="19" y="24" width="18" height="12" rx="2" stroke="#db8129" stroke-width="3" fill="none" />
    </g>
    <text x="800" y="565" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">netdiag.sh:</text>
    <text x="800" y="612" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">read-only collector,</text>
    <text x="800" y="652" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">output tarball attached</text>
    <text x="800" y="692" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">to the ticket</text>
  </g>

  
  <g id="branch-nic">
    <rect x="1120" y="465" width="440" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1150, 487)">
      <rect x="2" y="6" width="52" height="44" rx="6" stroke="#207448" stroke-width="4" fill="none" />
      <path d="M 14 50 V 34 H 42 V 50" stroke="#207448" stroke-width="4" fill="none" />
      <line x1="22" y1="20" x2="22" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="20" x2="28" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="34" y1="20" x2="34" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1225" y="525" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NIC</text>
    <text x="1150" y="605" font-family="monospace" font-size="24" fill="#303a36">ethtool -S, -k, -g, -m</text>
  </g>

  

  
  <g id="branch-firewall">
    <rect x="40" y="810" width="440" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(70, 832)">
      <path d="M 28 2 L 52 10 V 30 C 52 44 28 54 28 54 C 28 54 4 44 4 30 V 10 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" />
      <line x1="28" y1="10" x2="28" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="10" y1="28" x2="46" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="145" y="870" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">firewall</text>
    <text x="70" y="925" font-family="monospace" font-size="24" fill="#303a36">nft list ruleset</text>
    <text x="70" y="963" font-family="monospace" font-size="24" fill="#303a36">iptables-save</text>
    <text x="70" y="1001" font-family="monospace" font-size="24" fill="#303a36">conntrack -S</text>
    <text x="70" y="1039" font-family="monospace" font-size="24" fill="#303a36">tc -s qdisc</text>
  </g>

  
  <g id="branch-kernel-gpu">
    <rect x="520" y="810" width="560" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(552, 832)">
      <rect x="8" y="8" width="40" height="40" rx="5" stroke="#207448" stroke-width="4" fill="none" />
      <rect x="18" y="18" width="20" height="20" stroke="#207448" stroke-width="3" fill="none" />
      <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="40" y1="0" x2="40" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="48" x2="16" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="40" y1="48" x2="40" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="625" y="855" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="625" dy="0">kernel logs,</tspan>
      <tspan x="625" dy="34">RDMA and GPU</tspan>
    </text>
    <text x="552" y="930" font-family="monospace" font-size="24" fill="#303a36">dmesg</text>
    <text x="552" y="966" font-family="monospace" font-size="24" fill="#303a36">ibstat</text>
    <text x="552" y="1002" font-family="monospace" font-size="24" fill="#303a36">rdma link</text>
    <text x="552" y="1038" font-family="monospace" font-size="24" fill="#303a36">nvidia-smi topo -m</text>
  </g>

  
  <g id="branch-dns">
    <rect x="1120" y="810" width="440" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1150, 832)">
      <circle cx="28" cy="28" r="26" stroke="#207448" stroke-width="4" fill="none" />
      <ellipse cx="28" cy="28" rx="12" ry="26" stroke="#207448" stroke-width="3" fill="none" />
      <line x1="2" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1225" y="870" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DNS</text>
    <text x="1150" y="945" font-family="monospace" font-size="24" fill="#303a36">resolv.conf</text>
    <text x="1150" y="995" font-family="monospace" font-size="24" fill="#303a36">resolvectl status</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="80" y="1110" width="1440" height="64" rx="12" fill="#207448" />
    <text x="800" y="1151" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Attach the archive to the ticket before anyone changes the node</text>
  </g>
</svg>