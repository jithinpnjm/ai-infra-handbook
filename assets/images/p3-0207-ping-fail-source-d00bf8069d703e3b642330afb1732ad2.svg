<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>A failed ping: the message and its source tell you where to look</title>
  <desc>Infographic explaining how to diagnose ping failures based on ICMP error messages, their source addresses, protocol limits, and cluster verification commands.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448"/>
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">A failed ping: the message and its source tell you where to look</text>

  

  
  <g id="node-root">
    <rect x="40" y="402" width="160" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <path d="M 60 435 L 75 447 L 60 459" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="82" y1="459" x2="96" y2="459" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <text x="110" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">ping fails</text>
  </g>

  
  
  <line x1="200" y1="447" x2="230" y2="447" stroke="#207448" stroke-width="3"/>
  
  <line x1="230" y1="202" x2="230" y2="692" stroke="#207448" stroke-width="3"/>

  
  <line x1="230" y1="202" x2="258" y2="202" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <line x1="230" y1="382" x2="258" y2="382" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <line x1="230" y1="537" x2="258" y2="537" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <line x1="230" y1="692" x2="258" y2="692" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  <g id="branch1-condition">
    <rect x="260" y="110" width="360" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="285" y="125" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="297" y1="151" x2="309" y2="151" stroke="#207448" stroke-width="3"/>
    <line x1="293" y1="157" x2="313" y2="157" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="285" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="285" dy="0">Destination Host</tspan>
      <tspan x="285" dy="30">Unreachable, with your</tspan>
      <tspan x="285" dy="30">own address as the source</tspan>
    </text>
  </g>

  
  <line x1="620" y1="202" x2="668" y2="202" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

  
  <g id="branch1-outcome">
    <rect x="670" y="110" width="360" height="185" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 695 138 L 712 138 M 724 138 L 741 138" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="718" cy="138" r="4" fill="none" stroke="#db8129" stroke-width="2.5"/>
    <text x="695" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="695" dy="0">your host gave up asking</tspan>
      <tspan x="695" dy="28">for the neighbour's MAC:</tspan>
      <tspan x="695" dy="28">ARP or NDP failed on the</tspan>
      <tspan x="695" dy="28">local link, not routing</tspan>
    </text>
  </g>

  
  
  <g id="branch2-condition">
    <rect x="260" y="315" width="360" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="285" y="330" width="38" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="295" cy="342" r="2.5" fill="#207448"/>
    <circle cx="304" cy="342" r="2.5" fill="#207448"/>
    <circle cx="313" cy="342" r="2.5" fill="#207448"/>
    <text x="285" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="285" dy="0">Destination Host Unreachable</tspan>
      <tspan x="285" dy="30">from a router's address</tspan>
    </text>
  </g>

  
  <line x1="620" y1="382" x2="668" y2="382" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="branch2-outcome">
    <rect x="670" y="315" width="360" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 695 342 L 725 342 M 710 327 L 710 357" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="720" y1="332" x2="730" y2="352" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="695" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">that router had no route</text>
  </g>

  
  
  <g id="branch3-condition">
    <rect x="260" y="470" width="360" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 288 500 A 8 8 0 0 1 300 490 A 10 10 0 0 1 318 493 A 8 8 0 0 1 324 503 L 288 503 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <text x="285" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="285" dy="0">Destination Net Unreachable</tspan>
      <tspan x="285" dy="30">or Packet filtered</tspan>
    </text>
  </g>

  
  <line x1="620" y1="537" x2="668" y2="537" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="branch3-outcome">
    <rect x="670" y="470" width="360" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 695 484 L 725 484 L 715 500 L 715 512 L 705 508 L 705 500 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <text x="695" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">routing or a filter</text>
  </g>

  
  
  <g id="branch4-condition">
    <rect x="260" y="625" width="360" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="303" cy="648" r="14" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="303,640 303,648 311,648" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="285" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="285" dy="0">Request timeout,</tspan>
      <tspan x="285" dy="30">or no output at all</tspan>
    </text>
  </g>

  
  <line x1="620" y1="692" x2="668" y2="692" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="branch4-outcome">
    <rect x="670" y="625" width="360" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 700 638 L 720 638 M 710 638 L 710 656" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 704 650 L 710 656 L 716 650" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="696" y1="662" x2="724" y2="662" stroke="#207448" stroke-width="3" stroke-dasharray="3 3"/>
    <text x="695" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">dropped silently somewhere</text>
  </g>

  
  <g id="panel-limits">
    <rect x="1060" y="110" width="500" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    
    <circle cx="1098" cy="155" r="16" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1098" y1="147" x2="1098" y2="157" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1098" cy="163" r="1.5" fill="#207448"/>
    <text x="1126" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Ping has limits</text>
    <line x1="1080" y1="188" x2="1540" y2="188" stroke="#a3c2ad" stroke-width="1.5"/>

    
    <text x="1080" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">ICMP can be treated differently from real</tspan>
      <tspan x="1080" dy="30">traffic: low priority, blocked, rate limited,</tspan>
      <tspan x="1080" dy="30">or hashed on to a different ECMP path</tspan>
    </text>

    
    <text x="1080" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">success does not prove an application</tspan>
      <tspan x="1080" dy="30">can connect; test the port with</tspan>
      <tspan x="1080" dy="32" font-family="monospace">nc -zv host 443 or curl -v</tspan>
    </text>

    
    <text x="1080" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">failure does not prove the host is down</tspan>
    </text>

    
    <text x="1080" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">some internet hosts disable echo replies</tspan>
      <tspan x="1080" dy="30">so a site can load while ping gets no answer</tspan>
    </text>
  </g>

  
  <g id="panel-jobs">
    <rect x="40" y="785" width="1520" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <rect x="70" y="805" width="34" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="70" y1="817" x2="104" y2="817" stroke="#207448" stroke-width="2.5"/>
    <circle cx="78" cy="811" r="2" fill="#207448"/>
    <circle cx="78" cy="823" r="2" fill="#207448"/>
    <text x="118" y="826" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Practical jobs on a cluster</text>

    
    <rect x="70" y="850" width="460" height="145" rx="12" fill="#ffffff" stroke="#a3c2ad" stroke-width="1.5"/>
    <text x="94" y="910" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="94" dy="0">fping -a -g 10.0.0.0/24 or</tspan>
      <tspan x="94" dy="34">fping -f hosts to sweep nodes</tspan>
    </text>

    
    <rect x="570" y="850" width="460" height="145" rx="12" fill="#ffffff" stroke="#a3c2ad" stroke-width="1.5"/>
    <text x="594" y="895" font-size="24" fill="#303a36">
      <tspan x="594" dy="0" font-family="monospace">ping -c 3 &lt;peer rail IP&gt;</tspan>
      <tspan x="594" dy="30" font-family="monospace">-I &lt;rail NIC&gt;</tspan>
      <tspan x="594" dy="34" font-family="system-ui, -apple-system, sans-serif">proves each rail works</tspan>
    </text>

    
    <rect x="1070" y="850" width="460" height="145" rx="12" fill="#ffffff" stroke="#a3c2ad" stroke-width="1.5"/>
    <text x="1094" y="895" font-size="24" fill="#303a36">
      <tspan x="1094" dy="0" font-family="monospace">ping -M do -s 8972 &lt;peer&gt;</tspan>
      <tspan x="1094" dy="32" font-family="system-ui, -apple-system, sans-serif">verifies 9000-byte jumbo</tspan>
      <tspan x="1094" dy="30" font-family="system-ui, -apple-system, sans-serif">paths end to end</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1045" width="1520" height="75" rx="12" fill="#207448"/>
    <text x="800" y="1092" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The source of the message matters as much as the message</text>
  </g>
</svg>