<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three habits that waste time, and the method that replaces them</title>
  <desc>Infographic contrasting three time-wasting anti-methods (Streetlight, Random change, and Blame-someone-else) with the structured replacement method: Problem statement, Scientific method with observational, experimental, and negative test types, and Diagnosis cycle.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 1 3 L 16 9 L 1 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Three habits that waste time,</tspan>
    <tspan x="800" dy="54">and the method that replaces them</tspan>
  </text>

  

  
  <g id="card-streetlight">
    <rect x="40" y="140" width="600" height="265" rx="14" fill="#ffffff" stroke="#788a80" stroke-width="2.5" />
    
    
    <g transform="translate(64, 160)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 52 L 14 16 C 14 8 26 8 32 8 L 42 8" />
      <path d="M 34 16 L 50 16 L 46 24 L 38 24 Z" />
      <line x1="36" y1="30" x2="30" y2="44" stroke-dasharray="3,3" />
      <line x1="42" y1="30" x2="42" y2="46" stroke-dasharray="3,3" />
      <line x1="48" y1="30" x2="54" y2="44" stroke-dasharray="3,3" />
    </g>

    
    <text x="136" y="198" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#303a36">Streetlight:</tspan>
    </text>
    <text x="64" y="246" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">use the tools you know or that</tspan>
      <tspan x="64" dy="32">are easy, where the light is good</tspan>
      <tspan x="64" dy="32">(running top because you know it)</tspan>
    </text>

    
    <rect x="56" y="334" width="568" height="56" rx="8" fill="#fbebe8" stroke="#d93829" stroke-width="1.5" />
    <text x="72" y="374" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c03020">
      <tspan>finds an issue, not the issue</tspan>
    </text>
  </g>

  
  <g id="card-random-change">
    <rect x="40" y="445" width="600" height="265" rx="14" fill="#ffffff" stroke="#788a80" stroke-width="2.5" />
    
    
    <g transform="translate(64, 465)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="10" y1="14" x2="46" y2="14" />
      <circle cx="20" cy="14" r="5" fill="#e8f1ea" />
      <line x1="10" y1="28" x2="46" y2="28" />
      <circle cx="38" cy="28" r="5" fill="#e8f1ea" />
      <line x1="10" y1="42" x2="46" y2="42" />
      <circle cx="26" cy="42" r="5" fill="#e8f1ea" />
    </g>

    
    <text x="136" y="502" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#303a36">Random change:</tspan>
    </text>
    <text x="64" y="552" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">change tunables until it improves</tspan>
      <tspan x="64" dy="32">and keep what looks better</tspan>
    </text>

    
    <rect x="56" y="622" width="568" height="80" rx="8" fill="#fbebe8" stroke="#d93829" stroke-width="1.5" />
    <text x="72" y="662" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c03020">
      <tspan x="72" dy="0">unexplained, fragile, may encode</tspan>
      <tspan x="72" dy="30">workarounds, risk at peak</tspan>
    </text>
  </g>

  
  <g id="card-blame-someone-else">
    <rect x="40" y="750" width="600" height="310" rx="14" fill="#ffffff" stroke="#788a80" stroke-width="2.5" />
    
    
    <g transform="translate(64, 770)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="26" height="36" rx="4" />
      <line x1="14" y1="20" x2="26" y2="20" />
      <line x1="14" y1="28" x2="22" y2="28" />
      <path d="M 30 28 L 46 28 M 40 22 L 46 28 L 40 34" />
    </g>

    
    <text x="136" y="808" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#303a36">Blame-someone-else:</tspan>
    </text>
    <text x="64" y="856" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">hypothesise a component you do not</tspan>
      <tspan x="64" dy="32">own and hand it over without data</tspan>
    </text>

    
    <rect x="56" y="926" width="568" height="122" rx="8" fill="#fbebe8" stroke="#d93829" stroke-width="1.5" />
    <text x="72" y="966" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c03020">
      <tspan x="72" dy="0">wastes other teams;</tspan>
      <tspan x="72" dy="30">a ticket bounces for a week;</tspan>
      <tspan x="72" dy="30">demand screenshots of tools run</tspan>
    </text>
  </g>

  

  
  <g id="node-problem-statement">
    <rect x="680" y="140" width="880" height="135" rx="14" fill="#fef8f3" stroke="#db8129" stroke-width="3.5" />
    
    
    <circle cx="724" cy="207" r="24" fill="#db8129" />
    <text x="724" y="216" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(768, 179)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <circle cx="28" cy="28" r="10" />
      <line x1="28" y1="2" x2="28" y2="12" />
      <line x1="28" y1="44" x2="28" y2="54" />
      <line x1="2" y1="28" x2="12" y2="28" />
      <line x1="44" y1="28" x2="54" y2="28" />
    </g>

    
    <text x="850" y="217" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">
      <tspan>Problem statement (always first)</tspan>
    </text>
  </g>

  
  <path d="M 890 275 L 890 313" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="node-scientific-method">
    <rect x="680" y="315" width="420" height="575" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <circle cx="724" cy="365" r="24" fill="#207448" />
    <text x="724" y="374" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(764, 337)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 8 L 34 8 M 28 8 L 28 22 L 12 46 C 10 50 14 54 20 54 L 36 54 C 42 54 46 50 44 46 L 28 22" />
      <line x1="18" y1="40" x2="38" y2="40" />
    </g>

    
    <text x="890" y="430" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan>Scientific method:</tspan>
    </text>

    
    
    <rect x="710" y="460" width="360" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="890" y="500" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan>question,</tspan>
    </text>

    
    <rect x="710" y="534" width="360" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="890" y="574" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan>hypothesis,</tspan>
    </text>

    
    <rect x="710" y="608" width="360" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="890" y="648" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan>prediction,</tspan>
    </text>

    
    <rect x="710" y="682" width="360" height="60" rx="8" fill="#207448" stroke="#207448" stroke-width="1.5" />
    <text x="890" y="722" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      <tspan>test,</tspan>
    </text>

    
    <rect x="710" y="756" width="360" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="890" y="796" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan>analysis</tspan>
    </text>
  </g>

  
  <path d="M 1070 712 L 1140 712" fill="none" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,4" />

  

  
  <g id="test-observational">
    <rect x="1140" y="315" width="420" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1160, 331)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 22 C 12 10 32 10 40 22 C 32 34 12 34 4 22 Z" />
      <circle cx="22" cy="22" r="7" />
    </g>

    
    <text x="1220" y="362" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan>Observational:</tspan>
    </text>
    
    <text x="1164" y="403" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1164" dy="0">watch the system</tspan>
      <tspan x="1164" dy="30">while it runs</tspan>
    </text>
  </g>

  
  <g id="test-experimental">
    <rect x="1140" y="490" width="420" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1160, 507)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="32" height="16" rx="8" />
      <circle cx="30" cy="22" r="6" fill="#207448" />
    </g>

    
    <text x="1220" y="538" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan>Experimental:</tspan>
    </text>
    
    <text x="1164" y="582" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1164" dy="0">change one thing;</tspan>
      <tspan x="1164" dy="28">if it does nothing,</tspan>
      <tspan x="1164" dy="28">revert it before the</tspan>
      <tspan x="1164" dy="28">next hypothesis</tspan>
    </text>
  </g>

  
  <g id="test-negative">
    <rect x="1140" y="725" width="420" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1160, 742)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 10 24 L 22 24 L 18 40 L 34 18 L 22 18 Z" />
    </g>

    
    <text x="1220" y="773" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan>Negative:</tspan>
    </text>
    
    <text x="1164" y="818" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1164" dy="0">deliberately worsen</tspan>
      <tspan x="1164" dy="28">something to confirm</tspan>
      <tspan x="1164" dy="28">a cause</tspan>
    </text>
  </g>

  
  <path d="M 890 890 L 890 928" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="node-diagnosis-cycle">
    <rect x="680" y="930" width="880" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <circle cx="724" cy="995" r="24" fill="#207448" />
    <text x="724" y="1004" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(768, 967)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 44 20 A 18 18 0 0 0 14 24" />
      <polyline points="10 14 14 24 24 24" />
      <path d="M 12 36 A 18 18 0 0 0 42 32" />
      <polyline points="46 42 42 32 32 32" />
    </g>

    
    <text x="850" y="978" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">Diagnosis cycle:</tspan>
    </text>
    <text x="850" y="1014" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="850" dy="0" font-weight="bold">hypothesis, instrumentation, data, hypothesis,</tspan>
      <tspan x="850" dy="30">quickly so bad theories die early</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="40" y="1100" width="1520" height="60" rx="10" fill="#207448" />
    <text x="800" y="1141" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
      <tspan>A method fixes the order of the questions, so your favourite tool comes after the evidence</tspan>
    </text>
  </g>
</svg>