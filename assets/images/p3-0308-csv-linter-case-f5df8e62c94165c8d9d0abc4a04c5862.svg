<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Case study: three silent data bugs and two small Click tools</title>
  <desc>Visual infographic explaining three silent data bugs caught by csv-linter and secure microservice dispatch with cloud-translate.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Case study: three silent data bugs and two small Click tools</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Practical MLOps chapter 11, modelled in code/part03/python_clis_agents_exporters.py</text>

  
  <g id="left-panel">
    <rect x="40" y="95" width="740" height="1015" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(60, 110)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="38" y1="38" x2="52" y2="52" stroke="#207448" stroke-width="5" stroke-linecap="round" />
    </g>
    <text x="130" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">csv-linter</text>

    
    <rect x="65" y="165" width="690" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(85, 178)">
      <rect x="0" y="0" width="40" height="48" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="12" x2="32" y2="12" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="24" x2="32" y2="24" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="36" x2="24" y2="36" stroke="#207448" stroke-width="3" />
    </g>
    <text x="145" y="197" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">inspect the 32,770-row wine.csv</text>
    <text x="145" y="225" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">with df.describe()</text>

    
    <path d="M 410 240 L 410 258 L 85 258 L 85 558" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 85 325 L 105 325" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
    <path d="M 85 437 L 105 437" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
    <path d="M 85 558 L 105 558" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="105" y="275" width="645" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="125" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">grape column count 0.0: 100 percent NaN,</text>
    <text x="125" y="337" font-family="ui-monospace, monospace" font-size="24" fill="#207448">found by zero_count_columns(df)</text>
    <text x="125" y="365" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">where df[key].count() == 0</text>

    
    <rect x="105" y="387" width="645" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="125" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Unnamed: 0 column added on every round-trip</text>
    <text x="125" y="447" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">because df.to_csv(wine.csv) had no index=False,</text>
    <text x="125" y="475" font-family="ui-monospace, monospace" font-size="24" fill="#207448">found by unnamed_columns(df)</text>

    
    <rect x="105" y="499" width="645" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="125" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Windows carriage returns \r\n (^M in vim)</text>
    <text x="125" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">inside notes fields, found by</text>
    <text x="125" y="583" font-family="ui-monospace, monospace" font-size="24" fill="#207448">carriage_returns(df), which returns the first</text>
    <text x="125" y="611" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(index, column, field) truncated to field[:50]</text>

    
    <rect x="65" y="635" width="690" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="98" cy="672" r="20" fill="#207448" />
    <text x="98" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="135" y="665" font-family="ui-monospace, monospace" font-size="24" fill="#207448">csv_linter/checks.py</text>
    <text x="135" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">small testable functions</text>

    
    <line x1="410" y1="710" x2="410" y2="728" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="65" y="730" width="690" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="98" cy="770" r="20" fill="#207448" />
    <text x="98" y="778" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="135" y="762" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">@click.command, @click.argument(filename,</text>
    <text x="135" y="792" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">type=click.Path(exists=True)) def main(filename)</text>

    
    <line x1="410" y1="810" x2="410" y2="828" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="65" y="830" width="690" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="98" cy="870" r="20" fill="#207448" />
    <text x="98" y="878" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="135" y="862" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">entry_points: csv-linter=csv_linter.main:main,</text>
    <text x="135" y="892" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">which is [project.scripts] in pyproject.toml</text>

    
    <line x1="410" y1="910" x2="410" y2="928" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="65" y="930" width="690" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="98" cy="965" r="20" fill="#207448" />
    <text x="98" y="973" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="135" y="973" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">pip install -e .</text>

    
    <rect x="90" y="995" width="645" height="75" rx="6" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
    <text x="115" y="1027" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">rerun after renaming or moving the file,</text>
    <text x="115" y="1055" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">because it regenerates the entry-point wrapper</text>
  </g>

  
  <g id="right-panel">
    <rect x="820" y="95" width="740" height="1015" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(840, 110)">
      <path d="M 12 36 A 14 14 0 0 1 24 16 A 18 18 0 0 1 50 20 A 14 14 0 0 1 52 36 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    <text x="910" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">cloud-translate</text>

    
    <rect x="845" y="165" width="690" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(865, 178)">
      <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 12 18 L 22 24 L 12 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="26" y1="32" x2="36" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="935" y="212" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">cloud-translate=trigger:main</text>

    
    <line x1="1190" y1="240" x2="1190" y2="263" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="845" y="265" width="690" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(865, 280)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 24 12 L 20 24 L 28 24 L 24 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="935" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">HTTP Cloud Function with</text>
    <text x="935" y="327" font-family="ui-monospace, monospace" font-size="24" fill="#207448">google-cloud-translate==3.0.2,</text>
    <text x="935" y="357" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">TranslationServiceClient() in us-central1,</text>
    <text x="935" y="387" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">target_language_code=fr</text>

    
    <line x1="1190" y1="415" x2="1190" y2="443" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="845" y="445" width="690" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="878" cy="490" r="20" fill="#207448" />
    <text x="878" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="915" y="482" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">subprocess.Popen([gcloud, auth,</text>
    <text x="915" y="512" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">print-identity-token], stdout=PIPE)</text>

    
    <line x1="1190" y1="535" x2="1190" y2="558" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="845" y="560" width="690" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="878" cy="597" r="20" fill="#207448" />
    <text x="878" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="915" y="605" font-family="ui-monospace, monospace" font-size="24" fill="#207448">out.decode(utf-8).strip()</text>

    
    <line x1="1190" y1="635" x2="1190" y2="658" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="845" y="660" width="690" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="878" cy="705" r="20" fill="#207448" />
    <text x="878" y="713" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="915" y="697" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">requests.post(url, json={message: text},</text>
    <text x="915" y="727" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">headers={Authorization: bearer token})</text>

    
    <rect x="845" y="780" width="690" height="305" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(1162, 810)">
      <path d="M 28 6 L 50 14 L 50 32 C 50 46 28 58 28 58 C 28 58 6 46 6 32 L 6 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="28" cy="28" r="6" fill="#207448" />
      <line x1="28" y1="34" x2="28" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="1190" y="915" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">heavy ML weights do not belong</text>
    <text x="1190" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">inside every CLI;</text>
    <text x="1190" y="995" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">a 20-line Click CLI is a secure client</text>
    <text x="1190" y="1035" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">for a cloud microservice</text>
  </g>

  
  <rect x="40" y="1125" width="1520" height="55" rx="8" fill="#207448" />
  <text x="800" y="1161" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A packaged single-purpose CLI beats a notebook or a shell snippet</text>
</svg>