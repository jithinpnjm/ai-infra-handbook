<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Draw the product boundary before the boxes [official]</title>
  <desc>Visual architecture contrasting inference product boundaries with underlying AI cloud infrastructure resources.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Draw the product boundary before the boxes [official]</text>

  
  
  

  
  <g id="node-client">
    <rect x="50" y="270" width="220" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="132" y="288" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="132" y1="300" x2="188" y2="300" stroke="#207448" stroke-width="3" />
    <circle cx="142" cy="294" r="2.5" fill="#207448" />
    <circle cx="150" cy="294" r="2.5" fill="#207448" />
    <text x="160" y="375" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Client app</text>
  </g>

  
  <g id="node-control">
    <rect x="50" y="105" width="310" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 85 140 L 91 140 L 93 145 L 98 143 L 101 148 L 98 152 L 101 157 L 96 160 L 93 158 L 91 163 L 85 163 L 83 158 L 78 160 L 75 155 L 78 151 L 75 146 L 80 144 Z" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="88" cy="151" r="5" fill="none" stroke="#207448" stroke-width="3" />
    <text x="215" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Control plane API</text>
  </g>

  
  <g id="node-dataplane">
    <rect x="360" y="360" width="300" height="150" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <circle cx="510" cy="405" r="22" fill="none" stroke="#db8129" stroke-width="4" />
    <ellipse cx="510" cy="405" rx="10" ry="22" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="488" y1="405" x2="532" y2="405" stroke="#db8129" stroke-width="3" />
    <text x="510" y="460" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="510" dy="0">Regional</tspan>
      <tspan x="510" dy="34">data-plane URL</tspan>
    </text>
  </g>

  
  <g id="node-shared">
    <rect x="740" y="270" width="290" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 865 315 A 14 14 0 0 1 890 305 A 18 18 0 0 1 915 318 A 12 12 0 0 1 910 332 L 860 332 A 12 12 0 0 1 865 315 Z" fill="none" stroke="#207448" stroke-width="3" />
    <text x="885" y="365" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="885" dy="0">Public</tspan>
      <tspan x="885" dy="34">Serverless pool</tspan>
    </text>
  </g>

  
  <g id="node-dedicated">
    <rect x="740" y="475" width="290" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 885 500 L 905 508 L 905 528 C 905 540 885 548 885 548 C 885 548 865 540 865 528 L 865 508 Z" fill="none" stroke="#207448" stroke-width="3" />
    <text x="885" y="582" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Dedicated Endpoint</text>
  </g>

  
  <g id="node-runtime">
    <rect x="1105" y="295" width="445" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1302" y="312" width="50" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="1312" y1="305" x2="1312" y2="312" stroke="#207448" stroke-width="3" />
    <line x1="1327" y1="305" x2="1327" y2="312" stroke="#207448" stroke-width="3" />
    <line x1="1342" y1="305" x2="1342" y2="312" stroke="#207448" stroke-width="3" />
    <line x1="1312" y1="352" x2="1312" y2="359" stroke="#207448" stroke-width="3" />
    <line x1="1327" y1="352" x2="1327" y2="359" stroke="#207448" stroke-width="3" />
    <line x1="1342" y1="352" x2="1342" y2="359" stroke="#207448" stroke-width="3" />
    <text x="1327" y="390" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1327" dy="0">Model runtime:</tspan>
      <tspan x="1327" dy="32">internals not public</tspan>
    </text>
  </g>

  
  <g id="node-stream">
    <rect x="1225" y="115" width="325" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 1260 172 Q 1275 158 1290 172 T 1320 172" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="1420" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Token stream</text>
  </g>

  
  <g id="node-metrics">
    <rect x="1170" y="500" width="380" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1205" y="562" width="8" height="18" fill="#207448" />
    <rect x="1219" y="546" width="8" height="34" fill="#207448" />
    <rect x="1233" y="534" width="8" height="46" fill="#207448" />
    <text x="1385" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Dedicated-only metrics</text>
  </g>

  
  <g id="node-billing">
    <rect x="290" y="630" width="440" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />
    
    <rect x="485" y="648" width="50" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="495" y1="660" x2="525" y2="660" stroke="#207448" stroke-width="3" />
    <line x1="495" y1="670" x2="525" y2="670" stroke="#207448" stroke-width="3" />
    <text x="510" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="510" dy="0">Usage and billing views:</tspan>
      <tspan x="510" dy="34">meter design not public</tspan>
    </text>
  </g>

  
  
  

  
  <path d="M 120 270 L 120 223" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="128" y="230" width="186" height="32" rx="4" fill="#f5f8f5" />
  <text x="130" y="254" font-family="sans-serif" font-size="24" fill="#303a36">manage endpoint</text>

  
  <path d="M 230 215 L 230 262" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="238" y="228" width="415" height="34" rx="4" fill="#f5f8f5" />
  <text x="240" y="253" font-family="monospace" font-size="24" fill="#303a36">returns endpoint_id and routing_key</text>

  
  <path d="M 270 410 L 352 410" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="140" y="435" width="220" height="34" rx="4" fill="#f5f8f5" />
  <text x="142" y="460" font-family="sans-serif" font-size="24" fill="#303a36">API key and request</text>

  
  <path d="M 660 400 L 700 400 L 700 342 L 732 342" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 660 470 L 700 470 L 700 545 L 732 545" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1030 342 L 1097 342" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1030 545 L 1070 545 L 1070 395 L 1097 395" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1385 295 L 1385 238" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1030 580 L 1162 580" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 510 510 L 510 622" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)" />

  
  
  

  <g id="subgraph-cloud">
    
    <rect x="50" y="810" width="1500" height="350" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3" stroke-dasharray="10 8" />

    
    <rect x="50" y="810" width="670" height="52" rx="14" fill="#207448" />
    <text x="75" y="846" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">AI Cloud resources a customer can build</text>

    
    <g id="node-tenant">
      <rect x="75" y="930" width="220" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <rect x="167" y="955" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 174 955 L 174 947 A 11 11 0 0 1 196 947 L 196 955" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="185" cy="968" r="3" fill="#207448" />
      <text x="185" y="1025" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="185" dy="0">Tenant</tspan>
        <tspan x="185" dy="34">and IAM</tspan>
      </text>
    </g>

    
    <g id="node-proj">
      <rect x="365" y="930" width="180" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <path d="M 432 952 L 447 952 L 454 960 L 478 960 A 4 4 0 0 1 482 964 L 482 984 A 4 4 0 0 1 478 988 L 432 988 A 4 4 0 0 1 428 984 L 428 956 A 4 4 0 0 1 432 952 Z" fill="none" stroke="#207448" stroke-width="3" />
      <text x="455" y="1035" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Project</text>
    </g>

    
    <g id="node-net">
      <rect x="615" y="930" width="210" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <circle cx="685" cy="955" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="755" cy="955" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="720" cy="980" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="692" y1="958" x2="714" y2="974" stroke="#207448" stroke-width="2.5" />
      <line x1="748" y1="958" x2="726" y2="974" stroke="#207448" stroke-width="2.5" />
      <text x="720" y="1025" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="720" dy="0">VPC and</tspan>
        <tspan x="720" dy="34">subnet</tspan>
      </text>
    </g>

    
    <g id="node-gpu">
      <rect x="850" y="930" width="220" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <rect x="935" y="946" width="50" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="948" cy="965" r="4" fill="#207448" />
      <circle cx="960" cy="965" r="4" fill="#207448" />
      <circle cx="972" cy="965" r="4" fill="#207448" />
      <text x="960" y="1025" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="960" dy="0">GPU VMs</tspan>
        <tspan x="960" dy="34">and clusters</tspan>
      </text>
    </g>

    
    <g id="node-k8s">
      <rect x="1095" y="930" width="205" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <circle cx="1197" cy="965" r="16" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="1197" cy="965" r="4" fill="#207448" />
      <line x1="1197" y1="945" x2="1197" y2="985" stroke="#207448" stroke-width="2.5" />
      <line x1="1180" y1="955" x2="1214" y2="975" stroke="#207448" stroke-width="2.5" />
      <line x1="1180" y1="975" x2="1214" y2="955" stroke="#207448" stroke-width="2.5" />
      <text x="1197" y="1025" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="1197" dy="0">Managed</tspan>
        <tspan x="1197" dy="34">Kubernetes</tspan>
      </text>
    </g>

    
    <g id="node-store">
      <rect x="1325" y="930" width="205" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <ellipse cx="1427" cy="952" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 1407 952 L 1407 978 A 20 7 0 0 0 1447 978 L 1447 952" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 1407 965 A 20 7 0 0 0 1447 965" fill="none" stroke="#207448" stroke-width="2" />
      <text x="1427" y="1018" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="1427" dy="0">Disks,</tspan>
        <tspan x="1427" dy="32">filesystems,</tspan>
        <tspan x="1427" dy="32">objects</tspan>
      </text>
    </g>

    
    
    <path d="M 295 1005 L 357 1005" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <path d="M 545 1005 L 607 1005" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <path d="M 500 930 L 500 895 L 960 895 L 960 922" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <path d="M 480 930 L 480 882 L 1197 882 L 1197 922" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <path d="M 460 930 L 460 869 L 1427 869 L 1427 922" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  </g>
</svg>