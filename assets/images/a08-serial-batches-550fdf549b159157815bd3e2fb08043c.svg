<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>serial batches grow from one canary node</title>
  <desc>Visual infographic explaining how Ansible serial batches grow progressively from a one-node canary to larger slices of the fleet, governed by failure limits.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">serial batches grow from one canary node</text>

  
  <g id="top-spec-bar">
    <rect x="70" y="105" width="1460" height="72" rx="12" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>
    <rect x="95" y="115" width="530" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="360" y="150" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">serial: [1, &quot;10%&quot;, &quot;25%&quot;]</text>
    <text x="660" y="150" font-family="sans-serif" font-size="24" fill="#303a36">the serial list grows in steps</text>
  </g>

  
  <g id="column-batch-1">
    <rect x="70" y="205" width="430" height="475" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>

    
    <circle cx="125" cy="255" r="24" fill="#207448"/>
    <text x="125" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="165" y="265" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Batch 1</text>

    
    <g transform="translate(415, 227)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="16" cy="17" r="3" fill="#207448"/>
      <circle cx="16" cy="39" r="3" fill="#207448"/>
    </g>

    
    <rect x="100" y="315" width="370" height="335" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="2"/>

    
    <g transform="translate(247, 345)">
      <rect x="0" y="0" width="76" height="76" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
      <rect x="18" y="18" width="40" height="40" rx="6" fill="none" stroke="#db8129" stroke-width="3"/>
      <line x1="38" y1="6" x2="38" y2="18" stroke="#db8129" stroke-width="3"/>
      <line x1="38" y1="58" x2="38" y2="70" stroke="#db8129" stroke-width="3"/>
      <line x1="6" y1="38" x2="18" y2="38" stroke="#db8129" stroke-width="3"/>
      <line x1="58" y1="38" x2="70" y2="38" stroke="#db8129" stroke-width="3"/>
      <circle cx="38" cy="38" r="5" fill="#db8129"/>
    </g>

    
    <text x="285" y="475" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the canary, a single node</text>
    <text x="285" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">first node is a test</text>
  </g>

  
  <path d="M 500 442.5 H 585" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="column-batch-2">
    <rect x="585" y="205" width="430" height="475" rx="16" fill="#ffffff" stroke="#cadbd0" stroke-width="2.5"/>

    
    <circle cx="640" cy="255" r="24" fill="#207448"/>
    <text x="640" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="680" y="265" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Batch 2</text>

    
    <g transform="translate(930, 227)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="16" cy="17" r="3" fill="#207448"/>
      <circle cx="16" cy="39" r="3" fill="#207448"/>
    </g>

    
    <rect x="615" y="315" width="370" height="335" rx="14" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>

    
    <rect x="645" y="340" width="310" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(737, 365)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="54" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="15" y="15" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="27" cy="27" r="3" fill="#207448"/>
      </g>
      <g transform="translate(72, 0)">
        <rect x="0" y="0" width="54" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="15" y="15" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="27" cy="27" r="3" fill="#207448"/>
      </g>
      
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="54" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="15" y="15" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="27" cy="27" r="3" fill="#207448"/>
      </g>
      <g transform="translate(72, 72)">
        <rect x="0" y="0" width="54" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="15" y="15" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="27" cy="27" r="3" fill="#207448"/>
      </g>
    </g>

    
    <text x="800" y="600" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">10%</text>
  </g>

  
  <path d="M 1015 442.5 H 1100" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="column-batch-3">
    <rect x="1100" y="205" width="430" height="475" rx="16" fill="#ffffff" stroke="#cadbd0" stroke-width="2.5"/>

    
    <circle cx="1155" cy="255" r="24" fill="#207448"/>
    <text x="1155" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1195" y="265" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Batch 3</text>

    
    <g transform="translate(1445, 227)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="16" cy="17" r="3" fill="#207448"/>
      <circle cx="16" cy="39" r="3" fill="#207448"/>
    </g>

    
    <rect x="1130" y="315" width="370" height="335" rx="14" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>

    
    <rect x="1145" y="340" width="340" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1161, 375)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(64, 0)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(128, 0)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(192, 0)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(256, 0)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(64, 66)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(128, 66)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(192, 66)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
      <g transform="translate(256, 66)">
        <rect x="0" y="0" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
        <rect x="14" y="14" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="3" fill="#207448"/>
      </g>
    </g>

    
    <text x="1315" y="600" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">25%</text>
  </g>

  
  <g id="panel-policy">
    <rect x="70" y="710" width="1460" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(100, 735)">
      <rect x="0" y="0" width="450" height="78" rx="10" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>
      <text x="25" y="48" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">max_fail_percentage: 5</text>

      <rect x="475" y="0" width="925" height="78" rx="10" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>
      <text x="505" y="48" font-family="sans-serif" font-size="24" fill="#303a36">stops the line when failures pass the limit</text>
    </g>

    
    <g transform="translate(100, 835)">
      <rect x="0" y="0" width="450" height="78" rx="10" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>
      <text x="25" y="48" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">any_errors_fatal: false</text>

      <rect x="475" y="0" width="925" height="78" rx="10" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>
      <text x="505" y="48" font-family="sans-serif" font-size="24" fill="#303a36">a failure stays with its own host</text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="70" y="975" width="1460" height="76" rx="12" fill="#207448"/>
    <text x="800" y="1022" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">The first node is a test, and only after that does the play work through larger slices of the fleet.</text>
  </g>
</svg>