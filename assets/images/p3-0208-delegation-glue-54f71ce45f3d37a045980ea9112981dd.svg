<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>Delegation, glue records and zone replication</title>
  <desc>DNS architecture diagram illustrating delegation with glue records, resolver roles, and primary-secondary replication.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1300" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36">
    Delegation, glue records and zone replication
  </text>

  
  <rect x="40" y="115" width="850" height="915" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="158" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    Delegation with glue
  </text>

  
  <g transform="translate(65, 185)">
    <rect width="225" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="38" cy="32" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <ellipse cx="38" cy="32" rx="8" ry="18" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="20" y1="32" x2="56" y2="32" stroke="#207448" stroke-width="2" />
    <text x="145" y="42" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">root</text>
  </g>

  
  <line x1="177" y1="250" x2="177" y2="320" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="315" y="245" width="555" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="592" y="279" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    NS records point to the child zone's servers
  </text>

  
  <g transform="translate(65, 325)">
    <rect width="225" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 22 20 L 35 20 L 40 26 L 54 26 L 54 44 L 22 44 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="145" y="42" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">com</text>
  </g>

  
  <line x1="177" y1="390" x2="177" y2="465" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 180 430 L 315 430" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(65, 470)">
    <rect width="225" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="22" y="22" width="32" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="29" cy="33" r="2" fill="#207448" />
    <text x="145" y="42" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">example.com</text>
  </g>

  
  <rect x="315" y="315" width="555" height="270" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <text x="335" y="347" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="335" dy="0" font-weight="bold" fill="#db8129">glue A and AAAA records:</tspan>
    <tspan font-weight="normal"> when</tspan>
    <tspan x="335" dy="28">the name server ns1.example.com</tspan>
    <tspan x="335" dy="28">sits inside the delegated zone,</tspan>
    <tspan x="335" dy="28">the parent also holds its address,</tspan>
    <tspan x="335" dy="28">otherwise you would have to resolve</tspan>
    <tspan x="335" dy="28">a name inside example.com to find</tspan>
    <tspan x="335" dy="28">the server for example.com (chicken</tspan>
    <tspan x="335" dy="28">and egg)</tspan>
  </text>

  
  
  <g transform="translate(65, 605)">
    <rect width="805" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 22 20 L 37 14 L 52 20 C 52 38 37 48 37 48 C 37 48 22 38 22 20 Z" fill="none" stroke="#207448" stroke-width="3" />
    <text x="68" y="33" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Authoritative server:</tspan> holds the zone and
      <tspan x="68" dy="27">answers with the aa flag, the source of truth</tspan>
    </text>
  </g>

  
  <g transform="translate(65, 690)">
    <rect width="805" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="37" cy="36" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="37" y1="16" x2="37" y2="22" stroke="#207448" stroke-width="3" />
    <line x1="37" y1="50" x2="37" y2="56" stroke="#207448" stroke-width="3" />
    <line x1="17" y1="36" x2="23" y2="36" stroke="#207448" stroke-width="3" />
    <line x1="51" y1="36" x2="57" y2="36" stroke="#207448" stroke-width="3" />
    <text x="68" y="33" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Recursive resolver:</tspan> the caching DNS server
      <tspan x="68" dy="27">listed in resolv.conf, walks the tree for clients</tspan>
    </text>
  </g>

  
  <g transform="translate(65, 775)">
    <rect width="805" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="22" y="18" width="30" height="22" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="30" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="3" />
    <line x1="37" y1="40" x2="37" y2="48" stroke="#207448" stroke-width="3" />
    <text x="68" y="33" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Stub resolver:</tspan> libc or systemd-resolved on each host,
      <tspan x="68" dy="27">simply asks a recursive resolver</tspan>
    </text>
  </g>

  
  <g transform="translate(65, 860)">
    <rect width="805" height="150" rx="10" fill="#fff5f5" stroke="#db8129" stroke-width="2" />
    
    <polygon points="40,25 60,65 20,65" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <line x1="40" y1="40" x2="40" y2="51" stroke="#db8129" stroke-width="3" />
    <circle cx="40" cy="58" r="2" fill="#db8129" />
    <text x="75" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">a server that is both authoritative</tspan>
      <tspan x="75" dy="32">and open-recursive is a security problem:</tspan>
      <tspan x="75" dy="32" font-weight="bold" fill="#db8129">reflection and amplification</tspan>
    </text>
  </g>

  
  <rect x="920" y="115" width="640" height="915" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="955" y="158" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    Replication
  </text>

  
  <g transform="translate(955, 195)">
    <rect width="570" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="25" y="25" width="46" height="70" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="33" y1="42" x2="55" y2="42" stroke="#207448" stroke-width="3" />
    <line x1="33" y1="60" x2="55" y2="60" stroke="#207448" stroke-width="3" />
    <circle cx="61" cy="78" r="3" fill="#207448" />
    <text x="92" y="52" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      Primary (master):
    </text>
    <text x="92" y="88" font-family="sans-serif" font-size="24" fill="#303a36">
      holds the editable zone
    </text>
  </g>

  
  <line x1="1240" y1="315" x2="1240" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1140" y="352" width="200" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1240" y="384" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    NOTIFY
  </text>

  
  <g transform="translate(955, 435)">
    <rect width="570" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="25" y="20" width="46" height="70" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="33" y1="37" x2="55" y2="37" stroke="#207448" stroke-width="3" />
    <line x1="33" y1="55" x2="55" y2="55" stroke="#207448" stroke-width="3" />
    <circle cx="61" cy="73" r="3" fill="#207448" />
    <text x="92" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      Secondary (slave)
    </text>
  </g>

  
  <line x1="1240" y1="545" x2="1240" y2="695" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1005" y="595" width="470" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1240" y="630" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    has the SOA serial gone up?
  </text>

  
  <g transform="translate(955, 695)">
    <rect width="570" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="55" cy="75" r="26" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 45 65 L 55 55 L 65 65" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 65 85 L 55 95 L 45 85" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="105" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      AXFR full copy or
    </text>
    <text x="105" y="100" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      IXFR incremental zone transfer
    </text>
  </g>

  
  <g transform="translate(40, 1050)">
    <rect width="1520" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="30" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">A zone is an administrative portion of the tree served by a set of authoritative servers,</tspan>
      <tspan x="30" dy="32">a domain is a position in the tree: a domain is a place on the map and a zone is the area one</tspan>
      <tspan x="30" dy="32">office looks after; modern setups often use API-driven zone management (Route 53, Cloud DNS)</tspan>
    </text>
  </g>

  
  <rect x="40" y="1200" width="1520" height="65" rx="10" fill="#207448" />
  <text x="800" y="1242" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    Decide early which server holds the editable copy of each zone
  </text>
</svg>