<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Gathering facts cheaply on a large fleet, and facts that need a probe</title>
  <desc>Visual infographic explaining Ansible fact gathering optimization levers, cache mechanisms, branching logic, GPU probing patterns, and cost efficiency across large fleets.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-size="48" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="800" dy="0">Gathering facts cheaply on a large fleet,</tspan>
    <tspan x="800" dy="54">and facts that need a probe</tspan>
  </text>

  
  <g id="panel-speed-levers">
    
    <rect x="50" y="140" width="730" height="585" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(75, 158)">
      
      <path d="M 6 30 A 18 18 0 1 1 36 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="21" y1="21" x2="31" y2="13" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="21" cy="21" r="3" fill="#207448"/>
    </g>
    <text x="125" y="186" font-size="32" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">Speed levers</text>

    
    <rect x="75" y="206" width="680" height="80" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(92, 222)">
      
      <line x1="4" y1="12" x2="44" y2="12" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="16" cy="12" r="6" fill="#ffffff" stroke="#207448" stroke-width="3.5"/>
      <line x1="4" y1="26" x2="44" y2="26" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="32" cy="26" r="6" fill="#ffffff" stroke="#207448" stroke-width="3.5"/>
      <line x1="4" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="22" cy="40" r="6" fill="#ffffff" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="155" y="238" font-size="24" fill="#303a36" font-family="monospace">
      <tspan x="155" dy="0">gather_subset values min, hardware,</tspan>
      <tspan x="155" dy="30">network, virtual, all; negate with !</tspan>
    </text>

    
    <rect x="75" y="296" width="680" height="74" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(92, 310)">
      
      <circle cx="22" cy="24" r="17" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="22,14 22,24 29,24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="22" y1="3" x2="22" y2="7" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="36,28 48,28 44,34 44,42 40,40 40,34" fill="#207448"/>
    </g>
    <text x="155" y="328" font-size="24" fill="#303a36" font-family="monospace">
      <tspan x="155" dy="0">gather_timeout and the setup filter</tspan>
      <tspan x="155" dy="28">option</tspan>
    </text>

    
    <rect x="75" y="380" width="680" height="152" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(92, 430)">
      
      <ellipse cx="24" cy="10" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 6 10 v 12 c 0 3.3 8.1 6 18 6 s 18 -2.7 18 -6 v -12" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 6 22 v 12 c 0 3.3 8.1 6 18 6 s 18 -2.7 18 -6 v -12" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="155" y="410" font-size="24" fill="#303a36" font-family="monospace">
      <tspan x="155" dy="0">gathering = smart with a cache:</tspan>
      <tspan x="155" dy="27">fact_caching = jsonfile, redis or</tspan>
      <tspan x="155" dy="27">memcached; smart gathering reuses</tspan>
      <tspan x="155" dy="27">cached facts instead of collecting</tspan>
      <tspan x="155" dy="27">on every run</tspan>
    </text>

    
    <rect x="75" y="542" width="680" height="74" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(92, 555)">
      
      <rect x="4" y="14" width="40" height="20" rx="10" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="14" cy="24" r="6" fill="#207448"/>
      <path d="M 32 6 L 44 6 L 44 18" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="155" y="574" font-size="24" fill="#303a36" font-family="monospace">
      <tspan x="155" dy="0">gather_facts: false and call setup</tspan>
      <tspan x="155" dy="28">with a small subset only where needed</tspan>
    </text>

    
    <rect x="75" y="626" width="680" height="82" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(92, 642)">
      
      <polygon points="24,4 44,14 24,24 4,14" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="4,14 24,24 24,44 4,34" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="44,14 24,24 24,44 44,34" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="155" y="658" font-size="24" fill="#303a36" font-family="monospace">
      <tspan x="155" dy="0">on demand: package_facts, service_facts,</tspan>
      <tspan x="155" dy="30">mount_facts, ansible.builtin.getent</tspan>
    </text>
  </g>

  
  <g id="panel-branching-on-facts">
    
    <rect x="820" y="140" width="730" height="585" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(845, 158)">
      
      <path d="M 6 8 L 20 22 L 20 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 34 8 L 20 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="6" cy="8" r="4" fill="#207448"/>
      <circle cx="34" cy="8" r="4" fill="#207448"/>
      <circle cx="20" cy="38" r="4" fill="#207448"/>
    </g>
    <text x="895" y="186" font-size="32" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">Branching on facts</text>

    
    <rect x="845" y="206" width="680" height="230" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(875, 230)">
      
      <polygon points="26,4 48,26 26,48 4,26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 18 26 L 24 32 L 34 20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="865" y="295" width="640" height="62" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
    <text x="885" y="334" font-size="24" font-weight="bold" fill="#207448" font-family="monospace">
      when: ansible_facts[os_family] == Debian
    </text>
    <text x="885" y="400" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      reads as a plain sentence
    </text>

    
    <rect x="845" y="456" width="680" height="252" rx="10" fill="#ffffff" stroke="#c0dac7" stroke-width="1.5"/>
    <g transform="translate(875, 474)">
      
      <line x1="26" y1="8" x2="26" y2="44" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="6,28 14,28 10,18" fill="none" stroke="#207448" stroke-width="2.5"/>
      <polygon points="38,28 46,28 42,18" fill="none" stroke="#207448" stroke-width="2.5"/>
      <line x1="6" y1="44" x2="46" y2="44" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="940" y="506" font-size="26" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">
      version check:
    </text>
    <rect x="865" y="528" width="640" height="92" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
    <text x="885" y="562" font-size="24" font-weight="bold" fill="#207448" font-family="monospace">
      <tspan x="885" dy="0">ansible_facts[distribution_major_version]</tspan>
      <tspan x="885" dy="32">is version(9, >=)</tspan>
    </text>
    <text x="885" y="666" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      compares as versions so 10 is newer than 9
    </text>
  </g>

  
  <g id="panel-gpu-probe">
    
    <rect x="50" y="745" width="1500" height="235" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(85, 785)">
      
      <path d="M 4 8 L 12 8 L 12 68 L 4 68 Z" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <rect x="12" y="14" width="60" height="46" rx="4" fill="none" stroke="#db8129" stroke-width="3.5"/>
      
      <line x1="20" y1="60" x2="20" y2="68" stroke="#db8129" stroke-width="3.5"/>
      <line x1="26" y1="60" x2="26" y2="68" stroke="#db8129" stroke-width="3.5"/>
      <line x1="32" y1="60" x2="32" y2="68" stroke="#db8129" stroke-width="3.5"/>
      <line x1="38" y1="60" x2="38" y2="68" stroke="#db8129" stroke-width="3.5"/>
      
      <circle cx="30" cy="37" r="12" fill="none" stroke="#db8129" stroke-width="3"/>
      <circle cx="54" cy="37" r="12" fill="none" stroke="#db8129" stroke-width="3"/>
      <circle cx="30" cy="37" r="3" fill="#db8129"/>
      <circle cx="54" cy="37" r="3" fill="#db8129"/>
    </g>

    
    <text x="180" y="802" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="180" dy="0">setup does not describe GPUs by default: probe with nvidia-smi -L, lspci -d 10de:</tspan>
      <tspan x="180" dy="38">(10de is NVIDIA's PCI vendor ID) or DCGM; wrap the probes in a role that publishes facts</tspan>
      <tspan x="180" dy="38">gpu_count, gpu_model, nvlink_present and ib_hcas; the probe runs once and</tspan>
      <tspan x="180" dy="38">everything after reads the answer as a fact</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="50" y="1005" width="1500" height="75" rx="12" fill="#207448"/>
    <text x="800" y="1052" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
      Pay for facts only in the plays that ask
    </text>
  </g>
</svg>