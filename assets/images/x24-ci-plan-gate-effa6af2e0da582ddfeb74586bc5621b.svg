<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Three pipeline stages with a risk gate on destroys</title>
  <desc>A left-to-right flow of three infrastructure pipeline stages (On a pull request, On review, On merge to main) with an intermediate risk gate evaluating changes and blocking unapproved destroys, plus a scheduled drift check along the bottom.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three pipeline stages with a risk gate on destroys</text>

  
  
  
  <g id="stage-1">
    
    <rect x="40" y="120" width="536" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(64, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="14" r="8" />
      <circle cx="16" cy="42" r="8" />
      <circle cx="40" cy="24" r="8" />
      <path d="M 16 22 L 16 34" />
      <path d="M 36 30 C 30 38 24 42 16 42" />
    </g>
    <text x="136" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">On a pull request</text>

    
    
    <g id="step-format">
      <rect x="56" y="240" width="122" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="117" y="278" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">format</text>
    </g>

    
    <line x1="178" y1="270" x2="196" y2="270" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="step-validate">
      <rect x="196" y="240" width="152" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="272" y="278" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">validate</text>
    </g>

    
    <line x1="348" y1="270" x2="366" y2="270" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="step-test">
      <rect x="366" y="240" width="92" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="412" y="278" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">test</text>
    </g>

    
    <line x1="458" y1="270" x2="476" y2="270" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="step-plan">
      <rect x="476" y="240" width="92" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="522" y="278" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">plan</text>
    </g>

    
    <g id="stage1-comment-box">
      <rect x="56" y="340" width="504" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(280, 440)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 12 C 6 6 12 4 28 4 C 44 4 50 6 50 12 L 50 32 C 50 38 44 40 28 40 L 16 52 L 16 40 C 10 40 6 38 6 32 Z" />
        <path d="M 16 16 L 40 16" />
        <path d="M 16 26 L 32 26" />
      </g>

      
      <text x="308" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="308" dy="0">Post the plan and the</tspan>
        <tspan x="308" dy="38">risk check result as a comment</tspan>
      </text>
    </g>
  </g>

  
  <line x1="576" y1="475" x2="616" y2="475" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  
  
  <g id="risk-gate">
    
    <rect x="616" y="120" width="312" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(632, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 42 38 50 28 54 C 18 50 8 42 8 28 V 14 Z" />
      <path d="M 28 20 V 38" />
      <circle cx="28" cy="26" r="3" fill="#207448" />
    </g>
    <text x="704" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Risk gate</text>

    
    <g id="risk-row-1">
      <rect x="632" y="220" width="280" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="772" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Create: fine</text>
    </g>

    
    <g id="risk-row-2">
      <rect x="632" y="330" width="280" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="772" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="772" dy="0">Update:</tspan>
        <tspan x="772" dy="34">normal review</tspan>
      </text>
    </g>

    
    
    <g id="risk-row-3">
      <rect x="632" y="460" width="280" height="340" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
      <text x="772" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
        <tspan x="772" dy="0">Delete or replace</tspan>
        <tspan x="772" dy="34">a cluster or</tspan>
        <tspan x="772" dy="34">node group:</tspan>
        <tspan x="772" dy="34">blocked until</tspan>
        <tspan x="772" dy="34">the address is</tspan>
        <tspan x="772" dy="34">written into</tspan>
        <tspan x="772" dy="34">an allow list</tspan>
      </text>
    </g>
  </g>

  
  <line x1="928" y1="475" x2="968" y2="475" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  
  
  <g id="stage-2">
    
    <rect x="968" y="120" width="276" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(984, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="18" r="12" />
      <path d="M 8 50 C 8 36 18 32 28 32 C 38 32 48 36 48 50" />
    </g>
    <text x="1056" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">On review</text>

    
    <g id="stage2-box-1">
      <rect x="984" y="220" width="244" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1078, 250)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 28 C 14 14 42 14 50 28 C 42 42 14 42 6 28 Z" />
        <circle cx="28" cy="28" r="7" />
      </g>
      <text x="1106" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1106" dy="0">A human</tspan>
        <tspan x="1106" dy="36">reads it</tspan>
      </text>
    </g>

    
    <g id="stage2-box-2">
      <rect x="984" y="460" width="244" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1078, 490)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 16 26 V 16 A 12 12 0 0 1 40 16 V 26" />
        <rect x="10" y="26" width="36" height="26" rx="4" />
        <circle cx="28" cy="39" r="4" fill="#207448" />
      </g>
      <text x="1106" y="610" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1106" dy="0">Destroys and</tspan>
        <tspan x="1106" dy="36">replacements</tspan>
        <tspan x="1106" dy="36">need a named</tspan>
        <tspan x="1106" dy="36">approver</tspan>
      </text>
    </g>
  </g>

  
  <line x1="1244" y1="475" x2="1284" y2="475" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  
  
  <g id="stage-3">
    
    <rect x="1284" y="120" width="276" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(1300, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="14" r="8" />
      <circle cx="40" cy="42" r="8" />
      <circle cx="16" cy="42" r="8" />
      <path d="M 16 22 L 16 34" />
      <path d="M 34 38 L 22 20" />
    </g>
    <text x="1370" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1370" dy="0">On merge</tspan>
      <tspan x="1370" dy="36">to main</tspan>
    </text>

    
    <g id="stage3-box-1">
      <rect x="1300" y="240" width="244" height="560" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1394, 290)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="12" />
        <path d="M 28 6 V 14 M 28 42 V 50 M 6 28 H 14 M 42 28 H 50 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
      </g>

      
      <text x="1422" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1422" dy="0">Apply the</tspan>
        <tspan x="1422" dy="36">saved plan</tspan>
        <tspan x="1422" dy="36">from the PR</tspan>
      </text>

      
      <line x1="1330" y1="560" x2="1514" y2="560" stroke="#e0e8e2" stroke-width="2" stroke-dasharray="6,4" />

      
      <text x="1422" y="630" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="1422" dy="0">If main moved,</tspan>
        <tspan x="1422" dy="36">plan again</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g id="drift-check-strip">
    
    <rect x="40" y="870" width="1520" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(64, 912)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,34" />
    </g>

    
    <text x="136" y="952" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Scheduled drift check</text>

    
    <rect x="580" y="905" width="450" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="805" y="949" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">plan -detailed-exitcode</text>

    
    <text x="1100" y="952" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Exit code 2 opens a ticket</text>
  </g>
</svg>