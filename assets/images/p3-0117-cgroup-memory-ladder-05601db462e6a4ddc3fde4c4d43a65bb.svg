<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>cgroup v2 memory files: protection below, throttle above, kill at the top</title>
  <desc>Visual infographic explaining cgroup v2 memory control files, memory gauge thresholds, evidence metrics, page cache behavior, and Kubernetes mapping.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">cgroup v2 memory files: protection below,</tspan>
    <tspan x="800" dy="54">throttle above, kill at the top</tspan>
  </text>

  
  
  <rect x="65" y="155" width="110" height="635" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <line x1="65" y1="212" x2="85" y2="212" stroke="#db8129" stroke-width="3"/>
  <line x1="65" y1="342" x2="85" y2="342" stroke="#207448" stroke-width="2"/>
  <line x1="65" y1="472" x2="85" y2="472" stroke="#207448" stroke-width="3"/>
  <line x1="65" y1="602" x2="85" y2="602" stroke="#207448" stroke-width="2"/>
  <line x1="65" y1="732" x2="85" y2="732" stroke="#207448" stroke-width="2"/>

  
  <path d="M 67 472 L 173 472 L 173 774 A 14 14 0 0 1 159 788 L 81 788 A 14 14 0 0 1 67 774 Z" fill="#a3d9b8"/>

  
  <line x1="85" y1="535" x2="155" y2="535" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <line x1="85" y1="665" x2="155" y2="665" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  
  <line x1="65" y1="472" x2="175" y2="472" stroke="#207448" stroke-width="4"/>
  <polygon points="175,462 195,472 175,482" fill="#207448"/>

  
  <line x1="175" y1="212" x2="200" y2="212" stroke="#db8129" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="175" y1="342" x2="200" y2="342" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="195" y1="472" x2="200" y2="472" stroke="#207448" stroke-width="3"/>
  <line x1="175" y1="602" x2="200" y2="602" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="175" y1="732" x2="200" y2="732" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>

  
  <rect x="200" y="155" width="810" height="115" rx="12" fill="#fff5eb" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(222, 184)">
    <path d="M 28 4 L 48 12 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 12 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="20" y1="20" x2="36" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="36" y1="20" x2="20" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="295" y="202" fill="#303a36">
    <tspan font-family="monospace" font-size="30" font-weight="bold" fill="#db8129">memory.max: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">hard limit; exceeding it and failing</tspan>
    <tspan x="295" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="24">to reclaim runs the OOM killer inside the cgroup</tspan>
  </text>

  
  <rect x="200" y="285" width="810" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(222, 314)">
    <path d="M 8 38 A 20 20 0 1 1 48 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="38" x2="40" y2="22" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="38" r="4" fill="#207448"/>
  </g>
  <text x="295" y="322" fill="#303a36">
    <tspan font-family="monospace" font-size="30" font-weight="bold" fill="#207448">memory.high: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">throttle and reclaim threshold;</tspan>
    <tspan x="295" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">above it the group is slowed before any kill</tspan>
    <tspan x="295" dy="30" font-family="system-ui, -apple-system, sans-serif" font-size="24">(a good soft limit for batch jobs)</tspan>
  </text>

  
  <rect x="200" y="415" width="810" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(222, 444)">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="18" y1="4" x2="18" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="4" x2="28" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="38" y1="4" x2="38" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="18" y1="46" x2="18" y2="52" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="46" x2="28" y2="52" stroke="#207448" stroke-width="3"/>
    <line x1="38" y1="46" x2="38" y2="52" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="295" y="462" fill="#303a36">
    <tspan font-family="monospace" font-size="30" font-weight="bold" fill="#207448">memory.current: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">current usage</tspan>
    <tspan x="295" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="24">(anon + file cache + kernel memory)</tspan>
  </text>

  
  <rect x="200" y="545" width="810" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(222, 574)">
    <path d="M 28 4 L 48 12 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <path d="M 20 28 L 26 34 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="295" y="594" fill="#303a36">
    <tspan font-family="monospace" font-size="30" font-weight="bold" fill="#207448">memory.low: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">best-effort protection;</tspan>
    <tspan x="295" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="24">the kernel avoids reclaiming this much</tspan>
  </text>

  
  <rect x="200" y="675" width="810" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(222, 704)">
    <rect x="10" y="22" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 18 22 L 18 14 C 18 8 38 8 38 14 L 38 22" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="35" r="3" fill="#207448"/>
  </g>
  <text x="295" y="724" fill="#303a36">
    <tspan font-family="monospace" font-size="30" font-weight="bold" fill="#207448">memory.min: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">hard protection,</tspan>
    <tspan x="295" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="24">reclaim will not take this</tspan>
  </text>

  
  <rect x="1045" y="155" width="505" height="635" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1068, 175)">
    <rect x="6" y="6" width="36" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="14" y1="18" x2="34" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="14" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="14" y1="38" x2="26" y2="38" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1135" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Evidence</text>
  <line x1="1065" y1="240" x2="1530" y2="240" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

  
  <rect x="1065" y="252" width="465" height="84" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1082" y="285" fill="#303a36">
    <tspan font-family="monospace" font-size="25" font-weight="bold" fill="#207448">memory.events</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> counters</tspan>
    <tspan x="1082" dy="33" font-family="monospace" font-size="24">low, high, max, oom, oom_kill</tspan>
  </text>

  
  <rect x="1065" y="348" width="465" height="122" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1082" y="380" fill="#303a36">
    <tspan font-family="monospace" font-size="25" font-weight="bold" fill="#207448">memory.stat:</tspan>
    <tspan x="1082" dy="33" font-family="system-ui, -apple-system, sans-serif" font-size="24">anon, file, kernel, slab,</tspan>
    <tspan x="1082" dy="33" font-family="system-ui, -apple-system, sans-serif" font-size="24">shmem, pgfault, pgmajfault</tspan>
  </text>

  
  <rect x="1065" y="482" width="465" height="84" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1082" y="516" fill="#303a36">
    <tspan font-family="monospace" font-size="25" font-weight="bold" fill="#207448">memory.pressure: </tspan>
    <tspan x="1082" dy="33" font-family="system-ui, -apple-system, sans-serif" font-size="24">per-cgroup PSI</tspan>
  </text>

  
  <rect x="1065" y="578" width="465" height="84" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1082" y="612" fill="#303a36">
    <tspan font-family="monospace" font-size="25" font-weight="bold" fill="#207448">memory.oom.group=1</tspan>
    <tspan x="1082" dy="33" font-family="system-ui, -apple-system, sans-serif" font-size="24">kills the whole group</tspan>
  </text>

  
  <rect x="1065" y="674" width="465" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1082" y="710" fill="#303a36">
    <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">memory.swap.max and</tspan>
    <tspan x="1082" dy="35" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">memory.swap.current</tspan>
  </text>

  
  <rect x="50" y="810" width="1500" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 848)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="24" x2="28" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="16" r="3" fill="#207448"/>
  </g>
  <text x="150" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">memory.current includes page cache charged to the cgroup; near memory.max the kernel</tspan>
    <tspan x="150" dy="34">reclaims the cgroup's own cache first, so high usage is not necessarily a problem;</tspan>
    <tspan x="150" dy="34">a container whose anon approaches memory.max will be OOM-killed</tspan>
  </text>

  
  <rect x="50" y="965" width="1500" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 1003)">
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 28 4 L 28 14 M 28 42 L 28 52 M 4 28 L 14 28 M 42 28 L 52 28 M 11 11 L 18 18 M 38 38 L 45 45 M 11 45 L 18 38 M 38 18 L 45 11" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="150" y="1007" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">resources.limits.memory sets memory.max; requests.memory drives memory.min</tspan>
    <tspan x="150" dy="34">and memory.low protection through QoS classes Guaranteed, Burstable, BestEffort;</tspan>
    <tspan x="150" dy="34">BestEffort pods are killed first</tspan>
  </text>

  
  <rect x="50" y="1120" width="1500" height="55" rx="10" fill="#207448"/>
  <text x="800" y="1156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The limit that matters may belong to the group, not to the machine</text>
</svg>