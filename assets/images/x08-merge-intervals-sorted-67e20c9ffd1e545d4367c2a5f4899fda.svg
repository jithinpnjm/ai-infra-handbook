<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Merge intervals: after sorting by start, only the last merged interval can overlap</title>
  <desc>Infographic explaining merge intervals algorithm with three horizontal number line strips, showing unsorted input, sorted intervals, and merged result with interval sweep logic.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Merge intervals: after sorting by start,</tspan>
    <tspan x="800" dy="54">only the last merged interval can overlap</tspan>
  </text>

  
  <g id="strip-1">
    <rect x="60" y="135" width="1480" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(85, 155)">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="14" y1="20" x2="42" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="36" x2="30" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 36 30 L 42 36 L 36 42" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <text x="160" y="195" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">unsorted input</text>

    
    <line x1="380" y1="295" x2="1480" y2="295" stroke="#303a36" stroke-width="2"/>
    
    <line x1="380" y1="295" x2="380" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="380" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">0</text>
    <line x1="490" y1="295" x2="490" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="490" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">1</text>
    <line x1="600" y1="295" x2="600" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">2</text>
    <line x1="710" y1="295" x2="710" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="710" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">3</text>
    <line x1="820" y1="295" x2="820" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="820" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">4</text>
    <line x1="930" y1="295" x2="930" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="930" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">5</text>
    <line x1="1040" y1="295" x2="1040" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="1040" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">6</text>
    <line x1="1150" y1="295" x2="1150" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="1150" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">7</text>
    <line x1="1260" y1="295" x2="1260" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="1260" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">8</text>
    <line x1="1370" y1="295" x2="1370" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="1370" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">9</text>
    <line x1="1480" y1="295" x2="1480" y2="305" stroke="#303a36" stroke-width="2"/>
    <text x="1480" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">10</text>

    
    
    <rect x="600" y="165" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="655" y="201" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[2,3]</text>

    
    <rect x="490" y="228" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="545" y="264" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[1,2]</text>

    
    <rect x="760" y="175" width="460" height="85" rx="12" fill="#ffffff" stroke="#889890" stroke-width="1.5"/>
    <circle cx="810" cy="217" r="24" fill="#f0f4f2" stroke="#889890" stroke-width="2"/>
    <text x="810" y="226" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#607068">?</text>
    <text x="855" y="225" font-family="sans-serif" font-size="24" fill="#303a36">any pair might overlap</text>
  </g>

  
  <g id="arrow-strip-1-2">
    <line x1="720" y1="355" x2="720" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text x="745" y="393" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">sort by start</text>
  </g>

  
  <g id="strip-2">
    <rect x="60" y="430" width="1480" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(85, 450)">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="14" y1="38" x2="20" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="24" y1="30" x2="32" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="20" x2="44" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="160" y="490" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">sorted by start</text>

    
    <line x1="380" y1="590" x2="1480" y2="590" stroke="#303a36" stroke-width="2"/>
    
    <line x1="380" y1="590" x2="380" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="380" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">0</text>
    <line x1="490" y1="590" x2="490" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="490" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">1</text>
    <line x1="600" y1="590" x2="600" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="600" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">2</text>
    <line x1="710" y1="590" x2="710" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="710" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">3</text>
    <line x1="820" y1="590" x2="820" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="820" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">4</text>
    <line x1="930" y1="590" x2="930" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="930" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">5</text>
    <line x1="1040" y1="590" x2="1040" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="1040" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">6</text>
    <line x1="1150" y1="590" x2="1150" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="1150" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">7</text>
    <line x1="1260" y1="590" x2="1260" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="1260" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">8</text>
    <line x1="1370" y1="590" x2="1370" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="1370" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">9</text>
    <line x1="1480" y1="590" x2="1480" y2="600" stroke="#303a36" stroke-width="2"/>
    <text x="1480" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">10</text>

    
    
    <rect x="490" y="460" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="545" y="496" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[1,2]</text>

    
    <rect x="600" y="523" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="655" y="559" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[2,3]</text>

    
    <g id="touching-ends-callout">
      <circle cx="600" cy="520" r="7" fill="#db8129"/>
      <line x1="600" y1="520" x2="740" y2="520" stroke="#db8129" stroke-width="2.5" stroke-dasharray="4,3"/>
      <rect x="740" y="475" width="460" height="90" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      <text x="970" y="528" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">less than or equal merges touching intervals</text>
    </g>
  </g>

  
  <g id="sweep-section">
    
    <line x1="490" y1="700" x2="710" y2="700" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    
    <line x1="600" y1="682" x2="600" y2="718" stroke="#207448" stroke-width="3"/>
    <text x="600" y="674" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">last merged end</text>

    
    <text x="760" y="678" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">start &lt;= merged[-1][1]</text>
    <text x="760" y="710" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="760" dy="0">showing the current merged interval grows when the</tspan>
      <tspan x="760" dy="28">next start is less than or equal to its end</tspan>
    </text>
  </g>

  
  <g id="strip-3">
    <rect x="60" y="755" width="1480" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(85, 775)">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="12" y="20" width="32" height="16" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="28" y1="12" x2="28" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="36" x2="28" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="160" y="815" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">merged result</text>

    
    <line x1="380" y1="915" x2="1480" y2="915" stroke="#303a36" stroke-width="2"/>
    
    <line x1="380" y1="915" x2="380" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="380" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">0</text>
    <line x1="490" y1="915" x2="490" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="490" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">1</text>
    <line x1="600" y1="915" x2="600" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="600" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">2</text>
    <line x1="710" y1="915" x2="710" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="710" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">3</text>
    <line x1="820" y1="915" x2="820" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="820" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">4</text>
    <line x1="930" y1="915" x2="930" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="930" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">5</text>
    <line x1="1040" y1="915" x2="1040" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="1040" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">6</text>
    <line x1="1150" y1="915" x2="1150" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="1150" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">7</text>
    <line x1="1260" y1="915" x2="1260" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="1260" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">8</text>
    <line x1="1370" y1="915" x2="1370" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="1370" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">9</text>
    <line x1="1480" y1="915" x2="1480" y2="925" stroke="#303a36" stroke-width="2"/>
    <text x="1480" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">10</text>

    
    <rect x="490" y="838" width="220" height="60" rx="8" fill="#207448"/>
    <text x="600" y="876" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">[(1,3)]</text>

    
    <rect x="760" y="830" width="560" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1040" y="877" text-anchor="middle" font-size="26">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">[(1,2),(2,3)]</tspan>
      <tspan font-family="sans-serif" fill="#303a36"> giving </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">[(1,3)]</tspan>
    </text>
  </g>

  
  <g id="numbered-steps">
    
    <rect x="60" y="985" width="460" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="105" cy="1030" r="24" fill="#207448"/>
    <text x="105" y="1039" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="150" y="1039" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">sort by start</text>

    
    <rect x="570" y="985" width="460" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="615" cy="1030" r="24" fill="#207448"/>
    <text x="615" y="1039" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="655" y="1039" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">keep the last merged interval</text>

    
    <rect x="1080" y="985" width="460" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1125" cy="1030" r="24" fill="#207448"/>
    <text x="1125" y="1039" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1165" y="1039" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">extend it or append</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="1095" width="1480" height="70" rx="14" fill="#207448"/>
    <text x="800" y="1139" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">After sorting, an interval can only overlap the last merged one.</text>
  </g>
</svg>