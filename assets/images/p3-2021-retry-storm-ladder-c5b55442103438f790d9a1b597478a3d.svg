<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Two of eight replicas fail and the whole service goes down</title>
  <desc>Visual explanation of retry amplification, orphan work in queues, immediate mitigations, and systemic fixes when replicas fail.</desc>

  <defs>
    
    <filter id="card-shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#143624" flood-opacity="0.08" />
    </filter>

    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <g id="header-group">
    <text x="80" y="68" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Two of eight replicas fail and the whole service goes down</text>
  </g>

  
  <g id="setup-panel" filter="url(#card-shadow)">
    
    <rect x="80" y="98" width="1440" height="162" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(112, 126)">
      <rect x="0" y="0" width="56" height="52" rx="7" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="8" r="3" fill="#207448" />
      <circle cx="22" cy="8" r="3" fill="#207448" />
      <circle cx="32" cy="8" r="3" fill="#207448" />
      
      <line x1="28" y1="24" x2="28" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="28" cy="44" r="2.2" fill="#207448" />
    </g>

    
    <text x="188" y="148" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Setup</text>

    
    <text x="188" y="186" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="188" dy="0">users send 52 requests per second, fleet serves 64; two replicas return errors;</tspan>
      <tspan x="188" dy="32">gateway attempts climb from about 52 to over 300 per second; success falls to a few percent;</tspan>
      <tspan x="188" dy="32">the outage ends and the service stays down</tspan>
    </text>
  </g>

  
  <path d="M 800 260 L 800 292" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="ladder-container" filter="url(#card-shadow)">
    
    <rect x="80" y="296" width="1440" height="518" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(112, 318)">
      <line x1="12" y1="4" x2="12" y2="48" stroke="#207448" stroke-width="4.5" stroke-linecap="round" />
      <line x1="44" y1="4" x2="44" y2="48" stroke="#207448" stroke-width="4.5" stroke-linecap="round" />
      <line x1="12" y1="16" x2="44" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="12" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="180" y="352" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">Ladder</text>

    
    <g id="step-1-card">
      <rect x="112" y="378" width="1376" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      
      <circle cx="152" cy="425" r="24" fill="#207448" />
      <text x="152" y="434" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

      
      <text x="194" y="433" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 1</text>

      
      <text x="320" y="423" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="320" dy="0">compare gateway attempts to user requests:</tspan>
        <tspan x="320" dy="32">six times means retry amplification</tspan>
      </text>

      
      <g transform="translate(1400, 403)">
        <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="36" y1="36" x2="48" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <path d="M 12 26 L 19 18 L 26 23 L 33 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    
    <path d="M 800 492 L 800 514" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="step-2-card">
      <rect x="112" y="518" width="1376" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

      
      <circle cx="152" cy="565" r="24" fill="#207448" />
      <text x="152" y="574" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

      
      <text x="194" y="573" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 2</text>

      
      <text x="320" y="563" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="320" dy="0">look for waiting longer than the timeout:</tspan>
        <tspan x="320" dy="32">a deep queue plus a 2 second timeout produces orphan work (the wasted column)</tspan>
      </text>

      
      <g transform="translate(1400, 543)">
        <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3.5" />
        <polyline points="24,12 24,24 34,24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    
    <path d="M 800 632 L 800 654" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="step-3-card">
      <rect x="112" y="658" width="1376" height="136" rx="10" fill="#fdfaf6" stroke="#db8129" stroke-width="3" />

      
      <circle cx="152" cy="710" r="24" fill="#db8129" />
      <text x="152" y="719" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

      
      <text x="194" y="718" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#db8129">Step 3</text>

      
      <text x="320" y="698" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="320" dy="0">act before root cause: cut the retry count at the gateway, turn on the budget,</tspan>
        <tspan x="320" dy="32">shorten the queue so an overloaded replica rejects in milliseconds</tspan>
      </text>

      
      <g transform="translate(1398, 690)">
        <path d="M 24 4 L 44 12 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 12 Z" fill="none" stroke="#db8129" stroke-width="3.5" />
        <polyline points="14,24 21,31 34,18" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  
  
  <path d="M 440 814 L 440 844" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <path d="M 1160 814 L 1160 844" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  

  
  <g id="say-aloud-panel" filter="url(#card-shadow)">
    <rect x="80" y="848" width="690" height="202" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(108, 874)">
      <path d="M 6 8 C 6 4 10 2 16 2 L 44 2 C 50 2 54 4 54 8 L 54 32 C 54 36 50 38 44 38 L 22 38 L 10 48 L 10 38 L 8 38 C 4 38 6 36 6 32 Z" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="20" cy="20" r="3" fill="#207448" />
      <circle cx="30" cy="20" r="3" fill="#207448" />
      <circle cx="40" cy="20" r="3" fill="#207448" />
    </g>

    
    <text x="178" y="904" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Say aloud</text>

    
    <text x="108" y="954" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="108" dy="0">I am trading a little success now</tspan>
      <tspan x="108" dy="34">for a fleet that can recover</tspan>
    </text>
  </g>

  
  <g id="fix-later-panel" filter="url(#card-shadow)">
    <rect x="830" y="848" width="690" height="202" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(858, 872)">
      <circle cx="26" cy="26" r="12" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 26 4 L 26 10 M 26 42 L 26 48 M 4 26 L 10 26 M 42 26 L 48 26 M 10.5 10.5 L 14.8 14.8 M 37.2 37.2 L 41.5 41.5 M 10.5 41.5 L 14.8 37.2 M 37.2 14.8 L 41.5 10.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="928" y="904" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Fix later</text>

    
    <text x="858" y="950" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="858" dy="0">eject the two bad replicas with outlier detection,</tspan>
      <tspan x="858" dy="32">raise the ejection cap above 10 percent,</tspan>
      <tspan x="858" dy="32">bound queue wait below the timeout,</tspan>
      <tspan x="858" dy="32">remove the second retry layer</tspan>
    </text>
  </g>

  
  <path d="M 800 1050 L 800 1076" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="result-strip-panel" filter="url(#card-shadow)">
    
    <rect x="80" y="1080" width="1440" height="92" rx="10" fill="#207448" />

    
    <text x="112" y="1136" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Result strip</text>

    
    <line x1="290" y1="1098" x2="290" y2="1154" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5" />

    
    <text x="316" y="1124" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">
      <tspan x="316" dy="0">budgeted policy kept 99 percent success after the outage in the deep-queue case,</tspan>
      <tspan x="316" dy="30">the naive one stayed at 2 percent</tspan>
    </text>
  </g>
</svg>