<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where a secret leaks, and the setting that closes each path</title>
  <desc>A structured reference table detailing Ansible leak paths alongside the exact settings and practices that close each vulnerability.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="54" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Where a secret leaks, and the setting that closes each path</text>

  
  <g>
    <rect x="50" y="80" width="540" height="44" rx="6" fill="#207448"/>
    <text x="70" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Leak path</text>

    <rect x="605" y="80" width="945" height="44" rx="6" fill="#207448"/>
    <text x="625" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Closed by</text>
  </g>

  
  <g>
    <rect x="50" y="134" width="540" height="58" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(64, 143)">
      <rect x="0" y="0" width="40" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="0" y1="11" x2="40" y2="11" stroke="#207448" stroke-width="2.5"/>
      <polyline points="7,19 12,24 7,29" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="29" x2="26" y2="29" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="120" y="171" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">task output and logs</text>

    <rect x="605" y="134" width="945" height="58" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="171" font-family="monospace" font-size="24" fill="#303a36">no_log: true on any task that handles secrets</text>
  </g>

  
  <g>
    <rect x="50" y="200" width="540" height="114" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(64, 235)">
      <circle cx="16" cy="16" r="15" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="27" y1="27" x2="38" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="16" x2="22" y2="16" stroke="#207448" stroke-width="2.5"/>
      <line x1="16" y1="10" x2="16" y2="22" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="120" y="236" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">registered results and debug lines</tspan>
      <tspan x="120" dy="30">(printing a whole variable to see</tspan>
      <tspan x="120" dy="30">its shape)</tspan>
    </text>

    <rect x="605" y="200" width="945" height="114" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="625" dy="0">keep secrets out of places where output is shown or stored;</tspan>
      <tspan x="625" dy="32">assume any output may be copied elsewhere</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="322" width="540" height="114" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(64, 355)">
      <path d="M2 20 Q20 2 38 20 Q20 38 2 20 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="120" y="358" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">-vvv output (very detailed, may</tspan>
      <tspan x="120" dy="30">include values you did not mean</tspan>
      <tspan x="120" dy="30">to show)</tspan>
    </text>

    <rect x="605" y="322" width="945" height="114" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="384" font-family="sans-serif" font-size="24" fill="#303a36">keep in mind; avoid on secret tasks</text>
  </g>

  
  <g>
    <rect x="50" y="444" width="540" height="80" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(64, 462)">
      <rect x="0" y="0" width="24" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="12" y="8" width="24" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="17" y1="20" x2="27" y2="20" stroke="#207448" stroke-width="2.5"/>
      <line x1="17" y1="28" x2="27" y2="28" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="120" y="476" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">diff of a rendered</tspan>
      <tspan x="120" dy="30">secret file</tspan>
    </text>

    <rect x="605" y="444" width="945" height="80" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="476" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="625" dy="0"><tspan font-family="monospace">diff: false</tspan> so the difference between old and</tspan>
      <tspan x="625" dy="30">new content is not printed</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="532" width="540" height="68" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(66, 544)">
      <rect x="0" y="14" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M8 14 V8 A9 9 0 0 1 26 8 V11" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="17" cy="27" r="3" fill="#207448"/>
    </g>
    <text x="120" y="561" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">files readable by</tspan>
      <tspan x="120" dy="28">everyone</tspan>
    </text>

    <rect x="605" y="532" width="945" height="68" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="574" font-family="monospace" font-size="24" fill="#303a36">mode 0600</text>
  </g>

  
  <g>
    <rect x="50" y="608" width="540" height="68" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(68, 616)">
      <ellipse cx="18" cy="8" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M0 8 V20 C0 24 8 27 18 27 C28 27 36 24 36 20 V8" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M0 20 V32 C0 36 8 39 18 39 C28 39 36 36 36 32 V20" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="120" y="650" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">storage</text>

    <rect x="605" y="608" width="945" height="68" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="637" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="625" dy="0">Vault-encrypted files, or a secret manager</tspan>
      <tspan x="625" dy="28">queried at run time (4.12)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="684" width="540" height="138" rx="6" fill="#fef4ec" stroke="#db8129" stroke-width="2.5"/>
    <g transform="translate(64, 731)">
      <rect x="0" y="0" width="40" height="36" rx="4" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <polyline points="6,12 12,17 6,22" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="26,6 18,20 24,20 21,34 31,17 25,17" fill="#db8129"/>
    </g>
    <text x="120" y="759" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">shell injection</text>

    <rect x="605" y="684" width="945" height="138" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="625" y="718" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="625" dy="0">lookup(pipe) and shell with interpolated variables are</tspan>
      <tspan x="625" dy="28">injection vectors: if a variable holds ; rm -rf /tmp/x the</tspan>
      <tspan x="625" dy="28">shell runs the extra command; quote with | quote so the</tspan>
      <tspan x="625" dy="28">shell treats it as one plain argument</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="830" width="540" height="138" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(66, 874)">
      <path d="M18 0 L36 8 V24 C36 38 18 47 18 47 C18 47 0 38 0 24 V8 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="18" y1="12" x2="18" y2="25" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="18" cy="33" r="2.5" fill="#207448"/>
    </g>
    <text x="120" y="889" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">untrusted facts and</tspan>
      <tspan x="120" dy="30">registered output</tspan>
    </text>

    <rect x="605" y="830" width="945" height="138" rx="6" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
    <text x="625" y="864" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="625" dy="0">a compromised host can return anything; Ansible marks some</tspan>
      <tspan x="625" dy="28">values unsafe so they are not re-templated; never strip</tspan>
      <tspan x="625" dy="28">!unsafe: stopping text from outside becoming Jinja2 code</tspan>
      <tspan x="625" dy="28">that runs on the control node (template injection)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="988" width="1500" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="1026" font-family="sans-serif" font-size="24" font-style="italic" fill="#303a36">
      <tspan x="75" dy="0">once a password has been written into a log a whole team can read,</tspan>
      <tspan x="75" dy="32">you rotate it everywhere it was used, and that is the expensive part</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="1096" width="1500" height="64" rx="8" fill="#207448"/>
    <text x="800" y="1138" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Treat the target's answer like a stranger's form</text>
  </g>
</svg>