<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The master map</title>
  <desc>Visual infographic mapping Kubernetes architectural concepts to underlying Linux kernel features, illustrating how pods, resources, networking, storage, security, and scheduling are implemented by kernel mechanisms.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 15 9 L 2 15 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 15 9 L 2 15 z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The master map</text>

  
  <rect x="40" y="75" width="580" height="1080" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="65" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Kubernetes concept</text>

  
  <rect x="940" y="75" width="620" height="1080" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="965" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Linux kernel feature</text>

  
  
  <path d="M 60 488 H 25 V 82 H 1220 V 270" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <path d="M 620 500 H 700 V 780 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 488 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 476 H 720 V 618 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 184 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 196 H 740 V 324 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 324 H 760 V 348 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 348 H 740 V 476 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 640 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 792 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 60 792 H 25 V 1162 H 1220 V 1108" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 932 H 740 V 804 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 956 H 760 V 932 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 1096 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 620 1084 H 740 V 956 H 960" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <g id="node-k8s-n" filter="url(#shadow)">
    <rect x="60" y="130" width="560" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(76, 156)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="14" cy="14" r="8" fill="#e8f1ea" />
      <circle cx="42" cy="14" r="8" fill="#e8f1ea" />
      <circle cx="28" cy="42" r="8" fill="#e8f1ea" />
      <path d="M 20 18 L 24 36 M 36 18 L 32 36" />
    </g>
    <text x="150" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod network,</text>
    <text x="150" y="210" font-family="sans-serif" font-size="24" fill="#303a36">Service, NetworkPolicy</text>
  </g>

  
  <g id="node-k8s-s" filter="url(#shadow)">
    <rect x="60" y="282" width="560" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(76, 308)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 46 14 V 28 C 46 42 28 50 28 50 C 28 50 10 42 10 28 V 14 Z" fill="#e8f1ea" />
      <path d="M 28 20 V 34 M 22 28 H 34" stroke-width="3" />
    </g>
    <text x="150" y="326" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Security context,</text>
    <text x="150" y="362" font-family="sans-serif" font-size="24" fill="#303a36">PSS, runtime class</text>
  </g>

  
  <g id="node-k8s-p" filter="url(#shadow)">
    <rect x="60" y="434" width="560" height="108" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(76, 460)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 50 18 V 40 L 28 52 L 6 40 V 18 Z" fill="#e8f1ea" />
      <path d="M 28 6 V 52 M 6 18 L 28 30 L 50 18" />
    </g>
    <text x="150" y="499" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Pod / container</text>
  </g>

  
  <g id="node-k8s-v" filter="url(#shadow)">
    <rect x="60" y="586" width="560" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(76, 612)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="14" rx="20" ry="7" fill="#e8f1ea" />
      <path d="M 8 14 V 38 C 8 44 17 48 28 48 C 39 48 48 44 48 38 V 14" />
      <path d="M 8 26 C 8 32 17 36 28 36 C 39 36 48 32 48 26" />
    </g>
    <text x="150" y="651" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Volumes, images, logs</text>
  </g>

  
  <g id="node-k8s-r" filter="url(#shadow)">
    <rect x="60" y="738" width="560" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(76, 764)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="10" width="40" height="38" rx="6" fill="#e8f1ea" />
      <path d="M 18 18 V 38 M 28 18 V 38 M 38 18 V 38" />
      <circle cx="18" cy="24" r="3" fill="#207448" />
      <circle cx="28" cy="32" r="3" fill="#207448" />
      <circle cx="38" cy="20" r="3" fill="#207448" />
    </g>
    <text x="150" y="782" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Resources</text>
    <text x="150" y="818" font-family="sans-serif" font-size="24" fill="#303a36">(requests/limits, QoS)</text>
  </g>

  
  <g id="node-k8s-d" filter="url(#shadow)">
    <rect x="60" y="890" width="560" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(76, 916)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="#e8f1ea" />
      <path d="M 20 6 V 12 M 28 6 V 12 M 36 6 V 12 M 20 44 V 50 M 28 44 V 50 M 36 44 V 50" />
      <path d="M 6 20 H 12 M 6 28 H 12 M 6 36 H 12 M 44 20 H 50 M 44 28 H 50 M 44 36 H 50" />
    </g>
    <text x="150" y="955" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Devices (GPU, RDMA)</text>
  </g>

  
  <g id="node-k8s-sc" filter="url(#shadow)">
    <rect x="60" y="1042" width="560" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(76, 1068)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="20" fill="#e8f1ea" />
      <polygon points="28,14 34,28 28,24 22,28" fill="#207448" stroke="none" />
      <polygon points="28,42 34,28 28,32 22,28" fill="#207448" stroke="none" opacity="0.4" />
    </g>
    <text x="150" y="1086" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scheduling hints</text>
    <text x="150" y="1122" font-family="sans-serif" font-size="24" fill="#303a36">(CPU/NUMA managers)</text>
  </g>

  
  
  <g id="node-kernel-net" filter="url(#shadow)">
    <rect x="960" y="130" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 156)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="14" width="40" height="28" rx="4" fill="#e8f1ea" />
      <path d="M 16 28 H 40 M 22 22 L 16 28 L 22 34 M 34 22 L 40 28 L 34 34" stroke-width="3" />
    </g>
    <text x="1050" y="162" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">veth, bridge, VXLAN/Geneve, routing,</text>
    <text x="1050" y="193" font-family="sans-serif" font-size="24" fill="#303a36">netfilter/nftables, conntrack, tc,</text>
    <text x="1050" y="224" font-family="sans-serif" font-size="24" fill="#303a36">eBPF/XDP</text>
  </g>

  
  <g id="node-kernel-ns" filter="url(#shadow)">
    <rect x="960" y="282" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 308)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="8" width="24" height="24" rx="4" fill="#e8f1ea" />
      <rect x="24" y="24" width="24" height="24" rx="4" fill="#ffffff" />
    </g>
    <text x="1050" y="326" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Namespaces:</text>
    <text x="1050" y="362" font-family="sans-serif" font-size="24" fill="#303a36">pid, mnt, net, uts, ipc, user, cgroup, time</text>
  </g>

  
  <g id="node-kernel-cap" filter="url(#shadow)">
    <rect x="960" y="434" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 460)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="22" width="32" height="26" rx="4" fill="#e8f1ea" />
      <path d="M 20 22 V 14 C 20 9 24 6 28 6 C 32 6 36 9 36 14 V 22" />
      <circle cx="28" cy="35" r="3" fill="#207448" stroke="none" />
    </g>
    <text x="1050" y="468" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Capabilities, no_new_privs, seccomp-bpf,</text>
    <text x="1050" y="500" font-family="sans-serif" font-size="24" fill="#303a36">LSM (AppArmor/SELinux),</text>
    <text x="1050" y="530" font-family="sans-serif" font-size="24" fill="#303a36">user namespaces</text>
  </g>

  
  <g id="node-kernel-fs" filter="url(#shadow)">
    <rect x="960" y="586" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 612)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 14 L 20 14 L 26 20 L 48 20 C 50 20 52 22 52 24 L 52 44 C 52 46 50 48 48 48 L 8 48 C 6 48 4 46 4 44 L 4 18 C 4 16 6 14 8 14 Z" fill="#e8f1ea" />
      <line x1="16" y1="32" x2="40" y2="32" />
    </g>
    <text x="1050" y="620" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">overlayfs, bind mounts,</text>
    <text x="1050" y="652" font-family="sans-serif" font-size="24" fill="#303a36">mount propagation, tmpfs, FUSE,</text>
    <text x="1050" y="682" font-family="sans-serif" font-size="24" fill="#303a36">page cache, block layer</text>
  </g>

  
  <g id="node-kernel-cg" filter="url(#shadow)">
    <rect x="960" y="738" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 764)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="#e8f1ea" />
      <line x1="6" y1="22" x2="50" y2="22" />
      <line x1="6" y1="36" x2="50" y2="36" />
      <circle cx="16" cy="15" r="2" fill="#207448" />
      <circle cx="16" cy="29" r="2" fill="#207448" />
      <circle cx="16" cy="43" r="2" fill="#207448" />
    </g>
    <text x="1050" y="772" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">cgroups v2: cpu, memory, io,</text>
    <text x="1050" y="804" font-family="sans-serif" font-size="24" fill="#303a36">pids, hugetlb, cpuset,</text>
    <text x="1050" y="834" font-family="sans-serif" font-size="24" fill="#303a36">devices (BPF), rdma</text>
  </g>

  
  <g id="node-kernel-dev" filter="url(#shadow)">
    <rect x="960" y="890" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 916)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 16 H 48 V 40 H 8 Z" fill="#e8f1ea" />
      <path d="M 16 40 V 46 M 24 40 V 46 M 32 40 V 46 M 40 40 V 46" />
      <circle cx="18" cy="28" r="3" fill="#207448" />
    </g>
    <text x="1050" y="924" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Device nodes, devtmpfs/udev, PCI,</text>
    <text x="1050" y="956" font-family="sans-serif" font-size="24" fill="#303a36">VFIO, SR-IOV,</text>
    <text x="1050" y="986" font-family="sans-serif" font-size="24" fill="#303a36">RDMA verbs, IOMMU</text>
  </g>

  
  <g id="node-kernel-sched" filter="url(#shadow)">
    <rect x="960" y="1042" width="580" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(976, 1068)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="20" fill="#e8f1ea" />
      <polyline points="28,14 28,28 38,28" />
    </g>
    <text x="1050" y="1076" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">CFS/EEVDF scheduler, cpusets,</text>
    <text x="1050" y="1108" font-family="sans-serif" font-size="24" fill="#303a36">NUMA, hugepages,</text>
    <text x="1050" y="1138" font-family="sans-serif" font-size="24" fill="#303a36">OOM killer, PSI</text>
  </g>
</svg>