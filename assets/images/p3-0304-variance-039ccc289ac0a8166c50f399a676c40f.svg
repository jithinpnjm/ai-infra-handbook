<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Invariant, covariant and contravariant generics, with the bin and the dispenser</title>
  <desc>Infographic explaining invariant, covariant, and contravariant generics in Python with dispenser and bin analogies, callables, and type bounds.</desc>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Invariant, covariant and contravariant generics,</tspan>
    <tspan x="800" dy="54">with the bin and the dispenser</tspan>
  </text>

  

  
  <g id="column-invariant">
    <rect x="40" y="140" width="480" height="510" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    
    <rect x="65" y="178" width="48" height="36" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <path d="M 75 178 V 166 A 14 14 0 0 1 103 166 V 178" fill="none" stroke="#db8129" stroke-width="4"/>
    <circle cx="89" cy="193" r="3" fill="#db8129"/>
    <line x1="89" y1="196" x2="89" y2="204" stroke="#db8129" stroke-width="3"/>

    
    <text x="135" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">
      <tspan x="135" dy="0">Invariant:</tspan>
      <tspan x="135" dy="38" font-family="'SFMono-Regular', Consolas, monospace">T = TypeVar(T)</tspan>
    </text>

    
    <line x1="60" y1="285" x2="500" y2="285" stroke="#db8129" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    
    <rect x="60" y="305" width="440" height="100" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="80" y="348" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">list[Dog] cannot be used</tspan>
      <tspan x="80" dy="32">as list[Animal]</tspan>
    </text>

    
    <rect x="60" y="420" width="440" height="213" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">because a caller could append</tspan>
      <tspan x="80" dy="36">a Cat to a mutable</tspan>
      <tspan x="80" dy="36" font-family="'SFMono-Regular', Consolas, monospace">list[Animal]</tspan>
    </text>
  </g>

  
  <g id="column-covariant">
    <rect x="560" y="140" width="480" height="510" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="585" y="160" width="44" height="34" rx="4" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <line x1="590" y1="176" x2="624" y2="176" stroke="#207448" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 607 194 V 204 M 601 204 H 613" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 607 210 C 604 214 604 219 607 220 C 610 219 610 214 607 210 Z" fill="#207448"/>

    
    <text x="650" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="650" dy="0">Covariant:</tspan>
      <tspan x="650" dy="36" font-family="'SFMono-Regular', Consolas, monospace">T_co = TypeVar(</tspan>
      <tspan x="650" dy="36" font-family="'SFMono-Regular', Consolas, monospace">T_co, covariant=True)</tspan>
    </text>

    
    <line x1="580" y1="285" x2="1020" y2="285" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    
    <rect x="580" y="305" width="440" height="115" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="600" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">read-only producers:</tspan>
      <tspan x="600" dy="32" font-family="'SFMono-Regular', Consolas, monospace">Sequence[T_co], Iterator[T_co],</tspan>
      <tspan x="600" dy="32" font-family="'SFMono-Regular', Consolas, monospace">BeverageDispenser[T_co]</tspan>
    </text>

    
    <rect x="580" y="432" width="440" height="201" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="600" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">varies in the same direction:</tspan>
      <tspan x="600" dy="34" font-family="'SFMono-Regular', Consolas, monospace">BeverageDispenser[OrangeJuice]</tspan>
      <tspan x="600" dy="34">is a subtype of</tspan>
      <tspan x="600" dy="34" font-family="'SFMono-Regular', Consolas, monospace">BeverageDispenser[Juice]</tspan>
    </text>
  </g>

  
  <g id="column-contravariant">
    <rect x="1080" y="140" width="480" height="510" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="1105" y="172" width="40" height="38" rx="4" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <line x1="1099" y1="172" x2="1151" y2="172" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 1118 172 V 164 H 1132 V 172" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1117" y1="180" x2="1117" y2="198" stroke="#207448" stroke-width="3"/>
    <line x1="1125" y1="180" x2="1125" y2="198" stroke="#207448" stroke-width="3"/>
    <line x1="1133" y1="180" x2="1133" y2="198" stroke="#207448" stroke-width="3"/>

    
    <text x="1165" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1165" dy="0">Contravariant:</tspan>
      <tspan x="1165" dy="34" font-family="'SFMono-Regular', Consolas, monospace">T_contra = TypeVar(</tspan>
      <tspan x="1165" dy="34" font-family="'SFMono-Regular', Consolas, monospace">T_contra,</tspan>
      <tspan x="1165" dy="34" font-family="'SFMono-Regular', Consolas, monospace">contravariant=True)</tspan>
    </text>

    
    <line x1="1100" y1="285" x2="1540" y2="285" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    
    <rect x="1100" y="305" width="440" height="80" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1120" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1120" dy="0">write-only consumers:</tspan>
      <tspan x="1120" dy="30" font-family="'SFMono-Regular', Consolas, monospace">TrashCan[T_contra]</tspan>
    </text>

    
    <rect x="1100" y="398" width="440" height="235" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1118" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1118" dy="0">varies in the opposite direction:</tspan>
      <tspan x="1118" dy="32" font-family="'SFMono-Regular', Consolas, monospace">TrashCan[Refuse] is a subtype</tspan>
      <tspan x="1118" dy="32" font-family="'SFMono-Regular', Consolas, monospace">of TrashCan[Biodegradable],</tspan>
      <tspan x="1118" dy="32">because a general refuse bin</tspan>
      <tspan x="1118" dy="32">can safely accept</tspan>
      <tspan x="1118" dy="32">biodegradable trash</tspan>
    </text>
  </g>

  
  <g id="callable-strip">
    <rect x="40" y="670" width="1520" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="65" y="718" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <path d="M 85 758 C 85 744 89 736 96 736 C 103 736 102 745 108 745" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="88" y1="748" x2="104" y2="748" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

    
    <text x="145" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">Callable[[int, str], bool] is contravariant in its argument types and covariant in its return type;</tspan>
      <tspan x="145" dy="31">Callable[[float], None] is a subtype of Callable[[int], None]:</tspan>
      <tspan x="145" dy="31">a callback that handles any float can safely handle an int; the reverse does not hold;</tspan>
      <tspan x="145" dy="31">for keyword or variadic arguments define a Protocol with __call__</tspan>
    </text>
  </g>

  
  <g id="bounds-strip">
    <rect x="40" y="845" width="1520" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="60" y="865" width="610" height="215" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="80" y="898" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">LT = TypeVar(LT,</tspan>
      <tspan x="80" dy="30">bound=SupportsLessThan)</tspan>
      <tspan x="80" dy="30">with class SupportsLessThan(Protocol):</tspan>
      <tspan x="80" dy="30">def __lt__(self, other: Any) -&gt; bool;</tspan>
      <tspan x="80" dy="30">top(series: Iterable[LT],</tspan>
      <tspan x="80" dy="30">length: int) -&gt; list[LT]</tspan>
    </text>

    
    <rect x="690" y="865" width="420" height="215" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="710" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="710" dy="0" font-family="'SFMono-Regular', Consolas, monospace">NumberT = TypeVar(</tspan>
      <tspan x="710" dy="34" font-family="'SFMono-Regular', Consolas, monospace">NumberT, float, Decimal,</tspan>
      <tspan x="710" dy="34" font-family="'SFMono-Regular', Consolas, monospace">Fraction) limits mode()</tspan>
      <tspan x="710" dy="34">to those three types</tspan>
    </text>

    
    <rect x="1130" y="865" width="410" height="215" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1150" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1150" dy="0" font-family="'SFMono-Regular', Consolas, monospace">LottoBlower[int](</tspan>
      <tspan x="1150" dy="34" font-family="'SFMono-Regular', Consolas, monospace">range(1, 11));</tspan>
      <tspan x="1150" dy="34">Python 3.12 shorter syntax</tspan>
      <tspan x="1150" dy="34" font-family="'SFMono-Regular', Consolas, monospace">class Stack[T]:</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="60" rx="10" fill="#207448"/>
    <text x="800" y="1165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Producers vary with T, consumers vary against it
    </text>
  </g>
</svg>