<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Two 4-pod jobs on six nodes: pod-by-pod placement deadlocks, gang admission does not</title>
  <desc>Visual comparison showing how default pod-by-pod scheduling leads to deadlock when two distributed jobs hold nodes and wait for remaining ranks, whereas Kueue gang admission suspends jobs and admits one whole job against quota.</desc>

  <defs>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Two 4-pod jobs on six nodes: pod-by-pod</tspan>
    <tspan x="800" dy="56">placement deadlocks, gang admission does not</tspan>
  </text>

  
