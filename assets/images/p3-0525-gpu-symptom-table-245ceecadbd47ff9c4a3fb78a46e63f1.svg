<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>GPU workload symptoms and first checks</title>
  <desc>GPU workload symptoms and first checks</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">GPU workload symptoms and first checks</text>

  
  <rect x="40" y="82" width="530" height="38" rx="6" fill="#207448"/>
  <text x="60" y="109" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Symptom</text>

  <rect x="586" y="82" width="974" height="38" rx="6" fill="#207448"/>
  <text x="606" y="109" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Checks</text>

  
  <rect x="40" y="128" width="530" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 154)">
    <path d="M4 12 L24 2 L44 12 L44 36 L24 46 L4 36 Z M4 12 L24 22 L44 12 M24 22 L24 46" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="8" y1="6" x2="40" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="118" y="186" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod cannot see GPU</text>

  <rect x="586" y="128" width="974" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="157" font-size="24" fill="#303a36">
    <tspan font-family="monospace">nvidia.com/gpu</tspan><tspan font-family="sans-serif"> requested, device plugin or ClusterPolicy healthy,</tspan>
  </text>
  <text x="606" y="187" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">runtime configured, </tspan><tspan font-family="monospace">crictl inspect devices and mounts</tspan><tspan font-family="sans-serif">,</tspan>
  </text>
  <text x="606" y="217" font-size="24" fill="#303a36">
    <tspan font-family="monospace">NVIDIA_VISIBLE_DEVICES</tspan><tspan font-family="sans-serif">, driver loaded on host, </tspan><tspan font-family="monospace">RuntimeClass</tspan>
  </text>

  
  <rect x="40" y="238" width="530" height="112" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 270)">
    <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="32" y1="2" x2="32" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="40" x2="16" y2="46" stroke="#207448" stroke-width="3"/>
    <line x1="32" y1="40" x2="32" y2="46" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="16" x2="24" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="32" r="1.5" fill="#207448"/>
  </g>
  <text x="118" y="271" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">CUDA error no kernel image</text>
  <text x="118" y="302" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">or driver version</text>
  <text x="118" y="333" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">insufficient</text>

  <rect x="586" y="238" width="974" height="112" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="287" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">host driver versus image </tspan><tspan font-family="monospace">CUDA</tspan><tspan font-family="sans-serif">;</tspan>
  </text>
  <text x="606" y="319" font-family="sans-serif" font-size="24" fill="#303a36">compute capability build flags</text>

  
  <rect x="40" y="360" width="530" height="94" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 383)">
    <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="24" y1="24" x2="12" y2="17" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3" fill="#207448"/>
  </g>
  <text x="118" y="415" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Job slow, GPUs idle</text>

  <rect x="586" y="360" width="974" height="94" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="399" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">dataloader or storage bottleneck, CPU throttling, </tspan><tspan font-family="monospace">/dev/shm</tspan><tspan font-family="sans-serif">, NCCL fallback to TCP,</tspan>
  </text>
  <text x="606" y="431" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">straggler rank; DCGM tensor activity; </tspan><tspan font-family="monospace">py-spy</tspan><tspan font-family="sans-serif"> on workers</tspan>
  </text>

  
  <rect x="40" y="464" width="530" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 495)">
    <circle cx="10" cy="12" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="38" cy="12" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="24" cy="36" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="15" y1="12" x2="33" y2="12" stroke="#207448" stroke-width="2.5"/>
    <line x1="12" y1="16" x2="22" y2="32" stroke="#207448" stroke-width="2.5"/>
    <line x1="36" y1="16" x2="26" y2="32" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="118" y="527" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NCCL hang at init</text>

  <rect x="586" y="464" width="974" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="495" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">rendezvous or DNS (headless Service, </tspan><tspan font-family="monospace">publishNotReadyAddresses</tspan><tspan font-family="sans-serif">),</tspan>
  </text>
  <text x="606" y="526" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">firewall or NetworkPolicy, </tspan><tspan font-family="monospace">NCCL_SOCKET_IFNAME</tspan><tspan font-family="sans-serif">, MTU, IB device missing in container;</tspan>
  </text>
  <text x="606" y="557" font-size="24" fill="#303a36">
    <tspan font-family="monospace">NCCL_DEBUG=INFO</tspan><tspan font-family="sans-serif"> per rank; run </tspan><tspan font-family="monospace">all_reduce_perf</tspan><tspan font-family="sans-serif"> across the same nodes</tspan>
  </text>

  
  <rect x="40" y="584" width="530" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 606)">
    <circle cx="24" cy="26" r="16" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="24" y1="6" x2="24" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="6" x2="28" y2="6" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="26" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="118" y="624" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">NCCL timeout</text>
  <text x="118" y="656" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">mid-training</text>

  <rect x="586" y="584" width="974" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="623" font-family="sans-serif" font-size="24" fill="#303a36">failing link or GPU (Xid, PCIe or IB errors), straggler, preemption of one rank,</text>
  <text x="606" y="655" font-family="sans-serif" font-size="24" fill="#303a36">switch congestion; correlate time with node events</text>

  
  <rect x="40" y="686" width="530" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 708)">
    <rect x="6" y="6" width="36" height="14" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="6" y="24" width="36" height="14" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="12" cy="13" r="1.5" fill="#207448"/>
    <circle cx="12" cy="31" r="1.5" fill="#207448"/>
    <line x1="20" y1="13" x2="34" y2="13" stroke="#207448" stroke-width="2"/>
    <line x1="20" y1="31" x2="34" y2="31" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="118" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">One node slow</text>

  <rect x="586" y="686" width="974" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="723" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">GPU throttling (</tspan><tspan font-family="monospace">clocks_throttle_reasons</tspan><tspan font-family="sans-serif">), ECC page retirements,</tspan>
  </text>
  <text x="606" y="755" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">PCIe link downtrained (</tspan><tspan font-family="monospace">LnkSta</tspan><tspan font-family="sans-serif">), NIC speed, noisy neighbour, power cap</tspan>
  </text>

  
  <rect x="40" y="788" width="530" height="88" rx="8" fill="#fef8f0" stroke="#db8129" stroke-width="2.5"/>
  <g transform="translate(54, 808)">
    <path d="M24 4 L42 38 L6 38 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="24" y1="14" x2="24" y2="26" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="32" r="1.5" fill="#db8129"/>
  </g>
  <text x="118" y="826" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Xid 79 GPU has</text>
  <text x="118" y="857" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">fallen off the bus</text>

  <rect x="586" y="788" width="974" height="88" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <text x="606" y="840" font-family="sans-serif" font-size="24" fill="#303a36">hardware, power or PCIe; drain node, reset or RMA</text>

  
  <rect x="40" y="886" width="530" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 902)">
    <rect x="8" y="8" width="32" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="8" x2="24" y2="40" stroke="#207448" stroke-width="2.5" stroke-dasharray="3 3"/>
    <line x1="8" y1="24" x2="40" y2="24" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="118" y="934" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">MIG mismatch</text>

  <rect x="586" y="886" width="974" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="934" font-size="24" fill="#303a36">
    <tspan font-family="monospace">nvidia-smi mig -lgi</tspan><tspan font-family="sans-serif">, MIG manager logs, labels versus resource names</tspan>
  </text>

  
  <rect x="40" y="976" width="530" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(54, 997)">
    <rect x="10" y="18" width="28" height="22" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M17 18 V11 A7 7 0 0 1 31 11 V18" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="24" cy="28" r="2" fill="#207448"/>
    <line x1="24" y1="30" x2="24" y2="34" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="118" y="1015" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Training hung,</text>
  <text x="118" y="1046" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">all ranks idle</text>

  <rect x="586" y="976" width="974" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="606" y="1013" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">deadlock in collective ordering or data loader; </tspan><tspan font-family="monospace">py-spy</tspan><tspan font-family="sans-serif"> dump per rank;</tspan>
  </text>
  <text x="606" y="1045" font-size="24" fill="#303a36">
    <tspan font-family="monospace">torch.distributed</tspan><tspan font-family="sans-serif"> timeouts; NCCL flight recorder</tspan>
  </text>

  
  <rect x="40" y="1082" width="1520" height="68" rx="8" fill="#207448"/>
  <text x="800" y="1125" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">a straggler is one slow rank; the slowest rank sets the pace for all</text>
</svg>