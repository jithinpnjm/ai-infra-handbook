<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Hybrid Futex Lock Escalation and Cache Line False Sharing</title>
  <desc>Technical diagram illustrating hybrid futex escalation in pthread_mutex on the left, and 64-byte cache line false sharing with alignas padding fix on the right.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-grey" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#4a5752" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Hybrid Futex Lock Escalation and Cache Line False Sharing</text>

  
  
  
  <rect x="50" y="105" width="725" height="1275" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  
  <text x="412" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Hybrid Futex Escalation (pthread_mutex)</text>

  
  <g id="tier1">
    <rect x="80" y="185" width="665" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="225" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 118 223 L 118 217 C 118 213 132 213 132 217 L 132 223 M 115 223 L 135 223 L 135 235 L 115 235 Z" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    
    
    <text x="160" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Atomic Compare-and-Swap (CAS)</text>
    <text x="160" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">in User Space</text>
    
    
    <text x="105" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Uncontended lock acquired immediately via single CPU</text>
    <text x="105" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">atomic instruction (~10-20 ns, zero syscall overhead).</text>
    <text x="105" y="365" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Tier 1</text>
  </g>

  
  <line x1="412" y1="390" x2="412" y2="475" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="345" y="415" width="135" height="36" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="412" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">If locked</text>

  
  <g id="tier2">
    <rect x="80" y="480" width="665" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="520" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 115 520 A 10 10 0 1 1 135 520" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <polygon points="135,514 140,524 130,524" fill="#207448" />

    <text x="160" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Adaptive Spin Loop</text>
    
    <text x="105" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Waiter thread spins briefly in user space checking lock</text>
    <text x="105" y="607" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">variable if the lock owner is active on another CPU core.</text>
    <text x="105" y="652" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">If released during spin, lock acquired.</text>
    <text x="105" y="698" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Tier 2</text>
  </g>

  
  <line x1="412" y1="730" x2="412" y2="815" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="325" y="755" width="175" height="36" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="412" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">If still locked</text>

  
  <g id="tier3">
    <rect x="80" y="820" width="665" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="860" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 115 852 L 135 852 L 135 868 L 115 868 Z M 120 868 L 120 873 L 130 873 L 130 868" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />

    
    <text x="160" y="858" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">futex(addr, FUTEX_WAIT_PRIVATE,</text>
    <text x="160" y="888" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">val) Syscall</text>

    <text x="105" y="934" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Waiter traps into kernel, context-switches off CPU,</text>
    <text x="105" y="966" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">and sleeps on kernel futex wait queue.</text>

    <text x="105" y="1015" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Once owner releases, it calls</text>
    <text x="105" y="1047" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">futex(addr, FUTEX_WAKE, 1)</text>
    <text x="475" y="1047" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">to wake waiter.</text>
    <text x="105" y="1120" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Tier 3</text>
  </g>

  
  <rect x="80" y="1185" width="665" height="165" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <circle cx="120" cy="1225" r="18" fill="#fdf3e7" stroke="#db8129" stroke-width="2" />
  <text x="120" y="1232" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">i</text>
  <text x="155" y="1230" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">Kernel Boundary Note</text>
  <text x="105" y="1280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">futex syscall only appears in strace during heavy</text>
  <text x="105" y="1312" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">lock contention</text>

  
  
  
  <rect x="825" y="105" width="725" height="1275" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <text x="1187" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">False Sharing on 64-Byte Cache Line</text>

  
  
  <rect x="855" y="185" width="315" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="875" y="200" width="36" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="893" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448" text-anchor="middle">CPU</text>
  <text x="925" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Core 0</text>
  <text x="875" y="270" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">var_a</text>
  <text x="875" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">modified by Thread 0</text>
  <text x="875" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">on Core 0</text>

  
  <rect x="1205" y="185" width="315" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="1225" y="200" width="36" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1243" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448" text-anchor="middle">CPU</text>
  <text x="1275" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Core 1</text>
  <text x="1225" y="270" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">var_b</text>
  <text x="1225" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">modified by Thread 1</text>
  <text x="1225" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">on Core 1</text>

  
  <line x1="1012" y1="340" x2="1012" y2="385" stroke="#4a5752" stroke-width="2.5" marker-end="url(#arrow-grey)" />
  <line x1="1362" y1="340" x2="1362" y2="385" stroke="#4a5752" stroke-width="2.5" marker-end="url(#arrow-grey)" />

  
  <g id="shared-cache-line">
    <rect x="855" y="390" width="665" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="880" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Single 64-Byte L1 Cache Line</text>

    
    <rect x="880" y="445" width="300" height="60" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="2" />
    <text x="1030" y="483" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">var_a [offset 0..7]</text>

    <rect x="1195" y="445" width="300" height="60" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="2" />
    <text x="1345" y="483" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">var_b [offset 8..15]</text>
  </g>

  
  <g id="invalidation-cycle">
    <rect x="855" y="555" width="665" height="240" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="880" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">MESI Interconnect Invalidation Conflict</text>

    
    <line x1="880" y1="620" x2="1490" y2="620" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
    <text x="880" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Core 0 writes var_a, forcing CPU interconnect cache</text>
    <text x="880" y="687" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">invalidation (MESI protocol) of Core 1's cache line</text>

    
    <line x1="1490" y1="710" x2="880" y2="710" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
    <text x="880" y="745" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Core 1 writes var_b, invalidating Core 0's cache line</text>
  </g>

  
  <rect x="855" y="820" width="665" height="135" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <circle cx="895" cy="860" r="18" fill="#fdf3e7" stroke="#db8129" stroke-width="2" />
  <text x="895" y="868" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">!</text>
  <text x="930" y="865" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">Performance Degradation</text>
  <text x="880" y="905" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Severe interconnect bus traffic and latency</text>
  <text x="880" y="937" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">degradation despite independent code</text>

  
  <g id="fix-section">
    <rect x="855" y="980" width="665" height="370" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <rect x="880" y="1005" width="165" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="962" y="1034" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">alignas(64)</text>
    <text x="1065" y="1035" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Hardware Cache Alignment</text>

    <text x="880" y="1080" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">alignas(64) padding pushing var_a and var_b into</text>
    <text x="880" y="1112" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">separate 64-byte cache lines.</text>

    
    <rect x="880" y="1145" width="615" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="895" y="1157" width="150" height="50" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="970" y="1190" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">var_a</text>
    <text x="1075" y="1190" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#4a5752">Cache Line 0 [64 bytes with padding]</text>

    
    <rect x="880" y="1245" width="615" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="895" y="1257" width="150" height="50" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="970" y="1290" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">var_b</text>
    <text x="1075" y="1290" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#4a5752">Cache Line 1 [64 bytes with padding]</text>
  </g>

</svg>