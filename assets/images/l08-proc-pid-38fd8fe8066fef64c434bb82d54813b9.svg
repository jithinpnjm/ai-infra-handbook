<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What lives in /proc/PID</title>
  <desc>Visual explanation of the Linux /proc/PID directory structure, process-specific virtual files, system-wide proc files, and how diagnostic tools read them.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="80" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What lives in /proc/PID</text>

  
  <g id="hub" filter="url(#shadow)">
    <rect x="660" y="490" width="280" height="160" rx="16" fill="#207448" />
    
    <path d="M 680 490 L 680 472 Q 680 466 686 466 L 760 466 Q 766 466 772 472 L 784 490 Z" fill="#207448" />
    
    <g transform="translate(772, 510)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 10 L 22 10 L 28 16 L 52 16 A 4 4 0 0 1 56 20 L 56 42 A 4 4 0 0 1 52 46 L 4 46 A 4 4 0 0 1 0 42 L 0 14 A 4 4 0 0 1 4 10 Z" />
    </g>
    
    <text x="800" y="605" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff">/proc/PID</text>
  </g>

  
  
  <path d="M 720 490 L 720 280 L 400 280" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 770 490 L 770 290" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 830 490 L 830 290" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 880 490 L 880 280 L 1200 280" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 660 520 L 400 520" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 660 620 L 440 620" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 940 520 L 1160 520" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 940 620 L 1150 620" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 720 650 L 720 740 L 440 740" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 770 650 L 770 780" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 830 650 L 830 780" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="node-cmdline" filter="url(#shadow)">
    <rect x="80" y="210" width="320" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(100, 237)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="46" rx="6" />
      <path d="M 12 15 L 22 23 L 12 31" />
      <line x1="28" y1="31" x2="44" y2="31" />
    </g>
    <text x="175" y="275" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cmdline</text>
  </g>

  
  <g id="node-cwd-exe-root" filter="url(#shadow)">
    <rect x="490" y="140" width="350" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(515, 160)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M 18 28 A 12 12 0 0 1 30 16 L 42 16 A 12 12 0 0 1 54 28 A 12 12 0 0 1 42 40 L 38 40" />
      <path d="M 38 28 A 12 12 0 0 1 26 40 L 14 40 A 12 12 0 0 1 2 28 A 12 12 0 0 1 14 16 L 18 16" />
    </g>
    <text x="590" y="195" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cwd, exe, root</text>
    <text x="590" y="245" font-family="sans-serif" font-size="24" fill="#303a36">(symlinks)</text>
  </g>

  
  <g id="node-maps-smaps" filter="url(#shadow)">
    <rect x="890" y="140" width="380" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(915, 160)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="52" height="48" rx="4" />
      <line x1="2" y1="20" x2="54" y2="20" />
      <line x1="2" y1="36" x2="54" y2="36" />
      <line x1="20" y1="4" x2="20" y2="52" />
    </g>
    <text x="990" y="195" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">maps and smaps</text>
    <text x="990" y="245" font-family="sans-serif" font-size="24" fill="#303a36">(memory mappings)</text>
  </g>

  
  <g id="node-limits" filter="url(#shadow)">
    <rect x="1200" y="210" width="320" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1225, 237)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="8" y1="12" x2="48" y2="12" />
      <circle cx="20" cy="12" r="6" fill="#e8f1ea" />
      <line x1="8" y1="28" x2="48" y2="28" />
      <circle cx="38" cy="28" r="6" fill="#e8f1ea" />
      <line x1="8" y1="44" x2="48" y2="44" />
      <circle cx="26" cy="44" r="6" fill="#e8f1ea" />
    </g>
    <text x="1310" y="275" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">limits</text>
  </g>

  
  <g id="node-environ" filter="url(#shadow)">
    <rect x="80" y="465" width="320" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(100, 492)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="6" y1="12" x2="16" y2="12" />
      <line x1="26" y1="12" x2="50" y2="12" />
      <line x1="6" y1="28" x2="16" y2="28" />
      <line x1="26" y1="28" x2="50" y2="28" />
      <line x1="6" y1="44" x2="16" y2="44" />
      <line x1="26" y1="44" x2="50" y2="44" />
    </g>
    <text x="175" y="530" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">environ</text>
  </g>

  
  <g id="node-status" filter="url(#shadow)">
    <rect x="80" y="605" width="360" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(100, 625)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="44" height="50" rx="4" />
      <line x1="16" y1="18" x2="40" y2="18" />
      <line x1="16" y1="28" x2="34" y2="28" />
      <line x1="16" y1="38" x2="28" y2="38" />
    </g>
    <text x="175" y="660" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">status</text>
    <text x="175" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="175" dy="0">(name, state,</tspan>
      <tspan x="175" dy="30">UIDs, VmRSS)</tspan>
    </text>
  </g>

  
  <g id="node-io" filter="url(#shadow)">
    <rect x="1160" y="465" width="360" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1185, 485)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <ellipse cx="28" cy="14" rx="22" ry="8" />
      <path d="M 6 14 L 6 42 A 22 8 0 0 0 50 42 L 50 14" />
      <path d="M 6 28 A 22 8 0 0 0 50 28" />
    </g>
    <text x="1260" y="520" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">io</text>
    <text x="1260" y="565" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1260" dy="0">(read_bytes,</tspan>
      <tspan x="1260" dy="30">write_bytes)</tspan>
    </text>
  </g>

  
  <g id="node-wchan-stack" filter="url(#shadow)">
    <rect x="1150" y="625" width="370" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1175, 645)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 52 18 L 28 30 L 4 18 Z" />
      <path d="M 4 28 L 28 40 L 52 28" />
      <path d="M 4 38 L 28 50 L 52 38" />
    </g>
    <text x="1255" y="680" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">wchan and stack</text>
    <text x="1255" y="725" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1255" dy="0">(kernel function</tspan>
      <tspan x="1255" dy="30">waiting in)</tspan>
    </text>
  </g>

  
  <g id="node-fd" filter="url(#shadow)">
    <rect x="80" y="780" width="360" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(100, 800)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="4" />
      <line x1="4" y1="20" x2="52" y2="20" />
      <circle cx="16" cy="34" r="3" fill="#207448" />
      <circle cx="30" cy="34" r="3" fill="#207448" />
      <circle cx="44" cy="34" r="3" fill="#207448" />
    </g>
    <text x="175" y="835" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">fd/</text>
    <text x="175" y="880" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="175" dy="0">(one symlink per</tspan>
      <tspan x="175" dy="30">open descriptor)</tspan>
    </text>
  </g>

  
  <g id="node-cgroup" filter="url(#shadow)">
    <rect x="520" y="780" width="280" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(540, 815)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="2" width="20" height="14" rx="2" />
      <line x1="28" y1="16" x2="28" y2="28" />
      <line x1="12" y1="28" x2="44" y2="28" />
      <line x1="12" y1="28" x2="12" y2="38" />
      <line x1="44" y1="28" x2="44" y2="38" />
      <rect x="4" y="38" width="16" height="14" rx="2" />
      <rect x="36" y="38" width="16" height="14" rx="2" />
    </g>
    <text x="625" y="855" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cgroup</text>
  </g>

  
  <g id="node-ns" filter="url(#shadow)">
    <rect x="840" y="780" width="260" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(860, 815)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="22" height="20" rx="3" />
      <rect x="30" y="6" width="22" height="20" rx="3" />
      <rect x="17" y="28" width="22" height="20" rx="3" />
    </g>
    <text x="945" y="855" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">ns/</text>
  </g>

  
  
  <g id="system-wide-box" filter="url(#shadow)">
    <rect x="80" y="990" width="670" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(105, 1035)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <ellipse cx="28" cy="28" rx="12" ry="24" />
      <line x1="4" y1="28" x2="52" y2="28" />
    </g>
    <text x="180" y="1035" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">system-wide</text>
    <text x="180" y="1080" font-family="monospace" font-size="25" fill="#303a36">/proc/loadavg</text>
    <text x="400" y="1080" font-family="monospace" font-size="25" fill="#303a36">/proc/meminfo</text>
    <text x="180" y="1118" font-family="monospace" font-size="25" fill="#303a36">/proc/pressure/*</text>
  </g>

  
  <g id="orange-note" filter="url(#shadow)">
    <rect x="800" y="990" width="720" height="150" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(830, 1035)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <line x1="38" y1="38" x2="52" y2="52" />
      <path d="M 16 24 L 22 30 L 32 18" />
    </g>
    <text x="910" y="1075" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">reading these is how ps and top work</text>
  </g>
</svg>