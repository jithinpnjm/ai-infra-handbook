<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Green infrastructure, unhappy users: check quality signals</title>
  <desc>Infographic contrasting green infrastructure metrics with user quality degradation, showing diagnostic cause cards, immediate action steps, and quality signals to verify.</desc>

  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Green infrastructure, unhappy users: check quality signals</text>

  
  <rect x="50" y="130" width="340" height="675" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="50" y="130" width="340" height="42" rx="12" fill="#e8f1ea"/>
  <rect x="50" y="160" width="340" height="12" fill="#e8f1ea"/>
  <circle cx="75" cy="151" r="6" fill="#207448" opacity="0.4"/>
  <circle cx="95" cy="151" r="6" fill="#207448" opacity="0.4"/>
  <circle cx="115" cy="151" r="6" fill="#207448" opacity="0.4"/>

  
  <g transform="translate(68, 185)">
    <rect width="304" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(124, 12)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="152" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Latency fine</text>
  </g>

  
  <g transform="translate(68, 335)">
    <rect width="304" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(124, 12)">
      <path d="M28,8 L48,16 L48,32 C48,44 28,52 28,52 C28,52 8,44 8,32 L8,16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <polyline points="20,28 26,34 38,22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="152" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Errors low</text>
  </g>

  
  <g transform="translate(68, 485)">
    <rect width="304" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(124, 10)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="20" y1="6" x2="20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="6" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="6" x2="36" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="44" x2="20" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="152" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="152" dy="0">GPU utilisation</tspan>
      <tspan x="152" dy="36">normal</tspan>
    </text>
  </g>

  
  <g transform="translate(68, 645)">
    <rect width="304" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(124, 10)">
      <rect x="8" y="10" width="40" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="8" y="30" width="40" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="16" cy="18" r="2" fill="#207448"/>
      <circle cx="16" cy="38" r="2" fill="#207448"/>
    </g>
    <text x="152" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="152" dy="0">Infrastructure</tspan>
      <tspan x="152" dy="36">green</tspan>
    </text>
  </g>

  
  
  <g transform="translate(415, 170)">
    <path d="M 20,0 L 290,0 A 20,20 0 0 1 310,20 L 310,280 A 20,20 0 0 1 290,300 L 190,300 L 155,360 L 140,300 L 20,300 A 20,20 0 0 1 0,280 L 0,20 A 20,20 0 0 1 20,0 Z" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <text x="155" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="155" dy="0">Answers are</tspan>
      <tspan x="155" dy="42">cut off,</tspan>
      <tspan x="155" dy="42">repetitive</tspan>
      <tspan x="155" dy="42">or odd</tspan>
    </text>
  </g>

  
  <g transform="translate(542, 560)">
    <circle cx="28" cy="22" r="18" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M6,62 C6,44 16,38 28,38 C40,38 50,44 50,62" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M20,26 Q28,20 36,26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="21" cy="18" r="2" fill="#207448"/>
    <circle cx="35" cy="18" r="2" fill="#207448"/>
  </g>

  
  
  <g transform="translate(760, 130)">
    <rect width="790" height="130" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <g transform="translate(24, 37)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
      <line x1="16" y1="36" x2="16" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="36" x2="28" y2="18" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="36" x2="40" y2="24" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="100" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">finish_reason drift:</text>
    <text x="100" y="80" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">vllm:request_success_total by finished_reason</text>
    <text x="100" y="110" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(stop, length, abort, error, repetition)</text>
  </g>

  
  <g transform="translate(760, 272)">
    <rect width="790" height="122" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 33)">
      <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M8,14 L8,42 C8,46 17,50 28,50 C39,50 48,46 48,42 L48,14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M8,28 C8,32 17,36 28,36 C39,36 48,32 48,28" fill="none" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="100" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">KV-cache corruption:</text>
    <text x="100" y="78" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">vllm:corrupted_requests,</text>
    <text x="100" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">requests with NaNs in logits</text>
  </g>

  
  <g transform="translate(760, 406)">
    <rect width="790" height="122" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 33)">
      <rect x="8" y="18" width="22" height="24" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="26" y="10" width="22" height="32" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="14,30 19,30 19,24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <polyline points="32,26 38,26 38,36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="100" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Speculative decoding:</text>
    <text x="100" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a small draft model proposes tokens,</text>
    <text x="100" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the main model checks them</text>
  </g>

  
  <g transform="translate(760, 540)">
    <rect width="790" height="122" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 33)">
      <path d="M10,46 L10,10 L46,10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M14,40 L24,40 L24,30 L34,30 L34,20 L44,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="100" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Quantisation:</text>
    <text x="100" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">lower precision, some accuracy cost</text>
  </g>

  
  <g transform="translate(760, 674)">
    <rect width="790" height="131" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 37)">
      <path d="M12,8 L36,8 L44,16 L44,48 L12,48 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <polyline points="36,8 36,16 44,16" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="18" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="36" x2="32" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="100" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Sampling defaults:</text>
    <text x="100" y="88" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace">generation_config.json</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> since v0.8.0</tspan>
    </text>
  </g>

  
  
  <g transform="translate(50, 830)">
    <rect width="730" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 37)">
      <path d="M28,10 A18,18 0 1 0 46,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polyline points="28,2 28,10 36,10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="100" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="100" dy="0">Stop the rollout and</tspan>
      <tspan x="100" dy="40">roll back the affected pool</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 830)">
    <rect width="730" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 37)">
      <line x1="8" y1="28" x2="48" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="12" x2="28" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="16" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="40" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="100" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="100" dy="0">Compare outputs on a</tspan>
      <tspan x="100" dy="40">fixed prompt set</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 985)">
    <rect width="1500" height="85" rx="12" fill="#207448"/>
    <text x="750" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">When infrastructure is green and users are unhappy, check finish_reason shares and the last config change.</text>
  </g>
</svg>