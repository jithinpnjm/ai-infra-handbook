<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Making a VM from a cloud image</title>
  <desc>Visual infographic explaining how to create and boot a virtual machine rapidly using a base cloud image, a thin copy-on-write overlay, cloud-init seed ISO configuration, and direct import.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 2 2 L 12 7 L 2 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Making a VM from a cloud image</text>

  
  <g id="step-numbers">
    <circle cx="200" cy="135" r="24" fill="#207448" />
    <text x="200" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    <circle cx="560" cy="135" r="24" fill="#207448" />
    <text x="560" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <circle cx="880" cy="135" r="24" fill="#207448" />
    <text x="880" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <circle cx="1160" cy="135" r="24" fill="#207448" />
    <text x="1160" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    <circle cx="1440" cy="135" r="24" fill="#207448" />
    <text x="1440" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  </g>

  
  <g id="connections">
    
    <line x1="360" y1="295" x2="400" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <line x1="360" y1="565" x2="400" y2="565" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 720 295 H 740 V 360 H 760" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 720 565 H 740 V 500 H 760" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <line x1="1000" y1="430" x2="1040" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <line x1="1280" y1="295" x2="1320" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <line x1="1440" y1="410" x2="1440" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  </g>

  
  <g id="node-1">
    <rect x="40" y="180" width="320" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(172, 195)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="7" />
      <path d="M 8 14 V 34 A 20 7 0 0 0 48 34 V 14" />
      <path d="M 22 26 A 5 5 0 0 1 33 24 A 6 6 0 0 1 40 30 A 4 4 0 0 1 38 38 H 18 A 5 5 0 0 1 18 28 A 5 5 0 0 1 22 26 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    </g>
    <text x="200" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="200" dy="0">base cloud</tspan>
      <tspan x="200" dy="34">image</tspan>
    </text>
    <text x="200" y="352" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
      <tspan x="200" dy="0">(jammy-server-</tspan>
      <tspan x="200" dy="32">cloudimg-amd64.img)</tspan>
    </text>
  </g>

  
  <g id="node-3">
    <rect x="40" y="450" width="320" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(172, 470)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 10 H 36 L 46 20 V 46 H 18 Z" stroke-dasharray="4 3" />
      <path d="M 10 16 H 28 L 38 26 V 52 H 10 Z" fill="#e8f1ea" />
      <polyline points="28 16 28 26 38 26" />
      <line x1="16" y1="34" x2="30" y2="34" />
      <line x1="16" y1="42" x2="26" y2="42" />
    </g>
    <text x="200" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="200" dy="0">user-data plus</tspan>
      <tspan x="200" dy="34">meta-data</tspan>
    </text>
  </g>

  
  <g id="node-2">
    <rect x="400" y="180" width="320" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(532, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="6" />
      <path d="M 8 14 V 22 A 20 6 0 0 0 48 22 V 14" />
      <ellipse cx="28" cy="32" rx="20" ry="6" fill="#e8f1ea" />
      <path d="M 8 32 V 40 A 20 6 0 0 0 48 40 V 32" />
    </g>
    <text x="560" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="560" dy="0">qemu-img create</tspan>
      <tspan x="560" dy="30">-f qcow2 -b ...</tspan>
      <tspan x="560" dy="30">vm1.qcow2 40G</tspan>
    </text>
    <text x="560" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">
      <tspan x="560" dy="0">(thin copy-on-write</tspan>
      <tspan x="560" dy="30">overlay)</tspan>
    </text>
  </g>

  
  <g id="node-4">
    <rect x="400" y="450" width="320" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(532, 475)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <circle cx="28" cy="28" r="7" />
      <line x1="28" y1="6" x2="28" y2="14" />
      <line x1="28" y1="42" x2="28" y2="50" />
      <line x1="14" y1="28" x2="6" y2="28" />
      <line x1="50" y1="28" x2="42" y2="28" />
    </g>
    <text x="560" y="575" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="560" dy="0">cloud-localds</tspan>
      <tspan x="560" dy="36">seed.iso</tspan>
    </text>
  </g>

  
  <g id="node-5">
    <rect x="760" y="200" width="240" height="460" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(852, 260)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="32" rx="4" />
      <line x1="28" y1="40" x2="28" y2="48" />
      <line x1="16" y1="48" x2="40" y2="48" />
      <rect x="14" y="15" width="28" height="18" rx="2" stroke-width="3" />
      <circle cx="20" cy="24" r="2" fill="#207448" />
    </g>
    <text x="880" y="390" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="880" dy="0">virt-install</tspan>
      <tspan x="880" dy="45">--name vm1</tspan>
      <tspan x="880" dy="45">--import</tspan>
    </text>
  </g>

  
  <g id="node-6">
    <rect x="1040" y="200" width="240" height="460" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1132, 260)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10" />
      <path d="M 28 6 V 12 M 28 44 V 50 M 6 28 H 12 M 44 28 H 50 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
      <path d="M 24 22 L 34 28 L 24 34 Z" fill="#207448" stroke="none" />
    </g>
    <text x="1160" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1160" dy="0">first boot</tspan>
      <tspan x="1160" dy="40">cloud-init</tspan>
      <tspan x="1160" dy="40">configures</tspan>
      <tspan x="1160" dy="40">the instance</tspan>
    </text>
  </g>

  
  <g id="node-7">
    <rect x="1320" y="180" width="240" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1412, 205)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="12" width="40" height="26" rx="4" />
      <rect x="13" y="20" width="8" height="10" rx="1" />
      <rect x="24" y="20" width="8" height="10" rx="1" />
      <rect x="35" y="20" width="8" height="10" rx="1" />
      <line x1="17" y1="30" x2="17" y2="44" />
      <line x1="28" y1="30" x2="28" y2="44" />
      <line x1="39" y1="30" x2="39" y2="44" />
      <line x1="10" y1="44" x2="46" y2="44" />
    </g>
    <text x="1440" y="300" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1440" dy="0">virsh</tspan>
      <tspan x="1440" dy="38">domifaddr vm1</tspan>
    </text>
  </g>

  
  <g id="node-8">
    <rect x="1320" y="450" width="240" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1412, 475)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="36" rx="5" />
      <line x1="6" y1="18" x2="50" y2="18" />
      <circle cx="12" cy="13" r="1.5" fill="#207448" />
      <circle cx="17" cy="13" r="1.5" fill="#207448" />
      <path d="M 14 26 L 22 31 L 14 36" />
      <line x1="26" y1="36" x2="36" y2="36" />
    </g>
    <text x="1440" y="570" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1440" dy="0">ssh</tspan>
      <tspan x="1440" dy="38">ubuntu@&lt;ip&gt;</tspan>
    </text>
  </g>

  
  <g id="orange-note">
    <rect x="40" y="730" width="1520" height="130" rx="16" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(85, 767)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="20" />
      <polyline points="28 16 28 28 36 28" />
      <path d="M 4 18 H 8 M 2 28 H 6 M 4 38 H 8" />
    </g>
    <text x="820" y="805" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">no installer runs, which is why a new VM takes seconds</text>
  </g>
</svg>