<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>enable, start, disable, mask, reload, restart and daemon-reload are different jobs</title>
  <desc>Visual comparison of systemd unit lifecycle commands, boot behavior, masking, configuration reloading, and restart workflows.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">enable, start, disable, mask, reload, restart</tspan>
    <tspan x="800" dy="56">and daemon-reload are different jobs</tspan>
  </text>

  
  <rect x="40" y="160" width="740" height="840" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(68, 182)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="115 35" stroke-dashoffset="18" />
    <line x1="28" y1="4" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="136" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="136" dy="0">Does it start now,</tspan>
    <tspan x="136" dy="36">and does it start at boot?</tspan>
  </text>

  
  <rect x="64" y="265" width="692" height="42" rx="8" fill="#d2e5d6" />
  <text x="576" y="295" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">now</text>
  <text x="696" y="295" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">at boot</text>

  
  <rect x="64" y="315" width="692" height="66" rx="8" fill="#ffffff" stroke="#c3d8c7" stroke-width="1.5" />
  <text x="84" y="357" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">systemctl start NAME</text>
  <rect x="538" y="329" width="76" height="38" rx="6" fill="#e1f3e7" stroke="#207448" stroke-width="2" />
  <text x="576" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  <rect x="658" y="329" width="76" height="38" rx="6" fill="#f0f3f1" stroke="#a0aba5" stroke-width="1.5" />
  <text x="696" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#55605b">no</text>

  
  <rect x="64" y="389" width="692" height="132" rx="8" fill="#ffffff" stroke="#c3d8c7" stroke-width="1.5" />
  <text x="84" y="423" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">systemctl enable NAME</text>
  <text x="84" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55605b">
    <tspan x="84" dy="0">(creates symlinks in a .wants</tspan>
    <tspan x="84" dy="28">or .requires directory of the</tspan>
    <tspan x="84" dy="28">target named in [Install])</tspan>
  </text>
  <rect x="538" y="436" width="76" height="38" rx="6" fill="#f0f3f1" stroke="#a0aba5" stroke-width="1.5" />
  <text x="576" y="463" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#55605b">no</text>
  <rect x="658" y="436" width="76" height="38" rx="6" fill="#e1f3e7" stroke="#207448" stroke-width="2" />
  <text x="696" y="463" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <rect x="64" y="529" width="692" height="66" rx="8" fill="#ffffff" stroke="#c3d8c7" stroke-width="1.5" />
  <text x="84" y="571" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">systemctl enable --now NAME</text>
  <rect x="538" y="543" width="76" height="38" rx="6" fill="#e1f3e7" stroke="#207448" stroke-width="2" />
  <text x="576" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  <rect x="658" y="543" width="76" height="38" rx="6" fill="#e1f3e7" stroke="#207448" stroke-width="2" />
  <text x="696" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <rect x="64" y="603" width="692" height="114" rx="8" fill="#ffffff" stroke="#c3d8c7" stroke-width="1.5" />
  <text x="84" y="637" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">systemctl disable NAME</text>
  <text x="84" y="669" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55605b">
    <tspan x="84" dy="0">removes the boot links</tspan>
    <tspan x="84" dy="28">but does not stop the unit</tspan>
  </text>
  <rect x="538" y="641" width="76" height="38" rx="6" fill="#f0f3f1" stroke="#a0aba5" stroke-width="1.5" />
  <text x="576" y="668" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#55605b">no</text>
  <rect x="658" y="641" width="76" height="38" rx="6" fill="#f0f3f1" stroke="#a0aba5" stroke-width="1.5" />
  <text x="696" y="668" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#55605b">no</text>

  
  <rect x="64" y="727" width="692" height="126" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <g transform="translate(80, 763)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#db8129" stroke-width="3.5" />
    <line x1="9" y1="9" x2="41" y2="41" stroke="#db8129" stroke-width="3.5" />
  </g>
  <text x="140" y="763" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" dy="0" font-family="monospace" font-weight="bold">mask NAME: link to /dev/null,</tspan>
    <tspan x="140" dy="30">nothing can start it, even by dependency</tspan>
    <tspan x="140" dy="30">(useful for ctrl-alt-del.target)</tspan>
  </text>

  
  <rect x="64" y="863" width="692" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
  <g transform="translate(80, 898)">
    <rect x="5" y="5" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="15" y1="18" x2="35" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="26" x2="35" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="34" x2="27" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="140" y="899" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" dy="0" font-weight="bold">A unit with no [Install] section is static:</tspan>
    <tspan x="140" dy="30">start by hand or through a dependency,</tspan>
    <tspan x="140" dy="30">cannot be enabled</tspan>
  </text>

  
  <rect x="820" y="160" width="740" height="840" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(848, 182)">
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 15 L 45 11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="918" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Three similar commands</text>

  
  <rect x="844" y="265" width="692" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(864, 305)">
    <path d="M 42 25 A 18 18 0 1 1 35 12" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <polyline points="35,4 37,14 27,15" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="936" y="321" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="936" dy="0" font-family="monospace" font-size="25" font-weight="bold">reload: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif">the service re-reads its own</tspan>
    <tspan x="936" dy="34">configuration through ExecReload=</tspan>
  </text>

  
  <rect x="844" y="411" width="692" height="116" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(864, 444)">
    <path d="M 25 8 A 18 18 0 1 1 8 25" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <polyline points="18,8 26,8 26,16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="20" y="20" width="10" height="10" fill="#207448" />
  </g>
  <text x="936" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="936" dy="0" font-family="monospace" font-size="25" font-weight="bold">restart: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif">stop the service</tspan>
    <tspan x="936" dy="34">and start it again</tspan>
  </text>

  
  <rect x="844" y="543" width="692" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(864, 583)">
    <path d="M 10 6 L 32 6 L 40 14 L 40 44 L 10 44 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <polyline points="32,6 32,14 40,14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 20 28 A 6 6 0 1 1 28 32" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="936" y="597" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="936" dy="0" font-family="monospace" font-size="25" font-weight="bold">daemon-reload: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif">systemd re-reads</tspan>
    <tspan x="936" dy="34">the unit files; does NOT restart units</tspan>
  </text>

  
  <rect x="844" y="691" width="692" height="292" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1190" y="744" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="1190" dy="0">after editing a unit:</tspan>
    <tspan x="1190" dy="38">daemon-reload, then restart</tspan>
  </text>

  
  <g transform="translate(0, 30)">
    
    <circle cx="940" cy="855" r="24" fill="#207448" />
    <text x="940" y="863" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

    
    <line x1="964" y1="855" x2="1416" y2="855" stroke="#207448" stroke-width="5" marker-end="url(#arrow)" />

    
    <circle cx="1440" cy="855" r="24" fill="#207448" />
    <text x="1440" y="863" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  </g>

  
  <rect x="40" y="1025" width="1520" height="70" rx="12" fill="#207448" />
  <text x="800" y="1069" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Enabling and starting are two different steps</text>
</svg>