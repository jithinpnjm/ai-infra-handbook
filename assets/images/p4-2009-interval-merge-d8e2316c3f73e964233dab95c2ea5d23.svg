<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Interval Merging Sweep and the Nested Interval Trap</title>
  <desc>Visual infographic contrasting buggy vs correct interval merging logic alongside a free slots sweep timeline.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1500" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Interval Merging Sweep and the Nested Interval Trap</text>

  
  
  
  <rect x="50" y="105" width="1500" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 125)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="12" y1="20" x2="44" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="36" x2="38" y2="36" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="145" y="150" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Interval Merging and the nested trap</text>
  <text x="145" y="185" font-family="sans-serif" font-size="24" fill="#303a36">Timeline with intervals sorted by start time</text>

  
  <line x1="100" y1="225" x2="1450" y2="225" stroke="#303a36" stroke-width="3" stroke-linecap="round" />

  
  <g font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    
    <line x1="120" y1="220" x2="120" y2="230" stroke="#303a36" stroke-width="2" />
    <text x="120" y="215">0</text>
    
    <line x1="220" y1="220" x2="220" y2="230" stroke="#303a36" stroke-width="2" />
    <text x="220" y="215">1</text>
    
    <line x1="320" y1="220" x2="320" y2="230" stroke="#303a36" stroke-width="2" />
    <text x="320" y="215">2</text>
    
    <line x1="420" y1="220" x2="420" y2="230" stroke="#303a36" stroke-width="2" />
    <text x="420" y="215">3</text>
    
    <line x1="1120" y1="220" x2="1120" y2="230" stroke="#303a36" stroke-width="2" />
    <text x="1120" y="215">10</text>
    
    <line x1="1320" y1="220" x2="1320" y2="230" stroke="#303a36" stroke-width="2" />
    <text x="1320" y="215">12</text>
  </g>

  
  <rect x="220" y="242" width="900" height="42" rx="8" fill="#207448" />
  <text x="670" y="271" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Interval 1 from 1 to 10</text>

  
  <rect x="320" y="295" width="100" height="42" rx="6" fill="#db8129" />
  <text x="370" y="324" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[2,3]</text>

  <rect x="435" y="295" width="790" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="455" y="325" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Interval 2 from 2 to 3 sitting entirely inside Interval 1</text>

  
  <rect x="1120" y="242" width="200" height="42" rx="8" fill="#207448" stroke="#ffffff" stroke-width="2" />
  <text x="1220" y="271" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[10,12]</text>

  
  <rect x="80" y="352" width="1440" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="105" y="386" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Interval 3 from 10 to 12 touching at boundary 10, extending the merged interval to [1, 12]</text>

  
  <rect x="80" y="422" width="1440" height="152" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <circle cx="115" cy="460" r="18" fill="#db8129" />
  <text x="115" y="468" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="145" y="468" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">buggy update out[-1][1] = e</text>
  <text x="145" y="508" font-family="sans-serif" font-size="24" fill="#303a36">incorrectly shrinks the merged interval to [1, 3]</text>
  
  <rect x="145" y="525" width="200" height="26" rx="4" fill="#db8129" />
  <text x="245" y="544" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[1, 3]</text>
  <rect x="350" y="525" width="690" height="26" rx="4" fill="#f5f8f5" stroke="#db8129" stroke-width="2" stroke-dasharray="6,4" />
  <text x="695" y="545" font-family="sans-serif" font-size="24" fill="#db8129" text-anchor="middle">lost boundary 10</text>

  
  <rect x="80" y="590" width="1440" height="152" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="628" r="18" fill="#207448" />
  <text x="115" y="636" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="145" y="636" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">correct logic out[-1][1] = max(out[-1][1], e)</text>
  <text x="145" y="676" font-family="sans-serif" font-size="24" fill="#303a36">preserves the right boundary at 10</text>
  
  <rect x="145" y="693" width="895" height="26" rx="4" fill="#207448" />
  <text x="592" y="712" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[1, 10] preserved</text>


  
  
  
  <rect x="50" y="790" width="1500" height="675" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 810)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="145" y="835" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Free Slots Sweep</text>
  <text x="145" y="870" font-family="sans-serif" font-size="24" fill="#303a36">Day timeline from day_start=0 to day_end=12 with busy blocks [1, 5] and [8, 10]</text>

  
  <line x1="120" y1="910" x2="1320" y2="910" stroke="#303a36" stroke-width="3" stroke-linecap="round" />

  
  
  <rect x="220" y="890" width="400" height="40" rx="6" fill="#303a36" />
  <text x="420" y="918" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">busy [1, 5]</text>

  
  <rect x="920" y="890" width="200" height="40" rx="6" fill="#303a36" />
  <text x="1020" y="918" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">busy [8, 10]</text>

  
  <g font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <text x="120" y="955">0</text>
    <text x="220" y="955">1</text>
    <text x="620" y="955">5</text>
    <text x="920" y="955">8</text>
    <text x="1120" y="955">10</text>
    <text x="1320" y="955">12</text>
  </g>

  
  <rect x="80" y="975" width="1440" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="1010" r="18" fill="#207448" />
  <text x="115" y="1018" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="145" y="990" width="295" height="44" rx="8" fill="#e8f1ea" />
  <text x="160" y="1020" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Cursor starting at 0</text>

  <line x1="445" y1="1012" x2="495" y2="1012" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <rect x="510" y="990" width="320" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="525" y="1020" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">First gap emitted (0, 1)</text>

  <line x1="835" y1="1012" x2="885" y2="1012" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <rect x="900" y="990" width="530" height="44" rx="8" fill="#e8f1ea" />
  <text x="915" y="1020" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Cursor advances to max(cursor, e)=5</text>

  
  <rect x="145" y="1050" width="100" height="30" rx="4" fill="#207448" />
  <text x="195" y="1073" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">gap (0,1)</text>
  <rect x="250" y="1050" width="400" height="30" rx="4" fill="#303a36" />
  <text x="450" y="1073" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">busy [1, 5] skipped to end 5</text>

  
  <rect x="80" y="1135" width="1440" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="1170" r="18" fill="#207448" />
  <text x="115" y="1178" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <rect x="145" y="1150" width="875" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="160" y="1180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Second gap emitted (5, 8) as next start s=8 is greater than cursor 5</text>

  <line x1="1025" y1="1172" x2="1075" y2="1172" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <rect x="1090" y="1150" width="310" height="44" rx="8" fill="#e8f1ea" />
  <text x="1105" y="1180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Cursor advances to 10</text>

  
  <rect x="145" y="1210" width="300" height="30" rx="4" fill="#207448" />
  <text x="295" y="1233" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">gap (5,8)</text>
  <rect x="450" y="1210" width="200" height="30" rx="4" fill="#303a36" />
  <text x="550" y="1233" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">busy [8, 10] skipped</text>

  
  <rect x="80" y="1305" width="1440" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="1340" r="18" fill="#207448" />
  <text x="115" y="1348" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <rect x="145" y="1320" width="750" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="160" y="1350" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Trailing gap emitted (10, 12) before reaching day_end</text>

  
  <rect x="145" y="1380" width="200" height="30" rx="4" fill="#207448" />
  <text x="245" y="1403" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">gap (10,12)</text>
  <line x1="355" y1="1375" x2="355" y2="1415" stroke="#303a36" stroke-width="3" stroke-linecap="round" />
  <text x="370" y="1403" font-family="sans-serif" font-size="24" fill="#303a36">day_end reached</text>
</svg>