<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading what the kernel is enforcing for a container</title>
  <desc>Infographic comparing kernel inspection commands to what they prove for container runtime enforcement.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Reading what the kernel is enforcing for a container</text>

  
  
  <g transform="translate(50, 147)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="30" height="30" rx="6" />
    <rect x="22" y="20" width="30" height="30" rx="6" />
    <circle cx="19" cy="21" r="3" fill="#207448" />
    <circle cx="37" cy="35" r="3" fill="#207448" />
  </g>
  
  <rect x="125" y="120" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="175" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">ls -l /proc/PID/ns</text>
  
  <line x1="680" y1="175" x2="770" y2="175" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="120" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="147" font-family="sans-serif" font-size="24" fill="#303a36" dominant-baseline="central">
    <tspan x="794" dy="0">compare inodes with the pause container: net, ipc,</tspan>
    <tspan x="794" dy="28">uts shared; pid and mnt differ</tspan>
    <tspan x="794" dy="28">unless shareProcessNamespace</tspan>
  </text>

  
  
  <g transform="translate(50, 271)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="4" width="16" height="14" rx="3" />
    <line x1="28" y1="18" x2="28" y2="30" />
    <line x1="12" y1="30" x2="44" y2="30" />
    <line x1="12" y1="30" x2="12" y2="38" />
    <line x1="44" y1="30" x2="44" y2="38" />
    <rect x="4" y="38" width="16" height="14" rx="3" />
    <rect x="36" y="38" width="16" height="14" rx="3" />
  </g>
  
  <rect x="125" y="244" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="299" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">cat /proc/PID/cgroup</text>
  
  <line x1="680" y1="299" x2="770" y2="299" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="244" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="271" font-family="monospace" font-size="24" fill="#303a36" dominant-baseline="central">
    <tspan x="794" dy="0">path kubepods.slice/kubepods-burstable.slice/</tspan>
    <tspan x="794" dy="28">kubepods-burstable-pod-uid.slice/</tspan>
    <tspan x="794" dy="28">cri-containerd-id.scope</tspan>
  </text>

  
  
  <g transform="translate(50, 395)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="16" x2="50" y2="16" />
    <circle cx="36" cy="16" r="6" fill="#e8f1ea" />
    <line x1="6" y1="32" x2="50" y2="32" />
    <circle cx="20" cy="32" r="6" fill="#e8f1ea" />
    <line x1="6" y1="48" x2="50" y2="48" />
    <circle cx="42" cy="48" r="6" fill="#e8f1ea" />
  </g>
  
  <rect x="125" y="368" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="407" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">
    <tspan x="145" dy="0">memory.max, cpu.max, cpu.weight,</tspan>
    <tspan x="145" dy="32">pids.max, memory.current</tspan>
  </text>
  
  <line x1="680" y1="423" x2="770" y2="423" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="368" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="423" font-family="sans-serif" font-size="24" fill="#303a36" dominant-baseline="central">limits and usage now</text>

  
  
  <g transform="translate(50, 519)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="32" height="32" rx="4" />
    <line x1="20" y1="4" x2="20" y2="12" />
    <line x1="28" y1="4" x2="28" y2="12" />
    <line x1="36" y1="4" x2="36" y2="12" />
    <line x1="20" y1="44" x2="20" y2="52" />
    <line x1="28" y1="44" x2="28" y2="52" />
    <line x1="36" y1="44" x2="36" y2="52" />
    <line x1="4" y1="20" x2="12" y2="20" />
    <line x1="4" y1="28" x2="12" y2="28" />
    <line x1="4" y1="36" x2="12" y2="36" />
    <line x1="44" y1="20" x2="52" y2="20" />
    <line x1="44" y1="28" x2="52" y2="28" />
    <line x1="44" y1="36" x2="52" y2="36" />
    <path d="M 18 28 L 24 28 L 28 22 L 32 34 L 38 28" />
  </g>
  
  <rect x="125" y="492" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="547" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">cpu.stat nr_throttled</text>
  
  <line x1="680" y1="547" x2="770" y2="547" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="492" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="547" font-family="sans-serif" font-size="24" fill="#303a36" dominant-baseline="central">CPU throttling</text>

  
  
  <g transform="translate(50, 643)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="16" width="44" height="24" rx="3" />
    <line x1="12" y1="40" x2="12" y2="46" />
    <line x1="20" y1="40" x2="20" y2="46" />
    <line x1="36" y1="40" x2="36" y2="46" />
    <line x1="44" y1="40" x2="44" y2="46" />
    <line x1="28" y1="21" x2="28" y2="29" />
    <circle cx="28" cy="34" r="1.5" fill="#db8129" />
  </g>
  
  <rect x="125" y="616" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="671" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">memory.events oom and oom_kill</text>
  
  <line x1="680" y1="671" x2="770" y2="671" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <rect x="770" y="616" width="780" height="110" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="794" y="671" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" dominant-baseline="central">OOM kills</text>

  
  
  <g transform="translate(50, 767)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 14 C 48 34 28 48 28 50 C 28 48 8 34 8 14 Z" />
    <circle cx="28" cy="24" r="4" />
    <line x1="28" y1="28" x2="28" y2="36" />
  </g>
  
  <rect x="125" y="740" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="779" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">
    <tspan x="145" dy="0">grep Cap, NoNewPrivs, Seccomp</tspan>
    <tspan x="145" dy="32">/proc/PID/status</tspan>
  </text>
  
  <line x1="680" y1="795" x2="770" y2="795" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="740" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="795" font-family="sans-serif" font-size="24" fill="#303a36" dominant-baseline="central">capabilities and seccomp</text>

  
  
  <g transform="translate(50, 891)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="14" rx="22" ry="7" />
    <path d="M 6 14 v 13 c 0 3.8 9.8 7 22 7 s 22 -3.2 22 -7 v -13" />
    <path d="M 6 27 v 13 c 0 3.8 9.8 7 22 7 s 22 -3.2 22 -7 v -13" />
  </g>
  
  <rect x="125" y="864" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="919" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">mountinfo</text>
  
  <line x1="680" y1="919" x2="770" y2="919" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="864" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="919" font-family="sans-serif" font-size="24" fill="#303a36" dominant-baseline="central">overlay root, volume binds, /dev/shm tmpfs</text>

  
  
  <g transform="translate(50, 1015)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="34" rx="3" />
    <circle cx="28" cy="25" r="11" />
    <path d="M 28 14 v 22 M 17 25 h 22" />
    <line x1="12" y1="42" x2="32" y2="42" stroke-width="5" />
    <line x1="4" y1="12" x2="4" y2="48" />
  </g>
  
  <rect x="125" y="988" width="555" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="1043" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" dominant-baseline="central">ls /proc/PID/root/dev/nvidia*</text>
  
  <line x1="680" y1="1043" x2="770" y2="1043" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="770" y="988" width="780" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="794" y="1043" font-family="sans-serif" font-size="24" fill="#303a36" dominant-baseline="central">GPU device nodes injected</text>

  
  <rect x="50" y="1118" width="1500" height="64" rx="8" fill="#207448" />
  <text x="800" y="1150" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">If Kubernetes reports one thing and the kernel shows another, trust the kernel</text>
</svg>