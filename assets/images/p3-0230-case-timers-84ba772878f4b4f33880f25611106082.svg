<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Exact-length outages are timers: find the timer</title>
  <desc>Case 6 BGP route dampening: the management network goes down for exactly five minutes, repeating at random; a failing transceiver flaps a link every few seconds; the host's FRR advertises then withdraws a route; the spine applies route-flap dampening and suppresses the route for a penalty period; each flap adds a penalty, past a threshold the route stays suppressed even after the link is stable with fix: DOM showed bad Rx power so replace the optic; keep dampening, it protects the control plane. Case 13 DNS 5-second delays: occasional 5-second latency on external calls; A and AAAA queries leave from one source port in parallel; conntrack and NAT race the two and one is dropped; the stub resolver waits out its default 5-second timeout; ndots:5 multiplies the queries with fix: single-request-reopen, NodeLocal DNSCache, lower ndots, newer kernel (chapter 2.8). Case 10 TCP zero window: a transfer stalls for 5 to 10 seconds, then resumes; capture shows TCP Window Size: 0 from the receiver; the receiving application is not reading fast enough, disk or CPU; the network is fine with fix: the receiver's I/O, CPU or buffering. A middle column 'timer in play: dampening penalty, stub resolver timeout, window probes until the application reads again'. Bottom bar: 'An exact N-second delay is a timer, so match it to a default'.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1500" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Exact-length outages are timers: find the timer</text>

  
  <text x="420" y="152" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">INCIDENT &amp; SYMPTOM</text>
  
  
  <rect x="860" y="122" width="250" height="44" rx="22" fill="#db8129" />
  <text x="985" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">timer in play</text>

  <text x="1365" y="152" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">ROOT CAUSE &amp; FIX</text>

  
  
  <rect x="50" y="180" width="740" height="360" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 198)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="8" width="44" height="28" rx="4" />
    <circle cx="16" cy="22" r="3" fill="#207448" />
    <circle cx="26" cy="22" r="3" fill="#207448" />
    <circle cx="36" cy="22" r="3" fill="#207448" />
    <path d="M 12 36 L 4 48 M 40 36 L 48 48" />
  </g>
  <text x="140" y="232" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Case 6 BGP route dampening:</text>
  <text x="75" y="272" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">the management network goes down for exactly</tspan>
    <tspan x="75" dy="32">five minutes, repeating at random; a failing transceiver</tspan>
    <tspan x="75" dy="32">flaps a link every few seconds; the host's FRR</tspan>
    <tspan x="75" dy="32">advertises then withdraws a route; the spine</tspan>
    <tspan x="75" dy="32">applies route-flap dampening and suppresses</tspan>
    <tspan x="75" dy="32">the route for a penalty period; each flap adds a</tspan>
    <tspan x="75" dy="32">penalty, past a threshold the route stays</tspan>
    <tspan x="75" dy="32">suppressed even after the link is stable</tspan>
  </text>

  
  <rect x="830" y="180" width="310" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(957, 240)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="24" />
    <polyline points="28,14 28,28 38,28" stroke-linecap="round" />
    <path d="M 28 4 L 28 0 M 20 0 L 36 0" />
  </g>
  <text x="985" y="360" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">dampening penalty</text>

  
  <rect x="1180" y="180" width="370" height="360" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1205, 198)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 32 8 A 14 14 0 0 0 14 26 L 6 34 A 4 4 0 0 0 12 40 L 20 32 A 14 14 0 0 0 38 14 Z" />
  </g>
  <text x="1265" y="232" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Resolution</text>
  <text x="1205" y="285" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1205" dy="0">fix: DOM showed bad Rx</tspan>
    <tspan x="1205" dy="34">power so replace the</tspan>
    <tspan x="1205" dy="34">optic; keep dampening,</tspan>
    <tspan x="1205" dy="34">it protects the</tspan>
    <tspan x="1205" dy="34">control plane</tspan>
  </text>

  
  <line x1="790" y1="360" x2="826" y2="360" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1140" y1="360" x2="1176" y2="360" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="50" y="580" width="740" height="360" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 598)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" />
    <ellipse cx="28" cy="28" rx="10" ry="22" />
    <line x1="6" y1="28" x2="50" y2="28" />
  </g>
  <text x="140" y="632" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Case 13 DNS 5-second delays:</text>
  <text x="75" y="682" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">occasional 5-second latency on external calls;</tspan>
    <tspan x="75" dy="36">A and AAAA queries leave from one source</tspan>
    <tspan x="75" dy="36">port in parallel; conntrack and NAT race</tspan>
    <tspan x="75" dy="36">the two and one is dropped; the stub resolver</tspan>
    <tspan x="75" dy="36">waits out its default 5-second timeout;</tspan>
    <tspan x="75" dy="36">ndots:5 multiplies the queries</tspan>
  </text>

  
  <rect x="830" y="580" width="310" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(957, 640)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="24" />
    <polyline points="28,14 28,28 38,28" stroke-linecap="round" />
    <path d="M 28 4 L 28 0 M 20 0 L 36 0" />
  </g>
  <text x="985" y="750" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">stub resolver timeout</text>

  
  <rect x="1180" y="580" width="370" height="360" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1205, 598)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="10" />
    <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
  </g>
  <text x="1265" y="632" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Resolution</text>
  <text x="1205" y="690" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1205" dy="0">fix: single-request-reopen,</tspan>
    <tspan x="1205" dy="36">NodeLocal DNSCache,</tspan>
    <tspan x="1205" dy="36">lower ndots, newer</tspan>
    <tspan x="1205" dy="36">kernel (chapter 2.8)</tspan>
  </text>

  
  <line x1="790" y1="760" x2="826" y2="760" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1140" y1="760" x2="1176" y2="760" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="50" y="980" width="740" height="360" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 998)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="46" height="38" rx="4" />
    <line x1="4" y1="18" x2="50" y2="18" />
    <circle cx="12" cy="12" r="2" fill="#207448" />
    <circle cx="18" cy="12" r="2" fill="#207448" />
  </g>
  <text x="140" y="1032" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Case 10 TCP zero window:</text>
  <text x="75" y="1082" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">a transfer stalls for 5 to 10 seconds, then resumes;</tspan>
    <tspan x="75" dy="36">capture shows TCP Window Size: 0 from the receiver;</tspan>
    <tspan x="75" dy="36">the receiving application is not reading fast enough,</tspan>
    <tspan x="75" dy="36">disk or CPU; the network is fine</tspan>
  </text>

  
  <rect x="830" y="980" width="310" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(957, 1030)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="24" />
    <polyline points="28,14 28,28 38,28" stroke-linecap="round" />
    <path d="M 28 4 L 28 0 M 20 0 L 36 0" />
  </g>
  <text x="985" y="1135" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="985" dy="0">window probes until</tspan>
    <tspan x="985" dy="34">the application</tspan>
    <tspan x="985" dy="34">reads again</tspan>
  </text>

  
  <rect x="1180" y="980" width="370" height="360" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1205, 998)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="10" y="10" width="34" height="34" rx="3" />
    <line x1="18" y1="2" x2="18" y2="10" /><line x1="28" y1="2" x2="28" y2="10" /><line x1="38" y1="2" x2="38" y2="10" />
    <line x1="18" y1="44" x2="18" y2="52" /><line x1="28" y1="44" x2="28" y2="52" /><line x1="38" y1="44" x2="38" y2="52" />
    <line x1="2" y1="18" x2="10" y2="18" /><line x1="2" y1="28" x2="10" y2="28" /><line x1="2" y1="38" x2="10" y2="38" />
    <line x1="44" y1="18" x2="52" y2="18" /><line x1="44" y1="28" x2="52" y2="28" /><line x1="44" y1="38" x2="52" y2="38" />
  </g>
  <text x="1265" y="1032" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Resolution</text>
  <text x="1205" y="1105" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1205" dy="0">fix: the receiver's I/O,</tspan>
    <tspan x="1205" dy="38">CPU or buffering</tspan>
  </text>

  
  <line x1="790" y1="1160" x2="826" y2="1160" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1140" y1="1160" x2="1176" y2="1160" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="50" y="1380" width="1500" height="80" rx="14" fill="#207448" />
  <text x="800" y="1430" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">An exact N-second delay is a timer, so match it to a default</text>
</svg>