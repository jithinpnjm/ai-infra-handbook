<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A module is an API: inputs, outputs and two repositories</title>
  <desc>Visual explanation of Terraform cluster module API inputs, validation, internal resources, outputs, and two-repository promotion workflow.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A module is an API: inputs, outputs and two repositories</text>

  
  
  
  <g id="left-panel">
    
    <rect x="40" y="105" width="850" height="960" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(70, 130)">
      
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 28 L 44 28 M 28 12 L 28 44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <text x="76" y="40" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">cluster module</text>
    </g>

    
    <g transform="translate(65, 205)">
      
      <rect x="0" y="0" width="800" height="260" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      
      <g transform="translate(20, 16)">
        <circle cx="20" cy="18" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 12 18 L 26 18 M 20 12 L 26 18 L 20 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="50" y="27" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Inputs in</text>
      </g>

      
      <text x="30" y="95" font-family="monospace" font-size="24" fill="#303a36">• name</text>
      <text x="30" y="132" font-family="monospace" font-size="24" fill="#303a36">• parent_id (project)</text>
      <text x="30" y="169" font-family="monospace" font-size="24" fill="#303a36">• subnet_id</text>
      <text x="30" y="206" font-family="monospace" font-size="24" fill="#303a36">• pinned k8s_version</text>

      <text x="30" y="242" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="monospace">• node_pools</tspan> as a map whose key is a short stable name such as gpu
      </text>
    </g>

    
    <g transform="translate(65, 480)">
      <rect x="0" y="0" width="800" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      
      <g transform="translate(20, 14)">
        <circle cx="20" cy="18" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 13 11 L 27 25 M 27 11 L 13 25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <text x="50" y="26" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">validation rejects</text>
      </g>

      <text x="30" y="78" font-family="sans-serif" font-size="24" fill="#303a36">• a floating version (for example latest)</text>
      <text x="30" y="109" font-family="sans-serif" font-size="24" fill="#303a36">• a pool with both fixed size and autoscaling</text>
      <text x="30" y="140" font-family="sans-serif" font-size="24" fill="#303a36">• an upgrade strategy with max_unavailable 0 and max_surge 0</text>
    </g>

    
    <g transform="translate(65, 645)">
      <rect x="0" y="0" width="800" height="185" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(20, 14)">
        <circle cx="20" cy="18" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 20 8 L 20 28 M 10 18 L 30 18 M 13 11 L 27 25 M 13 25 L 27 11" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
        <text x="50" y="26" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Inside</text>
      </g>

      
      <text x="30" y="78" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="monospace">nebius_mk8s_v1_cluster this</tspan> with prevent_destroy
      </text>

      
      <text x="30" y="120" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="30" dy="0" font-family="monospace">nebius_mk8s_v1_node_group pool</tspan>
        <tspan> with for_each over node_pools so each pool</tspan>
        <tspan x="30" dy="34">has a stable address </tspan>
        <tspan font-family="monospace">pool[gpu]</tspan>
      </text>
    </g>

    
    <g transform="translate(65, 845)">
      <rect x="0" y="0" width="800" height="200" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(20, 14)">
        <circle cx="20" cy="18" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 14 18 L 28 18 M 22 12 L 28 18 L 22 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="50" y="26" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Outputs out</text>
      </g>

      <text x="30" y="75" font-family="monospace" font-size="24" fill="#303a36">• cluster_id</text>
      <text x="300" y="75" font-family="monospace" font-size="24" fill="#303a36">• node_group_ids</text>

      
      <rect x="25" y="96" width="750" height="88" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="40" y="132" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="40" dy="0">renaming an output is a breaking change for every stack</tspan>
        <tspan x="40" dy="32">that reads it, like changing a function signature</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g id="right-panel">
    
    <rect x="920" y="105" width="640" height="960" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(950, 130)">
      
      <rect x="0" y="8" width="36" height="44" rx="5" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="0" width="36" height="44" rx="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
      <circle cx="36" cy="22" r="5" fill="#207448" />
      <text x="76" y="40" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">two repositories</text>
    </g>

    
    <g transform="translate(945, 205)">
      <rect x="0" y="0" width="590" height="225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
        <path d="M 12 18 L 44 18 M 12 28 L 36 28 M 12 38 L 40 38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      
      <text x="100" y="58" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">modules repository</text>
      
      <text x="24" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">modules repository holds blueprints,</tspan>
        <tspan x="24" dy="36">versioned and pinned</tspan>
      </text>
    </g>

    
    <g transform="translate(1240, 435)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    </g>

    
    <g transform="translate(945, 485)">
      <rect x="0" y="0" width="590" height="280" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(24, 24)">
        <path d="M 28 6 L 4 26 L 10 26 L 10 50 L 46 50 L 46 26 L 52 26 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
        <rect x="22" y="30" width="12" height="20" fill="none" stroke="#207448" stroke-width="3" />
      </g>

      <text x="100" y="58" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">live repository</text>

      <text x="24" y="122" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">live repository holds the houses built from</tspan>
        <tspan x="24" dy="34">them: staging pins one module version,</tspan>
        <tspan x="24" dy="34">production pins another, so a change</tspan>
        <tspan x="24" dy="34">is seen in staging first</tspan>
      </text>
    </g>

    
    <g transform="translate(945, 785)">
      <rect x="0" y="0" width="590" height="260" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />

      
      <g transform="translate(24, 22)">
        <polygon points="28,4 54,50 2,50" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
        <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
        <circle cx="28" cy="42" r="2.5" fill="#db8129" />
      </g>

      <text x="100" y="58" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">Warning</text>

      <text x="24" y="120" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">if staging and production point at the</tspan>
        <tspan x="24" dy="34">same module folder, a change lands</tspan>
        <tspan x="24" dy="34">in both on the next apply</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g id="bottom-takeaway" transform="translate(40, 1085)">
    <rect x="0" y="0" width="1520" height="85" rx="14" fill="#207448" />

    
    <g transform="translate(28, 16)">
      <circle cx="26" cy="26" r="24" fill="#ffffff" />
      <path d="M 16 26 L 23 33 L 36 19" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="96" y="52" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      <tspan fill="#ffffff">Rule: </tspan>
      <tspan font-weight="normal">expose pools as data, keep the module small, pin every module and provider version</tspan>
    </text>
  </g>
</svg>