<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Module families for a GPU node: where to look for each job</title>
  <desc>A reference infographic mapping Ansible module families to specific modules and best-practice notes for GPU node administration.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Module families for a GPU node: where to look for each job</text>

  
  <g transform="translate(40, 95)">
    <rect width="1520" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 28 29 A 9 9 0 1 1 28 28.9 M 35 36 L 44 45" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="38" font-family="monospace" font-size="24" fill="#303a36">ansible-doc -l | grep -i topic, or the examples at the end of ansible-doc ansible.builtin.copy</text>
  </g>

  
  <g transform="translate(40, 175)">
    
    <rect x="0" y="0" width="280" height="52" rx="6" fill="#207448"/>
    <text x="24" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Family</text>

    
    <rect x="295" y="0" width="815" height="52" rx="6" fill="#207448"/>
    <text x="320" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Modules</text>

    
    <rect x="1125" y="0" width="395" height="52" rx="6" fill="#207448"/>
    <text x="1150" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Note</text>
  </g>

  
  <g transform="translate(40, 242)">
    
    <rect x="0" y="0" width="280" height="204" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(112, 22)">
      <path d="M 28 4 L 52 16 L 28 28 L 4 16 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 4 16 L 4 40 L 28 52 L 28 28" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 52 16 L 52 40 L 28 52" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 16 10 L 40 22" fill="none" stroke="#db8129" stroke-width="3"/>
    </g>
    <text x="140" y="118" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Packages</text>

    
    <rect x="295" y="0" width="815" height="204" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="315" y="35" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="315" dy="0">ansible.builtin.package generic; apt, dnf or yum,</tspan>
      <tspan x="315" dy="33">zypper backend-specific (update_cache, cache_valid_time,</tspan>
      <tspan x="315" dy="33">autoremove, install_recommends, lock_timeout, allow_downgrade);</tspan>
      <tspan x="315" dy="33">apt_repository, deb822_repository, yum_repository, apt_key</tspan>
      <tspan x="315" dy="33">(deprecated, use keyrings with get_url); pip with virtualenv</tspan>
      <tspan x="315" dy="33">and pinned versions; dpkg_selections, package_facts</tspan>
    </text>

    
    <rect x="1125" y="0" width="395" height="204" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="1145" y="35" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1145" dy="0">package names often differ</tspan>
      <tspan x="1145" dy="33">between distros: use when</tspan>
      <tspan x="1145" dy="33">or vars per OS family; add</tspan>
      <tspan x="1145" dy="33">NVIDIA CUDA, Docker,</tspan>
      <tspan x="1145" dy="33">Kubernetes repositories with</tspan>
      <tspan x="1145" dy="33">signed-by keyrings</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 462)">
    
    <rect x="0" y="0" width="280" height="236" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(112, 38)">
      <path d="M 8 4 L 34 4 L 48 18 L 48 52 L 8 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 34 4 L 34 18 L 48 18" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="38" x2="36" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Files</text>

    
    <rect x="295" y="0" width="815" height="236" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="315" y="35" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="315" dy="0">file (file, directory, link, absent, touch; owner,</tspan>
      <tspan x="315" dy="32">group, mode, recurse), copy (backup, validate, force,</tspan>
      <tspan x="315" dy="32">remote_src), template, lineinfile (regexp, backrefs: a regex</tspan>
      <tspan x="315" dy="32">can match several lines or none), blockinfile, replace,</tspan>
      <tspan x="315" dy="32">stat, find, fetch, synchronize (rsync), unarchive,</tspan>
      <tspan x="315" dy="32">get_url (checksum), uri, assemble (conf.d fragments),</tspan>
      <tspan x="315" dy="32">ini_file, slurp, tempfile</tspan>
    </text>

    
    <rect x="1125" y="0" width="395" height="236" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="1322" y="125" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">-</text>
  </g>

  
  <g transform="translate(40, 714)">
    
    <rect x="0" y="0" width="280" height="136" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(112, 14)">
      <circle cx="28" cy="18" r="12" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 6 48 C 6 36 16 34 28 34 C 40 34 50 36 50 48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="140" y="105" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Users</text>

    
    <rect x="295" y="0" width="815" height="136" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="315" y="38" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="315" dy="0">user, group, authorized_key (ansible.posix), known_hosts;</tspan>
      <tspan x="315" dy="34">sudo via drop-in file in /etc/sudoers.d/ better than</tspan>
      <tspan x="315" dy="34">lineinfile with validate visudo -cf</tspan>
    </text>

    
    <rect x="1125" y="0" width="395" height="136" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="1145" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1145" dy="0">loop over a data structure</tspan>
      <tspan x="1145" dy="34">instead of one task per user</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 866)">
    
    <rect x="0" y="0" width="280" height="106" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(16, 25)">
      <circle cx="28" cy="28" r="10" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 14 L 42 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="82" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Services and boot</text>

    
    <rect x="295" y="0" width="815" height="106" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="315" y="38" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="315" dy="0">service, systemd_service (daemon_reload, masked, enabled,</tspan>
      <tspan x="315" dy="34">state), reboot (reboot_timeout, test_command), wait_for,</tspan>
      <tspan x="315" dy="34">wait_for_connection</tspan>
    </text>

    
    <rect x="1125" y="0" width="395" height="106" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="1322" y="60" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">-</text>
  </g>

  
  <g transform="translate(40, 988)">
    
    <rect x="0" y="0" width="280" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(16, 29)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="4" x2="36" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="82" y="66" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Kernel and system</text>

    
    <rect x="295" y="0" width="815" height="114" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="315" y="38" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="315" dy="0">ansible.posix.sysctl, ansible.posix.mount, community.general.modprobe,</tspan>
      <tspan x="315" dy="34">kernel_blacklist, timezone, hostname, cron, ansible.posix.at,</tspan>
      <tspan x="315" dy="34">alternatives, firewalld, ufw, seboolean, selinux</tspan>
    </text>

    
    <rect x="1125" y="0" width="395" height="114" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="1322" y="65" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">-</text>
  </g>

  
  <g transform="translate(40, 1118)">
    <rect width="1520" height="52" rx="8" fill="#207448"/>
    <text x="760" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Know which drawer to open, not every tool in it</text>
  </g>
</svg>