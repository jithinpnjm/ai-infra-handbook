<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Reference Counting Deallocation versus Cyclic Garbage Collection</title>
  <desc>Comparison diagram of CPython deterministic reference counting and generational cyclic garbage collection.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#758a82" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Reference Counting Deallocation versus Cyclic Garbage Collection
  </text>

  
  
  
  <rect x="50" y="105" width="725" height="995" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="75" y="130" width="675" height="70" rx="10" fill="#207448" />
  <text x="412" y="175" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Deterministic Reference Counting (Non-Cyclic)
  </text>

  
  
  <rect x="360" y="240" width="370" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <rect x="385" y="265" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 397 265 V 257 M 421 265 V 257 M 397 313 V 321 M 421 313 V 321 M 385 277 H 377 M 385 301 H 377 M 433 277 H 441 M 433 301 H 441" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  <text x="450" y="298" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
    data = [1, 2, 3]
  </text>

  
  <rect x="385" y="340" width="320" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="545" y="382" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">
    refcount: 2
  </text>

  
  <rect x="90" y="250" width="130" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="155" y="293" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">a</text>

  
  <rect x="90" y="350" width="130" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="155" y="393" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">b</text>

  
  <line x1="220" y1="282" x2="356" y2="282" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="220" y1="382" x2="356" y2="382" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="75" y="470" width="675" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="115" cy="515" r="22" fill="#207448" />
  <text x="115" y="523" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <text x="155" y="523" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Step 1:
  </text>

  
  <rect x="250" y="490" width="130" height="48" rx="6" fill="#f5f8f5" stroke="#758a82" stroke-width="1.5" />
  <text x="315" y="524" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">del a</text>
  <line x1="240" y1="528" x2="390" y2="500" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

  <text x="115" y="585" font-family="sans-serif" font-size="24" fill="#303a36">
    Counter decrements to:
  </text>
  <rect x="380" y="555" width="220" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="490" y="589" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    refcount: 1
  </text>

  
  <rect x="75" y="650" width="675" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="115" cy="695" r="22" fill="#207448" />
  <text x="115" y="703" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <text x="155" y="703" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Step 2:
  </text>

  
  <rect x="250" y="670" width="130" height="48" rx="6" fill="#f5f8f5" stroke="#758a82" stroke-width="1.5" />
  <text x="315" y="704" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">del b</text>
  <line x1="240" y1="708" x2="390" y2="680" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

  <text x="115" y="765" font-family="sans-serif" font-size="24" fill="#303a36">
    Counter drops to:
  </text>
  <rect x="380" y="735" width="220" height="50" rx="8" fill="#fbeee4" stroke="#db8129" stroke-width="2" />
  <text x="490" y="769" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
    refcount: 0
  </text>

  
  <line x1="412" y1="805" x2="412" y2="920" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <rect x="277" y="845" width="270" height="46" rx="23" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="412" y="877" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    Immediate Free
  </text>

  
  <rect x="75" y="930" width="675" height="135" rx="12" fill="#207448" />
  
  <circle cx="130" cy="997" r="26" fill="none" stroke="#ffffff" stroke-width="3.5" />
  <path d="M 118 997 L 126 1005 L 142 989" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="175" y="1006" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    Memory reclaimed instantaneously
  </text>

  
  
  
  <rect x="825" y="105" width="725" height="995" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="850" y="130" width="675" height="70" rx="10" fill="#207448" />
  <text x="1187" y="175" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Cyclic Garbage Collection (Cycle Detector)
  </text>

  
  <rect x="865" y="235" width="180" height="85" rx="10" fill="#ffffff" stroke="#758a82" stroke-width="2" />
  <text x="955" y="272" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">
    root
  </text>
  <rect x="895" y="285" width="120" height="28" rx="4" fill="#fbeee4" />
  <text x="955" y="305" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#db8129">
    del root
  </text>
  
  <line x1="855" y1="320" x2="1055" y2="235" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />

  
  <line x1="1045" y1="280" x2="1145" y2="280" stroke="#758a82" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow-grey)" />
  <line x1="1085" y1="265" x2="1105" y2="295" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

  
  <rect x="850" y="350" width="675" height="715" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="10 8" />

  
  <rect x="880" y="375" width="615" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="925" cy="422" r="22" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 925 394 V 400 M 925 444 V 450 M 897 422 H 903 M 947 422 H 953 M 905 402 L 910 407 M 940 437 L 945 442 M 905 442 L 910 437 M 940 407 L 945 402" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="965" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    gc module
  </text>
  <text x="965" y="448" font-family="sans-serif" font-size="24" fill="#303a36">
    (generational cyclic collector)
  </text>

  
  <rect x="885" y="505" width="270" height="260" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" />
  <text x="1020" y="550" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">
    nodeA
  </text>
  
  
  <rect x="910" y="575" width="220" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1020" y="609" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
    refcount: 1
  </text>

  
  <rect x="910" y="665" width="220" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1020" y="707" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    nodeA.peer
  </text>

  
  <rect x="1225" y="505" width="270" height="260" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" />
  <text x="1360" y="550" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">
    nodeB
  </text>

  
  <rect x="1250" y="575" width="220" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1360" y="609" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
    refcount: 1
  </text>

  
  <rect x="1250" y="665" width="220" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1360" y="707" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    nodeB.peer
  </text>

  
  
  <path d="M 1130 680 C 1170 650, 1185 650, 1221 680" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <path d="M 1250 715 C 1210 745, 1195 745, 1159 715" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="880" y="805" width="615" height="225" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="925" cy="855" r="22" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="925,842 925,855 937,855" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <text x="965" y="862" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    Periodic cycle detector detects
  </text>
  <text x="965" y="912" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    unreachable group and
  </text>
  <text x="965" y="962" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    reclaims memory
  </text>

</svg>