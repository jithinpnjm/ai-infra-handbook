<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Deadlock: two locks held in opposite order, and three ways out</title>
  <desc>Visual infographic explaining deadlock wait cycles between threads, three strategies to prevent deadlock, common synchronization primitives, and runtime diagnosis tools.</desc>

  <defs>
    <marker id="arrow-orange-down" viewBox="0 0 12 12" refX="6" refY="11" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 6 10 L 10 2 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-orange-up" viewBox="0 0 12 12" refX="6" refY="1" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 10 L 6 2 L 10 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Deadlock: two locks held in opposite order, and three ways out</text>

  
  <rect x="40" y="90" width="720" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="75" y="125" width="650" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="115" cy="165" r="14" />
    <path d="M 95 210 C 95 190 135 190 135 210" />
    <rect x="135" y="165" width="22" height="18" rx="3" />
    <path d="M 140 165 V 157 A 6 6 0 0 1 152 157 V 165" />
  </g>
  <text x="180" y="175" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">thread 1 holds lock A</tspan>
    <tspan x="180" dy="36">and waits for lock B</tspan>
  </text>

  
  <line x1="620" y1="245" x2="620" y2="400" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange-down)" />
  <line x1="180" y1="415" x2="180" y2="260" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange-up)" />
  <text x="400" y="338" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">everything idle forever</text>

  
  <rect x="75" y="415" width="650" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="115" cy="455" r="14" />
    <path d="M 95 500 C 95 480 135 480 135 500" />
    <rect x="135" y="455" width="22" height="18" rx="3" />
    <path d="M 140 455 V 447 A 6 6 0 0 1 152 447 V 455" />
  </g>
  <text x="180" y="465" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">thread 2 holds lock B</tspan>
    <tspan x="180" dy="36">and waits for lock A</tspan>
  </text>

  
  <rect x="800" y="90" width="760" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="825" y="115" width="710" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="848" y="165" width="24" height="20" rx="3" />
    <path d="M 854 165 V 157 A 6 6 0 0 1 866 157 V 165" />
    <path d="M 886 160 L 898 175 L 886 190" />
  </g>
  <text x="918" y="156" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="918" dy="0" font-size="26" font-weight="bold">global lock order:</tspan>
    <tspan x="918" dy="34">always acquire A before B, so no cycle can form</tspan>
  </text>

  
  <rect x="825" y="265" width="710" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="873" cy="330" r="24" />
    <polyline points="873,316 873,330 885,330" />
    <path d="M 894 312 L 903 303" />
  </g>
  <text x="918" y="318" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="918" dy="0" font-size="26" font-weight="bold">acquire with timeouts:</tspan>
    <tspan x="918" dy="34">give up, release, retry</tspan>
  </text>

  
  <rect x="825" y="415" width="710" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 873 440 L 897 450 V 470 C 897 488 873 502 873 502 C 873 502 849 488 849 470 V 450 Z" />
    <line x1="873" y1="458" x2="873" y2="480" stroke-width="5" />
  </g>
  <text x="918" y="488" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">hold at most one lock</text>

  
  <rect x="40" y="590" width="1520" height="395" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="60" y="605" width="730" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="642" width="22" height="18" rx="2" />
    <path d="M 85 642 V 635 A 5 5 0 0 1 97 635 V 642" />
  </g>
  <text x="120" y="656" font-family="monospace" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif" font-weight="bold">Lock: </tspan>with lock:
  </text>

  
  <rect x="810" y="605" width="730" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="830" y="642" width="20" height="16" rx="2" />
    <path d="M 834 642 V 636 A 4 4 0 0 1 846 636 V 642" />
    <path d="M 855 636 A 10 10 0 1 1 855 654" />
  </g>
  <text x="875" y="656" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">RLock: </tspan>same thread may acquire repeatedly
  </text>

  
  <rect x="60" y="700" width="730" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="82" y1="725" x2="82" y2="765" />
    <polygon points="82,725 102,735 82,745" fill="#207448" />
  </g>
  <text x="120" y="751" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Event: </tspan>set, clear, wait(timeout); shutdown signals
  </text>

  
  <rect x="810" y="700" width="730" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="842" cy="742" r="14" />
    <path d="M 836 738 A 6 6 0 0 1 846 738 C 846 744 842 745 842 748" />
    <circle cx="842" cy="752" r="1" fill="#207448" />
  </g>
  <text x="875" y="751" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Condition: </tspan>wait_for(predicate) under a lock
  </text>

  
  <rect x="60" y="795" width="730" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="815" width="16" height="48" rx="4" />
    <circle cx="88" cy="827" r="3" fill="#207448" />
    <circle cx="88" cy="839" r="3" fill="#207448" />
    <circle cx="88" cy="851" r="3" fill="#207448" />
  </g>
  <text x="115" y="834" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0" font-weight="bold">Semaphore or BoundedSemaphore:</tspan>
    <tspan x="115" dy="32">limit access to N resources (connection limits)</tspan>
  </text>

  
  <rect x="810" y="795" width="730" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="845" y1="815" x2="845" y2="865" stroke-width="4" />
    <polyline points="825,830 837,840 825,850" />
    <polyline points="865,830 853,840 865,850" />
  </g>
  <text x="875" y="850" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Barrier: </tspan>rendezvous N threads
  </text>

  
  <rect x="60" y="895" width="730" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="88" cy="935" r="14" />
    <polyline points="88,927 88,935 96,935" />
  </g>
  <text x="120" y="943" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Timer: </tspan>run after a delay
  </text>

  
  <rect x="810" y="895" width="730" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="826" y="924" width="36" height="22" rx="2" />
    <line x1="838" y1="924" x2="838" y2="946" />
    <line x1="850" y1="924" x2="850" y2="946" />
  </g>
  <text x="875" y="928" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="875" dy="0">queue.Queue, LifoQueue, PriorityQueue,</tspan>
    <tspan x="875" dy="30">SimpleQueue: maxsize bounds, task_done and join</tspan>
  </text>

  
  <rect x="40" y="1005" width="1520" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="1023" width="44" height="44" rx="6" />
    <polyline points="72,1039 80,1045 72,1051" />
    <line x1="84" y1="1051" x2="94" y2="1051" />
  </g>
  <text x="125" y="1054" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">faulthandler.dump_traceback_later(60), py-spy dump, threading.enumerate(), sys._current_frames()</text>

  
  <rect x="40" y="1105" width="1520" height="70" rx="12" fill="#207448" />
  <text x="800" y="1149" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Ordering the locks removes the cycle</text>
</svg>