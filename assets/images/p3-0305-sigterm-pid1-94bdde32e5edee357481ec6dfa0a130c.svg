<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>A Kubernetes stop: SIGTERM, the grace period, SIGKILL, and Python as PID 1</title>
  <desc>Visual infographic explaining Kubernetes termination lifecycle, signal handling in Python, PID 1 nuances, and checkpointing.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#207448">
    <tspan x="60" dy="0">A Kubernetes stop: SIGTERM, the grace period,</tspan>
    <tspan x="60" dy="50">SIGKILL, and Python as PID 1</tspan>
  </text>

  
  
  
  <g id="handler-registrations">
    <rect x="60" y="150" width="1480" height="126" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="80" y="165" width="690" height="46" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5" />
    <text x="100" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">SIGTERM: Kubernetes or systemd stop</text>

    
    <rect x="80" y="217" width="690" height="46" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5" />
    <text x="100" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">SIGINT: Ctrl-C</text>

    
    <rect x="790" y="165" width="730" height="46" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5" />
    <text x="810" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">SIGHUP: reload_config() by convention</text>

    
    <rect x="790" y="217" width="730" height="46" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5" />
    <text x="810" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">SIGPIPE set to SIG_DFL: script | head ends quietly</text>
  </g>

  
  
  
  <rect x="60" y="296" width="880" height="758" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g id="timeline-step-1">
    <rect x="85" y="316" width="830" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="356" r="20" fill="#207448" />
    <text x="125" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="165" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">t0 Kubernetes sends SIGTERM</text>
    
    <g transform="translate(845, 332)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 0 35 A 30 30 0 0 1 30 5" />
      <path d="M 0 24 A 18 18 0 0 1 18 5" />
      <circle cx="2" cy="38" r="3" fill="#207448" />
    </g>
  </g>

  
  <line x1="500" y1="396" x2="500" y2="418" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="timeline-step-2">
    <rect x="85" y="420" width="830" height="152" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="460" r="20" fill="#207448" />
    <text x="125" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <text x="165" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="165" dy="0">handler runs in the main thread between bytecode instructions:</tspan>
    </text>
    <text x="165" y="496" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
      <tspan x="165" dy="0">log.warning(received SIGTERM, shutting down);</tspan>
      <tspan x="165" dy="32">stop.set()</tspan>
    </text>
    
    <g transform="translate(845, 436)" stroke="#207448" stroke-width="2.5" fill="none">
      <rect x="5" y="5" width="30" height="30" rx="4" />
      <line x1="12" y1="0" x2="12" y2="5" />
      <line x1="20" y1="0" x2="20" y2="5" />
      <line x1="28" y1="0" x2="28" y2="5" />
      <line x1="12" y1="35" x2="12" y2="40" />
      <line x1="20" y1="35" x2="20" y2="40" />
      <line x1="28" y1="35" x2="28" y2="40" />
    </g>
  </g>

  
  <line x1="500" y1="572" x2="500" y2="594" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="timeline-step-3">
    <rect x="85" y="596" width="830" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="636" r="20" fill="#207448" />
    <text x="125" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="165" y="632" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="165" dy="0">main loop: while not stop.is_set(): do_work();</tspan>
    </text>
    <text x="165" y="670" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
      <tspan x="165" dy="0">stop.wait(5) (interruptible sleep)</tspan>
    </text>
    
    <g transform="translate(845, 612)" stroke="#207448" stroke-width="2.5" fill="none">
      <path d="M 32 18 A 14 14 0 1 0 32 26" />
      <polyline points="28,10 34,18 26,18" />
    </g>
  </g>

  
  <line x1="500" y1="710" x2="500" y2="732" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="timeline-step-4">
    <rect x="85" y="734" width="830" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="774" r="20" fill="#207448" />
    <text x="125" y="782" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="165" y="782" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">finish the in-flight item, checkpoint, cleanup()</text>
    
    <g transform="translate(845, 750)" stroke="#207448" stroke-width="2.5" fill="none">
      <ellipse cx="20" cy="10" rx="16" ry="6" />
      <path d="M 4 10 v 16 c 0 3.3 7.2 6 16 6 s 16 -2.7 16 -6 v -16" />
    </g>
  </g>

  
  <line x1="500" y1="814" x2="500" y2="836" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="timeline-step-5">
    <rect x="85" y="838" width="830" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="878" r="20" fill="#207448" />
    <text x="125" y="886" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="165" y="886" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">terminationGracePeriodSeconds elapses</text>
    
    <g transform="translate(845, 854)" stroke="#207448" stroke-width="2.5" fill="none">
      <circle cx="20" cy="20" r="16" />
      <polyline points="20,10 20,20 28,24" />
    </g>
  </g>

  
  <line x1="500" y1="918" x2="500" y2="940" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <g id="timeline-step-6">
    <rect x="85" y="942" width="830" height="92" rx="8" fill="#fdf5ec" stroke="#db8129" stroke-width="2" />
    
    <circle cx="125" cy="988" r="20" fill="#db8129" />
    <text x="125" y="996" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="165" y="997" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">SIGKILL (cannot be handled)</text>
    
    <g transform="translate(845, 966)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="16" />
      <line x1="8" y1="8" x2="32" y2="32" />
    </g>
  </g>

  
  
  

  
  <g id="rules-panel">
    <rect x="970" y="296" width="570" height="364" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1470, 316)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 20 4 L 4 10 v 14 c 0 12 16 18 16 18 s 16 -6 16 -18 v -14 z" />
    </g>
    
    <text x="1000" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1000" dy="0">keep handlers tiny: set a flag and</tspan>
      <tspan x="1000" dy="38">do the real work in the main loop,</tspan>
      <tspan x="1000" dy="38">because a handler that opens a file</tspan>
      <tspan x="1000" dy="38">or waits on the network can be</tspan>
      <tspan x="1000" dy="38">interrupted in the middle of its</tspan>
      <tspan x="1000" dy="38">own work; SIGKILL and SIGSTOP</tspan>
      <tspan x="1000" dy="38">cannot be handled</tspan>
    </text>
  </g>

  
  <g id="pid1-panel">
    <rect x="970" y="682" width="570" height="372" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1470, 702)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 6 12 L 20 4 L 34 12 L 34 32 L 20 40 L 6 32 Z" />
      <line x1="20" y1="4" x2="20" y2="40" />
      <line x1="6" y1="12" x2="20" y2="20" />
      <line x1="34" y1="12" x2="20" y2="20" />
    </g>
    
    <text x="1000" y="732" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1000" dy="0">inside a container Python running</tspan>
      <tspan x="1000" dy="36">as PID 1 does not reap zombies or</tspan>
      <tspan x="1000" dy="36">forward signals by default: use tini,</tspan>
      <tspan x="1000" dy="36">docker run --init, or exec the</tspan>
      <tspan x="1000" dy="36">process from a shell wrapper; in the</tspan>
      <tspan x="1000" dy="36">lab compare with and without --init</tspan>
      <tspan x="1000" dy="36">under docker stop and its grace period</tspan>
    </text>
  </g>

  
  
  
  <g id="exit-hooks-strip">
    <rect x="60" y="1076" width="1480" height="196" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1470, 1096)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="12" r="8" />
      <path d="M 20 20 v 14 a 8 8 0 0 1 -16 0" />
      <line x1="10" y1="26" x2="30" y2="26" />
    </g>
    
    <text x="95" y="1126" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">atexit.register(fn) runs on normal exit, but not on SIGKILL or os._exit;</tspan>
      <tspan x="95" dy="46">faulthandler.enable() dumps tracebacks on crashes;</tspan>
      <tspan x="95" dy="46">faulthandler.register with kill -SIGUSR1 dumps them on demand</tspan>
    </text>
  </g>

  
  
  
  <g id="bottom-bar">
    <rect x="60" y="1296" width="1480" height="76" rx="12" fill="#207448" />
    <text x="800" y="1344" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Use the grace period to finish in-flight work and checkpoint
    </text>
  </g>
</svg>