<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" width="1600" height="1070">
  <title>One big Endpoints list versus EndpointSlice shards of 100</title>
  <desc>Visual comparison showing a legacy Kubernetes Endpoints object resending the entire list of pod IPs on every change versus EndpointSlice sharding into groups of up to 100 endpoints where one change updates only one slice.</desc>

  <defs>
    
    <marker id="arrow-thick" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#7a8c82" />
    </marker>
    <marker id="arrow-thin" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1070" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">One big Endpoints list versus EndpointSlice shards of 100</text>

  
  
  
  <g id="panel-left">
    
    <rect x="50" y="100" width="725" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="80" y="152" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Endpoints (legacy)</text>

    
    <rect x="80" y="180" width="280" height="500" rx="14" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2.5" />

    
    <g transform="translate(192, 198)" stroke="#7a8c82" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14" />
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
    </g>

    
    <text x="220" y="282" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="220" dy="0">one Endpoints object</tspan>
      <tspan x="220" dy="30">for the Service</tspan>
    </text>

    
    <rect x="100" y="328" width="240" height="180" rx="10" fill="#ffffff" stroke="#7a8c82" stroke-width="2" />
    <text x="220" y="362" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">pod IPs</text>

    
    <rect x="116" y="378" width="208" height="26" rx="6" fill="#e8f1ea" stroke="#7a8c82" stroke-width="1.5" />
    <circle cx="132" cy="391" r="5" fill="#7a8c82" />
    <line x1="148" y1="391" x2="306" y2="391" stroke="#7a8c82" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" />

    <rect x="116" y="410" width="208" height="26" rx="6" fill="#e8f1ea" stroke="#7a8c82" stroke-width="1.5" />
    <circle cx="132" cy="423" r="5" fill="#7a8c82" />
    <line x1="148" y1="423" x2="306" y2="423" stroke="#7a8c82" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" />

    <rect x="116" y="442" width="208" height="26" rx="6" fill="#e8f1ea" stroke="#7a8c82" stroke-width="1.5" />
    <circle cx="132" cy="455" r="5" fill="#7a8c82" />
    <line x1="148" y1="455" x2="306" y2="455" stroke="#7a8c82" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" />

    <rect x="116" y="474" width="208" height="26" rx="6" fill="#e8f1ea" stroke="#7a8c82" stroke-width="1.5" />
    <circle cx="132" cy="487" r="5" fill="#7a8c82" />
    <line x1="148" y1="487" x2="306" y2="487" stroke="#7a8c82" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" />

    
    <text x="220" y="550" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="220" dy="0">the whole list is</tspan>
      <tspan x="220" dy="30">rewritten and re-sent</tspan>
      <tspan x="220" dy="30">for every change</tspan>
    </text>

    
    
    <rect x="565" y="190" width="190" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(632, 206)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="6" />
      <line x1="12" y1="19" x2="28" y2="19" />
      <circle cx="42" cy="19" r="3" fill="#207448" />
    </g>
    <text x="660" y="282" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node A</text>

    
    <rect x="565" y="345" width="190" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(632, 361)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="6" />
      <line x1="12" y1="19" x2="28" y2="19" />
      <circle cx="42" cy="19" r="3" fill="#207448" />
    </g>
    <text x="660" y="437" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node B</text>

    
    <rect x="565" y="500" width="190" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(632, 516)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="6" />
      <line x1="12" y1="19" x2="28" y2="19" />
      <circle cx="42" cy="19" r="3" fill="#207448" />
    </g>
    <text x="660" y="592" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node C</text>

    
    
    <line x1="360" y1="245" x2="550" y2="245" stroke="#7a8c82" stroke-width="6" marker-end="url(#arrow-thick)" />
    <text x="455" y="235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">full list</text>

    
    <line x1="360" y1="400" x2="550" y2="400" stroke="#7a8c82" stroke-width="6" marker-end="url(#arrow-thick)" />
    <text x="455" y="390" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">full list</text>

    
    <line x1="360" y1="555" x2="550" y2="555" stroke="#7a8c82" stroke-width="6" marker-end="url(#arrow-thick)" />
    <text x="455" y="545" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">full list</text>

    
    <rect x="75" y="720" width="675" height="90" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="2.5" />
    <text x="412.5" y="773" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">one pod change reprints the whole list</text>
  </g>

  
  
  
  <g id="panel-right">
    
    <rect x="825" y="100" width="725" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="855" y="152" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">EndpointSlice</text>

    
    <rect x="850" y="180" width="280" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="870" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">slice 1</text>
    <text x="870" y="244" font-family="sans-serif" font-size="24" fill="#303a36">up to 100 endpoints</text>

    
    <rect x="866" y="258" width="248" height="64" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2.5" />
    <circle cx="890" cy="290" r="10" fill="#db8129" />
    <line x1="910" y1="290" x2="1094" y2="290" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" />

    
    <line x1="1025" y1="395" x2="1025" y2="330" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
    
    <text x="860" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="860" dy="0">one change</tspan>
      <tspan x="860" dy="28">updates</tspan>
      <tspan x="860" dy="28">one slice</tspan>
    </text>

    
    <rect x="850" y="425" width="280" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="870" y="467" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">slice 2</text>
    
    <line x1="870" y1="491" x2="1100" y2="491" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />

    
    <rect x="850" y="535" width="280" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="870" y="577" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">slice 3</text>
    
    <line x1="870" y1="601" x2="1100" y2="601" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />

    
    <rect x="850" y="645" width="280" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="990" y="676" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="990" dy="0">maximum 100</tspan>
      <tspan x="990" dy="28">endpoints per slice</tspan>
    </text>

    
    
    <rect x="1340" y="190" width="190" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1407, 206)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="6" />
      <line x1="12" y1="19" x2="28" y2="19" />
      <circle cx="42" cy="19" r="3" fill="#207448" />
    </g>
    <text x="1435" y="282" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node A</text>

    
    <rect x="1340" y="345" width="190" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1407, 361)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="6" />
      <line x1="12" y1="19" x2="28" y2="19" />
      <circle cx="42" cy="19" r="3" fill="#207448" />
    </g>
    <text x="1435" y="437" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node B</text>

    
    <rect x="1340" y="500" width="190" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1407, 516)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="6" />
      <line x1="12" y1="19" x2="28" y2="19" />
      <circle cx="42" cy="19" r="3" fill="#207448" />
    </g>
    <text x="1435" y="592" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node C</text>

    
    
    <line x1="1130" y1="245" x2="1325" y2="245" stroke="#207448" stroke-width="3" marker-end="url(#arrow-thin)" />
    <text x="1227" y="205" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1227" dy="0">changed</tspan>
      <tspan x="1227" dy="24">slice only</tspan>
    </text>

    
    <path d="M 1130 275 H 1165 Q 1175 275 1175 285 V 390 Q 1175 400 1185 400 H 1325" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-thin)" />
    <text x="1255" y="360" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1255" dy="0">changed</tspan>
      <tspan x="1255" dy="24">slice only</tspan>
    </text>

    
    <path d="M 1130 305 H 1145 Q 1155 305 1155 315 V 545 Q 1155 555 1165 555 H 1325" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-thin)" />
    <text x="1255" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1255" dy="0">changed</tspan>
      <tspan x="1255" dy="24">slice only</tspan>
    </text>
  </g>

  
  <rect x="887" y="865" width="600" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1187" y="899" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">EndpointSlice is the default since 1.21</text>

  
  <g id="takeaway-bar">
    <rect x="50" y="955" width="1500" height="75" rx="12" fill="#207448" />
    <text x="800" y="1001" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">sharding means one pod change updates one small slice, not the whole list.</text>
  </g>
</svg>