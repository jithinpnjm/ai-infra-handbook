<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>sysctl: runtime versus persistent</title>
  <desc>Visual explanation of sysctl runtime modification versus persistent configuration across reboots, name mapping, and module dependencies.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">sysctl: runtime versus persistent</text>

  
  <g id="origin-command" filter="url(#shadow)">
    <rect x="60" y="140" width="310" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(187, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="46" rx="6" />
      <line x1="0" y1="14" x2="56" y2="14" />
      <circle cx="10" cy="7" r="2" fill="#207448" />
      <circle cx="18" cy="7" r="2" fill="#207448" />
      <path d="M 12 28 L 20 33 L 12 38" />
      <line x1="26" y1="38" x2="42" y2="38" />
    </g>

    <text x="215" y="340" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="215" dy="0">Two paths from</tspan>
      <tspan x="215" dy="44">a command</tspan>
    </text>
  </g>

  
  <line x1="370" y1="240" x2="420" y2="240" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="370" y1="510" x2="420" y2="510" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  

  
  <g id="top-step-1" filter="url(#shadow)">
    <rect x="420" y="140" width="360" height="200" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="460" cy="180" r="24" fill="#207448" />
    <text x="460" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(505, 152)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="6" y1="14" x2="50" y2="14" />
      <circle cx="20" cy="14" r="5" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="28" x2="50" y2="28" />
      <circle cx="36" cy="28" r="5" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="42" x2="50" y2="42" />
      <circle cx="16" cy="42" r="5" fill="#ffffff" stroke="#207448" stroke-width="3" />
    </g>

    <text x="445" y="255" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="445" dy="0">sudo sysctl -w</tspan>
      <tspan x="445" dy="38">vm.swappiness=1</tspan>
    </text>
  </g>

  
  <line x1="780" y1="240" x2="820" y2="240" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="top-step-2" filter="url(#shadow)">
    <rect x="820" y="140" width="420" height="200" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="860" cy="180" r="24" fill="#207448" />
    <text x="860" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(905, 152)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4" />
      <line x1="18" y1="3" x2="18" y2="10" />
      <line x1="28" y1="3" x2="28" y2="10" />
      <line x1="38" y1="3" x2="38" y2="10" />
      <line x1="18" y1="46" x2="18" y2="53" />
      <line x1="28" y1="46" x2="28" y2="53" />
      <line x1="38" y1="46" x2="38" y2="53" />
      <path d="M 30 18 L 22 28 L 32 28 L 26 38" />
    </g>

    <text x="845" y="238" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">changes</tspan>
      <tspan x="845" dy="34" font-family="monospace" font-weight="bold" fill="#207448">/proc/sys/vm/swappiness</tspan>
      <tspan x="845" dy="34">immediately</tspan>
    </text>
  </g>

  
  <line x1="1240" y1="240" x2="1280" y2="240" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <g id="top-step-3" filter="url(#shadow)">
    <rect x="1280" y="140" width="260" height="200" rx="14" fill="#fff3e6" stroke="#db8129" stroke-width="3.5" />
    
    
    <circle cx="1320" cy="180" r="24" fill="#db8129" />
    <text x="1320" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(1365, 152)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 44 24 A 18 18 0 1 0 40 38" />
      <polyline points="44,14 44,25 33,25" />
      <line x1="28" y1="18" x2="28" y2="28" stroke-width="3.5" />
      <circle cx="28" cy="34" r="1.5" fill="#db8129" />
    </g>

    <text x="1305" y="258" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
      <tspan x="1305" dy="0">lost after</tspan>
      <tspan x="1305" dy="38">reboot</tspan>
    </text>
  </g>

  

  
  <g id="bottom-step-1" filter="url(#shadow)">
    <rect x="420" y="410" width="560" height="200" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="460" cy="450" r="24" fill="#207448" />
    <text x="460" y="458" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(505, 422)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 4 L 34 4 L 46 16 L 46 52 L 10 52 Z" />
      <polyline points="34,4 34,16 46,16" />
      <line x1="18" y1="26" x2="36" y2="26" />
      <line x1="18" y1="36" x2="32" y2="36" />
    </g>

    <text x="445" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="445" dy="0">write <tspan font-family="monospace" font-weight="bold">'vm.swappiness = 1'</tspan> into</tspan>
      <tspan x="445" dy="40" font-family="monospace" font-weight="bold">/etc/sysctl.d/90-gpu.conf</tspan>
    </text>
  </g>

  
  <line x1="980" y1="510" x2="1040" y2="510" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="bottom-step-2" filter="url(#shadow)">
    <rect x="1040" y="410" width="500" height="200" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="1080" cy="450" r="24" fill="#207448" />
    <text x="1080" y="458" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(1125, 422)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="28" cy="28" r="11" />
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 18 L 42 14" />
    </g>

    <text x="1065" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1065" dy="0">then <tspan font-family="monospace" font-weight="bold">sudo sysctl --system</tspan></tspan>
      <tspan x="1065" dy="40">reloads all files</tspan>
    </text>
  </g>

  

  
  <g id="panel-name-mapping" filter="url(#shadow)">
    <rect x="60" y="660" width="720" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(90, 727)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M 18 28 A 10 10 0 0 1 28 18 L 38 18 A 10 10 0 0 1 48 28 A 10 10 0 0 1 38 38 L 34 38" />
      <path d="M 38 28 A 10 10 0 0 1 28 38 L 18 38 A 10 10 0 0 1 8 28 A 10 10 0 0 1 18 18 L 22 18" />
    </g>

    <text x="165" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Name mapping:</text>
    <text x="165" y="775" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="165" dy="0"><tspan font-family="monospace" font-weight="bold">vm.swappiness</tspan> corresponds to</tspan>
      <tspan x="165" dy="38" font-family="monospace" font-weight="bold">/proc/sys/vm/swappiness</tspan>
    </text>
  </g>

  
  <g id="panel-check" filter="url(#shadow)">
    <rect x="820" y="660" width="720" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(850, 727)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="24" cy="24" r="14" />
      <line x1="34" y1="34" x2="48" y2="48" stroke-width="5" />
    </g>

    <text x="925" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Check:</text>
    
    <rect x="925" y="755" width="585" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="945" y="793" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">systemd-analyze cat-config sysctl.d</text>
  </g>

  
  <g id="panel-side-notes" filter="url(#shadow)">
    <rect x="60" y="880" width="1480" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(90, 920)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="28" cy="28" r="20" />
      <line x1="28" y1="24" x2="28" y2="38" stroke-width="4" />
      <circle cx="28" cy="16" r="2" fill="#207448" />
    </g>

    <text x="165" y="940" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side notes:</text>

    
    <circle cx="175" cy="995" r="5" fill="#207448" />
    <text x="195" y="1002" font-family="sans-serif" font-size="24" fill="#303a36">some keys exist only after a module loads <tspan font-family="monospace" font-weight="bold">(net.bridge.* needs br_netfilter)</tspan></text>

    
    <circle cx="175" cy="1055" r="5" fill="#207448" />
    <text x="195" y="1062" font-family="sans-serif" font-size="24" fill="#303a36">many network keys are per net namespace</text>
  </g>
</svg>