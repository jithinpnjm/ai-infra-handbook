<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>What goes in one Pod: the different-machines test</title>
  <desc>Decision diagram for Kubernetes Pod boundaries using the different-machines test.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What goes in one Pod: the different-machines test</text>

  
  
  <line x1="420" y1="230" x2="420" y2="380" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <line x1="1180" y1="230" x2="1180" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="220" y="110" width="1160" height="120" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(260, 142)">
    <rect x="0" y="4" width="22" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="34" y="4" width="22" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="18" x2="16" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="18" x2="50" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="34" x2="16" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="34" x2="50" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 22 28 h 12" stroke="#207448" stroke-width="3" stroke-dasharray="3,3" />
  </g>

  
  <text x="830" y="156" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="830" dy="0">Will these containers work correctly</tspan>
    <tspan x="830" dy="40">if they land on different machines?</tspan>
  </text>

  
  <rect x="160" y="278" width="520" height="54" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="420" y="313" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">No: they share local files or fate</text>

  
  <rect x="1110" y="278" width="140" height="54" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1180" y="313" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <rect x="80" y="380" width="680" height="500" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 80 396 A 16 16 0 0 1 96 380 L 744 380 A 16 16 0 0 1 760 396 L 760 455 L 80 455 Z" fill="#e8f1ea" />
  
  
  <g transform="translate(110, 392)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="8" y="12" width="16" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="32" y="12" width="16" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="8" y1="42" x2="48" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="185" y="432" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Same Pod</text>

  
  <g transform="translate(120, 480)">
    
    <rect x="0" y="0" width="600" height="175" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
    
    <rect x="40" y="20" width="230" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="60" y="38" width="34" height="34" rx="4" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="68" y1="48" x2="86" y2="48" stroke="#207448" stroke-width="2" />
    <line x1="68" y1="56" x2="86" y2="56" stroke="#207448" stroke-width="2" />
    <line x1="68" y1="64" x2="80" y2="64" stroke="#207448" stroke-width="2" />
    <circle cx="230" cy="55" r="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="330" y="20" width="230" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 365 42 A 14 14 0 1 1 352 55" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <polygon points="360,36 372,42 364,50" fill="#207448" />
    <circle cx="520" cy="55" r="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(220, 115)">
      <ellipse cx="80" cy="12" rx="75" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <path d="M 5 12 v 18 a 75 12 0 0 0 150 0 v -18" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <ellipse cx="80" cy="30" rx="75" ry="12" fill="none" stroke="#207448" stroke-width="2" />
    </g>
    
    <path d="M 155 90 v 35 h 70" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <path d="M 445 90 v 35 h -70" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  </g>

  
  <text x="420" y="710" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="420" dy="0">web or inference server plus a Git</tspan>
    <tspan x="420" dy="38">or model-weight synchronizer</tspan>
    <tspan x="420" dy="38">sharing an <tspan font-family="monospace">emptyDir</tspan></tspan>
  </text>

  
  <rect x="840" y="380" width="680" height="500" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 840 396 A 16 16 0 0 1 856 380 L 1504 380 A 16 16 0 0 1 1520 396 L 1520 455 L 840 455 Z" fill="#e8f1ea" />

  
  <g transform="translate(865, 392)">
    <rect x="0" y="8" width="16" height="40" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="40" y="8" width="16" height="40" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <polygon points="28,22 34,28 28,34 22,28" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="16" y1="28" x2="22" y2="28" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="935" y="430" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Separate Pods joined by a Service</text>

  
  <g transform="translate(870, 480)">
    
    <rect x="20" y="10" width="160" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="30" y="22" width="160" height="55" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="40" y="34" width="160" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="70" cy="61" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="105" cy="61" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="140" cy="61" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 175 61 h 18" stroke="#207448" stroke-width="2" stroke-linecap="round" />

    
    <g transform="translate(270, 42)">
      <rect x="0" y="0" width="80" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <polygon points="40,8 60,24 40,40 20,24" fill="none" stroke="#207448" stroke-width="2" />
      <circle cx="40" cy="24" r="4" fill="#207448" />
    </g>
    
    <line x1="200" y1="66" x2="270" y2="66" stroke="#207448" stroke-width="2" stroke-dasharray="4,3" />
    <line x1="350" y1="66" x2="420" y2="66" stroke="#207448" stroke-width="2" stroke-dasharray="4,3" />

    
    <rect x="420" y="12" width="170" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <ellipse cx="505" cy="40" rx="36" ry="9" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 469 40 v 26 a 36 9 0 0 0 72 0 v -26" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <ellipse cx="505" cy="66" rx="36" ry="9" fill="none" stroke="#207448" stroke-width="2" />
    
    <path d="M 565 70 v -35" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <path d="M 559 42 l 6 -7 l 6 7" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="1180" y="642" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1180" dy="0">WordPress frontend and MySQL:</tspan>
    <tspan x="1180" dy="34">WordPress is mostly stateless so</tspan>
    <tspan x="1180" dy="34">add pods with load, MySQL scales up</tspan>
    <tspan x="1180" dy="34">by giving one pod more resources;</tspan>
    <tspan x="1180" dy="34">one Pod would force one scaling</tspan>
    <tspan x="1180" dy="34">plan on both</tspan>
  </text>

  
  <rect x="80" y="925" width="1440" height="150" rx="16" fill="#207448" />

  
  <g transform="translate(110, 972)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="28" cy="18" r="5" fill="#ffffff" />
    <circle cx="16" cy="38" r="5" fill="#ffffff" />
    <circle cx="40" cy="38" r="5" fill="#ffffff" />
    <line x1="28" y1="18" x2="16" y2="38" stroke="#ffffff" stroke-width="2" />
    <line x1="28" y1="18" x2="40" y2="38" stroke="#ffffff" stroke-width="2" />
    <line x1="16" y1="38" x2="40" y2="38" stroke="#ffffff" stroke-width="2" />
  </g>

  
  <text x="820" y="968" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">
    <tspan x="820" dy="0">A Pod shares: one IP and port space, localhost, <tspan font-family="monospace">IPC /dev/shm</tspan>, hostname,</tspan>
    <tspan x="820" dy="37">declared volumes, parent Pod cgroup; each container keeps its own cgroup;</tspan>
    <tspan x="820" dy="37">PID namespace only if <tspan font-family="monospace">shareProcessNamespace</tspan> is true</tspan>
  </text>
</svg>