<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Sealed Secrets: safe in Git, plain only inside the cluster</title>
  <desc>Infographic explaining Sealed Secrets workflow between developer, Git repository, and Kubernetes cluster</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1320" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="bold" fill="#207448">Sealed Secrets: safe in Git, plain only inside the cluster</text>

  

  
  <rect x="50" y="130" width="435" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="88" cy="175" r="22" fill="#207448" />
  <text x="88" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(125, 155)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="10" />
    <path d="M 24 14 L 44 14 L 44 22 M 36 14 L 36 20" />
  </g>
  <text x="185" y="183" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 1</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" y="240">kubeseal --fetch-cert gets the</tspan>
    <tspan x="75" y="280">public key only (encryption key)</tspan>
  </text>

  
  <rect x="50" y="380" width="435" height="480" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="88" cy="425" r="22" fill="#207448" />
  <text x="88" y="433" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(125, 405)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="16" width="28" height="22" rx="4" />
    <path d="M 12 16 L 12 10 A 8 8 0 0 1 28 10 L 28 16" />
    <circle cx="20" cy="27" r="3" fill="#207448" />
  </g>
  <text x="185" y="433" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 2</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" y="490">developer runs kubeseal</tspan>
    <tspan x="75" y="526">mysecret.yaml: plain Secret</tspan>
    <tspan x="75" y="562">mysecret with dbuser and</tspan>
    <tspan x="75" y="598">dbkey becomes SealedSecret</tspan>
    <tspan x="75" y="634">(bitnami.com/v1alpha1) with</tspan>
    <tspan x="75" y="670">spec.encryptedData dbkey</tspan>
    <tspan x="75" y="706">and dbuser as ciphertext</tspan>
  </text>

  

  
  <rect x="520" y="380" width="430" height="480" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
  
  <g transform="translate(545, 406)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="5" />
    <circle cx="10" cy="30" r="5" />
    <circle cx="28" cy="18" r="5" />
    <path d="M 10 15 L 10 25 M 10 22 C 18 22 22 18 23 18" />
  </g>
  <text x="590" y="433" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">Git repo</text>

  
  <rect x="545" y="465" width="380" height="365" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="585" cy="510" r="22" fill="#207448" />
  <text x="585" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(620, 490)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 4 L 24 4 L 32 12 L 32 36 L 8 36 Z" />
    <path d="M 24 4 L 24 12 L 32 12" />
  </g>
  <text x="675" y="518" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 3</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="575" y="575">SealedSecret committed</tspan>
    <tspan x="575" y="615">anywhere in Git, safe while</tspan>
    <tspan x="575" y="655">the private key stays safe</tspan>
  </text>

  

  
  <rect x="980" y="120" width="570" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(1010, 145)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="34" height="26" rx="4" />
    <path d="M 12 18 L 16 22 L 28 12" />
  </g>
  <text x="1060" y="168" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">Cluster</text>

  
  <rect x="1005" y="195" width="520" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1030, 210)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="8" />
    <path d="M 18 4 L 18 8 M 18 28 L 18 32 M 4 18 L 8 18 M 28 18 L 32 18" />
  </g>
  <text x="1075" y="235" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">sealed-secret-controller</text>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1030" y="278">generates keys by default; public</tspan>
    <tspan x="1030" y="314">and private keys sit in Secret</tspan>
    <tspan x="1030" y="350">kube-system/sealed-secret-key</tspan>
    <tspan x="1030" y="386">(do not read it directly)</tspan>
  </text>

  
  <rect x="1005" y="425" width="520" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="1045" cy="465" r="22" fill="#207448" />
  <text x="1045" y="473" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(1080, 445)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="16" width="28" height="22" rx="4" />
    <path d="M 12 16 L 12 10 A 8 8 0 0 1 28 8" />
    <circle cx="20" cy="27" r="3" fill="#207448" />
  </g>
  <text x="1135" y="473" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 4</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1030" y="525">controller decrypts with the private key</tspan>
    <tspan x="1030" y="565">and creates plain Secret mysecret, with</tspan>
    <tspan x="1030" y="605">ownerReferences kind SealedSecret</tspan>
  </text>

  
  <rect x="1005" y="670" width="520" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="1045" cy="710" r="22" fill="#207448" />
  <text x="1045" y="718" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">5</text>
  
  <g transform="translate(1080, 690)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 12 L 32 12 M 14 12 L 14 6 L 26 6 L 26 12 M 10 12 L 12 34 L 28 34 L 30 12" />
    <line x1="17" y1="18" x2="17" y2="28" />
    <line x1="23" y1="18" x2="23" y2="28" />
  </g>
  <text x="1135" y="718" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 5</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1030" y="770">delete the SealedSecret and the Secret</tspan>
    <tspan x="1030" y="810">is garbage collected</tspan>
  </text>

  

  
  <path d="M 1005 237 L 499 237" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" stroke-dasharray="6 4" />

  
  <path d="M 267 345 L 267 366" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 485 620 L 531 620" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 950 537 L 991 537" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  

  
  <rect x="50" y="890" width="715" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(80, 915)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14" />
    <path d="M 16 8 L 16 16 L 22 20" />
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" y="955">key renewal every 30 days by default; new key</tspan>
    <tspan x="125" y="995">joins old ones, does not replace them</tspan>
  </text>

  
  <rect x="795" y="890" width="755" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(825, 915)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 4 L 30 28 L 2 28 Z" />
    <line x1="16" y1="14" x2="16" y2="20" />
    <circle cx="16" cy="24" r="1.5" fill="#db8129" />
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" y="945">leaked private key: rotate the encryption key AND</tspan>
    <tspan x="870" y="985">rotate the secrets themselves, re-encrypting alone</tspan>
    <tspan x="870" y="1025">is not enough because old encrypted files</tspan>
    <tspan x="870" y="1065">remain in Git history</tspan>
  </text>

  
  <rect x="50" y="1105" width="715" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(80, 1130)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="24" height="24" rx="4" />
    <circle cx="16" cy="16" r="4" />
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" y="1170">bound to the Namespace where it was sealed;</tspan>
    <tspan x="125" y="1210">cannot simply be moved</tspan>
  </text>

  
  <rect x="795" y="1155" width="755" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(825, 1175)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 8 L 16 2 L 28 8 L 28 18 C 28 24 16 30 16 30 C 16 30 4 24 4 18 Z" />
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" y="1218">does not replace etcd encryption or Vault</tspan>
  </text>
</svg>