<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Leading and lagging signals for an LLM server</title>
  <desc>Horizontal timeline of load building illustrating leading, middle, and lagging autoscaling signals alongside weak signals and recommended autoscaling recipe.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 46px; font-weight: bold; fill: #207448; }
      .analogy-text { font-family: system-ui, -apple-system, sans-serif; font-size: 25px; fill: #303a36; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; fill: #303a36; line-height: 1.45; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .recipe-text { font-family: system-ui, -apple-system, sans-serif; font-size: 25px; font-weight: bold; fill: #ffffff; }
    </style>

    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1350" class="bg" />

  
  <text x="60" y="70" class="title-text">Leading and lagging signals for an LLM server</text>

  
  <g transform="translate(60, 95)">
    <rect width="1480" height="64" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 30 42 L 42 42 L 52 22 L 72 22 M 46 42 A 4 4 0 1 1 46 42.1 M 64 42 A 4 4 0 1 1 64 42.1" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="85" y="41" class="analogy-text">supermarket line: open another till before the line reaches the door</text>
  </g>

  
  <g transform="translate(60, 185)">
    <line x1="10" y1="25" x2="1460" y2="25" stroke="#207448" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)" />
    
    <circle cx="280" cy="25" r="9" fill="#207448" />
    <circle cx="850" cy="25" r="9" fill="#207448" />
    <circle cx="1320" cy="25" r="9" fill="#207448" />
  </g>

  

  
  <g transform="translate(60, 230)">
    
    <rect width="520" height="530" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="50" cy="48" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="50,34 50,48 60,54" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="88" y="56" class="header-title">Earliest (leading)</text>

    
    <rect x="20" y="86" width="480" height="260" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <rect x="36" y="104" width="22" height="22" rx="4" fill="#db8129" />
    <text x="70" y="122" class="body-text" style="font-weight: bold; fill: #db8129;">Primary Signal</text>

    <text x="36" y="160" class="body-text">
      <tspan x="36" dy="0">queue depth,</tspan>
      <tspan x="36" dy="32" class="code-font">vllm:num_requests_waiting</tspan>
      <tspan x="36" dy="32">or Triton</tspan>
      <tspan x="36" dy="32" class="code-font">nv_inference_pending_request_count:</tspan>
      <tspan x="36" dy="34">best primary signal, requests start</tspan>
      <tspan x="36" dy="30">waiting before latency climbs</tspan>
    </text>

    
    <rect x="20" y="362" width="480" height="144" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <rect x="36" y="380" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="43" y1="391" x2="57" y2="391" stroke="#207448" stroke-width="3" />
    <line x1="50" y1="384" x2="50" y2="398" stroke="#207448" stroke-width="3" />
    <text x="36" y="434" class="body-text">
      <tspan x="36" dy="0">in-flight requests or concurrency</tspan>
      <tspan x="36" dy="32">per replica: load versus capacity</tspan>
    </text>
  </g>

  
  <g transform="translate(605, 230)">
    
    <rect width="455" height="530" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <path d="M 32 58 A 20 20 0 1 1 68 58" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="58" x2="60" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="88" y="56" class="header-title">Middle</text>

    
    <rect x="20" y="86" width="415" height="420" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="36" y="140" class="body-text">
      <tspan x="36" dy="0">KV-cache utilisation</tspan>
      <tspan x="36" dy="38" class="code-font">vllm:gpu_cache_usage_perc:</tspan>
      <tspan x="36" dy="42">scale up at about 70 to 80</tspan>
      <tspan x="36" dy="34">percent sustained</tspan>
    </text>

    
    <rect x="36" y="290" width="375" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="38" y="292" width="285" height="30" rx="4" fill="#207448" />
    <line x1="300" y1="280" x2="300" y2="334" stroke="#db8129" stroke-width="3" stroke-dasharray="4 3" />
    <text x="36" y="365" class="body-text" style="font-size: 24px; fill: #207448;">Target threshold: ~75%</text>
  </g>

  
  <g transform="translate(1085, 230)">
    
    <rect width="455" height="530" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <path d="M 50 28 L 66 36 L 66 52 C 66 64 50 72 50 72 C 50 72 34 64 34 52 L 34 36 Z" fill="none" stroke="#207448" stroke-width="4" />
    <text x="88" y="56" class="header-title">Late</text>

    
    <rect x="20" y="86" width="415" height="420" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <rect x="36" y="104" width="310" height="40" rx="6" fill="#e8f1ea" />
    <text x="46" y="132" class="body-text" style="font-weight: bold; fill: #207448;">(lagging, guardrail or alert)</text>

    <text x="36" y="200" class="body-text">
      <tspan x="36" dy="0">TTFT p95,</tspan>
      <tspan x="36" dy="40">inter-token latency,</tspan>
      <tspan x="36" dy="40">5xx errors</tspan>
    </text>

    
    <g transform="translate(36, 320)">
      <rect width="375" height="80" rx="8" fill="#f5f8f5" stroke="#303a36" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="35" cy="40" r="16" fill="none" stroke="#303a36" stroke-width="3" />
      <line x1="35" y1="30" x2="35" y2="44" stroke="#303a36" stroke-width="3" stroke-linecap="round" />
      <circle cx="35" cy="50" r="2" fill="#303a36" />
      <text x="65" y="47" class="body-text">SLA violation boundary</text>
    </g>
  </g>

  
  <g transform="translate(60, 785)">
    
    <rect width="1480" height="370" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="50" cy="44" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="36" y1="30" x2="64" y2="58" stroke="#207448" stroke-width="4" />
    <text x="88" y="52" class="header-title">Weak signals</text>

    
    <rect x="20" y="78" width="468" height="268" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <rect x="40" y="98" width="30" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="48" y1="92" x2="48" y2="98" stroke="#207448" stroke-width="2" />
    <line x1="62" y1="92" x2="62" y2="98" stroke="#207448" stroke-width="2" />
    <line x1="48" y1="128" x2="48" y2="134" stroke="#207448" stroke-width="2" />
    <line x1="62" y1="128" x2="62" y2="134" stroke="#207448" stroke-width="2" />
    <text x="80" y="122" class="body-text" style="font-weight: bold; fill: #207448;">GPU metric</text>

    <text x="36" y="162" class="body-text">
      <tspan x="36" dy="0">GPU utilisation</tspan>
      <tspan x="36" dy="32" class="code-font">DCGM_FI_DEV_GPU_UTIL:</tspan>
      <tspan x="36" dy="34">misleading, saturates early</tspan>
      <tspan x="36" dy="32">with batching, low-latency</tspan>
      <tspan x="36" dy="32">inference may show low use</tspan>
    </text>

    
    <rect x="506" y="78" width="468" height="268" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <rect x="526" y="98" width="30" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="541" cy="113" r="6" fill="none" stroke="#207448" stroke-width="2" />
    <text x="566" y="122" class="body-text" style="font-weight: bold; fill: #207448;">CPU metric</text>

    <text x="526" y="162" class="body-text">
      <tspan x="526" dy="0">CPU: only for</tspan>
      <tspan x="526" dy="32">tokenisation-heavy front-ends,</tspan>
      <tspan x="526" dy="34">often says nothing for GPU</tspan>
      <tspan x="526" dy="32">backends</tspan>
    </text>

    
    <rect x="992" y="78" width="468" height="268" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <rect x="1012" y="98" width="32" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1020 122 L 1020 132 M 1036 122 L 1036 132 M 1012 132 L 1044 132" stroke="#207448" stroke-width="3" />
    <text x="1052" y="122" class="body-text" style="font-weight: bold; fill: #207448;">Gateway metric</text>

    <text x="1012" y="162" class="body-text">
      <tspan x="1012" dy="0">RPS at the gateway: needs a</tspan>
      <tspan x="1012" dy="32">per-replica capacity model,</tspan>
      <tspan x="1012" dy="34">brittle across prompt</tspan>
      <tspan x="1012" dy="32">lengths</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 1180)">
    <rect width="1480" height="120" rx="12" fill="#207448" />
    
    <circle cx="50" cy="60" r="24" fill="#ffffff" />
    <polyline points="40,60 48,68 62,50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <text x="96" y="50" class="recipe-text">
      <tspan x="96" dy="0">scale on queue depth per replica or concurrency, minReplicas covers baseline,</tspan>
      <tspan x="96" dy="36">maxReplicas bounded by GPU quota, alert on TTFT and 5xx</tspan>
    </text>
  </g>
</svg>