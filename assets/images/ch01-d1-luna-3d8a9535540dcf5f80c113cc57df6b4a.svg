  <rect x="1264" y="1050" width="296" height="115" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1284" y="1082" width="56" height="52" rx="5"/>
    <rect x="1296" y="1094" width="32" height="28" rx="3"/>
