  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="94" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">The three layers</text>

  
  <rect x="40" y="140" width="1520" height="295" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="76" y="195" font-family="sans-serif" font-size="34" font-weight="700" fill="#207448">USER SPACE: restricted mode</text>

  <rect x="80" y="220" width="440" height="185" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  
