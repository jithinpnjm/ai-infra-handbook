<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">The three layers</title>
  <desc id="svg-desc"></desc>
  <defs>
