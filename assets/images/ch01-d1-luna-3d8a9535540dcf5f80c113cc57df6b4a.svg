  <text x="494" y="830" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">virtual memory</text>

  
  <rect x="652" y="625" width="296" height="275" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
