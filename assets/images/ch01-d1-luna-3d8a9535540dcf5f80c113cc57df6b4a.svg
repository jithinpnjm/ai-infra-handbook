  <text x="180" y="325" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="180" dy="0">python, slurmd,</tspan>
    <tspan x="180" dy="32">containerd</tspan>
  </text>

  <rect x="580" y="220" width="440" height="185" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  
