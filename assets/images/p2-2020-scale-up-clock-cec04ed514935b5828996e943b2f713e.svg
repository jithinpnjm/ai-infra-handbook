    <text x="14" y="32" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Warm node: the pod skips provisioning</text>
  </g>

  
  <path d="M 1075 440 L 1075 510 L 1400 510 L 1400 540" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="470" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(390, 20)">
      <rect x="8" y="14" width="40" height="34" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 24 L 48 24 M 28 24 L 28 48" stroke="#207448" stroke-width="3" />
      <path d="M 18 14 L 28 6 L 38 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="86" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Image pull</text>
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Image pull</text>
  </g>

  
  <path d="M 520 625 L 550 625" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(560, 550)">
    <rect x="0" y="0" width="990" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(900, 20)">
      <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 14 L 8 40 C 8 45, 48 45, 48 40 L 48 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 27 C 8 32, 48 32, 48 27" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    
    <text x="86" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Weight load</text>
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Weight load from storage to GPU memory</text>
  </g>

  
  <path d="M 1055 700 L 1055 765 L 290 765 L 290 830" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(50, 840)">
    <rect x="0" y="0" width="670" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(590, 20)">
      <path d="M 28 6 C 28 6, 36 16, 36 24 C 36 30, 32 36, 26 38 C 22 39, 18 36, 18 32 C 18 26, 22 22, 22 22 C 22 22, 14 26, 14 34 C 14 43, 21 50, 30 50 C 40 50, 46 41, 46 30 C 46 16, 28 6, 28 6 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    
    <text x="86" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Warm-up</text>
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Warm-up: first requests, graph capture, caches</text>
  </g>

  
  <path d="M 720 915 L 760 915" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(770, 840)">
    <rect x="0" y="0" width="780" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g transform="translate(700, 20)">
      <circle cx="28" cy="18" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="40" r="6" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="42" cy="40" r="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="24" y1="25" x2="18" y2="34" stroke="#207448" stroke-width="3" />
      <line x1="32" y1="25" x2="38" y2="34" stroke="#207448" stroke-width="3" />
