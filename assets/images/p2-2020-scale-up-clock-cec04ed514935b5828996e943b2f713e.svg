    <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(860, 20)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="20" x2="40" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="16" y1="28" x2="30" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="38" cy="36" r="3" fill="#207448" />
    </g>
    
    <text x="86" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node provision</text>
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Node provision by the cluster autoscaler</text>
  </g>

  
  
  <path d="M 545 365 L 545 455 L 1570 455 L 1570 580 L 1500 580" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-orange)" />
