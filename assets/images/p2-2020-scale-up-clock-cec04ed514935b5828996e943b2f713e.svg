    <text x="86" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Registration</text>
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Registration: readiness passes, router adds it</text>
  </g>

  
  <text x="50" y="1065" font-family="sans-serif" font-size="24" font-style="italic" fill="#303a36">The values are assumptions, not measurements.</text>
</svg>