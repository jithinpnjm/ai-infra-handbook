    <text x="86" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Decision</text>
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Decision: scrape, polling and 15 s sync</text>
  </g>

  
  <path d="M 500 365 L 590 365" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(600, 290)">
