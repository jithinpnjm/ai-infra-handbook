<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Scale-up latency: the clock from crossing the line to serving</title>
  <desc>Horizontal timeline of scale-up latency stages from metric trigger to stream serving, highlighting provisioning bottleneck, optimizations, and bypass path.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Scale-up latency: the clock from crossing the line to serving</text>

  
  
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="370" height="64" rx="8" fill="#207448" />
    
    <path d="M 22 18 L 22 46 M 22 18 L 44 26 L 22 35" fill="none" stroke="#f5f8f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Metric crosses the target</text>
  </g>

  
  <g transform="translate(1250, 115)">
    <rect x="0" y="0" width="300" height="64" rx="8" fill="#207448" />
    
    <circle cx="32" cy="32" r="14" fill="none" stroke="#f5f8f5" stroke-width="3" />
    <path d="M 25 32 L 30 37 L 40 25" fill="none" stroke="#f5f8f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Stream is served</text>
  </g>

  
  <path d="M 235 179 L 235 240" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 1400 900 L 1400 189" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <g transform="translate(680, 220)">
    <rect x="0" y="0" width="460" height="54" rx="27" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 28 21 L 28 33 M 22 27 L 34 27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="48" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Warm node pool, placeholder pods</text>
  </g>

  
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="420" height="54" rx="27" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 28 21 L 28 33 M 22 27 L 34 27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="48" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Pre-pulled image, smaller image</text>
  </g>

  
  <g transform="translate(560, 480)">
    <rect x="0" y="0" width="440" height="54" rx="27" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 28 21 L 28 33 M 22 27 L 34 27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="48" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Local volume cache, fast storage</text>
  </g>

  
  <g transform="translate(50, 770)">
    <rect x="0" y="0" width="500" height="54" rx="27" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 28 21 L 28 33 M 22 27 L 34 27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="48" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Warm-up request in the startup probe</text>
  </g>

  
