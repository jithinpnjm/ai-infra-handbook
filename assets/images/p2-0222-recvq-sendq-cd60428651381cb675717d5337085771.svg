<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Recv-Q and Send-Q mean different things on a listening socket and a connected socket</title>
  <desc>Visual comparison showing how Recv-Q and Send-Q represent accept queue state on a LISTEN socket versus byte buffer counts on an ESTAB socket.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="800" dy="0">Recv-Q and Send-Q mean different things</tspan>
    <tspan x="800" dy="56">on a listening socket and a connected socket</tspan>
  </text>

  
  <rect x="50" y="145" width="725" height="800" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 165)">
    
    <circle cx="28" cy="38" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 32 L 28 8" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 14 18 C 20 12, 36 12, 42 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 6 10 C 18 0, 38 0, 50 10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="145" y="200" font-size="32" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">
    LISTEN socket <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">(ss -ltn)</tspan>
  </text>

  
  <rect x="85" y="235" width="655" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(105, 247)">
    
    <rect x="6" y="6" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="24" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 30 L 28 38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="175" y="285" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    listening socket on port 443
  </text>

  
  <line x1="412" y1="315" x2="412" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="85" y="345" width="655" height="370" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(105, 360)">
    
    <rect x="6" y="10" width="12" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="22" y="10" width="12" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="38" y="10" width="12" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="175" y="396" font-size="30" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">
    accept queue
  </text>

  
  <text x="260" y="445" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="260" dy="0" font-weight="bold">Recv-Q: completed connections</tspan>
    <tspan x="260" dy="28">waiting for <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">accept()</tspan></tspan>
  </text>

  
  <path d="M 125 488 L 125 482 Q 125 476 135 476 L 250 476 Q 260 476 260 470 Q 260 476 270 476 L 385 476 Q 395 476 395 482 L 395 488" fill="none" stroke="#207448" stroke-width="2" />

  
  
  <rect x="125" y="495" width="80" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="165" cy="525" r="14" fill="#207448" />
  <circle cx="165" cy="525" r="5" fill="#ffffff" />

  
  <rect x="215" y="495" width="80" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="255" cy="525" r="14" fill="#207448" />
  <circle cx="255" cy="525" r="5" fill="#ffffff" />

  
  <rect x="305" y="495" width="80" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="345" cy="525" r="14" fill="#207448" />
  <circle cx="345" cy="525" r="5" fill="#ffffff" />

  
  <rect x="395" y="495" width="80" height="60" rx="6" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="6 4" />

  
  <rect x="485" y="495" width="80" height="60" rx="6" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="6 4" />

  
  <rect x="575" y="495" width="80" height="60" rx="6" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="6 4" />

  
  <path d="M 125 565 L 125 573 Q 125 579 135 579 L 380 579 Q 390 579 390 587 Q 390 579 400 579 L 645 579 Q 655 579 655 573 L 655 565" fill="none" stroke="#207448" stroke-width="2" />

  
  <text x="390" y="620" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="390" dy="0" font-weight="bold">Send-Q: queue capacity,</tspan>
    <tspan x="390" dy="28"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">min(backlog, somaxconn)</tspan></tspan>
  </text>

  
  <line x1="412" y1="715" x2="412" y2="745" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <rect x="85" y="745" width="655" height="175" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <g transform="translate(105, 785)">
    
    <path d="M 28 6 L 52 48 L 4 48 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="22" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="42" r="2.5" fill="#db8129" />
  </g>
  <text x="175" y="800" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="175" dy="0">When Recv-Q reaches Send-Q,</tspan>
    <tspan x="175" dy="34">new connections are dropped and counted</tspan>
    <tspan x="175" dy="34">as <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">ListenOverflows</tspan>.</tspan>
  </text>

  
  <rect x="825" y="145" width="725" height="800" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(850, 165)">
    
    <circle cx="14" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="42" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="22" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="4" />
  </g>
  <text x="920" y="200" font-size="32" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">
    ESTAB socket <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">(ss -tn)</tspan>
  </text>

  
  <rect x="860" y="235" width="655" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(880, 247)">
    
    <rect x="8" y="14" width="16" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="32" y="14" width="16" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="24" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="4" />
  </g>
  <text x="950" y="285" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    connected socket
  </text>

  
  <line x1="1187" y1="315" x2="1187" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="860" y="345" width="655" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(880, 375)">
    
    <rect x="6" y="12" width="44" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="4" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 20 20 L 28 28 L 36 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="950" y="405" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="950" dy="0" font-weight="bold">receive buffer: Recv-Q =</tspan>
    <tspan x="950" dy="34">bytes not yet read by the application</tspan>
  </text>
  
  <g transform="translate(950, 470)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#207448" />
    <rect x="88" y="0" width="80" height="24" rx="4" fill="#207448" />
    <rect x="176" y="0" width="80" height="24" rx="4" fill="#207448" />
    <rect x="264" y="0" width="80" height="24" rx="4" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="4 3" />
    <rect x="352" y="0" width="80" height="24" rx="4" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="4 3" />
  </g>

  
  <line x1="1187" y1="520" x2="1187" y2="545" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="860" y="545" width="655" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(880, 575)">
    
    <rect x="6" y="12" width="44" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="36" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 20 20 L 28 12 L 36 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="950" y="605" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="950" dy="0" font-weight="bold">send buffer: Send-Q =</tspan>
    <tspan x="950" dy="34">bytes not yet acknowledged by the peer</tspan>
  </text>
  
  <g transform="translate(950, 670)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#207448" />
    <rect x="88" y="0" width="80" height="24" rx="4" fill="#207448" />
    <rect x="176" y="0" width="80" height="24" rx="4" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="4 3" />
    <rect x="264" y="0" width="80" height="24" rx="4" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="4 3" />
    <rect x="352" y="0" width="80" height="24" rx="4" fill="#fdfdfd" stroke="#8fa89b" stroke-width="2" stroke-dasharray="4 3" />
  </g>

  
  <line x1="1187" y1="720" x2="1187" y2="745" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="860" y="745" width="655" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(880, 785)">
    
    <rect x="6" y="6" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="18" y1="46" x2="38" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="40" x2="28" y2="46" stroke="#207448" stroke-width="4" />
    <line x1="24" y1="18" x2="24" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="18" x2="32" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="950" y="805" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="950" dy="0">Recv-Q that stays above zero</tspan>
    <tspan x="950" dy="34">means the application is not reading.</tspan>
  </text>

  
  <rect x="50" y="975" width="1500" height="70" rx="12" fill="#207448" />
  <text x="800" y="1019" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
    Read Recv-Q and Send-Q together with the socket state.
  </text>
</svg>