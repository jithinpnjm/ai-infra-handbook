<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Pipelining: 104 cycles instead of 500</title>
  <desc>Visual comparison showing non-pipelined execution taking 500 cycles versus pipelined execution taking 104 cycles across five functional stages.</desc>

  
  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pipelining: 104 cycles instead of 500</text>

  
  <rect x="490" y="95" width="620" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="130" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">Total cycles = K * (N - 1) + S</text>

  
  <rect x="50" y="165" width="1500" height="395" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="80" y="206" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Without a pipeline</text>

  
  <rect x="80" y="225" width="270" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="265" r="22" fill="#207448"/>
  <text x="120" y="274" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <rect x="265" y="247" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="265" y1="256" x2="257" y2="256" stroke="#207448" stroke-width="3"/>
  <line x1="265" y1="265" x2="257" y2="265" stroke="#207448" stroke-width="3"/>
  <line x1="265" y1="274" x2="257" y2="274" stroke="#207448" stroke-width="3"/>
  <line x1="301" y1="256" x2="309" y2="256" stroke="#207448" stroke-width="3"/>
  <line x1="301" y1="265" x2="309" y2="265" stroke="#207448" stroke-width="3"/>
  <line x1="301" y1="274" x2="309" y2="274" stroke="#207448" stroke-width="3"/>
  <text x="215" y="322" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="215" dy="0">load from</tspan>
    <tspan x="215" dy="34">memory</tspan>
  </text>

  
  <rect x="372.5" y="225" width="270" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="412.5" cy="265" r="22" fill="#207448"/>
  <text x="412.5" y="274" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <line x1="557.5" y1="255" x2="597.5" y2="255" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="570.5" cy="255" r="5" fill="#207448"/>
  <line x1="557.5" y1="275" x2="597.5" y2="275" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="584.5" cy="275" r="5" fill="#207448"/>
  <text x="507.5" y="322" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="507.5" dy="0">normalize</tspan>
    <tspan x="507.5" dy="34">mantissas</tspan>
  </text>

  
  <rect x="665" y="225" width="270" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="705" cy="265" r="22" fill="#207448"/>
  <text x="705" y="274" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <circle cx="870" cy="265" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="860" y1="265" x2="880" y2="265" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="870" y1="255" x2="870" y2="275" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <text x="800" y="338" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">add</text>

  
  <rect x="957.5" y="225" width="270" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="997.5" cy="265" r="22" fill="#207448"/>
  <text x="997.5" y="274" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <path d="M 1150 252 L 1175 252 L 1175 272 L 1162.5 282 L 1150 272 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <polyline points="1156,265 1161,270 1169,260" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1092.5" y="338" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">correct</text>

  
  <rect x="1250" y="225" width="270" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1290" cy="265" r="22" fill="#207448"/>
  <text x="1290" y="274" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  
  <rect x="1440" y="250" width="30" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M 1465 242 L 1452 242 L 1452 258" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1447,253 1452,258 1457,253" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1385" y="322" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1385" dy="0">write result</tspan>
    <tspan x="1385" dy="34">back</tspan>
  </text>

  
  <rect x="80" y="390" width="1440" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <rect x="155" y="405" width="120" height="55" rx="6" fill="#f5f8f5" stroke="#207448" stroke-dasharray="6 4" stroke-width="1.5"/>
  <rect x="447.5" y="405" width="120" height="55" rx="6" fill="#f5f8f5" stroke="#207448" stroke-dasharray="6 4" stroke-width="1.5"/>
  <rect x="740" y="405" width="120" height="55" rx="6" fill="#f5f8f5" stroke="#207448" stroke-dasharray="6 4" stroke-width="1.5"/>
  <rect x="1032.5" y="405" width="120" height="55" rx="6" fill="#f5f8f5" stroke="#207448" stroke-dasharray="6 4" stroke-width="1.5"/>
  
  <rect x="1325" y="405" width="120" height="55" rx="6" fill="#207448"/>
  
  <rect x="90" y="413" width="50" height="38" rx="6" fill="#207448"/>

  
  <rect x="440" y="495" width="720" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="528" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">500 cycles for N = 100 elements with S = 5</text>

  
  <rect x="50" y="580" width="1500" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="80" y="621" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">With a pipeline</text>

  
  <rect x="80" y="640" width="270" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="667.5" r="18" fill="#207448"/>
  <text x="120" y="675" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <rect x="270" y="652" width="28" height="28" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>

  <rect x="372.5" y="640" width="270" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="412.5" cy="667.5" r="18" fill="#207448"/>
  <text x="412.5" y="675" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <line x1="562.5" y1="660" x2="592.5" y2="660" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="562.5" y1="675" x2="592.5" y2="675" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="665" y="640" width="270" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="705" cy="667.5" r="18" fill="#207448"/>
  <text x="705" y="675" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="870" cy="667.5" r="14" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="862" y1="667.5" x2="878" y2="667.5" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="870" y1="659.5" x2="870" y2="675.5" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="957.5" y="640" width="270" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="997.5" cy="667.5" r="18" fill="#207448"/>
  <text x="997.5" y="675" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <path d="M 1152 656 L 1172 656 L 1172 672 L 1162 680 L 1152 672 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round"/>

  <rect x="1250" y="640" width="270" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1290" cy="667.5" r="18" fill="#207448"/>
  <text x="1290" y="675" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <rect x="1445" y="654" width="24" height="22" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
  <path d="M 1465 648 L 1455 648 L 1455 660" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  
  <rect x="80" y="710" width="1440" height="84" rx="10" fill="#fdf2e9" stroke="#db8129" stroke-width="3"/>
  <rect x="550" y="718" width="500" height="34" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="800" y="743" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">pipeline fill time (S cycles)</text>

  
  <rect x="180" y="756" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="472.5" y="756" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="765" y="756" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="1057.5" y="756" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="1350" y="756" width="70" height="32" rx="6" fill="#207448"/>

  
  <rect x="180" y="804" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="472.5" y="804" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="765" y="804" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="1057.5" y="804" width="70" height="32" rx="6" fill="#207448"/>

  
  <rect x="180" y="848" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="472.5" y="848" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="765" y="848" width="70" height="32" rx="6" fill="#207448"/>

  
  <rect x="180" y="892" width="70" height="32" rx="6" fill="#207448"/>
  <rect x="472.5" y="892" width="70" height="32" rx="6" fill="#207448"/>

  
  <rect x="180" y="936" width="70" height="32" rx="6" fill="#207448"/>

  
  <rect x="350" y="984" width="900" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1017" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">104 cycles = K x (N - 1) + S, with K = 1, N = 100, S = 5</text>

  
  <text x="800" y="1095" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#303a36">pipelining is a different idea from vectorization</text>
</svg>