<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090">
  <title>Why df shows 100% while du finds nothing: the deleted file is still open</title>
  <desc>Visual infographic explaining why disk space remains allocated when deleted files are still held open by running processes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1090" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Why df shows 100% while du finds nothing:</tspan>
    <tspan x="800" dy="56">the deleted file is still open</tspan>
  </text>

  

  
  <line x1="386" y1="200" x2="424" y2="200" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="778" y1="200" x2="816" y2="200" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="1170" y1="200" x2="1208" y2="200" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="41" y="160" width="345" height="290" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="82" cy="200" r="24" fill="#207448" />
  <text x="82" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(130, 178)">
    <rect x="0" y="0" width="32" height="44" rx="3" stroke="#207448" stroke-width="3.5" fill="none" />
    <line x1="7" y1="12" x2="25" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="7" y1="22" x2="25" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="7" y1="32" x2="18" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="61" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="61" dy="0">Process opens a</tspan>
    <tspan x="61" dy="32">huge log file; inode</tspan>
    <tspan x="61" dy="32">link count is 1 and</tspan>
    <tspan x="61" dy="32">one process holds</tspan>
    <tspan x="61" dy="32">it open</tspan>
  </text>

  
  <rect x="433" y="160" width="345" height="290" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="474" cy="200" r="24" fill="#207448" />
  <text x="474" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(520, 178)">
    <path d="M0,8 L36,8 M10,8 L10,2 L26,2 L26,8 M4,14 L8,42 L28,42 L32,14" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="14" y1="20" x2="15" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="22" y1="20" x2="21" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="453" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="453" dy="0">Log rotation runs</tspan>
    <tspan x="453" dy="32"><tspan font-family="monospace">rm</tspan>: the directory</tspan>
    <tspan x="453" dy="32">entry is removed</tspan>
    <tspan x="453" dy="32">and the link count</tspan>
    <tspan x="453" dy="32">drops to 0</tspan>
  </text>

  
  <rect x="825" y="160" width="345" height="290" rx="8" fill="#fdf6ed" stroke="#db8129" stroke-width="3" />
  <circle cx="866" cy="200" r="24" fill="#db8129" />
  <text x="866" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(914, 176)">
    <rect x="0" y="14" width="36" height="28" rx="4" stroke="#db8129" stroke-width="3.5" fill="none" />
    <path d="M8,14 L8,8 A10,10 0 0 1 28,8 L28,14" stroke="#db8129" stroke-width="3.5" fill="none" />
    <circle cx="18" cy="26" r="3" fill="#db8129" />
    <line x1="18" y1="29" x2="18" y2="35" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="845" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="845" dy="0">A process still</tspan>
    <tspan x="845" dy="34">has the file open,</tspan>
    <tspan x="845" dy="34">so the inode and its</tspan>
    <tspan x="845" dy="34" font-weight="bold" fill="#db8129">blocks are NOT freed</tspan>
  </text>

  
  <rect x="1217" y="160" width="345" height="290" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1258" cy="200" r="24" fill="#207448" />
  <text x="1258" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(1308, 178)">
    <path d="M22,6 A18,18 0 1 1 6,18" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <polyline points="24,0 24,8 16,8" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="14,24 18,28 26,18" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="1237" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1237" dy="0">Process exits or</tspan>
    <tspan x="1237" dy="34">restarts: now the</tspan>
    <tspan x="1237" dy="34">inode and blocks</tspan>
    <tspan x="1237" dy="34">are freed</tspan>
  </text>

  

  
  <rect x="41" y="480" width="737" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(72, 530)">
    <ellipse cx="28" cy="10" rx="28" ry="10" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M0,10 L0,38 A28,10 0 0 0 56,38 L56,10" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M0,24 A28,10 0 0 0 56,24" stroke="#207448" stroke-width="3" fill="none" />
  </g>
  <text x="155" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
    <tspan x="155" dy="0"><tspan font-family="monospace" font-weight="bold">df -h</tspan>: 100% used</tspan>
    <tspan x="155" dy="38" font-size="24">(counts the blocks)</tspan>
  </text>

  
  <rect x="825" y="480" width="737" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(855, 526)">
    <path d="M4,10 L20,10 L26,16 L52,16 A4,4 0 0 1 56,20 L56,46 A4,4 0 0 1 52,50 L4,50 A4,4 0 0 1 0,46 L0,14 A4,4 0 0 1 4,10 Z" stroke="#207448" stroke-width="3.5" fill="none" />
    <circle cx="36" cy="36" r="8" stroke="#207448" stroke-width="3" fill="#ffffff" />
    <line x1="42" y1="42" x2="50" y2="50" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="930" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
    <tspan x="930" dy="0"><tspan font-family="monospace" font-weight="bold">du</tspan>: finds nothing</tspan>
    <tspan x="930" dy="34" font-size="24">(walks directory names,</tspan>
    <tspan x="930" dy="30" font-size="24">and the name is gone)</tspan>
  </text>

  

  <rect x="41" y="660" width="1521" height="270" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="678" width="1473" height="70" rx="6" fill="#ffffff" stroke="#b8d5c2" stroke-width="1.5" />
  <g transform="translate(90, 693)">
    <rect x="0" y="0" width="38" height="38" rx="4" stroke="#207448" stroke-width="3" fill="none" />
    <path d="M8,12 L16,19 L8,26" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="20" y1="26" x2="30" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="150" y="722" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">sudo lsof +L1</tspan>
    <tspan> lists deleted files still held open</tspan>
  </text>

  
  <rect x="65" y="760" width="1473" height="70" rx="6" fill="#ffffff" stroke="#b8d5c2" stroke-width="1.5" />
  <g transform="translate(90, 775)">
    <rect x="0" y="0" width="38" height="38" rx="4" stroke="#207448" stroke-width="3" fill="none" />
    <line x1="8" y1="11" x2="30" y2="11" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="19" x2="30" y2="19" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="27" x2="22" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="150" y="804" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">ls -l /proc/PID/fd</tspan>
    <tspan> shows the (deleted) marker</tspan>
  </text>

  
  <rect x="65" y="842" width="1473" height="70" rx="6" fill="#ffffff" stroke="#b8d5c2" stroke-width="1.5" />
  <g transform="translate(90, 857)">
    <path d="M30,5 A14,14 0 0 0 11,19 L3,27 A4,4 0 0 0 8,32 L16,24 A14,14 0 0 0 30,5 Z" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="150" y="886" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">fix: </tspan>
    <tspan>restart the holder, or truncate through </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">/proc/PID/fd/N</tspan>
  </text>

  

  <rect x="41" y="960" width="1521" height="90" rx="10" fill="#207448" />
  
  <g transform="translate(70, 982)">
    <path d="M0,8 L20,0 L40,8 L40,26 C40,38 20,46 20,46 C20,46 0,38 0,26 Z" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linejoin="round" />
    <polyline points="12,23 18,29 28,17" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="135" y="1015" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    Blocks are freed only when the link count is zero AND no process has the file open
  </text>
</svg>