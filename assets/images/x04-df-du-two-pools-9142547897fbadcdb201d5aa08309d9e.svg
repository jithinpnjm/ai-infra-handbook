    <text x="145" y="605" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="30" font-weight="bold" fill="#303a36">df -h</text>
    
    
    <text x="305" y="645" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="305" dy="0">counts bytes used by blocks,</tspan>
      <tspan x="305" dy="32">and free bytes</tspan>
    </text>
  </g>

  
  <g id="df-i-box">
