    <text x="800" y="971" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Count bytes and inodes separately, then ask who still holds deleted files.</text>
