<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Two pools on one disk: blocks and inodes, counted by df and du</title>
  <desc>Infographic explaining the two distinct pools of a filesystem—data blocks and inodes—and how df -h, df -i, and du inspect them differently.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5" />

  
