      <line x1="0" y1="10" x2="44" y2="10" stroke="#207448" stroke-width="2" />
      <path d="M 8 18 L 13 21 L 8 24" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="17" y1="24" x2="24" y2="24" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    </g>

    
    <text x="145" y="785" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="30" font-weight="bold" fill="#303a36">du</text>
    
    
    <text x="600" y="825" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
