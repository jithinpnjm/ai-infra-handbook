<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Combining static and dynamic sources in one inventory directory</title>
  <desc>Architecture infographic illustrating how Ansible merges static inventory files, dynamic scripts, and cloud plugins into a unified host list.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Combining static and dynamic sources</tspan>
    <tspan x="800" dy="54">in one inventory directory</tspan>
  </text>

  
  <rect x="50" y="150" width="760" height="420" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <path d="M 75 198 L 75 174 C 75 170 78 167 82 167 L 102 167 L 114 179 L 135 179 C 139 179 142 172 142 176 L 142 198 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <path d="M 75 183 L 142 183 L 138 214 C 137 218 134 221 130 221 L 87 221 C 83 221 80 218 79 214 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

  
  <text x="156" y="202" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">inventory/</text>
  <text x="75" y="250" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">inventory = inventory in ansible.cfg</text>
  <text x="75" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(so no -i flag on every command)</text>

  
  
  <rect x="75" y="300" width="235" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 87 312 L 101 312 L 109 320 L 109 340 L 87 340 Z" fill="none" stroke="#207448" stroke-width="2" />
  <polyline points="101,312 101,320 109,320" fill="none" stroke="#207448" stroke-width="2" />
  <text x="119" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">static files</text>

  
  <rect x="75" y="362" width="235" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 88 382 L 95 388 L 88 394" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="99" y1="394" x2="108" y2="394" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <text x="119" y="396" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">vagrant.py</text>

  
  <rect x="75" y="424" width="235" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 87 444 L 87 434 L 97 434 L 102 439 L 109 439 L 109 460 L 87 460 Z" fill="none" stroke="#207448" stroke-width="2" />
  <text x="119" y="458" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">group_vars/</text>

  
  <rect x="75" y="486" width="235" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 87 506 L 87 496 L 97 496 L 102 501 L 109 501 L 109 522 L 87 522 Z" fill="none" stroke="#207448" stroke-width="2" />
  <text x="119" y="520" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">host_vars/</text>

  
  
  <rect x="325" y="300" width="465" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 342 342 C 339 342 336 339 336 335 C 336 331 339 328 343 328 C 344 324 348 321 353 321 C 358 321 362 324 363 328 C 366 328 369 331 369 335 C 369 339 366 342 362 342 Z" fill="none" stroke="#207448" stroke-width="2" />
  <text x="380" y="330" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">aws_ec2.yml</text>
  <text x="380" y="358" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(plugin: aws_ec2)</text>

  
  <rect x="325" y="380" width="465" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 342 422 C 339 422 336 419 336 415 C 336 411 339 408 343 408 C 344 404 348 401 353 401 C 358 401 362 404 363 408 C 366 408 369 411 369 415 C 369 419 366 422 362 422 Z" fill="none" stroke="#207448" stroke-width="2" />
  <text x="380" y="410" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">gcp.yml</text>
  <text x="380" y="438" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(plugin: gcp_compute)</text>

  
  <rect x="325" y="460" width="465" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <path d="M 342 510 C 339 510 336 507 336 503 C 336 499 339 496 343 496 C 344 492 348 489 353 489 C 358 489 362 492 363 496 C 366 496 369 499 369 503 C 369 507 366 510 362 510 Z" fill="none" stroke="#207448" stroke-width="2" />
  <text x="380" y="488" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">azure_rm.yml</text>
  <text x="380" y="516" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(plugin: azure_rm,</text>
  <text x="380" y="544" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"> plain_host_names: true)</text>

  
  <text x="990" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">Ansible runs and</tspan>
    <tspan x="990" dy="32">merges every static</tspan>
    <tspan x="990" dy="32">file, dynamic script</tspan>
    <tspan x="990" dy="32">and inventory plugin</tspan>
    <tspan x="990" dy="32">in that directory into</tspan>
    <tspan x="990" dy="32">one unified inventory</tspan>
  </text>
  <line x1="810" y1="430" x2="1152" y2="430" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <polygon points="1152,421 1170,430 1152,439" fill="#207448" />

  
  <rect x="1170" y="150" width="380" height="420" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <circle cx="1360" cy="225" r="30" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="1360" cy="225" r="18" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="1360" cy="225" r="6" fill="#207448" />

  <text x="1360" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1360" dy="0">one list the</tspan>
    <tspan x="1360" dy="42">playbooks can</tspan>
    <tspan x="1360" dy="42">target</tspan>
  </text>

  
  <rect x="50" y="590" width="1500" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 85 615 L 110 605 L 135 615 L 135 645 C 135 662 110 673 110 673 C 110 673 85 662 85 645 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <circle cx="110" cy="633" r="5" fill="#207448" />
  <path d="M 110 638 L 110 651" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="160" y="632" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">workload identity, instance profiles or environment credentials;</text>
  <text x="160" y="666" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">keep plugin configs free of secrets</text>

  
  <rect x="50" y="705" width="1500" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="75" y="745" width="56" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="87" y="757" width="32" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="83" y1="737" x2="83" y2="745" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="103" y1="737" x2="103" y2="745" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="123" y1="737" x2="123" y2="745" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="83" y1="801" x2="83" y2="809" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="103" y1="801" x2="103" y2="809" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="123" y1="801" x2="123" y2="809" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="67" y1="755" x2="75" y2="755" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="67" y1="773" x2="75" y2="773" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="67" y1="791" x2="75" y2="791" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="131" y1="755" x2="139" y2="755" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="131" y1="773" x2="139" y2="773" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="131" y1="791" x2="139" y2="791" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  <text x="150" y="754" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a cluster that runs most GPUs on premises and rents extra capacity from a cloud during peaks:</text>
  <text x="150" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan>a static inventory for on-prem hardware plus </tspan>
    <tspan fill="#db8129" font-weight="bold">a cloud plugin for burst capacity</tspan>
    <tspan>;</tspan>
  </text>
  <text x="150" y="838" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a constructed plugin derives uniform groups such as gpu and login whatever the source</text>

  
  <rect x="50" y="905" width="1500" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="75" y="920" width="680" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <path d="M 95 955 L 115 950 L 135 955 L 135 995 L 115 990 L 95 995 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <line x1="115" y1="950" x2="115" y2="990" stroke="#207448" stroke-width="3" />
  <text x="150" y="960" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">a static file is a printed phone</tspan>
    <tspan x="150" dy="34">directory, accurate the day</tspan>
    <tspan x="150" dy="34">it was printed;</tspan>
  </text>

  
  <rect x="775" y="920" width="750" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="810" cy="955" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 796 985 C 796 974 804 972 810 972 C 816 972 824 974 824 985" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="832" cy="978" r="8" fill="none" stroke="#207448" stroke-width="2.5" />
  <line x1="838" y1="984" x2="846" y2="992" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <text x="865" y="976" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="865" dy="0">a dynamic inventory is a clerk who</tspan>
    <tspan x="865" dy="38">looks up the roster each time</tspan>
  </text>

  
  <rect x="50" y="1095" width="1500" height="70" rx="8" fill="#207448" />
  <text x="800" y="1139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The work moves from keeping a file correct to keeping the source correct</text>
</svg>