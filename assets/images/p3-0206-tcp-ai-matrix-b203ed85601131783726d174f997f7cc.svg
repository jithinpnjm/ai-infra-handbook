<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Where TCP limits each AI workload</title>
  <desc>Where TCP limits each AI workload</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Where TCP limits each AI workload</text>

  
  <rect x="370" y="85" width="305" height="48" rx="6" fill="#207448" />
  <text x="522" y="118" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">How it uses TCP</text>

  <rect x="690" y="85" width="570" height="48" rx="6" fill="#207448" />
  <text x="975" y="118" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">What limits it</text>

  <rect x="1275" y="85" width="295" height="48" rx="6" fill="#207448" />
  <text x="1422" y="118" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Usual fixes</text>

  
  <g>
    
    <rect x="30" y="145" width="325" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(165, 175)">
      <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="20" height="20" rx="2" fill="#207448" />
      <line x1="18" y1="0" x2="18" y2="8" stroke="#207448" stroke-width="4" />
      <line x1="38" y1="0" x2="38" y2="8" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="48" x2="18" y2="56" stroke="#207448" stroke-width="4" />
      <line x1="38" y1="48" x2="38" y2="56" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="18" x2="8" y2="18" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="38" x2="8" y2="38" stroke="#207448" stroke-width="4" />
      <line x1="48" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="4" />
      <line x1="48" y1="38" x2="56" y2="38" stroke="#207448" stroke-width="4" />
    </g>
    <text x="192" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">NCCL</text>

    
    <rect x="370" y="145" width="305" height="230" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="386" y="195" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="386" dy="0">bootstrap (rank</tspan>
      <tspan x="386" dy="28">exchange) and a</tspan>
      <tspan x="386" dy="28">fallback transport</tspan>
      <tspan x="386" dy="28">when no IB or</tspan>
      <tspan x="386" dy="28">RoCE is available</tspan>
    </text>

    
    <rect x="690" y="145" width="570" height="230" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="706" y="177" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="706" dy="0"><tspan font-family="monospace">NCCL_SOCKET_IFNAME</tspan>, sockets per</tspan>
      <tspan x="706" dy="26">connection (<tspan font-family="monospace">NCCL_SOCKET_NTHREADS</tspan>,</tspan>
      <tspan x="706" dy="26"><tspan font-family="monospace">NCCL_NSOCKS_PERTHREAD</tspan>),</tspan>
      <tspan x="706" dy="26"><tspan font-family="monospace">TCP_NODELAY</tspan>, buffer sizes,</tspan>
      <tspan x="706" dy="26">IRQ affinity, MTU; throughput</tspan>
      <tspan x="706" dy="26">far below RDMA because every byte</tspan>
      <tspan x="706" dy="26">passes through kernel copies</tspan>
      <tspan x="706" dy="26">and costs CPU</tspan>
    </text>

    
    <rect x="1275" y="145" width="295" height="230" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="1291" y="245" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1291" dy="0">GPUDirect RDMA</tspan>
      <tspan x="1291" dy="30">(Part 11)</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="30" y="385" width="325" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(164, 395)">
      <ellipse cx="28" cy="10" rx="26" ry="7" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 2 10 V 24 C 2 31 54 31 54 24 V 10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 2 24 V 38 C 2 45 54 45 54 38 V 24" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="192" y="462" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="192" dy="0">Data loading and</tspan>
      <tspan x="192" dy="26">checkpoint I/O</tspan>
      <tspan x="192" dy="26">over NFS, S3</tspan>
      <tspan x="192" dy="26">or HTTP</tspan>
    </text>

    
    <rect x="370" y="385" width="305" height="170" rx="8" fill="#e8f1ea" fill-opacity="0.35" stroke="#d0ded2" stroke-width="1.5" />

    
    <rect x="690" y="385" width="570" height="170" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="706" y="455" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="706" dy="0">window and BDP on long paths; CPU on</tspan>
      <tspan x="706" dy="30">100G+ links without offloads</tspan>
    </text>

    
    <rect x="1275" y="385" width="295" height="170" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="1291" y="425" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1291" dy="0">parallel streams,</tspan>
      <tspan x="1291" dy="28">large MTU on</tspan>
      <tspan x="1291" dy="28">internal</tspan>
      <tspan x="1291" dy="28">networks, tuned</tspan>
      <tspan x="1291" dy="28">buffers</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="30" y="565" width="325" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(164, 575)">
      <rect x="4" y="6" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="15" r="2.5" fill="#207448" />
      <line x1="24" y1="15" x2="44" y2="15" stroke="#207448" stroke-width="3" />
      <rect x="4" y="30" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="39" r="2.5" fill="#207448" />
      <line x1="24" y1="39" x2="44" y2="39" stroke="#207448" stroke-width="3" />
    </g>
    <text x="192" y="642" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="192" dy="0">Inference</tspan>
      <tspan x="192" dy="30">serving over</tspan>
      <tspan x="192" dy="30">HTTP/2 and gRPC</tspan>
    </text>

    
    <rect x="370" y="565" width="305" height="155" rx="8" fill="#e8f1ea" fill-opacity="0.35" stroke="#d0ded2" stroke-width="1.5" />

    
    <rect x="690" y="565" width="570" height="155" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="706" y="597" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="706" dy="0">connection reuse, keepalive settings,</tspan>
      <tspan x="706" dy="26">load balancer idle timeouts, Nagle</tspan>
      <tspan x="706" dy="26">with delayed ACK, and head-of-line</tspan>
      <tspan x="706" dy="26">blocking: a lost packet stalls every</tspan>
      <tspan x="706" dy="26">stream on the connection</tspan>
    </text>

    
    <rect x="1275" y="565" width="295" height="155" rx="8" fill="#e8f1ea" fill-opacity="0.35" stroke="#d0ded2" stroke-width="1.5" />
  </g>

  
  <g>
    
    <rect x="30" y="730" width="325" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(164, 742)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="6" fill="#207448" />
      <line x1="28" y1="2" x2="28" y2="54" stroke="#207448" stroke-width="4" />
      <line x1="6" y1="15" x2="50" y2="41" stroke="#207448" stroke-width="4" />
      <line x1="6" y1="41" x2="50" y2="15" stroke="#207448" stroke-width="4" />
    </g>
    <text x="192" y="845" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Kubernetes</text>

    
    <rect x="370" y="730" width="305" height="155" rx="8" fill="#e8f1ea" fill-opacity="0.35" stroke="#d0ded2" stroke-width="1.5" />

    
    <rect x="690" y="730" width="570" height="155" rx="8" fill="#e8f1ea" stroke="#d0ded2" stroke-width="1.5" />
    <text x="706" y="762" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="706" dy="0">overlays can shrink the MTU,</tspan>
      <tspan x="706" dy="26">conntrack and kube-proxy NAT keep</tspan>
      <tspan x="706" dy="26">state and timeouts, service load</tspan>
      <tspan x="706" dy="26">balancing can reset long-lived</tspan>
      <tspan x="706" dy="26">connections when endpoints change</tspan>
    </text>

    
    <rect x="1275" y="730" width="295" height="155" rx="8" fill="#e8f1ea" fill-opacity="0.35" stroke="#d0ded2" stroke-width="1.5" />
  </g>

  
  <g>
    
    <rect x="30" y="895" width="325" height="160" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(164, 908)">
      <circle cx="28" cy="30" r="22" fill="none" stroke="#db8129" stroke-width="4" />
      <polyline points="28,16 28,30 38,30" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="2" x2="28" y2="8" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="12" y1="5" x2="16" y2="10" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="44" y1="5" x2="40" y2="10" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="192" y="990" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="192" dy="0">Incast and</tspan>
      <tspan x="192" dy="30">tail latency</tspan>
    </text>

    
    <rect x="370" y="895" width="305" height="160" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
    <text x="386" y="935" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="386" dy="0">many-to-one bursts</tspan>
      <tspan x="386" dy="28">and synchronized</tspan>
      <tspan x="386" dy="28">all-reduce barrier</tspan>
      <tspan x="386" dy="28">waits</tspan>
    </text>

    
    <rect x="690" y="895" width="570" height="160" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
    <text x="706" y="960" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="706" dy="0">a single 200 ms RTO costs hundreds</tspan>
      <tspan x="706" dy="30">of milliseconds of GPU idle per step</tspan>
    </text>

    
    <rect x="1275" y="895" width="295" height="160" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
    <text x="1291" y="960" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1291" dy="0">see the</tspan>
      <tspan x="1291" dy="30">incast figure</tspan>
    </text>
  </g>

  
  <rect x="30" y="1080" width="1540" height="70" rx="8" fill="#207448" />
  <text x="800" y="1124" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Capture <tspan font-family="monospace">TCPTimeouts</tspan> and retransmit rates during any training job that uses socket transports</text>
</svg>