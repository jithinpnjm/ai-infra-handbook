<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Router Advertisement flags: which flag decides where the host gets its address</title>
  <desc>Visual decision tree and architectural guide explaining IPv6 Router Advertisement flags (A, M, O), DAD sequence verification, deployment environments, and security guarding.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="58" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">
    <tspan x="40" dy="0">Router Advertisement flags:</tspan>
    <tspan x="40" dy="56" fill="#207448">which flag decides where the host gets its address</tspan>
  </text>

  
  
  <g id="dad-sequence">
    <rect x="40" y="145" width="870" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 185)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="20" r="14" />
      <path d="M 40 32 L 52 44" />
      <path d="M 8 20 L 0 20" />
      <path d="M 28 0 L 28 6" />
      <path d="M 20 20 L 36 20" />
      <path d="M 28 12 L 28 28" />
    </g>
    <text x="140" y="182" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="140" dy="0" font-weight="bold" fill="#207448">DAD before any address is used:</tspan>
      <tspan dx="8">host sends an NS</tspan>
      <tspan x="140" dy="32">for the address from ::; if an NA arrives, or</tspan>
      <tspan x="140" dy="32">another host's DAD NS, the address is a duplicate</tspan>
      <tspan x="140" dy="32">and is not used</tspan>
    </text>
  </g>

  
  <g id="dad-warning">
    <rect x="930" y="145" width="630" height="150" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
    
    <g transform="translate(955, 190)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 26 4 L 50 46 L 2 46 Z" />
      <line x1="26" y1="18" x2="26" y2="30" />
      <circle cx="26" cy="38" r="2" fill="#db8129" stroke="none" />
    </g>
    <text x="1025" y="182" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="1025" dy="0">looping switches can reflect the host's</tspan>
      <tspan x="1025" dy="32">own NS and cause false positives;</tspan>
      <tspan x="1025" dy="32" font-weight="bold" fill="#db8129">enhanced DAD uses a nonce to</tspan>
      <tspan x="1025" dy="32" font-weight="bold" fill="#db8129">detect self-reflection</tspan>
    </text>
  </g>

  
  <g id="tree-root">
    <rect x="40" y="325" width="1010" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(65, 352)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="12" width="52" height="32" rx="6" />
      <line x1="14" y1="28" x2="42" y2="28" />
      <polyline points="20,22 14,28 20,34" />
      <polyline points="36,22 42,28 36,34" />
      <line x1="14" y1="12" x2="14" y2="4" />
      <line x1="42" y1="12" x2="42" y2="4" />
    </g>
    <text x="145" y="368" font-family="sans-serif">
      <tspan x="145" dy="0" font-size="30" font-weight="bold" fill="#207448">Router Advertisement (type 134) received:</tspan>
      <tspan x="145" dy="38" font-size="24" fill="#303a36">prefix, default gateway lifetime, MTU, flags</tspan>
    </text>
  </g>

  
  
  <line x1="195" y1="435" x2="195" y2="538" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <line x1="545" y1="435" x2="545" y2="538" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <line x1="895" y1="435" x2="895" y2="538" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <g id="branch-1-label">
    <rect x="75" y="455" width="240" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="195" y="480" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448" font-family="sans-serif">
      <tspan x="195" dy="0">A flag set on</tspan>
      <tspan x="195" dy="26">a /64 prefix</tspan>
    </text>
  </g>

  
  <g id="branch-2-label">
    <rect x="445" y="462" width="200" height="46" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="545" y="494" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448" font-family="sans-serif">M flag set</text>
  </g>

  
  <g id="branch-3-label">
    <rect x="795" y="462" width="200" height="46" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="895" y="494" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448" font-family="sans-serif">O flag set</text>
  </g>

  
  
  <g id="branch-1-result">
    <rect x="40" y="540" width="310" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(167, 560)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="36" rx="4" />
      <line x1="16" y1="44" x2="16" y2="52" />
      <line x1="40" y1="44" x2="40" y2="52" />
      <circle cx="28" cy="26" r="8" />
    </g>
    <text x="195" y="645" font-size="24" text-anchor="middle" fill="#303a36" font-family="sans-serif">
      <tspan x="195" dy="0">host builds a global</tspan>
      <tspan x="195" dy="32" font-weight="bold" fill="#207448">address with SLAAC</tspan>
      <tspan x="195" dy="32">from the prefix and</tspan>
      <tspan x="195" dy="32">its interface ID</tspan>
    </text>
  </g>

  
  <g id="branch-2-result">
    <rect x="390" y="540" width="310" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(517, 560)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="18" rx="3" />
      <rect x="6" y="28" width="44" height="18" rx="3" />
      <line x1="14" y1="15" x2="18" y2="15" />
      <line x1="14" y1="37" x2="18" y2="37" />
    </g>
    <text x="545" y="655" font-size="24" text-anchor="middle" fill="#303a36" font-family="sans-serif">
      <tspan x="545" dy="0">host asks a</tspan>
      <tspan x="545" dy="32" font-weight="bold" fill="#207448">DHCPv6 server</tspan>
      <tspan x="545" dy="32">for addresses</tspan>
    </text>
  </g>

  
  <g id="branch-3-result">
    <rect x="740" y="540" width="310" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(867, 560)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 16" />
      <path d="M 28 40 L 28 50" />
      <path d="M 6 28 L 16 28" />
      <path d="M 40 28 L 50 28" />
    </g>
    <text x="895" y="655" font-size="24" text-anchor="middle" fill="#303a36" font-family="sans-serif">
      <tspan x="895" dy="0">host asks DHCPv6</tspan>
      <tspan x="895" dy="32" font-weight="bold" fill="#207448">for other options,</tspan>
      <tspan x="895" dy="32">such as DNS</tspan>
    </text>
  </g>

  
  
  <g id="side-fact-1">
    <rect x="40" y="830" width="485" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(65, 860)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 28 A 10 10 0 0 1 28 18 L 38 18 A 10 10 0 0 1 38 38 L 28 38" />
      <path d="M 38 28 A 10 10 0 0 1 28 38 L 18 38 A 10 10 0 0 1 18 18 L 28 18" />
      <line x1="22" y1="28" x2="34" y2="28" />
    </g>
    <text x="140" y="875" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="140" dy="0" font-weight="bold" fill="#207448">default gateway is the</tspan>
      <tspan x="140" dy="32" font-weight="bold" fill="#207448">router's link-local address,</tspan>
      <tspan x="140" dy="32">so the route survives</tspan>
      <tspan x="140" dy="32">renumbering</tspan>
    </text>
  </g>

  
  <g id="side-fact-2">
    <rect x="565" y="830" width="485" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(590, 860)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,28" />
    </g>
    <text x="665" y="875" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="665" dy="0" font-weight="bold" fill="#207448">preferred and valid</tspan>
      <tspan x="665" dy="32" font-weight="bold" fill="#207448">lifetimes decide when an</tspan>
      <tspan x="665" dy="32">address is deprecated</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    <rect x="1080" y="325" width="480" height="725" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 1080 337 A 12 12 0 0 1 1092 325 L 1548 325 A 12 12 0 0 1 1560 337 L 1560 395 L 1080 395 Z" fill="#e8f1ea" />
    <text x="1320" y="372" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448" font-family="sans-serif">Where each is used</text>

    
    <g id="item-datacentres">
      <rect x="1100" y="415" width="440" height="190" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(1120, 440)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="40" height="14" rx="2" />
        <rect x="4" y="24" width="40" height="14" rx="2" />
        <circle cx="12" cy="13" r="2" fill="#207448" stroke="none" />
        <circle cx="12" cy="31" r="2" fill="#207448" stroke="none" />
      </g>
      <text x="1185" y="455" font-size="24" fill="#303a36" font-family="sans-serif">
        <tspan x="1185" dy="0">data centres often</tspan>
        <tspan x="1185" dy="32" font-weight="bold" fill="#207448">disable RA and SLAAC</tspan>
        <tspan x="1185" dy="32">and use static or</tspan>
        <tspan x="1185" dy="32">DHCPv6</tspan>
      </text>
    </g>

    
    <g id="item-cloud-vms">
      <rect x="1100" y="625" width="440" height="205" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(1120, 650)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12 36 A 12 12 0 0 1 20 16 A 16 16 0 0 1 42 20 A 10 10 0 0 1 42 36 Z" />
        <line x1="6" y1="46" x2="48" y2="46" />
      </g>
      <text x="1185" y="660" font-size="24" fill="#303a36" font-family="sans-serif">
        <tspan x="1185" dy="0">cloud VMs, laptops</tspan>
        <tspan x="1185" dy="32">and Kubernetes pods</tspan>
        <tspan x="1185" dy="32" font-weight="bold" fill="#207448">often learn their IPv6</tspan>
        <tspan x="1185" dy="32" font-weight="bold" fill="#207448">gateway from RA</tspan>
      </text>
    </g>

    
    <g id="item-ra-guard">
      <rect x="1100" y="850" width="440" height="180" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(1120, 875)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 24 6 L 44 14 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 14 Z" />
      </g>
      <text x="1185" y="890" font-size="24" fill="#303a36" font-family="sans-serif">
        <tspan x="1185" dy="0" font-weight="bold" fill="#207448">RA guard on switch</tspan>
        <tspan x="1185" dy="32">ports blocks rogue</tspan>
        <tspan x="1185" dy="32">router advertisements</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1080" width="1520" height="85" rx="10" fill="#207448" />
    <text x="800" y="1116" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">
      <tspan x="800" dy="0">For each network, choose RA with SLAAC or static and DHCPv6 addressing,</tspan>
      <tspan x="800" dy="32">and guard the switch ports against rogue RAs</tspan>
    </text>
  </g>
</svg>