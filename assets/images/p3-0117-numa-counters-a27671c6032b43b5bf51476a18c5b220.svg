<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Reading numactl and numastat: where did the pages land</title>
  <desc>Visual infographic explaining NUMA node distances from numactl and memory allocation counters from numastat.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading numactl and numastat: where did the pages land</text>

  
  <g id="left-panel">
    <rect x="50" y="105" width="530" height="555" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(75, 128)">
      <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3"/>
      
      <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="2" x2="40" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="48" x2="16" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="48" x2="40" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="54" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="40" x2="54" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="148" y="152" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="148" dy="0">numactl --hardware</tspan>
      <tspan x="148" dy="36">node distances</tspan>
    </text>

    
    <g transform="translate(145, 235)">
      
      <rect x="0" y="0" width="160" height="95" rx="8" fill="#d8e9dc" stroke="#207448" stroke-width="3"/>
      <text x="80" y="59" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#207448">10</text>

      <rect x="180" y="0" width="160" height="95" rx="8" fill="#fcebd9" stroke="#db8129" stroke-width="3"/>
      <text x="260" y="59" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#db8129">21</text>

      
      <rect x="0" y="110" width="160" height="95" rx="8" fill="#fcebd9" stroke="#db8129" stroke-width="3"/>
      <text x="80" y="169" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#db8129">21</text>

      <rect x="180" y="110" width="160" height="95" rx="8" fill="#d8e9dc" stroke="#207448" stroke-width="3"/>
      <text x="260" y="169" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#207448">10</text>
    </g>

    
    <rect x="75" y="480" width="480" height="150" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="2"/>
    <text x="315" y="546" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="315" dy="0" font-weight="bold" fill="#207448">10 = local,</tspan>
      <tspan x="315" dy="38" font-weight="bold" fill="#db8129">21 = about 2.1x remote cost</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    <rect x="610" y="105" width="940" height="555" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(635, 128)">
      <path d="M 8 38 A 20 20 0 1 1 48 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="36" x2="40" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="36" r="4" fill="#207448"/>
      <line x1="8" y1="48" x2="48" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="705" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">numastat counters</text>

    
    
    <g id="card-numa-hit" transform="translate(635, 205)">
      <rect x="0" y="0" width="435" height="210" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(145, 16)">
        <rect x="0" y="8" width="60" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <rect x="85" y="8" width="60" height="34" rx="6" fill="#f5f8f5" stroke="#a0b8a8" stroke-width="2"/>
        
        <path d="M 12 6 C 12 -8, 48 -8, 48 4" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
      </g>
      <text x="22" y="98" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="22" dy="0" font-family="monospace" font-weight="bold" fill="#207448">numa_hit:</tspan>
        <tspan x="22" dy="32">allocation landed on the</tspan>
        <tspan x="22" dy="32">node it was meant for</tspan>
      </text>
    </g>

    
    <g id="card-numa-miss" transform="translate(1090, 205)">
      <rect x="0" y="0" width="435" height="210" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(145, 16)">
        <rect x="0" y="8" width="60" height="34" rx="6" fill="#f5f8f5" stroke="#a0b8a8" stroke-width="2"/>
        <rect x="85" y="8" width="60" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        
        <line x1="62" y1="25" x2="81" y2="25" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-slate)"/>
      </g>
      <text x="22" y="82" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="22" dy="0" font-family="monospace" font-weight="bold" fill="#207448">numa_miss:</tspan>
        <tspan x="22" dy="30">landed here although another</tspan>
        <tspan x="22" dy="30">node was intended, because</tspan>
        <tspan x="22" dy="30">that node was full</tspan>
      </text>
    </g>

    
    <g id="card-numa-foreign" transform="translate(635, 430)">
      <rect x="0" y="0" width="435" height="210" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(145, 16)">
        <rect x="0" y="8" width="60" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <rect x="85" y="8" width="60" height="34" rx="6" fill="#f5f8f5" stroke="#a0b8a8" stroke-width="2"/>
        
        <line x1="62" y1="25" x2="81" y2="25" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-slate)"/>
      </g>
      <text x="22" y="98" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="22" dy="0" font-family="monospace" font-weight="bold" fill="#207448">numa_foreign:</tspan>
        <tspan x="22" dy="32">intended here but</tspan>
        <tspan x="22" dy="32">landed elsewhere</tspan>
      </text>
    </g>

    
    <g id="card-other-node" transform="translate(1090, 430)">
      <rect x="0" y="0" width="435" height="210" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(145, 16)">
        <rect x="0" y="8" width="60" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <rect x="85" y="8" width="60" height="34" rx="6" fill="#f5f8f5" stroke="#a0b8a8" stroke-width="2"/>
        
        <line x1="83" y1="25" x2="64" y2="25" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-slate)"/>
      </g>
      <text x="22" y="82" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="22" dy="0" font-family="monospace" font-weight="bold" fill="#207448">other_node:</tspan>
        <tspan x="22" dy="30">a process allocated a page</tspan>
        <tspan x="22" dy="30">while running on a different</tspan>
        <tspan x="22" dy="30">node than the page's</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-strip">
    <rect x="50" y="680" width="1500" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(75, 695)">
      <circle cx="14" cy="27" r="10" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="42" cy="27" r="10" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="24" y1="27" x2="32" y2="27" stroke="#207448" stroke-width="4"/>
    </g>

    <text x="145" y="718" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">If numa_miss or other_node rises while a workload runs,</tspan>
      <tspan x="145" dy="32">pages are being placed remotely and traffic crosses sockets</tspan>
    </text>
  </g>

  
  <g id="note-strip">
    <rect x="50" y="785" width="1500" height="85" rx="10" fill="#ffffff" stroke="#b8d0c0" stroke-width="2"/>

    
    <g transform="translate(75, 800)">
      <rect x="6" y="6" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="32" y="6" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="6" y="32" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="32" y="32" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="145" y="823" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">Many CPUs present several NUMA nodes per socket (sub-NUMA clustering or NPS modes):</tspan>
      <tspan x="145" dy="32">a 2-socket server can show 2, 4 or 8 nodes</tspan>
    </text>
  </g>

  
  <g id="tool-strip">
    <rect x="50" y="890" width="1500" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(80, 905)">
      <rect x="0" y="0" width="430" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="215" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">lscpu</text>
    </g>
    <g transform="translate(540, 905)">
      <rect x="0" y="0" width="450" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="225" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">numactl --hardware</text>
    </g>
    <g transform="translate(1020, 905)">
      <rect x="0" y="0" width="500" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="250" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">lstopo --of ascii</text>
    </g>

    
    <g transform="translate(80, 962)">
      <rect x="0" y="0" width="430" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="215" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">numastat -m</text>
    </g>
    <g transform="translate(540, 962)">
      <rect x="0" y="0" width="450" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="225" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">nvidia-smi topo -m</text>
    </g>
    <g transform="translate(1020, 962)">
      <rect x="0" y="0" width="500" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="250" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">numastat -p PID</text>
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1045" width="1500" height="75" rx="10" fill="#207448"/>
    <text x="800" y="1092" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Run these on every new platform before you trust a habit</text>
  </g>
</svg>