<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Fixed window: 20 requests in 10 milliseconds across a boundary</title>
  <desc>Visual infographic explaining how a fixed window rate limiter allows a 20-request burst across the window reset boundary within 10 milliseconds.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Fixed window: 20 requests</tspan>
    <tspan x="800" dy="58">in 10 milliseconds across a boundary</tspan>
  </text>

  
  <text x="800" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">window reset</text>

  
  
  <rect x="120" y="180" width="680" height="300" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(145, 198)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="7" r="2.5" fill="#207448"/>
    <circle cx="18" cy="7" r="2.5" fill="#207448"/>
    <circle cx="26" cy="7" r="2.5" fill="#207448"/>
  </g>
  <text x="215" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">window one</text>

  
  <rect x="800" y="180" width="680" height="300" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(825, 198)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="7" r="2.5" fill="#207448"/>
    <circle cx="18" cy="7" r="2.5" fill="#207448"/>
    <circle cx="26" cy="7" r="2.5" fill="#207448"/>
  </g>
  <text x="895" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">window two</text>

  
  <line x1="130" y1="330" x2="1470" y2="330" stroke="#207448" stroke-width="2" stroke-dasharray="10,8" opacity="0.6"/>
  <text x="145" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#207448">limit 10</text>

  
  <line x1="800" y1="175" x2="800" y2="500" stroke="#303a36" stroke-width="3" stroke-dasharray="6,4"/>

  
  <g>
    
    <g transform="translate(660, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(685, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(710, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(735, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(760, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    
    <g transform="translate(660, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(685, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(710, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(735, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(760, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <text x="710" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    10 requests at <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.99</tspan>
  </text>

  
  <g>
    
    <g transform="translate(840, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(865, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(890, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(915, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(940, 350)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    
    <g transform="translate(840, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(865, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(890, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(915, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(940, 380)"><circle cx="0" cy="0" r="10" fill="#207448"/><path d="M -3 0 L -1 3 L 4 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <text x="890" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    10 requests at <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.0</tspan>
  </text>

  
  <path d="M 650 330 L 650 310 L 800 310 L 800 295 L 800 310 L 950 310 L 950 330" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    within <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10 milliseconds</tspan>
  </text>

  
  <line x1="120" y1="500" x2="1480" y2="500" stroke="#303a36" stroke-width="3"/>
  
  <line x1="120" y1="495" x2="120" y2="515" stroke="#303a36" stroke-width="3"/>
  <text x="120" y="542" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#303a36">0.9</text>

  <line x1="800" y1="490" x2="800" y2="515" stroke="#303a36" stroke-width="3"/>
  <text x="800" y="542" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#303a36">1.0</text>

  <line x1="1480" y1="495" x2="1480" y2="515" stroke="#303a36" stroke-width="3"/>
  <text x="1480" y="542" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#303a36">1.1</text>

  
  <rect x="120" y="570" width="1360" height="285" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="135" y="585" width="1330" height="58" rx="8" fill="#ffffff"/>
  <text x="160" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">sliding log</text>
  <line x1="420" y1="595" x2="420" y2="633" stroke="#e8f1ea" stroke-width="2"/>
  <text x="450" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">lets exactly 10 through in any window</text>

  
  <rect x="135" y="650" width="1330" height="58" rx="8" fill="#ffffff"/>
  <text x="160" y="687" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">sliding counter</text>
  <line x1="420" y1="660" x2="420" y2="698" stroke="#e8f1ea" stroke-width="2"/>
  <text x="450" y="687" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">lets at most 11 in the test</text>

  
  <rect x="135" y="715" width="1330" height="58" rx="8" fill="#ffffff"/>
  <text x="160" y="752" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">token bucket</text>
  <line x1="420" y1="725" x2="420" y2="763" stroke="#e8f1ea" stroke-width="2"/>
  <text x="450" y="752" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">allows a burst up to bucket size</text>

  
  <rect x="135" y="780" width="1330" height="58" rx="8" fill="#ffffff"/>
  <text x="160" y="817" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">fixed window</text>
  <line x1="420" y1="790" x2="420" y2="828" stroke="#e8f1ea" stroke-width="2"/>
  <text x="450" y="817" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">allows 20 across the boundary</text>

  
  <rect x="120" y="880" width="660" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="165" cy="920" r="24" fill="#207448"/>
  <text x="165" y="928" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="210" y="928" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">name the boundary burst</text>

  <rect x="820" y="880" width="660" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="865" cy="920" r="24" fill="#207448"/>
  <text x="865" y="928" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="910" y="928" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">offer a token bucket for APIs</text>

  
  <rect x="120" y="985" width="1360" height="80" rx="10" fill="#207448"/>
  <text x="800" y="1034" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The fixed window lets a client send the full limit twice in a row across the boundary.</text>
</svg>