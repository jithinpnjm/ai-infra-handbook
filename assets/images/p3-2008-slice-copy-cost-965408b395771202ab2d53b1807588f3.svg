<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Slicing copies, so a slice in a loop turns linear into quadratic</title>
  <desc>Visual comparison between slicing recursion which copies O(n^2) total items versus index passing which copies nothing O(n), alongside queue pop and string concatenation measurements.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Slicing copies, so a slice in a loop</tspan>
    <tspan x="800" dy="58">turns linear into quadratic</tspan>
  </text>

  
  <rect x="40" y="150" width="960" height="510" rx="16" fill="#ffffff" stroke="#c93b2b" stroke-width="4"/>

  
  <g transform="translate(68, 172)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 44 20 L 52 28 L 44 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 12 36 L 4 28 L 12 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <text x="140" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Recursion with <tspan font-family="ui-monospace, monospace">s[1:]</tspan> on every step</text>

  
  <rect x="625" y="235" width="350" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(642, 252)">
    <rect x="0" y="16" width="50" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="16" x2="38" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="4" width="22" height="16" rx="2" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="20" y="26" width="22" height="18" rx="2" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="4" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  
  <text x="712" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">
    <tspan x="712" dy="0">a slice is a</tspan>
    <tspan x="712" dy="28">photocopy of</tspan>
    <tspan x="712" dy="28">the page</tspan>
  </text>

  
  
  <rect x="70" y="245" width="500" height="44" rx="6" fill="#fce8e6" stroke="#c93b2b" stroke-width="2"/>
  <text x="90" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">copy n items</text>

  
  <rect x="70" y="303" width="425" height="44" rx="6" fill="#fce8e6" stroke="#c93b2b" stroke-width="2"/>
  <text x="90" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">copy n-1 items</text>

  
  <rect x="70" y="361" width="350" height="44" rx="6" fill="#fce8e6" stroke="#c93b2b" stroke-width="2"/>
  <text x="90" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">copy n-2 items</text>

  
  <rect x="70" y="419" width="275" height="44" rx="6" fill="#fce8e6" stroke="#c93b2b" stroke-width="2"/>
  <text x="90" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">...</text>

  
  <rect x="70" y="477" width="200" height="44" rx="6" fill="#fce8e6" stroke="#c93b2b" stroke-width="2"/>
  <text x="90" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">copy 1 item</text>

  
  <path d="M 590,245 C 604,245 604,365 608,377 C 610,382 614,383 618,383 C 614,383 610,384 608,389 C 604,401 604,521 590,521" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>

  
  <text x="632" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">
    <tspan x="632" dy="0">total work grows</tspan>
    <tspan x="632" dy="32">with the square</tspan>
    <tspan x="632" dy="32">of n: quadratic</tspan>
  </text>

  
  <rect x="70" y="555" width="900" height="75" rx="8" fill="#f5f8f5" stroke="#303a36" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="586" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="520" dy="0">a slice of a one million item list</tspan>
    <tspan x="520" dy="28">takes about 2.7 ms on a Mac</tspan>
  </text>

  
  <rect x="40" y="700" width="960" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="4"/>

  
  <g transform="translate(68, 722)">
    <rect x="4" y="10" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="20" y1="10" x2="20" y2="46" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="10" x2="36" y2="46" stroke="#207448" stroke-width="3"/>
    <path d="M 28 54 L 28 44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 24 48 L 28 44 L 32 48" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <text x="140" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pass indexes: <tspan font-family="ui-monospace, monospace">f(s, i)</tspan></text>

  
  <rect x="70" y="795" width="100" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="70" y="850" width="100" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="70" y="905" width="100" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="70" y="960" width="100" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="70" y="1015" width="100" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <rect x="200" y="895" width="140" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="270" y="934" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">no copy</text>

  
  <path d="M 365,795 C 380,795 380,910 384,920 C 386,924 390,925 394,925 C 390,925 386,926 384,930 C 380,940 380,1055 365,1055" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="415" y="937" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#207448">linear</text>

  
  <g transform="translate(560, 840)">
    <rect x="0" y="0" width="380" height="150" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    
    <rect x="30" y="45" width="60" height="60" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="90" y="45" width="60" height="60" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="150" y="45" width="60" height="60" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="210" y="45" width="60" height="60" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="270" y="45" width="80" height="60" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="295" cy="75" r="3" fill="#207448"/>
    <circle cx="310" cy="75" r="3" fill="#207448"/>
    <circle cx="325" cy="75" r="3" fill="#207448"/>
    
    <path d="M 60 130 L 60 112" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 54 118 L 60 112 L 66 118" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120 130 L 120 112" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 114 118 L 120 112 L 126 118" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <rect x="1040" y="150" width="520" height="510" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1070, 172)">
    <rect x="4" y="12" width="48" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="18" cy="28" r="4" fill="#207448"/>
    <circle cx="30" cy="28" r="4" fill="#207448"/>
    <circle cx="42" cy="28" r="4" fill="#207448"/>
    <path d="M 52 28 L 64 28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 58 22 L 64 28 L 58 34" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <rect x="1065" y="245" width="470" height="145" rx="10" fill="#fce8e6" stroke="#c93b2b" stroke-width="2"/>
  <text x="1085" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1085" dy="0" font-family="ui-monospace, monospace" font-weight="bold">list.pop(0)</tspan><tspan font-family="system-ui, -apple-system, sans-serif"> moves every</tspan>
    <tspan x="1085" dy="28">other item: about 14</tspan>
    <tspan x="1085" dy="28">microseconds on a</tspan>
    <tspan x="1085" dy="28">100,000 item list</tspan>
  </text>

  
  <rect x="1065" y="410" width="470" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1085" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1085" dy="0" font-family="ui-monospace, monospace" font-weight="bold">deque</tspan><tspan font-family="system-ui, -apple-system, sans-serif"> popleft and append:</tspan>
    <tspan x="1085" dy="32">about 0.05 microseconds</tspan>
  </text>

  
  <text x="1300" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-style="italic" fill="#303a36">
    <tspan x="1300" dy="0">single measurements on one</tspan>
    <tspan x="1300" dy="30">machine, trust the ratio</tspan>
  </text>

  
  <rect x="1040" y="700" width="520" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1070, 722)">
    <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="16" y1="20" x2="40" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="28" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="1065" y="785" width="470" height="345" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="828" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1085" dy="0" font-weight="bold">String building:</tspan><tspan> repeated </tspan><tspan font-family="ui-monospace, monospace" font-weight="bold">+=</tspan>
    <tspan x="1085" dy="36">can copy each time; 200,000</tspan>
    <tspan x="1085" dy="36">appends took 0.37 s once a</tspan>
    <tspan x="1085" dy="36">second name referred to</tspan>
    <tspan x="1085" dy="36">the string, a list and</tspan>
    <tspan x="1085" dy="36"><tspan font-family="ui-monospace, monospace" font-weight="bold">str.join</tspan> took 0.0035 s</tspan>
  </text>
</svg>