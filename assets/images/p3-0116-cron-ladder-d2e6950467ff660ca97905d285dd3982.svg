<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A cron job did not run: five checks in order</title>
  <desc>A cron job did not run: five checks in order</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A cron job did not run: five checks in order</text>

  

  
  <rect x="50" y="95" width="890" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(72, 112)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="11" x2="20" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="28" r="2" fill="#207448" />
  </g>
  <text x="130" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">The cron job never runs, runs but fails, or runs twice</text>

  
  <line x1="495" y1="170" x2="495" y2="195" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="195" width="890" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="245" r="24" fill="#207448" />
  <text x="90" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(132, 225)">
    <circle cx="20" cy="20" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 20 5 L 20 9 M 20 31 L 20 35 M 5 20 L 9 20 M 31 20 L 35 20 M 9 9 L 12 12 M 28 28 L 31 31 M 9 31 L 12 28 M 28 12 L 31 9" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="195" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is the daemon running?</text>
  <text x="195" y="270" font-family="ui-monospace, monospace" font-size="24" fill="#207448">systemctl status cron or crond</text>

  
  <line x1="495" y1="295" x2="495" y2="320" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="320" width="890" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="358" r="24" fill="#207448" />
  <text x="90" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(132, 338)">
    <rect x="7" y="4" width="26" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="14" y1="12" x2="26" y2="12" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="20" x2="26" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="28" x2="22" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="195" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Did the crontab install cleanly? <tspan font-family="ui-monospace, monospace" font-size="24" font-weight="normal" fill="#207448">crontab -l;</tspan></text>
  <text x="100" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a missing trailing newline in an /etc/cron.d file breaks it;
    <tspan x="100" dy="34">system files must be owned by root and not writable</tspan>
    <tspan x="100" dy="34">by group or world; on Debian a file name with a dot</tspan>
    <tspan x="100" dy="34">in /etc/cron.d is ignored</tspan>
  </text>

  
  <line x1="495" y1="505" x2="495" y2="530" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="530" width="890" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="570" r="24" fill="#207448" />
  <text x="90" y="579" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(132, 550)">
    <circle cx="20" cy="20" r="17" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="20,11 20,20 27,20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="195" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Right time and zone? <tspan font-family="ui-monospace, monospace" font-size="24" font-weight="normal" fill="#207448">date;</tspan></text>
  <text x="100" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">then read what cron logged: <tspan font-family="ui-monospace, monospace" font-size="24" fill="#207448">journalctl -u cron --since -1h,</tspan>
    <tspan x="100" dy="34" font-family="ui-monospace, monospace" font-size="24" fill="#207448">grep CRON /var/log/syslog<tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36">, or </tspan>/var/log/cron<tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> on RHEL</tspan></tspan>
  </text>

  
  <line x1="495" y1="660" x2="495" y2="685" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="685" width="890" height="155" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
  <circle cx="90" cy="725" r="24" fill="#db8129" />
  <text x="90" y="734" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(132, 707)">
    <rect x="3" y="5" width="34" height="26" rx="4" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 10 13 L 16 18 L 10 23" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="19" y1="23" x2="28" y2="23" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="195" y="722" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Run the command exactly as cron does:</text>
  <text x="100" y="758" font-family="ui-monospace, monospace" font-size="24" fill="#db8129">env -i HOME=$HOME SHELL=/bin/sh</text>
  <text x="100" y="788" font-family="ui-monospace, monospace" font-size="24" fill="#db8129">PATH=/usr/bin:/bin sh -c "command";</text>
  <text x="100" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">does it need a terminal or an environment variable?</text>

  
  <line x1="495" y1="840" x2="495" y2="865" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="865" width="890" height="105" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="917" r="24" fill="#207448" />
  <text x="90" y="926" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(132, 897)">
    <path d="M 12 18 L 12 12 A 8 8 0 0 1 28 12 L 28 18" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="8" y="18" width="24" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="20" cy="26" r="2.5" fill="#207448" />
    <line x1="20" y1="28.5" x2="20" y2="32" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="195" y="905" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is the account locked:</text>
  <text x="195" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">PAM pam_nologin, an expired password, or /etc/cron.deny</text>

  
  <line x1="495" y1="970" x2="495" y2="995" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="295" y="995" width="400" height="65" rx="10" fill="#207448" stroke="#207448" />
  <g transform="translate(405, 1010)">
    <circle cx="17" cy="17" r="16" fill="#ffffff" />
    <polyline points="9,17 15,23 25,11" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="455" y="1039" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Found it</text>


  

  <rect x="980" y="95" width="570" height="965" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="1005" y="120" width="520" height="210" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1025" y="160" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">*/5 * * * * root
    <tspan x="1025" dy="36">flock -n /run/lock/gpu-health.lock</tspan>
    <tspan x="1025" dy="36">timeout 120</tspan>
    <tspan x="1025" dy="36">/usr/local/bin/gpu-health.sh 2&gt;&amp;1 |</tspan>
    <tspan x="1025" dy="36">logger -t gpu-health</tspan>
  </text>

  
  <rect x="1005" y="360" width="520" height="190" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1243, 385)">
    <path d="M 13 22 L 13 14 A 9 9 0 0 1 31 14 L 31 22" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="8" y="22" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="22" cy="31" r="3" fill="#207448" />
    <line x1="22" y1="34" x2="22" y2="39" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1265" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">flock -n stops overlapping runs</text>

  
  <rect x="1005" y="580" width="520" height="190" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1243, 605)">
    <circle cx="22" cy="26" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="22,16 22,26 30,26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="16" y1="4" x2="28" y2="4" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="22" y1="4" x2="22" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="1265" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">timeout kills a hang</text>

  
  <rect x="1005" y="800" width="520" height="190" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1243, 825)">
    <rect x="9" y="6" width="26" height="34" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="16" y1="14" x2="28" y2="14" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="16" y1="22" x2="28" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="16" y1="30" x2="24" y2="30" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="6" x2="14" y2="40" stroke="#207448" stroke-width="2" />
  </g>
  <text x="1265" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">logger keeps the output
    <tspan x="1265" dy="34">in the journal</tspan>
  </text>


  

  <rect x="50" y="1095" width="1500" height="75" rx="10" fill="#207448" />
  <g transform="translate(80, 1113)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ffffff" stroke-width="3" />
    <polyline points="12,20 18,26 28,14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="135" y="1143" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Make the job safe to run twice before you schedule it</text>

</svg>