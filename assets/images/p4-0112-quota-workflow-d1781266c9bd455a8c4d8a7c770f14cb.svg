<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>Linux Filesystem Quota Architecture and Six-Step Setup Workflow</title>
  <desc>Technical illustration showing filesystem quota limit spectrum and administrative setup workflow</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Linux Filesystem Quota Architecture and Six-Step Setup Workflow</text>

  
  
  
  <rect x="50" y="85" width="1500" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="132" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Quota Limit Spectrum (Storage &amp; Inode Axis)</text>

  
  <text x="570" y="235" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">Soft Limit (bsoft=100G)</text>

  
  <rect x="630" y="160" width="450" height="68" rx="12" fill="#fef6ed" stroke="#db8129" stroke-width="2" />
  <text x="855" y="190" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="855" dy="0">Grace Period Timer starts</tspan>
    <tspan x="855" dy="28">(default 7 days: setquota -t)</tspan>
  </text>

  
  <path d="M 570 205 Q 570 194 620 194" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <text x="1140" y="235" font-family="sans-serif" font-size="25" font-weight="bold" fill="#b91c1c" text-anchor="middle">Hard Limit (bhard=120G)</text>

  
  <rect x="90" y="260" width="480" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="330" y="325" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Normal Usage Range (0 to 100 GB)</text>

  
  <rect x="570" y="260" width="570" height="110" rx="0" fill="#fef6ed" stroke="#db8129" stroke-width="3" />
  <text x="855" y="310" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="855" dy="0">Grace Period Window</tspan>
    <tspan x="855" dy="32">(writes permitted, warnings logged)</tspan>
  </text>

  
  <rect x="1140" y="260" width="370" height="110" rx="8" fill="#fbeae8" stroke="#b91c1c" stroke-width="3" />
  <rect x="1140" y="260" width="16" height="110" fill="#b91c1c" />
  <text x="1330" y="298" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b91c1c" text-anchor="middle">
    <tspan x="1330" dy="0">Hard Limit Exceeded:</tspan>
    <tspan x="1330" dy="30">Write blocked immediately</tspan>
    <tspan x="1330" dy="30">with ENOSPC</tspan>
  </text>

  
  
  <line x1="90" y1="245" x2="90" y2="385" stroke="#207448" stroke-width="4" />
  <text x="90" y="415" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">0 GB</text>

  
  <line x1="570" y1="245" x2="570" y2="385" stroke="#db8129" stroke-width="4" stroke-dasharray="6,4" />
  <text x="570" y="415" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">100 GB</text>

  
  <line x1="1140" y1="245" x2="1140" y2="385" stroke="#b91c1c" stroke-width="4" />
  <text x="1140" y="415" font-family="sans-serif" font-size="25" font-weight="bold" fill="#b91c1c" text-anchor="middle">120 GB</text>


  
  
  
  <rect x="50" y="480" width="1500" height="825" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="525" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">6-Step Administrative Workflow</text>

  
  <rect x="80" y="550" width="1000" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="125" cy="598" r="22" fill="#207448" />
  <text x="125" y="606" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(162, 574)" stroke="#207448" stroke-width="2.5" fill="none">
    <path d="M 6 0 L 26 0 L 36 10 L 36 44 L 6 44 Z" />
    <path d="M 26 0 L 26 10 L 36 10" />
    <line x1="12" y1="20" x2="28" y2="20" />
    <line x1="12" y1="28" x2="28" y2="28" />
  </g>
  <text x="225" y="588" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="225" dy="0" font-family="monospace" font-weight="bold" fill="#207448">1. /etc/fstab:</tspan>
    <tspan font-family="sans-serif" fill="#303a36"> add usrquota,grpquota to mount options</tspan>
    <tspan x="225" dy="32" font-family="sans-serif" fill="#55605c">(/dev/sda6 on /export)</tspan>
  </text>

  
  <line x1="580" y1="646" x2="580" y2="668" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="674" width="1000" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="125" cy="722" r="22" fill="#207448" />
  <text x="125" y="730" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(164, 700)" stroke="#207448" stroke-width="2.5" fill="none">
    <rect x="6" y="18" width="28" height="24" rx="4" />
    <path d="M 12 18 L 12 10 A 8 8 0 0 1 28 10 L 28 18" />
  </g>
  <text x="225" y="712" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="225" dy="0" font-family="monospace" font-weight="bold" fill="#207448">2. sudo mount -o remount,ro /dev/sda6:</tspan>
    <tspan x="225" dy="32" font-family="sans-serif" fill="#303a36">freeze writes to prevent corrupt usage scan</tspan>
  </text>

  
  <line x1="580" y1="770" x2="580" y2="792" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="798" width="1000" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="125" cy="846" r="22" fill="#207448" />
  <text x="125" y="854" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(162, 824)" stroke="#207448" stroke-width="2.5" fill="none">
    <ellipse cx="18" cy="12" rx="14" ry="6" />
    <path d="M 4 12 L 4 30 A 14 6 0 0 0 32 30 L 32 12" />
    <circle cx="28" cy="30" r="7" />
    <line x1="33" y1="35" x2="40" y2="42" />
  </g>
  <text x="225" y="836" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="225" dy="0" font-family="monospace" font-weight="bold" fill="#207448">3. sudo quotacheck -vugc /dev/sda6:</tspan>
    <tspan x="225" dy="32" font-family="sans-serif" fill="#303a36">scan disk and create aquota.user and aquota.group files</tspan>
  </text>

  
  <line x1="580" y1="894" x2="580" y2="916" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="922" width="1000" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="125" cy="970" r="22" fill="#207448" />
  <text x="125" y="978" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(164, 948)" stroke="#207448" stroke-width="2.5" fill="none">
    <rect x="6" y="18" width="28" height="24" rx="4" />
    <path d="M 12 18 L 12 10 A 8 8 0 0 1 28 10 L 28 14" />
  </g>
  <text x="225" y="960" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="225" dy="0" font-family="monospace" font-weight="bold" fill="#207448">4. sudo mount /dev/sda6 (or remount,rw):</tspan>
    <tspan x="225" dy="32" font-family="sans-serif" fill="#303a36">restore read-write operation</tspan>
  </text>

  
  <line x1="580" y1="1018" x2="580" y2="1040" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="1046" width="1000" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="125" cy="1094" r="22" fill="#207448" />
  <text x="125" y="1102" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(164, 1072)" stroke="#207448" stroke-width="2.5" fill="none">
    <circle cx="20" cy="20" r="8" />
    <path d="M 20 4 L 20 10 M 20 30 L 20 36 M 4 20 L 10 20 M 30 20 L 36 20 M 8 8 L 13 13 M 27 27 L 32 32 M 8 32 L 13 27 M 27 13 L 32 8" />
  </g>
  <text x="225" y="1084" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="225" dy="0" font-family="monospace" font-weight="bold" fill="#207448">5. sudo quotaon -va:</tspan>
    <tspan x="225" dy="32" font-family="sans-serif" fill="#303a36">activate kernel quota enforcement</tspan>
  </text>

  
  <line x1="580" y1="1142" x2="580" y2="1164" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="1170" width="1000" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="125" cy="1218" r="22" fill="#207448" />
  <text x="125" y="1226" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  
  <g transform="translate(164, 1196)" stroke="#207448" stroke-width="2.5" fill="none">
    <line x1="6" y1="12" x2="34" y2="12" />
    <line x1="6" y1="28" x2="34" y2="28" />
    <circle cx="14" cy="12" r="4" fill="#ffffff" />
    <circle cx="26" cy="28" r="4" fill="#ffffff" />
  </g>
  <text x="225" y="1208" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="225" dy="0" font-family="monospace" font-weight="bold" fill="#207448">6. sudo edquota / setquota &amp; repquota -a:</tspan>
    <tspan x="225" dy="32" font-family="sans-serif" fill="#303a36">configure user/group limits and verify</tspan>
  </text>

  
  <rect x="1110" y="550" width="410" height="716" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,4" />
  
  <g transform="translate(1285, 610)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="6" y="6" width="48" height="22" rx="4" />
    <circle cx="16" cy="17" r="3" fill="#207448" />
    <circle cx="26" cy="17" r="3" fill="#207448" />
    <rect x="6" y="38" width="48" height="22" rx="4" />
    <circle cx="16" cy="49" r="3" fill="#207448" />
    <circle cx="26" cy="49" r="3" fill="#207448" />
    <line x1="30" y1="28" x2="30" y2="38" />
    <line x1="30" y1="60" x2="30" y2="76" />
    <line x1="10" y1="76" x2="50" y2="76" />
  </g>

  <text x="1315" y="745" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">NFS Export:</text>
  <text x="1315" y="805" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1315" dy="0">start rpc.rquotad daemon</tspan>
    <tspan x="1315" dy="36">on server so network</tspan>
    <tspan x="1315" dy="36">clients can query</tspan>
    <tspan x="1315" dy="36" font-family="monospace" font-weight="bold" fill="#207448">repquota</tspan>
  </text>

  
  <line x1="1080" y1="1218" x2="1102" y2="1218" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
</svg>