<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Service failures: follow the datapath outward</title>
  <desc>Visual infographic explaining troubleshooting Kubernetes service failures by tracing the datapath outward step-by-step from DNS to the backend application, including common branch failure modes, routing considerations, and diagnostic rules.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Service failures: follow the datapath outward</text>

  
  <g transform="translate(50, 95)">
    <rect width="1500" height="70" rx="10" fill="#db8129"/>
    <text x="750" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">work from the first hop outward because a fault near the pod can hide faults further away</text>
  </g>

  
  
  <g transform="translate(50, 205)">
    <rect width="270" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 24)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <ellipse cx="28" cy="28" rx="12" ry="24" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="4" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="3"/>
    </g>
    
    <circle cx="230" cy="52" r="24" fill="#207448"/>
    <text x="230" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <text x="24" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DNS (5.11):</text>
    <text x="24" y="175" font-family="monospace" font-size="24" fill="#303a36">dig from inside</text>
    <text x="24" y="210" font-family="monospace" font-size="24" fill="#303a36">the pod</text>
  </g>

  
  <line x1="320" y1="330" x2="355" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(355, 205)">
    <rect width="270" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 24)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <circle cx="230" cy="52" r="24" fill="#207448"/>
    <text x="230" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <text x="24" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">endpoints:</text>
    <text x="24" y="170" font-family="sans-serif" font-size="24" fill="#303a36">does the Service</text>
    <text x="24" y="205" font-family="sans-serif" font-size="24" fill="#303a36">have ready</text>
    <text x="24" y="240" font-family="sans-serif" font-size="24" fill="#303a36">backends</text>
  </g>

  
  <line x1="625" y1="330" x2="660" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(660, 205)">
    <rect width="280" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 24)">
      <path d="M 28 6 L 48 14 L 48 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 L 8 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="18" x2="28" y2="38" stroke="#207448" stroke-width="3"/>
      <line x1="18" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="3"/>
    </g>
    
    <circle cx="240" cy="52" r="24" fill="#207448"/>
    <text x="240" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <text x="24" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">rules:</text>
    <text x="24" y="165" font-family="sans-serif" font-size="24" fill="#303a36">kube-proxy iptables</text>
    <text x="24" y="200" font-family="sans-serif" font-size="24" fill="#303a36">or IPVS</text>
    <text x="24" y="235" font-family="monospace" font-size="24" fill="#303a36">(ipvsadm -Ln)</text>
  </g>

  
  <line x1="940" y1="330" x2="975" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(975, 205)">
    <rect width="270" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 24)">
      <rect x="6" y="16" width="44" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="16" cy="28" r="3" fill="#207448"/>
      <circle cx="28" cy="28" r="3" fill="#207448"/>
      <circle cx="40" cy="28" r="3" fill="#207448"/>
      <line x1="28" y1="6" x2="28" y2="16" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="40" x2="28" y2="50" stroke="#207448" stroke-width="3"/>
    </g>
    
    <circle cx="230" cy="52" r="24" fill="#207448"/>
    <text x="230" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <text x="24" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">datapath:</text>
    <text x="24" y="175" font-family="sans-serif" font-size="24" fill="#303a36">CNI, node,</text>
    <text x="24" y="215" font-family="sans-serif" font-size="24" fill="#303a36">underlay</text>
  </g>

  
  <line x1="1245" y1="330" x2="1280" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(1280, 205)">
    <rect width="270" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 24)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="6" y1="20" x2="50" y2="20" stroke="#207448" stroke-width="3"/>
      <circle cx="14" cy="14" r="2" fill="#207448"/>
      <circle cx="22" cy="14" r="2" fill="#207448"/>
      <line x1="14" y1="32" x2="30" y2="32" stroke="#207448" stroke-width="3"/>
      <line x1="14" y1="40" x2="38" y2="40" stroke="#207448" stroke-width="3"/>
    </g>
    
    <circle cx="230" cy="52" r="24" fill="#207448"/>
    <text x="230" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <text x="24" y="145" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">backend app</text>
  </g>

  
  
  
  <line x1="185" y1="455" x2="185" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g transform="translate(50, 520)">
    <rect width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 18 28 L 38 28 M 28 18 L 38 28 L 28 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="96" y="58" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Egress Branch</text>
    <text x="24" y="110" font-family="sans-serif" font-size="24" fill="#303a36">pod egress to the Internet may</text>
    <text x="24" y="146" font-family="sans-serif" font-size="24" fill="#303a36">depend on SNAT or a NAT gateway</text>
  </g>

  
  
  <line x1="800" y1="455" x2="800" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g transform="translate(570, 520)">
    <rect width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <path d="M 28 6 L 48 14 L 48 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 L 8 14 Z" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="18" y1="18" x2="38" y2="38" stroke="#207448" stroke-width="4"/>
      <line x1="38" y1="18" x2="18" y2="38" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="96" y="58" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Policy Inspection</text>
    <text x="24" y="110" font-family="sans-serif" font-size="24" fill="#303a36">policy drops show in Hubble</text>
    <text x="24" y="146" font-family="sans-serif" font-size="24" fill="#303a36">or Calico logs</text>
  </g>

  
  
  <line x1="1110" y1="455" x2="1110" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g transform="translate(1090, 520)">
    <rect width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <rect x="6" y="10" width="18" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="32" y="10" width="18" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="24" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
    <text x="96" y="58" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Cross-Node Scope</text>
    <text x="24" y="110" font-family="sans-serif" font-size="24" fill="#303a36">cross-node pods point to CNI,</text>
    <text x="24" y="146" font-family="sans-serif" font-size="24" fill="#303a36">the underlay or MTU</text>
  </g>

  
  
  <line x1="800" y1="700" x2="800" y2="745" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g transform="translate(50, 745)">
    <rect width="1500" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(28, 28)">
      <circle cx="14" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="48" cy="14" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="48" cy="42" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 22 24 L 40 16" stroke="#207448" stroke-width="3"/>
      <path d="M 22 32 L 40 40" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="96" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Routing &amp; Reverse Path Filtering</text>
    <text x="28" y="112" font-family="sans-serif" font-size="24" fill="#303a36">asymmetric routing with multiple NICs ties to reverse path filtering; check sysctl</text>
    <text x="28" y="152" font-family="monospace" font-size="24" fill="#303a36">net.ipv4.conf.all.rp_filter</text>
    <text x="445" y="152" font-family="sans-serif" font-size="24" fill="#303a36">(a reply must be able to leave by the interface</text>
    <text x="28" y="192" font-family="sans-serif" font-size="24" fill="#303a36">the request arrived on)</text>
  </g>

  
  <g transform="translate(50, 1000)">
    <rect width="1500" height="150" rx="12" fill="#207448"/>
    
    <g transform="translate(32, 45)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#ffffff" stroke-width="4"/>
      <circle cx="30" cy="30" r="14" fill="none" stroke="#ffffff" stroke-width="4"/>
      <circle cx="30" cy="30" r="4" fill="#ffffff"/>
    </g>
    
    <text x="100" y="65" font-family="sans-serif" font-size="25" fill="#ffffff">testing only through Service names adds DNS, NAT and policy to the test; a direct</text>
    <text x="100" y="105" font-family="sans-serif" font-size="25" fill="#ffffff">pod IP test localises faster</text>
  </g>
</svg>