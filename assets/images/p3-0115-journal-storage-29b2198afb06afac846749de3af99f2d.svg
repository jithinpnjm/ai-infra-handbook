<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Where the journal lives: Storage=auto can lose it at reboot</title>
  <desc>Decision flow explaining systemd journald Storage=auto behavior, disk persistence versus memory loss across reboots, configuration fix, and journal limits.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 2 L11 7 L1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 2 L11 7 L1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">Where the journal lives: Storage=auto can lose it at reboot</text>

  
  
  <line x1="360" y1="220" x2="360" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="550" y1="370" x2="646" y2="370" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <text x="600" y="342" text-anchor="middle" font-size="28" font-weight="bold" fill="#207448" font-family="sans-serif">Yes</text>

  
  <line x1="360" y1="475" x2="360" y2="576" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  
  <text x="315" y="530" text-anchor="middle" font-size="28" font-weight="bold" fill="#db8129" font-family="sans-serif">No</text>

  
  <rect x="60" y="120" width="600" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(100, 170)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M0 -24 v6 M0 18 v6 M-24 0 h6 M18 0 h6 M-17 -17 l4 4 M13 13 l4 4 M-17 17 l4 -4 M13 -13 l4 -4" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text font-size="26" fill="#303a36">
    <tspan x="155" y="158" font-family="sans-serif">journald starts with</tspan>
    <tspan x="155" y="194"><tspan font-family="monospace" font-weight="bold">Storage=auto</tspan><tspan font-family="sans-serif"> (the default)</tspan></tspan>
  </text>

  
  <polygon points="360,265 550,370 360,475 170,370" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(360, 315)">
    <circle cx="-4" cy="-4" r="10" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="3" y1="3" x2="11" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text text-anchor="middle" font-size="26" fill="#303a36">
    <tspan x="360" y="365" font-family="sans-serif">Does <tspan font-family="monospace" font-weight="bold">/var/log/</tspan></tspan>
    <tspan x="360" y="400"><tspan font-family="monospace" font-weight="bold">journal</tspan><tspan font-family="sans-serif"> exist?</tspan></tspan>
  </text>

  
  <rect x="650" y="240" width="420" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1015, 275)">
    <ellipse cx="0" cy="-12" rx="18" ry="7" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M-18 -12 v24 c0 4 8 7 18 7 s18 -3 18 -7 v-24" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M-18 0 c0 4 8 7 18 7 s18 -3 18 -7" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text font-size="24" fill="#303a36">
    <tspan x="675" y="280" font-family="sans-serif">Written to</tspan>
    <tspan x="675" y="318"><tspan font-family="monospace" font-weight="bold">/var/log/journal</tspan><tspan font-family="sans-serif"> on disk:</tspan></tspan>
    <tspan x="675" y="356" font-family="sans-serif" font-weight="bold" fill="#207448">survives reboot;</tspan>
    <tspan x="675" y="394"><tspan font-family="monospace" font-weight="bold">journalctl -b -1</tspan><tspan font-family="sans-serif"> works</tspan></tspan>
    <tspan x="675" y="432" font-family="sans-serif">after a crash</tspan>
  </text>

  
  <rect x="60" y="580" width="460" height="380" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(460, 620)">
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="none" stroke="#db8129" stroke-width="3"/>
    <path d="M-24 -9 h6 M-24 0 h6 M-24 9 h6 M18 -9 h6 M18 0 h6 M18 9 h6 M-9 -24 v6 M0 -24 v6 M9 -24 v6 M-9 18 v6 M0 18 v6 M9 18 v6" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text font-size="24" fill="#303a36">
    <tspan x="85" y="625" font-family="sans-serif">Written to</tspan>
    <tspan x="85" y="665" font-family="monospace" font-weight="bold">/run/log/journal,</tspan>
    <tspan x="85" y="705" font-family="sans-serif">which is in memory:</tspan>
    <tspan x="85" y="745" font-family="sans-serif" font-weight="bold" fill="#db8129">lost at reboot;</tspan>
    <tspan x="85" y="785"><tspan font-family="monospace" font-weight="bold">journalctl -b -1</tspan><tspan font-family="sans-serif"> fails</tspan></tspan>
    <tspan x="85" y="825" font-family="sans-serif">after a crash</tspan>
  </text>

  
  <rect x="560" y="580" width="510" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1015, 615)">
    <rect x="-20" y="-16" width="40" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="-20" y1="-6" x2="20" y2="-6" stroke="#207448" stroke-width="2"/>
    <path d="M-13 1 l4 4 -4 4" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-4" y1="9" x2="4" y2="9" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text font-size="24" fill="#303a36">
    <tspan x="585" y="625"><tspan font-family="sans-serif">Set </tspan><tspan font-family="monospace" font-weight="bold">Storage=persistent</tspan><tspan font-family="sans-serif"> in</tspan></tspan>
    <tspan x="585" y="662" font-family="monospace" font-weight="bold">/etc/systemd/journald.conf.d/</tspan>
    <tspan x="585" y="699" font-family="monospace" font-weight="bold">50-persistent.conf,</tspan>
    <tspan x="585" y="736" font-family="sans-serif">create the directory with</tspan>
    <tspan x="585" y="773" font-family="monospace" font-weight="bold">sudo systemd-tmpfiles --create</tspan>
    <tspan x="585" y="810"><tspan font-family="monospace" font-weight="bold">--prefix /var/log/journal,</tspan><tspan font-family="sans-serif"> then</tspan></tspan>
    <tspan x="585" y="847" font-family="monospace" font-weight="bold">sudo systemctl restart</tspan>
    <tspan x="585" y="884" font-family="monospace" font-weight="bold">systemd-journald</tspan>
  </text>

  
  <rect x="1110" y="120" width="450" height="840" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <text x="1135" y="165" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">Limits in that file</text>
  
  <g transform="translate(1500, 155)">
    <path d="M-22 -8 h36 M-22 2 h36 M-22 12 h36" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-10" cy="-8" r="4" fill="#207448"/>
    <circle cx="6" cy="2" r="4" fill="#207448"/>
    <circle cx="-14" cy="12" r="4" fill="#207448"/>
  </g>

  
  <g>
    <rect x="1135" y="190" width="400" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1155" y="221" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SystemMaxUse=10G</text>

    <rect x="1135" y="244" width="400" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1155" y="275" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SystemKeepFree=2G</text>

    <rect x="1135" y="298" width="400" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1155" y="329" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SystemMaxFileSize=500M</text>

    <rect x="1135" y="352" width="400" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1155" y="383" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">MaxRetentionSec=1month</text>

    <rect x="1135" y="406" width="400" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1155" y="437" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">RateLimitIntervalSec=30s</text>

    <rect x="1135" y="460" width="400" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1155" y="491" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">RateLimitBurst=10000</text>
  </g>

  
  <rect x="1135" y="520" width="400" height="280" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-size="24" fill="#303a36">
    <tspan x="1155" y="550" font-family="sans-serif">Rate limiting drops</tspan>
    <tspan x="1155" y="577" font-family="sans-serif">messages from a chatty</tspan>
    <tspan x="1155" y="604" font-family="sans-serif">service and reports</tspan>
    <tspan x="1155" y="631" font-family="monospace" font-weight="bold">Suppressed N messages</tspan>
    <tspan x="1155" y="658" font-family="sans-serif">from X, which can hide</tspan>
    <tspan x="1155" y="685" font-family="sans-serif">the error you need;</tspan>
    <tspan x="1155" y="712" font-family="sans-serif">raise it per unit with</tspan>
    <tspan x="1155" y="739" font-family="monospace" font-weight="bold">LogRateLimitIntervalSec=</tspan>
    <tspan x="1155" y="766"><tspan font-family="sans-serif">and </tspan><tspan font-family="monospace" font-weight="bold">LogRateLimitBurst=</tspan></tspan>
  </text>

  
  <rect x="1135" y="820" width="400" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-size="24" fill="#303a36">
    <tspan x="1155" y="855" font-family="sans-serif">Treat the on-node journal</tspan>
    <tspan x="1155" y="887" font-family="sans-serif">as a short buffer:</tspan>
    <tspan x="1155" y="919" font-family="sans-serif" font-weight="bold" fill="#207448">ship logs off the node</tspan>
  </text>

  
  <rect x="60" y="990" width="1500" height="65" rx="8" fill="#207448"/>
  <text x="810" y="1032" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff" font-family="sans-serif">Before you rely on a node&apos;s logs after a reboot, confirm Storage is persistent</text>
</svg>