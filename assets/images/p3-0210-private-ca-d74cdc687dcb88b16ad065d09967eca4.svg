<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Building a private CA by hand: the seven steps and why each is there</title>
  <desc>Visual flowchart explaining the seven manual steps to create, sign, verify, trust, and serve a private Certificate Authority and TLS certificate, contrasted with production PKI best practices and public Web PKI operations.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="54" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Building a private CA by hand:</text>
  <text x="800" y="98" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">the seven steps and why each is there</text>

  
  
  <g id="step1">
    <rect x="30" y="125" width="515" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(50, 142)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      
      <path d="M 68 12 L 88 12 C 88 28 80 40 68 44 C 56 40 48 28 48 12 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <circle cx="68" cy="24" r="4" fill="#207448" />
      <path d="M 68 28 L 68 34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="156" y="160">Make the CA key and</tspan>
      <tspan x="156" y="194">self-signed root:</tspan>
    </text>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="50" y="234">openssl req -x509 ...</tspan>
      <tspan x="50" y="262">-subj /CN=Lab Root CA</tspan>
      <tspan x="50" y="290">-addext basicConstraints=</tspan>
      <tspan x="50" y="318"> critical,CA:TRUE</tspan>
      <tspan x="50" y="346">-addext keyUsage=critical,</tspan>
      <tspan x="50" y="374"> keyCertSign,cRLSign</tspan>
      <tspan x="50" y="402" dy="-28">-keyout ca.key -out ca.pem</tspan>
      <tspan x="50" y="430" dy="-28">(10 years)</tspan>
    </text>
  </g>

  
  <line x1="545" y1="257" x2="578" y2="257" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step2">
    <rect x="580" y="125" width="500" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(600, 142)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      
      <path d="M 52 10 L 76 10 L 86 20 L 86 42 L 52 42 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <path d="M 76 10 L 76 20 L 86 20" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <line x1="58" y1="26" x2="74" y2="26" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      <line x1="58" y1="32" x2="80" y2="32" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    </g>
    
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="702" y="160">Make the server key</tspan>
      <tspan x="702" y="194">and CSR:</tspan>
    </text>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="600" y="232">openssl req -newkey ec ...</tspan>
      <tspan x="600" y="260">-subj /CN=api.lab.internal</tspan>
      <tspan x="600" y="288">-keyout srv.key -out srv.csr;</tspan>
    </text>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" y="320">a CSR carries only the public key</tspan>
      <tspan x="600" y="348">and the requested names, the</tspan>
      <tspan x="600" y="376">application form you send to the</tspan>
      <tspan x="600" y="404" dy="-26">CA, never the secret</tspan>
    </text>
  </g>

  
  <line x1="830" y1="390" x2="830" y2="413" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <g id="step4">
    <rect x="30" y="415" width="515" height="225" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(50, 432)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
      
      <circle cx="68" cy="26" r="14" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 64 38 L 60 48 L 68 44 L 76 48 L 72 38" fill="none" stroke="#207448" stroke-width="2" stroke-linejoin="round" />
    </g>
    
    <text x="146" y="466" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Sign:</text>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="50" y="512">openssl x509 -req -in srv.csr</tspan>
      <tspan x="50" y="542">-CA ca.pem -CAkey ca.key</tspan>
      <tspan x="50" y="572">-CAcreateserial -days 90</tspan>
      <tspan x="50" y="602">-extfile srv.ext -out srv.pem</tspan>
    </text>
  </g>

  
  <line x1="580" y1="527" x2="547" y2="527" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step3">
    <rect x="580" y="415" width="500" height="225" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(600, 432)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      
      <path d="M 52 12 L 74 12 L 84 22 L 84 44 L 52 44 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <circle cx="68" cy="30" r="5" fill="none" stroke="#207448" stroke-width="2" />
    </g>
    
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="700" y="452">Write the extension file</tspan>
      <tspan x="700" y="486">srv.ext:</tspan>
    </text>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="600" y="522">subjectAltName=</tspan>
      <tspan x="600" y="548"> DNS:api.lab.internal,</tspan>
      <tspan x="600" y="574"> DNS:*.lab.internal,IP:10.0.0.5;</tspan>
      <tspan x="600" y="602">extendedKeyUsage=serverAuth;</tspan>
      <tspan x="600" y="628">basicConstraints=CA:FALSE</tspan>
    </text>
  </g>

  
  <line x1="287" y1="640" x2="287" y2="663" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <g id="step5">
    <rect x="30" y="665" width="515" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(50, 680)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
      
      <path d="M 68 12 L 86 12 C 86 26 78 38 68 42 C 58 38 50 26 50 12 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <path d="M 60 26 L 66 32 L 76 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="146" y="714" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Verify:</text>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="50" y="760">openssl verify -CAfile ca.pem</tspan>
      <tspan x="50" y="792">srv.pem</tspan>
    </text>
  </g>

  
  <line x1="545" y1="740" x2="578" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step6">
    <rect x="580" y="665" width="500" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(600, 680)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
      
      <rect x="50" y="14" width="34" height="22" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="67" y1="36" x2="67" y2="44" stroke="#207448" stroke-width="3" />
      <line x1="57" y1="44" x2="77" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="696" y="710">Trust the CA on the</tspan>
      <tspan x="696" y="744">client</tspan>
    </text>
    <text x="600" y="788" font-family="monospace" font-size="24" fill="#303a36">(update-ca-certificates)</text>
  </g>

  
  <line x1="830" y1="815" x2="830" y2="838" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <g id="step7">
    <rect x="30" y="840" width="1050" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(50, 856)">
      <circle cx="24" cy="24" r="22" fill="#207448" />
      <text x="24" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
      
      <rect x="52" y="10" width="34" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <rect x="52" y="26" width="34" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="60" cy="16" r="1.5" fill="#207448" />
      <circle cx="60" cy="32" r="1.5" fill="#207448" />
    </g>
    
    <text x="146" y="890" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Serve it with nginx:</text>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="480" y="888">ssl_certificate, ssl_certificate_key,</tspan>
      <tspan x="146" y="940">ssl_protocols TLSv1.2 TLSv1.3, http2 on</tspan>
    </text>
  </g>

  
  <g id="real-use-panel">
    <rect x="1110" y="125" width="460" height="850" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <rect x="1110" y="125" width="460" height="68" rx="12" fill="#db8129" />
    
    <g transform="translate(1126, 137)">
      <path d="M 22 8 L 38 8 C 38 22 30 32 22 36 C 14 32 6 22 6 8 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      <circle cx="22" cy="18" r="3" fill="#ffffff" />
      <path d="M 22 21 L 22 27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
    
    <text x="1178" y="170" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Real use</text>

    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1132" y="234">prefer step-ca or Vault PKI;</tspan>
      <tspan x="1132" y="272">keep the root offline and</tspan>
      <tspan x="1132" y="310">issue from intermediates;</tspan>
      <tspan x="1132" y="348">name constraints, short</tspan>
      <tspan x="1132" y="386">lifetimes, automated rotation;</tspan>
      <tspan x="1132" y="424">distribute the root to all</tspan>
      <tspan x="1132" y="462">trust stores through</tspan>
      <tspan x="1132" y="500">configuration management;</tspan>
      <tspan x="1132" y="538">keys generated on the server</tspan>
      <tspan x="1132" y="576">or in an HSM, TPM or KMS,</tspan>
      <tspan x="1132" y="614">never emailed, mode 0600,</tspan>
      <tspan x="1132" y="652">one machine per key;</tspan>
      <tspan x="1132" y="690">a client certificate is built</tspan>
      <tspan x="1132" y="728">the same way with</tspan>
    </text>
    <text x="1132" y="766" font-family="monospace" font-size="24" fill="#303a36">extendedKeyUsage=clientAuth</text>
  </g>

  
  <g id="public-ca-strip">
    <rect x="30" y="990" width="1540" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="50" y="1022">Let's Encrypt, DigiCert, Google Trust Services check control of the domain (DV) with a DNS or HTTP challenge; OV and EV add organisation checks;</tspan>
      <tspan x="50" y="1054">ACME (RFC 8555) automates renewal through certbot, acme.sh, Caddy, cert-manager; Let's Encrypt lasts 90 days;</tspan>
      <tspan x="50" y="1086">CT logs every public certificate; CAA records restrict which CAs may issue</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="30" y="1140" width="1540" height="45" rx="8" fill="#207448" />
    <text x="800" y="1170" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Building one by hand once is the best way to understand what the tools do for you</text>
  </g>
</svg>