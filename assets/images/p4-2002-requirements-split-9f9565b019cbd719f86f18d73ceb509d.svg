    <line x1="20" y1="12" x2="36" y2="12" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="215" y="1560" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
