<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1680" width="1600" height="1680">
  <title>Requirements Taxonomy: Day-One Must-Haves vs Desirable Preferences</title>
  <desc>A 2-column comparative layout categorizing Q1 through Q7 with evidence rules and adjacent unstated architecture topics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1680" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Requirements Taxonomy: Day-One Must-Haves vs Desirable Preferences
  </text>

  
  
  <rect x="50" y="115" width="730" height="74" rx="14" fill="#207448"/>
  <text x="415" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Required on Day One (Must-Have Evidence)
  </text>

  
  <rect x="50" y="210" width="730" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(74, 234)">
    <rect x="0" y="0" width="46" height="46" rx="8" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="23" cy="23" r="10" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="23" y1="4" x2="23" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="23" y1="36" x2="23" y2="42" stroke="#207448" stroke-width="3"/>
    <line x1="4" y1="23" x2="10" y2="23" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="23" x2="42" y2="23" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="134" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    Domain 1: Core Systems &amp; Tooling
  </text>

  
  <rect x="74" y="295" width="682" height="130" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="100" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q1:
    <tspan dx="10" font-weight="normal">Kubernetes, Prometheus, Grafana, Terraform fluency</tspan>
  </text>
  <text x="100" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapters 20.23, 20.24, 20.25)
  </text>

  
  <rect x="74" y="440" width="682" height="130" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="100" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q2:
    <tspan dx="10" font-weight="normal">Python or Bash scripting</tspan>
  </text>
  <text x="100" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapters 20.7 to 20.11; note: correct, clear, testable code)
  </text>

  
  <rect x="50" y="610" width="730" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(74, 632)">
    <path d="M 23 4 L 42 12 L 42 26 C 42 37 23 44 23 44 C 23 44 4 37 4 26 L 4 12 Z" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 16 24 L 21 29 L 31 18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="134" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    Domain 2: Reliability &amp; Debugging Depth
  </text>

  
  <rect x="74" y="695" width="682" height="130" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="100" y="737" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q3:
    <tspan dx="10" font-weight="normal">Alert design &amp; SLOs for high-throughput APIs</tspan>
  </text>
  <text x="100" y="785" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapters 20.19, 20.25)
  </text>

  
  <rect x="74" y="840" width="682" height="130" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="100" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q4:
    <tspan dx="10" font-weight="normal">How distributed back-ends fail</tspan>
  </text>
  <text x="100" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapters 20.18, 20.21, 20.23)
  </text>

  
  <rect x="74" y="985" width="682" height="175" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="100" y="1027" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q7:
    <tspan dx="10" font-weight="normal">Building self-healing systems and debugging from</tspan>
  </text>
  <text x="100" y="1068" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="normal" fill="#303a36">
    kernel to application layer
  </text>
  <text x="100" y="1120" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapters 20.3 to 20.6, 20.16)
  </text>

  
  <rect x="50" y="1200" width="730" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="80" y="1248" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    Must prove with concrete story: start, problem,
  </text>
  <text x="80" y="1288" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    change made, measured result
  </text>

  
  
  <rect x="820" y="115" width="730" height="74" rx="14" fill="#db8129"/>
  <text x="1185" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Desirable / Growth Areas (Learning Trajectory)
  </text>

  
