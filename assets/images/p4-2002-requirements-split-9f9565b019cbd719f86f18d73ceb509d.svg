    <line x1="36" y1="2" x2="36" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="40" x2="12" y2="46" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="40" x2="24" y2="46" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="40" x2="36" y2="46" stroke="#207448" stroke-width="3"/>
    <circle cx="24" cy="24" r="5" fill="#207448"/>
  </g>
  <text x="904" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    Domain 3: AI Inference &amp; MLOps Platform
  </text>

  
  <rect x="844" y="295" width="682" height="150" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="870" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q5:
    <tspan dx="10" font-weight="normal">Shepherding GPU workloads with vLLM, Triton, Ray</tspan>
  </text>
  <text x="870" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapter 20.22; note: desirable, not disqualifying)
  </text>

  
  <rect x="844" y="465" width="682" height="140" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
  <text x="870" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Q6:
    <tspan dx="10" font-weight="normal">MLOps or model-hosting platform background</tspan>
  </text>
  <text x="870" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607068">
    (Chapter 20.14)
  </text>

  
  <rect x="820" y="1200" width="730" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="850" y="1242" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    Interviewers probe reasoning, metrics understanding
  </text>
  <text x="850" y="1275" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">
