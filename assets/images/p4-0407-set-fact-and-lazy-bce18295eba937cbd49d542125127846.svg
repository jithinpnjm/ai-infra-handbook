<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How long a variable lives, and why driver_pkg follows the host's branch</title>
  <desc>Visual infographic explaining Ansible variable lifetime scopes, precedence, and lazy evaluation mechanisms.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="50" dy="0">How long a variable lives, and</tspan>
    <tspan x="50" dy="56">why driver_pkg follows the host's branch</tspan>
  </text>

  
  <g id="lifetime-table">
    
    <rect x="50" y="160" width="770" height="730" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <path d="M 50 172 A 12 12 0 0 1 62 160 L 808 160 A 12 12 0 0 1 820 172 L 820 220 L 50 220 Z" fill="#e8f1ea" />

    
    <g transform="translate(65, 162)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="135" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Source</text>
    <text x="345" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Scope and lifetime</text>

    
    <line x1="330" y1="160" x2="330" y2="890" stroke="#d0ded3" stroke-width="1.5" />

    
    <line x1="50" y1="220" x2="820" y2="220" stroke="#207448" stroke-width="2" />
    <line x1="50" y1="282" x2="820" y2="282" stroke="#e0e8e2" stroke-width="1.5" />
    <line x1="50" y1="357" x2="820" y2="357" stroke="#e0e8e2" stroke-width="1.5" />
    <line x1="50" y1="492" x2="820" y2="492" stroke="#e0e8e2" stroke-width="1.5" />
    <line x1="50" y1="637" x2="820" y2="637" stroke="#e0e8e2" stroke-width="1.5" />
    <line x1="50" y1="712" x2="820" y2="712" stroke="#e0e8e2" stroke-width="1.5" />
    <line x1="50" y1="777" x2="820" y2="777" stroke="#e0e8e2" stroke-width="1.5" />

    
    <text x="65" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">play and task vars</text>
    <text x="345" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the place where they are defined</text>

    
    <text x="65" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">inventory, group</tspan>
      <tspan x="65" dy="28">and host vars</tspan>
    </text>
    <text x="345" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">each host for the whole run</text>

    
    <text x="65" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">set_fact and register</text>
    <text x="345" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="345" dy="0">host-scoped, stay for the rest of</tspan>
      <tspan x="345" dy="28">the play run; with cacheable: true and</tspan>
      <tspan x="345" dy="28">fact caching enabled they carry into</tspan>
      <tspan x="345" dy="28">later runs</tspan>
    </text>

    
    <rect x="52" y="493" width="766" height="143" fill="#db8129" fill-opacity="0.12" stroke="#db8129" stroke-width="2" />
    <text x="65" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">run_once task</text>
    <text x="345" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="345" dy="0">sets the variable only on the host that</tspan>
      <tspan x="345" dy="28">ran it, unless you distribute it with</tspan>
      <tspan x="345" dy="28">delegate_facts or by iterating over</tspan>
      <tspan x="345" dy="28">hostvars</tspan>
    </text>

    
    <text x="65" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">include_vars</text>
    <text x="345" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="345" dy="0">loads at runtime, precedence</tspan>
      <tspan x="345" dy="28">above play vars</tspan>
    </text>

    
    <text x="65" y="752" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">vars_files</text>
    <text x="345" y="752" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">loads at the start of the play</text>

    
    <text x="65" y="828" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">role variables</text>
    <text x="345" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="345" dy="0">not scoped by default: visible to</tspan>
      <tspan x="345" dy="28">later roles and tasks, hence prefixes</tspan>
    </text>
  </g>

  
  <g id="lazy-rendering-panel">
    
    <rect x="850" y="160" width="700" height="730" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <path d="M 850 172 A 12 12 0 0 1 862 160 L 1538 160 A 12 12 0 0 1 1550 172 L 1550 255 L 850 255 Z" fill="#e8f1ea" />

    
    <g transform="translate(868, 178)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="945" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="945" dy="0">lazy means evaluated when used,</tspan>
      <tspan x="945" dy="36">not when defined</tspan>
    </text>

    
    <rect x="870" y="275" width="660" height="85" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="890" y="310" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="890" dy="0">group_vars/all.yml: driver_pkg:</tspan>
      <tspan x="890" dy="30">"nvidia-driver-{{ nvidia_driver_branch }}"</tspan>
    </text>

    
    <rect x="870" y="380" width="660" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="912" cy="420" r="24" fill="#207448" />
    <text x="912" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="955" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="955" dy="0">a host-level override of</tspan>
      <tspan x="955" dy="28">nvidia_driver_branch to another value</tspan>
    </text>

    
    <line x1="1200" y1="460" x2="1200" y2="493" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="870" y="495" width="660" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="912" cy="535" r="24" fill="#207448" />
    <text x="912" y="543" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="955" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="955" dy="0">the branch is filled in only</tspan>
      <tspan x="955" dy="28">when a task reads driver_pkg</tspan>
    </text>

    
    <line x1="1200" y1="575" x2="1200" y2="608" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

    
    <rect x="870" y="610" width="660" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="912" cy="650" r="24" fill="#207448" />
    <text x="912" y="658" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="955" y="642" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="955" dy="0">that host installs the package name</tspan>
      <tspan x="955" dy="28">built from its own branch</tspan>
    </text>

    
    <rect x="870" y="715" width="660" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(885, 765)">
      <path d="M 22 4 L 40 12 L 40 26 C 40 38 22 46 22 46 C 22 46 4 38 4 26 L 4 12 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <line x1="22" y1="16" x2="22" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="22" cy="35" r="2" fill="#207448" />
    </g>
    <text x="945" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="945" dy="0">x: "{{ x }}" produces an error because the</tspan>
      <tspan x="945" dy="32">value keeps asking for itself; b: "{{ a }}-x"</tspan>
      <tspan x="945" dy="32">is templated at the point of use</tspan>
    </text>
  </g>

  
  <g id="scenario-strip">
    <rect x="50" y="915" width="1500" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(75, 962)">
      <rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="4" x2="18" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="4" x2="28" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="4" x2="38" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="46" x2="18" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="46" x2="28" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="46" x2="38" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="38" x2="52" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="155" y="960" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="155" dy="0">a set_fact stores a driver value on each GPU host and the next task in the same play reads it;</tspan>
      <tspan x="155" dy="36">a task on a different host sees its own value; one answer shared by every host needs delegation</tspan>
      <tspan x="155" dy="36">or hostvars, run_once alone is not enough</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1090" width="1500" height="65" rx="8" fill="#207448" />
    <text x="800" y="1132" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Check the precedence order in 4.5 before you rely on a value</text>
  </g>
</svg>