<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Huge pages: explicit versus transparent</title>
  <desc>Visual comparison between Explicit hugetlb and Transparent THP, illustrating reservation methods, configuration parameters, and recommended workloads.</desc>

  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Huge pages: explicit versus transparent</text>

  
  <rect x="40" y="95" width="1520" height="76" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(64, 105)">
    <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="18" y="18" width="20" height="20" rx="3" fill="#207448"/>
    <line x1="20" y1="2" x2="20" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="2" x2="36" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="48" x2="20" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="48" x2="36" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="20" x2="54" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="36" x2="54" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="145" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">huge pages shrink the page table and raise TLB reach</text>

  
  <rect x="40" y="195" width="740" height="925" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="40" y="195" width="740" height="105" rx="18" fill="#e8f1ea"/>
  <rect x="40" y="280" width="740" height="20" fill="#e8f1ea"/>
  
  <g transform="translate(68, 219)">
    <rect x="6" y="20" width="44" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M16 20 V14 A12 12 0 0 1 40 14 V20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="34" r="4" fill="#207448"/>
    <line x1="28" y1="38" x2="28" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="146" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Explicit hugetlb</text>

  
  <rect x="65" y="325" width="690" height="210" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(88, 345)">
    <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M6 14 v26 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8 v-26" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M6 27 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="162" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">reserved in a dedicated pool</text>
  
  <rect x="85" y="420" width="650" height="92" rx="10" fill="#e8f1ea"/>
  <text x="105" y="458" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#303a36">echo 1024 | sudo tee /proc/sys/vm/nr_hugepages</text>
  <text x="105" y="494" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">is 2 GiB</text>

  
  <rect x="65" y="560" width="690" height="160" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(88, 580)">
    <path d="M28 8 L48 16 V28 C48 40 38 49 28 53 C18 49 8 40 8 28 V16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="20" y1="26" x2="36" y2="34" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="36" y1="26" x2="20" y2="34" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="162" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">not swappable</text>
  <text x="162" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">only apps that ask use it</text>

  
  <rect x="65" y="745" width="690" height="150" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(88, 765)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="12" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 16 A16 16 0 1 0 38 16" fill="none" stroke="#207448" stroke-width="3.5"/>
  </g>
  <text x="162" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">1 GiB pages need boot parameters</text>

  
  <rect x="65" y="920" width="690" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(88, 940)">
    <rect x="6" y="8" width="44" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="6" y1="20" x2="50" y2="20" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="14" r="2.5" fill="#207448"/>
    <circle cx="22" cy="14" r="2.5" fill="#207448"/>
    <rect x="14" y="27" width="12" height="12" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="30" y="27" width="12" height="12" fill="none" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="162" y="990" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">for VM guests, DPDK, RDMA,</text>
  <text x="162" y="1040" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">large in-memory databases</text>


  
  <rect x="820" y="195" width="740" height="925" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="820" y="195" width="740" height="105" rx="18" fill="#e8f1ea"/>
  <rect x="820" y="280" width="740" height="20" fill="#e8f1ea"/>
  
  <g transform="translate(848, 219)">
    <circle cx="28" cy="28" r="9" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M28 6 v6 M28 44 v6 M6 28 h6 M44 28 h6 M12 12 l4.5 4.5 M39.5 39.5 l4.5 4.5 M12 44 l4.5 -4.5 M39.5 16.5 l4.5 -4.5" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="926" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Transparent THP</text>

  
  <rect x="845" y="325" width="690" height="210" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(868, 345)">
    <rect x="6" y="6" width="20" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="30" y="6" width="20" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="6" y="30" width="20" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="30" y="30" width="20" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
  </g>
  <text x="942" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">kernel backs large aligned anonymous</text>
  <text x="942" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">regions with 2 MiB pages by itself</text>

  
  <rect x="845" y="560" width="690" height="160" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(868, 580)">
    <line x1="8" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="8" y1="38" x2="48" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="20" cy="16" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
    <circle cx="36" cy="38" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  </g>
  <text x="942" y="605" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#303a36">/sys/kernel/mm/transparent_hugepage/enabled</text>
  <text x="942" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">has values always, madvise, never</text>

  
  <rect x="845" y="745" width="690" height="150" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(868, 765)">
    <circle cx="14" cy="28" r="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="42" cy="16" r="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="42" cy="40" r="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="20" y1="25" x2="36" y2="19" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="31" x2="36" y2="37" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="942" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">training nodes always or madvise</text>

  
  <rect x="845" y="920" width="690" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(868, 940)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="942" y="970" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">latency-critical inference, databases, Redis</text>
  
  <text x="942" y="1035" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">madvise or never with</text>
  
  
  <rect x="1225" y="1003" width="180" height="46" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <text x="1237" y="1035" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" font-weight="bold" fill="#db8129">defrag=defer</text>

</svg>