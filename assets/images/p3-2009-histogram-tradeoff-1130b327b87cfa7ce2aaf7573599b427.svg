<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Percentile sketches: exact, reservoir sample and fixed buckets</title>
  <desc>Visual comparison of three percentile estimation approaches: exact nearest rank, reservoir sampling with Algorithm R, and fixed-bucket histograms like Prometheus, with empirical sample accuracy measurements.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="40" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Percentile sketches: exact, reservoir sample and fixed buckets</text>

  
  <g id="col-exact">
    <rect x="40" y="120" width="480" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="60" y="145" width="48" height="52" rx="6"/>
      <line x1="72" y1="162" x2="96" y2="162"/>
      <line x1="72" y1="174" x2="96" y2="174"/>
      <line x1="72" y1="186" x2="88" y2="186"/>
      <circle cx="96" cy="186" r="3" fill="#207448"/>
    </g>

    
    <text x="126" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Exact: nearest rank</text>

    
    <g transform="translate(60, 230)">
      <rect x="0" y="0" width="440" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <rect x="20" y="20" width="60" height="40" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="88" y="20" width="60" height="40" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="156" y="20" width="60" height="40" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="224" y="20" width="60" height="40" rx="4" fill="#207448" stroke="#207448" stroke-width="2"/>
      <rect x="292" y="20" width="60" height="40" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="360" y="20" width="60" height="40" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <path d="M 254 75 L 254 62" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    
    <rect x="60" y="340" width="440" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="80" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">rank = ceil(p / 100 x N),</tspan>
      <tspan x="80" dy="36">the smallest value with at</tspan>
      <tspan x="80" dy="36">least p percent at or below it</tspan>
    </text>

    
    <rect x="60" y="555" width="440" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="80" y="620" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">needs every sample</text>
  </g>

  
  <g id="col-reservoir">
    <rect x="560" y="120" width="480" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 580 148 L 628 148 L 614 174 L 614 198 L 594 198 L 594 174 Z"/>
      <circle cx="604" cy="162" r="3" fill="#207448"/>
    </g>

    
    <text x="646" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="646" dy="0">Reservoir sample</tspan>
      <tspan x="646" dy="34">(Algorithm R)</tspan>
    </text>

    
    <g transform="translate(580, 230)">
      <rect x="0" y="0" width="440" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <circle cx="28" cy="40" r="7" fill="#207448"/>
      <circle cx="52" cy="40" r="7" fill="#207448"/>
      <circle cx="76" cy="40" r="7" fill="#207448"/>
      
      <line x1="94" y1="40" x2="150" y2="40" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
      
      <g transform="translate(165, 15)">
        <rect x="0" y="0" width="255" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <line x1="51" y1="0" x2="51" y2="50" stroke="#207448" stroke-width="2"/>
        <line x1="102" y1="0" x2="102" y2="50" stroke="#207448" stroke-width="2"/>
        <line x1="153" y1="0" x2="153" y2="50" stroke="#207448" stroke-width="2"/>
        <line x1="204" y1="0" x2="204" y2="50" stroke="#207448" stroke-width="2"/>
        <circle cx="25" cy="25" r="8" fill="#207448"/>
        <circle cx="76" cy="25" r="8" fill="#207448"/>
        <circle cx="127" cy="25" r="8" fill="#207448"/>
        <circle cx="178" cy="25" r="8" fill="#207448"/>
        <circle cx="230" cy="25" r="8" fill="#207448"/>
      </g>
    </g>

    
    <rect x="580" y="340" width="440" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="600" y="378" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">after the first k,</tspan>
      <tspan x="600" dy="36">item number n replaces a</tspan>
      <tspan x="600" dy="36">random slot with</tspan>
      <tspan x="600" dy="36">probability k over n</tspan>
    </text>

    
    <rect x="580" y="555" width="440" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="600" y="594" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">every item seen so far has</tspan>
      <tspan x="600" dy="34">the same chance of being</tspan>
      <tspan x="600" dy="34">in the sample</tspan>
    </text>
  </g>

  
  <g id="col-fixed-buckets">
    <rect x="1080" y="120" width="480" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="1100" y1="198" x2="1148" y2="198"/>
      <line x1="1108" y1="198" x2="1108" y2="180"/>
      <line x1="1120" y1="198" x2="1120" y2="162"/>
      <line x1="1132" y1="198" x2="1132" y2="148"/>
      <line x1="1144" y1="198" x2="1144" y2="170"/>
    </g>

    
    <text x="1160" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1160" dy="0">Fixed-bucket histogram</tspan>
      <tspan x="1160" dy="34">(like Prometheus)</tspan>
    </text>

    
    <g transform="translate(1100, 230)">
      <rect x="0" y="0" width="440" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="220" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">bucket ratio</text>
      
      <rect x="25" y="44" width="28" height="26" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="58" y="38" width="40" height="32" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="103" y="32" width="58" height="38" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="166" y="26" width="84" height="44" fill="#207448" stroke="#207448" stroke-width="2"/>
      <rect x="255" y="34" width="120" height="36" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="380" y="42" width="45" height="28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    </g>

    
    <rect x="1100" y="340" width="440" height="325" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1120" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1120" dy="0">memory depends on the</tspan>
      <tspan x="1120" dy="36">number of buckets, not on traffic;</tspan>
      <tspan x="1120" dy="36">histograms from many servers</tspan>
    </text>

    
    <g transform="translate(1120, 480)">
      <rect x="0" y="0" width="400" height="150" rx="10" fill="#fff9f5" stroke="#db8129" stroke-width="4"/>
      <text x="200" y="85" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">add bucket by bucket</text>
    </g>
  </g>

  
  <g id="bottom-table" transform="translate(40, 715)">
    <rect x="0" y="0" width="1520" height="275" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <text x="30" y="42" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">200,000 lognormal samples</text>

    
    <rect x="30" y="65" width="400" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="230" y="168" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">exact p99 = 551.79</text>

    
    <rect x="460" y="65" width="490" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="485" y="118" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">ratio 1.1, 123 buckets: 593.35</text>

    
    <rect x="460" y="165" width="490" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="485" y="218" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">ratio 1.02, 584 buckets: 553.93</text>

    
    <line x1="985" y1="108" x2="985" y2="208" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1015" y="146" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1015" dy="0">finer buckets, smaller error,</tspan>
      <tspan x="1015" dy="36">more memory</tspan>
    </text>
  </g>

  
  <g id="footnote" transform="translate(40, 1015)">
    <rect x="0" y="0" width="1520" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="30" y="48" font-family="monospace" font-size="24" fill="#303a36">Prometheus: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))</text>
    <text x="30" y="94" font-family="sans-serif" font-size="24" fill="#303a36">works only while bucket boundaries match across instances.</text>
  </g>
</svg>