<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>The Clos black-hole caveat</title>
  <desc>Visual infographic explaining how route summarization on spines causes black holes when downlinks fail in a Clos fabric.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#db8129" />
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#f5f8f5" />

  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The Clos black-hole caveat</text>

  <g id="panel-fabric">
    <rect x="40" y="100" width="1520" height="825" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="75" y="145" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Fabric drawing</text>

    
    <g transform="translate(330, 165)">
      <rect width="260" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(25, 17)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="24" fill="#e8f1ea" />
        <line x1="14" y1="28" x2="42" y2="28" />
        <polyline points="19,23 14,28 19,33" />
        <polyline points="37,23 42,28 37,33" />
        <line x1="28" y1="14" x2="28" y2="42" />
        <polyline points="23,19 28,14 33,19" />
        <polyline points="23,37 28,42 33,37" />
      </g>
      <text x="165" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">border</text>
    </g>

    
    <path d="M 380 255 L 177 395" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <path d="M 430 255 L 367 395" fill="none" stroke="#db8129" stroke-width="4.5" marker-end="url(#arrow-orange)" />
    <path d="M 490 255 L 557 395" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <path d="M 540 255 L 747 395" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <g transform="translate(70, 360)">
      <rect width="780" height="175" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" />
      <text x="25" y="33" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">four spines</text>

      
      <g transform="translate(25, 45)">
        <rect width="165" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <g transform="translate(54, 25)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
          <line x1="12" y1="14" x2="44" y2="14" />
          <polyline points="38,9 44,14 38,19" />
          <line x1="44" y1="24" x2="12" y2="24" />
          <polyline points="18,19 12,24 18,29" />
        </g>
      </g>

      
      <g transform="translate(215, 45)">
        <rect width="165" height="105" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="3" />
        <g transform="translate(54, 15)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="38" rx="6" fill="#fff0e0" />
          <line x1="12" y1="14" x2="44" y2="14" />
          <polyline points="38,9 44,14 38,19" />
          <line x1="44" y1="24" x2="12" y2="24" />
          <polyline points="18,19 12,24 18,29" />
        </g>
        <text x="82" y="88" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">spine2</text>
      </g>

      
      <g transform="translate(405, 45)">
        <rect width="165" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <g transform="translate(54, 25)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
          <line x1="12" y1="14" x2="44" y2="14" />
          <polyline points="38,9 44,14 38,19" />
          <line x1="44" y1="24" x2="12" y2="24" />
          <polyline points="18,19 12,24 18,29" />
        </g>
      </g>

      
      <g transform="translate(595, 45)">
        <rect width="165" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <g transform="translate(54, 25)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
          <line x1="12" y1="14" x2="44" y2="14" />
          <polyline points="38,9 44,14 38,19" />
          <line x1="44" y1="24" x2="12" y2="24" />
          <polyline points="18,19 12,24 18,29" />
        </g>
      </g>
    </g>

    
    <path d="M 177 535 L 365 770" stroke="#207448" stroke-width="3.5" />

    <path d="M 367 535 L 388 615" stroke="#db8129" stroke-width="3.5" stroke-dasharray="6,6" />
    <path d="M 405 675 L 430 770" stroke="#db8129" stroke-width="3.5" stroke-dasharray="6,6" opacity="0.4" />

    
    <circle cx="397" cy="645" r="20" fill="#fff9f3" stroke="#db8129" stroke-width="3" />
    <line x1="387" y1="635" x2="407" y2="655" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />
    <line x1="407" y1="635" x2="387" y2="655" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />

    
    <g transform="translate(125, 620)">
      <rect width="235" height="52" rx="10" fill="#fff9f3" stroke="#db8129" stroke-width="2.5" />
      <text x="117" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">A broken link</text>
    </g>

    <path d="M 557 535 L 495 770" stroke="#207448" stroke-width="3.5" />
    <path d="M 747 535 L 555 770" stroke="#207448" stroke-width="3.5" />

    
    <g transform="translate(330, 770)">
      <rect width="260" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(25, 23)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
        <line x1="12" y1="14" x2="44" y2="14" />
        <polyline points="38,9 44,14 38,19" />
        <line x1="44" y1="24" x2="12" y2="24" />
        <polyline points="18,19 12,24 18,29" />
      </g>
      <text x="165" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">leaf3</text>
    </g>

    
    
    <g transform="translate(890, 165)">
      <rect width="630" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(28, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="24" fill="#e8f1ea" />
        <circle cx="28" cy="28" r="6" fill="#207448" />
        <path d="M 14 18 A 16 16 0 0 1 42 18" />
        <path d="M 8 12 A 26 26 0 0 1 48 12" />
      </g>
      <text x="105" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Every spine advertises aggregate</text>
      <text x="105" y="98" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">10.10.0.0/16</text>
    </g>

    
    <g transform="translate(890, 340)">
      <rect width="630" height="440" rx="16" fill="#fff9f3" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(32, 35)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="28,6 52,48 4,48" fill="#fff0e0" />
        <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" />
        <circle cx="28" cy="41" r="2.5" fill="#db8129" />
      </g>

      <text x="32" y="128" font-family="sans-serif" font-size="25" fill="#303a36">
        <tspan x="32" dy="0">The border sees one covering route</tspan>
        <tspan x="32" dy="40">from all spines and sprays the client's</tspan>
        <tspan x="32" dy="40">flows across all four, including spine2,</tspan>
        <tspan x="32" dy="40">which still advertises the aggregate</tspan>
        <tspan x="32" dy="40">but cannot reach leaf3, so those</tspan>
        <tspan x="32" dy="40">packets are dropped</tspan>
      </text>

      <g transform="translate(32, 375)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="0" y1="0" x2="566" y2="0" stroke-dasharray="8,8" />
      </g>
    </g>
  </g>

  
  <g id="panel-rules" transform="translate(40, 955)">
    <rect width="1520" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="35" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Rules strip</text>

    
    <g transform="translate(230, 15)">
      <rect width="610" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(20, 20)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="18" fill="#e8f1ea" />
        <polyline points="12,20 18,26 28,14" />
      </g>
      <text x="75" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="75" dy="0">do not summarise where a specific route</tspan>
        <tspan x="75" dy="30">is needed for correctness</tspan>
      </text>
    </g>

    
    <g transform="translate(870, 15)">
      <rect width="620" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(20, 20)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="18" fill="#e8f1ea" />
        <line x1="10" y1="20" x2="30" y2="20" />
        <polyline points="22,12 30,20 22,28" />
      </g>
      <text x="75" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="75" dy="0">summarise only toward the outside,</tspan>
        <tspan x="75" dy="30">at the border or WAN</tspan>
      </text>
    </g>
  </g>
</svg>