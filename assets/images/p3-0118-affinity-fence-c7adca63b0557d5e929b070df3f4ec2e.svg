<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Affinity and cpuset: the fence and the spot you stand on</title>
  <desc>Visual infographic explaining CPU cgroup cpuset as an outer allowed fence and taskset affinity as a narrower inner placement that cannot escape the cpuset boundary.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Affinity and cpuset: the fence and the spot you stand on</text>

  
  
  
  <rect x="40" y="90" width="920" height="560" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

  
  <g transform="translate(65, 112)">
    <rect x="0" y="0" width="44" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <rect x="10" y="10" width="24" height="24" rx="3" fill="#207448"/>
    <line x1="8" y1="0" x2="8" y2="-6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="22" y2="-6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="0" x2="36" y2="-6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="44" x2="8" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="44" x2="22" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="-6" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="-6" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="36" x2="-6" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="8" x2="50" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="22" x2="50" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="36" x2="50" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <g transform="translate(70, 200)">
    <text x="0" y="0" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="0" dy="0">affinity can only narrow</tspan>
      <tspan x="0" dy="32">the cpuset,</tspan>
      <tspan x="0" dy="32">never escape it</tspan>
    </text>
  </g>

  
  <rect x="430" y="125" width="505" height="500" rx="16" fill="#ffffff" fill-opacity="0.5" stroke="#207448" stroke-width="4" stroke-dasharray="14 10"/>

  
  <g transform="translate(682, 165)">
    <text x="0" y="0" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">cgroup cpuset: the allowed set,</text>
    <text x="0" y="34" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">set from outside</text>
    <text x="0" y="68" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">(cpuset.cpus 4-7)</text>
  </g>

  
  <rect x="445" y="275" width="280" height="335" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>

  
  <g transform="translate(585, 315)">
    <text x="0" y="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">taskset -c 4-5:</text>
    <text x="0" y="34" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">affinity,</text>
    <text x="0" y="66" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">narrows the set</text>
  </g>

  
  
  <rect x="65" y="480" width="75" height="90" rx="8" fill="#ffffff" stroke="#7a8f83" stroke-width="2"/>
  <text x="102" y="538" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">0</text>

  
  <rect x="155" y="480" width="75" height="90" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="192" y="538" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">1</text>

  
  <rect x="245" y="480" width="75" height="90" rx="8" fill="#ffffff" stroke="#7a8f83" stroke-width="2"/>
  <text x="282" y="538" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">2</text>

  
  <rect x="335" y="480" width="75" height="90" rx="8" fill="#ffffff" stroke="#7a8f83" stroke-width="2"/>
  <text x="372" y="538" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">3</text>

  
  <rect x="460" y="480" width="115" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="517" y="538" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">4</text>

  
  <rect x="590" y="480" width="115" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="647" y="538" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">5</text>

  
  <rect x="740" y="480" width="85" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="782" y="538" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">6</text>

  
  <rect x="835" y="480" width="85" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="877" y="538" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">7</text>

  
  <path d="M 445 350 L 192 350 L 192 468" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>

  
  <g transform="translate(305, 350)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="-9" y1="9" x2="9" y2="-9" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  </g>


  
  
  
  <rect x="990" y="90" width="570" height="560" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

  
  <g transform="translate(1015, 114)">
    <rect x="0" y="0" width="44" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <path d="M 8 12 L 18 20 L 8 28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="29" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Commands</text>
  </g>

  
  <rect x="1015" y="170" width="520" height="62" rx="8" fill="#ffffff" stroke="#c4d8cb" stroke-width="1.5"/>
  <text x="1035" y="209" font-family="monospace" font-size="24" fill="#303a36">taskset -c 0-7 ./prog</text>

  
  <rect x="1015" y="244" width="520" height="74" rx="8" fill="#ffffff" stroke="#c4d8cb" stroke-width="1.5"/>
  <text x="1035" y="276" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">taskset -cp 8-15 PID</tspan>
    <tspan x="1035" dy="28">  (all threads: -a)</tspan>
  </text>

  
  <rect x="1015" y="330" width="520" height="74" rx="8" fill="#ffffff" stroke="#c4d8cb" stroke-width="1.5"/>
  <text x="1035" y="362" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">taskset -pc PID</tspan>
    <tspan x="1035" dy="28">  shows the list</tspan>
  </text>

  
  <rect x="1015" y="416" width="520" height="106" rx="8" fill="#ffffff" stroke="#c4d8cb" stroke-width="1.5"/>
  <text x="1035" y="446" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">grep -E Cpus_allowed_list|</tspan>
    <tspan x="1035" dy="28">  Mems_allowed_list</tspan>
    <tspan x="1035" dy="28">  /proc/PID/status</tspan>
  </text>

  
  <rect x="1015" y="534" width="520" height="98" rx="8" fill="#ffffff" stroke="#c4d8cb" stroke-width="1.5"/>
  <text x="1035" y="566" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">python3 -c</tspan>
    <tspan x="1035" dy="28">  os.sched_setaffinity(</tspan>
    <tspan x="1035" dy="28">    0, {0,1,2,3})</tspan>
  </text>


  
  
  
  <rect x="40" y="675" width="1520" height="395" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

  
  <g transform="translate(65, 698)">
    <polygon points="22,4 42,40 2,40" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="22" y1="16" x2="22" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="22" cy="34" r="2" fill="#207448"/>
    <text x="56" y="31" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pitfalls</text>
  </g>

  
  <circle cx="80" cy="762" r="6" fill="#207448"/>
  <text x="102" y="770" font-family="sans-serif" font-size="24" fill="#303a36">Pinning on a shared host can collide with other tenants pinning the same cores</text>

  
  <circle cx="80" cy="808" r="6" fill="#207448"/>
  <text x="102" y="816" font-family="sans-serif" font-size="24" fill="#303a36">Pins go stale after hardware or topology changes</text>

  
  <circle cx="80" cy="854" r="6" fill="#207448"/>
  <text x="102" y="862" font-family="sans-serif" font-size="24" fill="#303a36">Pinning a multithreaded process to fewer cores than it has busy threads causes contention</text>

  
  <circle cx="80" cy="902" r="6" fill="#207448"/>
  <text x="102" y="908" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="102" dy="0">OpenMP, MKL and BLAS thread pools can oversubscribe: check</tspan>
    <tspan x="102" dy="30" font-family="monospace">OMP_NUM_THREADS, MKL_NUM_THREADS, OMP_PROC_BIND, OMP_PLACES</tspan>
  </text>

  
  <rect x="65" y="976" width="1470" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(85, 995)">
    <circle cx="18" cy="18" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="18" y="26" font-family="sans-serif" font-size="22" font-weight="bold" fill="#207448" text-anchor="middle">i</text>
    <text x="50" y="25" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">One thread per physical core avoids SMT contention</text>
  </g>


  
  
  
  <rect x="40" y="1095" width="1520" height="65" rx="10" fill="#207448" filter="url(#shadow)"/>
  <text x="800" y="1136" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Affinity passes down to children and to threads created later</text>

</svg>