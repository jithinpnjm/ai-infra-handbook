<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Job Array Execution, Throttling, and Task Dispatch</title>
  <desc>Architectural diagram illustrating how sbatch --array=0-99%10 script.sh executes across nodes with ID variables, throttling window, config mapping, and log control.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#207448" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1380" fill="#f5f8f5" />

  
  <g transform="translate(50, 45)">
    <text x="0" y="40" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Job Array Execution, Throttling, and Task Dispatch</text>
    <rect x="0" y="60" width="470" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="14" y="85" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">sbatch --array=0-99%10 script.sh</text>
  </g>

  
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="1500" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 20)">
      
      <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M24 2 v6 M24 40 v6 M2 24 h6 M40 24 h6 M8 8 l5 5 M35 35 l5 5 M8 40 l5 -5 M35 9 l5 -5" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <text x="60" y="32" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">ID Hierarchy and Variables</text>
    </g>

    
    <g transform="translate(24, 75)">
      
      <rect x="0" y="0" width="460" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="20" y="40" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Array Master Job ID</text>
      <text x="20" y="78" font-family="monospace" font-size="24px" fill="#207448">SLURM_ARRAY_JOB_ID</text>
      <text x="20" y="118" font-family="sans-serif" font-size="24px" fill="#303a36">(variable %A, e.g., 12345)</text>

      
      <rect x="490" y="0" width="470" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="20" y="38" font-family="sans-serif" font-size="24px" fill="#303a36">total count</text>
      <text x="150" y="38" font-family="monospace" font-size="24px" fill="#207448">SLURM_ARRAY_TASK_COUNT</text>
      <text x="20" y="74" font-family="sans-serif" font-size="24px" fill="#303a36">(100 tasks)</text>
      <line x1="20" y1="90" x2="450" y2="90" stroke="#c0d4c4" stroke-width="1.5" />
      <text x="20" y="125" font-family="sans-serif" font-size="24px" fill="#303a36">task indices</text>
      <text x="160" y="125" font-family="monospace" font-size="24px" fill="#207448">SLURM_ARRAY_TASK_ID</text>
      <text x="20" y="148" font-family="sans-serif" font-size="24px" fill="#303a36">(%a, 0 through 99)</text>

      
      <rect x="990" y="0" width="460" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="20" y="42" font-family="sans-serif" font-size="24px" fill="#303a36">Each task receives its</text>
      <text x="20" y="76" font-family="sans-serif" font-size="24px" fill="#303a36">own unique</text>
      <text x="160" y="76" font-family="monospace" font-size="24px" fill="#207448">SLURM_JOB_ID</text>
      <text x="350" y="76" font-family="sans-serif" font-size="24px" fill="#303a36">(%j)</text>
      <text x="20" y="122" font-family="monospace" font-size="24px" fill="#303a36">e.g., 12346, 12347, ...</text>
    </g>
  </g>

  
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="1500" height="390" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(24, 20)">
      
      <rect x="4" y="4" width="38" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="14" y="14" width="18" height="18" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="12" y1="0" x2="12" y2="4" stroke="#207448" stroke-width="3" />
      <line x1="23" y1="0" x2="23" y2="4" stroke="#207448" stroke-width="3" />
      <line x1="34" y1="0" x2="34" y2="4" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="42" x2="12" y2="46" stroke="#207448" stroke-width="3" />
      <line x1="23" y1="42" x2="23" y2="46" stroke="#207448" stroke-width="3" />
      <line x1="34" y1="42" x2="34" y2="46" stroke="#207448" stroke-width="3" />
      <text x="60" y="32" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Throttling window</text>
    </g>

    
    <g transform="translate(24, 75)">
      <rect x="0" y="0" width="700" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="38" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">A sliding execution window of size %10</text>
      <text x="20" y="76" font-family="sans-serif" font-size="24px" fill="#303a36">tasks 0 through 9 in</text>
      <text x="250" y="76" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">state R (RUNNING)</text>
      <text x="20" y="112" font-family="sans-serif" font-size="24px" fill="#303a36">across compute nodes</text>

      
      <g transform="translate(20, 130)">
        <rect x="0" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="14" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">0</text>
        <rect x="66" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="80" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">1</text>
        <rect x="132" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="146" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">2</text>
        <rect x="198" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="212" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">3</text>
        <rect x="264" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="278" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">4</text>
        <text x="340" y="32" font-family="sans-serif" font-size="28px" fill="#207448">...</text>
        <rect x="400" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="414" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">8</text>
        <rect x="466" y="0" width="58" height="46" rx="6" fill="#207448" />
        <text x="480" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">9</text>
      </g>
    </g>

    
    <g transform="translate(760, 75)">
      <rect x="0" y="0" width="715" height="195" rx="10" fill="#fdfdfd" stroke="#889890" stroke-width="2" stroke-dasharray="6 4" />
      <text x="24" y="38" font-family="sans-serif" font-size="24px" fill="#303a36">while tasks 10 through 99 wait in</text>
      <text x="405" y="38" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#75857e">state PD (PENDING)</text>

      
      <g transform="translate(24, 130)">
        <rect x="0" y="0" width="64" height="46" rx="6" fill="#dbe5de" stroke="#75857e" stroke-width="1.5" />
        <text x="14" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">10</text>
        <rect x="74" y="0" width="64" height="46" rx="6" fill="#dbe5de" stroke="#75857e" stroke-width="1.5" />
        <text x="88" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">11</text>
        <rect x="148" y="0" width="64" height="46" rx="6" fill="#dbe5de" stroke="#75857e" stroke-width="1.5" />
        <text x="162" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">12</text>
        <text x="235" y="32" font-family="sans-serif" font-size="28px" fill="#75857e">.........</text>
        <rect x="360" y="0" width="64" height="46" rx="6" fill="#dbe5de" stroke="#75857e" stroke-width="1.5" />
        <text x="374" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">98</text>
        <rect x="434" y="0" width="64" height="46" rx="6" fill="#dbe5de" stroke="#75857e" stroke-width="1.5" />
        <text x="448" y="32" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">99</text>
      </g>
    </g>

    
    <g transform="translate(24, 290)">
      
      <path d="M 760 30 C 740 30, 735 30, 715 30" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrowhead-orange)" />
      
      <rect x="0" y="5" width="1452" height="72" rx="8" fill="#fff6eb" stroke="#db8129" stroke-width="2" />
      <text x="20" y="35" font-family="sans-serif" font-size="24px" fill="#303a36">An arrow indicates that as task 0 completes, task 10 moves into the active execution window,</text>
      <text x="20" y="63" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">protecting shared storage and scheduler fair-share.</text>
    </g>
  </g>

  
  <g transform="translate(50, 870)">
    <rect x="0" y="0" width="730" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(24, 20)">
      
      <path d="M6 4 h22 l10 10 v26 h-32 z" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M28 4 v10 h10" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="20" x2="26" y2="20" stroke="#207448" stroke-width="2.5" />
      <line x1="12" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="2.5" />
      <line x1="12" y1="34" x2="24" y2="34" stroke="#207448" stroke-width="2.5" />
      <text x="56" y="32" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Config file indexing</text>
    </g>

    
    <g transform="translate(24, 80)">
      
      <rect x="0" y="0" width="682" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="20" y="36" font-family="sans-serif" font-size="24px" fill="#303a36">Shows</text>
      <text x="100" y="36" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">configs.txt</text>
      <text x="245" y="36" font-family="sans-serif" font-size="24px" fill="#303a36">with 1-based lines;</text>
      <text x="20" y="74" font-family="monospace" font-size="24px" fill="#303a36">Line 1: paramA=10 | Line 2: paramA=20 ...</text>

      
      <g transform="translate(0, 120)">
        <text x="0" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">command</text>
        <rect x="0" y="35" width="682" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
        <text x="16" y="72" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">CONFIG=$(sed -n '$((SLURM_ARRAY_TASK_ID+1))p'</text>
        <text x="16" y="106" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">         configs.txt)</text>
      </g>

      
      <g transform="translate(0, 275)">
        <rect x="0" y="0" width="682" height="75" rx="8" fill="#e8f1ea" />
        <text x="16" y="34" font-family="sans-serif" font-size="24px" fill="#303a36">maps task 0 to line 1, task 1 to line 2,</text>
        <text x="16" y="64" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">avoiding off-by-one errors.</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(820, 870)">
    <rect x="0" y="0" width="730" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(24, 20)">
      
      <rect x="4" y="6" width="40" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M12 18 l6 5 l-6 5" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="22" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <text x="56" y="32" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Output logging and scancel control</text>
    </g>

    
    <g transform="translate(24, 80)">
      
      <rect x="0" y="0" width="682" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="20" y="36" font-family="sans-serif" font-size="24px" fill="#303a36">Default output</text>
      <text x="190" y="36" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">slurm-%A_%a.out</text>
      <text x="20" y="74" font-family="sans-serif" font-size="24px" fill="#303a36">produces individual logs</text>
      <text x="20" y="110" font-family="monospace" font-size="24px" fill="#207448">slurm-12345_0.out, slurm-12345_1.out</text>

      
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="682" height="200" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
        <text x="20" y="38" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">callout contrasts</text>

        
        <g transform="translate(20, 52)">
          <rect x="0" y="0" width="642" height="58" rx="6" fill="#e8f1ea" />
          <text x="16" y="38" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">scancel 12345</text>
          <text x="210" y="38" font-family="sans-serif" font-size="24px" fill="#303a36">(cancels all 100 tasks)</text>
        </g>

        
        <g transform="translate(20, 122)">
          <rect x="0" y="0" width="642" height="58" rx="6" fill="#e8f1ea" />
          <text x="16" y="38" font-family="sans-serif" font-size="24px" fill="#303a36">versus</text>
          <text x="100" y="38" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">scancel 12345_7</text>
          <text x="320" y="38" font-family="sans-serif" font-size="24px" fill="#303a36">(cancels only task index 7)</text>
        </g>
      </g>
    </g>
  </g>
</svg>