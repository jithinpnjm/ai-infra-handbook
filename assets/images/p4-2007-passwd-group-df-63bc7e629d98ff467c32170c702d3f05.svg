<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>Anatomy of /etc/passwd, /etc/group, and df -P for Console Parsing</title>
  <desc>Visual guide to parsing /etc/passwd, /etc/group, and df -P with predictable field separators and edge case handling.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1400" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Anatomy of /etc/passwd, /etc/group, and df -P for Console Parsing
  </text>

  
  <rect x="60" y="110" width="1480" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(90, 130)">
    <rect x="0" y="0" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="16" cy="18" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 28 14 L 40 14 M 28 24 L 38 24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="150" y="162" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">/etc/passwd</text>

  
  
  <rect x="80" y="195" width="170" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="165" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1: username</text>
  <text x="165" y="266" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'alice'</text>
  <text x="260" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="278" y="195" width="160" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="358" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">2: password</text>
  <text x="358" y="266" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'x'</text>
  <text x="448" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="466" y="195" width="160" height="90" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <text x="546" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">3: UID</text>
  <text x="546" y="266" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">'1001'</text>
  <text x="636" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="654" y="195" width="150" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="729" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">4: GID</text>
  <text x="729" y="266" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'1001'</text>
  <text x="814" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="832" y="195" width="190" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="927" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">5: GECOS</text>
  <text x="927" y="266" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'Alice User'</text>
  <text x="1032" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="1050" y="195" width="220" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1160" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">6: Home</text>
  <text x="1160" y="266" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'/home/alice'</text>
  <text x="1280" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="1298" y="195" width="220" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1408" y="232" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">7: Shell</text>
  <text x="1408" y="266" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'/bin/bash'</text>

  
  <path d="M 546 345 L 546 295" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" fill="none"/>
  <rect x="80" y="345" width="860" height="85" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="100" y="380" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    UID == 0 flags rogue root (like 'toor'),
  </text>
  <text x="100" y="412" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    UID &gt;= 1000 indicates human login user
  </text>

  
  <path d="M 1408 345 L 1408 295" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <rect x="970" y="345" width="550" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="990" y="396" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    exclude shells matching nologin or false
  </text>

  
  <rect x="60" y="495" width="1480" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(90, 515)">
    <circle cx="16" cy="16" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="36" cy="16" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 4 38 C 4 28, 28 28, 28 38 M 28 38 C 28 30, 46 30, 46 38" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="150" y="547" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">/etc/group</text>

  
  
  <rect x="80" y="575" width="220" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="190" y="612" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1: group</text>
  <text x="190" y="646" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'sudo'</text>
  <text x="312" y="630" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="335" y="575" width="180" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="425" y="612" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">2: password</text>
  <text x="425" y="646" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'x'</text>
  <text x="527" y="630" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="550" y="575" width="170" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="635" y="612" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">3: GID</text>
  <text x="635" y="646" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'27'</text>
  <text x="732" y="630" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">:</text>

  
  <rect x="755" y="575" width="765" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1137" y="612" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">4: members</text>
  <text x="1137" y="646" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">'alice,carol,dave,erin'</text>

  
  <path d="M 1137 720 L 1137 675" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <rect x="680" y="720" width="840" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1100" y="767" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    comma-delimited string intersected against valid login users
  </text>

  
  <rect x="60" y="850" width="1480" height="500" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(90, 870)">
    <ellipse cx="24" cy="12" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 4 12 L 4 36 C 4 41, 44 41, 44 36 L 44 12" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 4 24 C 4 29, 44 29, 44 24" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="150" y="902" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">df -P</text>

  
  <rect x="80" y="930" width="220" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="190" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Filesystem ($1)</text>

  <rect x="310" y="930" width="220" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="420" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1024-blocks ($2)</text>

  <rect x="540" y="930" width="160" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="620" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Used ($3)</text>

  <rect x="710" y="930" width="180" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Available ($4)</text>

  <rect x="900" y="930" width="270" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1035" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Capacity ($5, '95%')</text>

  <rect x="1180" y="930" width="340" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1350" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Mounted on ($6+)</text>

  
  <rect x="80" y="1015" width="1440" height="80" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="190" y="1064" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">/dev/sdb1</text>
  <text x="420" y="1064" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">104857600</text>
  <text x="620" y="1064" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">95000000</text>
  <text x="800" y="1064" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">5000000</text>
  <text x="1035" y="1064" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">95%</text>

  
  <rect x="1200" y="1025" width="145" height="60" rx="4" fill="#f5f8f5" stroke="#db8129" stroke-width="2"/>
  <text x="1272" y="1063" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">model</text>

  <rect x="1355" y="1025" width="145" height="60" rx="4" fill="#f5f8f5" stroke="#db8129" stroke-width="2"/>
  <text x="1427" y="1063" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">cache</text>

  
  <rect x="750" y="1135" width="770" height="65" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="1135" y="1176" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    space splits 'model' ($6) and 'cache' ($7)
  </text>
  <path d="M 1350 1135 L 1350 1095" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" fill="none"/>

  
  <path d="M 1135 1205 L 1135 1250" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <rect x="420" y="1255" width="1100" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="970" y="1296" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    awk loop rebuilding $6 to $NF into '/mnt/model cache'
  </text>
</svg>