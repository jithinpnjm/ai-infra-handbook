<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Who owns this variable: placement rules and naming</title>
  <desc>Visual guide for Ansible variable placement rules, naming conventions, secrets management, and debugging verification.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="40" y="68" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Who owns this variable: placement rules and naming</text>

  
  <g id="table-placement">
    
    <rect x="40" y="105" width="1520" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <path d="M 40 117 A 12 12 0 0 1 52 105 L 1548 105 A 12 12 0 0 1 1560 117 L 1560 160 L 40 160 Z" fill="#e8f1ea"/>
    <line x1="40" y1="160" x2="1560" y2="160" stroke="#207448" stroke-width="2"/>
    <line x1="450" y1="105" x2="450" y2="540" stroke="#207448" stroke-width="2"/>

    
    <text x="70" y="142" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Kind of value</text>
    <text x="480" y="142" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Where it lives</text>

    
    <rect x="40" y="160" width="1520" height="60" fill="#ffffff"/>
    
    <rect x="66" y="174" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="60" y1="181" x2="66" y2="181" stroke="#207448" stroke-width="2"/>
    <line x1="60" y1="191" x2="66" y2="191" stroke="#207448" stroke-width="2"/>
    <line x1="90" y1="181" x2="96" y2="181" stroke="#207448" stroke-width="2"/>
    <line x1="90" y1="191" x2="96" y2="191" stroke="#207448" stroke-width="2"/>
    <line x1="73" y1="168" x2="73" y2="174" stroke="#207448" stroke-width="2"/>
    <line x1="83" y1="168" x2="83" y2="174" stroke="#207448" stroke-width="2"/>
    <line x1="73" y1="198" x2="73" y2="204" stroke="#207448" stroke-width="2"/>
    <line x1="83" y1="198" x2="83" y2="204" stroke="#207448" stroke-width="2"/>
    <text x="110" y="200" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Hardware traits</text>
    <text x="480" y="200" font-family="monospace" font-size="26px" fill="#207448">hardware groups</text>
    <line x1="40" y1="220" x2="1560" y2="220" stroke="#d5e4d8" stroke-width="1.5"/>

    
    <rect x="40" y="220" width="1520" height="60" fill="#fbfdfb"/>
    
    <circle cx="78" cy="250" r="8" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 78 238 L 78 242 M 78 258 L 78 262 M 66 250 L 70 250 M 86 250 L 90 250 M 70 242 L 73 245 M 83 255 L 86 258 M 70 258 L 73 255 M 83 245 L 86 242" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="260" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Role settings</text>
    <text x="480" y="260" font-family="monospace" font-size="26px" fill="#207448">role groups</text>
    <line x1="40" y1="280" x2="1560" y2="280" stroke="#d5e4d8" stroke-width="1.5"/>

    
    <rect x="40" y="280" width="1520" height="60" fill="#ffffff"/>
    
    <circle cx="78" cy="310" r="13" fill="none" stroke="#207448" stroke-width="2.5"/>
    <ellipse cx="78" cy="310" rx="6" ry="13" fill="none" stroke="#207448" stroke-width="1.5"/>
    <line x1="65" y1="310" x2="91" y2="310" stroke="#207448" stroke-width="1.5"/>
    <text x="110" y="320" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Cluster-wide settings</text>
    <text x="480" y="320" font-family="monospace" font-size="26px" fill="#207448">all</text>
    <line x1="40" y1="340" x2="1560" y2="340" stroke="#d5e4d8" stroke-width="1.5"/>

    
    <rect x="40" y="340" width="1520" height="80" fill="#fbfdfb"/>
    
    <line x1="78" y1="365" x2="78" y2="395" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="65" y1="380" x2="91" y2="380" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="69" y1="371" x2="87" y2="389" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    <line x1="69" y1="389" x2="87" y2="371" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="388" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">True exceptions only</text>
    <text x="480" y="372" font-size="24px">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">host_vars:</tspan>
      <tspan font-family="sans-serif" fill="#303a36"> every entry makes the host a snowflake,</tspan>
      <tspan x="480" dy="32" font-family="sans-serif" fill="#303a36">a one-off nobody else shares</tspan>
    </text>
    <line x1="40" y1="420" x2="1560" y2="420" stroke="#d5e4d8" stroke-width="1.5"/>

    
    <rect x="40" y="420" width="1520" height="60" fill="#ffffff"/>
    
    <path d="M 66 443 L 74 443 L 78 447 L 90 447 A 2 2 0 0 1 92 449 L 92 463 A 2 2 0 0 1 90 465 L 66 465 A 2 2 0 0 1 64 463 L 64 445 A 2 2 0 0 1 66 443 Z" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="110" y="460" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Defaults</text>
    <text x="480" y="460" font-family="monospace" font-size="26px" fill="#207448">role defaults/</text>
    <line x1="40" y1="480" x2="1560" y2="480" stroke="#d5e4d8" stroke-width="1.5"/>

    
    <path d="M 40 480 L 1560 480 L 1560 528 A 12 12 0 0 1 1548 540 L 52 540 A 12 12 0 0 1 40 528 Z" fill="#fbfdfb"/>
    
    <path d="M 68 501 L 76 507 L 68 513" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="79" y1="513" x2="88" y2="513" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="518" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Per-run overrides</text>
    <text x="480" y="518" font-family="monospace" font-size="28px" font-weight="bold" fill="#db8129">-e</text>
  </g>

  
  <g id="quick-test-strip">
    <rect x="40" y="560" width="1520" height="95" rx="12" fill="#db8129"/>
    
    <circle cx="90" cy="607" r="24" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 83 599 C 83 592, 97 592, 97 602 C 97 608, 90 609, 90 615" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="622" r="2" fill="#ffffff"/>
    
    <text x="135" y="599" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff">
      would the value still be true if the host were moved to a different rack?
      <tspan x="135" dy="34">if no, it belongs on a rack group or a host, not on a hardware group</tspan>
    </text>
  </g>

  
  <g id="panels-middle">
    
    <rect x="40" y="675" width="740" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 695)">
      <path d="M 12 6 L 34 6 L 50 22 L 28 44 L 6 22 L 6 12 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3.5" fill="#207448"/>
    </g>
    
    <text x="135" y="730" font-size="24px">
      <tspan font-family="sans-serif" font-weight="bold" fill="#207448">prefix each variable with its role:</tspan>
      <tspan x="65" dy="38" font-family="monospace" fill="#207448">nvidia_driver_branch, slurm_cluster_name;</tspan>
      <tspan x="65" dy="36" font-family="sans-serif" fill="#303a36">a generic name like </tspan><tspan font-family="monospace" fill="#207448">version</tspan><tspan font-family="sans-serif" fill="#303a36"> that a Slurm role</tspan>
      <tspan x="65" dy="34" font-family="sans-serif" fill="#303a36">and a driver role both set means one value</tspan>
      <tspan x="65" dy="34" font-family="sans-serif" fill="#303a36">silently wins and the other role breaks without</tspan>
      <tspan x="65" dy="34" font-family="sans-serif" fill="#303a36">a clear message; the prefix makes the collision</tspan>
      <tspan x="65" dy="34" font-family="sans-serif" fill="#303a36">visible and precedence easier to debug</tspan>
    </text>

    
    <rect x="820" y="675" width="740" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(845, 695)">
      <rect x="10" y="20" width="36" height="28" rx="5" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 18 20 L 18 13 C 18 7, 38 7, 38 13 L 38 20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="28" cy="32" r="3" fill="#207448"/>
      <line x1="28" y1="35" x2="28" y2="40" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="915" y="730" font-size="24px">
      <tspan font-family="sans-serif" font-weight="bold" fill="#207448">keep secrets in encrypted files or an</tspan>
      <tspan x="845" dy="38" font-family="sans-serif" fill="#303a36">external store (4.12); refer by name:</tspan>
      <tspan x="845" dy="36" font-family="monospace" fill="#207448">slurm_db_password: &quot;{{ vault_slurm_db_password }}&quot;;</tspan>
      <tspan x="845" dy="36" font-family="sans-serif" fill="#303a36">the plain file holds only a pointer; a </tspan><tspan font-family="monospace" fill="#207448">grep</tspan><tspan font-family="sans-serif" fill="#303a36"> shows</tspan>
      <tspan x="845" dy="34" font-family="sans-serif" fill="#303a36">where each secret is used, so rotation is a</tspan>
      <tspan x="845" dy="34" font-family="sans-serif" fill="#303a36">search instead of a guess</tspan>
    </text>
  </g>

  
  <g id="check-strip">
    <rect x="40" y="1025" width="1520" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 1040)">
      <rect x="4" y="6" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 14 20 L 22 26 L 14 32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="32" x2="38" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="135" y="1060" font-size="24px">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">ansible-inventory --host</tspan>
      <tspan font-family="sans-serif" fill="#303a36"> from the workstation before a run; </tspan>
      <tspan x="135" dy="34" font-family="monospace" font-weight="bold" fill="#207448">debug: var=hostvars[inventory_hostname]</tspan>
      <tspan font-family="sans-serif" fill="#303a36"> inside a play</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="55" rx="10" fill="#207448"/>
    <text x="800" y="1162" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">Keep each variable close to the group that owns it</text>
  </g>
</svg>