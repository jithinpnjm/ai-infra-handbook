<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2360" width="1600" height="2360">
  <title>How a context manager handles errors: __exit__ returning True, and the generator form</title>
  <desc>Visual infographic explaining context manager error handling, __exit__ return values, the generator form, ExitStack, syntax, and try/finally comparison.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="2360" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">How a context manager handles errors:</text>
  <text x="800" y="125" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#303a36">__exit__ returning True, and the generator form</text>

  
  <rect x="40" y="160" width="740" height="1130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(60, 185)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="130" y="222" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">with LookingGlass() as what:</text>

  
  <rect x="65" y="270" width="690" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="310" r="22" fill="#207448" />
  <text x="105" y="318" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="145" y="318" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">__enter__(self)</text>
  <text x="85" y="365" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">patches sys.stdout.write so printed strings</tspan>
    <tspan x="85" dy="34">come out reversed, and returns JABBERWOCKY</tspan>
    <tspan x="85" dy="34">to the as what variable</tspan>
  </text>

  
  <path d="M 410 470 L 410 508" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="510" width="690" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="560" r="22" fill="#207448" />
  <text x="105" y="568" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="145" y="568" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">the body runs</text>

  
  <path d="M 410 610 L 410 648" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="650" width="690" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="695" r="22" fill="#207448" />
  <text x="105" y="703" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="145" y="703" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">__exit__(self, exc_type,</text>
  <text x="85" y="745" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">exc_value, traceback)</text>
  <text x="85" y="780" font-family="sans-serif" font-size="24" fill="#303a36">restores sys.stdout.write</text>

  
  <path d="M 410 800 L 410 838" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="65" y="840" width="690" height="420" rx="12" fill="#fff9f4" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(85, 860)">
    <path d="M 28 6 L 50 16 L 50 34 C 50 46 28 54 28 54 C 28 54 6 46 6 34 L 6 16 Z" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="42" r="3" fill="#db8129" />
  </g>
  <text x="150" y="898" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Exception Handling Branch</text>
  <text x="85" y="955" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">if exc_type is ZeroDivisionError it logs a</tspan>
    <tspan x="85" dy="38">divide-by-zero message and returns True,</tspan>
    <tspan x="85" dy="38">which suppresses the exception; any other</tspan>
    <tspan x="85" dy="38">return value lets the exception continue</tspan>
  </text>


  
  <rect x="820" y="160" width="740" height="1130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(845, 185)">
    <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 4 L 28 12 M 28 44 L 28 52 M 4 28 L 12 28 M 44 28 L 52 28 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 11 L 45 17" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="915" y="222" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Generator form</text>

  
  <rect x="845" y="270" width="690" height="420" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="865" y="325" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="865" dy="0" fill="#207448" font-weight="bold">@contextlib.contextmanager</tspan>
    <tspan x="865" dy="48" font-weight="bold">def looking_glass():</tspan>
    <tspan x="895" dy="48" font-weight="bold">try:</tspan>
    <tspan x="925" dy="48">yield JABBERWOCKY</tspan>
    <tspan x="895" dy="48" font-weight="bold">except ZeroDivisionError:</tspan>
    <tspan x="925" dy="48">...</tspan>
    <tspan x="895" dy="48" font-weight="bold">finally:</tspan>
    <tspan x="925" dy="48">sys.stdout.write = original_write</tspan>
  </text>

  
  <path d="M 1190 690 L 1190 738" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="845" y="740" width="690" height="520" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 765)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 20 22 C 20 16 26 14 28 14 C 32 14 36 17 36 21 C 36 26 28 28 28 34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="42" r="3" fill="#207448" />
  </g>
  <text x="930" y="802" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Why finally is required</text>
  <text x="865" y="865" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="865" dy="0">an unhandled exception in the with body</tspan>
    <tspan x="865" dy="42">is thrown into the generator at the yield</tspan>
    <tspan x="865" dy="42">point through gen.throw(exc),</tspan>
    <tspan x="865" dy="42">so the restore step belongs in the finally</tspan>
    <tspan x="865" dy="42">block where nothing can skip it</tspan>
  </text>


  
  <rect x="40" y="1320" width="1520" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(65, 1345)">
    <polygon points="28,8 52,18 28,28 4,18" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <polyline points="4,28 28,38 52,28" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <polyline points="4,38 28,48 52,38" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>
  <text x="135" y="1382" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">ExitStack</text>
  <text x="65" y="1435" font-family="sans-serif" font-size="24" fill="#303a36">for a dynamic number of managers:</text>
  <rect x="65" y="1455" width="1470" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="1490" font-family="monospace" font-size="24" fill="#207448">with ExitStack() as stack: files = [stack.enter_context(open(f)) for f in filenames];</text>
  <text x="65" y="1548" font-family="sans-serif" font-size="24" fill="#303a36">unwinds registered callbacks and managers in LIFO order on exit</text>


  
  <rect x="40" y="1610" width="1520" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(65, 1630)">
    <rect x="4" y="8" width="48" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="4" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="14" r="2.5" fill="#207448" />
    <circle cx="20" cy="14" r="2.5" fill="#207448" />
  </g>
  <text x="135" y="1665" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Syntax</text>
  
  <text x="65" y="1715" font-family="sans-serif" font-size="24" fill="#303a36">several managers:</text>
  <rect x="65" y="1730" width="1470" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="1762" font-family="monospace" font-size="24" fill="#207448">with expr1 as v1, expr2 as v2:;</text>

  <text x="65" y="1815" font-family="sans-serif" font-size="24" fill="#303a36">Python 3.10 and later allows parentheses across lines:</text>
  <rect x="65" y="1830" width="1470" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="1862" font-family="monospace" font-size="24" fill="#207448">with (open(lines1.txt) as input, open(uppers.txt, w) as output):</text>


  
  <rect x="40" y="1910" width="1520" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(65, 1930)">
    <path d="M 28 6 L 28 48 M 10 16 L 46 16 M 10 16 L 4 32 L 16 32 Z M 46 16 L 40 32 L 52 32 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  </g>
  <text x="135" y="1965" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Comparison</text>

  <text x="65" y="2010" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0">try/finally is the general tool; with works only with objects that support it;</tspan>
    <tspan x="65" dy="36">open file:</tspan>
  </text>
  
  <rect x="65" y="2060" width="1470" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="2094" font-family="monospace" font-size="24" fill="#207448">myfile = open(...); try: ... finally: myfile.close() versus with open(...) as myfile</text>

  <text x="65" y="2150" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0">CPython closes files when garbage-collected,</tspan>
    <tspan x="65" dy="36">but timing is unpredictable and a leaking process runs out of descriptors</tspan>
  </text>


  
  <rect x="40" y="2240" width="1520" height="80" rx="14" fill="#207448" />
  <text x="800" y="2290" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Returning True is the switch that suppresses an exception
  </text>

</svg>