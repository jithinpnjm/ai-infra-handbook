<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Why web load balancing assumptions fail for LLM serving: five differences</title>
  <desc>Infographic illustrating the five key architectural differences between traditional web load balancing and LLM inference serving, featuring the failure scenario, failure consequences, and LLM-tailored routing responses.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Why web load balancing assumptions fail</text>
  <text x="800" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">for LLM serving: five differences</text>

  
  <g id="left-scenario">
    <rect x="40" y="124" width="360" height="990" rx="14" fill="#fdf8f4" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(192, 185)">
      
      <rect x="-120" y="-20" width="240" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="-95" cy="1" r="7" fill="#207448"/>
      <path d="M -99 1 L -96 4 L -90 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <rect x="-70" y="-8" width="50" height="18" rx="3" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
      <line x1="-10" y1="1" x2="100" y2="1" stroke="#c8dcd0" stroke-width="2" stroke-dasharray="4 4"/>

      
      <rect x="-120" y="34" width="240" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="-95" cy="55" r="7" fill="#207448"/>
      <path d="M -99 55 L -96 58 L -90 52" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <rect x="-70" y="46" width="50" height="18" rx="3" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
      <line x1="-10" y1="55" x2="100" y2="55" stroke="#c8dcd0" stroke-width="2" stroke-dasharray="4 4"/>

      
      <rect x="-120" y="88" width="240" height="52" rx="6" fill="#fbeee4" stroke="#db8129" stroke-width="3"/>
      <circle cx="-95" cy="114" r="7" fill="#207448"/>
      <path d="M -99 114 L -96 117 L -90 111" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      
      <rect x="-72" y="98" width="22" height="32" rx="3" fill="#db8129"/>
      <rect x="-46" y="98" width="22" height="32" rx="3" fill="#db8129"/>
      <rect x="-20" y="98" width="22" height="32" rx="3" fill="#db8129"/>
      <rect x="6" y="98" width="22" height="32" rx="3" fill="#db8129"/>
      <rect x="32" y="98" width="22" height="32" rx="3" fill="#db8129"/>
      <rect x="58" y="98" width="22" height="32" rx="3" fill="#db8129"/>
      <rect x="84" y="98" width="22" height="32" rx="3" fill="#db8129"/>

      
      <polygon points="0,175 -24,217 24,217" fill="#db8129"/>
      <line x1="0" y1="189" x2="0" y2="202" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="210" r="2.5" fill="#ffffff"/>
    </g>

    
    <text x="64" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">every health check</tspan>
      <tspan x="64" dy="36">green, average latency</tspan>
      <tspan x="64" dy="36">fine, one replica</tspan>
      <tspan x="64" dy="36">buried under long</tspan>
      <tspan x="64" dy="36">generations while the</tspan>
      <tspan x="64" dy="36">others sit idle</tspan>
    </text>
  </g>

  
  <g id="row-1">
    
    <rect x="420" y="124" width="550" height="218" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    
    <g transform="translate(915, 142)">
      <circle cx="18" cy="18" r="18" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="18" y1="9" x2="18" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="18" x2="26" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="442" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="442" dy="0">1 Requests are long, variable</tspan>
      <tspan x="442" dy="32">and somewhat stateful</tspan>
    </text>
    <text x="442" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="442" dy="0">a request may stream tokens for</tspan>
      <tspan x="442" dy="28">minutes; cost varies by orders of</tspan>
      <tspan x="442" dy="28">magnitude with prompt and output</tspan>
      <tspan x="442" dy="28">length; the real load is queue depth,</tspan>
      <tspan x="442" dy="28">running sequences and KV-cache</tspan>
      <tspan x="442" dy="28">occupancy, not connection count</tspan>
    </text>

    
    <rect x="990" y="124" width="570" height="218" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1014" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0">Balance per request, not per</tspan>
      <tspan x="1014" dy="32">connection (Envoy, HAProxy,</tspan>
      <tspan x="1014" dy="32">nginx grpc_pass, Gateway API</tspan>
      <tspan x="1014" dy="32">inference extensions, or</tspan>
      <tspan x="1014" dy="32">client-side)</tspan>
    </text>
  </g>

  
  <g id="row-2">
    
    <rect x="420" y="354" width="550" height="180" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    
    <g transform="translate(915, 370)">
      <path d="M 6 12 C 14 6, 22 6, 30 12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 2 20 C 14 12, 22 12, 34 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="20" x2="18" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="442" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">2 Connections are long-lived</text>
    <text x="442" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="442" dy="0">HTTP/2 and gRPC streams and</tspan>
      <tspan x="442" dy="28">SSE hold resources; reloads, scale-in</tspan>
      <tspan x="442" dy="28">and deploys must drain gracefully;</tspan>
      <tspan x="442" dy="28">an idle timeout at any hop can cut</tspan>
      <tspan x="442" dy="28">a slow generation</tspan>
    </text>

    
    <rect x="990" y="354" width="570" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1014" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0">load signal: least-outstanding-</tspan>
      <tspan x="1014" dy="26">requests baseline, better backend-</tspan>
      <tspan x="1014" dy="26">reported running and waiting</tspan>
      <tspan x="1014" dy="26">requests, KV-cache usage and</tspan>
      <tspan x="1014" dy="26">estimated tokens (Prometheus,</tspan>
      <tspan x="1014" dy="26">headers, ORCA-style load</tspan>
      <tspan x="1014" dy="26">reports), P2C over load</tspan>
    </text>
  </g>

  
  <g id="row-3">
    
    <rect x="420" y="546" width="550" height="236" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    
    <g transform="translate(915, 562)">
      <rect x="4" y="4" width="13" height="13" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="21" y="4" width="13" height="13" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="4" y="21" width="13" height="13" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="21" y="21" width="13" height="13" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="442" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">3 Cache locality matters</text>
    <text x="442" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="442" dy="0">prefix caching for system prompts,</tspan>
      <tspan x="442" dy="26">RAG context and multi-turn chat</tspan>
      <tspan x="442" dy="26">makes a request cheaper on the</tspan>
      <tspan x="442" dy="26">replica that already holds its prefix</tspan>
      <tspan x="442" dy="26">KV blocks; same session or prefix to</tspan>
      <tspan x="442" dy="26">the same replica raises hit rates,</tspan>
      <tspan x="442" dy="26">pure affinity creates hot spots</tspan>
    </text>

    
    <rect x="990" y="546" width="570" height="236" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1014" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0">cache-aware: consistent hashing</tspan>
      <tspan x="1014" dy="30">on session ID or prefix hash with</tspan>
      <tspan x="1014" dy="30">bounded loads, or a router</tspan>
      <tspan x="1014" dy="30">tracking which replica holds</tspan>
      <tspan x="1014" dy="30">which prefix blocks</tspan>
    </text>
  </g>

  
  <g id="row-4">
    
    <rect x="420" y="794" width="550" height="168" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    
    <g transform="translate(915, 810)">
      <rect x="6" y="6" width="24" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="12" y="12" width="12" height="12" fill="#207448"/>
      <line x1="12" y1="2" x2="12" y2="6" stroke="#207448" stroke-width="2"/>
      <line x1="24" y1="2" x2="24" y2="6" stroke="#207448" stroke-width="2"/>
      <line x1="12" y1="30" x2="12" y2="34" stroke="#207448" stroke-width="2"/>
      <line x1="24" y1="30" x2="24" y2="34" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="442" y="826" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="442" dy="0">4 Backends are expensive</tspan>
      <tspan x="442" dy="32">and heterogeneous</tspan>
    </text>
    <text x="442" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="442" dy="0">GPU types, tensor-parallel group</tspan>
      <tspan x="442" dy="26">sizes, disaggregated prefill and</tspan>
      <tspan x="442" dy="26">decode pools, LoRA adapters per</tspan>
      <tspan x="442" dy="26">replica, quantised variants</tspan>
    </text>

    
    <rect x="990" y="794" width="570" height="168" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1014" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0">disaggregated: route prefill and</tspan>
      <tspan x="1014" dy="28">decode to separate pools, handle</tspan>
      <tspan x="1014" dy="28">the KV transfer, couple the</tspan>
      <tspan x="1014" dy="28">autoscaling and admission</tspan>
    </text>
  </g>

  
  <g id="row-5">
    
    <rect x="420" y="974" width="550" height="140" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    
    <g transform="translate(915, 990)">
      <path d="M 6 26 A 15 15 0 1 1 30 26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="20" x2="26" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="442" y="1006" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">5 Autoscaling is slow</text>
    <text x="442" y="1038" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="442" dy="0">GPU nodes and model loads take</tspan>
      <tspan x="442" dy="26">minutes, so the router must absorb</tspan>
      <tspan x="442" dy="26">bursts by queueing or shedding</tspan>
    </text>

    
    <rect x="990" y="974" width="570" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1014" y="1002" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0">overload: per-tenant concurrency</tspan>
      <tspan x="1014" dy="25">and token-rate limits, priority</tspan>
      <tspan x="1014" dy="25">queues separating interactive from</tspan>
      <tspan x="1014" dy="25">batch, 429 or 503 early, KV-cache</tspan>
      <tspan x="1014" dy="25">headroom in admission control</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1126" width="1520" height="58" rx="10" fill="#207448"/>
    <text x="800" y="1163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Measure first, and choose the load signal before you choose the algorithm</text>
  </g>
</svg>