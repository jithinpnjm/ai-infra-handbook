<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>A long loop must look alive: the four UX tools and Ctrl+C</title>
  <desc>A table mapping interactive command-line UX tools to common long-running loop needs, with wait-and-timeout polling flow, stderr terminal rule, and 3 a.m. takeaway.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1190" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A long loop must look alive: the four UX tools and Ctrl+C</text>

  
  
  <rect x="40" y="105" width="640" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="360" y="141" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Need</text>

  
  <rect x="700" y="105" width="860" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1130" y="141" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Feature</text>

  
  
  <rect x="40" y="167" width="640" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(56, 177)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 10 L 44 10 L 32 28 L 44 46 L 12 46 L 24 28 Z" />
    <line x1="20" y1="38" x2="36" y2="38" />
  </g>
  <text x="124" y="199" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="124" dy="0">Long loop with no progress </tspan>
    <tspan x="124" dy="30">looks like a hang</tspan>
  </text>

  
  <rect x="700" y="167" width="860" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(716, 177)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="16" width="40" height="24" rx="4" />
    <rect x="14" y="22" width="20" height="12" fill="#207448" />
  </g>
  <text x="784" y="214" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">progress bar</text>

  
  
  <rect x="40" y="253" width="640" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(56, 263)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <polyline points="28 16 28 28 38 28" />
  </g>
  <text x="124" y="300" font-family="sans-serif" font-size="26" fill="#303a36">Waiting on something</text>

  
  <rect x="700" y="253" width="860" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(716, 263)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 8 A 20 20 0 1 1 12 20" />
    <polyline points="28 4 28 12 36 8" />
  </g>
  <text x="784" y="300" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">spinner</text>

  
  
  <rect x="40" y="339" width="640" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(56, 349)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 28 C 16 14 40 14 48 28 C 40 42 16 42 8 28 Z" />
    <circle cx="28" cy="28" r="6" fill="#207448" />
  </g>
  <text x="124" y="386" font-family="sans-serif" font-size="26" fill="#303a36">Watch a changing state</text>

  
  <rect x="700" y="339" width="860" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(716, 349)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="10" width="40" height="30" rx="4" />
    <line x1="16" y1="46" x2="40" y2="46" />
    <line x1="28" y1="40" x2="28" y2="46" />
    <path d="M 20 22 H 34 M 30 18 L 34 22 L 30 26" />
  </g>
  <text x="784" y="386" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">--watch polls and redraws the screen</text>

  
  
  <rect x="40" y="425" width="640" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(56, 435)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="16" x2="44" y2="16" />
    <line x1="12" y1="28" x2="36" y2="28" />
    <line x1="12" y1="40" x2="40" y2="40" />
    <polyline points="38 34 44 40 38 46" />
  </g>
  <text x="124" y="472" font-family="sans-serif" font-size="26" fill="#303a36">Stream new output</text>

  
  <rect x="700" y="425" width="860" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(716, 435)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="10" width="40" height="36" rx="4" />
    <polyline points="16 20 24 28 16 36" />
    <line x1="28" y1="36" x2="38" y2="36" />
  </g>
  <text x="784" y="472" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">--follow</text>

  
  
  <rect x="40" y="511" width="640" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(56, 531)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="28" r="6" />
    <path d="M 20 28 C 28 28 28 16 38 16" />
    <path d="M 20 28 C 28 28 28 40 38 40" />
    <circle cx="42" cy="16" r="4" fill="#207448" />
    <circle cx="42" cy="40" r="4" fill="#207448" />
  </g>
  <text x="124" y="551" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="124" dy="0">Operation that finishes </tspan>
    <tspan x="124" dy="32">asynchronously</tspan>
  </text>

  
  <rect x="700" y="511" width="860" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
  
  <g transform="translate(716, 531)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="18" />
    <polyline points="28 18 28 28 36 32" />
    <path d="M 44 14 L 46 20 L 40 20" />
  </g>
  <text x="784" y="549" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="784" dy="0">--wait and --timeout flags; poll the status </tspan>
    <tspan x="784" dy="32">endpoint with backoff like kubectl rollout status</tspan>
  </text>

  
  
  <rect x="40" y="617" width="640" height="88" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  
  <g transform="translate(56, 633)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="12" width="40" height="32" rx="5" />
    <path d="M 20 22 C 16 22 16 34 20 34" />
    <line x1="28" y1="22" x2="36" y2="34" />
    <line x1="36" y1="22" x2="28" y2="34" />
  </g>
  <text x="124" y="670" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">User presses Ctrl+C</text>

  
  <rect x="700" y="617" width="860" height="88" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2.5" />
  
  <g transform="translate(716, 633)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <line x1="16" y1="28" x2="40" y2="28" />
    <polyline points="22 20 16 28 22 36" />
  </g>
  <text x="784" y="655" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="784" dy="0">catch KeyboardInterrupt, clean up, </tspan>
    <tspan x="784" dy="32">return exit code 130</tspan>
  </text>

  
  <rect x="40" y="725" width="1520" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="64" y="745" width="335" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.8" />
  <g transform="translate(207, 760)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="18 10 38 24 18 38" fill="#207448" />
  </g>
  <text x="231" y="845" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">start operation</text>

  
  <line x1="399" y1="815" x2="443" y2="815" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="443" y="745" width="335" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.8" />
  <g transform="translate(586, 760)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 20 A 16 16 0 1 0 38 28" />
    <polyline points="38 12 38 20 30 20" />
  </g>
  <text x="610" y="830" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="610" dy="0">poll status </tspan>
    <tspan x="610" dy="32">with backoff</tspan>
  </text>

  
  <line x1="778" y1="815" x2="822" y2="815" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="822" y="745" width="335" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.8" />
  <g transform="translate(965, 760)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="24" r="16" />
    <polyline points="20 24 26 30 36 18" />
  </g>
  <text x="989" y="830" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="989" dy="0">done, or </tspan>
    <tspan x="989" dy="32">--timeout reached</tspan>
  </text>

  
  <line x1="1157" y1="815" x2="1201" y2="815" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="1201" y="745" width="335" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.8" />
  <g transform="translate(1344, 760)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="28" rx="4" />
    <line x1="18" y1="24" x2="38" y2="24" />
  </g>
  <text x="1368" y="845" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">exit code</text>

  
  <rect x="40" y="925" width="1520" height="94" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 944)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="36" rx="5" />
    <polyline points="14 20 22 26 14 32" />
    <line x1="26" y1="32" x2="38" y2="32" />
  </g>
  <text x="144" y="981" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">progress and spinners go to stderr and only on a terminal</text>

  
  <rect x="40" y="1045" width="1520" height="90" rx="12" fill="#207448" />
  <text x="800" y="1101" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Think of the person running your tool at 3 a.m.</text>

</svg>