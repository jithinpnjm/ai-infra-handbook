<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Where controller-runtime sits</title>
  <desc>Architecture diagram showing where controller-runtime components sit inside an operator Pod and their interaction with kube-apiserver.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where controller-runtime sits</text>

  
  <rect x="40" y="110" width="1120" height="930" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />

  
  <rect x="65" y="125" width="450" height="48" rx="8" fill="#207448" />
  <text x="290" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">operator process (one Pod)</text>

  

  
  <g id="node-webhook">
    <rect x="65" y="210" width="210" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="170" cy="255" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 170 237 V 227 M 158 243 L 150 237 M 182 243 L 190 237" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 162 265 L 170 273 L 178 265" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="170" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">Webhook</tspan>
      <tspan x="170" dy="36">server</tspan>
    </text>
  </g>

  
  <g id="node-leader-election">
    <rect x="65" y="470" width="210" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <rect x="151" y="520" width="38" height="28" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 158 520 V 508 A 12 12 0 0 1 182 508 V 520" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="170" cy="532" r="3" fill="#207448" />
    <path d="M 170 535 V 541" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="170" y="585" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">Leader</tspan>
      <tspan x="170" dy="36">election</tspan>
    </text>
  </g>

  
  <g id="node-metrics">
    <rect x="65" y="730" width="210" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 145 778 H 154 L 160 762 L 169 792 L 176 772 L 182 778 H 195" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 144 785 H 196" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="170" y="835" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">Metrics and</tspan>
      <tspan x="170" dy="36">probes</tspan>
    </text>
  </g>

  

  
  <g id="node-manager">
    <rect x="315" y="470" width="170" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="400" cy="528" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="400" cy="528" r="7" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 400 506 V 496 M 400 550 V 560 M 378 528 H 368 M 422 528 H 432" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 384 512 L 377 505 M 416 544 L 423 551 M 384 544 L 377 551 M 416 512 L 423 505" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="400" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Manager</text>
  </g>

  

  
  <g id="node-controller-a">
    <rect x="525" y="400" width="240" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 622 435 H 642 M 622 445 H 642 M 622 455 H 636" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 660 435 A 14 14 0 1 1 650 457" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 662 430 L 664 440 L 654 438" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="645" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Controller A</text>
    <text x="645" y="548" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="645" dy="0">queue +</tspan>
      <tspan x="645" dy="28">Reconcile</tspan>
    </text>
  </g>

  
  <g id="node-controller-b">
    <rect x="525" y="690" width="240" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 645 726 A 18 18 0 1 1 630 754" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 648 720 L 652 732 L 638 730" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="645" y="805" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Controller B</text>
  </g>

  

  
  <g id="node-shared-cache">
    <rect x="810" y="210" width="280" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <ellipse cx="950" cy="246" rx="24" ry="9" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 926 246 V 276 A 24 9 0 0 0 974 276 V 246" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 926 261 A 24 9 0 0 0 974 261" fill="none" stroke="#207448" stroke-width="3.5" />
    <text x="950" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shared cache</text>
    <text x="950" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">informers</text>
  </g>

  
  <g id="node-caching-client">
    <rect x="810" y="480" width="280" height="320" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3.5" />
    
    <rect x="926" y="512" width="48" height="36" rx="4" fill="none" stroke="#db8129" stroke-width="3.5" />
    <path d="M 936 525 H 964 M 958 520 L 964 525 L 958 530" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 964 535 H 936 M 942 530 L 936 535 L 942 540" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="950" y="595" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Caching client</text>
    <text x="950" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="950" dy="0">reads from cache</tspan>
      <tspan x="950" dy="34">writes to API</tspan>
    </text>
  </g>

  

  
  <g id="node-kube-apiserver">
    <rect x="1350" y="210" width="210" height="590" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <ellipse cx="1455" cy="275" rx="30" ry="11" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1425 275 V 325 A 30 11 0 0 0 1485 325 V 275" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1425 300 A 30 11 0 0 0 1485 300" fill="none" stroke="#207448" stroke-width="4" />
    <text x="1455" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1455" dy="0">kube-</tspan>
      <tspan x="1455" dy="38">apiserver</tspan>
    </text>
  </g>

  

   W (Manager to Webhook server) -->
  <path d="M 315 500 H 295 V 300 H 275" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   LE (Manager to Leader election) -->
  <path d="M 315 560 H 275" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   ME (Manager to Metrics and probes) -->
  <path d="M 315 620 H 295 V 820 H 275" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   R1 (Manager to Controller A) -->
  <path d="M 485 500 H 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   R2 (Manager to Controller B) -->
  <path d="M 400 650 V 780 H 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   C (Manager to Shared cache, routes above R1) -->
  <path d="M 400 470 V 300 H 810" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   CL (Controller A to Caching client) -->
  <path d="M 765 540 H 810" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   CL (Controller B to Caching client) -->
  <path d="M 765 740 H 810" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   C (Caching client to Shared cache) -->
  <path d="M 950 480 V 390" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

   API (Shared cache to kube-apiserver) -->
  <path d="M 1090 300 H 1350" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1220" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">list and watch</text>

   API (Caching client to kube-apiserver) -->
  <path d="M 1090 640 H 1350" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1220" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1220" dy="0">create update</tspan>
    <tspan x="1220" dy="28">patch delete</tspan>
  </text>
</svg>