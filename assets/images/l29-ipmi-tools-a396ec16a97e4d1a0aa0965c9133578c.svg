<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Managing the machine behind the machine</title>
  <desc>Visual layer diagram illustrating BMC architecture, IPMI management tools, local controller modules, and network security isolation.</desc>

  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Managing the machine behind the machine</text>

  
  <g id="security-box">
    <rect x="50" y="95" width="1500" height="115" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(75, 124)">
      <path d="M28,4 L50,12 C50,34 38,48 28,54 C18,48 6,34 6,12 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="21" y="24" width="14" height="12" rx="2.5" fill="none" stroke="#db8129" stroke-width="2.5"/>
      <path d="M24,24 L24,19 C24,16.8 25.8,15 28,15 C30.2,15 32,16.8 32,19 L32,24" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    
    <text x="155" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">put controllers on a dedicated management network or VLAN,</text>
    <text x="155" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="normal" fill="#303a36">never expose a BMC to the internet</text>
  </g>

  
  <g id="management-stack">

    
    
    <g id="chip-ipmitool">
      <rect x="50" y="235" width="495" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(74, 255)">
        <rect x="0" y="0" width="50" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
        <polyline points="10,13 18,19 10,25" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="24" y1="25" x2="38" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="138" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#207448">ipmitool</text>
      <text x="74" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">lan print, sdr list,</text>
      <text x="74" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">sol activate; leave with</text>
      <text x="74" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">~. or ~~. inside SSH</text>
    </g>

    
    <g id="chip-sol">
      <rect x="575" y="235" width="495" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(599, 255)">
        <path d="M6,6 L44,6 L38,34 L12,34 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="2.5" fill="#207448"/>
        <circle cx="25" cy="16" r="2.5" fill="#207448"/>
        <circle cx="34" cy="16" r="2.5" fill="#207448"/>
        <circle cx="20" cy="24" r="2.5" fill="#207448"/>
        <circle cx="30" cy="24" r="2.5" fill="#207448"/>
      </g>
      <text x="663" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#207448">sol</text>
      <text x="599" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">serial-over-LAN,</text>
      <text x="599" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">needs a getty on</text>
      <text x="599" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">the serial port</text>
    </g>

    
    <g id="chip-conman">
      <rect x="50" y="465" width="495" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(74, 485)">
        <rect x="10" y="0" width="38" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
        <rect x="2" y="10" width="38" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3"/>
        <line x1="8" y1="24" x2="26" y2="24" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text x="138" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#207448">conman</text>
      <text x="74" y="565" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">keeps many consoles</text>
      <text x="74" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">open and logged</text>
    </g>

    
    <g id="chip-powerman">
      <rect x="575" y="465" width="495" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(599, 485)">
        <circle cx="25" cy="22" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="25" y1="4" x2="25" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="663" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#207448">powerman</text>
      <text x="599" y="565" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">power control,</text>
      <text x="599" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">no consoles</text>
    </g>

    
    <g id="bottom-bmc">
      <rect x="50" y="675" width="1020" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      
      
      <g transform="translate(85, 712)">
        <rect x="12" y="12" width="40" height="40" rx="5" fill="#ffffff" stroke="#207448" stroke-width="3.5"/>
        
        <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="32" y1="4" x2="32" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="44" y1="4" x2="44" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="20" y1="52" x2="20" y2="60" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="32" y1="52" x2="32" y2="60" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="44" y1="52" x2="44" y2="60" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="4" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="4" y1="32" x2="12" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="4" y1="44" x2="12" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="52" y1="20" x2="60" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="52" y1="32" x2="60" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="52" y1="44" x2="60" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <circle cx="22" cy="22" r="3" fill="#207448"/>
      </g>

      <text x="170" y="754" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">BMC (management controller)</text>
      
      <text x="85" y="828" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="normal" fill="#303a36">with its own network access,</text>
      <text x="85" y="872" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="normal" fill="#303a36">works when the main system is hung or powered off</text>

      
      <g transform="translate(85, 912)">
        <rect x="0" y="0" width="950" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <g transform="translate(24, 20)">
          <rect x="0" y="0" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
          <path d="M12,34 L12,24 L34,24 L34,34" fill="none" stroke="#207448" stroke-width="2"/>
          <circle cx="16" cy="12" r="3" fill="#207448"/>
          <circle cx="30" cy="12" r="3" fill="#207448"/>
        </g>
        
        <g transform="translate(480, 20)">
          <path d="M18,0 L6,20 L18,20 L14,34 L28,14 L18,14 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

  </g>

  
  <g id="side-modules">
    <rect x="1100" y="235" width="450" height="780" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(1135, 266)">
      <rect x="0" y="10" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="28" y="10" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="14" y="26" width="22" height="22" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="1205" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">modules</text>

    
    <g id="mod-devintf">
      <rect x="1135" y="355" width="380" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(1155, 390)">
        <rect x="0" y="0" width="38" height="38" rx="5" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="10" y1="19" x2="28" y2="19" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="19" y1="10" x2="19" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text x="1210" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">ipmi_devintf</text>
    </g>

    
    <g id="mod-si">
      <rect x="1135" y="490" width="380" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(1155, 525)">
        <path d="M4,10 L34,10 M4,28 L34,28 M12,4 L12,34 M26,4 L26,34" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text x="1210" y="557" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">ipmi_si</text>
    </g>

    
    <g id="mod-msghandler">
      <rect x="1135" y="625" width="380" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(1155, 660)">
        <rect x="0" y="6" width="38" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
        <polyline points="4,10 19,22 34,10" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <text x="1210" y="692" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">ipmi_msghandler</text>
    </g>

    
    <g id="local-controller-target">
      <rect x="1135" y="765" width="380" height="220" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(1155, 800)">
        <rect x="0" y="0" width="50" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
        <line x1="12" y1="38" x2="12" y2="48" stroke="#207448" stroke-width="3"/>
        <line x1="38" y1="38" x2="38" y2="48" stroke="#207448" stroke-width="3"/>
        <line x1="4" y1="48" x2="46" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <circle cx="25" cy="18" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
      </g>
      <text x="1155" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">for the local controller</text>
      
      <line x1="1155" y1="940" x2="1490" y2="940" stroke="#207448" stroke-width="3" stroke-dasharray="8,6"/>
      <circle cx="1155" cy="940" r="5" fill="#207448"/>
      <circle cx="1490" cy="940" r="5" fill="#207448"/>
    </g>

  </g>
</svg>