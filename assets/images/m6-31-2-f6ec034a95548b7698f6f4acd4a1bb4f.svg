<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The whole cluster from bare metal to job</title>
  <desc>Six planes of AI infrastructure: Plane 1 Physical, Power and Out-of-Band; Plane 2 Bare-Metal Lifecycle and Provisioning; Plane 3 Host OS, Drivers and Kernel Modules; Plane 4 Fabrics and Parallel Storage; Plane 5 Workload Orchestration; Plane 6 Collectives and Frameworks.</desc>

