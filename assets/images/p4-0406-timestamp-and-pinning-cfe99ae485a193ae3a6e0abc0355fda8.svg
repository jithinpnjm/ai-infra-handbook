<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>What makes a file change every run, and how to pin what you install</title>
  <desc>Visual infographic explaining why dynamic timestamps cause Ansible idempotency failures and how version pinning ensures reproducible runs.</desc>

  <defs>
    <marker id="arrow-chain" viewBox="0 0 16 16" refX="8" refY="12" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 8 13 L 14 3 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">What makes a file change every run,</tspan>
    <tspan x="800" dy="56">and how to pin what you install</tspan>
  </text>

  
  <g id="panel-timestamp-trap">
    <rect x="40" y="160" width="760" height="705" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="2.5" />

    
    <g transform="translate(65, 178)">
      <rect x="0" y="8" width="52" height="38" rx="6" fill="none" stroke="#db8129" stroke-width="3.5" />
      <circle cx="26" cy="27" r="11" fill="none" stroke="#db8129" stroke-width="3.5" />
      <path d="M 14 8 L 18 0 L 34 0 L 38 8 Z" fill="#db8129" />
    </g>
    <text x="135" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#db8129">Timestamp trap</text>

    
    <rect x="65" y="235" width="710" height="95" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="85" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">a rendered file is a photograph of the desired state;</tspan>
      <tspan x="85" dy="29">a timestamp in the photograph changes every time you</tspan>
      <tspan x="85" dy="29">take a new one, so the file never matches the last run</tspan>
    </text>

    
    <g id="node-1">
      <rect x="65" y="345" width="710" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
      <circle cx="105" cy="382" r="22" fill="#db8129" />
      <text x="105" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      
      <g transform="translate(142, 362)">
        <circle cx="18" cy="18" r="16" fill="none" stroke="#db8129" stroke-width="3" />
        <path d="M 18 8 L 18 18 L 26 22" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="195" y="375" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="195" dy="0">ansible_date_time</tspan>
        <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal"> or a</tspan>
        <tspan x="195" dy="28" font-family="system-ui, -apple-system, sans-serif" font-weight="normal">random value in a template</tspan>
      </text>
    </g>

    
    <line x1="420" y1="420" x2="420" y2="444" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-chain)" />

    
    <g id="node-2">
      <rect x="65" y="448" width="710" height="68" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
      <circle cx="105" cy="482" r="22" fill="#207448" />
      <text x="105" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      
      <g transform="translate(142, 464)">
        <path d="M 4 2 L 22 2 L 30 10 L 30 32 L 4 32 Z" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 22 2 L 22 10 L 30 10" fill="none" stroke="#207448" stroke-width="2.5" />
        <line x1="10" y1="16" x2="22" y2="16" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
        <line x1="10" y1="22" x2="24" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      </g>
      <text x="195" y="491" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">file differs every run</text>
    </g>

    
    <line x1="420" y1="516" x2="420" y2="540" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-chain)" />

    
    <g id="node-3">
      <rect x="65" y="544" width="710" height="68" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
      <circle cx="105" cy="578" r="22" fill="#207448" />
      <text x="105" y="586" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(142, 560)">
        <polygon points="18,2 34,30 2,30" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
        <line x1="18" y1="13" x2="18" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <circle cx="18" cy="25" r="1.5" fill="#207448" />
      </g>
      <text x="195" y="587" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">reports changed every time</text>
    </g>

    
    <line x1="420" y1="612" x2="420" y2="636" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-chain)" />

    
    <g id="node-4">
      <rect x="65" y="640" width="710" height="68" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
      <circle cx="105" cy="674" r="22" fill="#207448" />
      <text x="105" y="682" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(142, 656)">
        <circle cx="18" cy="18" r="9" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 18 4 L 18 8 M 18 28 L 18 32 M 4 18 L 8 18 M 28 18 L 32 18 M 8 8 L 11 11 M 25 25 L 28 28 M 8 28 L 11 25 M 25 11 L 28 8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="195" y="683" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">triggers its handlers every time</text>
    </g>

    
    <g id="box-fix">
      <rect x="65" y="732" width="710" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(90, 762)">
        <path d="M 24 4 L 44 12 L 44 28 C 44 42 24 50 24 50 C 24 50 4 42 4 28 L 4 12 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
        <path d="M 14 26 L 21 33 L 34 19" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="165" y="777" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="165" dy="0">keep timestamps, random values and</tspan>
        <tspan x="165" dy="34">ansible_date_time out of rendered content</tspan>
      </text>
    </g>
  </g>

  
  <g id="panel-pin-versions">
    <rect x="840" y="160" width="720" height="705" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(865, 176)">
      <path d="M 16 4 L 36 24 M 24 8 L 30 2 M 38 10 L 44 16 M 16 24 L 8 32 L 2 48 L 18 42 L 26 34" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="930" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Pin versions</text>

    
    <g id="card-present">
      <rect x="865" y="235" width="670" height="185" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
      
      <g transform="translate(895, 275)">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3.5" />
        <path d="M 18 28 L 25 35 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="975" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="975" dy="0">prefer state: present</tspan>
        <tspan x="975" dy="36">over state: latest</tspan>
        <tspan x="975" dy="36" font-size="24" font-weight="normal" fill="#303a36">for reproducible results</tspan>
      </text>
    </g>

    
    <g id="card-patch">
      <rect x="865" y="445" width="670" height="185" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
      
      <g transform="translate(895, 485)">
        <path d="M 38 10 C 33 5 25 5 20 10 L 25 15 L 20 20 L 15 25 L 10 20 C 5 25 5 33 10 38 C 14 42 20 42 24 39 L 41 56 L 49 48 L 32 31 C 35 27 35 21 38 17 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      </g>
      <text x="975" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="975" dy="0">save latest for a patch play</tspan>
        <tspan x="975" dy="42" font-size="25" font-weight="normal">where you mean it</tspan>
      </text>
    </g>

    
    <g id="card-example">
      <rect x="865" y="655" width="670" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(895, 700)">
        <path d="M 8 26 L 26 8 L 48 8 L 48 30 L 30 48 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
        <circle cx="40" cy="16" r="4" fill="#207448" />
      </g>
      <text x="975" y="722" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="975" dy="0">pin versions, for example name</tspan>
        <tspan x="975" dy="48" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">"nvidia-driver-550=550.90.07-1"</tspan>
      </text>
    </g>
  </g>

  
  <g id="proof-strip">
    <rect x="40" y="890" width="1520" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(75, 915)">
      <path d="M 22 4 L 34 4 M 28 4 L 28 18 L 46 48 C 48 52 44 56 38 56 L 18 56 C 12 56 8 52 10 48 L 28 18 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 15 42 L 41 42" fill="none" stroke="#207448" stroke-width="2.5" stroke-dasharray="3 3" />
      <circle cx="28" cy="48" r="2" fill="#207448" />
    </g>
    <text x="155" y="940" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="155" dy="0" font-weight="bold">test the property itself: run the playbook twice;</tspan>
      <tspan x="155" dy="36">the second recap must show changed=0; Molecule automates this check (4.13)</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1030" width="1520" height="80" rx="12" fill="#207448" />
    <text x="800" y="1080" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      A first run that changes things is expected, a second run that changes things again is a bug
    </text>
  </g>
</svg>