<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>cron versus systemd timers, row by row</title>
  <desc></desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">cron versus systemd timers, row by row</text>

  
  <g>
    
    <rect x="40" y="80" width="350" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(68, 88)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="2" y="2" width="32" height="32" rx="4"/>
      <line x1="2" y1="13" x2="34" y2="13"/>
      <line x1="14" y1="13" x2="14" y2="34"/>
    </g>

    
    <rect x="400" y="80" width="575" height="52" rx="8" fill="#207448"/>
    <g transform="translate(425, 88)" stroke="#ffffff" stroke-width="3" fill="none">
      <circle cx="18" cy="18" r="14"/>
      <polyline points="18,10 18,18 24,18"/>
    </g>
    <text x="687" y="116" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">cron</text>

    
    <rect x="985" y="80" width="575" height="52" rx="8" fill="#207448"/>
    <g transform="translate(1010, 88)" stroke="#ffffff" stroke-width="3" fill="none">
      <circle cx="18" cy="19" r="13"/>
      <path d="M14,6 L22,6 M18,3 L18,6"/>
      <polyline points="18,12 18,19 23,22"/>
    </g>
    <text x="1272" y="116" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">systemd timers</text>
  </g>

  
  <g>
    
    <rect x="40" y="138" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 155)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="22" cy="22" r="8"/>
      <path d="M22,5 L22,10 M22,34 L22,39 M5,22 L10,22 M34,22 L39,22 M10,10 L14,14 M30,30 L34,34 M10,34 L14,30 M30,14 L34,10"/>
    </g>
    <text x="118" y="187" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Configuration</text>

    
    <rect x="400" y="138" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="424" y="171" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="424" dy="0">one line; universal,</tspan>
      <tspan x="424" dy="28">simple, familiar</tspan>
    </text>

    
    <rect x="985" y="138" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1009" y="184" font-family="sans-serif" font-size="24" fill="#303a36">two unit files (timer plus service)</text>
  </g>

  
  <g>
    
    <rect x="40" y="222" width="350" height="122" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 261)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="18" cy="18" r="12"/>
      <line x1="27" y1="27" x2="38" y2="38"/>
      <circle cx="18" cy="18" r="4"/>
    </g>
    <text x="118" y="292" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Tracking</text>

    
    <rect x="400" y="222" width="575" height="122" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="271" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="424" dy="0">child of crond;</tspan>
      <tspan x="424" dy="30">output by mail or redirect</tspan>
    </text>

    
    <rect x="985" y="222" width="575" height="122" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1009" y="256" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1009" dy="0">own cgroup; status, <tspan font-family="monospace">journalctl -u</tspan>;</tspan>
      <tspan x="1009" dy="30">resource limits and sandboxing;</tspan>
      <tspan x="1009" dy="30">start and finish records</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="350" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 367)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="12" cy="14" r="6"/>
      <circle cx="32" cy="14" r="6"/>
      <circle cx="22" cy="32" r="6"/>
      <line x1="16" y1="18" x2="19" y2="27"/>
      <line x1="28" y1="18" x2="25" y2="27"/>
    </g>
    <text x="118" y="399" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Dependencies</text>

    
    <rect x="400" y="350" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="396" font-family="sans-serif" font-size="24" fill="#303a36">none</text>

    
    <rect x="985" y="350" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1009" y="382" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1009" dy="0">full systemd ordering,</tspan>
      <tspan x="1009" dy="28"><tspan font-family="monospace">After=network-online</tspan>, mount checks</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="434" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 451)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="6" y="8" width="32" height="28" rx="4"/>
      <line x1="6" y1="16" x2="38" y2="16"/>
      <line x1="14" y1="4" x2="14" y2="8"/>
      <line x1="30" y1="4" x2="30" y2="8"/>
      <line x1="22" y1="22" x2="22" y2="28"/>
      <circle cx="22" cy="32" r="1.5" fill="#207448"/>
    </g>
    <text x="118" y="483" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Missed runs</text>

    
    <rect x="400" y="434" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="480" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">anacron</tspan> for daily, weekly, monthly</text>

    
    <rect x="985" y="434" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1009" y="480" font-family="monospace" font-size="24" fill="#303a36">Persistent=true</text>
  </g>

  
  <g>
    
    <rect x="40" y="518" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 535)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M6,22 C12,12 18,32 24,22 C30,12 36,32 42,22"/>
      <line x1="6" y1="36" x2="42" y2="36"/>
    </g>
    <text x="118" y="555" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="118" dy="0">Spreading</tspan>
      <tspan x="118" dy="28">load</tspan>
    </text>

    
    <rect x="400" y="518" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="564" font-family="sans-serif" font-size="24" fill="#303a36">manual <tspan font-family="monospace">sleep</tspan></text>

    
    <rect x="985" y="518" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1009" y="564" font-family="monospace" font-size="24" fill="#303a36">RandomizedDelaySec=, AccuracySec=</text>
  </g>

  
  <g>
    
    <rect x="40" y="602" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 619)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="10" y="18" width="24" height="18" rx="3"/>
      <path d="M15,18 L15,12 C15,7 29,7 29,12 L29,18"/>
      <circle cx="22" cy="27" r="2" fill="#207448"/>
    </g>
    <text x="118" y="651" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Overlap</text>

    
    <rect x="400" y="602" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="648" font-family="sans-serif" font-size="24" fill="#303a36">manual <tspan font-family="monospace">flock</tspan></text>

    
    <rect x="985" y="602" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1009" y="635" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1009" dy="0">a running oneshot service</tspan>
      <tspan x="1009" dy="28">is not started twice</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="686" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 703)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="22" cy="22" r="16"/>
      <polyline points="22,12 22,22 29,22"/>
    </g>
    <text x="118" y="735" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Times</text>

    
    <rect x="400" y="686" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="732" font-family="sans-serif" font-size="24" fill="#303a36">5-field cron syntax</text>

    
    <rect x="985" y="686" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1009" y="719" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1009" dy="0"><tspan font-family="monospace">OnCalendar</tspan> plus monotonic</tspan>
      <tspan x="1009" dy="28">(<tspan font-family="monospace">OnBootSec</tspan>, <tspan font-family="monospace">OnUnitActiveSec</tspan>)</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="770" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 787)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="22" cy="14" r="8"/>
      <path d="M8,36 C8,26 14,24 22,24 C30,24 36,26 36,36"/>
    </g>
    <text x="118" y="803" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="118" dy="0">User</tspan>
      <tspan x="118" dy="30">self-service</tspan>
    </text>

    
    <rect x="400" y="770" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="424" y="816" font-family="sans-serif" font-size="24" fill="#303a36">easy <tspan font-family="monospace">crontab -e</tspan></text>

    
    <rect x="985" y="770" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1009" y="816" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">systemctl --user</tspan> (needs lingering)</text>
  </g>

  
  <g>
    
    <rect x="40" y="854" width="350" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <g transform="translate(58, 871)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="22" cy="22" r="16"/>
      <ellipse cx="22" cy="22" rx="7" ry="16"/>
      <line x1="6" y1="22" x2="38" y2="22"/>
    </g>
    <text x="118" y="903" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Portability</text>

    
    <rect x="400" y="854" width="575" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="424" y="900" font-family="sans-serif" font-size="24" fill="#303a36">everywhere</text>

    
    <rect x="985" y="854" width="575" height="78" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1009" y="900" font-family="sans-serif" font-size="24" fill="#303a36">systemd systems only</text>
  </g>

  
  <g>
    
    <rect x="40" y="944" width="745" height="136" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    <g transform="translate(62, 988)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="20" cy="24" r="14"/>
      <path d="M16,10 L24,10 M20,6 L20,10"/>
      <polyline points="20,17 20,24 25,27"/>
    </g>
    <text x="118" y="976" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="118" dy="0">Use timers for fleet maintenance shipped in an</tspan>
      <tspan x="118" dy="28">image or with configuration management:</tspan>
      <tspan x="118" dy="28">trimming, health snapshots, cleaning,</tspan>
      <tspan x="118" dy="28">certificates</tspan>
    </text>

    
    <rect x="815" y="944" width="745" height="136" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(837, 988)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="20" cy="24" r="14"/>
      <polyline points="20,16 20,24 26,24"/>
    </g>
    <text x="893" y="1004" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="893" dy="0">Use cron for quick user jobs,</tspan>
      <tspan x="893" dy="32">third-party jobs and compatibility cases</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1092" width="1520" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 1118)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M4,10 L14,10 L18,14 L34,14 L34,30 L4,30 Z"/>
    </g>
    <text x="116" y="1128" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" dy="0">Where the jobs live: <tspan font-family="monospace">crontab -l -u root</tspan>, <tspan font-family="monospace">/etc/cron*</tspan>,</tspan>
      <tspan x="116" dy="32"><tspan font-family="monospace">systemctl list-timers --all</tspan>, <tspan font-family="monospace">ls /etc/systemd/system/*.timer</tspan></tspan>
    </text>
  </g>
</svg>