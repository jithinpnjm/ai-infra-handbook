<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Reading a traceroute or mtr: noise versus a real fault</title>
  <desc>Visual explanation of diagnosing traceroute and mtr outputs, contrasting false alarms like ICMP rate limiting with genuine persistent network faults.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Reading a traceroute or mtr: noise versus a real fault</text>

  
  <g transform="translate(50, 105)">
    
    <rect width="1500" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 1488 0 Q 1500 0 1500 12 L 1500 48 L 0 48 Z" fill="#e8f1ea" />

    
    <text x="30" y="34" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Hop 5 prints * * *, hops 6, 7 and 8 reply normally</text>

    
    
    <rect x="30" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="60" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">1</text>
    <line x1="90" y1="97" x2="114" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="115" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="145" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">2</text>
    <line x1="175" y1="97" x2="199" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="200" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="230" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">3</text>
    <line x1="260" y1="97" x2="284" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="285" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="315" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">4</text>
    <line x1="345" y1="97" x2="369" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="370" y="70" width="70" height="55" rx="8" fill="#d8deda" stroke="#7a8b84" stroke-width="2" />
    <text x="405" y="94" font-family="sans-serif" font-size="20" font-weight="bold" fill="#506059" text-anchor="middle">5</text>
    <text x="405" y="116" font-family="sans-serif" font-size="22" font-weight="bold" fill="#506059" text-anchor="middle">* * *</text>
    <line x1="440" y1="97" x2="464" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="465" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="495" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">6</text>
    <line x1="525" y1="97" x2="549" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="550" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="580" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">7</text>
    <line x1="610" y1="97" x2="634" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="635" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="665" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">8</text>

    
    <rect x="735" y="60" width="735" height="105" rx="8" fill="#f0f4f1" stroke="#7a8b84" stroke-width="2" />
    <path d="M 405 130 L 405 145 L 735 145" fill="none" stroke="#7a8b84" stroke-width="2" stroke-dasharray="4,4" />
    <text x="755" y="100" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="755" dy="0">router declined to answer the probes, or rate-limits</tspan>
      <tspan x="755" dy="36">TTL-exceeded replies: nothing is wrong here</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 315)">
    
    <rect width="1500" height="185" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 1488 0 Q 1500 0 1500 12 L 1500 48 L 0 48 Z" fill="#fef3ea" />

    
    <text x="30" y="34" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">loss starts at hop 5 and every later hop shows the same loss</text>

    
    
    <rect x="30" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="60" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">1</text>
    <line x1="90" y1="97" x2="114" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="115" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="145" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">2</text>
    <line x1="175" y1="97" x2="199" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="200" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="230" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">3</text>
    <line x1="260" y1="97" x2="284" y2="97" stroke="#207448" stroke-width="2" marker-end="url(#arrow-green)" />

    
    <rect x="285" y="70" width="60" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="315" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">4</text>
    <line x1="345" y1="97" x2="369" y2="97" stroke="#db8129" stroke-width="2" marker-end="url(#arrow-orange)" />

    
    <rect x="370" y="70" width="60" height="55" rx="8" fill="#fef3ea" stroke="#db8129" stroke-width="3" />
    <text x="400" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">5</text>
    <line x1="430" y1="97" x2="454" y2="97" stroke="#db8129" stroke-width="2" marker-end="url(#arrow-orange)" />

    
    <rect x="455" y="70" width="60" height="55" rx="8" fill="#fef3ea" stroke="#db8129" stroke-width="3" />
    <text x="485" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">6</text>
    <line x1="515" y1="97" x2="539" y2="97" stroke="#db8129" stroke-width="2" marker-end="url(#arrow-orange)" />

    
    <rect x="540" y="70" width="60" height="55" rx="8" fill="#fef3ea" stroke="#db8129" stroke-width="3" />
    <text x="570" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">7</text>
    <line x1="600" y1="97" x2="624" y2="97" stroke="#db8129" stroke-width="2" marker-end="url(#arrow-orange)" />

    
    <rect x="625" y="70" width="60" height="55" rx="8" fill="#fef3ea" stroke="#db8129" stroke-width="3" />
    <text x="655" y="106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">8</text>

    
    <rect x="735" y="60" width="735" height="105" rx="8" fill="#fef3ea" stroke="#db8129" stroke-width="2" />
    <path d="M 530 135 L 530 145 L 735 145" fill="none" stroke="#db8129" stroke-width="2" stroke-dasharray="4,4" />
    <text x="755" y="118" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">persistent to the final hop: genuine, at or after hop 5</text>
  </g>

  

  
  <g transform="translate(50, 525)">
    
    <rect width="960" height="550" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <circle cx="45" cy="52" r="10" fill="#207448" />
    <text x="75" y="60" font-family="sans-serif" font-size="24" fill="#303a36">a * * * at one hop matters little if later hops respond</text>

    
    <circle cx="45" cy="140" r="10" fill="#207448" />
    <text x="75" y="132" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">high latency at one hop with low latency after it:</tspan>
      <tspan x="75" dy="36">control-plane deprioritisation of ICMP</tspan>
    </text>

    
    <circle cx="45" cy="248" r="10" fill="#207448" />
    <text x="75" y="240" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">loss at an intermediate hop that does not carry on</tspan>
      <tspan x="75" dy="36">to the final hop is rate limiting</tspan>
    </text>

    
    <circle cx="45" cy="356" r="10" fill="#207448" />
    <text x="75" y="348" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">only latency or loss that persists all the way</tspan>
      <tspan x="75" dy="36">to the destination is real</tspan>
    </text>

    
    <circle cx="45" cy="464" r="10" fill="#db8129" />
    <text x="75" y="456" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">in the mtr pattern, one hot hop followed by clean hops is noise,</tspan>
      <tspan x="75" dy="36">a step that persists is a real fault</tspan>
    </text>
  </g>

  
  <g transform="translate(1040, 525)">
    <rect width="510" height="550" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 498 0 Q 510 0 510 12 L 510 65 L 0 65 Z" fill="#e8f1ea" />

    
    <g transform="translate(25, 16)">
      <rect x="0" y="4" width="30" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="16" x2="22" y2="16" stroke="#207448" stroke-width="3" />
      <circle cx="24" cy="16" r="2" fill="#207448" />
    </g>

    <text x="70" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">How a trace is built</text>

    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">probes with increasing TTL or hop</tspan>
      <tspan x="30" dy="44">limit; the router that decrements it</tspan>
      <tspan x="30" dy="44">to 0 returns ICMP time exceeded</tspan>
      <tspan x="30" dy="44">(type 11) and reveals itself; the</tspan>
      <tspan x="30" dy="44">destination answers with ICMP port</tspan>
      <tspan x="30" dy="44">unreachable for UDP probes, echo</tspan>
      <tspan x="30" dy="44">reply for ICMP probes, SYN-ACK</tspan>
      <tspan x="30" dy="44">or RST for TCP probes</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1105)">
    <rect width="1500" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="25" y="16" width="1450" height="40" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="45" y="44" font-family="monospace" font-size="24" fill="#303a36">traceroute -n 8.8.8.8 (UDP to high ports, 3 per hop)</text>

    
    <rect x="25" y="64" width="1450" height="40" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="45" y="92" font-family="monospace" font-size="24" fill="#303a36">sudo traceroute -I -n (ICMP echo)</text>

    
    <rect x="25" y="112" width="1450" height="40" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="45" y="140" font-family="monospace" font-size="24" fill="#303a36">sudo traceroute -T -p 443 -n example.com (passes firewalls that allow 443)</text>

    
    <rect x="25" y="160" width="1450" height="40" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="45" y="188" font-family="monospace" font-size="24" fill="#303a36">tracepath -n (no root, reports pmtu per hop)</text>

    
    <rect x="25" y="208" width="1450" height="40" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="45" y="236" font-family="monospace" font-size="24" fill="#303a36">mtr -n -r -c 100 8.8.8.8</text>
  </g>

  
  <g transform="translate(50, 1390)">
    <rect width="1500" height="75" rx="10" fill="#207448" />
    <text x="750" y="47" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">When a trace looks wrong, check the forward path with mtr from both ends before you blame a router</text>
  </g>
</svg>