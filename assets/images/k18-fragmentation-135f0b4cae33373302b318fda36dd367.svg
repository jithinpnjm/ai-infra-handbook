  <text x="1190" y="738" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1190" dy="0">three 8-GPU training pods</tspan>
    <tspan x="1190" dy="34">each fit on one empty node</tspan>
  </text>


  
  <rect x="40" y="865" width="1520" height="100" rx="12" fill="#207448"/>
  <text x="800" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">spreading leaves free GPUs scattered in pieces too small for a big job,</tspan>
