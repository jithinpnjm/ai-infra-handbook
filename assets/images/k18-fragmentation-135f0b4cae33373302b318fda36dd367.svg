<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Spreading small pods strands the free GPUs; packing them keeps whole nodes free</title>
  <desc>Comparison between LeastAllocated spread which strands GPU capacity and MostAllocated bin-pack which preserves whole empty nodes for large jobs.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Spreading small pods strands the free GPUs;</tspan>
    <tspan x="800" dy="58">packing them keeps whole nodes free</tspan>
  </text>

  
