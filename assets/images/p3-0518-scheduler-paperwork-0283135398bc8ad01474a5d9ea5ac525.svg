<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The scheduler works from paperwork, not the floor</title>
  <desc>Two-panel contrast showing what the Kubernetes scheduler sees based on paperwork resource requests versus physical node floor reality.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The scheduler works from paperwork, not the floor</text>

  
  <text x="800" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" letter-spacing="0.5">Two-panel contrast for one node</text>

  
  
  
  <rect x="40" y="140" width="980" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 160)">
    <rect x="6" y="8" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 18 8 L 18 4 C 18 2 20 2 22 2 L 34 2 C 36 2 38 2 38 4 L 38 8 Z" fill="#e8f1ea" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="16" y1="22" x2="40" y2="22" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="32" x2="40" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="42" x2="32" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="135" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">What the scheduler sees</text>

  
  <rect x="65" y="235" width="250" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(80, 264)">
    <rect x="2" y="4" width="52" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="20" x2="54" y2="20" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="36" x2="54" y2="36" stroke="#207448" stroke-width="4" />
    <circle cx="12" cy="12" r="3" fill="#207448" />
    <circle cx="12" cy="28" r="3" fill="#207448" />
    <circle cx="12" cy="44" r="3" fill="#207448" />
  </g>
  <text x="150" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="150" dy="0">Node</tspan>
    <tspan x="150" dy="28">allocatable</tspan>
  </text>

  
  <rect x="340" y="235" width="655" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(355, 264)">
    <rect x="4" y="12" width="22" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="30" y="4" width="22" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="10" y1="22" x2="20" y2="22" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="36" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="36" y1="26" x2="46" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="430" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="430" dy="0">minus the sum of requests of</tspan>
    <tspan x="430" dy="28">pods already assigned</tspan>
    <tspan x="430" dy="28">(including pods still starting)</tspan>
  </text>

  
  <rect x="65" y="375" width="310" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(80, 397)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 36 A 20 20 0 0 1 44 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="28" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="150" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">equals room left</text>

  
  <line x1="375" y1="425" x2="405" y2="425" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <rect x="420" y="375" width="575" height="100" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(435, 397)">
    <line x1="28" y1="6" x2="28" y2="48" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="10" y1="16" x2="46" y2="16" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <path d="M 6 32 L 14 16 L 22 32 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <path d="M 34 26 L 42 16 L 50 26 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <line x1="18" y1="48" x2="38" y2="48" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="505" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="505" dy="0"><tspan font-family="ui-monospace, monospace">NodeResourcesFit</tspan> compares</tspan>
    <tspan x="505" dy="30">the new pod requests with that</tspan>
  </text>

  
  <rect x="65" y="495" width="930" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(80, 514)">
    <path d="M 28 4 L 48 12 L 48 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 L 8 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="16" y1="16" x2="40" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="150" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">limits are ignored for fit unless</tspan>
    <tspan x="150" dy="30">requests default to limits</tspan>
  </text>

  
  <rect x="65" y="605" width="930" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(80, 632)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <text x="28" y="37" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">0</text>
  </g>
  <text x="150" y="648" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0"><tspan font-family="ui-monospace, monospace">BestEffort</tspan> pod with no requests counts as 0,</tspan>
    <tspan x="150" dy="30">so it can overload a node (passenger with no ticket)</tspan>
  </text>

  
  <rect x="65" y="730" width="930" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(80, 764)">
    <rect x="4" y="8" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 16 18 L 26 28 L 16 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="38" x2="40" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="150" y="768" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">effective pod request = max(largest init container,</tspan>
    <tspan x="150" dy="30">sum of app containers) plus sidecar contributions</tspan>
    <tspan x="150" dy="30">plus <tspan font-family="ui-monospace, monospace">RuntimeClass</tspan> overhead</tspan>
  </text>

  
  <rect x="65" y="870" width="930" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(80, 924)">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4" />
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4" />
    <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4" />
    <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="4" />
    <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4" />
    <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" />
    <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="4" />
  </g>
  <text x="150" y="906" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">extended resources such as <tspan font-family="ui-monospace, monospace">nvidia.com/gpu</tspan>, <tspan font-family="ui-monospace, monospace">rdma/*</tspan>,</tspan>
    <tspan x="150" dy="30">hugepages are integers advertised by device plugins</tspan>
    <tspan x="150" dy="30">in allocatable, requested in limits where requests equal</tspan>
    <tspan x="150" dy="30">limits; counted by number, not identity</tspan>
  </text>

  
  
  
  <rect x="1060" y="140" width="500" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1085, 160)">
    <path d="M 6 28 C 16 14 40 14 50 28 C 40 42 16 42 6 28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="8" y1="8" x2="48" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1155" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1155" dy="0">What the scheduler</tspan>
    <tspan x="1155" dy="34">does not see</tspan>
  </text>

  
  <rect x="1085" y="260" width="450" height="775" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1115, 290)">
    <rect x="4" y="6" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 30 L 20 30 L 26 16 L 32 40 L 38 26 L 44 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="1115" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1115" dy="0">actual utilisation,</tspan>
    <tspan x="1115" dy="34">GPU health,</tspan>
    <tspan x="1115" dy="34">actual CPU or memory use</tspan>
    <tspan x="1115" dy="34">unless a plugin adds it</tspan>
  </text>

  
  <g transform="translate(1115, 545)">
    
    <line x1="0" y1="0" x2="390" y2="0" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />

    
    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="370" height="120" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      
      <rect x="20" y="20" width="100" height="80" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="70" cy="60" r="24" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="70" y1="42" x2="70" y2="78" stroke="#207448" stroke-width="3" />
      <line x1="52" y1="60" x2="88" y2="60" stroke="#207448" stroke-width="3" />
      
      <path d="M 160 75 Q 170 60 160 45 T 160 25" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 185 75 Q 195 60 185 45 T 185 25" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 210 75 Q 220 60 210 45 T 210 25" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      
      <circle cx="310" cy="60" r="26" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="292" y1="42" x2="328" y2="78" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="370" height="180" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      
      <rect x="20" y="20" width="330" height="80" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <path d="M 30 75 L 80 75 L 105 35 L 125 85 L 145 60 L 175 60 L 205 30 L 225 80 L 255 45 L 290 85 L 340 85" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <rect x="20" y="125" width="330" height="30" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="24" y="129" width="280" height="22" rx="2" fill="#207448" opacity="0.3" />
      <line x1="80" y1="125" x2="80" y2="155" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
    </g>
  </g>

  
  
  
  <rect x="40" y="1085" width="1520" height="85" rx="12" fill="#207448" />
  <text x="800" y="1138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">one pod at a time on a snapshot of the cluster; no idea of a job made of many pods</text>
</svg>