<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Architecture: from WSGI to ASGI</title>
  <desc>Visual flowchart illustrating the ASGI architecture and request lifecycle across client ingress, ASGI server, middleware stack, router, dependencies, validation, endpoint execution, and response serialization.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Architecture: from WSGI to ASGI</text>

  
  
  <line x1="390" y1="305" x2="430" y2="305" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="780" y1="305" x2="820" y2="305" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="1170" y1="305" x2="1210" y2="305" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="1385" y1="490" x2="1385" y2="580" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="1210" y1="765" x2="1170" y2="765" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="820" y1="765" x2="780" y2="765" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="430" y1="765" x2="390" y2="765" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="215" y1="580" x2="215" y2="490" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <g id="node-1">
    <rect x="40" y="120" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="84" cy="164" r="24" fill="#207448" />
    <text x="84" y="164" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g transform="translate(310, 136)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="34" rx="4" />
      <line x1="28" y1="40" x2="28" y2="48" />
      <line x1="16" y1="48" x2="40" y2="48" />
      <line x1="14" y1="18" x2="26" y2="18" />
      <circle cx="38" cy="18" r="2" fill="#207448" />
    </g>
    
    <line x1="64" y1="212" x2="366" y2="212" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="215" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="215" dy="0">Client /</tspan>
      <tspan x="215" dy="38">Ingress /</tspan>
      <tspan x="215" dy="38">API gateway</tspan>
    </text>
  </g>

  
  <g id="node-2">
    <rect x="430" y="120" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <circle cx="474" cy="164" r="24" fill="#db8129" />
    <text x="474" y="164" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g transform="translate(700, 136)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="18" rx="3" />
      <rect x="6" y="30" width="44" height="18" rx="3" />
      <circle cx="14" cy="17" r="2" fill="#db8129" />
      <circle cx="22" cy="17" r="2" fill="#db8129" />
      <line x1="30" y1="17" x2="42" y2="17" />
      <circle cx="14" cy="39" r="2" fill="#db8129" />
      <circle cx="22" cy="39" r="2" fill="#db8129" />
      <line x1="30" y1="39" x2="42" y2="39" />
    </g>
    
    <line x1="454" y1="212" x2="756" y2="212" stroke="#f4ceab" stroke-width="1.5" />
    
    <text x="605" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">ASGI server</text>
    <text x="605" y="324" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="605" dy="0">uvicorn</tspan>
      <tspan x="605" dy="34">(uvloop, httptools)</tspan>
    </text>
  </g>

  
  <g id="node-3">
    <rect x="820" y="120" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="864" cy="164" r="24" fill="#207448" />
    <text x="864" y="164" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g transform="translate(1090, 136)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 50,16 28,26 6,16" />
      <polyline points="6,27 28,37 50,27" />
      <polyline points="6,38 28,48 50,38" />
    </g>
    
    <line x1="844" y1="212" x2="1146" y2="212" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="995" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Middleware stack</text>
    <text x="995" y="306" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="995" dy="0">(CORS, auth,</tspan>
      <tspan x="995" dy="34">logging, metrics,</tspan>
      <tspan x="995" dy="34">gzip)</tspan>
    </text>
  </g>

  
  <g id="node-4">
    <rect x="1210" y="120" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1254" cy="164" r="24" fill="#207448" />
    <text x="1254" y="164" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g transform="translate(1480, 136)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="12" r="5" />
      <circle cx="12" cy="42" r="5" />
      <circle cx="44" cy="42" r="5" />
      <path d="M 28 17 L 28 26 M 28 26 L 12 37 M 28 26 L 44 37" />
    </g>
    
    <line x1="1234" y1="212" x2="1536" y2="212" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="1385" y="280" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1385" dy="0">Router: match</tspan>
      <tspan x="1385" dy="40">path + method</tspan>
    </text>
  </g>

  

  
  <g id="node-5">
    <rect x="1210" y="580" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1254" cy="624" r="24" fill="#207448" />
    <text x="1254" y="624" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g transform="translate(1480, 596)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="6" />
      <circle cx="40" cy="16" r="6" />
      <circle cx="28" cy="40" r="6" />
      <line x1="16" y1="22" x2="28" y2="34" />
      <line x1="40" y1="22" x2="28" y2="34" />
      <line x1="22" y1="16" x2="34" y2="16" />
    </g>
    
    <line x1="1234" y1="672" x2="1536" y2="672" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="1385" y="722" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1385" dy="0">Dependencies</tspan>
      <tspan x="1385" dy="38">(Depends)</tspan>
    </text>
    <text x="1385" y="810" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1385" dy="0">auth, settings,</tspan>
      <tspan x="1385" dy="34">DB session</tspan>
    </text>
  </g>

  
  <g id="node-6">
    <rect x="820" y="580" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="864" cy="624" r="24" fill="#207448" />
    <text x="864" y="624" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    
    <g transform="translate(1090, 596)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 12 L 28 6 L 46 12 C 46 28 28 48 28 48 C 28 48 10 28 10 12 Z" />
      <polyline points="19 25 25 32 37 18" />
    </g>
    
    <line x1="844" y1="672" x2="1146" y2="672" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="995" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Validate request</text>
    <text x="995" y="796" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">(pydantic)</text>
  </g>

  
  <g id="node-7">
    <rect x="430" y="580" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="474" cy="624" r="24" fill="#207448" />
    <text x="474" y="624" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
    
    <g transform="translate(700, 596)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="38" rx="4" />
      <line x1="6" y1="18" x2="50" y2="18" />
      <polyline points="14 26 20 32 14 38" />
      <line x1="26" y1="38" x2="36" y2="38" />
    </g>
    
    <line x1="454" y1="672" x2="756" y2="672" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="605" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Endpoint function</text>
    <text x="605" y="796" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">async def or def</text>
  </g>

  
  <g id="node-8">
    <rect x="40" y="580" width="350" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="84" cy="624" r="24" fill="#207448" />
    <text x="84" y="624" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">8</text>
    
    <g transform="translate(310, 596)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 6 L 34 6 L 44 16 L 44 48 L 12 48 Z" />
      <polyline points="34 6 34 16 44 16" />
      <line x1="18" y1="26" x2="32" y2="26" />
      <line x1="18" y1="34" x2="38" y2="34" />
      <line x1="18" y1="41" x2="28" y2="41" />
    </g>
    
    <line x1="64" y1="672" x2="366" y2="672" stroke="#c6dcd0" stroke-width="1.5" />
    
    <text x="215" y="720" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="215" dy="0">Validate/</tspan>
      <tspan x="215" dy="36">serialize</tspan>
      <tspan x="215" dy="36">response</tspan>
    </text>
    <text x="215" y="842" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">(response_model)</text>
  </g>
</svg>