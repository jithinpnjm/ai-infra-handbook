<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A reconstructed data plane, clearly labelled as inference</title>
  <desc>Visual infographic explaining a reconstructed inference data plane architecture, showing request flow from OpenAI-compatible clients through a regional gateway and cache-aware router to engine replicas, drafter, KV cache tiers, control plane, and metrics storage.</desc>

