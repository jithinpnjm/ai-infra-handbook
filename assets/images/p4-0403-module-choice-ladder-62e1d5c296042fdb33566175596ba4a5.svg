<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420" style="background:#f5f8f5;">
  <title>Choosing command, shell, raw, script or a real module</title>
  <desc>Decision ladder guiding whether to use a built-in module, raw, command, shell, or script in Ansible, with guarding best practices.</desc>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4d5d53"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b3022" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#303a36" text-anchor="middle">Choosing command, shell, raw, script or a real module</text>

  
  
  <g filter="url(#shadow)">
    <rect x="70" y="95" width="760" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <circle cx="120" cy="162" r="28" fill="#207448"/>
  <text x="120" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="32px" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
  <text x="165" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">Is there a purpose-built module</tspan>
    <tspan x="165" dy="34" font-size="24px" font-family="monospace" fill="#207448">(package, service, user, file, lineinfile,</tspan>
    <tspan x="165" dy="32" font-size="24px" font-family="monospace" fill="#207448">template, sysctl, systemd, mount, cron)?</tspan>
  </text>

  
  <path d="M 830 162 L 950 162" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arr-orange)"/>
  
  <rect x="855" y="138" width="65" height="34" rx="17" fill="#db8129"/>
  <text x="887" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">yes</text>

  
  <g filter="url(#shadow)">
    <rect x="960" y="95" width="570" height="135" rx="14" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>
  </g>
  
  <circle cx="1005" cy="162" r="26" fill="#db8129"/>
  <path d="M 995 162 L 1002 170 L 1017 154" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1045" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
    <tspan x="1045" dy="0">use it: idempotent, supports check</tspan>
    <tspan x="1045" dy="34">mode, returns structured results</tspan>
  </text>

  
  <path d="M 330 230 L 330 300" fill="none" stroke="#4d5d53" stroke-width="4" marker-end="url(#arr-grey)"/>
  <rect x="345" y="246" width="55" height="34" rx="8" fill="#4d5d53"/>
  <text x="372" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">no</text>

  
  
  <g filter="url(#shadow)">
    <rect x="70" y="300" width="520" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <circle cx="120" cy="350" r="26" fill="#207448"/>
  <rect x="108" y="338" width="24" height="24" rx="3" fill="#ffffff"/>
  <text x="165" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Does the target have Python?</text>

  
  <path d="M 590 350 L 720 350" fill="none" stroke="#4d5d53" stroke-width="4" marker-end="url(#arr-grey)"/>
  <rect x="625" y="328" width="55" height="34" rx="8" fill="#4d5d53"/>
  <text x="652" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">no</text>

  
  <g filter="url(#shadow)">
    <rect x="730" y="285" width="800" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  </g>
  
  <rect x="752" y="325" width="46" height="38" rx="5" fill="#207448"/>
  <path d="M 760 336 L 768 344 L 760 352 M 772 352 L 784 352" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="815" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="815" dy="0" font-weight="bold">raw: plain SSH command with no module</tspan>
    <tspan x="815" dy="32" font-weight="bold">and no Python;</tspan>
    <tspan font-weight="normal"> bootstraps Python on minimal</tspan>
    <tspan x="815" dy="32">systems and devices</tspan>
  </text>

  
  <path d="M 330 400 L 330 475" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arr-green)"/>
  <rect x="345" y="418" width="60" height="34" rx="8" fill="#207448"/>
  <text x="375" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">yes</text>

  
  
  <g filter="url(#shadow)">
    <rect x="70" y="475" width="520" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <circle cx="120" cy="525" r="26" fill="#207448"/>
  <text x="120" y="534" font-family="monospace" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">| &gt;</text>
  <text x="165" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Need pipes or redirects?</text>

  
  <path d="M 590 525 L 720 525" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arr-green)"/>
  <rect x="625" y="503" width="60" height="34" rx="8" fill="#207448"/>
  <text x="655" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">yes</text>

  
  <g filter="url(#shadow)">
    <rect x="730" y="460" width="800" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  </g>
  
  <rect x="752" y="500" width="46" height="38" rx="5" fill="#207448"/>
  <text x="775" y="527" font-family="monospace" font-size="22px" font-weight="bold" fill="#ffffff" text-anchor="middle">sh</text>
  <text x="815" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="815" dy="0" font-weight="bold">shell: passes through /bin/sh;</tspan>
    <tspan font-weight="normal"> vulnerable to</tspan>
    <tspan x="815" dy="32">quoting and injection mistakes when variables</tspan>
    <tspan x="815" dy="32">are untrusted</tspan>
  </text>

  
  <path d="M 330 575 L 330 655" fill="none" stroke="#4d5d53" stroke-width="4" marker-end="url(#arr-grey)"/>
  <rect x="345" y="598" width="55" height="34" rx="8" fill="#4d5d53"/>
  <text x="372" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">no</text>

  
  <g filter="url(#shadow)">
    <rect x="70" y="655" width="600" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  </g>
  
  <circle cx="120" cy="710" r="26" fill="#207448"/>
  <path d="M 120 695 L 134 703 L 134 718 C 134 728 120 735 120 735 C 120 735 106 728 106 718 L 106 703 Z" fill="#ffffff"/>
  <text x="165" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold">command: no shell, safest;</tspan>
    <tspan x="165" dy="34">no pipes, redirects or expansion</tspan>
  </text>

  
  
  <g filter="url(#shadow)">
    <rect x="730" y="655" width="410" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <circle cx="775" cy="710" r="24" fill="#207448"/>
  <text x="775" y="719" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
  <text x="815" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
    <tspan x="815" dy="0">Need to run a local</tspan>
    <tspan x="815" dy="34">script on the target?</tspan>
  </text>

  
  <path d="M 1140 730 L 1180 730" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arr-green)"/>

  
  <g filter="url(#shadow)">
    <rect x="1190" y="655" width="340" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  </g>
  
  <rect x="1208" y="705" width="36" height="46" rx="4" fill="#207448"/>
  <path d="M 1218 722 L 1226 728 L 1218 734" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1255" y="696" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="1255" dy="0" font-weight="bold">script:</tspan>
    <tspan font-weight="normal"> copies a</tspan>
    <tspan x="1255" dy="32">local script to</tspan>
    <tspan x="1255" dy="32">the target and</tspan>
    <tspan x="1255" dy="32">runs it</tspan>
  </text>

  
  <g filter="url(#shadow)">
    <rect x="70" y="845" width="1460" height="120" rx="12" fill="#fff9f5" stroke="#db8129" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  
  <polygon points="120,875 142,915 98,915" fill="#db8129"/>
  <text x="120" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="160" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="25px" font-weight="bold" fill="#db8129">Injection example</text>
  <text x="160" y="934" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan>a hostname from a ticket sneaks in a second command after a semicolon</tspan>
  </text>

  
  <g filter="url(#shadow)">
    <rect x="70" y="995" width="1460" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  </g>
  
  <circle cx="120" cy="1055" r="26" fill="#207448"/>
  <rect x="108" y="1047" width="24" height="20" rx="3" fill="#ffffff"/>
  <path d="M 113 1047 L 113 1040 C 113 1035 127 1035 127 1040 L 127 1047" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="165" y="1048" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#207448">Guard strip</text>
  <text x="165" y="1090" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold">command and shell are not idempotent:</tspan>
    <tspan font-weight="normal"> add </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">creates:</tspan>
    <tspan> or </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">removes:</tspan>
    <tspan>, a guard task (a small</tspan>
    <tspan x="165" dy="34">check that decides whether the risky step should run), or </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">changed_when</tspan>
    <tspan> and </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">failed_when</tspan>
    <tspan>; a shell</tspan>
    <tspan x="165" dy="34">one-liner always reports changed, cannot be dry-run and hides intent</tspan>
  </text>

  
  <rect x="70" y="1265" width="1460" height="90" rx="14" fill="#207448"/>
  <text x="800" y="1321" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#ffffff" text-anchor="middle">Prefer modules, and guard what you cannot avoid</text>
</svg>