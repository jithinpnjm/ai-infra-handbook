<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Turning an Xid code into ignore, suspect or drain</title>
  <desc>Flowchart showing the fleet policy for handling NVIDIA GPU Xid errors by catalog action and repeat frequency into ignore, suspect, or drain.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Turning an Xid code into ignore, suspect or drain</text>

  
  <g id="start-box">
    <rect x="680" y="75" width="560" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(705, 84)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="10" y2="18"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="4" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="52" y2="18"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="46" y1="38" x2="52" y2="38"/>
    </g>
    <text x="1000" y="123" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Xid reported on a node</text>
  </g>

  
  <line x1="960" y1="150" x2="960" y2="193" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="step-1">
    
    <circle cx="630" cy="165" r="24" fill="#207448"/>
    <text x="630" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <rect x="680" y="195" width="560" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(705, 204)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="4"/>
      <line x1="16" y1="18" x2="36" y2="18"/>
      <line x1="16" y1="28" x2="36" y2="28"/>
      <line x1="16" y1="38" x2="28" y2="38"/>
    </g>
    <text x="1000" y="243" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Code in the catalog?</text>
  </g>

  
  <path d="M 680 235 L 200 235 L 200 523" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="960" y1="270" x2="960" y2="313" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="step-2">
    
    <circle cx="630" cy="285" r="24" fill="#207448"/>
    <text x="630" y="294" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <rect x="680" y="315" width="560" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(705, 324)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10"/>
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 18 L 42 14"/>
    </g>
    <text x="1000" y="363" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Catalog action</text>
  </g>

  
  <g id="suspect-node">
    <rect x="40" y="525" width="320" height="225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(172, 545)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 10 L 28 4 L 44 10 C 44 32 28 48 28 48 C 28 48 12 32 12 10 Z"/>
      <line x1="28" y1="18" x2="28" y2="30"/>
      <circle cx="28" cy="37" r="1.5" fill="#207448"/>
    </g>
    <text x="200" y="635" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Suspect</text>
    <text x="200" y="682" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="200" dy="0">never ignore an</tspan>
      <tspan x="200" dy="30">unknown code</tspan>
    </text>
  </g>

  
  
  <path d="M 760 390 L 760 415 L 385 415 L 385 588" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="415" y="435" width="330" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="580" y="463" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="580" dy="0" font-weight="bold" fill="#207448">application-level,</tspan>
    <tspan x="580" dy="28" font-weight="bold" fill="#207448">RESTART_APP</tspan>
    <tspan x="580" dy="28">(for example</tspan>
    <tspan x="580" dy="28">Xid 13, 31, 94)</tspan>
  </text>

  
  <g id="repeat-decision">
    <rect x="410" y="590" width="340" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(558, 600)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="18"/>
      <polyline points="22,10 22,22 30,22"/>
    </g>
    <text x="580" y="662" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="580" dy="0">Same code three</tspan>
      <tspan x="580" dy="28">times within an hour</tspan>
      <tspan x="580" dy="28">on this node?</tspan>
    </text>
  </g>

  
  <g id="memory-note">
    <rect x="790" y="600" width="190" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    
    <g transform="translate(861, 612)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="24" rx="3"/>
      <rect x="9" y="11" width="6" height="8" fill="#e8f1ea"/>
      <rect x="19" y="11" width="6" height="8" fill="#e8f1ea"/>
      <rect x="29" y="11" width="6" height="8" fill="#e8f1ea"/>
      <rect x="39" y="11" width="6" height="8" fill="#e8f1ea"/>
      <line x1="11" y1="30" x2="11" y2="36"/>
      <line x1="19" y1="30" x2="19" y2="36"/>
      <line x1="27" y1="30" x2="27" y2="36"/>
      <line x1="35" y1="30" x2="35" y2="36"/>
      <line x1="43" y1="30" x2="43" y2="36"/>
    </g>
    <text x="885" y="665" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="885" dy="0">recent Xid</tspan>
      <tspan x="885" dy="28">times kept</tspan>
      <tspan x="885" dy="28">per node</tspan>
    </text>
  </g>

  
  <line x1="410" y1="650" x2="362" y2="650" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="580" y1="740" x2="580" y2="788" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="drain-box">
    <rect x="450" y="790" width="260" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(470, 817)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 12 L 28 32 L 48 12"/>
      <line x1="28" y1="4" x2="28" y2="44"/>
      <line x1="12" y1="50" x2="44" y2="50"/>
    </g>
    <text x="610" y="858" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Drain</text>
  </g>

  
  
  <path d="M 960 390 L 960 415 L 1000 415 L 1000 765 L 1040 765 L 1040 788" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1025" y="485" width="230" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1140" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1140" dy="0" font-weight="bold" fill="#207448">IGNORE</tspan>
    <tspan x="1140" dy="30">(for example</tspan>
    <tspan x="1140" dy="30">Xid 43, 63)</tspan>
  </text>

  
  <g id="ignore-box">
    <rect x="1020" y="790" width="240" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(1045, 817)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <path d="M 18 28 L 25 35 L 38 21"/>
    </g>
    <text x="1170" y="858" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Ignore</text>
  </g>

  
  
  <path d="M 1140 390 L 1140 415 L 1280 415 L 1280 765 L 1330 765 L 1330 788" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1305" y="465" width="250" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1430" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1430" dy="0" font-weight="bold" fill="#207448">reset, reboot</tspan>
    <tspan x="1430" dy="28" font-weight="bold" fill="#207448">or link</tspan>
    <tspan x="1430" dy="28">(for example</tspan>
    <tspan x="1430" dy="28">Xid 48, 64,</tspan>
    <tspan x="1430" dy="28">79, 95, 119,</tspan>
    <tspan x="1430" dy="28">120, 74)</tspan>
  </text>

  
  <g id="drain-at-once-box">
    <rect x="1300" y="790" width="260" height="110" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    <text x="1430" y="858" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Drain at once</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="940" width="1520" height="100" rx="14" fill="#207448"/>
    <text x="800" y="983" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">Translate the catalog into ignore, suspect and drain,</tspan>
      <tspan x="800" dy="34">and never ignore a code you do not recognise.</tspan>
    </text>
  </g>
</svg>