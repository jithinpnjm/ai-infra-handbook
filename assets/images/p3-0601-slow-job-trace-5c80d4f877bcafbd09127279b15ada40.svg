<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Tracing a slow job down the stack</title>
  <desc>Infographic explaining the AI infrastructure vertical stack, chapter pointers, and the trace path for diagnosing a slow job.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Tracing a slow job down the stack</text>

  
  <rect x="50" y="80" width="1500" height="125" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(70, 114)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="16"/>
    <line x1="34" y1="34" x2="48" y2="48"/>
    <polyline points="12,22 18,22 22,14 26,30 30,22 34,22"/>
  </g>
  <text x="145" y="118" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">user says the job is slow and GPUs look busy: </tspan>
    <tspan font-weight="normal">1 scheduler, where did the job land;</tspan>
    <tspan x="145" dy="35" font-weight="normal">2 fabric counters on the nodes of that job; 3 storage latency;</tspan>
    <tspan x="145" dy="35" font-weight="bold" fill="#db8129">the GPU looked fine all along because the wait was elsewhere</tspan>
  </text>

  
  <rect x="50" y="225" width="1070" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(70, 237)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="16" r="10"/>
    <path d="M 6 48 C 6 36 12 30 20 30 C 28 30 34 36 34 48"/>
    <circle cx="38" cy="18" r="8"/>
    <path d="M 32 46 C 35 38 40 34 48 34 C 52 34 54 36 54 42"/>
  </g>
  <text x="145" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Users and workflows</text>

  
  <rect x="50" y="325" width="1070" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(70, 342)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="42" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <polyline points="14,28 20,33 14,38"/>
    <line x1="26" y1="38" x2="36" y2="38"/>
  </g>
  <text x="145" y="380" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Login nodes: </tspan>
    <tspan font-size="25" font-weight="normal">SSH, Open OnDemand </tspan>
    <tspan font-size="25" font-weight="bold" fill="#207448">(6.2, 6.25)</tspan>
  </text>

  
  <rect x="50" y="435" width="1070" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(70, 474)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="44" rx="6"/>
    <line x1="4" y1="20" x2="52" y2="20"/>
    <line x1="16" y1="4" x2="16" y2="12"/>
    <line x1="40" y1="4" x2="40" y2="12"/>
    <circle cx="28" cy="34" r="10"/>
    <polyline points="28,28 28,34 33,34"/>
  </g>
  <text x="145" y="475" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Scheduler: </tspan>
    <tspan font-size="25" font-weight="normal">Slurm or Kueue; allocates</tspan>
    <tspan x="145" dy="36" font-size="25" font-weight="normal">nodes and GPUs exclusively, fair-share,</tspan>
    <tspan x="145" dy="36" font-size="25" font-weight="normal">QoS </tspan>
    <tspan font-size="25" font-weight="bold" fill="#207448">(6.7 to 6.17)</tspan>
  </text>
  
  <circle cx="580" cy="530" r="24" fill="#207448"/>
  <text x="580" y="539" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  
  <rect x="50" y="590" width="340" height="385" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(192, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <rect x="18" y="18" width="20" height="20"/>
    <line x1="18" y1="4" x2="18" y2="10"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
    <line x1="38" y1="4" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="52"/>
    <line x1="28" y1="46" x2="28" y2="52"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="4" y1="18" x2="10" y2="18"/>
    <line x1="4" y1="28" x2="10" y2="28"/>
    <line x1="4" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="52" y2="18"/>
    <line x1="46" y1="28" x2="52" y2="28"/>
    <line x1="46" y1="38" x2="52" y2="38"/>
  </g>
  <text x="70" y="700" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Compute nodes</tspan>
    <tspan x="70" dy="38" font-size="30" font-weight="bold">and apps:</tspan>
    <tspan x="70" dy="44" font-size="24" font-weight="normal">MPI, OpenMP, NCCL,</tspan>
    <tspan x="70" dy="34" font-size="24" font-weight="normal">PyTorch, Enroot</tspan>
    <tspan x="70" dy="42" font-size="24" font-weight="bold" fill="#207448">(6.3 to 6.6, 6.12,</tspan>
    <tspan x="70" dy="34" font-size="24" font-weight="bold" fill="#207448">6.13, 6.29)</tspan>
  </text>

  
  <rect x="415" y="590" width="340" height="385" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(557, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="14" r="6"/>
    <circle cx="44" cy="14" r="6"/>
    <circle cx="28" cy="42" r="6"/>
    <line x1="18" y1="14" x2="38" y2="14"/>
    <line x1="16" y1="18" x2="24" y2="36"/>
    <line x1="40" y1="18" x2="32" y2="36"/>
  </g>
  
  <circle cx="690" cy="635" r="24" fill="#207448"/>
  <text x="690" y="644" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="435" y="700" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Compute fabric:</tspan>
    <tspan x="435" dy="48" font-size="24" font-weight="normal">InfiniBand or</tspan>
    <tspan x="435" dy="36" font-size="24" font-weight="normal">RoCEv2</tspan>
    <tspan x="435" dy="52" font-size="24" font-weight="bold" fill="#207448">(6.12, Part 12)</tspan>
  </text>

  
  <rect x="780" y="590" width="340" height="385" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(922, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="14" rx="20" ry="8"/>
    <path d="M 8 14 L 8 28 C 8 32 16 36 28 36 C 40 36 48 32 48 28 L 48 14"/>
    <path d="M 8 28 L 8 42 C 8 46 16 50 28 50 C 40 50 48 46 48 42 L 48 28"/>
  </g>
  
  <circle cx="1060" cy="635" r="24" fill="#207448"/>
  <text x="1060" y="644" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="800" y="700" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Parallel storage:</tspan>
    <tspan x="800" dy="44" font-size="24" font-weight="normal">Lustre, GPFS,</tspan>
    <tspan x="800" dy="34" font-size="24" font-weight="normal">BeeGFS, WEKA,</tspan>
    <tspan x="800" dy="34" font-size="24" font-weight="normal">VAST</tspan>
    <tspan x="800" dy="44" font-size="24" font-weight="bold" fill="#207448">(6.18 to 6.21,</tspan>
    <tspan x="800" dy="34" font-size="24" font-weight="bold" fill="#207448">Part 13)</tspan>
  </text>

  
  <rect x="1145" y="225" width="405" height="750" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1320, 245)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="44" height="44" rx="4"/>
    <line x1="6" y1="20" x2="50" y2="20"/>
    <line x1="6" y1="34" x2="50" y2="34"/>
    <circle cx="14" cy="13" r="2" fill="#207448"/>
    <circle cx="14" cy="27" r="2" fill="#207448"/>
    <circle cx="14" cy="41" r="2" fill="#207448"/>
    <line x1="26" y1="13" x2="42" y2="13"/>
    <line x1="26" y1="27" x2="42" y2="27"/>
    <line x1="26" y1="41" x2="42" y2="41"/>
  </g>
  <text x="1170" y="340" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Management plane:</tspan>
    <tspan x="1170" dy="55" font-size="24" font-weight="normal">BMC Redfish,</tspan>
    <tspan x="1170" dy="48" font-size="24" font-weight="normal">PXE provisioning</tspan>
    <tspan x="1170" dy="48" font-size="24" font-weight="normal">xCAT Warewulf BCM,</tspan>
    <tspan x="1170" dy="48" font-size="24" font-weight="normal">LDAP, monitoring</tspan>
    <tspan x="1170" dy="60" font-size="24" font-weight="bold" fill="#207448">(6.22 to 6.27)</tspan>
  </text>

  
  <rect x="50" y="995" width="1500" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(70, 1022)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="28,4 12,28 26,28 18,52 40,22 26,22 34,4"/>
    <path d="M 44 34 C 44 42 38 48 38 48 C 38 48 32 42 32 34 C 32 28 38 24 38 24 C 38 24 44 28 44 34 Z"/>
  </g>
  <text x="145" y="1042" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Facility: </tspan>
    <tspan font-size="24" font-weight="normal">power distribution, UPS, chillers, </tspan>
    <tspan x="145" dy="38" font-size="24" font-weight="normal">direct-to-chip liquid cooling </tspan>
    <tspan font-size="24" font-weight="bold" fill="#207448">(6.30, Part 9)</tspan>
  </text>

  
  <path d="M 580 570 L 580 577 Q 580 582 585 582 L 762 582 Q 767 582 767 587 L 767 775 Q 767 780 772 780 L 780 780" fill="none" stroke="#db8129" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  
  <rect x="50" y="1125" width="1500" height="55" rx="8" fill="#207448"/>
  <text x="800" y="1161" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">find the layer first, then use the table to find the chapter</text>
</svg>