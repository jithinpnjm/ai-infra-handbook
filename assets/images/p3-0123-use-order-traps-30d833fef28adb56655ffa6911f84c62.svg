<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading USE results: check order and three traps</title>
  <desc>Visual explanation of the USE method check order (errors, saturation, utilisation) and three common interpretation traps.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading USE results: check order and three traps</text>

  
  
  <g id="box-errors">
    <rect x="40" y="95" width="480" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="80" cy="140" r="24" fill="#207448"/>
    <text x="80" y="149" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    
    <polygon points="155,115 180,160 130,160" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="155" y1="129" x2="155" y2="144" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="155" cy="152" r="2" fill="#207448"/>
    
    <text x="65" y="200" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">Errors first:</tspan>
      <tspan x="65" dy="36">cheap and objective</tspan>
    </text>
    
    <rect x="55" y="260" width="450" height="105" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="75" y="304" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">Errors: counts,</tspan>
      <tspan x="75" dy="34">such as 50 disk errors</tspan>
    </text>
  </g>

  
  <g id="box-saturation">
    <rect x="560" y="95" width="480" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="600" cy="140" r="24" fill="#207448"/>
    <text x="600" y="149" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    
    <rect x="645" y="122" width="54" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="663" y1="122" x2="663" y2="156" stroke="#207448" stroke-width="3"/>
    <line x1="681" y1="122" x2="681" y2="156" stroke="#207448" stroke-width="3"/>
    
    <text x="585" y="200" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="585" dy="0">Saturation second:</tspan>
      <tspan x="585" dy="36">any amount of it matters</tspan>
    </text>
    
    <rect x="575" y="260" width="450" height="105" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="595" y="295" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="595" dy="0">Saturation: a queue length</tspan>
      <tspan x="595" dy="32">or wait time, such as</tspan>
      <tspan x="595" dy="32">run queue of 4</tspan>
    </text>
  </g>

  
  <g id="box-utilisation">
    <rect x="1080" y="95" width="480" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1120" cy="140" r="24" fill="#207448"/>
    <text x="1120" y="149" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
    
    <rect x="1165" y="118" width="42" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1158" y1="128" x2="1165" y2="128" stroke="#207448" stroke-width="3"/>
    <line x1="1158" y1="139" x2="1165" y2="139" stroke="#207448" stroke-width="3"/>
    <line x1="1158" y1="150" x2="1165" y2="150" stroke="#207448" stroke-width="3"/>
    <line x1="1207" y1="128" x2="1214" y2="128" stroke="#207448" stroke-width="3"/>
    <line x1="1207" y1="139" x2="1214" y2="139" stroke="#207448" stroke-width="3"/>
    <line x1="1207" y1="150" x2="1214" y2="150" stroke="#207448" stroke-width="3"/>
    <circle cx="1186" cy="139" r="6" fill="#207448"/>
    
    <text x="1105" y="200" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1105" dy="0">Utilisation third:</tspan>
      <tspan x="1105" dy="36">needs interpretation</tspan>
    </text>
    
    <rect x="1095" y="260" width="450" height="105" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="1115" y="295" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1115" dy="0">Utilisation: a percent over</tspan>
      <tspan x="1115" dy="32">an interval, such as</tspan>
      <tspan x="1115" dy="32">one CPU at 90%</tspan>
    </text>
  </g>

  
  
  <g id="card-trap-1">
    <rect x="40" y="425" width="480" height="470" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="85" cy="468" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="85,454 85,468 97,468" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="125" y="468" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">Trap 1:</tspan>
      <tspan x="125" dy="34">interval length</tspan>
    </text>
    
    <rect x="60" y="555" width="440" height="125" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    
    <line x1="75" y1="655" x2="485" y2="655" stroke="#b0c8b8" stroke-width="2"/>
    
    <rect x="85" y="619" width="55" height="36" fill="#207448" rx="2"/>
    
    <g fill="#db8129">
      <rect x="156" y="565" width="3.2" height="90"/>
      <rect x="161.4" y="565" width="3.2" height="90"/>
      <rect x="166.8" y="565" width="3.2" height="90"/>
      <rect x="172.2" y="565" width="3.2" height="90"/>
      <rect x="177.6" y="565" width="3.2" height="90"/>
      <rect x="183" y="565" width="3.2" height="90"/>
      <rect x="188.4" y="565" width="3.2" height="90"/>
      <rect x="193.8" y="565" width="3.2" height="90"/>
      <rect x="199.2" y="565" width="3.2" height="90"/>
      <rect x="204.6" y="565" width="3.2" height="90"/>
      <rect x="210" y="565" width="3.2" height="90"/>
      <rect x="215.4" y="565" width="3.2" height="90"/>
      <rect x="220.8" y="565" width="3.2" height="90"/>
      <rect x="226.2" y="565" width="3.2" height="90"/>
      <rect x="231.6" y="565" width="3.2" height="90"/>
      <rect x="237" y="565" width="3.2" height="90"/>
      <rect x="242.4" y="565" width="3.2" height="90"/>
      <rect x="247.8" y="565" width="3.2" height="90"/>
      <rect x="253.2" y="565" width="3.2" height="90"/>
      <rect x="258.6" y="565" width="3.2" height="90"/>
      <rect x="264" y="565" width="3.2" height="90"/>
      <rect x="269.4" y="565" width="3.2" height="90"/>
      <rect x="274.8" y="565" width="3.2" height="90"/>
      <rect x="280.2" y="565" width="3.2" height="90"/>
      <rect x="285.6" y="565" width="3.2" height="90"/>
      <rect x="291" y="565" width="3.2" height="90"/>
      <rect x="296.4" y="565" width="3.2" height="90"/>
      <rect x="301.8" y="565" width="3.2" height="90"/>
      <rect x="307.2" y="565" width="3.2" height="90"/>
      <rect x="312.6" y="565" width="3.2" height="90"/>
      <rect x="318" y="565" width="3.2" height="90"/>
      <rect x="323.4" y="565" width="3.2" height="90"/>
      <rect x="328.8" y="565" width="3.2" height="90"/>
      <rect x="334.2" y="565" width="3.2" height="90"/>
      <rect x="339.6" y="565" width="3.2" height="90"/>
      <rect x="345" y="565" width="3.2" height="90"/>
      <rect x="350.4" y="565" width="3.2" height="90"/>
      <rect x="355.8" y="565" width="3.2" height="90"/>
      <rect x="361.2" y="565" width="3.2" height="90"/>
      <rect x="366.6" y="565" width="3.2" height="90"/>
      <rect x="372" y="565" width="3.2" height="90"/>
      <rect x="377.4" y="565" width="3.2" height="90"/>
      <rect x="382.8" y="565" width="3.2" height="90"/>
      <rect x="388.2" y="565" width="3.2" height="90"/>
      <rect x="393.6" y="565" width="3.2" height="90"/>
      <rect x="399" y="565" width="3.2" height="90"/>
      <rect x="404.4" y="565" width="3.2" height="90"/>
      <rect x="409.8" y="565" width="3.2" height="90"/>
      <rect x="415.2" y="565" width="3.2" height="90"/>
      <rect x="420.6" y="565" width="3.2" height="90"/>
      <rect x="426" y="565" width="3.2" height="90"/>
      <rect x="431.4" y="565" width="3.2" height="90"/>
      <rect x="436.8" y="565" width="3.2" height="90"/>
      <rect x="442.2" y="565" width="3.2" height="90"/>
      <rect x="447.6" y="565" width="3.2" height="90"/>
      <rect x="453" y="565" width="3.2" height="90"/>
      <rect x="458.4" y="565" width="3.2" height="90"/>
      <rect x="463.8" y="565" width="3.2" height="90"/>
      <rect x="469.2" y="565" width="3.2" height="90"/>
      <rect x="474.6" y="565" width="3.2" height="90"/>
    </g>
    
    <text x="65" y="725" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">five-minute averages can</tspan>
      <tspan x="65" dy="34">show 40% while every second</tspan>
      <tspan x="65" dy="34">saturates: look at 1 s data</tspan>
    </text>
  </g>

  
  <g id="card-trap-2">
    <rect x="560" y="425" width="480" height="470" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="585" y="446" width="48" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 593 484 Q 618 482 626 454" fill="none" stroke="#207448" stroke-width="4"/>
    
    <text x="645" y="468" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="645" dy="0">Trap 2:</tspan>
      <tspan x="645" dy="34">the 60% line</tspan>
    </text>
    
    <rect x="580" y="555" width="440" height="125" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    
    <line x1="605" y1="655" x2="1000" y2="655" stroke="#b0c8b8" stroke-width="2"/>
    <line x1="605" y1="570" x2="605" y2="655" stroke="#b0c8b8" stroke-width="2"/>
    
    <line x1="840" y1="570" x2="840" y2="655" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <path d="M 605 650 Q 805 647 840 630 T 985 572" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="585" y="710" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">above about 60% utilisation</tspan>
      <tspan x="585" dy="30">queueing delays become</tspan>
      <tspan x="585" dy="30">frequent for non-preemptible</tspan>
      <tspan x="585" dy="30">resources such as disks,</tspan>
      <tspan x="585" dy="30">NICs and links; CPUs preempt</tspan>
      <tspan x="585" dy="30">and degrade more gracefully</tspan>
    </text>
  </g>

  
  <g id="card-trap-3">
    <rect x="1080" y="425" width="480" height="470" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1125" cy="465" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1137" y1="477" x2="1149" y2="489" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="1165" y="456" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1165" dy="0">Trap 3:</tspan>
      <tspan x="1105" dy="34">the first finding</tspan>
      <tspan x="1105" dy="32">is not necessarily</tspan>
      <tspan x="1105" dy="32">the finding</tspan>
    </text>
    
    <rect x="1100" y="570" width="440" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    
    <rect x="1115" y="582" width="125" height="86" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="1177" cy="615" r="15" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="1169,615 1175,621 1187,609" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1135" y1="645" x2="1220" y2="645" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <rect x="1258" y="582" width="125" height="86" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 1307 626 A 14 14 0 1 1 1333 626" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1320" y1="626" x2="1327" y2="615" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="1278" y1="645" x2="1363" y2="645" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <rect x="1400" y="582" width="125" height="86" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 1450 605 A 13 13 0 1 1 1445 623" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="1445,600 1452,605 1444,611" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1420" y1="645" x2="1505" y2="645" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="1105" y="725" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">systems can have several</tspan>
      <tspan x="1105" dy="34">issues: fix one, re-measure,</tspan>
      <tspan x="1105" dy="34">iterate</tspan>
    </text>
  </g>

  
  <g id="bottom-strip">
    <rect x="40" y="935" width="1520" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="65" y="975" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">Include software resources: mutex locks, thread pools, file descriptors, process counts,</tspan>
      <tspan x="65" dy="33">connection pools, and cgroup limits; a memory cgroup is saturated by an allocation failure</tspan>
      <tspan x="65" dy="33">or swapping caused by the limit even when the host is fine; CPU quota throttling is saturation</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1110" width="1520" height="50" rx="8" fill="#207448"/>
    <text x="800" y="1145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">The method works through resources, not tools</text>
  </g>
</svg>