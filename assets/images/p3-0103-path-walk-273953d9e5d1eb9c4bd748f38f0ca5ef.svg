<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>How the kernel walks /home/alice/train.py one name at a time</title>
  <desc>Step-by-step visual representation of kernel directory traversal and inode lookup from root directory to data blocks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">How the kernel walks /home/alice/train.py one name at a time</text>

  
  <g transform="translate(0, 100)">
    
    <text x="800" y="45" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36" text-anchor="middle">/home/alice/train.py</text>
    
    
    <line x1="590" y1="60" x2="700" y2="60" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 590 54 L 590 60 M 700 54 L 700 60" stroke="#207448" stroke-width="2" />
    
    
    <line x1="710" y1="60" x2="825" y2="60" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 710 54 L 710 60 M 825 54 L 825 60" stroke="#207448" stroke-width="2" />
    
    
    <line x1="835" y1="60" x2="1010" y2="60" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 835 54 L 835 60 M 1010 54 L 1010 60" stroke="#207448" stroke-width="2" />
  </g>

  

  
  <g transform="translate(40, 220)">
    
    <rect width="260" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(102, 20)">
      <path d="M 4 14 L 20 14 L 28 22 L 52 22 L 52 46 L 4 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="22" y1="40" x2="34" y2="22" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="130" y="105" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="130" dy="0">Root</tspan>
      <tspan x="130" dy="36">directory /</tspan>
    </text>

    
    <rect x="16" y="175" width="228" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <line x1="130" y1="175" x2="130" y2="320" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="16" y1="235" x2="244" y2="235" stroke="#207448" stroke-width="1.5" />

    
    <rect x="20" y="180" width="105" height="50" fill="#f5f8f5" rx="4" />
    <rect x="135" y="180" width="105" height="50" fill="#f5f8f5" rx="4" />
    
    
    <text x="130" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">home -&gt; inode A</text>
  </g>

  
  <g>
    
    <text x="375" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">look up</text>
    <text x="375" y="435" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">home</text>

    
    <line x1="300" y1="495" x2="351" y2="495" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="375" cy="495" r="24" fill="#207448" />
    <text x="375" y="503" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <line x1="399" y1="495" x2="448" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  
  <g transform="translate(450, 220)">
    
    <rect width="270" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(107, 20)">
      <path d="M 4 14 L 20 14 L 28 22 L 52 22 L 52 46 L 4 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="28" cy="34" r="5" fill="#207448" />
    </g>

    
    <text x="135" y="95" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="135" dy="0">Directory</tspan>
      <tspan x="135" dy="34">/home</tspan>
      <tspan x="135" dy="34">(inode A)</tspan>
    </text>

    
    <rect x="16" y="175" width="238" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <line x1="135" y1="175" x2="135" y2="320" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="16" y1="235" x2="254" y2="235" stroke="#207448" stroke-width="1.5" />

    
    <rect x="20" y="180" width="110" height="50" fill="#f5f8f5" rx="4" />
    <rect x="140" y="180" width="110" height="50" fill="#f5f8f5" rx="4" />

    
    <text x="135" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">alice -&gt; inode B</text>
  </g>

  
  <g>
    
    <text x="795" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">look up</text>
    <text x="795" y="435" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">alice</text>

    
    <line x1="720" y1="495" x2="771" y2="495" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="795" cy="495" r="24" fill="#207448" />
    <text x="795" y="503" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <line x1="819" y1="495" x2="868" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  
  <g transform="translate(870, 220)">
    
    <rect width="316" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(130, 20)">
      <path d="M 4 14 L 20 14 L 28 22 L 52 22 L 52 46 L 4 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 22 38 C 22 32 34 32 34 38" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="30" r="3" fill="#207448" />
    </g>

    
    <text x="158" y="95" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="158" dy="0">Directory</tspan>
      <tspan x="158" dy="34">/home/alice</tspan>
      <tspan x="158" dy="34">(inode B)</tspan>
    </text>

    
    <rect x="16" y="175" width="284" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <line x1="158" y1="175" x2="158" y2="320" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="16" y1="235" x2="300" y2="235" stroke="#207448" stroke-width="1.5" />

    
    <rect x="20" y="180" width="134" height="50" fill="#f5f8f5" rx="4" />
    <rect x="162" y="180" width="134" height="50" fill="#f5f8f5" rx="4" />

    
    <text x="158" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">train.py -&gt; inode C</text>
  </g>

  
  <g>
    
    <text x="1261" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">look up</text>
    <text x="1261" y="435" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">train.py</text>

    
    <line x1="1186" y1="495" x2="1237" y2="495" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="1261" cy="495" r="24" fill="#207448" />
    <text x="1261" y="503" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <line x1="1285" y1="495" x2="1334" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  
  <g transform="translate(1336, 220)">
    
    <rect width="224" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(84, 18)">
      <rect x="8" y="6" width="40" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="18" x2="40" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="38" x2="32" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="112" y="96" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Inode C:</text>
    
    <text x="112" y="132" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="112" dy="0">type,</tspan>
      <tspan x="112" dy="29">permissions,</tspan>
      <tspan x="112" dy="29">owner, size,</tspan>
      <tspan x="112" dy="29">times,</tspan>
      <tspan x="112" dy="29">link count,</tspan>
      <tspan x="112" dy="29">pointers to</tspan>
      <tspan x="112" dy="29">data blocks</tspan>
    </text>
  </g>

  

  
  <g transform="translate(630, 620)">
    <rect width="556" height="150" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    <rect x="0" y="0" width="12" height="150" rx="6" fill="#db8129" />
    
    <text x="290" y="66" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="290" dy="0">The name lives in the directory;</tspan>
      <tspan x="290" dy="38">everything else lives in the inode</tspan>
    </text>
  </g>

  
  <g>
    
    <text x="1395" y="672" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="end">
      <tspan x="1395" dy="0">read the inode</tspan>
      <tspan x="1395" dy="30">and its data</tspan>
    </text>

    
    <line x1="1448" y1="560" x2="1448" y2="656" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="1448" cy="680" r="24" fill="#207448" />
    <text x="1448" y="688" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    
    <line x1="1448" y1="704" x2="1448" y2="788" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  
  <g transform="translate(1336, 790)">
    
    <rect width="224" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(84, 12)">
      
      <path d="M 8 16 C 8 11 48 11 48 16 C 48 21 8 21 8 16 Z" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M 8 16 L 8 24 C 8 29 48 29 48 24 L 48 16" fill="none" stroke="#207448" stroke-width="3" />
      
      <path d="M 8 24 L 8 32 C 8 37 48 37 48 32 L 48 24" fill="none" stroke="#207448" stroke-width="3" />
      
      <path d="M 8 32 L 8 40 C 8 45 48 45 48 40 L 48 32" fill="none" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="112" y="88" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="112" dy="0">Data blocks</tspan>
      <tspan x="112" dy="30">on the device</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 990)">
    <rect width="1520" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="0" y="0" width="10" height="70" rx="5" fill="#207448" />
    
    <text x="760" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">rename = change one table row, so it is instant on one filesystem</text>
  </g>

</svg>