    <text x="585" y="475" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="585" dy="0">Swap in and out:</tspan>
      <tspan x="585" dy="30">si 0, so 4692</tspan>
      <tspan x="585" dy="30">(non-zero means saturated)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1080" y="400" width="440" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1105, 462)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
