    <rect x="690" y="205" width="110" height="55" fill="#207448" stroke="#db8129" stroke-width="3"/>
    <text x="745" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">so</text>

    
