    <line x1="1460" y1="260" x2="1460" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="1430" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">1</text>

    
    <text x="1490" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">0</text>
