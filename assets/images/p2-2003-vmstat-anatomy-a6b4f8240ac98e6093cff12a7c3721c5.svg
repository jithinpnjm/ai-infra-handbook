  <line x1="1370" y1="353" x2="1370" y2="400" stroke="#207448" stroke-width="2.5"/>


  

  
  <g>
    <rect x="80" y="400" width="260" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(182, 420)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="40" height="10" rx="3"/>
      <rect x="8" y="22" width="40" height="10" rx="3"/>
      <rect x="8" y="38" width="40" height="10" rx="3"/>
    </g>
    <text x="210" y="525" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="210" dy="0">Run queue r:</tspan>
      <tspan x="210" dy="30">only 1 or 2</tspan>
    </text>
  </g>

  
  <g>
    <rect x="480" y="400" width="460" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(505, 462)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
