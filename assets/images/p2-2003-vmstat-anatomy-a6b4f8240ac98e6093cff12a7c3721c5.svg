    <text x="1185" y="490" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1185" dy="0">CPU: us 61, sy 38, id 0</tspan>
      <tspan x="1185" dy="32">(idle reached zero)</tspan>
    </text>
  </g>


  

  
  <g>
    <rect x="80" y="650" width="680" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(105, 712)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="44" height="24" rx="3"/>
      <line x1="14" y1="22" x2="18" y2="22"/>
      <line x1="26" y1="22" x2="30" y2="22"/>
      <line x1="38" y1="22" x2="42" y2="22"/>
      <line x1="12" y1="40" x2="12" y2="44"/>
      <line x1="20" y1="40" x2="20" y2="44"/>
