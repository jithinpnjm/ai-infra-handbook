<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Reading one vmstat row under swapping</title>
  <desc>Visual explanation of vmstat columns and values during memory saturation and swapping</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="80" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading one vmstat row under swapping</text>

  
  <g>
    <rect x="80" y="95" width="630" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(100, 107)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <polyline points="28,14 28,28 38,34"/>
    </g>
    
    <text x="180" y="143" font-family="sans-serif" font-size="24" fill="#303a36">The first vmstat row is since boot, so skip it.</text>
  </g>

  
  <g>
    
    <path d="M 740,95 H 1520 V 175 H 775 L 745,205 L 740,175 Z" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(760, 107)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 52,48 4,48"/>
      <line x1="28" y1="20" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="1.5" fill="#db8129"/>
    </g>
    
    <text x="835" y="144" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Memory is swapping: fix the process that grew, not the CPU</text>
  </g>

  
  <g id="vmstat-table">
    
    <rect x="80" y="205" width="1440" height="55" fill="#207448" rx="6"/>
    
    
    <text x="110" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">r</text>
    <line x1="140" y1="205" x2="140" y2="260" stroke="#368a5e" stroke-width="1.5"/>

    
    <text x="170" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">b</text>
    <line x1="200" y1="205" x2="200" y2="260" stroke="#368a5e" stroke-width="2"/>

    
    <text x="265" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">swpd</text>
    <line x1="330" y1="205" x2="330" y2="260" stroke="#368a5e" stroke-width="1.5"/>

    
    <text x="390" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">free</text>
    <line x1="450" y1="205" x2="450" y2="260" stroke="#368a5e" stroke-width="1.5"/>

    
    <text x="485" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">buff</text>
    <line x1="520" y1="205" x2="520" y2="260" stroke="#368a5e" stroke-width="1.5"/>

    
    <text x="570" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">cache</text>
