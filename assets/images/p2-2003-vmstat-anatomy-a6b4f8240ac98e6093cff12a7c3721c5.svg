    <text x="965" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">bo</text>
    <line x1="1020" y1="205" x2="1020" y2="260" stroke="#368a5e" stroke-width="2"/>

    
    <text x="1070" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
