    <text x="1430" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">wa</text>
    <line x1="1460" y1="205" x2="1460" y2="260" stroke="#368a5e" stroke-width="1.5"/>

    
    <text x="1490" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">st</text>

    
    
