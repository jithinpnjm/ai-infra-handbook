    <text x="855" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">4520</text>

    
    <line x1="1020" y1="260" x2="1020" y2="325" stroke="#c2d6c7" stroke-width="2"/>
    <text x="965" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">4692</text>

    
    <line x1="1120" y1="260" x2="1120" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="1070" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">1060</text>

    
    <line x1="1220" y1="260" x2="1220" y2="325" stroke="#c2d6c7" stroke-width="2"/>
    <text x="1170" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">1939</text>

    
    <line x1="1280" y1="260" x2="1280" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
