  <path d="M 85,335 v 10 H 105 l 5,8 l 5,-8 H 135 v -10" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="110" y1="353" x2="110" y2="400" stroke="#207448" stroke-width="2.5"/>

  
  <path d="M 205,335 v 10 H 405 l 5,8 l 5,-8 H 615 v -10" fill="none" stroke="#207448" stroke-width="2.5"/>
