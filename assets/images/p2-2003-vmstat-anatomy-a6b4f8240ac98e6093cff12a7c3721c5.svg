    <text x="1310" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">sy</text>
    <line x1="1340" y1="205" x2="1340" y2="260" stroke="#368a5e" stroke-width="1.5"/>

    
    <text x="1370" y="242" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">id</text>
