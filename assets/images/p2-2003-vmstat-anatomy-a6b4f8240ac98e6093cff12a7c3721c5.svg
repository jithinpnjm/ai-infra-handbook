    <line x1="200" y1="260" x2="200" y2="325" stroke="#c2d6c7" stroke-width="2"/>
    <text x="170" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">0</text>

    
    <line x1="330" y1="260" x2="330" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="265" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">418036</text>

    
    <line x1="450" y1="260" x2="450" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="390" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">68172</text>

    
    <line x1="520" y1="260" x2="520" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="485" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">68</text>

    
    <line x1="620" y1="260" x2="620" y2="325" stroke="#c2d6c7" stroke-width="2"/>
    <text x="570" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">3808</text>

    
    <line x1="690" y1="260" x2="690" y2="325" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="655" y="301" font-family="monospace" font-size="26" fill="#303a36" text-anchor="middle">0</text>

    
    <rect x="690" y="260" width="110" height="65" fill="#fff7ed" stroke="#db8129" stroke-width="4"/>
    <text x="745" y="301" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">4692</text>

    
    <line x1="800" y1="260" x2="800" y2="325" stroke="#c2d6c7" stroke-width="2"/>
