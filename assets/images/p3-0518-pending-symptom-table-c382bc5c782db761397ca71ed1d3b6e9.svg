<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pending pod symptoms and their fixes</title>
  <desc>Three-column table symptom, likely cause, fix</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Pending pod symptoms and their fixes</text>

  <rect x="40" y="105" width="460" height="50" rx="8" fill="#207448"/>
  <text x="270" y="140" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">symptom</text>

  <rect x="520" y="105" width="510" height="50" rx="8" fill="#207448"/>
  <text x="775" y="140" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">likely cause</text>

  <rect x="1050" y="105" width="510" height="50" rx="8" fill="#207448"/>
  <text x="1305" y="140" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">fix</text>

  
  <g id="row1">
    <rect x="40" y="172" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2.5"/>
    <line x1="510" y1="184" x2="510" y2="272" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="184" x2="1040" y2="272" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <rect x="58" y="214" width="28" height="28" rx="4" stroke="#db8129" stroke-width="3" fill="none"/>
      <rect x="66" y="222" width="12" height="12" rx="2" stroke="#db8129" stroke-width="2" fill="none"/>
      <line x1="64" y1="207" x2="64" y2="214" stroke="#db8129" stroke-width="2.5"/>
      <line x1="72" y1="207" x2="72" y2="214" stroke="#db8129" stroke-width="2.5"/>
      <line x1="80" y1="207" x2="80" y2="214" stroke="#db8129" stroke-width="2.5"/>
      <line x1="64" y1="242" x2="64" y2="249" stroke="#db8129" stroke-width="2.5"/>
      <line x1="72" y1="242" x2="72" y2="249" stroke="#db8129" stroke-width="2.5"/>
      <line x1="80" y1="242" x2="80" y2="249" stroke="#db8129" stroke-width="2.5"/>
      <line x1="51" y1="220" x2="58" y2="220" stroke="#db8129" stroke-width="2.5"/>
      <line x1="51" y1="228" x2="58" y2="228" stroke="#db8129" stroke-width="2.5"/>
      <line x1="51" y1="236" x2="58" y2="236" stroke="#db8129" stroke-width="2.5"/>
      <line x1="86" y1="220" x2="93" y2="220" stroke="#db8129" stroke-width="2.5"/>
      <line x1="86" y1="228" x2="93" y2="228" stroke="#db8129" stroke-width="2.5"/>
      <line x1="86" y1="236" x2="93" y2="236" stroke="#db8129" stroke-width="2.5"/>
    </g>

    <text x="110" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">Insufficient </tspan>
      <tspan x="110" dy="28" font-family="monospace">nvidia.com/gpu </tspan>
      <tspan x="110" dy="28">but GPUs free</tspan>
    </text>

    <text x="525" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">terminating or other-namespace </tspan>
      <tspan x="525" dy="28">pods, device plugin not updated, </tspan>
      <tspan x="525" dy="28">fragmentation, node cordoned</tspan>
    </text>

    <text x="1055" y="224" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1055">describe node allocated, </tspan>
      <tspan x="1055" dy="28">check plugin, defrag, uncordon</tspan>
    </text>
  </g>

  
  <g id="row2">
    <rect x="40" y="296" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="308" x2="510" y2="396" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="308" x2="1040" y2="396" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <path d="M 54 340 L 74 340 L 92 358 L 74 376 L 54 376 Z" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <circle cx="63" cy="358" r="3.5" fill="#207448"/>
    </g>

    <text x="110" y="348" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">didn't match node </tspan>
      <tspan x="110" dy="28">affinity/selector</tspan>
    </text>

    <text x="525" y="348" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">labels missing (GFD not running) </tspan>
      <tspan x="525" dy="28">or typos</tspan>
    </text>

    <text x="1055" y="348" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055">check labels, </tspan>
      <tspan x="1055" dy="28">NFD and GFD DaemonSets</tspan>
    </text>
  </g>

  
  <g id="row3">
    <rect x="40" y="420" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="432" x2="510" y2="520" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="432" x2="1040" y2="520" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <rect x="52" y="490" width="16" height="16" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
      <rect x="78" y="490" width="16" height="16" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
      <rect x="65" y="468" width="16" height="16" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
      <line x1="68" y1="484" x2="63" y2="490" stroke="#207448" stroke-width="2"/>
      <line x1="78" y1="484" x2="83" y2="490" stroke="#207448" stroke-width="2"/>
    </g>

    <text x="110" y="458" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">didn't satisfy existing </tspan>
      <tspan x="110" dy="28">pods anti-affinity or </tspan>
      <tspan x="110" dy="28">topology spread</tspan>
    </text>

    <text x="525" y="482" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">too strict required rules</tspan>
    </text>

    <text x="1055" y="458" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055">relax to preferred, add </tspan>
      <tspan x="1055" dy="28">capacity or domains, </tspan>
      <tspan x="1055" dy="28">adjust maxSkew</tspan>
    </text>
  </g>

  
  <g id="row4">
    <rect x="40" y="544" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="556" x2="510" y2="644" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="556" x2="1040" y2="644" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <ellipse cx="73" cy="585" rx="19" ry="7" stroke="#207448" stroke-width="3" fill="none"/>
      <path d="M 54 585 v 26 c 0 4 8 7 19 7 s 19 -3 19 -7 v -26" stroke="#207448" stroke-width="3" fill="none"/>
      <path d="M 54 598 c 0 4 8 7 19 7 s 19 -3 19 -7" stroke="#207448" stroke-width="2.5" fill="none"/>
    </g>

    <text x="110" y="596" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">volume node affinity </tspan>
      <tspan x="110" dy="28">conflict</tspan>
    </text>

    <text x="525" y="596" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">PV zone differs from </tspan>
      <tspan x="525" dy="28">schedulable nodes</tspan>
    </text>

    <text x="1055" y="596" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055">WaitForFirstConsumer, </tspan>
      <tspan x="1055" dy="28">same-zone capacity</tspan>
    </text>
  </g>

  
  <g id="row5">
    <rect x="40" y="668" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="680" x2="510" y2="768" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="680" x2="1040" y2="768" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <circle cx="73" cy="724" r="21" stroke="#207448" stroke-width="3" fill="none"/>
      <polyline points="73 712 73 724 84 724" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none"/>
      <line x1="73" y1="703" x2="73" y2="707" stroke="#207448" stroke-width="2"/>
    </g>

    <text x="110" y="720" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">Pending forever </tspan>
      <tspan x="110" dy="28">with Kueue</tspan>
    </text>

    <text x="525" y="706" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">not admitted, quota, </tspan>
      <tspan x="525" dy="28">flavor mismatch, </tspan>
      <tspan x="525" dy="28">wrong queue label, suspend</tspan>
    </text>

    <text x="1055" y="720" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055" font-family="monospace">kubectl describe workload, </tspan>
      <tspan x="1055" dy="28">ClusterQueue status</tspan>
    </text>
  </g>

  
  <g id="row6">
    <rect x="40" y="792" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="804" x2="510" y2="892" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="804" x2="1040" y2="892" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <rect x="52" y="834" width="18" height="28" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
      <rect x="76" y="834" width="18" height="28" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
      <line x1="70" y1="843" x2="76" y2="843" stroke="#207448" stroke-width="2.5"/>
      <line x1="70" y1="853" x2="76" y2="853" stroke="#207448" stroke-width="2.5"/>
      <line x1="58" y1="830" x2="88" y2="866" stroke="#207448" stroke-width="2.5"/>
    </g>

    <text x="110" y="844" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">Scheduled then </tspan>
      <tspan x="110" dy="28">TopologyAffinityError</tspan>
    </text>

    <text x="525" y="844" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">kubelet topology </tspan>
      <tspan x="525" dy="28">policy rejects</tspan>
    </text>

    <text x="1055" y="844" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055">align policy, NUMA-aware </tspan>
      <tspan x="1055" dy="28">scheduling or DRA</tspan>
    </text>
  </g>

  
  <g id="row7">
    <rect x="40" y="916" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="928" x2="510" y2="1016" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="928" x2="1040" y2="1016" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <rect x="52" y="951" width="42" height="42" rx="5" stroke="#207448" stroke-width="2" stroke-dasharray="4 2" fill="none"/>
      <rect x="58" y="958" width="13" height="13" rx="2" stroke="#207448" stroke-width="2" fill="#207448"/>
      <rect x="75" y="958" width="13" height="13" rx="2" stroke="#207448" stroke-width="2" fill="none"/>
      <rect x="66.5" y="974" width="13" height="13" rx="2" stroke="#207448" stroke-width="2" fill="none"/>
    </g>

    <text x="110" y="968" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">Training job </tspan>
      <tspan x="110" dy="28">partially running</tspan>
    </text>

    <text x="525" y="978" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">no gang control</tspan>
    </text>

    <text x="1055" y="968" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055">use Kueue, Volcano </tspan>
      <tspan x="1055" dy="28">or PodGroup</tspan>
    </text>
  </g>

  
  <g id="row8">
    <rect x="40" y="1040" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="510" y1="1052" x2="510" y2="1140" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1040" y1="1052" x2="1040" y2="1140" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5"/>

    
    <g transform="translate(0, 0)">
      <path d="M 58 1076 h 30 v 20 l -15 15 l -15 -15 z" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <line x1="65" y1="1084" x2="81" y2="1084" stroke="#207448" stroke-width="2"/>
      <line x1="65" y1="1091" x2="81" y2="1091" stroke="#207448" stroke-width="2"/>
      <line x1="73" y1="1084" x2="73" y2="1098" stroke="#207448" stroke-width="2"/>
    </g>

    <text x="110" y="1102" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="110">DRA claim pending</tspan>
    </text>

    <text x="525" y="1092" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="525">no matching ResourceSlice </tspan>
      <tspan x="525" dy="28">attributes or driver not running</tspan>
    </text>

    <text x="1055" y="1092" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1055">get resourceslices, </tspan>
      <tspan x="1055" dy="28">driver pods, CEL expression</tspan>
    </text>
  </g>
</svg>