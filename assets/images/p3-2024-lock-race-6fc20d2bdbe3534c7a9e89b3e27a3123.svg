<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What locking protects and what it does not</title>
  <desc>Visual infographic explaining Terraform state locking timelines, code vs state protection, and backend checklist.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What locking protects and what it does not</text>

  
  <g transform="translate(40, 75)">
    <rect width="1520" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 12)">
      <rect x="0" y="0" width="38" height="50" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="12" x2="30" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="8" y1="24" x2="30" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="8" y1="36" x2="22" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="2" cy="14" r="2" fill="#207448" />
      <circle cx="2" cy="26" r="2" fill="#207448" />
      <circle cx="2" cy="38" r="2" fill="#207448" />
    </g>
    <text x="85" y="32" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">state is Terraform's notebook: a JSON map from resource addresses</tspan>
      <tspan> in code to real object IDs, </tspan>
      <tspan font-weight="bold">a private format, never edit by hand</tspan>
    </text>
  </g>

  

  
  <g transform="translate(40, 190)">
    
    <rect width="740" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 20)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="20,10 20,20 28,24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="85" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline 1 without locking</text>

    
    <rect x="30" y="70" width="680" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="70" cy="107" r="24" fill="#207448" />
    <text x="70" y="115" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="115" y="100" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" dy="0">two engineers run apply on the same</tspan>
      <tspan x="115" dy="30">cluster within one minute</tspan>
    </text>

    
    <line x1="370" y1="145" x2="370" y2="165" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="165" width="680" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="70" cy="195" r="24" fill="#207448" />
    <text x="70" y="203" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="115" y="203" font-family="sans-serif" font-size="24" fill="#303a36">both read the same state</text>

    
    <line x1="370" y1="225" x2="370" y2="245" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="245" width="680" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="70" cy="275" r="24" fill="#207448" />
    <text x="70" y="283" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="115" y="283" font-family="sans-serif" font-size="24" fill="#303a36">both write back</text>

    
    <line x1="370" y1="305" x2="370" y2="325" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="325" width="680" height="85" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <circle cx="70" cy="367" r="24" fill="#db8129" />
    <text x="70" y="375" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <text x="115" y="360" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="115" dy="0">one write wins and the other</tspan>
      <tspan x="115" dy="30">is lost without an error</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 190)">
    
    <rect width="740" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 20)">
      <rect x="6" y="16" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 16 L 12 10 A 8 8 0 0 1 28 10 L 28 16" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="85" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline 2 with locking</text>

    
    <rect x="30" y="70" width="680" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="70" cy="117" r="24" fill="#207448" />
    <text x="70" y="125" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="115" y="102" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" dy="0">Terraform takes a lock in the backend</tspan>
      <tspan x="115" dy="28">before any operation that</tspan>
      <tspan x="115" dy="28">could write state</tspan>
    </text>

    
    <line x1="370" y1="165" x2="370" y2="183" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="183" width="680" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="70" cy="213" r="24" fill="#207448" />
    <text x="70" y="221" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="115" y="221" font-family="sans-serif" font-size="24" fill="#303a36">the second run waits or fails</text>

    
    <rect x="30" y="255" width="680" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 268)">
      <circle cx="14" cy="14" r="12" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="18 6" />
      <polyline points="14,8 14,14 18,14" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="95" y="291" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan>flag </tspan>
      <tspan font-family="monospace" font-weight="bold">-lock-timeout=10m</tspan>
      <tspan> retries</tspan>
    </text>

    
    <rect x="30" y="318" width="680" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 336)">
      <rect x="2" y="4" width="24" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <polyline points="8,12 12,16 8,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="20" x2="22" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="95" y="346" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">CI jobs use <tspan font-family="monospace" font-weight="bold">-lock-timeout</tspan></tspan>
      <tspan x="95" dy="28">and never <tspan font-family="monospace" font-weight="bold">-lock=false</tspan></tspan>
    </text>

    
    <rect x="30" y="392" width="680" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 407)">
      <rect x="2" y="6" width="24" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="6" x2="8" y2="22" stroke="#207448" stroke-width="3" stroke-dasharray="3 3" />
    </g>
    <text x="95" y="430" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">force-unlock</tspan>
      <tspan> is a human action with a ticket</tspan>
    </text>
  </g>

  

  
  <g transform="translate(40, 695)">
    
    <rect width="740" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 20)">
      <path d="M 20 4 L 36 10 L 36 22 C 36 32 20 38 20 38 C 20 38 4 32 4 22 L 4 10 Z" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="85" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="85" dy="0">locks protect the state file,</tspan>
      <tspan x="85" dy="34">not the code</tspan>
    </text>

    
    <rect x="30" y="85" width="680" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 98)">
      <circle cx="8" cy="28" r="4" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="8" cy="8" r="4" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="24" cy="8" r="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="24" x2="8" y2="12" stroke="#207448" stroke-width="3" />
      <path d="M 8 20 C 16 20 24 16 24 12" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="95" y="112" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">engineers Anna and Bill on</tspan>
      <tspan x="95" dy="28">different branches</tspan>
    </text>

    
    <line x1="370" y1="151" x2="370" y2="171" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="171" width="680" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 184)">
      <path d="M 24 8 A 12 12 0 1 0 24 24" fill="none" stroke="#207448" stroke-width="3" />
      <polyline points="20,4 26,8 20,12" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="95" y="198" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">Bill's plan would quietly undo</tspan>
      <tspan x="95" dy="28">Anna's change</tspan>
    </text>

    
    <line x1="370" y1="237" x2="370" y2="257" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="257" width="680" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 270)">
      <circle cx="15" cy="15" r="12" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="6" x2="24" y2="24" stroke="#207448" stroke-width="3" />
    </g>
    <text x="95" y="293" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no lock stops that</text>

    
    <line x1="370" y1="313" x2="370" y2="333" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="30" y="333" width="680" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <g transform="translate(48, 351)">
      <circle cx="18" cy="18" r="16" fill="#207448" />
      <polyline points="10,18 16,24 26,12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="95" y="378" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">rule 'apply only from main'</text>
  </g>

  
  <g transform="translate(820, 695)">
    
    <rect width="740" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 20)">
      <rect x="4" y="4" width="30" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="12" y1="14" x2="26" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="22" x2="26" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="30" x2="20" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="85" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Backend checklist</text>

    
    <rect x="30" y="70" width="680" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 88)">
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#207448" />
      <polyline points="6,14 12,20 22,8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="95" y="100" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">S3 backend locking is opt-in through</tspan>
      <tspan x="95" dy="28"><tspan font-family="monospace" font-weight="bold">use_lockfile</tspan> (default false)</tspan>
    </text>

    
    <rect x="30" y="152" width="680" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 164)">
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#207448" />
      <polyline points="6,14 12,20 22,8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="95" y="186" font-family="sans-serif" font-size="24" fill="#303a36">DynamoDB locking is deprecated</text>

    
    <rect x="30" y="212" width="680" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 246)">
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#207448" />
      <polyline points="6,14 12,20 22,8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="95" y="242" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">Nebius page uses the <tspan font-family="monospace" font-weight="bold">s3</tspan> backend with</tspan>
      <tspan x="95" dy="28">a Nebius endpoint, <tspan font-family="monospace" font-weight="bold">use_lockfile true</tspan></tspan>
      <tspan x="95" dy="28">and skips the AWS-specific checks</tspan>
    </text>

    
    <rect x="30" y="326" width="680" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(48, 360)">
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#207448" />
      <polyline points="6,14 12,20 22,8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="95" y="356" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">turn on bucket versioning because the</tspan>
      <tspan x="95" dy="28">lock protects the write and only</tspan>
      <tspan x="95" dy="28">versioning protects earlier copies</tspan>
    </text>
  </g>
</svg>