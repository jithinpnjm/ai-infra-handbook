<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>IPv4 and IPv6 headers side by side: what moved, what went away</title>
  <desc>Comparison of IPv4 and IPv6 header fields showing what moved, what went away, and how hardware parsing was simplified.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">IPv4 and IPv6 headers side by side: what moved, what went away</text>

  
  <rect x="40" y="75" width="560" height="980" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="52" y="87" width="536" height="66" rx="10" fill="#207448"/>
  
  <g transform="translate(64, 92)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="40" rx="6"/>
    <line x1="4" y1="20" x2="52" y2="20"/>
    <line x1="20" y1="8" x2="20" y2="20"/>
    <circle cx="12" cy="14" r="2" fill="#ffffff"/>
    <circle cx="28" cy="34" r="5"/>
    <line x1="14" y1="34" x2="23" y2="34"/>
    <line x1="33" y1="34" x2="42" y2="34"/>
  </g>
  <text x="136" y="130" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">IPv4 header, 20 bytes minimum</text>

  
  <rect x="1000" y="75" width="560" height="980" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="1012" y="87" width="536" height="66" rx="10" fill="#207448"/>
  
  <g transform="translate(1024, 92)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="40" rx="6"/>
    <line x1="4" y1="20" x2="52" y2="20"/>
    <path d="M 12 36 L 22 26 L 32 36 L 42 26"/>
    <circle cx="12" cy="14" r="2" fill="#ffffff"/>
    <circle cx="20" cy="14" r="2" fill="#ffffff"/>
  </g>
  <text x="1096" y="130" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">IPv6 header, 40 bytes fixed</text>

  
  
  <g transform="translate(52, 163)">
    <rect width="536" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="4" width="28" height="28" rx="4"/>
      <line x1="10" y1="0" x2="10" y2="4"/><line x1="18" y1="0" x2="18" y2="4"/><line x1="26" y1="0" x2="26" y2="4"/>
      <line x1="10" y1="32" x2="10" y2="36"/><line x1="18" y1="32" x2="18" y2="36"/><line x1="26" y1="32" x2="26" y2="36"/>
    </g>
    <text x="64" y="35" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Version 4</text>
  </g>

  
  <g transform="translate(1012, 163)">
    <rect width="536" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="4" width="28" height="28" rx="4"/>
      <line x1="10" y1="0" x2="10" y2="4"/><line x1="18" y1="0" x2="18" y2="4"/><line x1="26" y1="0" x2="26" y2="4"/>
      <line x1="10" y1="32" x2="10" y2="36"/><line x1="18" y1="32" x2="18" y2="36"/><line x1="26" y1="32" x2="26" y2="36"/>
    </g>
    <text x="64" y="35" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Version 4 bits</text>
  </g>

  
  
  <g transform="translate(52, 223)">
    <rect width="536" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 9)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="4" y1="10" x2="32" y2="10"/><circle cx="12" cy="10" r="4" fill="#ffffff"/>
      <line x1="4" y1="26" x2="32" y2="26"/><circle cx="24" cy="26" r="4" fill="#ffffff"/>
    </g>
    <text x="64" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DSCP (6 bits) and ECN (2 bits)</text>
  </g>

  
  <line x1="592" y1="252" x2="1006" y2="252" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="798" y="242" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">DSCP+ECN to Traffic Class</text>

  
  <g transform="translate(1012, 223)">
    <rect width="536" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 9)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="4" y1="10" x2="32" y2="10"/><circle cx="16" cy="10" r="4" fill="#ffffff"/>
      <line x1="4" y1="26" x2="32" y2="26"/><circle cx="28" cy="26" r="4" fill="#ffffff"/>
    </g>
    <text x="64" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Traffic Class 8 bits = DSCP 6 + ECN 2</text>
  </g>

  
  
  <g transform="translate(52, 289)">
    <rect width="536" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="28" height="24" rx="3"/>
      <line x1="12" y1="6" x2="12" y2="14"/><line x1="20" y1="6" x2="20" y2="14"/>
    </g>
    <text x="64" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Total Length up to 65,535</text>
  </g>

  
  <g transform="translate(1012, 289)">
    <rect width="536" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="28" height="24" rx="3"/>
      <line x1="12" y1="6" x2="12" y2="14"/><line x1="20" y1="6" x2="20" y2="14"/>
    </g>
    <text x="64" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Payload Length 16</text>
  </g>

  
  
  <g transform="translate(52, 351)">
    <rect width="536" height="84" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 18)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="30" height="32" rx="4"/>
      <line x1="10" y1="16" x2="26" y2="16"/>
      <line x1="10" y1="24" x2="22" y2="24"/>
    </g>
    <text x="64" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="64" dy="0">IHL: header length in 32-bit words,</tspan>
      <tspan x="64" dy="30">5 means 20 bytes</tspan>
    </text>
  </g>

  
  <g transform="translate(1012, 351)">
    <rect width="536" height="84" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 18)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="8" cy="24" r="4"/>
      <path d="M 12 24 C 20 12, 24 12, 32 12"/>
      <path d="M 12 24 C 20 36, 24 36, 32 36"/>
      <circle cx="32" cy="12" r="3" fill="#207448"/>
      <circle cx="32" cy="36" r="3" fill="#207448"/>
    </g>
    <text x="64" y="32" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">Flow Label 20 bits:</tspan>
      <tspan font-weight="normal"> helps routers keep a flow on</tspan>
      <tspan x="64" dy="30" font-weight="normal">one path when ECMP spreads traffic</tspan>
    </text>
  </g>

  
  
  <g transform="translate(52, 443)">
    <rect width="536" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 24)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="18"/>
      <polyline points="20,8 20,20 28,24"/>
    </g>
    <text x="64" y="32" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">TTL:</tspan>
      <tspan font-weight="normal"> drops by one per router, at 0 the router</tspan>
      <tspan x="64" dy="30" font-weight="normal">drops the packet and sends</tspan>
      <tspan x="64" dy="30" font-weight="bold">ICMP Time Exceeded</tspan>
    </text>
  </g>

  
  <line x1="592" y1="491" x2="1006" y2="491" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="798" y="481" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">TTL to Hop Limit</text>

  
  <g transform="translate(1012, 443)">
    <rect width="536" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 24)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="18"/>
      <polyline points="20,8 20,20 28,24"/>
    </g>
    <text x="64" y="46" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">Hop Limit 8:</tspan>
      <tspan x="64" dy="30" font-weight="normal">plays the role of the TTL</tspan>
    </text>
  </g>

  
  
  <g transform="translate(52, 547)">
    <rect width="536" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 22)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="10" width="28" height="24" rx="4"/>
      <circle cx="12" cy="22" r="3" fill="#207448"/>
      <circle cx="24" cy="22" r="3" fill="#207448"/>
      <line x1="18" y1="2" x2="18" y2="10"/>
    </g>
    <text x="64" y="34" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">Protocol:</tspan>
      <tspan font-weight="normal"> 6 TCP, 17 UDP, 1 ICMP,</tspan>
      <tspan x="64" dy="32" font-weight="normal">47 GRE, 50 ESP, 89 OSPF</tspan>
    </text>
  </g>

  
  <line x1="592" y1="593" x2="1006" y2="593" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="798" y="583" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Protocol to Next Header</text>

  
  <g transform="translate(1012, 547)">
    <rect width="536" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 22)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 8 16 C 8 8, 18 8, 18 16 L 18 24 C 18 32, 8 32, 8 24 Z"/>
      <path d="M 16 20 C 16 12, 26 12, 26 20 L 26 28 C 26 36, 16 36, 16 28 Z"/>
    </g>
    <text x="64" y="32" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">Next Header 8:</tspan>
      <tspan font-weight="normal"> extension headers chained</tspan>
      <tspan x="64" dy="30" font-weight="normal">(hop-by-hop, routing, fragment,</tspan>
      <tspan x="64" dy="30" font-weight="normal">destination options, AH, ESP)</tspan>
    </text>
  </g>

  
  
  <g transform="translate(52, 647)">
    <rect width="536" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 32)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="4" width="14" height="34" rx="2"/>
      <rect x="22" y="4" width="14" height="34" rx="2"/>
      <line x1="18" y1="12" x2="22" y2="12" stroke-dasharray="2,2"/>
      <line x1="18" y1="28" x2="22" y2="28" stroke-dasharray="2,2"/>
    </g>
    <text x="64" y="30" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">Identification, Flags (DF, MF),</tspan>
      <tspan x="64" dy="28" font-weight="bold">Fragment Offset:</tspan>
      <tspan font-weight="normal"> fragmentation lives in</tspan>
      <tspan x="64" dy="28" font-weight="normal">the base header; routers may fragment</tspan>
      <tspan x="64" dy="28" font-weight="normal">unless DF is set</tspan>
    </text>
  </g>

  
  <g transform="translate(1012, 647)">
    <rect width="536" height="114" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2.5"/>
    
    <g transform="translate(12, 32)" stroke="#db8129" stroke-width="3.5" fill="none">
      <circle cx="20" cy="20" r="18"/>
      <line x1="7" y1="7" x2="33" y2="33"/>
    </g>
    <text x="64" y="30" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold" fill="#db8129">no fragmentation fields in the base</tspan>
      <tspan x="64" dy="28" font-weight="bold" fill="#db8129">header:</tspan>
      <tspan font-weight="normal"> only the source host may fragment,</tspan>
      <tspan x="64" dy="28" font-weight="normal">through an extension header; routers</tspan>
      <tspan x="64" dy="28" font-weight="normal">never do</tspan>
    </text>
  </g>

  
  
  <g transform="translate(52, 769)">
    <rect width="536" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 16)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 20 4 L 34 10 L 34 22 C 34 32, 20 38, 20 38 C 20 38, 6 32, 6 22 L 6 10 Z"/>
      <polyline points="13,20 18,25 27,15"/>
    </g>
    <text x="64" y="32" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold">Header checksum:</tspan>
      <tspan font-weight="normal"> recomputed at every</tspan>
      <tspan x="64" dy="30" font-weight="normal">hop because the TTL changes</tspan>
    </text>
  </g>

  
  <g transform="translate(1012, 769)">
    <rect width="536" height="78" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2.5"/>
    
    <g transform="translate(12, 16)" stroke="#db8129" stroke-width="3.5" fill="none">
      <path d="M 20 4 L 34 10 L 34 22 C 34 32, 20 38, 20 38 C 20 38, 6 32, 6 22 L 6 10 Z"/>
      <line x1="8" y1="8" x2="32" y2="32"/>
    </g>
    <text x="64" y="32" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0" font-weight="bold" fill="#db8129">no header checksum</tspan>
      <tspan x="64" dy="30" font-weight="normal">(link and transport layers cover errors)</tspan>
    </text>
  </g>

  
  
  <g transform="translate(52, 855)">
    <rect width="536" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 9)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="10" cy="20" r="6"/>
      <circle cx="30" cy="20" r="6"/>
      <line x1="16" y1="20" x2="24" y2="20"/>
    </g>
    <text x="64" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">source and destination 32-bit addresses</text>
  </g>

  
  <g transform="translate(52, 921)">
    <rect width="536" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(12, 7)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="7"/>
      <line x1="20" y1="4" x2="20" y2="9"/><line x1="20" y1="31" x2="20" y2="36"/>
      <line x1="4" y1="20" x2="9" y2="20"/><line x1="31" y1="20" x2="36" y2="20"/>
    </g>
    <text x="64" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">options (rare)</text>
  </g>

  
  <g transform="translate(1012, 855)">
    <rect width="536" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(14, 34)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="10" cy="24" r="8"/>
      <circle cx="34" cy="24" r="8"/>
      <line x1="18" y1="24" x2="26" y2="24"/>
      <path d="M 10 16 L 10 6 L 34 6 L 34 16"/>
    </g>
    <text x="64" y="48" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="64" dy="0">source and destination</tspan>
      <tspan x="64" dy="36">128-bit addresses</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1080)">
    <rect width="1520" height="76" rx="12" fill="#207448"/>
    
    <g transform="translate(24, 10)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6"/>
      <line x1="18" y1="2" x2="18" y2="10"/><line x1="28" y1="2" x2="28" y2="10"/><line x1="38" y1="2" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="54"/><line x1="28" y1="46" x2="28" y2="54"/><line x1="38" y1="46" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="10" y2="18"/><line x1="2" y1="28" x2="10" y2="28"/><line x1="2" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="54" y2="18"/><line x1="46" y1="28" x2="54" y2="28"/><line x1="46" y1="38" x2="54" y2="38"/>
    </g>
    <text x="810" y="47" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A fixed header keeps hardware parsing simple, and extension headers keep the design flexible</text>
  </g>
</svg>