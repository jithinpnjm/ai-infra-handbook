<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Draining a backend during a deploy: the order of events and the timers that must agree</title>
  <desc>Visual infographic detailing backend drain sequence, Kubernetes lifecycle order, timer coordination, and proxy worker configurations.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1500" fill="#f5f8f5" />

  
  <g id="header">
    <text x="60" y="62" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">Draining a backend during a deploy:</text>
    <text x="60" y="112" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">the order of events and the timers that must agree</text>
  </g>

  
  
  
  <g id="top-timelines">
    <rect x="50" y="145" width="1500" height="475" rx="14" fill="#ffffff" stroke="#cbd8cb" stroke-width="2" />
    <text x="80" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Two timelines for backend 2</text>

    
    <g id="timeline-without-drain">
      <rect x="75" y="215" width="1450" height="155" rx="10" fill="#fcf6f0" stroke="#f0cfb3" stroke-width="1.5" />
      <rect x="95" y="235" width="220" height="48" rx="8" fill="#db8129" />
      <text x="205" y="268" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Without drain</text>

      
      <rect x="340" y="235" width="280" height="50" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <text x="480" y="269" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">the generation runs</text>

      <path d="M 620 260 L 668 260" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" />

      
      <rect x="680" y="235" width="470" height="50" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <text x="915" y="269" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">the deploy stops backend 2 at its midpoint</text>

      <path d="M 1150 260 L 1198 260" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" />

      
      <rect x="1210" y="225" width="295" height="130" rx="8" fill="#db8129" />
      <text x="1357" y="265" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">the user sees</text>
      <text x="1357" y="297" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">an error after</text>
      <text x="1357" y="329" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">waiting minutes</text>
    </g>

    
    <g id="timeline-with-drain">
      <rect x="75" y="390" width="1450" height="215" rx="10" fill="#e8f1ea" stroke="#c0d7c3" stroke-width="1.5" />
      <rect x="95" y="408" width="180" height="46" rx="8" fill="#207448" />
      <text x="185" y="440" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">With drain</text>

      
      <rect x="295" y="406" width="375" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="482" y="441" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">balancer marks backend 2 draining</text>

      <path d="M 670 432 L 698 432" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none" />

      <rect x="710" y="406" width="320" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="870" y="441" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">new requests go to the others</text>

      <path d="M 1030 432 L 1058 432" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none" />

      <rect x="1070" y="406" width="435" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1287" y="441" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">the generation keeps running on backend 2</text>

      
      <rect x="95" y="525" width="450" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="320" y="561" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">finishes, or the drain deadline arrives</text>

      <path d="M 545 553 L 575 553" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none" />

      <rect x="585" y="525" width="220" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="695" y="561" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">backend 2 stops</text>

      <path d="M 805 553 L 835 553" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none" />

      <rect x="845" y="522" width="660" height="62" rx="8" fill="#207448" />
      <text x="1175" y="561" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">no user loses an answer</text>
    </g>
  </g>

  
  
  

  
  <g id="k8s-order">
    <rect x="50" y="640" width="940" height="425" rx="14" fill="#ffffff" stroke="#cbd8cb" stroke-width="2" />
    
    
    <g transform="translate(80, 665)">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <circle cx="24" cy="24" r="10" stroke="#207448" stroke-width="3" fill="none" />
      <path d="M 24 6 L 24 12 M 24 36 L 24 42 M 6 24 L 12 24 M 36 24 L 42 24" stroke="#207448" stroke-width="3" />
    </g>
    <text x="145" y="700" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Kubernetes order</text>

    
    <g transform="translate(80, 735)">
      <rect x="0" y="0" width="880" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="30" r="20" fill="#207448" />
      <text x="36" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="75" y="39" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">readiness turns false</text>
    </g>

    
    <g transform="translate(80, 810)">
      <rect x="0" y="0" width="880" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="30" r="20" fill="#207448" />
      <text x="36" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="75" y="39" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">stop new requests</text>
    </g>

    
    <g transform="translate(80, 885)">
      <rect x="0" y="0" width="880" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="35" r="20" fill="#207448" />
      <text x="36" y="43" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="75" y="44" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">wait for in-flight streams up to the grace period</text>
    </g>

    
    <g transform="translate(80, 970)">
      <rect x="0" y="0" width="880" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="30" r="20" fill="#207448" />
      <text x="36" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="75" y="39" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">terminate</text>
    </g>
  </g>

  
  <g id="timers-strip">
    <rect x="50" y="1085" width="940" height="300" rx="14" fill="#ffffff" stroke="#cbd8cb" stroke-width="2" />
    
    
    <g transform="translate(80, 1105)">
      <circle cx="24" cy="24" r="20" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <polyline points="24,12 24,24 32,24" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>
    <text x="145" y="1140" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timers that must align</text>

    
    <g transform="translate(80, 1165)">
      <rect x="0" y="0" width="425" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="212" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">terminationGracePeriodSeconds</text>
    </g>

    
    <g transform="translate(535, 1165)">
      <rect x="0" y="0" width="425" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="212" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">preStop hook</text>
    </g>

    
    <g transform="translate(80, 1275)">
      <rect x="0" y="0" width="425" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="212" y="44" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">deregistration delay of the</text>
      <text x="212" y="74" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">load balancer</text>
    </g>

    
    <g transform="translate(535, 1275)">
      <rect x="0" y="0" width="425" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="212" y="55" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">shutdown timeouts of the proxy</text>
    </g>
  </g>

  
  
  
  <g id="right-panel">
    <rect x="1015" y="640" width="535" height="745" rx="14" fill="#ffffff" stroke="#cbd8cb" stroke-width="2" />
    
    
    <g transform="translate(1045, 665)">
      <rect x="0" y="0" width="48" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <line x1="0" y1="14" x2="48" y2="14" stroke="#207448" stroke-width="2" />
      <circle cx="10" cy="7" r="2.5" fill="#207448" />
      <circle cx="18" cy="7" r="2.5" fill="#207448" />
    </g>
    <text x="1110" y="698" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Proxies and old workers</text>

    
    <g transform="translate(1035, 730)">
      <rect x="0" y="0" width="495" height="230" rx="10" fill="#fcf6f0" stroke="#f0cfb3" stroke-width="1.5" />
      <text x="25" y="45" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">nginx and HAProxy keep old</tspan>
        <tspan x="25" dy="38">workers alive until their connections</tspan>
        <tspan x="25" dy="38">end; for long streams a worker can</tspan>
        <tspan x="25" dy="38">live for hours; worker_shutdown_timeout</tspan>
        <tspan x="25" dy="38">caps them but cuts streams short</tspan>
      </text>
    </g>

    
    <g transform="translate(1035, 980)">
      <rect x="0" y="0" width="495" height="385" rx="10" fill="#e8f1ea" stroke="#c0d7c3" stroke-width="1.5" />
      <text x="25" y="45" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0" font-weight="bold">Dynamic configuration avoids it:</tspan>
        <tspan x="25" dy="38">Envoy xDS, the HAProxy runtime</tspan>
        <tspan x="25" dy="38">API (echo set server be_infer/triton1</tspan>
        <tspan x="25" dy="38" font-family="monospace" font-size="24" fill="#207448">state drain | socat stdio</tspan>
        <tspan x="25" dy="38" font-family="monospace" font-size="24" fill="#207448">/var/run/haproxy.sock),</tspan>
        <tspan x="25" dy="38">nginx Plus or resolver variables</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g id="bottom-bar">
    <rect x="50" y="1410" width="1500" height="65" rx="10" fill="#207448" />
    <text x="800" y="1452" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Set the drain deadline with your longest stream in mind</text>
  </g>
</svg>