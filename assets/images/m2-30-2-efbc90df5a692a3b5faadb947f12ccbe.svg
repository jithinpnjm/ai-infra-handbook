<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Connectivity: "A cannot reach B"</title>
  <desc>Troubleshooting flowchart for diagnosing connectivity failure between client A and service B.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Connectivity: "A cannot reach B"</text>

  

  
  <path d="M 800 165 L 800 210" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 570 257 L 480 257" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="495" y="224" width="70" height="30" rx="6" fill="#f5f8f5" />
  <text x="530" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">only A</text>

  
  <path d="M 800 305 L 800 365" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="812" y="320" width="46" height="30" rx="6" fill="#f5f8f5" />
  <text x="835" y="342" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">all</text>

  
  <path d="M 1040 417 L 1120 417" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1055" y="386" width="50" height="30" rx="6" fill="#f5f8f5" />
  <text x="1080" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>

  
  <path d="M 800 470 L 800 525" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="812" y="482" width="54" height="30" rx="6" fill="#f5f8f5" />
  <text x="839" y="504" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <path d="M 610 575 L 480 575" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="486" y="542" width="158" height="30" rx="6" fill="#f5f8f5" />
  <text x="565" y="564" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">refused (RST)</text>

  
  <path d="M 990 575 L 1110 575" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1006" y="542" width="88" height="30" rx="6" fill="#f5f8f5" />
  <text x="1050" y="564" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">works</text>

  
  <path d="M 800 625 L 800 690" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
  <rect x="814" y="642" width="102" height="32" rx="6" fill="#f5f8f5" />
  <text x="865" y="666" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">timeout</text>

  
  <path d="M 800 795 L 800 840" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 620 880 L 270 880 L 270 970" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="420" y="852" width="50" height="30" rx="6" fill="#f5f8f5" />
  <text x="445" y="874" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>

  
  <path d="M 800 920 L 800 970" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="812" y="930" width="265" height="30" rx="6" fill="#f5f8f5" />
  <text x="816" y="952" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes, no SYN-ACK back</text>

  
  <path d="M 980 880 L 1330 880 L 1330 970" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1010" y="850" width="310" height="30" rx="6" fill="#f5f8f5" />
  <text x="1165" y="872" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">SYN-ACK leaves B, not seen by A</text>


  

  
  <g filter="url(#shadow)">
    <rect x="480" y="85" width="640" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(505, 97)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="16" x2="28" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="38" r="2.5" fill="#207448" />
    </g>
    <text x="580" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A cannot reach B (service X)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="570" y="210" width="460" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(590, 230)">
      <circle cx="16" cy="18" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 6 36 C 6 28 26 28 26 36" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="38" cy="18" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 28 36 C 28 28 48 28 48 36" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="660" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Same on all clients,</text>
    <text x="660" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">or only A?</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="40" y="175" width="440" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(60, 195)">
      <rect x="4" y="6" width="46" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="20" y1="38" x2="14" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="34" y1="38" x2="40" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="12" y1="48" x2="42" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="126" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A's local config:</text>
    <text x="60" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">IP, mask, gateway, DNS,</text>
    <text x="60" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">proxy, firewall, VPN, route</text>
    <text x="60" y="328" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">(ip route get)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="560" y="365" width="480" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(580, 390)">
      <rect x="4" y="6" width="46" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="14" cy="15" r="2.5" fill="#207448" />
      <rect x="4" y="28" width="46" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="14" cy="37" r="2.5" fill="#207448" />
    </g>
    <text x="645" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">B up and listening?</text>
    <text x="645" y="445" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">ss -tlnp on B; local curl</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1120" y="345" width="440" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1142, 365)">
      <circle cx="27" cy="27" r="16" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="7 5" />
      <line x1="20" y1="20" x2="34" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="34" y1="20" x2="20" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="1208" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service/host problem:</text>
    <text x="1145" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">process, bind address,</text>
    <text x="1145" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">resources, logs</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="610" y="525" width="380" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(630, 547)">
      <circle cx="16" cy="38" r="5" fill="#207448" />
      <path d="M 28 38 A 14 14 0 0 0 16 24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 40 38 A 26 26 0 0 0 16 12" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <text x="695" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">ping/nc from A</text>
    <text x="695" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">to B:port</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="40" y="515" width="440" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(60, 535)">
      <path d="M 10 10 L 28 4 L 46 10 C 46 28 28 46 28 48 C 28 46 10 28 10 10 Z" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="20" y1="26" x2="36" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="125" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Firewall reject or</text>
    <text x="125" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">wrong port/address</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1110" y="505" width="450" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1130, 525)">
      <rect x="6" y="8" width="42" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="6" y1="18" x2="48" y2="18" stroke="#207448" stroke-width="3" />
      <circle cx="13" cy="13" r="2" fill="#207448" />
      <circle cx="20" cy="13" r="2" fill="#207448" />
    </g>
    <text x="1195" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Layer 7:</text>
    <text x="1130" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DNS, TLS, auth, app config,</text>
    <text x="1130" y="624" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">proxy, MTU for large payloads</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="350" y="690" width="900" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(375, 715)">
      <line x1="6" y1="28" x2="48" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="6" y1="16" x2="6" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="48" y1="16" x2="48" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="27" cy="28" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    </g>
    <text x="445" y="734" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Half-split the path:</text>
    <text x="445" y="772" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">traceroute/mtr; capture at midpoint and both ends</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="620" y="840" width="360" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(640, 852)">
      <rect x="4" y="10" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 6 12 L 27 28 L 48 12" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="705" y="892" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">SYN reaches B?</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="40" y="970" width="460" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(65, 995)">
      <rect x="6" y="8" width="42" height="38" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="6" y1="20" x2="48" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="33" x2="48" y2="33" stroke="#207448" stroke-width="3" />
      <line x1="20" y1="8" x2="20" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="34" y1="20" x2="34" y2="33" stroke="#207448" stroke-width="3" />
      <line x1="20" y1="33" x2="20" y2="46" stroke="#207448" stroke-width="3" />
    </g>
    <text x="130" y="1022" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Drop between:</text>
    <text x="65" y="1068" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">ACL, security group, routing,</text>
    <text x="65" y="1106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">VLAN, ARP, MTU of the SYN</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="540" y="970" width="520" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(565, 995)">
      <rect x="6" y="8" width="42" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="6" y="28" width="42" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="20" y1="8" x2="20" y2="24" stroke="#207448" stroke-width="3" />
      <line x1="34" y1="8" x2="34" y2="24" stroke="#207448" stroke-width="3" />
    </g>
    <text x="630" y="1022" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">B-side firewall/</text>
    <text x="565" y="1068" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">listen queue/conntrack/</text>
    <text x="565" y="1106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rp_filter</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1100" y="970" width="460" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1125, 995)">
      <path d="M 10 14 L 38 14 C 44 14 46 22 46 27 C 46 32 44 40 38 40 L 14 40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <polyline points="22,32 12,40 22,48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="1190" y="1022" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Return path:</text>
    <text x="1125" y="1068" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">asymmetric route, NAT,</text>
    <text x="1125" y="1106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">stateful FW, policy routing</text>
  </g>

</svg>