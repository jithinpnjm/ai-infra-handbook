<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From pod ready to every node routing to it</title>
  <desc>Visual infographic explaining Kubernetes endpoint propagation from pod readiness to node routing rules and graceful termination drain.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">From pod ready to every node routing to it</text>
  <rect x="510" y="75" width="580" height="86" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="800" y="110" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">typically 1 to 5 seconds before </tspan>
    <tspan x="800" dy="30">all nodes route to the new pod</tspan>
  </text>
  <path d="M 350 175 L 350 161 L 510 161" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1090 161 L 1255 161 L 1255 175" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="40" y="175" width="270" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="76" cy="208" r="24" fill="#207448" />
  <text x="76" y="217" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">1</text>
  <g transform="translate(225, 187)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="46" height="42" rx="8" />
    <polyline points="15,28 24,37 39,20" />
  </g>
  <text x="56" y="285" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">pod passes its </tspan>
    <tspan x="56" dy="34">readiness check </tspan>
    <tspan x="56" dy="34">(Ready true; </tspan>
    <tspan x="56" dy="34">readiness gates </tspan>
    <tspan x="56" dy="34">satisfied)</tspan>
  </text>
  <line x1="310" y1="345" x2="350" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="350" y="175" width="285" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="386" cy="208" r="24" fill="#207448" />
  <text x="386" y="217" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">2</text>
  <g transform="translate(555, 187)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="27" cy="27" r="14" />
    <line x1="27" y1="5" x2="27" y2="13" /><line x1="27" y1="41" x2="27" y2="49" />
    <line x1="5" y1="27" x2="13" y2="27" /><line x1="41" y1="27" x2="49" y2="27" />
  </g>
  <text x="366" y="280" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="366" dy="0">EndpointSlice </tspan>
    <tspan x="366" dy="32">controller adds </tspan>
    <tspan x="366" dy="32">the pod to a </tspan>
    <tspan x="366" dy="32">slice: conditions </tspan>
    <tspan x="366" dy="32">ready, serving, </tspan>
    <tspan x="366" dy="32">terminating</tspan>
  </text>
  <line x1="635" y1="345" x2="675" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="675" y="175" width="245" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="711" cy="208" r="24" fill="#207448" />
  <text x="711" y="217" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">3</text>
  <g transform="translate(840, 187)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="42" height="34" rx="6" />
    <line x1="6" y1="26" x2="48" y2="26" />
    <circle cx="16" cy="18" r="2" fill="#207448" />
    <circle cx="24" cy="18" r="2" fill="#207448" />
  </g>
  <text x="691" y="315" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="691" dy="0">API server </tspan>
    <tspan x="691" dy="36">publishes the </tspan>
    <tspan x="691" dy="36">change</tspan>
  </text>
  <line x1="920" y1="345" x2="960" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="960" y="175" width="295" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="996" cy="208" r="24" fill="#207448" />
  <text x="996" y="217" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">4</text>
  <g transform="translate(1175, 187)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="42" height="38" rx="6" />
    <line x1="14" y1="20" x2="38" y2="20" />
    <line x1="14" y1="28" x2="38" y2="28" />
    <line x1="14" y1="36" x2="28" y2="36" />
  </g>
  <text x="976" y="280" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="976" dy="0">each node </tspan>
    <tspan x="976" dy="32">kube-proxy sees </tspan>
    <tspan x="976" dy="32">it and programs </tspan>
    <tspan x="976" dy="32">rules on its next </tspan>
    <tspan x="976" dy="32">sync (batch </tspan>
    <tspan x="976" dy="32">interval)</tspan>
  </text>
  <line x1="1255" y1="345" x2="1295" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1295" y="175" width="265" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="1331" cy="208" r="24" fill="#207448" />
  <text x="1331" y="217" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">5</text>
  <g transform="translate(1480, 187)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="27" cy="27" r="20" />
    <polyline points="20,27 27,34 34,20" />
  </g>
  <text x="1311" y="325" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1311" dy="0">traffic reaches </tspan>
    <tspan x="1311" dy="36">the pod</tspan>
  </text>
  <rect x="40" y="565" width="240" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(132, 585)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="40" rx="8" />
    <line x1="16" y1="28" x2="40" y2="28" />
  </g>
  <text x="160" y="700" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="160" dy="0">pod </tspan>
    <tspan x="160" dy="36">terminating</tspan>
  </text>
  <line x1="280" y1="715" x2="320" y2="715" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="320" y="565" width="350" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(467, 585)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="44" height="36" rx="6" />
    <line x1="6" y1="28" x2="50" y2="28" />
    <circle cx="18" cy="20" r="3" fill="#207448" />
    <line x1="30" y1="36" x2="42" y2="36" />
  </g>
  <text x="495" y="700" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="495" dy="0">slice shows ready </tspan>
    <tspan x="495" dy="36">false, serving true</tspan>
  </text>
  <line x1="670" y1="715" x2="710" y2="715" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="710" y="565" width="480" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(922, 585)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 12 L 46 12 L 32 30 L 32 44 L 24 40 L 24 30 Z" />
  </g>
  <text x="950" y="690" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="950" dy="0">proxies keep serving it only </tspan>
    <tspan x="950" dy="34">if no ready endpoints remain </tspan>
    <tspan x="950" dy="34">(graceful drain)</tspan>
  </text>
  <line x1="1190" y1="715" x2="1230" y2="715" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1230" y="565" width="330" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(1367, 585)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <polyline points="28,16 28,28 38,28" />
    <line x1="8" y1="8" x2="14" y2="14" />
  </g>
  <text x="1395" y="700" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1395" dy="0">removal races </tspan>
    <tspan x="1395" dy="36">SIGTERM</tspan>
  </text>
  <rect x="40" y="915" width="1040" height="245" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(68, 955)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 10 16 v 14 c 0 14 18 20 18 20 s 18 -6 18 -20 V 16 Z" />
    <line x1="20" y1="26" x2="36" y2="26" />
  </g>
  <text x="145" y="968" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">a Service with no ready endpoints: </tspan>
    <tspan x="145" dy="34">iptables REJECT sends ICMP port unreachable, </tspan>
    <tspan x="145" dy="34">client sees connection refused immediately; </tspan>
    <tspan x="145" dy="34">empty </tspan>
    <tspan font-family="monospace">kubectl get endpointslices</tspan>
    <tspan> </tspan>
    <tspan x="145" dy="34">means selector mismatch or unready pods</tspan>
  </text>
  <rect x="1120" y="915" width="440" height="245" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(1312, 938)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <path d="M 28 16 v 12 l 8 8" />
    <circle cx="28" cy="28" r="6" fill="#207448" />
  </g>
  <text x="1340" y="1042" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1340" dy="0">preStop sleep plus </tspan>
    <tspan x="1340" dy="34">graceful shutdown (5.7)</tspan>
  </text>
</svg>