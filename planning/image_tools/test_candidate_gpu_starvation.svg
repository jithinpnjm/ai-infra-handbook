<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>GPUs sit idle in the timeline: seven questions, each answered by a measurement</title>
  <desc>A GPU timeline showing an idle gap above seven starvation questions with short checks and causes, alongside outcome metrics.</desc>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Main Title (48px bold) -->
  <text x="800" y="75" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif" text-anchor="middle">
    <tspan x="800" dy="0">GPUs sit idle in the timeline:</tspan>
    <tspan x="800" dy="54">seven questions, each answered by a measurement</tspan>
  </text>

  <!-- Top Panel: GPU Timeline -->
  <rect x="40" y="150" width="1520" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Busy GPU compute blocks -->
  <rect x="60" y="168" width="100" height="58" rx="6" fill="#207448" />
  <rect x="175" y="168" width="110" height="58" rx="6" fill="#207448" />
  <!-- Idle gap bubble -->
  <rect x="305" y="168" width="990" height="58" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="8,6" />
  <text x="800" y="205" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif" text-anchor="middle">idle gap (bubble): time between kernels or collectives</text>
  <!-- Resumed compute blocks -->
  <rect x="1315" y="168" width="105" height="58" rx="6" fill="#207448" />
  <rect x="1435" y="168" width="105" height="58" rx="6" fill="#207448" />

  <!-- Seven Question Rows -->
  <!-- Row 1 -->
  <rect x="40" y="260" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="74" cy="317" r="24" fill="#207448" />
  <text x="74" y="325" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">1</text>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="136" cy="300" rx="18" ry="6" />
    <path d="M 118,300 v 22 c 0,4 8,6 18,6 c 10,0 18,-2 18,-6 v -22" />
    <path d="M 118,311 c 0,4 8,6 18,6 c 10,0 18,-2 18,-6" />
  </g>
  <text x="180" y="308" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="180" dy="0">Is the data loader the bottleneck? Empty queue, busy</tspan>
    <tspan x="180" dy="34">workers, a busy iostat, a slow network filesystem</tspan>
  </text>
  <!-- Row 2 -->
  <rect x="40" y="384" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="74" cy="441" r="24" fill="#207448" />
  <text x="74" y="449" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">2</text>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="120" y="425" width="32" height="32" rx="4" />
    <rect x="127" y="432" width="18" height="18" rx="2" />
    <line x1="126" y1="419" x2="126" y2="425" /><line x1="136" y1="419" x2="136" y2="425" /><line x1="146" y1="419" x2="146" y2="425" />
    <line x1="126" y1="457" x2="126" y2="463" /><line x1="136" y1="457" x2="136" y2="463" /><line x1="146" y1="457" x2="146" y2="463" />
    <line x1="114" y1="431" x2="120" y2="431" /><line x1="114" y1="441" x2="120" y2="441" /><line x1="114" y1="451" x2="120" y2="451" />
    <line x1="152" y1="431" x2="158" y2="431" /><line x1="152" y1="441" x2="158" y2="441" /><line x1="152" y1="451" x2="158" y2="451" />
  </g>
  <text x="180" y="432" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="180" dy="0">Is the CPU the limiter? Single-thread Python launch overhead,</tspan>
    <tspan x="180" dy="34">torch ops launching tiny kernels</tspan>
  </text>
  <text x="670" y="466" font-size="24" font-weight="bold" fill="#207448" font-family="sans-serif">fix: CUDA graphs or compile</text>
  <!-- Row 3 -->
  <rect x="40" y="508" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="74" cy="565" r="24" fill="#207448" />
  <text x="74" y="573" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">3</text>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="115" y="551" width="42" height="26" rx="3" />
    <path d="M 120,577 v 6 M 125,577 v 6 M 130,577 v 6 M 138,577 v 6 M 143,577 v 6 M 148,577 v 6" />
    <rect x="120" y="556" width="8" height="12" rx="1" /><rect x="132" y="556" width="8" height="12" rx="1" /><rect x="144" y="556" width="8" height="12" rx="1" />
  </g>
  <text x="180" y="556" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="180" dy="0">Is host memory pinned, is the PCIe link at x16, is</tspan>
    <tspan x="180" dy="34">the NUMA placement right?</tspan>
  </text>
  <!-- Row 4 -->
  <rect x="40" y="632" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="74" cy="689" r="24" fill="#207448" />
  <text x="74" y="697" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">4</text>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="124" cy="676" r="5" /><circle cx="148" cy="676" r="5" /><circle cx="136" cy="702" r="5" />
    <line x1="129" y1="676" x2="143" y2="676" /><line x1="126" y1="680" x2="134" y2="698" /><line x1="146" y1="680" x2="138" y2="698" />
  </g>
  <text x="180" y="680" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="180" dy="0">Is communication exposed, meaning not overlapped</tspan>
    <tspan x="180" dy="34">with compute?</tspan>
  </text>
  <!-- Row 5 -->
  <rect x="40" y="756" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
  <circle cx="74" cy="813" r="24" fill="#db8129" />
  <text x="74" y="821" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">5</text>
  <g stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="136" cy="813" r="19" />
    <polyline points="136,801 136,813 145,813" />
    <line x1="136" y1="794" x2="136" y2="797" /><line x1="155" y1="813" x2="152" y2="813" />
  </g>
  <text x="180" y="804" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="180" dy="0">Is a straggler rank late: thermal throttle, bad</tspan>
    <tspan x="180" dy="34">link, noisy neighbour?</tspan>
  </text>
  <!-- Row 6 -->
  <rect x="40" y="880" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="74" cy="937" r="24" fill="#207448" />
  <text x="74" y="945" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">6</text>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="118" y="919" width="36" height="36" rx="3" />
    <rect x="125" y="919" width="22" height="13" rx="1" />
    <rect x="125" y="938" width="22" height="17" rx="1" />
  </g>
  <text x="180" y="945" font-size="24" fill="#303a36" font-family="sans-serif">Is the checkpoint blocking the step?</text>
  <!-- Row 7 -->
  <rect x="40" y="1004" width="1040" height="114" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="74" cy="1061" r="24" fill="#207448" />
  <text x="74" y="1069" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">7</text>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="117" y="1042" width="38" height="38" rx="3" />
    <rect x="122" y="1047" width="11" height="11" rx="1" fill="#207448" fill-opacity="0.2" />
    <rect x="139" y="1047" width="11" height="11" rx="1" fill="#207448" fill-opacity="0.2" />
    <rect x="122" y="1064" width="11" height="11" rx="1" fill="#207448" fill-opacity="0.2" />
    <rect x="139" y="1064" width="11" height="11" rx="1" fill="#207448" fill-opacity="0.2" />
  </g>
  <text x="180" y="1052" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="180" dy="0">Is GPU-Util high while SM activity is low? Many</tspan>
    <tspan x="180" dy="34">small kernels</tspan>
  </text>

  <!-- Right Strip: Outcome metrics to read first -->
  <rect x="1110" y="260" width="450" height="858" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1134" y="308" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">
    <tspan x="1134" dy="0">Outcome metrics</tspan>
    <tspan x="1134" dy="36">to read first</tspan>
  </text>
  <text x="1134" y="398" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="1134" dy="0">throughput (tokens/s or</tspan>
    <tspan x="1134" dy="28">samples/s per GPU and</tspan>
    <tspan x="1134" dy="28">aggregate)</tspan>
  </text>
  <text x="1134" y="496" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="1134" dy="0">step time breakdown: data</tspan>
    <tspan x="1134" dy="28">wait, H2D, forward,</tspan>
    <tspan x="1134" dy="28">backward, exposed</tspan>
    <tspan x="1134" dy="28">communication, optimizer,</tspan>
    <tspan x="1134" dy="28">checkpoint</tspan>
  </text>
  <text x="1134" y="650" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="1134" dy="0">MFU</tspan>
  </text>
  <text x="1134" y="692" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="1134" dy="0">scaling efficiency =</tspan>
    <tspan x="1134" dy="28">throughput(N) / (N x</tspan>
    <tspan x="1134" dy="28">throughput(1))</tspan>
  </text>
  <text x="1134" y="790" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="1134" dy="0">goodput = GPU-hours of</tspan>
    <tspan x="1134" dy="28">useful work / GPU-hours</tspan>
    <tspan x="1134" dy="28">paid, excluding restarts,</tspan>
    <tspan x="1134" dy="28">failures, checkpoint</tspan>
    <tspan x="1134" dy="28">stalls, stragglers and</tspan>
    <tspan x="1134" dy="28">idle waiting</tspan>
  </text>
  <text x="1134" y="972" font-size="24" fill="#303a36" font-family="sans-serif">
    <tspan x="1134" dy="0">cost: USD per million</tspan>
    <tspan x="1134" dy="28">tokens or per training run</tspan>
  </text>

  <!-- Bottom Takeaway Bar -->
  <rect x="40" y="1128" width="1520" height="58" rx="8" fill="#207448" />
  <text x="800" y="1168" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif" text-anchor="middle">Answer each question with a measurement rather than an opinion</text>
</svg>