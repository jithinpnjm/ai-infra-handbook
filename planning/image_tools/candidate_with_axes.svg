<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Restarting eight replicas at once leaves a zero-capacity gap</title>
  <desc>Infographic illustrating how restarting eight model replicas simultaneously causes a zero-capacity outage gap due to shared storage bandwidth saturation, compared with rolling restarts and local weight staging.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Restarting eight replicas at once</tspan>
    <tspan x="800" dy="54">leaves a zero-capacity gap</tspan>
  </text>
  <g id="worked-numbers">
    <rect x="50" y="138" width="1500" height="88" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(75, 154)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="14" rx="3"/>
      <line x1="12" y1="13" x2="16" y2="13"/>
      <circle cx="44" cy="13" r="2" fill="#207448"/>
      <rect x="4" y="24" width="48" height="14" rx="3"/>
      <line x1="12" y1="31" x2="16" y2="31"/>
      <circle cx="44" cy="31" r="2" fill="#207448"/>
      <rect x="4" y="42" width="48" height="14" rx="3"/>
      <line x1="12" y1="49" x2="16" y2="49"/>
      <circle cx="44" cy="49" r="2" fill="#207448"/>
    </g>
    <text x="160" y="191" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">70 billion parameters x 2 bytes = 140 GB; shared source 14 GB per second</text>
  </g>
  <g id="timeline-a">
    <rect x="50" y="256" width="1500" height="360" rx="14" fill="#fef8f2" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(75, 276)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,4 52,48 4,48"/>
      <line x1="28" y1="18" x2="28" y2="32"/>
      <circle cx="28" cy="40" r="2" fill="#db8129"/>
    </g>
    <text x="160" y="300" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="160" dy="0">all eight restart together: 8 x 140 / 14 = 80 s each under the equal-share model,</tspan>
      <tspan x="160" dy="34">endpoint has no capacity during that window;</tspan>
      <tspan x="160" dy="34">retries in the gap make the first minute after recovery worse</tspan>
    </text>
    <g id="timeline-a-vis">
      <rect x="160" y="394" width="1310" height="200" rx="10" fill="#ffffff" stroke="#eedcd0" stroke-width="1.5"/>
      <rect x="220" y="404" width="980" height="180" rx="6" fill="#fdeddc" stroke="#db8129" stroke-width="2" stroke-dasharray="6 4"/>
      <rect x="230" y="416" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="436" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="456" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="476" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="496" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="516" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="536" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <rect x="230" y="556" width="960" height="12" rx="3" fill="#e8b082" stroke="#db8129" stroke-width="1"/>
      <path d="M 1220 440 L 1245 490 L 1235 490 L 1260 550 L 1240 505 L 1250 505 Z" fill="#db8129" stroke="#db8129" stroke-width="1"/>
      <path d="M 1270 430 L 1295 480 L 1285 480 L 1310 540 L 1290 495 L 1300 495 Z" fill="#db8129" stroke="#db8129" stroke-width="1"/>
      <path d="M 1320 440 L 1345 490 L 1335 490 L 1360 550 L 1340 505 L 1350 505 Z" fill="#db8129" stroke="#db8129" stroke-width="1"/>
    </g>
  </g>
  <g id="timeline-b">
    <rect x="50" y="646" width="1500" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(75, 666)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 28 C 48 40, 28 50, 28 50 C 28 50, 8 40, 8 28 L 8 14 Z"/>
      <polyline points="20,26 26,32 38,20"/>
    </g>
    <text x="160" y="690" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="160" dy="0">small groups, at least X+1 replicas keep serving;</tspan>
      <tspan x="160" dy="34">weights staged on local disk so the source stops being the shared bottleneck;</tspan>
      <tspan x="160" dy="34">one replica alone needs 10 s</tspan>
    </text>
    <g id="timeline-b-vis">
      <rect x="160" y="784" width="1310" height="200" rx="10" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
      <rect x="230" y="796" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="450" y="796" width="980" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="818" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="450" y="818" width="980" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="840" width="220" height="14" rx="3" fill="#207448"/>
      <rect x="450" y="840" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="670" y="840" width="760" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="862" width="220" height="14" rx="3" fill="#207448"/>
      <rect x="450" y="862" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="670" y="862" width="760" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="884" width="440" height="14" rx="3" fill="#207448"/>
      <rect x="670" y="884" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="890" y="884" width="540" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="906" width="440" height="14" rx="3" fill="#207448"/>
      <rect x="670" y="906" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="890" y="906" width="540" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="928" width="660" height="14" rx="3" fill="#207448"/>
      <rect x="890" y="928" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="1110" y="928" width="320" height="14" rx="3" fill="#207448"/>
      <rect x="230" y="950" width="660" height="14" rx="3" fill="#207448"/>
      <rect x="890" y="950" width="220" height="14" rx="3" fill="#a3d3b6" stroke="#207448" stroke-width="1"/>
      <rect x="1110" y="950" width="320" height="14" rx="3" fill="#207448"/>
    </g>
  </g>
  <g id="footer-takeaway">
    <rect x="50" y="1036" width="1500" height="136" rx="14" fill="#207448"/>
    <g transform="translate(75, 1076)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18"/>
      <line x1="12" y1="28" x2="28" y2="28"/>
      <line x1="12" y1="38" x2="40" y2="38"/>
      <circle cx="10" cy="12" r="2" fill="#ffffff"/>
      <circle cx="16" cy="12" r="2" fill="#ffffff"/>
    </g>
    <text x="160" y="1078" font-family="sans-serif" font-size="24" fill="#ffffff">
      <tspan x="160" dy="0">measure the load time in the startup log and use that number in your answer;</tspan>
      <tspan x="160" dy="32">saying you will measure first is more credible than a number you cannot defend;</tspan>
      <tspan x="160" dy="32">the gap is the window to plan for, not the steady state</tspan>
    </text>
  </g>
</svg>