<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Retry amplification: expected attempts per request</title>
  <desc>Visual infographic explaining retry amplification: formula strip for expected attempts, empirical bar chart for k=4, circular loop of failure cascade, confirmation and mitigation controls, and partial outage operating rule.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    <filter id="subtle-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b3022" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title -->
  <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Retry amplification: expected attempts per request</text>

  <!-- Formula Strip -->
  <g transform="translate(40, 100)" filter="url(#subtle-shadow)">
    <rect width="1520" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Formula Icon: function / formula curve -->
    <g transform="translate(24, 25)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="60" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M 16 26 Q 30 20 30 38 Q 30 56 44 50" />
      <line x1="20" y1="38" x2="40" y2="38" />
      <line x1="16" y1="62" x2="44" y2="62" />
    </g>
    <text x="110" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="110" dy="0" font-weight="bold">expected attempts = 1 + p + p squared + ... up to p to the power k minus 1,</tspan>
      <tspan x="110" dy="34">where p is the chance one attempt fails and k is the attempts a client allows;</tspan>
      <tspan x="110" dy="34">each term is the chance the request reaches that attempt</tspan>
    </text>
  </g>

  <!-- Left Column: Bar Chart (Top) -->
  <g transform="translate(40, 245)" filter="url(#subtle-shadow)">
    <rect width="970" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Bar Chart Icon -->
    <g transform="translate(30, 24)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <line x1="14" y1="42" x2="14" y2="30" stroke-width="5" stroke="#207448" />
      <line x1="28" y1="42" x2="28" y2="20" stroke-width="5" stroke="#207448" />
      <line x1="42" y1="42" x2="42" y2="12" stroke-width="5" stroke="#207448" />
    </g>
    <!-- Bar Chart Header -->
    <text x="104" y="62" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">k = 4</text>

    <!-- Bar 1 -->
    <text x="30" y="116" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">p = 0.1: 1.11 attempts per request</text>
    <rect x="610" y="98" width="330" height="24" rx="6" fill="#e8f1ea" />
    <rect x="610" y="98" width="92" height="24" rx="6" fill="#207448" />

    <!-- Bar 2 -->
    <text x="30" y="162" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">p = 0.5: 1.875</text>
    <rect x="610" y="144" width="330" height="24" rx="6" fill="#e8f1ea" />
    <rect x="610" y="144" width="155" height="24" rx="6" fill="#207448" />

    <!-- Bar 3 -->
    <text x="30" y="208" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">p = 0.8: 2.95</text>
    <rect x="610" y="190" width="330" height="24" rx="6" fill="#e8f1ea" />
    <rect x="610" y="190" width="243" height="24" rx="6" fill="#207448" />
  </g>

  <!-- Left Column: Circular Loop Diagram (Bottom) -->
  <g id="loop-diagram">
    <!-- Connecting Loop Arrows -->
    <!-- Arrow 1: Box 1 (top) to Box 2 (right) -->
    <path d="M 725 565 L 784 565 Q 800 565 800 581 L 800 736" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

    <!-- Arrow 2: Box 2 (right) to Box 3 (bottom) -->
    <path d="M 800 870 L 800 1009 Q 800 1025 784 1025 L 769 1025" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

    <!-- Arrow 3: Box 3 (bottom) to Box 4 (left) -->
    <path d="M 270 1025 L 226 1025 Q 210 1025 210 1009 L 210 870" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

    <!-- Arrow 4: Box 4 (left) to Box 1 (top) -->
    <path d="M 210 740 L 210 581 Q 210 565 226 565 L 316 565" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

    <!-- Loop Box 1 (Top) -->
    <g transform="translate(325, 510)" filter="url(#subtle-shadow)">
      <rect width="400" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Step 1 Number Circle -->
      <circle cx="45" cy="55" r="24" fill="#207448" />
      <text x="45" y="63" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <!-- Icon: failed server / chip -->
      <g transform="translate(85, 27)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="54" height="56" rx="6" fill="#e8f1ea" />
        <line x1="12" y1="18" x2="42" y2="18" />
        <line x1="12" y1="30" x2="42" y2="30" />
        <line x1="16" y1="44" x2="38" y2="44" stroke="#db8129" stroke-width="4" />
      </g>
      <!-- Box 1 Label -->
      <text x="155" y="64" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">half the replicas fail</text>
    </g>

    <!-- Loop Box 2 (Right) -->
    <g transform="translate(620, 740)" filter="url(#subtle-shadow)">
      <rect width="370" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Step 2 Number Circle -->
      <circle cx="45" cy="65" r="24" fill="#207448" />
      <text x="45" y="73" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <!-- Icon: surge / doubled bandwidth gauge -->
      <g transform="translate(85, 37)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="54" height="56" rx="6" fill="#e8f1ea" />
        <path d="M 12 40 Q 27 16 42 40" />
        <line x1="27" y1="36" x2="38" y2="22" stroke-width="3.5" />
      </g>
      <!-- Box 2 Label -->
      <text x="155" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="155" dy="0">survivors get doubled</tspan>
        <tspan x="155" dy="34">traffic and p rises</tspan>
      </text>
    </g>

    <!-- Loop Box 3 (Bottom) - The Single Most Important Item in Orange -->
    <g transform="translate(270, 960)" filter="url(#subtle-shadow)">
      <rect width="490" height="130" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="3.5" />
      <!-- Step 3 Number Circle (Orange) -->
      <circle cx="45" cy="65" r="24" fill="#db8129" />
      <text x="45" y="73" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <!-- Icon: retry circular loop / gateway (Orange) -->
      <g transform="translate(85, 37)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="54" height="56" rx="6" fill="#fee9d6" />
        <path d="M 38 24 A 14 14 0 1 0 41 34" />
        <polyline points="38 18 38 26 46 26" />
      </g>
      <!-- Box 3 Label -->
      <text x="155" y="55" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="155" dy="0">clients retry, so request rate at the</tspan>
        <tspan x="155" dy="34">gateway exceeds the user request rate</tspan>
      </text>
    </g>

    <!-- Loop Box 4 (Left) -->
    <g transform="translate(50, 740)" filter="url(#subtle-shadow)">
      <rect width="320" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Step 4 Number Circle -->
      <circle cx="45" cy="65" r="24" fill="#207448" />
      <text x="45" y="73" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <!-- Icon: rising load graph -->
      <g transform="translate(85, 37)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="54" height="56" rx="6" fill="#e8f1ea" />
        <polyline points="10 42 22 34 32 38 44 16" />
        <polyline points="36 16 44 16 44 24" />
      </g>
      <!-- Box 4 Label -->
      <text x="155" y="73" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">load rises again</text>
    </g>
  </g>

  <!-- Right Column -->
  <!-- Box A: Confirm -->
  <g transform="translate(1040, 245)" filter="url(#subtle-shadow)">
    <rect width="520" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Icon: search / inspect -->
    <g transform="translate(24, 22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <line x1="34" y1="34" x2="48" y2="48" />
      <line x1="18" y1="24" x2="30" y2="24" />
    </g>
    <!-- Text -->
    <text x="90" y="52" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">confirm:</text>
    <text x="24" y="98" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">compare gateway request rate against</tspan>
      <tspan x="24" dy="34">unique user requests; look for</tspan>
      <tspan x="24" dy="36" font-family="monospace" font-weight="bold" font-size="24" fill="#207448">vllm:admission_rejections_total</tspan>
      <tspan x="24" dy="36">rising together with client retries</tspan>
    </text>
  </g>

  <!-- Box B: Mitigate Now -->
  <g transform="translate(1040, 530)" filter="url(#subtle-shadow)">
    <rect width="520" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Icon: shield / shed -->
    <g transform="translate(24, 22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 26 8 L 46 16 L 46 32 C 46 44 26 52 26 52 C 26 52 6 44 6 32 L 6 16 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="4" />
    </g>
    <!-- Text -->
    <text x="90" y="52" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">mitigate now:</text>
    <text x="24" y="104" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">cut client retries, return 503 with a</tspan>
      <tspan x="24" dy="36">back-off hint, shed at the edge</tspan>
    </text>
  </g>

  <!-- Box C: Fix Later -->
  <g transform="translate(1040, 810)" filter="url(#subtle-shadow)">
    <rect width="520" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Icon: gear / maintenance -->
    <g transform="translate(24, 22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <path d="M 26 8 L 26 14 M 26 38 L 26 44 M 8 26 L 14 26 M 38 26 L 44 26 M 13 13 L 18 18 M 34 34 L 39 39 M 13 39 L 18 34 M 34 18 L 39 13" />
    </g>
    <!-- Text -->
    <text x="90" y="52" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">fix later:</text>
    <text x="24" y="102" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">retry budget (a cap on retries as a</tspan>
      <tspan x="24" dy="34">fraction of requests), jittered</tspan>
      <tspan x="24" dy="34">exponential back-off, circuit breaker,</tspan>
      <tspan x="24" dy="34">idempotency keys</tspan>
    </text>
  </g>

  <!-- Takeaway Bar at Bottom -->
  <g transform="translate(40, 1115)" filter="url(#subtle-shadow)">
    <rect width="1520" height="60" rx="10" fill="#207448" />
    <!-- Icon: key takeaway shield / check -->
    <g transform="translate(20, 12)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="14" fill="#207448" />
      <polyline points="11 18 16 23 25 13" />
    </g>
    <text x="68" y="39" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">during a partial outage reduce attempts first, more capacity will not catch up with a growing retry loop</text>
  </g>
</svg>
