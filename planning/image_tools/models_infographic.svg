<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How models, what models and accurate models</title>
  <desc>Visual explanation comparing How models (theory), What models (state of your system), and Accurate models (fit to purpose) in technical architecture and troubleshooting.</desc>
  <!-- Canvas Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <!-- Main Title -->
  <text x="800" y="55" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">How models, what models and accurate models</text>
  <!-- ==================== COLUMN 1: How models ==================== -->
  <g id="column-1">
    <!-- Column Background Panel -->
    <rect x="40" y="85" width="480" height="994" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Column 1 Icon: Mechanism / Gears -->
    <g transform="translate(252, 102)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="10" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 11 L 45 15" stroke-width="4.5" />
      <circle cx="28" cy="28" r="18" stroke-width="3.5" />
    </g>
    <!-- Column 1 Title -->
    <text x="280" y="188" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="280">How models</tspan>
      <tspan x="280" dy="34">(theory)</tspan>
    </text>
    <!-- Column 1 Card 1 -->
    <rect x="56" y="245" width="448" height="184" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="80" y="285" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="80">why and how things work:</tspan>
      <tspan x="80" dy="30">the problem each mechanism</tspan>
      <tspan x="80" dy="30">solves, the range of</tspan>
      <tspan x="80" dy="30">solutions, how this</tspan>
      <tspan x="80" dy="30">implementation applies one</tspan>
    </text>
    <!-- Column 1 Card 2 -->
    <rect x="56" y="438" width="448" height="244" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="80" y="478" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="80">BGP peer state: a finite</tspan>
      <tspan x="80" dy="30">state machine, timers and</tspan>
      <tspan x="80" dy="30">keepalives; a session must</tspan>
      <tspan x="80" dy="30">miss its hold timer before</tspan>
      <tspan x="80" dy="30">routes withdraw, so a</tspan>
      <tspan x="80" dy="30">failure takes that long to</tspan>
      <tspan x="80" dy="30">show up</tspan>
    </text>
    <!-- Column 1 Card 3 -->
    <rect x="56" y="690" width="448" height="214" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="80" y="730" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="80">built from protocol</tspan>
      <tspan x="80" dy="30">specifications, design</tspan>
      <tspan x="80" dy="30">rationales, real designs</tspan>
      <tspan x="80" dy="30">and their failures; best</tspan>
      <tspan x="80" dy="30">captured as flow charts or</tspan>
      <tspan x="80" dy="30">sequence diagrams</tspan>
    </text>
    <!-- Column 1 Card 4 -->
    <rect x="56" y="913" width="448" height="154" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="80" y="953" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="80">skip them and you get</tspan>
      <tspan x="80" dy="30">hunt-and-peck</tspan>
      <tspan x="80" dy="30">troubleshooting from</tspan>
      <tspan x="80" dy="30">fragments of past incidents</tspan>
    </text>
  </g>
  <!-- ==================== COLUMN 2: What models ==================== -->
  <g id="column-2">
    <!-- Column Background Panel -->
    <rect x="560" y="85" width="480" height="994" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Column 2 Icon: Telemetry Monitor / Signal -->
    <g transform="translate(772, 102)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="48" height="34" rx="4" />
      <path d="M 8 23 H 17 L 22 13 L 28 33 L 34 18 L 38 23 H 48" />
      <line x1="28" y1="40" x2="28" y2="49" />
      <line x1="18" y1="49" x2="38" y2="49" />
    </g>
    <!-- Column 2 Title -->
    <text x="800" y="188" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="800">What models</tspan>
      <tspan x="800" dy="34">(state of your system)</tspan>
    </text>
    <!-- Column 2 Card 1 -->
    <rect x="576" y="245" width="448" height="424" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="600" y="285" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="600">what is normal here: the</tspan>
      <tspan x="600" dy="30">signal path of each</tspan>
      <tspan x="600" dy="30">application, the baseline</tspan>
      <tspan x="600" dy="30">(traffic by time of day,</tspan>
      <tspan x="600" dy="30">SPF run times, jitter and</tspan>
      <tspan x="600" dy="30">delay per application, ECMP</tspan>
      <tspan x="600" dy="30">balance, PFC and ECN rates,</tspan>
      <tspan x="600" dy="30">temperatures, optic power),</tspan>
      <tspan x="600" dy="30">the source of truth for</tspan>
      <tspan x="600" dy="30">configuration, expected</tspan>
      <tspan x="600" dy="30">convergence time and loss</tspan>
      <tspan x="600" dy="30">on link failure, security</tspan>
      <tspan x="600" dy="30">boundaries</tspan>
    </text>
    <!-- Column 2 Card 2 -->
    <rect x="576" y="684" width="448" height="124" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="600" y="724" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="600">write down the normal</tspan>
      <tspan x="600" dy="30">retransmit rate, latency</tspan>
      <tspan x="600" dy="30">and load on one leaf switch</tspan>
    </text>
    <!-- Column 2 Card 3 -->
    <rect x="576" y="823" width="448" height="244" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <path d="M 576 833 Q 576 823 586 823 L 586 823 L 586 1067 L 586 1067 Q 576 1067 576 1057 Z" fill="#db8129" />
    <text x="600" y="863" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="600">radar technician: a DC</tspan>
      <tspan x="600" dy="30">ohmmeter reads an inductor</tspan>
      <tspan x="600" dy="30">as a short, so it could not</tspan>
      <tspan x="600" dy="30">see the inductor failure in</tspan>
      <tspan x="600" dy="30">parallel with the shorted</tspan>
      <tspan x="600" dy="30">resistor; every tool has</tspan>
      <tspan x="600" dy="30">blind spots</tspan>
    </text>
  </g>
  <!-- ==================== COLUMN 3: Accurate models ==================== -->
  <g id="column-3">
    <!-- Column Background Panel -->
    <rect x="1080" y="85" width="480" height="994" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Column 3 Icon: Fit to Purpose Target -->
    <g transform="translate(1292, 102)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="22" />
      <circle cx="28" cy="28" r="12" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
      <line x1="28" y1="2" x2="28" y2="10" />
      <line x1="28" y1="46" x2="28" y2="54" />
      <line x1="2" y1="28" x2="10" y2="28" />
      <line x1="46" y1="28" x2="54" y2="28" />
    </g>
    <!-- Column 3 Title -->
    <text x="1320" y="188" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1320">Accurate models</tspan>
      <tspan x="1320" dy="34">(fit to purpose)</tspan>
    </text>
    <!-- Column 3 Card 1 -->
    <rect x="1096" y="245" width="448" height="134" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1120" y="305" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1120">accuracy means fit to</tspan>
      <tspan x="1120" dy="30">purpose, not completeness</tspan>
    </text>
    <!-- Column 3 Card 2 -->
    <rect x="1096" y="404" width="448" height="194" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1120" y="464" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1120">OSI is good for interfaces</tspan>
      <tspan x="1120" dy="30">and building a stack, poor</tspan>
      <tspan x="1120" dy="30">for what happens where and</tspan>
      <tspan x="1120" dy="30">why</tspan>
    </text>
    <!-- Column 3 Card 3 -->
    <rect x="1096" y="624" width="448" height="194" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1120" y="684" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1120">RINA treats error control,</tspan>
      <tspan x="1120" dy="30">flow control and</tspan>
      <tspan x="1120" dy="30">multiplexing as recurring</tspan>
      <tspan x="1120" dy="30">at each scope</tspan>
    </text>
    <!-- Column 3 Card 4 -->
    <rect x="1096" y="843" width="448" height="224" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1120" y="903" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1120">different questions need</tspan>
      <tspan x="1120" dy="30">different models: path,</tspan>
      <tspan x="1120" dy="30">control plane, queues,</tspan>
      <tspan x="1120" dy="30">energy and thermal,</tspan>
      <tspan x="1120" dy="30">application protocol</tspan>
    </text>
  </g>
  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <rect x="40" y="1092" width="1520" height="78" rx="12" fill="#207448" />
  <text x="800" y="1141" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">You cannot recognise broken without knowing normal</text>
</svg>