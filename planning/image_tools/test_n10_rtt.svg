<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Round trips: TCP plus TLS</title>
  <desc>Round trips: TCP plus TLS</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f8f5"/>
  <text x="800" y="66" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Round trips: TCP plus TLS</text>
  <!-- Top bar container: TCP + TLS 1.2 -->
  <rect x="40" y="115" width="1520" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="60" y="135" width="330" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(75, 178)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="18" width="44" height="34" rx="6"/>
    <path d="M 14 18 V 10 A 12 12 0 0 1 38 10 V 18"/>
    <circle cx="26" cy="35" r="4" fill="#207448"/>
  </g>
  <text x="142" y="220" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">TCP + TLS 1.2</text>
  <rect x="410" y="135" width="360" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(426, 178)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="28" r="10"/>
    <circle cx="42" cy="28" r="10"/>
    <line x1="24" y1="28" x2="32" y2="28"/>
  </g>
  <text x="496" y="220" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TCP 1 RTT</text>
  <rect x="790" y="135" width="750" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(812, 178)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <polyline points="28,14 28,28 38,28"/>
  </g>
  <text x="886" y="220" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TLS 2 RTT</text>
  <!-- Bottom bar container: TCP + TLS 1.3 -->
  <rect x="40" y="330" width="1520" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="60" y="350" width="330" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(75, 393)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 26 4 L 46 12 V 26 C 46 40 26 48 26 48 C 26 48 6 40 6 26 V 12 Z"/>
    <path d="M 16 26 L 23 33 L 36 18"/>
  </g>
  <text x="142" y="435" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">TCP + TLS 1.3</text>
  <rect x="410" y="350" width="360" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(426, 393)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="28" r="10"/>
    <circle cx="42" cy="28" r="10"/>
    <line x1="24" y1="28" x2="32" y2="28"/>
  </g>
  <text x="496" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TCP 1 RTT</text>
  <rect x="790" y="350" width="360" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(812, 393)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <polyline points="28,14 28,28 38,28"/>
  </g>
  <text x="886" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TLS 1 RTT</text>
  <rect x="1170" y="350" width="370" height="145" rx="10" fill="#fdf5ee" stroke="#db8129" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1200" y1="422" x2="1510" y2="422" stroke="#db8129" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <!-- Side note -->
  <rect x="40" y="545" width="1520" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 587)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="28" r="12"/>
    <line x1="30" y1="28" x2="52" y2="28"/>
    <line x1="42" y1="28" x2="42" y2="38"/>
    <line x1="48" y1="28" x2="48" y2="35"/>
  </g>
  <text x="145" y="627" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">TLS 1.3 client sends its key share in the first message</text>
  <!-- Footer takeaway bar -->
  <rect x="40" y="715" width="1520" height="140" rx="14" fill="#207448"/>
  <g transform="translate(65, 757)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="48" height="36" rx="6"/>
    <line x1="16" y1="10" x2="16" y2="46" stroke-dasharray="4 4"/>
    <circle cx="34" cy="28" r="6"/>
  </g>
  <text x="145" y="797" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Session tickets or PSKs let a returning client skip the full handshake</text>
</svg>