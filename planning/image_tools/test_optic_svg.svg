<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading an Ethernet standard name and picking the medium</title>
  <desc>Visual explanation of Ethernet standard naming conventions, medium reach ladder, form factor lane counts, and NRZ versus PAM4 signaling with RS-FEC.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading an Ethernet standard name and picking the medium</text>

  <!-- ==================== TOP SECTION: NAME DECOMPOSITION ==================== -->
  <!-- Container Panel -->
  <rect x="40" y="88" width="1520" height="236" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  <!-- Example 1: 100GBASE-LR4 -->
  <rect x="60" y="105" width="280" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <!-- Transceiver outline icon -->
  <g transform="translate(75, 114)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="34" height="28" rx="4" />
    <line x1="10" y1="2" x2="10" y2="6" /><line x1="19" y1="2" x2="19" y2="6" /><line x1="28" y1="2" x2="28" y2="6" />
    <line x1="10" y1="34" x2="10" y2="38" /><line x1="19" y1="34" x2="19" y2="38" /><line x1="28" y1="34" x2="28" y2="38" />
  </g>
  <text x="210" y="144" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">100GBASE-LR4</text>

  <!-- 4 Orthogonal Non-crossing Arrows from 100GBASE-LR4 to the 4 pieces -->
  <path d="M 340 139 L 380 139" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 340 127 L 355 127 L 355 104 L 845 104 L 845 114" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 340 119 L 350 119 L 350 100 L 1190 100 L 1190 114" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 340 111 L 345 111 L 345 96 L 1430 96 L 1430 114" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

  <!-- 4 Labelled Pieces (Columns) -->
  <!-- Piece 1: 100G = speed -->
  <rect x="380" y="114" width="230" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="495" y="147" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">100G = speed</text>

  <!-- Piece 2: BASE = baseband signalling -->
  <rect x="630" y="114" width="430" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="845" y="147" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">BASE = baseband signalling</text>

  <!-- Piece 3: L = long reach -->
  <rect x="1080" y="114" width="220" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1190" y="147" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">L = long reach</text>

  <!-- Piece 4: 4 = four lanes -->
  <rect x="1320" y="114" width="220" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1430" y="147" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">4 = four lanes</text>

  <!-- Divider line -->
  <line x1="60" y1="184" x2="1540" y2="184" stroke="#207448" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Example 2 Row: 400GBASE-DR4 -->
  <rect x="60" y="200" width="280" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <!-- Transceiver outline icon -->
  <g transform="translate(75, 209)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="34" height="28" rx="4" />
    <line x1="10" y1="2" x2="10" y2="6" /><line x1="19" y1="2" x2="19" y2="6" /><line x1="28" y1="2" x2="28" y2="6" />
    <line x1="10" y1="34" x2="10" y2="38" /><line x1="19" y1="34" x2="19" y2="38" /><line x1="28" y1="34" x2="28" y2="38" />
  </g>
  <text x="210" y="239" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">400GBASE-DR4</text>

  <!-- Visual alignment indicators under the 4 columns for 400GBASE-DR4 -->
  <rect x="380" y="206" width="230" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="5,4" />
  <line x1="495" y1="164" x2="495" y2="206" stroke="#207448" stroke-width="1.5" stroke-dasharray="3,3" />

  <rect x="630" y="206" width="430" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="5,4" />
  <line x1="845" y1="164" x2="845" y2="206" stroke="#207448" stroke-width="1.5" stroke-dasharray="3,3" />

  <rect x="1080" y="206" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="5,4" />
  <line x1="1190" y1="164" x2="1190" y2="206" stroke="#207448" stroke-width="1.5" stroke-dasharray="3,3" />

  <rect x="1320" y="206" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="5,4" />
  <line x1="1430" y1="164" x2="1430" y2="206" stroke="#207448" stroke-width="1.5" stroke-dasharray="3,3" />


  <!-- ==================== MIDDLE LEFT: DISTANCE LADDER ==================== -->
  <!-- Ladder Vertical Guide Line (no arrowhead) -->
  <line x1="50" y1="345" x2="50" y2="945" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" />

  <!-- 1. DAC -->
  <rect x="70" y="345" width="730" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Cable spool icon -->
  <g transform="translate(86, 368)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="18" rx="20" ry="12" />
    <path d="M 8 18 v 20 c 0 6.6 9 12 20 12 s 20 -5.4 20 -12 v -20" />
    <circle cx="28" cy="18" r="6" fill="#207448" />
  </g>
  <text x="160" y="388" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">DAC, direct-attach copper twinax: </tspan>
    <tspan x="160" dy="30">in-rack, 3 to 5 m for 25GBASE-CR, </tspan>
    <tspan x="160" dy="30">10 to 400G</tspan>
  </text>

  <!-- 2. AOC -->
  <rect x="70" y="468" width="730" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Optical link icon -->
  <g transform="translate(86, 491)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="16" width="18" height="24" rx="3" />
    <rect x="34" y="16" width="18" height="24" rx="3" />
    <path d="M 22 28 C 26 22 30 34 34 28" />
  </g>
  <text x="160" y="516" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">AOC, active optical cable </tspan>
    <tspan x="160" dy="32">with optics attached: 5 to 100 m</tspan>
  </text>

  <!-- 3. Multi-mode fibre -->
  <rect x="70" y="591" width="730" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Wave / optical ray icon -->
  <g transform="translate(86, 614)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <path d="M 16 28 Q 22 18 28 28 T 40 28" />
  </g>
  <text x="160" y="639" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">Multi-mode fibre OM3/OM4/OM5 at 850 nm: </tspan>
    <tspan x="160" dy="32">about 100 m, cheaper optics (SR)</tspan>
  </text>

  <!-- 4. Single-mode fibre -->
  <rect x="70" y="714" width="730" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Laser line icon -->
  <g transform="translate(86, 737)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <line x1="12" y1="28" x2="44" y2="28" />
    <circle cx="28" cy="28" r="4" fill="#207448" />
  </g>
  <text x="160" y="762" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">Single-mode fibre OS2 at 1310 or 1550 nm: </tspan>
    <tspan x="160" dy="32">500 m (DR), 2 km (FR), 10 km (LR)</tspan>
  </text>

  <!-- 5. Copper twisted pair -->
  <rect x="70" y="837" width="730" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Twisted pair wire icon -->
  <g transform="translate(86, 860)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 16 Q 28 32 48 16" />
    <path d="M 8 36 Q 28 20 48 36" />
  </g>
  <text x="160" y="885" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">Copper twisted pair Cat5e/6/6a: </tspan>
    <tspan x="160" dy="32">100 m at 1 to 10 Gb/s</tspan>
  </text>


  <!-- ==================== MIDDLE RIGHT TOP: FORM FACTORS ==================== -->
  <!-- SFP -->
  <rect x="840" y="345" width="720" height="78" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(856, 356)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="40" height="34" rx="3" />
    <line x1="26" y1="16" x2="26" y2="38" />
  </g>
  <text x="925" y="377" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0" font-weight="bold">SFP, SFP+, SFP28: </tspan>
    <tspan x="925" dy="28">one lane at 1, 10, 25G</tspan>
  </text>

  <!-- QSFP -->
  <rect x="840" y="439" width="720" height="78" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(856, 450)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="44" height="38" rx="3" />
    <line x1="14" y1="14" x2="14" y2="40" /><line x1="22" y1="14" x2="22" y2="40" />
    <line x1="30" y1="14" x2="30" y2="40" /><line x1="38" y1="14" x2="38" y2="40" />
  </g>
  <text x="925" y="471" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0" font-weight="bold">QSFP+, QSFP28, QSFP56: </tspan>
    <tspan x="925" dy="28">four lanes at 40, 100, 200G</tspan>
  </text>

  <!-- QSFP-DD, OSFP -->
  <rect x="840" y="533" width="720" height="78" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(856, 544)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="48" height="42" rx="3" stroke-width="3" />
    <line x1="8" y1="12" x2="8" y2="42" /><line x1="14" y1="12" x2="14" y2="42" />
    <line x1="20" y1="12" x2="20" y2="42" /><line x1="26" y1="12" x2="26" y2="42" />
    <line x1="32" y1="12" x2="32" y2="42" /><line x1="38" y1="12" x2="38" y2="42" />
    <line x1="44" y1="12" x2="44" y2="42" />
  </g>
  <text x="925" y="565" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0" font-weight="bold">QSFP-DD, OSFP: </tspan>
    <tspan x="925" dy="28">eight lanes at 400 and 800G</tspan>
  </text>


  <!-- ==================== MIDDLE RIGHT BOTTOM: ENCODINGS ==================== -->
  <!-- NRZ Box -->
  <rect x="840" y="627" width="720" height="88" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- NRZ 2-level square wave icon -->
  <g transform="translate(856, 642)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 36 H 18 V 12 H 34 V 36 H 48" />
  </g>
  <text x="925" y="662" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0" font-weight="bold">Encoding per lane: NRZ up to 25G, </tspan>
    <tspan x="925" dy="30">two levels, one bit per symbol</tspan>
  </text>

  <!-- PAM4 Box -->
  <rect x="840" y="731" width="720" height="212" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- PAM4 4-level staircase wave icon -->
  <g transform="translate(856, 750)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="46" x2="14" y2="46" />
    <line x1="14" y1="46" x2="14" y2="34" />
    <line x1="14" y1="34" x2="26" y2="34" />
    <line x1="26" y1="34" x2="26" y2="22" />
    <line x1="26" y1="22" x2="38" y2="22" />
    <line x1="38" y1="22" x2="38" y2="10" />
    <line x1="38" y1="10" x2="48" y2="10" />
  </g>
  <text x="925" y="763" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0" font-weight="bold">PAM4 at 50G and 100G, four levels, </tspan>
    <tspan x="925" dy="28">two bits per symbol, </tspan>
    <tspan x="925" dy="28">smaller noise margin, </tspan>
    <tspan x="925" dy="28">needs <tspan fill="#db8129" font-weight="bold">RS-FEC (KP4)</tspan>, </tspan>
    <tspan x="925" dy="28">about 100 to 250 ns latency, </tspan>
    <tspan x="925" dy="28">both ends must use the same FEC mode</tspan>
  </text>


  <!-- ==================== FOOTER: BREAKOUT CABLE ==================== -->
  <rect x="40" y="965" width="1520" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- 1-to-4 breakout cable icon -->
  <g transform="translate(62, 990)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="18" width="16" height="24" rx="2" />
    <path d="M 18 30 C 30 30 34 12 44 12" />
    <path d="M 18 30 C 30 30 34 24 44 24" />
    <path d="M 18 30 C 30 30 34 36 44 36" />
    <path d="M 18 30 C 30 30 34 48 44 48" />
  </g>
  <text x="135" y="1013" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0" font-weight="bold">Breakout cable: one 400G port into four 100G links; the same speed can have different reach, </tspan>
    <tspan x="135" dy="34">100GBASE-LR4 10 km versus 100GBASE-DR 500 m, so read the reach as well</tspan>
  </text>


  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <rect x="40" y="1095" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1142" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Check speed, FEC mode and error counters, not just link state</text>
</svg>