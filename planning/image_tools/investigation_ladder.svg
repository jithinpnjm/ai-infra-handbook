<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Investigation commands from cheapest to most targeted</title>
  <desc>Visual ladder of Ansible investigation commands arranged from cheapest parse-only checks to targeted ad hoc commands, with a warning that start-at-task skips earlier set_fact tasks.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Investigation commands from cheapest to most targeted</text>
  <rect x="50" y="112" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 135)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 4 L 30 4 L 42 16 L 42 44 L 8 44 Z" />
    <polyline points="30,4 30,16 42,16" />
    <polyline points="15,28 22,35 34,21" />
  </g>
  <text x="145" y="169" font-size="30" fill="#303a36"><tspan font-family="monospace" font-weight="bold">--syntax-check</tspan><tspan font-family="sans-serif" font-weight="normal" font-size="24"> (parse only, touches no host)</tspan></text>
  <rect x="50" y="246" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 269)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="12" r="2" fill="#207448" />
    <line x1="20" y1="12" x2="42" y2="12" />
    <circle cx="10" cy="24" r="2" fill="#207448" />
    <line x1="20" y1="24" x2="42" y2="24" />
    <circle cx="10" cy="36" r="2" fill="#207448" />
    <line x1="20" y1="36" x2="42" y2="36" />
  </g>
  <text x="145" y="303" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">--list-tasks --list-tags --list-hosts</text>
  <rect x="50" y="380" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 403)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="22" height="32" rx="3" />
    <path d="M 20 10 L 20 4 L 34 4 L 42 12 L 42 34 L 28 34" />
    <line x1="12" y1="20" x2="22" y2="20" />
    <line x1="12" y1="28" x2="22" y2="28" />
  </g>
  <text x="145" y="437" font-size="30" fill="#303a36"><tspan font-family="monospace" font-weight="bold">--check --diff --limit gpu001</tspan><tspan font-family="sans-serif" font-weight="normal" font-size="24"> (what would change)</tspan></text>
  <rect x="50" y="514" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 537)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="36" height="32" rx="4" />
    <polyline points="14,24 20,30 32,18" />
  </g>
  <text x="145" y="571" font-size="30" fill="#303a36"><tspan font-family="monospace" font-weight="bold">--step</tspan><tspan font-family="sans-serif" font-weight="normal" font-size="24"> (confirm every task y/n/c)</tspan></text>
  <rect x="50" y="648" width="730" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 671)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="6" x2="10" y2="44" />
    <path d="M 10 8 L 38 18 L 10 28 Z" fill="#e8f1ea" />
  </g>
  <text x="145" y="705" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">--start-at-task Install driver</text>
  <rect x="820" y="648" width="730" height="94" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
  <g transform="translate(840, 671)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="24,6 44,42 4,42" />
    <line x1="24" y1="18" x2="24" y2="28" />
    <circle cx="24" cy="35" r="2" fill="#db8129" />
  </g>
  <text x="905" y="687" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="905" dy="0">it skips earlier set_fact so the driver </tspan><tspan x="905" dy="28">task fails on an undefined variable</tspan></text>
  <rect x="50" y="782" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 805)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 24 L 24 8 L 40 8 L 40 24 L 24 40 Z" />
    <circle cx="32" cy="16" r="3" fill="#207448" />
  </g>
  <text x="145" y="839" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">-t config -l gpu001</text>
  <rect x="50" y="916" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 939)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="36" height="24" rx="3" />
    <line x1="14" y1="34" x2="14" y2="40" />
    <line x1="34" y1="34" x2="34" y2="40" />
    <line x1="6" y1="40" x2="42" y2="40" />
    <circle cx="16" cy="22" r="2" fill="#207448" />
    <circle cx="26" cy="22" r="2" fill="#207448" />
  </g>
  <text x="145" y="973" font-size="30" fill="#303a36"><tspan font-family="sans-serif" font-weight="bold">ad hoc </tspan><tspan font-family="monospace" font-weight="bold">setup with filter=ansible_default_ipv4</tspan></text>
  <rect x="50" y="1050" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 1073)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="36" height="32" rx="4" />
    <polyline points="13,18 20,24 13,30" />
    <line x1="24" y1="30" x2="33" y2="30" />
  </g>
  <text x="145" y="1107" font-size="30" fill="#303a36"><tspan font-family="sans-serif" font-weight="bold">ad hoc command </tspan><tspan font-family="monospace" font-weight="bold">which python3 with -vvv</tspan></text>
</svg>