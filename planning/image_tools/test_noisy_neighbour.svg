<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Multi-tenant noisy-neighbour control [my addition]</title>
  <desc>Flowchart showing multi-tenant noisy-neighbour control: incoming requests are evaluated by token and context cost, scheduled via weighted fair queues, enforced by a per-tenant KV cap, and routed to a shared pool or long-context pool.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Multi-tenant noisy-neighbour control [my addition]</text>

  <!-- ==================== NODE 1: Request ==================== -->
  <g id="node-request">
    <rect x="50" y="370" width="200" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <!-- Window / application request icon (56x56) -->
    <g transform="translate(122, 395)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6"/>
      <line x1="6" y1="20" x2="50" y2="20" stroke-width="3"/>
      <circle cx="15" cy="14" r="2.5" fill="#207448"/>
      <circle cx="23" cy="14" r="2.5" fill="#207448"/>
      <polyline points="16,30 22,35 16,40" stroke-width="3"/>
      <line x1="26" y1="40" x2="36" y2="40" stroke-width="3"/>
    </g>
    <text x="150" y="520" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Request</text>
  </g>

  <!-- Arrow 1: Request -> Cost -->
  <line x1="250" y1="480" x2="305" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== NODE 2: Cost: tokens x context ==================== -->
  <g id="node-cost">
    <rect x="305" y="370" width="320" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <!-- Calculator / cost computation icon (56x56) -->
    <g transform="translate(437, 395)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="5" width="40" height="46" rx="6"/>
      <rect x="15" y="11" width="26" height="10" rx="2" stroke-width="3"/>
      <line x1="16" y1="29" x2="24" y2="29" stroke-width="3"/>
      <line x1="20" y1="25" x2="20" y2="33" stroke-width="3"/>
      <line x1="32" y1="26" x2="40" y2="32" stroke-width="3"/>
      <line x1="40" y1="26" x2="32" y2="32" stroke-width="3"/>
      <line x1="16" y1="42" x2="24" y2="42" stroke-width="3"/>
      <line x1="32" y1="39" x2="40" y2="39" stroke-width="3"/>
      <line x1="32" y1="44" x2="40" y2="44" stroke-width="3"/>
    </g>
    <text x="465" y="505" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="465" dy="0">Cost:</tspan>
      <tspan x="465" dy="40">tokens x context</tspan>
    </text>
  </g>

  <!-- Arrow 2: Cost -> Queues -->
  <line x1="625" y1="480" x2="680" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== NODE 3: Weighted fair queues ==================== -->
  <g id="node-queues">
    <rect x="680" y="370" width="250" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <!-- Queues / tiered buffer lanes icon (56x56) -->
    <g transform="translate(777, 395)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="10" rx="3" stroke-width="3"/>
      <circle cx="15" cy="13" r="2" fill="#207448"/>
      <circle cx="25" cy="13" r="2" fill="#207448"/>
      <circle cx="35" cy="13" r="2" fill="#207448"/>
      <circle cx="43" cy="13" r="2" fill="#207448"/>
      <rect x="6" y="23" width="44" height="10" rx="3" stroke-width="3"/>
      <circle cx="15" cy="28" r="2" fill="#207448"/>
      <circle cx="25" cy="28" r="2" fill="#207448"/>
      <circle cx="35" cy="28" r="2" fill="#207448"/>
      <rect x="6" y="38" width="44" height="10" rx="3" stroke-width="3"/>
      <circle cx="15" cy="43" r="2" fill="#207448"/>
    </g>
    <text x="805" y="505" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="805" dy="0">Weighted</tspan>
      <tspan x="805" dy="40">fair queues</tspan>
    </text>
  </g>

  <!-- Arrow 3: Queues -> Cap -->
  <line x1="930" y1="480" x2="985" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== NODE 4: Per-tenant KV cap (Orange highlight) ==================== -->
  <g id="node-cap">
    <rect x="985" y="370" width="250" height="220" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5"/>
    <!-- Security shield with quota cap bar icon (56x56) -->
    <g transform="translate(1082, 395)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z"/>
      <line x1="16" y1="26" x2="40" y2="26" stroke-width="3.5"/>
      <circle cx="28" cy="19" r="3" fill="#db8129"/>
      <path d="M 22 36 L 28 31 L 34 36" stroke-width="3"/>
    </g>
    <text x="1110" y="505" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1110" dy="0">Per-tenant</tspan>
      <tspan x="1110" dy="40">KV cap</tspan>
    </text>
  </g>

  <!-- Arrow 4: Cap -> Shared pool (orthogonally curved) -->
  <path d="M 1235 455 H 1255 A 15 15 0 0 0 1270 440 V 352 A 15 15 0 0 1 1285 337 H 1290" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- Arrow 5: Cap -> Long-context pool (orthogonally curved) -->
  <path d="M 1235 505 H 1255 A 15 15 0 0 1 1270 520 V 608 A 15 15 0 0 0 1285 623 H 1290" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== NODE 5: Shared pool ==================== -->
  <g id="node-shared-pool">
    <rect x="1290" y="230" width="260" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <!-- Processor chip icon (56x56) -->
    <g transform="translate(1392, 255)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4"/>
      <rect x="20" y="20" width="16" height="16" rx="2" stroke-width="3"/>
      <line x1="18" y1="4" x2="18" y2="12"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="38" y1="4" x2="38" y2="12"/>
      <line x1="18" y1="44" x2="18" y2="52"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="38" y1="44" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="12" y2="18"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="4" y1="38" x2="12" y2="38"/>
      <line x1="44" y1="18" x2="52" y2="18"/>
      <line x1="44" y1="28" x2="52" y2="28"/>
      <line x1="44" y1="38" x2="52" y2="38"/>
    </g>
    <text x="1420" y="380" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shared pool</text>
  </g>

  <!-- ==================== NODE 6: Long-context pool ==================== -->
  <g id="node-long-context-pool">
    <rect x="1290" y="515" width="260" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <!-- Storage / memory cylinder icon (56x56) -->
    <g transform="translate(1392, 540)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="7"/>
      <path d="M 8 14 V 27 C 8 31 17 34 28 34 C 39 34 48 31 48 27 V 14"/>
      <path d="M 8 27 V 40 C 8 44 17 47 28 47 C 39 44 48 44 48 40 V 27"/>
    </g>
    <text x="1420" y="645" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1420" dy="0">Long-context</tspan>
      <tspan x="1420" dy="40">pool</tspan>
    </text>
  </g>
</svg>