<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Training data storage for thousands of GPUs [report]</title>
  <desc>Architecture flowchart of training data storage tiers for thousands of GPUs, showing cold object store, hot parallel file system, node NVMe cache, GPU data loaders, and async checkpointing.</desc>

  <defs>
    <!-- Arrowhead Green (18px) -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Training data storage </tspan>
    <tspan x="800" dy="54">for thousands of GPUs [report]</tspan>
  </text>

  <!-- ==================== FLOW ARROWS ==================== -->
  <!-- 1. O to F (cold ingest to hot parallel FS) -->
  <line x1="500" y1="260" x2="590" y2="260" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- 2. F to O (checkpoint archive back to cold object store) -->
  <line x1="590" y1="360" x2="500" y2="360" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- 3. F to L (hot parallel FS to node NVMe cache) -->
  <line x1="1010" y1="310" x2="1100" y2="310" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- 4. L to G (node NVMe cache to GPU data loaders) -->
  <line x1="1310" y1="440" x2="1310" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- 5. G to K (GPU data loaders to async checkpoint) -->
  <line x1="1100" y1="700" x2="1010" y2="700" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- 6. K to F (async checkpoint write burst to parallel FS) -->
  <line x1="800" y1="570" x2="800" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- ==================== NODE 1: Object store: cold ==================== -->
  <g id="node-object-store">
    <rect x="80" y="180" width="420" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Storage Cylinder Icon (56px) -->
    <g transform="translate(262, 225)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="22" ry="8" />
      <path d="M 6 14 L 6 42 A 22 8 0 0 0 50 42 L 50 14" />
      <path d="M 6 28 A 22 8 0 0 0 50 28" />
    </g>
    <!-- Node Label -->
    <text x="290" y="365" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Object store: cold</text>
  </g>

  <!-- ==================== NODE 2: Parallel FS: hot ==================== -->
  <g id="node-parallel-fs">
    <rect x="590" y="180" width="420" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Parallel FS / Server Rack Icon (56px) -->
    <g transform="translate(772, 225)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="5" />
      <line x1="6" y1="20" x2="50" y2="20" stroke-width="3" />
      <line x1="6" y1="34" x2="50" y2="34" stroke-width="3" />
      <circle cx="14" cy="13" r="2.5" fill="#207448" stroke="none" />
      <circle cx="14" cy="27" r="2.5" fill="#207448" stroke="none" />
      <circle cx="14" cy="41" r="2.5" fill="#207448" stroke="none" />
      <line x1="24" y1="13" x2="42" y2="13" stroke-width="3" />
      <line x1="24" y1="27" x2="42" y2="27" stroke-width="3" />
      <line x1="24" y1="41" x2="42" y2="41" stroke-width="3" />
    </g>
    <!-- Node Label -->
    <text x="800" y="365" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Parallel FS: hot</text>
  </g>

  <!-- ==================== NODE 3: Node NVMe cache ==================== -->
  <g id="node-nvme-cache">
    <rect x="1100" y="180" width="420" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- NVMe Card Icon (56px) -->
    <g transform="translate(1282, 225)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="4" />
      <rect x="15" y="16" width="12" height="12" rx="2" stroke-width="3" />
      <rect x="31" y="16" width="12" height="24" rx="2" stroke-width="3" />
      <line x1="12" y1="46" x2="16" y2="46" stroke-width="4" />
      <line x1="20" y1="46" x2="24" y2="46" stroke-width="4" />
      <line x1="28" y1="46" x2="32" y2="46" stroke-width="4" />
      <circle cx="14" cy="16" r="1.5" fill="#207448" stroke="none" />
    </g>
    <!-- Node Label -->
    <text x="1310" y="365" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node NVMe cache</text>
  </g>

  <!-- ==================== NODE 4: GPU data loaders ==================== -->
  <g id="node-gpu-loaders">
    <rect x="1100" y="570" width="420" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- GPU Chip Icon (56px) -->
    <g transform="translate(1282, 615)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4" />
      <rect x="18" y="18" width="20" height="20" rx="2" fill="#e8f1ea" stroke-width="3" />
      <line x1="18" y1="4" x2="18" y2="10" />
      <line x1="28" y1="4" x2="28" y2="10" />
      <line x1="38" y1="4" x2="38" y2="10" />
      <line x1="18" y1="46" x2="18" y2="52" />
      <line x1="28" y1="46" x2="28" y2="52" />
      <line x1="38" y1="46" x2="38" y2="52" />
      <line x1="4" y1="18" x2="10" y2="18" />
      <line x1="4" y1="28" x2="10" y2="28" />
      <line x1="4" y1="38" x2="10" y2="38" />
      <line x1="46" y1="18" x2="52" y2="18" />
      <line x1="46" y1="28" x2="52" y2="28" />
      <line x1="46" y1="38" x2="52" y2="38" />
    </g>
    <!-- Node Label -->
    <text x="1310" y="755" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">GPU data loaders</text>
  </g>

  <!-- ==================== NODE 5: Async checkpoint (Orange Highlight) ==================== -->
  <g id="node-async-checkpoint">
    <rect x="590" y="570" width="420" height="260" rx="16" fill="#fffaf3" stroke="#db8129" stroke-width="3" />
    <!-- Async Checkpoint / Timer Snapshot Icon (56px) in Orange -->
    <g transform="translate(772, 615)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,28" stroke-width="3.5" />
      <path d="M 28 6 A 22 22 0 0 1 48 20" stroke-width="4" />
      <polyline points="44,12 48,20 40,22" stroke-width="3" />
    </g>
    <!-- Node Label -->
    <text x="800" y="755" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Async checkpoint</text>
  </g>
</svg>