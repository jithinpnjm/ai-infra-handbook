<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which engine is reading the braces in front of you</title>
  <desc>A comparison table of templating engines across DevOps tools showing their syntax, differences, and habits for clean templates.</desc>

  <!-- Canvas Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title: 48px bold -->
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which engine is reading the braces in front of you</text>

  <!-- ==================== TABLE ==================== -->
  <!-- Table Header -->
  <rect x="40" y="68" width="360" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="220" y="103" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Tool</text>
  <rect x="400" y="68" width="400" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Language</text>
  <rect x="800" y="68" width="760" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1180" y="103" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Notes</text>

  <!-- Row 1 -->
  <rect x="40" y="118" width="360" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="220" dy="0">Ansible, Salt,</tspan>
    <tspan x="220" dy="26">Cookiecutter, dbt</tspan>
  </text>
  <rect x="400" y="118" width="400" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="165" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Jinja2</text>
  <rect x="800" y="118" width="760" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="165" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">{{ }}, {% %}, filters</text>

  <!-- Row 2 -->
  <rect x="40" y="194" width="360" height="128" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="267" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Helm</text>
  <rect x="400" y="194" width="400" height="128" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="254" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="600" dy="0">Go text/template</tspan>
    <tspan x="600" dy="26">plus Sprig functions</tspan>
  </text>
  <rect x="800" y="194" width="760" height="128" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="228" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1180" dy="0">{{ .Values.image.tag | quote }},</tspan>
    <tspan x="1180" dy="26">{{- if .Values.gpu }},</tspan>
    <tspan x="1180" dy="26">{{ include "chart.fullname" . }},</tspan>
    <tspan x="1180" dy="26">toYaml | nindent 4; trim with {{- and -}}</tspan>
  </text>

  <!-- Row 3 -->
  <rect x="40" y="322" width="360" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="369" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Terraform or OpenTofu</text>
  <rect x="400" y="322" width="400" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="356" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="600" dy="0">HCL expressions and</tspan>
    <tspan x="600" dy="26">templatefile()</tspan>
  </text>
  <rect x="800" y="322" width="760" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="356" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1180" dy="0">"${var.name}", for expressions,</tspan>
    <tspan x="1180" dy="26">%{ if } directives</tspan>
  </text>

  <!-- Row 4 -->
  <rect x="40" y="398" width="360" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Kustomize</text>
  <rect x="400" y="398" width="400" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">no templating</text>
  <rect x="800" y="398" width="760" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="432" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1180" dy="0">overlays and patches</tspan>
    <tspan x="1180" dy="26">(JSON6902, strategic merge)</tspan>
  </text>

  <!-- Row 5 -->
  <rect x="40" y="474" width="360" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="508" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">GitHub Actions</text>
  <rect x="400" y="474" width="400" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="508" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">${{ expression }}</text>
  <rect x="800" y="474" width="760" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="508" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">different syntax and contexts</text>

  <!-- Row 6 -->
  <rect x="40" y="526" width="360" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="560" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Docker Compose</text>
  <rect x="400" y="526" width="400" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">${VAR:-default}</text>
  <rect x="800" y="526" width="760" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="560" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">shell-like</text>

  <!-- Row 7 -->
  <rect x="40" y="578" width="360" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">cloud-init</text>
  <rect x="400" y="578" width="400" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="612" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="600" dy="0">Jinja2 optional header</tspan>
    <tspan x="600" dy="26">## template: jinja</tspan>
  </text>
  <rect x="800" y="578" width="760" height="76" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="625" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">{{ v1.local_hostname }}</text>

  <!-- Row 8 -->
  <rect x="40" y="654" width="360" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="220" y="688" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Packer</text>
  <rect x="400" y="654" width="400" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="600" y="688" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">HCL2</text>
  <rect x="800" y="654" width="760" height="52" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1180" y="688" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">templatefile, locals</text>

  <!-- Row 9 (orange highlight for Prometheus and Alertmanager) -->
  <rect x="40" y="706" width="360" height="102" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
  <text x="220" y="753" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="220" dy="0">Prometheus and</tspan>
    <tspan x="220" dy="26">Alertmanager</tspan>
  </text>
  <rect x="400" y="706" width="400" height="102" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
  <text x="600" y="766" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Go templates</text>
  <rect x="800" y="706" width="760" height="102" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
  <text x="1180" y="740" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1180" dy="0" font-family="monospace">{{ $labels.instance }};</tspan>
    <tspan x="1180" dy="26">conflicts with Jinja in Ansible-templated</tspan>
    <tspan x="1180" dy="26">rule files: use raw</tspan>
  </text>

  <!-- Habits strip -->
  <rect x="40" y="826" width="1520" height="196" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Outline icon: Shield with checkmark (56x56) -->
  <g transform="translate(68, 896)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 4 L 50 12 L 50 28 C 50 42 28 52 28 52 C 28 52 6 42 6 28 L 6 12 Z" />
    <polyline points="18,28 25,35 38,20" />
  </g>
  <text x="146" y="861" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="146" dy="0">separate data from templates; keep templates light on logic;</tspan>
    <tspan x="146" dy="26">prefer declarative overlays such as Kustomize or typed config;</tspan>
    <tspan x="146" dy="26">avoid templating a templating language, such as Helm values</tspan>
    <tspan x="146" dy="26">rendered by Jinja then rendered again by Terraform;</tspan>
    <tspan x="146" dy="26">keep logic in code or modules, not 200-line Jinja files;</tspan>
    <tspan x="146" dy="26">validate generated YAML with yamllint, kubeconform or kubectl --dry-run=server</tspan>
  </text>

  <!-- Reviewer test -->
  <rect x="40" y="1038" width="1520" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <!-- Outline icon: Eye / inspection icon (56x56) -->
  <g transform="translate(68, 1048)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 28 C 14 14 42 14 50 28 C 42 42 14 42 6 28 Z" />
    <circle cx="28" cy="28" r="8" />
  </g>
  <text x="146" y="1084" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">could a reviewer understand the change without running anything?</text>

  <!-- Bottom Takeaway Bar -->
  <rect x="40" y="1130" width="1520" height="54" rx="8" fill="#207448" />
  <text x="800" y="1166" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The same double brace can mean three different things</text>
</svg>