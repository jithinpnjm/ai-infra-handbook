<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which failures to retry: methods, status codes and exceptions</title>
  <desc>Visual guide classifying retryable versus non-retryable HTTP methods, status codes, and exceptions, with tenacity policy configuration and jitter implementation.</desc>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Which failures to retry: </tspan>
    <tspan x="800" dy="54">methods, status codes and exceptions</tspan>
  </text>

  <!-- ==================== COLUMN 1: Retry (Green) ==================== -->
  <g id="col-retry">
    <rect x="40" y="130" width="480" height="625" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <!-- Refresh / Circular Retry Icon (56x56) -->
    <g transform="translate(65, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 44 24 A 18 18 0 1 0 46 32"/>
      <polyline points="44,14 44,25 33,25"/>
    </g>
    <text x="140" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Retry</text>

    <!-- Card 1: methods -->
    <rect x="65" y="215" width="430" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="85" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">methods: GET, PUT, DELETE, </tspan>
      <tspan x="85" dy="32">or a POST with an </tspan>
      <tspan x="85" dy="32">idempotency key</tspan>
    </text>

    <!-- Card 2: status codes -->
    <rect x="65" y="365" width="430" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="85" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">status codes: </tspan>
      <tspan x="85" dy="32">429, 502, 503, 504</tspan>
    </text>

    <!-- Card 3: exceptions -->
    <rect x="65" y="480" width="430" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="85" y="522" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">exceptions: </tspan>
      <tspan x="85" dy="30">httpx.ConnectError, </tspan>
      <tspan x="85" dy="30">ReadTimeout, </tspan>
      <tspan x="85" dy="30">ConnectTimeout, </tspan>
      <tspan x="85" dy="30">RemoteProtocolError</tspan>
    </text>
  </g>

  <!-- ==================== COLUMN 2: Never retry (Orange) ==================== -->
  <g id="col-never-retry">
    <rect x="560" y="130" width="480" height="625" rx="16" fill="#fff7f0" stroke="#db8129" stroke-width="2.5"/>
    
    <!-- Prohibited / Ban Icon (56x56) -->
    <g transform="translate(585, 145)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="20"/>
      <line x1="14" y1="14" x2="42" y2="42"/>
    </g>
    <text x="660" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#db8129">Never retry</text>

    <!-- Card 1: 4xx status codes -->
    <rect x="585" y="215" width="430" height="175" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="605" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="605" dy="0">status 400, 401, 403, 404, </tspan>
      <tspan x="605" dy="34">409: the answer will not </tspan>
      <tspan x="605" dy="34">change between attempts, </tspan>
      <tspan x="605" dy="34">retrying is a bug</tspan>
    </text>

    <!-- Card 2: POST without idempotency key -->
    <rect x="585" y="410" width="430" height="110" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="605" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="605" dy="0">POST without an </tspan>
      <tspan x="605" dy="34">idempotency key</tspan>
    </text>
  </g>

  <!-- ==================== COLUMN 3: Policy (Green) ==================== -->
  <g id="col-policy">
    <rect x="1080" y="130" width="480" height="625" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <!-- Policy / Sliders Icon (56x56) -->
    <g transform="translate(1105, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="16" x2="44" y2="16"/>
      <line x1="12" y1="28" x2="44" y2="28"/>
      <line x1="12" y1="40" x2="44" y2="40"/>
      <circle cx="22" cy="16" r="4" fill="#207448"/>
      <circle cx="34" cy="28" r="4" fill="#207448"/>
      <circle cx="18" cy="40" r="4" fill="#207448"/>
    </g>
    <text x="1180" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Policy</text>

    <!-- Card 1: retry_if_exception -->
    <rect x="1105" y="212" width="430" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1125" y="254" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="1125" dy="0">retry_if_exception(</tspan><tspan x="1125" dy="28">transient)</tspan></text>

    <!-- Card 2: wait_exponential_jitter -->
    <rect x="1105" y="312" width="430" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1125" y="354" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="1125" dy="0">wait_exponential_jitter(</tspan><tspan x="1125" dy="28">initial=0.5, max=20): </tspan><tspan x="1125" dy="28">0.5, 1, 2, 4 and so on, </tspan><tspan x="1125" dy="28">capped, with jitter</tspan></text>

    <!-- Card 3: stop_after -->
    <rect x="1105" y="470" width="430" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1125" y="512" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="1125" dy="0">stop_after_attempt(6) | </tspan><tspan x="1125" dy="28">stop_after_delay(60)</tspan></text>

    <!-- Card 4: before_sleep_log -->
    <rect x="1105" y="570" width="430" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1125" y="612" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="1125" dy="0">before_sleep_log(</tspan><tspan x="1125" dy="28">log, WARNING)</tspan></text>

    <!-- Card 5: reraise -->
    <rect x="1105" y="670" width="430" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1125" y="712" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">reraise=True</text>
  </g>

  <!-- ==================== RULE STRIP ==================== -->
  <g id="rule-strip">
    <rect x="40" y="775" width="1520" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Shield / Balance Icon (56x56) -->
    <g transform="translate(65, 785)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 L 48 16 C 48 36, 28 46, 28 48 C 28 46, 8 36, 8 16 Z"/>
      <path d="M 20 28 L 26 34 L 38 20"/>
    </g>
    <text x="800" y="822" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">honour Retry-After; cap both attempts and total time</text>
  </g>

  <!-- ==================== DEFINITIONS STRIP ==================== -->
  <g id="definitions-strip">
    <rect x="40" y="865" width="1520" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Book / Concept Icon (56x56) -->
    <g transform="translate(65, 887)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 14 C 18 10, 28 12, 28 12 C 28 12, 38 10, 48 14 V 42 C 38 38, 28 40, 28 40 C 28 40, 18 38, 8 42 Z"/>
      <line x1="28" y1="12" x2="28" y2="40"/>
    </g>
    <text x="145" y="907" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">backoff: each retry waits longer than the last; jitter: each client adds randomness </tspan>
      <tspan x="145" dy="32">so many clients that fail together do not retry in lockstep</tspan>
    </text>
  </g>

  <!-- ==================== FULL JITTER CODE (WITHOUT A LIBRARY) ==================== -->
  <g id="jitter-code">
    <rect x="40" y="980" width="1520" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Terminal / Code Icon (56x56) -->
    <g transform="translate(65, 989)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="38" rx="6"/>
      <polyline points="14,20 22,27 14,34"/>
      <line x1="26" y1="34" x2="38" y2="34"/>
    </g>
    <text x="800" y="1027" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" fill="#303a36">delay = min(cap, base * 2**attempt); sleep(random.uniform(0, delay))</text>
  </g>

  <!-- ==================== BOTTOM BAR ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="1070" width="1520" height="75" rx="14" fill="#207448"/>
    <text x="800" y="1117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The only 4xx worth retrying is 429</text>
  </g>
</svg>