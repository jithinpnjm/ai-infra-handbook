<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Why maxSurge 1 stalls a full GPU pool</title>
  <desc>Visual explanation of why maxSurge 1 stalls a full 12 GPU pool and how maxUnavailable 1 enables progress.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1120" fill="#f5f8f5" />

  <!-- Title -->
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why maxSurge 1 stalls a full GPU pool</text>

  <!-- Context Header Card -->
  <rect x="50" y="85" width="1500" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 95)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- GPU cluster rack outline icon (56x56) -->
    <rect x="4" y="4" width="48" height="48" rx="8" />
    <line x1="4" y1="20" x2="52" y2="20" />
    <line x1="4" y1="36" x2="52" y2="36" />
    <circle cx="14" cy="12" r="3" fill="#207448" />
    <circle cx="24" cy="12" r="3" fill="#207448" />
    <circle cx="14" cy="28" r="3" fill="#207448" />
    <circle cx="24" cy="28" r="3" fill="#207448" />
    <circle cx="14" cy="44" r="3" fill="#207448" />
    <circle cx="24" cy="44" r="3" fill="#207448" />
  </g>
  <text x="160" y="132" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Worked example with a node pool of 12 GPUs</text>

  <!-- ==================== LEFT PANEL ==================== -->
  <rect x="50" y="180" width="720" height="800" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <path d="M 50 196 A 16 16 0 0 1 66 180 L 754 180 A 16 16 0 0 1 770 196 L 770 245 L 50 245 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="410" y="224" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">maxSurge 1, maxUnavailable 0</text>

  <!-- Left Box 1: 3 replicas of 4 GPUs each fill all 12 GPUs -->
  <rect x="75" y="265" width="670" height="75" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(95, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="6" />
    <line x1="20" y1="4" x2="20" y2="52" />
    <line x1="36" y1="4" x2="36" y2="52" />
  </g>
  <text x="175" y="311" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">3 replicas of 4 GPUs each fill all 12 GPUs</text>

  <!-- Arrow L1 -> L2 -->
  <line x1="410" y1="340" x2="410" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Left Box 2: the controller must start a fourth pod first -->
  <rect x="75" y="365" width="670" height="75" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(95, 375)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Controller gear icon (56x56) -->
    <circle cx="28" cy="28" r="14" />
    <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
  </g>
  <text x="175" y="411" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">the controller must start a fourth pod first</text>

  <!-- Arrow L2 -> L3 -->
  <line x1="410" y1="440" x2="410" y2="465" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Left Box 3 (Orange highlight): it needs 4 GPUs that do not exist -->
  <g stroke="#db8129">
    <rect x="75" y="465" width="670" height="75" rx="12" fill="#fef8f2" stroke-width="3" />
    <g transform="translate(95, 475)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Warning / missing capacity icon (56x56) -->
      <polygon points="28,6 50,48 6,48" />
      <line x1="28" y1="20" x2="28" y2="34" />
      <line x1="28" y1="40" x2="28" y2="43" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
  <text x="175" y="511" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">it needs 4 GPUs that do not exist</text>

  <!-- Arrow L3 -> L4 -->
  <line x1="410" y1="540" x2="410" y2="565" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Left Box 4: pod stays Pending with message '0/N nodes are available: Insufficient nvidia.com/gpu' -->
  <rect x="75" y="565" width="670" height="130" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(95, 602)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock / hourglass icon (56x56) -->
    <circle cx="28" cy="28" r="22" />
    <polyline points="28,14 28,28 38,28" />
  </g>
  <text x="175" y="605" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="175" dy="0">pod stays Pending with message </tspan>
    <tspan x="175" dy="34" font-family="monospace" font-size="24">'0/N nodes are available: </tspan>
    <tspan x="175" dy="32" font-family="monospace" font-size="24">Insufficient nvidia.com/gpu'</tspan>
  </text>

  <!-- Arrow L4 -> L5 -->
  <line x1="410" y1="695" x2="410" y2="720" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Left Box 5: maxUnavailable 0 forbids removing an old pod until a replacement is Ready -->
  <rect x="75" y="720" width="670" height="115" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(95, 750)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield / rule lock icon (56x56) -->
    <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
    <line x1="20" y1="26" x2="36" y2="26" />
  </g>
  <text x="175" y="756" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="175" dy="0">maxUnavailable 0 forbids removing </tspan>
    <tspan x="175" dy="34">an old pod until a replacement </tspan>
    <tspan x="175" dy="34">is Ready</tspan>
  </text>

  <!-- Arrow L5 -> L6 -->
  <line x1="410" y1="835" x2="410" y2="860" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Left Box 6 (Red outcome): rollout hangs -->
  <rect x="75" y="860" width="670" height="85" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
  <g transform="translate(95, 875)" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Octagonal stop icon (56x56) -->
    <polygon points="16,6 40,6 50,16 50,40 40,50 16,50 6,40 6,16" />
    <line x1="18" y1="18" x2="38" y2="38" />
    <line x1="38" y1="18" x2="18" y2="38" />
  </g>
  <text x="175" y="913" font-family="sans-serif" font-size="30" font-weight="bold" fill="#dc2626">rollout hangs</text>

  <!-- ==================== RIGHT PANEL ==================== -->
  <rect x="830" y="180" width="720" height="800" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <path d="M 830 196 A 16 16 0 0 1 846 180 L 1534 180 A 16 16 0 0 1 1550 196 L 1550 245 L 830 245 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1190" y="224" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">maxSurge 0, maxUnavailable 1</text>

  <!-- Right Box 1: one old replica terminates first -->
  <rect x="855" y="265" width="670" height="80" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(875, 277)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Terminate / minus-in-circle icon (56x56) -->
    <circle cx="28" cy="28" r="22" />
    <line x1="16" y1="28" x2="40" y2="28" />
  </g>
  <text x="955" y="315" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">one old replica terminates first</text>

  <!-- Arrow R1 -> R2 -->
  <line x1="1190" y1="345" x2="1190" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Right Box 2: frees 4 GPUs -->
  <rect x="855" y="380" width="670" height="80" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(875, 392)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Unlocked / freed resource icon (56x56) -->
    <rect x="10" y="22" width="36" height="26" rx="4" />
    <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22" />
  </g>
  <text x="955" y="430" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">frees 4 GPUs</text>

  <!-- Arrow R2 -> R3 -->
  <line x1="1190" y1="460" x2="1190" y2="495" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Right Box 3: the new replica schedules -->
  <rect x="855" y="495" width="670" height="80" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(875, 507)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plus / scheduled pod icon (56x56) -->
    <circle cx="28" cy="28" r="22" />
    <line x1="16" y1="28" x2="40" y2="28" />
    <line x1="28" y1="16" x2="28" y2="40" />
  </g>
  <text x="955" y="545" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">the new replica schedules</text>

  <!-- Arrow R3 -> R4 -->
  <line x1="1190" y1="575" x2="1190" y2="610" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Right Box 4: repeat -->
  <rect x="855" y="610" width="670" height="80" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <g transform="translate(875, 622)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Repeat cycle icon (56x56) -->
    <path d="M 12 28 A 16 16 0 1 1 28 44" />
    <polyline points="28,36 28,44 36,44" />
  </g>
  <text x="955" y="660" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">repeat</text>

  <!-- Arrow R4 -> R5 -->
  <line x1="1190" y1="690" x2="1190" y2="745" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Right Box 5 (Green outcome): rollout completes with temporarily 2 of 3 serving -->
  <rect x="855" y="745" width="670" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <g transform="translate(875, 817)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Success checkmark circle icon (56x56) -->
    <circle cx="28" cy="28" r="22" />
    <polyline points="18,28 25,35 38,20" />
  </g>
  <text x="955" y="835" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="955" dy="0">rollout completes with </tspan>
    <tspan x="955" dy="38">temporarily 2 of 3 serving</tspan>
  </text>

  <!-- ==================== FOOTER ==================== -->
  <rect x="50" y="1005" width="1500" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 1015)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock / timer icon (56x56) -->
    <circle cx="28" cy="28" r="22" />
    <polyline points="28,14 28,28 38,28" />
    <path d="M 22 2 L 34 2" />
  </g>
  <text x="160" y="1052" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">progressDeadlineSeconds 1800 because model downloads and CUDA graph capture are slow</text>
</svg>