<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>A lossless Ethernet class needs every piece set the same, end to end</title>
  <desc>A lossless Ethernet class needs every piece set the same, end to end: network chain, checklist, failure modes, InfiniBand contrast, and rail-optimised fabric.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1170" fill="#f5f8f5" />
  <!-- 1. Title -->
  <text x="40" y="86" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">A lossless Ethernet class needs</tspan>
    <tspan x="40" dy="54">every piece set the same, end to end</tspan>
  </text>
  <!-- Checklist Container -->
  <rect x="40" y="175" width="980" height="395" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="55" y="190" width="950" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="223" r="14" fill="#207448" /><path d="M 79 223 L 83 228 L 92 218" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="217" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">PFC (802.1Qbb) for the RoCE priority, on the NIC and on</tspan>
    <tspan x="115" dy="28">every switch</tspan>
  </text>
  <rect x="55" y="266" width="950" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="290" r="14" fill="#207448" /><path d="M 79 290 L 83 295 L 92 285" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="298" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">ECN marking with DCQCN or similar rate control</tspan>
  </text>
  <rect x="55" y="324" width="950" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="348" r="14" fill="#207448" /><path d="M 79 348 L 83 353 L 92 343" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="356" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">DSCP and PCP trust and mapping set correctly</tspan>
  </text>
  <rect x="55" y="382" width="950" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="415" r="14" fill="#207448" /><path d="M 79 415 L 83 420 L 92 410" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="409" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">buffer allocation and headroom sized for each port speed</tspan>
    <tspan x="115" dy="28">and cable length</tspan>
  </text>
  <rect x="55" y="458" width="950" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="507" r="14" fill="#207448" /><path d="M 79 507 L 83 512 L 92 502" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="485" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">per-port counters watched: CRC, FEC uncorrected, symbol</tspan>
    <tspan x="115" dy="28">errors, PFC pause counts per priority, ECN-marked packets,</tspan>
    <tspan x="115" dy="28">buffer occupancy, link flaps, optical power (DOM)</tspan>
  </text>
  <!-- Node 1: NIC -->
  <rect x="40" y="590" width="150" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(87, 610)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="40" rx="4" />
    <line x1="14" y1="44" x2="14" y2="52" /><line x1="22" y1="44" x2="22" y2="52" /><line x1="30" y1="44" x2="30" y2="52" /><line x1="38" y1="44" x2="38" y2="52" />
    <circle cx="28" cy="24" r="8" />
  </g>
  <text x="115" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="115" dy="0">NIC</tspan>
  </text>
  <line x1="190" y1="692.5" x2="247.5" y2="692.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 2: Leaf switch port -->
  <rect x="247.5" y="590" width="150" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(294.5, 606)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="34" rx="4" />
    <line x1="12" y1="25" x2="44" y2="25" />
    <polyline points="18,19 12,25 18,31" />
    <polyline points="38,19 44,25 38,31" />
  </g>
  <text x="322.5" y="695" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="322.5" dy="0">Leaf</tspan>
    <tspan x="322.5" dy="34">switch</tspan>
    <tspan x="322.5" dy="34">port</tspan>
  </text>
  <line x1="397.5" y1="692.5" x2="455" y2="692.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 3: Spine switch port -->
  <rect x="455" y="590" width="150" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(502, 606)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="38" rx="4" />
    <line x1="12" y1="18" x2="44" y2="18" /><line x1="12" y1="32" x2="44" y2="32" />
    <circle cx="28" cy="25" r="4" fill="#207448" />
  </g>
  <text x="530" y="695" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="530" dy="0">Spine</tspan>
    <tspan x="530" dy="34">switch</tspan>
    <tspan x="530" dy="34">port</tspan>
  </text>
  <line x1="605" y1="692.5" x2="662.5" y2="692.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 4: Leaf switch port -->
  <rect x="662.5" y="590" width="150" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(709.5, 606)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="34" rx="4" />
    <line x1="12" y1="25" x2="44" y2="25" />
    <polyline points="18,19 12,25 18,31" />
    <polyline points="38,19 44,25 38,31" />
  </g>
  <text x="737.5" y="695" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="737.5" dy="0">Leaf</tspan>
    <tspan x="737.5" dy="34">switch</tspan>
    <tspan x="737.5" dy="34">port</tspan>
  </text>
  <line x1="812.5" y1="692.5" x2="870" y2="692.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 5: NIC -->
  <rect x="870" y="590" width="150" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(917, 610)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="40" rx="4" />
    <line x1="14" y1="44" x2="14" y2="52" /><line x1="22" y1="44" x2="22" y2="52" /><line x1="30" y1="44" x2="30" y2="52" /><line x1="38" y1="44" x2="38" y2="52" />
    <circle cx="28" cy="24" r="8" />
  </g>
  <text x="945" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="945" dy="0">NIC</tspan>
  </text>
  <!-- Bar spanning chain -->
  <rect x="40" y="812" width="980" height="55" rx="10" fill="#207448" />
  <text x="530" y="847" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="530" dy="0">the lossless class works only end to end</tspan>
  </text>
  <!-- Right Panel: Failure modes -->
  <rect x="1060" y="175" width="500" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="1078" y="190" width="464" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <line x1="1102" y1="210" x2="1102" y2="300" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="1126" y="235" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">PFC missing on one switch</tspan>
    <tspan x="1126" dy="32">port: drops, and RDMA</tspan>
    <tspan x="1126" dy="32">retransmits are costly</tspan>
  </text>
  <rect x="1078" y="345" width="464" height="150" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <line x1="1102" y1="375" x2="1102" y2="465" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <text x="1126" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1126" dy="0">misconfigured the other</tspan>
    <tspan x="1126" dy="32">way: pause storms and</tspan>
    <tspan x="1126" dy="32">deadlocks</tspan>
  </text>
  <!-- Side Contrast: InfiniBand -->
  <rect x="1060" y="535" width="500" height="332" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1282, 548)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="38" rx="6" />
    <path d="M 14 25 C 20 17, 36 17, 42 25" />
    <path d="M 14 25 C 20 33, 36 33, 42 25" />
  </g>
  <text x="1100" y="632" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">InfiniBand: credit-based</tspan>
    <tspan x="1100" dy="30">flow control per virtual</tspan>
    <tspan x="1100" dy="30">lane, lossless by</tspan>
    <tspan x="1100" dy="30">construction; LIDs and GIDs</tspan>
    <tspan x="1100" dy="30">replace MACs and IPs; the</tspan>
    <tspan x="1100" dy="30">Subnet Manager programs</tspan>
    <tspan x="1100" dy="30">forwarding tables</tspan>
  </text>
  <!-- Footer: Rail-optimised -->
  <rect x="40" y="887" width="1520" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(65, 937)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="6" />
    <circle cx="28" cy="28" r="12" />
    <line x1="28" y1="4" x2="28" y2="16" /><line x1="28" y1="40" x2="28" y2="52" />
    <line x1="4" y1="28" x2="16" y2="28" /><line x1="40" y1="28" x2="52" y2="28" />
  </g>
  <text x="140" y="934" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" dy="0">Rail-optimised: one NIC per GPU, often its own subnet, VLAN or VRF; 8 x 400G back end; a single</tspan>
    <tspan x="140" dy="34">x4 link at 100G instead of 400G slows the whole job because collectives move at the speed of</tspan>
    <tspan x="140" dy="34">the slowest participant</tspan>
  </text>
  <!-- Bottom Takeaway Bar -->
  <rect x="40" y="1067" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="1105" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="800" dy="0">Treat a PFC change on one switch as a change to the whole fabric</tspan>
  </text>
</svg>