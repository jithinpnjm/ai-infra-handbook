<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Read the vmstat columns to classify the bottleneck</title>
  <desc>A decision tree for diagnosing system bottlenecks by reading vmstat columns across multiple lines.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Read the vmstat columns to classify the bottleneck</text>
  <!-- Root Box -->
  <rect x="60" y="125" width="1480" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <g transform="translate(85, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="56" rx="6" />
    <polyline points="14,20 24,28 14,36" />
    <line x1="28" y1="36" x2="42" y2="36" />
  </g>
  <text x="165" y="166" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Run vmstat 2 and start at line 2</text>
  <text x="165" y="200" font-family="sans-serif" font-size="24" fill="#303a36">Line 1 is the average since boot</text>
  <!-- Branch 1 -->
  <path d="M 280 221 L 280 305" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="310" y="255" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="310" dy="0">All idle: id about 99,</tspan>
    <tspan x="310" dy="28">si and so at 0</tspan>
  </text>
  <rect x="220" y="305" width="540" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    <g transform="translate(240, 317)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 C 48 34 38 46 28 50 C 18 46 8 34 8 14 Z" />
      <polyline points="18,28 25,35 38,20" />
    </g>
  <text x="315" y="355" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Healthy</text>
  <!-- Branch 2 -->
  <path d="M 160 221 L 160 425 L 280 425 L 280 475" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="310" y="445" font-family="sans-serif" font-size="24" fill="#303a36">High us, low wa</text>
  <rect x="220" y="475" width="540" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <g transform="translate(240, 487)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <line x1="20" y1="4" x2="20" y2="12" />
      <line x1="28" y1="4" x2="28" y2="12" />
      <line x1="36" y1="4" x2="36" y2="12" />
      <line x1="20" y1="44" x2="20" y2="52" />
      <line x1="28" y1="44" x2="28" y2="52" />
      <line x1="36" y1="44" x2="36" y2="52" />
      <line x1="4" y1="20" x2="12" y2="20" />
      <line x1="4" y1="28" x2="12" y2="28" />
      <line x1="4" y1="36" x2="12" y2="36" />
      <line x1="44" y1="20" x2="52" y2="20" />
      <line x1="44" y1="28" x2="52" y2="28" />
      <line x1="44" y1="36" x2="52" y2="36" />
    </g>
  <text x="315" y="525" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU-bound compute</text>
  <!-- Branch 3 -->
  <path d="M 115 221 L 115 595 L 280 595 L 280 650" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="310" y="615" font-family="sans-serif" font-size="24" fill="#303a36">High wa and b</text>
  <rect x="220" y="650" width="540" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <g transform="translate(240, 680)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="8" />
      <path d="M 8 14 L 8 42 C 8 46 17 50 28 50 C 39 50 48 46 48 42 L 48 14" />
      <path d="M 8 28 C 8 32 17 36 28 36 C 39 36 48 32 48 28" />
    </g>
  <text x="315" y="700" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="315" dy="0">I/O-bound work: </tspan>
    <tspan x="315" dy="36">look at iostat</tspan>
  </text>
  <!-- Branch 4 -->
  <path d="M 70 221 L 70 810 L 280 810 L 280 865" stroke="#db8129" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" />
  <text x="310" y="810" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="310" dy="0">Growing so, </tspan>
    <tspan x="310" dy="28">falling free or cache</tspan>
  </text>
  <rect x="220" y="865" width="540" height="120" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />

    <g transform="translate(240, 897)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="44" height="28" rx="3" />
      <line x1="12" y1="22" x2="16" y2="22" />
      <line x1="22" y1="22" x2="26" y2="22" />
      <line x1="32" y1="22" x2="36" y2="22" />
      <line x1="10" y1="42" x2="10" y2="48" />
      <line x1="16" y1="42" x2="16" y2="48" />
      <line x1="22" y1="42" x2="22" y2="48" />
      <line x1="28" y1="42" x2="28" y2="48" />
      <line x1="34" y1="42" x2="34" y2="48" />
      <line x1="40" y1="42" x2="40" y2="48" />
    </g>
  <text x="315" y="917" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="315" dy="0">Memory exhausted: </tspan>
    <tspan x="315" dy="36">kernel is paging out</tspan>
  </text>
  <!-- Branch 5 -->
  <path d="M 900 221 L 900 320" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="930" y="265" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="930" dy="0">High r with </tspan>
    <tspan x="930" dy="28">high us plus sy</tspan>
  </text>
  <rect x="840" y="320" width="540" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <g transform="translate(860, 332)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="16" width="24" height="24" rx="4" />
      <path d="M 40 12 L 48 12 L 48 20" />
      <line x1="36" y1="24" x2="48" y2="12" />
      <path d="M 40 44 L 48 44 L 48 36" />
      <line x1="36" y1="32" x2="48" y2="44" />
    </g>
  <text x="935" y="370" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU contention</text>
  <!-- Branch 6 -->
  <path d="M 1435 221 L 1435 475 L 900 475 L 900 535" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="930" y="495" font-family="sans-serif" font-size="24" fill="#303a36">High sy and cs</text>
  <rect x="840" y="535" width="540" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <g transform="translate(860, 565)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="22" width="36" height="26" rx="4" />
      <path d="M 18 22 L 18 14 C 18 8 38 8 38 14 L 38 22" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
    </g>
  <text x="935" y="585" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="935" dy="0">Many system calls </tspan>
    <tspan x="935" dy="36">or lock contention</tspan>
  </text>
  <!-- Branch 7 -->
  <path d="M 1490 221 L 1490 730 L 900 730 L 900 790" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="930" y="750" font-family="sans-serif" font-size="24" fill="#303a36">High st</text>
  <rect x="840" y="790" width="540" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <g transform="translate(860, 822)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="32" height="26" rx="3" />
      <rect x="18" y="20" width="32" height="26" rx="3" />
      <line x1="18" y1="28" x2="50" y2="28" />
      <line x1="6" y1="16" x2="38" y2="16" />
    </g>
  <text x="935" y="842" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="935" dy="0">Noisy neighbours </tspan>
    <tspan x="935" dy="36">on a shared VM</tspan>
  </text>
  <!-- Takeaway Bar -->
  <rect x="60" y="1095" width="1480" height="65" rx="8" fill="#207448" />
  <text x="800" y="1136" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Read the trend across several lines, not one number.</text>
</svg>