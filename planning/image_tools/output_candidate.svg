<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Which startup stage produced this error message</title>
  <desc>Visual infographic mapping Linux startup errors to six execution pipeline stages with diagnostics.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1600" height="1180" fill="#f5f8f5" />
  <!-- Title -->
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which startup stage produced this error message</text>
  <!-- Stage 1 -->
  <g id="stage-1">
    <rect x="40" y="96" width="180" height="250" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="70" cy="126" r="20" fill="#207448" />
    <text x="70" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(132, 106)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="40" rx="6" />
      <line x1="0" y1="12" x2="56" y2="12" stroke-width="2.5" />
      <polyline points="10,22 18,27 10,32" stroke-width="3" />
      <line x1="24" y1="32" x2="38" y2="32" stroke-width="3" />
    </g>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="130" y="210">shell fork </tspan>
      <tspan x="130" dy="32">and execve</tspan>
    </text>
  </g>
  <line x1="220" y1="221" x2="244" y2="221" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Stage 2 -->
  <g id="stage-2">
    <rect x="244" y="96" width="236" height="250" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="274" cy="126" r="20" fill="#207448" />
    <text x="274" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(404, 103)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 6 H 42 V 26 C 42 38 24 46 24 46 C 24 46 6 38 6 26 Z" />
      <polyline points="15,24 21,30 33,18" stroke-width="3" />
    </g>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="362" y="180">kernel checks </tspan>
      <tspan x="362" dy="30">the file and </tspan>
      <tspan x="362" dy="30">picks a </tspan>
      <tspan x="362" dy="30">format handler</tspan>
    </text>
  </g>
  <line x1="480" y1="221" x2="504" y2="221" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Stage 3 -->
  <g id="stage-3">
    <rect x="504" y="96" width="190" height="250" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="534" cy="126" r="20" fill="#207448" />
    <text x="534" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(628, 105)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="10" rx="3" />
      <rect x="4" y="20" width="40" height="10" rx="3" />
      <rect x="4" y="34" width="40" height="10" rx="3" />
    </g>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="599" y="170">ELF loader </tspan>
      <tspan x="599" dy="28">maps LOAD </tspan>
      <tspan x="599" dy="28">segments, </tspan>
      <tspan x="599" dy="28">builds the </tspan>
      <tspan x="599" dy="28">stack</tspan>
    </text>
  </g>
  <line x1="694" y1="221" x2="720" y2="221" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Stage 4 -->
  <g id="stage-4">
    <rect x="720" y="96" width="236" height="250" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="750" cy="126" r="20" fill="#207448" />
    <text x="750" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(884, 105)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="22" height="14" rx="4" />
      <rect x="18" y="24" width="22" height="14" rx="4" />
      <line x1="18" y1="18" x2="28" y2="28" stroke-width="3" />
    </g>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="838" y="166">PT_INTERP: </tspan>
      <tspan x="838" dy="26">kernel maps </tspan>
      <tspan x="838" dy="26">ld.so, </tspan>
      <tspan x="838" dy="26">execution </tspan>
      <tspan x="838" dy="26">starts in the </tspan>
      <tspan x="838" dy="26">dynamic linker</tspan>
    </text>
  </g>
  <line x1="956" y1="221" x2="982" y2="221" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Stage 5 (Orange Column Highlight) -->
  <g id="stage-5">
    <rect x="982" y="96" width="250" height="250" rx="14" fill="#fff5ea" stroke="#db8129" stroke-width="3" />
    <circle cx="1014" cy="126" r="20" fill="#db8129" />
    <text x="1014" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(1160, 105)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="10" height="34" rx="2" />
      <rect x="20" y="6" width="10" height="34" rx="2" />
      <path d="M 34 10 L 42 38" />
    </g>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1107" y="172">ld.so loads </tspan>
      <tspan x="1107" dy="28">DT_NEEDED </tspan>
      <tspan x="1107" dy="28">libraries, </tspan>
      <tspan x="1107" dy="28">relocates, runs </tspan>
      <tspan x="1107" dy="28">constructors</tspan>
    </text>
  </g>
  <line x1="1232" y1="221" x2="1264" y2="221" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Stage 6 -->
  <g id="stage-6">
    <rect x="1264" y="96" width="296" height="250" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="1296" cy="126" r="20" fill="#207448" />
    <text x="1296" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <g transform="translate(1488, 105)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="32" height="32" rx="4" />
      <polygon points="20,18 32,24 20,30" fill="#207448" stroke="none" />
    </g>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1412" y="196">_start, </tspan>
      <tspan x="1412" dy="34">__libc_start_main, </tspan>
      <tspan x="1412" dy="34">main</tspan>
    </text>
  </g>
  <!-- Transition Bracket connecting Stage 1 and Stage 2 to Column 1 -->
  <path d="M 130 346 V 366 H 362 V 346" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="220" y1="366" x2="220" y2="390" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Transition Arrow to Column 2 -->
  <path d="M 838 346 V 368 H 610 V 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Transition Arrow to Column 3 (Orange) -->
  <line x1="1000" y1="346" x2="1000" y2="390" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <!-- Transition Arrow to Column 4 -->
  <line x1="1390" y1="346" x2="1390" y2="390" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Column 1 (Stage 1/2) -->
  <g id="column-1">
    <rect x="40" y="390" width="360" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <rect x="58" y="414" width="324" height="216" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="220" y="448">Exec format error </tspan>
      <tspan x="220" dy="30">(wrong CPU </tspan>
      <tspan x="220" dy="30">architecture such </tspan>
      <tspan x="220" dy="30">as x86-64 on </tspan>
      <tspan x="220" dy="30">aarch64, or a script </tspan>
      <tspan x="220" dy="30">without shebang)</tspan>
    </text>
    <rect x="58" y="650" width="324" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="220" y="690">exit 126 found but </tspan>
      <tspan x="220" dy="32">not executable</tspan>
    </text>
    <rect x="58" y="762" width="324" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="220" y="805" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">exit 127 not found</text>
    <line x1="220" y1="850" x2="220" y2="990" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
    <rect x="58" y="990" width="324" height="116" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="220" y="1056" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">file and readelf -h</text>
  </g>
  <!-- Column 2 (Stage 4) -->
  <g id="column-2">
    <rect x="440" y="390" width="340" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <rect x="456" y="414" width="308" height="340" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="610" y="450">bad ELF </tspan>
      <tspan x="610" dy="30">interpreter / </tspan>
      <tspan x="610" dy="30">not found for </tspan>
      <tspan x="610" dy="30">a file that exists </tspan>
      <tspan x="610" dy="30">(glibc binary on </tspan>
      <tspan x="610" dy="30">Alpine musl: </tspan>
      <tspan x="610" dy="30" font-family="monospace">/lib64/ld-linux-</tspan><tspan x="610" dy="30" font-family="monospace">x86-64.so.2 </tspan>
      <tspan x="610" dy="30">missing)</tspan>
    </text>
    <line x1="610" y1="800" x2="610" y2="990" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
    <rect x="456" y="990" width="308" height="116" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="610" y="1042">readelf -l | </tspan>
      <tspan x="610" dy="32">grep interpreter</tspan>
    </text>
  </g>
  <!-- Column 3 (Stage 5 - Orange Highlight) -->
  <g id="column-3">
    <rect x="820" y="390" width="360" height="740" rx="16" fill="#fff5ea" stroke="#db8129" stroke-width="3" />
    <rect x="838" y="414" width="324" height="114" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1000" y="446">libcuda.so.1: cannot </tspan>
      <tspan x="1000" dy="30">open shared </tspan>
      <tspan x="1000" dy="30">object file</tspan>
    </text>
    <rect x="838" y="542" width="324" height="114" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1000" y="574">error while loading </tspan>
      <tspan x="1000" dy="30">shared libraries: </tspan>
      <tspan x="1000" dy="30" font-family="monospace">libnccl.so.2</tspan>
    </text>
    <rect x="838" y="670" width="324" height="110" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1000" y="702">version </tspan>
      <tspan x="1000" dy="30">GLIBC_2.34 </tspan>
      <tspan x="1000" dy="30">not found</tspan>
    </text>
    <rect x="838" y="794" width="324" height="110" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1000" y="826">version </tspan>
      <tspan x="1000" dy="30">GLIBCXX_3.4.30 </tspan>
      <tspan x="1000" dy="30">not found</tspan>
    </text>
    <line x1="1000" y1="918" x2="1000" y2="990" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-orange)" />
    <rect x="838" y="990" width="324" height="116" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="1000" y="1042">ldd, ldconfig -p, </tspan>
      <tspan x="1000" dy="32">LD_DEBUG=libs</tspan>
    </text>
  </g>
  <!-- Column 4 (Stage 6 and after) -->
  <g id="column-4">
    <rect x="1220" y="390" width="340" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <rect x="1236" y="414" width="308" height="196" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1390" y="448">CUDA error: no </tspan>
      <tspan x="1390" dy="30">kernel image is </tspan>
      <tspan x="1390" dy="30">available for </tspan>
      <tspan x="1390" dy="30">execution on </tspan>
      <tspan x="1390" dy="30">the device</tspan>
    </text>
    <rect x="1236" y="626" width="308" height="136" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1390" y="666">Illegal </tspan>
      <tspan x="1390" dy="30">instruction </tspan>
      <tspan x="1390" dy="30">(SIGILL, exit 132)</tspan>
    </text>
    <rect x="1236" y="776" width="308" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1390" y="818" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">segfault exit 139</text>
    <line x1="1390" y1="864" x2="1390" y2="990" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
    <rect x="1236" y="990" width="308" height="116" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="1390" y="1042">strace -f for the </tspan>
      <tspan x="1390" dy="32">last failed call</tspan>
    </text>
  </g>
</svg>