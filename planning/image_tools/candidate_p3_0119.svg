<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Why a container ignores SIGTERM: PID 1 has no default signal actions</title>
  <desc>Visual infographic explaining why PID 1 in a container ignores SIGTERM without a handler and comparing shell vs exec with the three PID 1 rules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>
  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Why a container ignores SIGTERM: </tspan>
    <tspan x="800" dy="54">PID 1 has no default signal actions</tspan>
  </text>
  <!-- Trigger Origin -->
  <g id="trigger-origin">
    <rect x="40" y="145" width="240" height="395" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(132, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14"/>
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12"/>
    </g>
    <text x="160" y="335" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="160" dy="0">docker stop or </tspan>
      <tspan x="160" dy="32">kubelet sends </tspan>
      <tspan x="160" dy="32">SIGTERM</tspan>
    </text>
  </g>
  <!-- Trigger to Track 1 -->
  <line x1="280" y1="260" x2="325" y2="260" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <!-- Trigger to Track 2 -->
  <line x1="280" y1="465" x2="325" y2="465" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <!-- Track 1 Container -->
  <g id="track-1">
    <rect x="310" y="145" width="1250" height="195" rx="14" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(330, 156)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="36" height="26" rx="4"/>
      <polyline points="8,12 14,17 8,22"/>
      <line x1="18" y1="22" x2="26" y2="22"/>
    </g>
    <text x="385" y="179" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Shell script as PID 1, no SIGTERM handler</text>
    <rect x="325" y="194" width="330" height="132" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="490" y="230" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="490" dy="0">PID 1 has no default </tspan>
      <tspan x="490" dy="26">action, so with no </tspan>
      <tspan x="490" dy="26">handler the signal </tspan>
      <tspan x="490" dy="26">is ignored</tspan>
    </text>
    <line x1="655" y1="260" x2="680" y2="260" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
    <rect x="680" y="194" width="270" height="132" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="815" y="230" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="815" dy="0">grace period, 30 </tspan>
      <tspan x="815" dy="26">seconds in </tspan>
      <tspan x="815" dy="26">Kubernetes </tspan>
      <tspan x="815" dy="26">by default</tspan>
    </text>
    <line x1="950" y1="260" x2="975" y2="260" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
    <rect x="975" y="194" width="265" height="132" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1107.5" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1107.5" dy="0">SIGKILL from the </tspan>
      <tspan x="1107.5" dy="32">parent namespace</tspan>
    </text>
    <line x1="1240" y1="260" x2="1265" y2="260" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
    <rect x="1265" y="194" width="295" height="132" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1412.5" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1412.5" dy="0">training job loses </tspan>
      <tspan x="1412.5" dy="30">its chance to </tspan>
      <tspan x="1412.5" dy="30">checkpoint</tspan>
    </text>
  </g>
  <!-- Track 2 Container -->
  <g id="track-2">
    <rect x="310" y="355" width="1250" height="185" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(330, 366)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="14"/>
      <polygon points="14,11 26,18 14,25" fill="#207448"/>
    </g>
    <text x="385" y="389" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">exec python train.py (the program is PID 1 and installs its own handler)</text>
    <rect x="325" y="405" width="340" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="495" y="472" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">handler runs</text>
    <line x1="665" y1="465" x2="740" y2="465" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
    <rect x="740" y="405" width="400" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="940" y="472" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">checkpoint written</text>
    <line x1="1140" y1="465" x2="1215" y2="465" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
    <rect x="1215" y="405" width="345" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1387.5" y="472" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">clean exit</text>
  </g>
  <!-- Three PID 1 Rules Header -->
  <text x="800" y="580" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">The three PID 1 rules</text>
  <!-- Card 1 -->
  <g id="card-1">
    <rect x="40" y="610" width="480" height="310" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 625)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 40 28 48 28 48 C 28 48 8 40 8 28 V 14 Z"/>
    </g>
    <text x="65" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">Signals: from inside the </tspan>
      <tspan x="65" dy="28">namespace a signal reaches </tspan>
      <tspan x="65" dy="28">PID 1 only if it installed </tspan>
      <tspan x="65" dy="28">a handler; SIGKILL and </tspan>
      <tspan x="65" dy="28">SIGSTOP from inside are </tspan>
      <tspan x="65" dy="28">ignored; from the parent </tspan>
      <tspan x="65" dy="28">namespace they still work</tspan>
    </text>
  </g>
  <!-- Card 2 -->
  <g id="card-2">
    <rect x="560" y="610" width="480" height="310" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(585, 625)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <line x1="18" y1="22" x2="38" y2="22"/>
      <line x1="18" y1="34" x2="30" y2="34"/>
    </g>
    <text x="585" y="715" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">Zombies: orphans are </tspan>
      <tspan x="585" dy="32">re-parented to PID 1, </tspan>
      <tspan x="585" dy="32">which must call wait(); </tspan>
      <tspan x="585" dy="32">otherwise zombies pile up </tspan>
      <tspan x="585" dy="32">and can exhaust pids.max</tspan>
    </text>
  </g>
  <!-- Card 3 -->
  <g id="card-3">
    <rect x="1080" y="610" width="480" height="310" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1105, 625)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="4"/>
      <line x1="8" y1="22" x2="48" y2="22"/>
      <circle cx="16" cy="16" r="2" fill="#207448"/>
      <circle cx="24" cy="16" r="2" fill="#207448"/>
    </g>
    <text x="1105" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">When PID 1 exits the </tspan>
      <tspan x="1105" dy="32">kernel kills every other </tspan>
      <tspan x="1105" dy="32">process in the namespace </tspan>
      <tspan x="1105" dy="32">with SIGKILL, which is why </tspan>
      <tspan x="1105" dy="32">a container dies when its </tspan>
      <tspan x="1105" dy="32">main process dies</tspan>
    </text>
  </g>
  <!-- Fix Strip -->
  <g id="fix-strip">
    <rect x="40" y="940" width="1520" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 967)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="8"/>
      <path d="M 8 14 V 42 C 8 46 17 50 28 50 C 39 50 48 46 48 42 V 14"/>
      <path d="M 8 28 C 8 32 17 36 28 36 C 39 36 48 32 48 28"/>
    </g>
    <text x="135" y="985" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">exec in the entrypoint; tini; docker run --init; dumb-init; </tspan>
      <tspan x="135" dy="34">Kubernetes shareProcessNamespace; exec form ["python","train.py"] not the shell form</tspan>
    </text>
  </g>
  <!-- Bottom Takeaway Bar -->
  <g id="bottom-bar">
    <rect x="40" y="1075" width="1520" height="90" rx="14" fill="#207448"/>
    <text x="800" y="1130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">End the script with exec so the program becomes PID 1</text>
  </g>
</svg>