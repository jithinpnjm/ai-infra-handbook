<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Detecting throttling, and why thread pools sized from nproc make it worse</title>
  <desc>Visual infographic explaining CPU throttling detection using cpu.stat, cAdvisor, and PSI, the oversubscription trap caused by thread pools sized from nproc on high-core hosts, language-specific fixes, and kernel burst features.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- ==================== DIAGRAM TITLE ==================== -->
  <text x="800" y="50" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Detecting throttling, and why thread pools</tspan>
    <tspan x="800" dy="54">sized from nproc make it worse</tspan>
  </text>

  <!-- ==================== LEFT PANEL: Detect throttling ==================== -->
  <g id="left-panel">
    <!-- Panel container -->
    <rect x="40" y="135" width="740" height="695" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <!-- Left Panel Header Box -->
    <rect x="65" y="155" width="690" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Gauge / Meter (46px) -->
    <g transform="translate(85, 167)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 36 A 18 18 0 1 1 38 36"/>
      <circle cx="23" cy="34" r="3.5" fill="#207448"/>
      <line x1="23" y1="34" x2="32" y2="20"/>
      <line x1="23" y1="40" x2="23" y2="44"/>
    </g>
    <text x="155" y="201" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Detect throttling</text>

    <!-- Card 1: cpu.stat fields -->
    <g id="card-cpustat">
      <rect x="65" y="240" width="690" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Chip / Stats (46px) -->
      <g transform="translate(85, 252)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="34" height="34" rx="5"/>
        <rect x="14" y="14" width="18" height="18" rx="2.5"/>
        <line x1="14" y1="1" x2="14" y2="6"/>
        <line x1="23" y1="1" x2="23" y2="6"/>
        <line x1="32" y1="1" x2="32" y2="6"/>
        <line x1="14" y1="40" x2="14" y2="45"/>
        <line x1="23" y1="40" x2="23" y2="45"/>
        <line x1="32" y1="40" x2="32" y2="45"/>
        <line x1="1" y1="14" x2="6" y2="14"/>
        <line x1="1" y1="23" x2="6" y2="23"/>
        <line x1="1" y1="32" x2="6" y2="32"/>
        <line x1="40" y1="14" x2="45" y2="14"/>
        <line x1="40" y1="23" x2="45" y2="23"/>
        <line x1="40" y1="32" x2="45" y2="32"/>
      </g>
      <text font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="155" y="278">usage_usec, user_usec, system_usec,</tspan>
        <tspan x="155" y="318">nr_periods, nr_throttled,</tspan>
        <tspan x="155" y="358">throttled_usec, nr_bursts, burst_usec</tspan>
      </text>
    </g>

    <!-- Card 2: Rule -->
    <g id="card-rule">
      <rect x="65" y="405" width="690" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Checkmark / Rule (46px) -->
      <g transform="translate(85, 437)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="23" cy="23" r="18"/>
        <polyline points="14,23 20,30 32,16"/>
      </g>
      <text font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="155" y="452">compare nr_throttled with nr_periods</tspan>
        <tspan x="155" y="488">and check throttled_usec</tspan>
      </text>
    </g>

    <!-- Card 3: cAdvisor metrics -->
    <g id="card-cadvisor">
      <rect x="65" y="525" width="690" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Activity / Pulse (46px) -->
      <g transform="translate(85, 545)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="38" height="34" rx="5"/>
        <polyline points="9,23 16,23 20,15 26,31 30,23 37,23"/>
      </g>
      <text font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="85" y="626">container_cpu_cfs_throttled_periods_total</tspan>
        <tspan x="85" y="664">and container_cpu_cfs_periods_total</tspan>
      </text>
    </g>

    <!-- Card 4: cpu.pressure (PSI) -->
    <g id="card-psi">
      <rect x="65" y="710" width="690" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Pressure Dial (46px) -->
      <g transform="translate(85, 737)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="23" cy="23" r="18"/>
        <line x1="23" y1="23" x2="31" y2="13"/>
        <circle cx="23" cy="23" r="3.5" fill="#207448"/>
      </g>
      <text x="155" y="771" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">cpu.pressure (PSI)</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: The oversubscription trap ==================== -->
  <g id="right-panel">
    <!-- Panel container -->
    <rect x="820" y="135" width="740" height="695" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <!-- Right Panel Header Box -->
    <rect x="845" y="155" width="690" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Gear (46px) -->
    <g transform="translate(865, 167)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="23" cy="23" r="8"/>
      <path d="M 23 5 L 23 10 M 23 36 L 23 41 M 5 23 L 10 23 M 36 23 L 41 23 M 10 10 L 14 14 M 32 32 L 36 36 M 10 36 L 14 32 M 32 14 L 36 10"/>
    </g>
    <text x="945" y="201" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">The oversubscription trap</text>

    <!-- Host Box: 64 CPUs -->
    <g id="box-host">
      <rect x="845" y="240" width="690" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <!-- Host header with Server Icon (46px) -->
      <g transform="translate(865, 252)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="38" height="14" rx="3.5"/>
        <circle cx="11" cy="13" r="2" fill="#207448"/>
        <line x1="18" y1="13" x2="36" y2="13"/>
        <rect x="4" y="24" width="38" height="14" rx="3.5"/>
        <circle cx="11" cy="31" r="2" fill="#207448"/>
        <line x1="18" y1="31" x2="36" y2="31"/>
      </g>
      <text x="945" y="283" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">64 CPUs</text>

      <!-- Inside Container Box -->
      <rect x="865" y="302" width="650" height="116" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="885" y="338" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">cpu.max = 200000 100000 (2 CPUs)</text>

      <!-- Runtime reads nproc = 64 (orange highlight badge) -->
      <rect x="885" y="352" width="220" height="54" rx="8" fill="#fff9f5" stroke="#db8129" stroke-width="2.5"/>
      <text x="995" y="388" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">nproc = 64</text>

      <!-- Visual 64-thread pool lanes illustration -->
      <g stroke="#207448" stroke-width="2" opacity="0.6">
        <line x1="1130" y1="379" x2="1495" y2="379"/>
        <line x1="1145" y1="369" x2="1145" y2="389"/>
        <line x1="1180" y1="369" x2="1180" y2="389"/>
        <line x1="1215" y1="369" x2="1215" y2="389"/>
        <line x1="1250" y1="369" x2="1250" y2="389"/>
        <line x1="1285" y1="369" x2="1285" y2="389"/>
        <line x1="1320" y1="369" x2="1320" y2="389"/>
        <line x1="1355" y1="369" x2="1355" y2="389"/>
        <line x1="1390" y1="369" x2="1390" y2="389"/>
        <line x1="1425" y1="369" x2="1425" y2="389"/>
        <line x1="1460" y1="369" x2="1460" y2="389"/>
        <line x1="1495" y1="369" x2="1495" y2="389"/>
      </g>
    </g>

    <!-- Arrow Host Box -> Result Card -->
    <line x1="1190" y1="430" x2="1190" y2="445" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

    <!-- Result Card -->
    <g id="card-result">
      <rect x="845" y="445" width="690" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Timer / Pause (46px) -->
      <g transform="translate(865, 484)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="23" cy="23" r="18"/>
        <line x1="18" y1="15" x2="18" y2="31"/>
        <line x1="28" y1="15" x2="28" y2="31"/>
      </g>
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="945" y="482">the quota is burned early in each</tspan>
        <tspan x="945" y="514">period, then every thread pauses</tspan>
        <tspan x="945" y="546">even though other CPUs are idle</tspan>
      </text>
    </g>

    <!-- Fix Table Box -->
    <g id="box-fix-table">
      <rect x="845" y="585" width="690" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <!-- Horizontal divider lines between table rows -->
      <line x1="845" y1="638" x2="1535" y2="638" stroke="#e8f1ea" stroke-width="2"/>
      <line x1="845" y1="691" x2="1535" y2="691" stroke="#e8f1ea" stroke-width="2"/>
      <line x1="845" y1="744" x2="1535" y2="744" stroke="#e8f1ea" stroke-width="2"/>

      <!-- Fix 1: Go -->
      <text x="875" y="621" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Go: automaxprocs (GOMAXPROCS)</text>

      <!-- Fix 2: Java -->
      <text x="875" y="674" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Java: -XX:ActiveProcessorCount</text>

      <!-- Fix 3: OpenMP -->
      <text x="875" y="727" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">OpenMP: OMP_NUM_THREADS</text>

      <!-- Fix 4: Python -->
      <text font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="875" y="774">Python: os.cpu_count() reports the host,</tspan>
        <tspan x="875" y="802">pass the limit in</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER CARDS ==================== -->
  <g id="footer-cards">
    <!-- Footer Card 1: Kernel 5.4 slice-expiry fix -->
    <g id="footer-card-1">
      <rect x="40" y="850" width="486" height="240" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Shield / Kernel (46px) -->
      <g transform="translate(64, 870)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 23 5 L 39 11 V 23 C 39 34 23 42 23 42 C 23 42 7 34 7 23 V 11 Z"/>
        <polyline points="16,23 21,28 31,16"/>
      </g>
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="136" y="901">Kernels before 5.4</tspan>
        <tspan x="64" y="952">(slice-expiry fix) could</tspan>
        <tspan x="64" y="986">throttle even with unused</tspan>
        <tspan x="64" y="1020">quota: use a recent kernel</tspan>
      </text>
    </g>

    <!-- Footer Card 2: cpu.max.burst -->
    <g id="footer-card-2">
      <rect x="557" y="850" width="486" height="240" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Lightning / Burst (46px) -->
      <g transform="translate(581, 870)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 26 3 L 11 23 L 23 23 L 18 43 L 35 19 L 23 19 Z"/>
      </g>
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="653" y="901" font-family="monospace">cpu.max.burst</tspan>
        <tspan x="581" y="952">(kernel 5.14 and later)</tspan>
        <tspan x="581" y="986">lets a group save unused</tspan>
        <tspan x="581" y="1020">quota for short bursts</tspan>
      </text>
    </g>

    <!-- Footer Card 3: Container nproc /proc/cpuinfo -->
    <g id="footer-card-3">
      <rect x="1074" y="850" width="486" height="240" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Window / Container (46px) -->
      <g transform="translate(1098, 870)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="34" height="30" rx="5"/>
        <line x1="6" y1="16" x2="40" y2="16"/>
        <circle cx="13" cy="12" r="1.8" fill="#207448"/>
        <circle cx="18" cy="12" r="1.8" fill="#207448"/>
      </g>
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1170" y="892">Inside a container,</tspan>
        <tspan x="1170" y="922">nproc and /proc/cpuinfo</tspan>
        <tspan x="1098" y="956">still show the host unless</tspan>
        <tspan x="1098" y="990">you use lxcfs or a runtime</tspan>
        <tspan x="1098" y="1024">that understands limits</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="1115" width="1520" height="60" rx="12" fill="#207448"/>
    <!-- Icon: Check Shield (white, 44px) -->
    <g transform="translate(64, 1123)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 5 L 38 12 V 23 C 38 33 22 40 22 40 C 22 40 6 33 6 23 V 12 Z"/>
      <polyline points="14,22 19,27 30,16"/>
    </g>
    <text x="140" y="1153" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Average usage can look healthy while the pauses hide inside each period</text>
  </g>
</svg>