<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>The posting in one picture</title>
  <desc>Flowchart: one responsibility node splits into See it, Scale it and Fix it, each connected to its section references.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#f5f8f5"/>

  <defs>
    <marker id="ah" viewBox="0 0 18 18" refX="18" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L18 9 L1 17 Z" fill="#207448"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="800" y="76" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">The posting in one picture</text>

  <!-- root node -->
  <rect x="240" y="110" width="1120" height="175" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(302 169)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 4 L50 12 V27 C50 41 40 50 28 53 C16 50 6 41 6 27 V12 Z"/>
  </g>
  <text x="414" y="186" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="414" dy="0">Own reliability, performance and observability</tspan>
    <tspan x="414" dy="46">of the inference stack</tspan>
  </text>

  <!-- branch nodes -->
  <rect x="40" y="365" width="480" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68 399)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 28 C14 13 42 13 52 28 C42 43 14 43 4 28 Z"/>
    <circle cx="28" cy="28" r="8"/>
  </g>
  <text x="144" y="441" font-family="sans-serif" font-size="34" font-weight="700" fill="#303a36">See it</text>
  <text x="68" y="503" font-family="sans-serif" font-size="24" font-weight="400" fill="#303a36">
    <tspan x="68" dy="0">R2 telemetry, Q3 alerts</tspan>
    <tspan x="68" dy="28">and SLOs</tspan>
  </text>

  <rect x="560" y="365" width="480" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(588 399)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 48 H50"/>
    <rect x="10" y="30" width="9" height="18" rx="2"/>
    <rect x="24" y="22" width="9" height="26" rx="2"/>
    <rect x="38" y="12" width="9" height="36" rx="2"/>
  </g>
  <text x="664" y="441" font-family="sans-serif" font-size="34" font-weight="700" fill="#303a36">Scale it</text>
  <text x="588" y="503" font-family="sans-serif" font-size="24" font-weight="400" fill="#303a36">
    <tspan x="588" dy="0">R3 autoscaling,</tspan>
    <tspan x="588" dy="28">R4 Terraform, R5 routing,</tspan>
    <tspan x="588" dy="28">R8 cost</tspan>
  </text>

  <rect x="1080" y="365" width="480" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1108 399)" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(4 4) scale(2)" stroke-width="2">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </g>
  </g>
  <text x="1184" y="441" font-family="sans-serif" font-size="34" font-weight="700" fill="#303a36">Fix it</text>
  <text x="1108" y="503" font-family="sans-serif" font-size="24" font-weight="400" fill="#303a36">
    <tspan x="1108" dy="0">R6 runbooks, R7 post-mortems,</tspan>
    <tspan x="1108" dy="28">Q4 failure modes,</tspan>
    <tspan x="1108" dy="28">Q7 debugging</tspan>
  </text>

  <!-- section reference nodes -->
  <rect x="40" y="660" width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68 709)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="11" y="4" width="34" height="48" rx="4"/>
    <path d="M19 18 H37 M19 28 H37 M19 38 H30"/>
  </g>
  <text x="144" y="746" font-family="sans-serif" font-size="26" font-weight="700" fill="#303a36">20.15, 20.19, 20.25</text>

  <rect x="560" y="660" width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(588 709)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="11" y="4" width="34" height="48" rx="4"/>
    <path d="M19 18 H37 M19 28 H37 M19 38 H30"/>
  </g>
  <text x="664" y="726" font-family="sans-serif" font-size="26" font-weight="700" fill="#303a36">
    <tspan x="664" dy="0">20.12, 20.20,</tspan>
    <tspan x="664" dy="34">20.21, 20.24</tspan>
  </text>

  <rect x="1080" y="660" width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1108 709)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="11" y="4" width="34" height="48" rx="4"/>
    <path d="M19 18 H37 M19 28 H37 M19 38 H30"/>
  </g>
  <text x="1184" y="726" font-family="sans-serif" font-size="26" font-weight="700" fill="#303a36">
    <tspan x="1184" dy="0">20.18, 20.26, 20.27,</tspan>
    <tspan x="1184" dy="34">20.3 to 20.6</tspan>
  </text>

  <!-- arrows -->
  <path d="M280 285 V365" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M800 285 V365" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1320 285 V365" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M280 595 V660" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M800 595 V660" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1320 595 V660" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#ah)"/>
</svg>
