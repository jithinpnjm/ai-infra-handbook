<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Prefix caching: block hashes, tenant salt and what breaks the cache</title>
  <desc></desc>
  <defs>
    <!-- Arrowhead Green (18px) -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1120" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Prefix caching: block hashes, tenant salt</tspan>
    <tspan x="800" dy="54">and what breaks the cache</tspan>
  </text>

  <!-- Benefit Line Banner -->
  <rect x="40" y="125" width="1520" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="167" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">a cache hit saves prefill work, so repeated system prompts get cheaper and faster</text>

  <!-- ==================== LEFT COLUMN: BLOCK HASH CHAIN & TENANT SALT ==================== -->
  <!-- Left Container Panel -->
  <rect x="40" y="225" width="740" height="755" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

  <!-- Left Intro Card -->
  <rect x="65" y="245" width="690" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="410" y="288" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" dy="0">v0.32.0 prefix caching is on by default;</tspan>
    <tspan x="410" dy="34">vLLM hashes each block from its tokens</tspan>
    <tspan x="410" dy="34">and its prefix; caches only full blocks</tspan>
  </text>

  <!-- Hash Chain Nodes -->
  <!-- Node 1: block 1 hash -->
  <g id="node-block-1">
    <rect x="220" y="410" width="380" height="72" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Block / Hash Icon (56px) -->
    <g transform="translate(235, 418)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="20" y1="8" x2="20" y2="48" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    <text x="425" y="455" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">block 1 hash</text>
  </g>

  <!-- Arrow 1: block 1 hash feeding block 2 hash -->
  <line x1="410" y1="482" x2="410" y2="520" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <!-- Node 2: block 2 hash -->
  <g id="node-block-2">
    <rect x="220" y="520" width="380" height="72" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Block / Hash Icon (56px) -->
    <g transform="translate(235, 528)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="20" y1="8" x2="20" y2="48" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    <text x="425" y="565" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">block 2 hash</text>
  </g>

  <!-- Arrow 2: block 2 hash feeding block 3 hash -->
  <line x1="410" y1="592" x2="410" y2="630" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <!-- Node 3: block 3 hash -->
  <g id="node-block-3">
    <rect x="220" y="630" width="380" height="72" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Block / Hash Icon (56px) -->
    <g transform="translate(235, 638)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="20" y1="8" x2="20" y2="48" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    <text x="425" y="675" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">block 3 hash</text>
  </g>

  <!-- Salt Box (Highlighted in Orange for tenant privacy) -->
  <g id="salt-box">
    <rect x="65" y="725" width="690" height="235" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <!-- Security Shield Icon (56px) in orange -->
    <g transform="translate(382, 742)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 10 14 L 10 30 C 10 44 28 52 28 52 C 28 52 46 44 46 30 L 46 14 Z" />
      <circle cx="28" cy="27" r="4" fill="#db8129" />
      <path d="M 28 31 L 28 38" />
    </g>
    <text x="410" y="836" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="410" dy="0">cache salt: an extra value mixed into the</tspan>
      <tspan x="410" dy="36">hash so two tenants with the same prompt</tspan>
      <tspan x="410" dy="36">do not share cache entries (privacy)</tspan>
    </text>
  </g>

  <!-- ==================== RIGHT COLUMN: HASH CHOICES & VERSION SKEW ==================== -->
  <!-- Right Container Panel -->
  <rect x="820" y="225" width="740" height="755" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

  <!-- Card 1: default sha256 vs xxhash collision risk -->
  <g id="card-hash-choices">
    <rect x="845" y="245" width="690" height="345" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Key / Algorithm Icon (56px) -->
    <g transform="translate(875, 265)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="22" r="12" />
      <line x1="30" y1="28" x2="48" y2="46" />
      <line x1="42" y1="40" x2="48" y2="34" />
      <line x1="36" y1="46" x2="42" y2="40" />
    </g>
    <text x="1190" y="370" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1190" dy="0">default sha256; xxhash is not</tspan>
      <tspan x="1190" dy="36">cryptographically secure and theoretically</tspan>
      <tspan x="1190" dy="36">raises collision risk (two different inputs</tspan>
      <tspan x="1190" dy="36">get the same hash and the cache could</tspan>
      <tspan x="1190" dy="36">serve the wrong block)</tspan>
    </text>
  </g>

  <!-- Card 2: Version Skew & Router Dependence -->
  <g id="card-version-skew">
    <rect x="845" y="630" width="690" height="325" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Network / Router Icon (56px) -->
    <g transform="translate(875, 650)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="14" width="40" height="28" rx="6" />
      <circle cx="20" cy="28" r="3" fill="#207448" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
      <circle cx="36" cy="28" r="3" fill="#207448" />
      <line x1="28" y1="14" x2="28" y2="6" />
      <line x1="28" y1="42" x2="28" y2="50" />
    </g>
    <text x="1190" y="745" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1190" dy="0">sha256 hashes may not be reproducible</tspan>
      <tspan x="1190" dy="36">across Python or vLLM versions,</tspan>
      <tspan x="1190" dy="36">which matters if a shared cache</tspan>
      <tspan x="1190" dy="36">or a router depends on them</tspan>
    </text>
  </g>

  <!-- ==================== FOOTER TAKEAWAY BAR ==================== -->
  <rect x="40" y="1012" width="1520" height="68" rx="10" fill="#207448" />
  <text x="800" y="1054" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">cache contents and hash-based routing are not portable across versions</text>
</svg>