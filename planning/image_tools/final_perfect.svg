<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Common mistakes grouped by theme</title>
  <desc>Common mistakes grouped by theme</desc>
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Common mistakes grouped by theme</text>

  <!-- ==================== TABLE HEADERS ==================== -->
  <rect x="40" y="84" width="310" height="44" rx="6" fill="#207448"/>
  <text x="195" y="116" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Theme</text>

  <rect x="366" y="84" width="724" height="44" rx="6" fill="#207448"/>
  <text x="728" y="116" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Mistake</text>

  <rect x="1106" y="84" width="454" height="44" rx="6" fill="#207448"/>
  <text x="1333" y="116" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Fix</text>

  <!-- ==================== ROW 1: Wrong tool ==================== -->
  <!-- Theme: Wrong tool -->
  <rect x="40" y="142" width="310" height="142" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <!-- Icon: Wrench -->
  <g transform="translate(56, 185)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 4 C 33 0 26 2 24 7 L 7 24 C 2 29 2 37 7 42 C 12 47 20 47 25 42 L 42 25 C 47 23 49 16 45 11 L 39 17 L 32 17 L 32 10 Z"/>
    <circle cx="12" cy="37" r="2.5" fill="#207448"/>
  </g>
  <text x="116" y="222" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Wrong tool</text>

  <!-- Mistake 1 -->
  <rect x="346" y="142" width="738" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="386" y="176" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">threads for CPU-bound pure Python; asyncio with</tspan>
    <tspan x="386" dy="28">blocking libraries never offloaded; treating</tspan>
    <tspan x="386" dy="28">async as faster by default (for a handful of</tspan>
    <tspan x="386" dy="28">requests the overhead is not worth it)</tspan>
  </text>

  <!-- Fix 1 -->
  <rect x="1100" y="142" width="460" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="190" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">processes for CPU,</tspan>
    <tspan x="1126" dy="28"><tspan font-family="monospace">to_thread</tspan> for</tspan>
    <tspan x="1126" dy="28">blocking calls</tspan>
  </text>

  <!-- ==================== ROW 2: Unbounded work ==================== -->
  <!-- Theme: Unbounded work -->
  <rect x="40" y="298" width="310" height="98" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <!-- Icon: Infinity / Overflow limit -->
  <g transform="translate(56, 321)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 14 26 C 6 26 4 14 14 14 C 20 14 28 26 34 26 C 44 26 42 14 34 14 C 28 14 20 26 14 26 Z"/>
    <line x1="2" y1="4" x2="2" y2="36"/>
    <line x1="46" y1="4" x2="46" y2="36"/>
  </g>
  <text x="116" y="341" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="116" dy="0">Unbounded</tspan>
    <tspan x="116" dy="34">work</tspan>
  </text>

  <!-- Mistake 2 -->
  <rect x="346" y="298" width="738" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="386" y="342" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">no semaphore, queue or pool limit; unbounded</tspan>
    <tspan x="386" dy="28">queues; millions of futures</tspan>
  </text>

  <!-- Fix 2 -->
  <rect x="1100" y="298" width="460" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="356" font-family="sans-serif" font-size="24" fill="#303a36">bound everything</text>

  <!-- ==================== ROW 3: Quiet error handling ==================== -->
  <!-- Theme: Quiet error handling -->
  <rect x="40" y="410" width="310" height="142" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <!-- Icon: Bell with slash -->
  <g transform="translate(56, 453)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 6 C 24 6 14 10 14 24 L 8 32 L 40 32 L 34 24 C 34 16 30 6 24 6 Z"/>
    <circle cx="24" cy="37" r="3" fill="#207448"/>
    <line x1="6" y1="6" x2="42" y2="42" stroke="#207448" stroke-width="3.5"/>
  </g>
  <text x="116" y="473" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="116" dy="0">Quiet error</tspan>
    <tspan x="116" dy="34">handling</tspan>
  </text>

  <!-- Mistake 3 -->
  <rect x="346" y="410" width="738" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="386" y="444" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">missing timeouts; swallowed <tspan font-family="monospace">CancelledError</tspan>;</tspan>
    <tspan x="386" dy="28">fire-and-forget tasks without references;</tspan>
    <tspan x="386" dy="28">forgetting to collect worker exceptions;</tspan>
    <tspan x="386" dy="28">aborting a fleet operation on the first failure</tspan>
  </text>

  <!-- Fix 3 -->
  <rect x="1100" y="410" width="460" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="472" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">timeouts, references,</tspan>
    <tspan x="1126" dy="28">aggregated results</tspan>
  </text>

  <!-- ==================== ROW 4: Shared state ==================== -->
  <!-- Theme: Shared state -->
  <rect x="40" y="566" width="310" height="104" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <!-- Icon: Shared locked node -->
  <g transform="translate(56, 592)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="26" r="6"/>
    <circle cx="38" cy="26" r="6"/>
    <rect x="18" y="16" width="12" height="14" rx="2"/>
    <path d="M 21 16 L 21 11 C 21 8 27 8 27 11 L 27 16"/>
    <line x1="16" y1="26" x2="18" y2="26"/>
    <line x1="30" y1="26" x2="32" y2="26"/>
  </g>
  <text x="116" y="612" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="116" dy="0">Shared</tspan>
    <tspan x="116" dy="34">state</tspan>
  </text>

  <!-- Mistake 4 -->
  <rect x="346" y="566" width="738" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="386" y="610" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">sharing mutable state across threads or</tspan>
    <tspan x="386" dy="28">processes; assuming the GIL makes code</tspan>
    <tspan x="386" dy="28">thread-safe</tspan>
  </text>

  <!-- Fix 4 -->
  <rect x="1100" y="566" width="460" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="626" font-family="sans-serif" font-size="24" fill="#303a36">pass messages</text>

  <!-- ==================== ROW 5: Process setup ==================== -->
  <!-- Theme: Process setup -->
  <rect x="40" y="684" width="310" height="118" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <!-- Icon: Fork / Process tree -->
  <g transform="translate(56, 717)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="8" r="5"/>
    <line x1="24" y1="13" x2="24" y2="24"/>
    <line x1="12" y1="24" x2="36" y2="24"/>
    <line x1="12" y1="24" x2="12" y2="34"/>
    <line x1="36" y1="24" x2="36" y2="34"/>
    <circle cx="12" cy="39" r="5"/>
    <circle cx="36" cy="39" r="5"/>
  </g>
  <text x="116" y="736" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="116" dy="0">Process</tspan>
    <tspan x="116" dy="34">setup</tspan>
  </text>

  <!-- Mistake 5 -->
  <rect x="346" y="684" width="738" height="118" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="386" y="722" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">forking after threads or CUDA; missing</tspan>
    <tspan x="386" dy="28"><tspan font-family="monospace">if __name__ == "__main__"</tspan> with <tspan font-family="monospace">spawn</tspan>;</tspan>
    <tspan x="386" dy="28">unpicklable objects</tspan>
  </text>

  <!-- Fix 5 -->
  <rect x="1100" y="684" width="460" height="118" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="736" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0"><tspan font-family="monospace">spawn</tspan> or <tspan font-family="monospace">forkserver</tspan>,</tspan>
    <tspan x="1126" dy="28">top-level functions</tspan>
  </text>

  <!-- ==================== ROW 6: Retries (ORANGE ACCENT) ==================== -->
  <!-- Theme: Retries -->
  <rect x="40" y="816" width="310" height="98" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="2"/>
  <!-- Icon: Retry loop in orange -->
  <g transform="translate(56, 840)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 8 A 16 16 0 1 1 10 22"/>
    <polyline points="24,2 24,10 32,10" fill="none"/>
  </g>
  <text x="116" y="874" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Retries</text>

  <!-- Mistake 6: Highlighted in orange -->
  <rect x="346" y="816" width="738" height="98" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
  <text x="386" y="858" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">retrying non-idempotent operations;</tspan>
    <tspan x="386" dy="28">no jitter and caps</tspan>
  </text>

  <!-- Fix 6 -->
  <rect x="1100" y="816" width="460" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="858" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">idempotent only,</tspan>
    <tspan x="1126" dy="28">full jitter, caps</tspan>
  </text>

  <!-- ==================== ROW 7: Pool sizing ==================== -->
  <!-- Theme: Pool sizing -->
  <rect x="40" y="928" width="310" height="98" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <!-- Icon: Gauge / Meter -->
  <g transform="translate(56, 952)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 36 A 20 20 0 1 1 40 36"/>
    <line x1="24" y1="36" x2="32" y2="20"/>
    <circle cx="24" cy="36" r="3" fill="#207448"/>
  </g>
  <text x="116" y="971" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="116" dy="0">Pool</tspan>
    <tspan x="116" dy="34">sizing</tspan>
  </text>

  <!-- Mistake 7 -->
  <rect x="346" y="928" width="738" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="386" y="970" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="386" dy="0">sizing by <tspan font-family="monospace">cpu_count()</tspan> inside containers;</tspan>
    <tspan x="386" dy="28">a process pool over BLAS threads</tspan>
  </text>

  <!-- Fix 7 -->
  <rect x="1100" y="928" width="460" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1126" y="986" font-family="sans-serif" font-size="24" fill="#303a36">cgroup-aware count</text>

  <!-- ==================== BOTTOM BAR ==================== -->
  <rect x="40" y="1066" width="1520" height="64" rx="8" fill="#207448"/>
  <text x="800" y="1106" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Before you ship: every pool and queue has a limit, and every await has a timeout</text>
</svg>