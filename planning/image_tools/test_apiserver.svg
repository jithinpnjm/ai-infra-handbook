<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Every request passes the API server checkpoints</title>
  <desc>Visual infographic showing the Kubernetes API server request pipeline with authentication, authorization, mutating admission, schema validation, validating admission, etcd persistence, and API priority and fairness.</desc>

  <defs>
    <!-- 18px proportional green arrowhead marker -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Every request passes the API server checkpoints</text>

  <!-- ==================== CLIENT REQUEST (ABOVE PIPELINE) ==================== -->
  <g id="client-request">
    <rect x="70" y="105" width="420" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Client workstation outline icon (56px) -->
    <g transform="translate(95, 122)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="30" rx="4" />
      <line x1="2" y1="46" x2="54" y2="46" />
      <line x1="20" y1="36" x2="16" y2="46" />
      <line x1="36" y1="36" x2="40" y2="46" />
      <polyline points="16,18 22,23 16,28" stroke-width="3" />
      <line x1="26" y1="28" x2="36" y2="28" stroke-width="3" />
    </g>
    <text x="310" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="310" dy="0">kubectl request </tspan>
      <tspan x="310" dy="30">on port 6443</tspan>
    </text>
  </g>

  <!-- Pipeline entrance arrow: Client to Box 1 -->
  <line x1="280" y1="195" x2="280" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- ==================== SIDE BRANCH: API PRIORITY AND FAIRNESS ==================== -->
  <!-- Side branch line from pipeline entrance into APF box -->
  <path d="M 280 245 H 590" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <g id="side-branch-apf">
    <rect x="590" y="200" width="940" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Scales / queue icon (56px) -->
    <g transform="translate(620, 217)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="8" x2="28" y2="48" />
      <line x1="12" y1="16" x2="44" y2="16" />
      <line x1="18" y1="48" x2="38" y2="48" />
      <path d="M 12 16 L 6 30 H 18 Z" />
      <path d="M 44 16 L 38 30 H 50 Z" />
    </g>
    <text x="1090" y="242" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1090" dy="0">API Priority and Fairness: </tspan>
      <tspan x="1090" dy="32">queues requests by flow</tspan>
    </text>
  </g>

  <!-- ==================== ROW 1: CHECKPOINTS 1 TO 3 ==================== -->

  <!-- BOX 1: Authentication -->
  <g id="box-1">
    <rect x="70" y="295" width="420" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 1 -->
    <circle cx="115" cy="340" r="24" fill="#207448" />
    <text x="115" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <!-- Badge outline icon (56px) -->
    <g transform="translate(405, 312)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 8 H 44 V 40 L 28 50 L 12 40 Z" />
      <circle cx="28" cy="24" r="8" />
      <path d="M 18 38 C 20 32 36 32 38 38" />
    </g>
    <!-- Title -->
    <text x="280" y="405" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Authentication</text>
    <!-- Note -->
    <text x="280" y="455" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">certs, tokens, OIDC, </tspan>
      <tspan x="280" dy="32">webhook: who are you</tspan>
    </text>
  </g>

  <!-- Arrow: Box 1 -> Box 2 -->
  <line x1="490" y1="410" x2="590" y2="410" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- BOX 2: Authorization -->
  <g id="box-2">
    <rect x="590" y="295" width="420" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 2 -->
    <circle cx="635" cy="340" r="24" fill="#207448" />
    <text x="635" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <!-- Key outline icon (56px) -->
    <g transform="translate(925, 312)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="22" r="14" />
      <circle cx="20" cy="22" r="5" />
      <path d="M 32 28 L 50 46" />
      <line x1="42" y1="38" x2="47" y2="33" />
      <line x1="46" y1="42" x2="51" y2="37" />
    </g>
    <!-- Title -->
    <text x="800" y="405" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Authorization</text>
    <!-- Note -->
    <text x="800" y="455" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">RBAC, Node, webhook: </tspan>
      <tspan x="800" dy="32">what may you do</tspan>
    </text>
  </g>

  <!-- Arrow: Box 2 -> Box 3 -->
  <line x1="1010" y1="410" x2="1110" y2="410" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- BOX 3: Mutating admission (Orange outline: only step that changes the object) -->
  <g id="box-3">
    <rect x="1110" y="295" width="420" height="230" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    <!-- Number circle 3 -->
    <circle cx="1155" cy="340" r="24" fill="#207448" />
    <text x="1155" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <!-- Edit / Mutation wand icon (56px) -->
    <g transform="translate(1445, 312)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 42 L 38 18 L 46 26 L 22 50 L 10 52 Z" />
      <line x1="32" y1="24" x2="40" y2="32" />
      <line x1="14" y1="12" x2="14" y2="18" stroke-width="3" />
      <line x1="11" y1="15" x2="17" y2="15" stroke-width="3" />
      <line x1="46" y1="8" x2="46" y2="14" stroke-width="3" />
      <line x1="43" y1="11" x2="49" y2="11" stroke-width="3" />
    </g>
    <!-- Title -->
    <text x="1320" y="405" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Mutating admission</text>
    <!-- Note -->
    <text x="1320" y="455" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">can change the object, </tspan>
      <tspan x="1320" dy="32">for example add a default</tspan>
    </text>
  </g>

  <!-- ==================== TRANSITION ARROW: BOX 3 TO BOX 4 ==================== -->
  <path d="M 1320 525 V 570 H 280 V 610" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- ==================== ROW 2: CHECKPOINTS 4 TO 6 ==================== -->

  <!-- BOX 4: Schema validation -->
  <g id="box-4">
    <rect x="70" y="615" width="420" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 4 -->
    <circle cx="115" cy="660" r="24" fill="#207448" />
    <text x="115" y="668" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <!-- Check outline icon (56px) -->
    <g transform="translate(405, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="18,28 25,35 38,20" />
    </g>
    <!-- Title -->
    <text x="280" y="745" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Schema validation</text>
  </g>

  <!-- Arrow: Box 4 -> Box 5 -->
  <line x1="490" y1="730" x2="590" y2="730" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- BOX 5: Validating admission -->
  <g id="box-5">
    <rect x="590" y="615" width="420" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 5 -->
    <circle cx="635" cy="660" r="24" fill="#207448" />
    <text x="635" y="668" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <!-- Shield / validation gate icon (56px) -->
    <g transform="translate(925, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 12 L 28 6 L 44 12 V 26 C 44 38 28 48 28 48 C 28 48 12 38 12 26 Z" />
      <polyline points="20,26 26,32 36,20" stroke-width="3.5" />
    </g>
    <!-- Title -->
    <text x="800" y="715" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Validating admission</text>
    <!-- Note -->
    <text x="800" y="775" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">can only accept or reject</text>
  </g>

  <!-- Arrow: Box 5 -> Box 6 -->
  <line x1="1010" y1="730" x2="1110" y2="730" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- BOX 6: Persist to etcd -->
  <g id="box-6">
    <rect x="1110" y="615" width="420" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 6 -->
    <circle cx="1155" cy="660" r="24" fill="#207448" />
    <text x="1155" y="668" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <!-- Storage cylinder outline icon (56px) -->
    <g transform="translate(1445, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="7" />
      <path d="M 8 14 V 40 C 8 44 17 48 28 48 S 48 44 48 40 V 14" />
      <path d="M 8 27 C 8 31 17 35 28 35 S 48 31 48 27" />
    </g>
    <!-- Title -->
    <text x="1320" y="745" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Persist to etcd</text>
  </g>

  <!-- ==================== FINAL ARROW OUT: RESPONSE RETURNS ==================== -->
  <line x1="1320" y1="845" x2="1320" y2="905" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="1320" y="942" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Response returns</text>

  <!-- ==================== BOTTOM NOTE ==================== -->
  <rect x="70" y="975" width="1460" height="70" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1019" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#303a36">Reads and watches mostly come from the in-memory watch cache, not etcd.</text>

</svg>