<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010">
  <title>Which timestamp changes when you do what to a file</title>
  <desc>A matrix showing how mtime, ctime, and atime change across common file operations in Linux.</desc>

  <!-- Canvas Background -->
  <rect width="1600" height="1010" fill="#f5f8f5" />

  <!-- Title: 48px bold -->
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Which timestamp changes when you do what to a file</text>

  <!-- Legend: in its own row below the title, with >= 40px gap to matrix -->
  <rect x="480" y="72" width="640" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="580" cy="102" r="13" fill="#207448" />
  <text x="606" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">changes</text>
  <circle cx="840" cy="102" r="13" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="866" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">unchanged</text>

  <!-- Matrix Outer Container -->
  <rect x="40" y="172" width="1140" height="678" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

  <!-- Matrix Header Row -->
  <rect x="40" y="172" width="1140" height="158" rx="14" fill="#e8f1ea" />
  <!-- Column divider lines -->
  <line x1="340" y1="172" x2="340" y2="850" stroke="#207448" stroke-width="2" />
  <line x1="620" y1="172" x2="620" y2="850" stroke="#207448" stroke-width="2" />
  <line x1="900" y1="172" x2="900" y2="850" stroke="#207448" stroke-width="2" />
  <line x1="40" y1="330" x2="1180" y2="330" stroke="#207448" stroke-width="2" />

  <!-- Action Column Header Icon -->
  <g transform="translate(165, 218)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="50" height="42" rx="6" fill="#ffffff" />
    <line x1="0" y1="14" x2="50" y2="14" />
    <polyline points="10,24 16,28 10,32" />
    <line x1="22" y1="32" x2="34" y2="32" />
  </g>
  <!-- Col 1 Header: mtime -->
  <g transform="translate(462, 186)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 0 L 24 0 L 36 12 L 36 40 L 0 40 Z" fill="#ffffff" />
    <polyline points="24,0 24,12 36,12" />
    <line x1="8" y1="18" x2="28" y2="18" />
    <line x1="8" y1="25" x2="28" y2="25" />
    <line x1="8" y1="32" x2="20" y2="32" />
  </g>
  <text x="480" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="480" dy="0">mtime </tspan>
    <tspan x="480" dy="28">(contents </tspan>
    <tspan x="480" dy="28">written)</tspan>
  </text>
  <!-- Col 2 Header: ctime -->
  <g transform="translate(742, 186)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="36" height="36" rx="6" fill="#ffffff" />
    <circle cx="18" cy="20" r="7" />
    <line x1="18" y1="6" x2="18" y2="10" />
    <line x1="18" y1="30" x2="18" y2="34" />
    <line x1="4" y1="20" x2="8" y2="20" />
    <line x1="28" y1="20" x2="32" y2="20" />
  </g>
  <text x="760" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="760" dy="0">ctime </tspan>
    <tspan x="760" dy="28">(inode </tspan>
    <tspan x="760" dy="28">changed)</tspan>
  </text>
  <!-- Col 3 Header: atime -->
  <g transform="translate(1020, 188)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 18 Q 20 2 40 18 Q 20 34 0 18 Z" fill="#ffffff" />
    <circle cx="20" cy="18" r="7" fill="#207448" />
    <circle cx="20" cy="18" r="2.5" fill="#ffffff" />
  </g>
  <text x="1040" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="1040" dy="0">atime </tspan>
    <tspan x="1040" dy="28">(file read)</tspan>
  </text>

  <!-- Row 1: echo more >> f1 -->
  <line x1="40" y1="420" x2="1180" y2="420" stroke="#207448" stroke-width="1.5" />
  <text x="65" y="382" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">echo more &gt;&gt; f1</text>
  <circle cx="480" cy="375" r="14" fill="#207448" />
  <circle cx="760" cy="375" r="14" fill="#207448" />
  <circle cx="1040" cy="375" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />

  <!-- Row 2: chmod 600 f1 (orange outline on ctime cell) -->
  <line x1="40" y1="510" x2="1180" y2="510" stroke="#207448" stroke-width="1.5" />
  <text x="65" y="472" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">chmod 600 f1</text>
  <circle cx="480" cy="465" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <rect x="626" y="426" width="268" height="78" rx="8" fill="#fff9f3" stroke="#db8129" stroke-width="3" />
  <circle cx="760" cy="465" r="14" fill="#207448" />
  <circle cx="1040" cy="465" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />

  <!-- Row 3: cat f1 -->
  <line x1="40" y1="610" x2="1180" y2="610" stroke="#207448" stroke-width="1.5" />
  <text x="65" y="567" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">cat f1</text>
  <circle cx="480" cy="560" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="760" cy="560" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="1040" cy="542" r="13" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1040" y="582" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rarely: relatime</text>

  <!-- Row 4: ln f1 f2 -->
  <line x1="40" y1="700" x2="1180" y2="700" stroke="#207448" stroke-width="1.5" />
  <text x="65" y="662" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">ln f1 f2</text>
  <circle cx="480" cy="655" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="760" cy="655" r="14" fill="#207448" />
  <circle cx="1040" cy="655" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />

  <!-- Row 5: touch -d "2026-01-01 12:00" f1 -->
  <text x="65" y="744" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="65" dy="0">touch -d </tspan>
    <tspan x="65" dy="32">"2026-01-01 </tspan>
    <tspan x="65" dy="32">12:00" f1</tspan>
  </text>
  <circle cx="480" cy="775" r="14" fill="#207448" />
  <circle cx="760" cy="728" r="13" fill="#207448" />
  <text x="760" y="764" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="760" dy="0">ctime still </tspan>
    <tspan x="760" dy="28">moves, </tspan>
    <tspan x="760" dy="28">cannot be set</tspan>
  </text>
  <circle cx="1040" cy="775" r="14" fill="#207448" />

  <!-- Right Side Box: stat and ls commands -->
  <rect x="1220" y="172" width="340" height="678" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="1220" y="172" width="340" height="92" rx="14" fill="#e8f1ea" />
  <g transform="translate(1365, 196)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="50" height="42" rx="6" fill="#ffffff" />
    <line x1="0" y1="14" x2="50" y2="14" />
    <circle cx="8" cy="7" r="1.5" fill="#207448" />
    <circle cx="15" cy="7" r="1.5" fill="#207448" />
    <circle cx="22" cy="7" r="1.5" fill="#207448" />
    <polyline points="10,24 16,28 10,32" />
    <line x1="22" y1="32" x2="34" y2="32" />
  </g>
  <rect x="1238" y="282" width="304" height="124" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <rect x="1238" y="422" width="304" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <rect x="1238" y="534" width="304" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <rect x="1238" y="646" width="304" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <!-- Right Box Text as single text element spanning the 4 cards -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36" text-anchor="middle">
    <tspan x="1390" y="334" font-weight="bold">stat shows </tspan>
    <tspan x="1390" y="370" font-weight="bold">all three; </tspan>
    <tspan x="1390" y="478" font-family="ui-monospace, monospace" font-weight="bold">ls -l shows mtime, </tspan>
    <tspan x="1390" y="590" font-family="ui-monospace, monospace" font-weight="bold">ls -lc ctime, </tspan>
    <tspan x="1390" y="702" font-family="ui-monospace, monospace" font-weight="bold">ls -lu atime</tspan>
  </text>

  <!-- Bottom Takeaway Bar: ctime is not the creation time -->
  <rect x="40" y="890" width="1520" height="74" rx="12" fill="#207448" />
  <text x="800" y="936" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">ctime is not the creation time</text>

</svg>