<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Why a script works in the shell but fails under cron or systemd</title>
  <desc>Technical infographic comparing environment activation in an interactive shell versus cron, systemd, or CI runners, showing the absolute path fix and diagnostic check commands.</desc>

  <!-- Background Canvas -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Diagram Title (48px bold, two lines) -->
  <text x="800" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Why a script works in the shell </tspan>
    <tspan x="800" dy="54">but fails under cron or systemd</tspan>
  </text>

  <!-- ==================== LANE 1: YOUR SHELL ==================== -->
  <g id="lane-shell">
    <!-- Lane Container (width=740, height=298, x=40..780, y=172..470) -->
    <rect x="40" y="172" width="740" height="298" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="40" y="172" width="740" height="54" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <!-- Terminal Outline Icon (56px) -->
    <g transform="translate(62, 172)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="52" height="40" rx="7" />
      <polyline points="14,19 24,26 14,33" />
      <line x1="28" y1="33" x2="42" y2="33" />
    </g>

    <!-- Lane 1 Header -->
    <text x="135" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Your shell</text>

    <!-- Step 1 Card: source .venv/bin/activate ... (h=94, y=236..330) -->
    <rect x="58" y="236" width="704" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="276" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="76" dy="0">source .venv/bin/activate puts .venv/bin </tspan>
      <tspan x="76" dy="30" font-family="system-ui, -apple-system, sans-serif">at the front of PATH and sets VIRTUAL_ENV</tspan>
    </text>

    <!-- Step 2 Card: python resolves to the venv interpreter (h=62, y=338..400) -->
    <rect x="58" y="338" width="704" height="62" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">python resolves to the venv interpreter</text>

    <!-- Step 3 Card: import works (h=58, y=406..464) -->
    <rect x="58" y="404" width="704" height="62" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">import works</text>
  </g>

  <!-- ==================== LANE 2: CRON, SYSTEMD OR CI (orange) ==================== -->
  <g id="lane-daemon">
    <!-- Lane Container (width=740, height=298, x=820..1560, y=172..470) -->
    <rect x="820" y="172" width="740" height="298" rx="14" fill="#fff9f3" stroke="#db8129" stroke-width="2.5" />
    <rect x="820" y="172" width="740" height="54" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />

    <!-- Timer / Service Cog Outline Icon (56px) in orange -->
    <g transform="translate(842, 172)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="26" r="20" />
      <polyline points="28,14 28,26 37,26" />
    </g>

    <!-- Lane 2 Header -->
    <text x="915" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">cron, systemd or CI</text>

    <!-- Step 1 Card: no activation, a different PATH (h=62, y=236..298) -->
    <rect x="838" y="236" width="704" height="62" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="856" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">no activation, a different PATH</text>

    <!-- Step 2 Card: bare python3 resolves to the system interpreter (h=94, y=306..400) -->
    <rect x="838" y="306" width="704" height="94" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="856" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="856" dy="0"><tspan font-family="ui-monospace, monospace">bare python3</tspan> resolves to the </tspan>
      <tspan x="856" dy="30">system interpreter</tspan>
    </text>

    <!-- Step 3 Card: ModuleNotFoundError: No module named x (h=58, y=406..464) -->
    <rect x="838" y="404" width="704" height="64" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="856" y="444" font-family="ui-monospace, monospace" font-size="24" fill="#db8129">ModuleNotFoundError: No module named x</text>
  </g>

  <!-- ==================== FIX BOX ==================== -->
  <g id="fix-box">
    <!-- Fix Box Container (width=1520, height=136, x=40..1560, y=504..640) -->
    <rect x="40" y="504" width="1520" height="136" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <!-- Wrench / Tool Outline Icon (56px) -->
    <g transform="translate(62, 544)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 38 8 A 14 14 0 0 0 20 23 L 6 37 A 4 4 0 0 0 10 41 L 15 46 A 4 4 0 0 0 19 42 L 33 28 A 14 14 0 0 0 48 10 Z" />
      <circle cx="37" cy="19" r="2.5" />
    </g>

    <text x="140" y="544" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">call the interpreter by absolute path: <tspan font-family="ui-monospace, monospace">/path/to/.venv/bin/python -m pip install requests;</tspan> </tspan>
      <tspan x="140" dy="32"><tspan font-family="ui-monospace, monospace">systemd ExecStart=/opt/myops/.venv/bin/myops</tspan> with <tspan font-family="ui-monospace, monospace">Environment=PYTHONUNBUFFERED=1</tspan>, </tspan>
      <tspan x="140" dy="32">a dedicated user and ProtectSystem= hardening from chapter 1.15; log <tspan font-family="ui-monospace, monospace">sys.executable</tspan></tspan>
    </text>
  </g>

  <!-- ==================== CHECKS STRIP ==================== -->
  <g id="checks-strip">
    <!-- Checks Strip Container (width=1520, height=206, x=40..1560, y=676..882) -->
    <rect x="40" y="676" width="1520" height="206" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Search / Magnifying Glass Outline Icon (56px) -->
    <g transform="translate(62, 751)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="16" />
      <line x1="34" y1="34" x2="50" y2="50" />
      <line x1="14" y1="22" x2="30" y2="22" />
    </g>

    <!-- Card 1: which python (x=136..676, y=688..778, w=540, h=90) -->
    <rect x="136" y="688" width="540" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="156" y="743" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">which python</text>

    <!-- Card 2: python -m pip show x (x=136..676, y=786..870, w=540, h=84) -->
    <rect x="136" y="786" width="540" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="156" y="839" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">python -m pip show x</text>

    <!-- Card 3: python -c "import sys; print(sys.prefix, sys.base_prefix)" (they differ inside a venv) (x=696..1540, y=688..778, w=844, h=90) -->
    <rect x="696" y="688" width="844" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="716" y="728" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="716" dy="0">python -c "import sys; print(sys.prefix, </tspan>
      <tspan x="716" dy="28">sys.base_prefix)" <tspan font-family="system-ui, -apple-system, sans-serif">(they differ inside a venv)</tspan></tspan>
    </text>

    <!-- Card 4: python -m site shows sys.path, user site and whether a venv is active (x=696..1540, y=786..874, w=844, h=88) -->
    <rect x="696" y="786" width="844" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="716" y="825" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="716" dy="0"><tspan font-family="ui-monospace, monospace">python -m site</tspan> shows <tspan font-family="ui-monospace, monospace">sys.path</tspan>, user site </tspan>
      <tspan x="716" dy="28">and whether a venv is active</tspan>
    </text>
  </g>

  <!-- ==================== RULES STRIP ==================== -->
  <g id="rules-strip">
    <!-- Rules Strip Container (width=1520, height=148, x=40..1560, y=918..1066) -->
    <rect x="40" y="918" width="1520" height="148" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <!-- Shield Outline Icon (56px) -->
    <g transform="translate(62, 964)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 8 15 L 8 29 C 8 44 28 54 28 54 C 28 54 48 44 48 29 L 48 15 Z" />
      <circle cx="28" cy="27" r="4.5" />
      <line x1="28" y1="31.5" x2="28" y2="39" />
    </g>

    <text x="140" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0"><tspan font-family="ui-monospace, monospace">python -m pip</tspan>, not bare <tspan font-family="ui-monospace, monospace">pip</tspan>; one environment per project; recreate rather than repair; </tspan>
      <tspan x="140" dy="28">rebuild after upgrading the base Python since a venv borrows its interpreter; </tspan>
      <tspan x="140" dy="28">never sudo pip install: PEP 668 externally-managed-environment, use venv, </tspan>
      <tspan x="140" dy="28">pipx or distribution packages; <tspan font-family="ui-monospace, monospace">--system-site-packages</tspan> weakens isolation</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <g id="bottom-bar">
    <!-- Bottom Bar Container (width=1520, height=58, x=40..1560, y=1102..1160) -->
    <rect x="40" y="1098" width="1520" height="62" rx="10" fill="#207448" />
    <text x="800" y="1139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Activation only changes the shell you are sitting in</text>
  </g>
</svg>