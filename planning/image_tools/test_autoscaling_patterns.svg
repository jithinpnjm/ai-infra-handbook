<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Autoscaling patterns per AI workload</title>
  <desc>Visual comparison table of Kubernetes autoscaling patterns across seven AI workloads showing pod scaling and node scaling choices followed by a multi-metric safety rule strip.</desc>
  <rect width="1600" height="1160" fill="#f5f8f5"/>
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Autoscaling patterns per AI workload</text>
  <!-- ==================== TABLE COLUMN HEADERS ==================== -->
  <rect x="40" y="90" width="1520" height="58" rx="10" fill="#207448"/>
  <text x="250" y="129" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Workload</text>
  <text x="721" y="129" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Pod scaling</text>
  <text x="1271" y="129" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Node scaling</text>
  <!-- ==================== ROW-1 ==================== -->
  <g id="row-1">
    <rect x="40" y="162" width="1520" height="156" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <rect x="46" y="168" width="416" height="144" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="1.2"/>
    <g transform="translate(56, 212)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6" fill="#fff5ec"/>
      <rect x="18" y="18" width="20" height="20" rx="3" fill="#db8129"/>
      <line x1="18" y1="3" x2="18" y2="10"/>
      <line x1="28" y1="3" x2="28" y2="10"/>
      <line x1="38" y1="3" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="53"/>
      <line x1="28" y1="46" x2="28" y2="53"/>
      <line x1="38" y1="46" x2="38" y2="53"/>
      <line x1="3" y1="18" x2="10" y2="18"/>
      <line x1="3" y1="28" x2="10" y2="28"/>
      <line x1="3" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="53" y2="18"/>
      <line x1="46" y1="28" x2="53" y2="28"/>
      <line x1="46" y1="38" x2="53" y2="38"/>
    </g>
    <text x="124" y="231.2" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">LLM online inference</tspan>
      <tspan x="124" dy="30">(vLLM, Triton, TGI)</tspan>
    </text>
    <rect x="472" y="168" width="496" height="144" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="218.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">HPA or KEDA on queue depth,</tspan>
      <tspan x="492" dy="28">concurrency, KV-cache;</tspan>
      <tspan x="492" dy="28">min 1 to 2; slow scale-down</tspan>
    </text>
    <rect x="978" y="168" width="576" height="144" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="204.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">fixed reserved GPU pool plus burst</tspan>
      <tspan x="998" dy="28">autoscaled pool, overprovision</tspan>
      <tspan x="998" dy="28">pause pods, pre-pulled images;</tspan>
      <tspan x="998" dy="28">replica start 2 to 15 min</tspan>
    </text>
  </g>
  <!-- ==================== ROW-2 ==================== -->
  <g id="row-2">
    <rect x="40" y="330" width="1520" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="46" y="336" width="416" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.2"/>
    <g transform="translate(56, 352)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 17 L 28 28 L 6 17 Z" fill="#e8f1ea"/>
      <path d="M 6 29 L 28 40 L 50 29"/>
      <path d="M 6 41 L 28 52 L 50 41"/>
    </g>
    <text x="124" y="371.2" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">Embedding and</tspan>
      <tspan x="124" dy="30">reranker services</tspan>
    </text>
    <rect x="472" y="336" width="496" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="372.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">HPA on CPU or GPU</tspan>
      <tspan x="492" dy="28">concurrency, smaller replicas</tspan>
    </text>
    <rect x="978" y="336" width="576" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="386.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">autoscaled L4 or L40S pool</tspan>
    </text>
  </g>
  <!-- ==================== ROW-3 ==================== -->
  <g id="row-3">
    <rect x="40" y="442" width="1520" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="46" y="448" width="416" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.2"/>
    <g transform="translate(56, 464)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="12" rx="3" fill="#e8f1ea"/>
      <rect x="8" y="23" width="40" height="12" rx="3" fill="#e8f1ea"/>
      <rect x="8" y="38" width="40" height="12" rx="3" fill="#e8f1ea"/>
      <line x1="16" y1="14" x2="26" y2="14"/>
      <line x1="16" y1="29" x2="26" y2="29"/>
      <line x1="16" y1="44" x2="26" y2="44"/>
    </g>
    <text x="124" y="498.8" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">Batch inference</tspan>
    </text>
    <rect x="472" y="448" width="496" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="484.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">KEDA on queue backlog,</tspan>
      <tspan x="492" dy="28">Jobs with parallelism</tspan>
    </text>
    <rect x="978" y="448" width="576" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="484.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">cluster autoscaler or Karpenter on</tspan>
      <tspan x="998" dy="28">Pending, spot allowed; scale to zero</tspan>
    </text>
  </g>
  <!-- ==================== ROW-4 ==================== -->
  <g id="row-4">
    <rect x="40" y="554" width="1520" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="46" y="560" width="416" height="118" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.2"/>
    <g transform="translate(56, 591)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="20" height="16" rx="3" fill="#e8f1ea"/>
      <rect x="30" y="8" width="20" height="16" rx="3" fill="#e8f1ea"/>
      <rect x="18" y="32" width="20" height="16" rx="3" fill="#e8f1ea"/>
      <line x1="16" y1="24" x2="28" y2="32"/>
      <line x1="40" y1="24" x2="28" y2="32"/>
      <circle cx="16" cy="16" r="2" fill="#207448"/>
      <circle cx="40" cy="16" r="2" fill="#207448"/>
      <circle cx="28" cy="40" r="2" fill="#207448"/>
    </g>
    <text x="124" y="625.8" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">Training</tspan>
    </text>
    <rect x="472" y="560" width="496" height="118" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="597.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">not HPA-based, fixed job size,</tspan>
      <tspan x="492" dy="28">elastic training can scale</tspan>
      <tspan x="492" dy="28">workers within min and max</tspan>
    </text>
    <rect x="978" y="560" width="576" height="118" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="597.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">admit with Kueue, provision nodes</tspan>
      <tspan x="998" dy="28">atomically; scale events trigger</tspan>
      <tspan x="998" dy="28">rendezvous restarts</tspan>
    </text>
  </g>
  <!-- ==================== ROW-5 ==================== -->
  <g id="row-5">
    <rect x="40" y="696" width="1520" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="46" y="702" width="416" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.2"/>
    <g transform="translate(56, 718)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14" fill="#e8f1ea"/>
      <circle cx="28" cy="28" r="5" fill="#207448"/>
      <line x1="28" y1="6" x2="28" y2="14"/>
      <line x1="28" y1="42" x2="28" y2="50"/>
      <line x1="6" y1="28" x2="14" y2="28"/>
      <line x1="42" y1="28" x2="50" y2="28"/>
      <line x1="12" y1="12" x2="18" y2="18"/>
      <line x1="38" y1="38" x2="44" y2="44"/>
      <line x1="12" y1="44" x2="18" y2="38"/>
      <line x1="38" y1="18" x2="44" y2="12"/>
    </g>
    <text x="124" y="737.2" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">Data processing</tspan>
      <tspan x="124" dy="30">(Spark, Ray)</tspan>
    </text>
    <rect x="472" y="702" width="496" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="738.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">operator-driven dynamic</tspan>
      <tspan x="492" dy="28">allocation</tspan>
    </text>
    <rect x="978" y="702" width="576" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="738.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">Ray autoscaler talks to Kubernetes</tspan>
      <tspan x="998" dy="28">through KubeRay</tspan>
    </text>
  </g>
  <!-- ==================== ROW-6 ==================== -->
  <g id="row-6">
    <rect x="40" y="808" width="1520" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="46" y="814" width="416" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.2"/>
    <g transform="translate(56, 830)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="#e8f1ea"/>
      <line x1="6" y1="18" x2="50" y2="18" stroke-width="3"/>
      <circle cx="13" cy="13" r="1.5" fill="#207448"/>
      <circle cx="19" cy="13" r="1.5" fill="#207448"/>
      <path d="M 14 28 L 22 34 L 14 40" stroke-width="3.5"/>
      <line x1="26" y1="40" x2="36" y2="40" stroke-width="3.5"/>
    </g>
    <text x="124" y="849.2" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">Interactive</tspan>
      <tspan x="124" dy="30">notebooks</tspan>
    </text>
    <rect x="472" y="814" width="496" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="864.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">none per user</tspan>
    </text>
    <rect x="978" y="814" width="576" height="88" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="850.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">pool scaling plus idle culling,</tspan>
      <tspan x="998" dy="28">quotas cap spend</tspan>
    </text>
  </g>
  <!-- ==================== ROW-7 ==================== -->
  <g id="row-7">
    <rect x="40" y="920" width="1520" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="46" y="926" width="416" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.2"/>
    <g transform="translate(56, 937)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 V 14 Z" fill="#e8f1ea"/>
      <path d="M 28 14 V 42"/>
      <path d="M 18 26 H 38"/>
    </g>
    <text x="124" y="971.8" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="124" dy="0">Gateways and ingress</tspan>
    </text>
    <rect x="472" y="926" width="496" height="78" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="492" y="971.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="492" dy="0">HPA on CPU, RPS or connections</tspan>
    </text>
    <rect x="978" y="926" width="576" height="78" rx="8" fill="#fdfdfd" stroke="#c4d5c9" stroke-width="1"/>
    <text x="998" y="971.2" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="998" dy="0">keep at least 3 for HA</tspan>
    </text>
  </g>
  <!-- ==================== RULE STRIP ==================== -->
  <g id="rule-strip">
    <rect x="40" y="1032" width="1520" height="92" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1069.2" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="800" dy="0">multi-metric safety: scale up on queue depth OR latency,</tspan>
      <tspan x="800" dy="30">scale down only when both are low over a long window</tspan>
    </text>
  </g>
</svg>