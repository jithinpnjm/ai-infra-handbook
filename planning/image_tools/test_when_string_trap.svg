<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>The string false trap in when</title>
  <desc>Visual explanation of the Ansible string false trap in when conditionals and how the bool filter safely converts it to a real boolean false.</desc>
  <rect width="1600" height="980" fill="#f5f8f5"/>
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The string false trap in when</text>
  <g id="lane-one">
    <rect x="40" y="95" width="740" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="68" y="120" width="684" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(92, 167)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="52" height="44" rx="6"/>
      <line x1="2" y1="18" x2="54" y2="18"/>
      <path d="M 14 28 L 22 34 L 14 40"/>
      <line x1="28" y1="40" x2="40" y2="40"/>
    </g>
    <text x="175" y="204" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">run with -e flag=false</text>
    <rect x="68" y="298" width="684" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(92, 345)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="44" height="48" rx="6"/>
      <path d="M 18 22 A 4 4 0 0 1 22 18 V 28"/>
      <path d="M 34 22 A 4 4 0 0 1 38 18 V 28"/>
      <line x1="16" y1="38" x2="40" y2="38"/>
    </g>
    <text x="175" y="362" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">the value arrives as</tspan>
      <tspan x="175" dy="38">the string false</tspan>
    </text>
    <rect x="68" y="476" width="684" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(92, 523)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 52 28 L 28 52 L 4 28 Z"/>
      <path d="M 20 28 L 26 34 L 38 20"/>
    </g>
    <text x="175" y="540" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">when: flag treats a</tspan>
      <tspan x="175" dy="38">non-empty string as true</tspan>
    </text>
    <rect x="68" y="654" width="684" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(92, 701)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <line x1="28" y1="16" x2="28" y2="30"/>
      <circle cx="28" cy="38" r="2" fill="#207448" stroke="none"/>
    </g>
    <text x="175" y="718" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">task runs when it</tspan>
      <tspan x="175" dy="38">should skip</tspan>
    </text>
  </g>
  <g id="lane-two">
    <rect x="820" y="95" width="740" height="740" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <rect x="848" y="120" width="684" height="200" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <g transform="translate(872, 192)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 38 6 A 14 14 0 0 0 24 20 L 8 36 A 6 6 0 0 0 16 44 L 32 28 A 14 14 0 0 0 46 14 Z"/>
      <circle cx="38" cy="14" r="3" fill="#db8129"/>
    </g>
    <text x="955" y="210" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="955" dy="0">fix with</tspan>
      <tspan x="955" dy="38" font-family="monospace">when: flag | bool</tspan>
    </text>
    <rect x="848" y="365" width="684" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(872, 437)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="20" height="36" rx="4"/>
      <rect x="32" y="10" width="20" height="36" rx="4"/>
      <path d="M 24 24 L 30 28 L 24 32"/>
    </g>
    <text x="955" y="455" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="955" dy="0">string false becomes</tspan>
      <tspan x="955" dy="38">boolean false</tspan>
    </text>
    <rect x="848" y="610" width="684" height="194" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(872, 679)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="10,14 28,28 10,42" fill="#e8f1ea"/>
      <polygon points="28,14 46,28 28,42" fill="#e8f1ea"/>
    </g>
    <text x="955" y="718" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">task skips</text>
  </g>
  <g id="footer-takeaway">
    <rect x="40" y="865" width="1520" height="80" rx="12" fill="#207448"/>
    <g transform="translate(68, 885)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="10"/>
      <line x1="23" y1="23" x2="36" y2="36"/>
      <line x1="31" y1="31" x2="36" y2="26"/>
    </g>
    <text x="800" y="915" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">write the bare expression when: var, not when: &quot;{{ var }}&quot;</text>
  </g>
</svg>