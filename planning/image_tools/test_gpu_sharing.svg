<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Choosing how to share a GPU, with the config for each</title>
  <desc>A visual decision guide and configuration reference for sharing GPUs across Slurm and Kubernetes.</desc>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- Diagram Title (48px bold) -->
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Choosing how to share a GPU, with the config for each</text>

  <!-- ==================== 1. WHOLE GPUS ROW ==================== -->
  <g id="row-whole-gpus">
    <rect x="40" y="130" width="1520" height="84" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- GPU Chip Icon (56px, stroke 4) -->
    <g transform="translate(62, 144)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <rect x="18" y="18" width="20" height="20" rx="2" fill="#e8f1ea"/>
      <line x1="18" y1="2" x2="18" y2="10"/>
      <line x1="28" y1="2" x2="28" y2="10"/>
      <line x1="38" y1="2" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="54"/>
      <line x1="28" y1="46" x2="28" y2="54"/>
      <line x1="38" y1="46" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="10" y2="18"/>
      <line x1="2" y1="28" x2="10" y2="28"/>
      <line x1="2" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="54" y2="18"/>
      <line x1="46" y1="28" x2="54" y2="28"/>
      <line x1="46" y1="38" x2="54" y2="38"/>
    </g>
    <text x="140" y="178" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Training, multi-GPU, performance-sensitive: </tspan>
      <tspan font-family="monospace">whole GPUs, never share</tspan>
    </text>
  </g>

  <!-- ==================== 2. MIG ROW (ORANGE HIGHLIGHT) ==================== -->
  <g id="row-mig">
    <rect x="40" y="256" width="1520" height="286" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    <!-- Partitioned Chip Icon (56px, orange stroke 4) -->
    <g transform="translate(62, 371)" stroke="#db8129" fill="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="4" fill="none"/>
      <line x1="6" y1="20" x2="50" y2="20" stroke-width="2.5" fill="none"/>
      <line x1="6" y1="35" x2="50" y2="35" stroke-width="2.5" fill="none"/>
      <line x1="20" y1="6" x2="20" y2="35" stroke-width="2.5" fill="none"/>
      <line x1="36" y1="6" x2="36" y2="35" stroke-width="2.5" fill="none"/>
      <line x1="28" y1="35" x2="28" y2="50" stroke-width="2.5" fill="none"/>
      <circle cx="13" cy="13" r="2.5"/>
      <circle cx="28" cy="13" r="2.5"/>
      <circle cx="43" cy="13" r="2.5"/>
      <circle cx="13" cy="27" r="2.5"/>
      <circle cx="28" cy="27" r="2.5"/>
      <circle cx="43" cy="27" r="2.5"/>
      <circle cx="17" cy="42" r="2.5"/>
      <circle cx="39" cy="42" r="2.5"/>
    </g>
    <text x="140" y="292" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Many small inference or dev jobs, isolation required: </tspan>
      <tspan font-weight="bold" fill="#207448">MIG; </tspan>
      <tspan>hardware partition of A100 or </tspan>
      <tspan x="140" dy="31">H100 into up to seven isolated instances, each with own SMs, memory and bandwidth; Slurm </tspan>
      <tspan x="140" dy="31">treats each instance as a GPU with cgroup isolation and task binding; config example </tspan>
      <tspan x="140" dy="31" font-family="monospace">Gres=gpu:a100:1,gpu:a100_3g.20gb:2 </tspan>
      <tspan>with </tspan>
      <tspan font-family="monospace">AccountingStorageTRES gres/gpu:a100_3g.20gb; </tspan>
      <tspan>Slurm </tspan>
      <tspan x="140" dy="31">does not partition the GPU: create instances with </tspan>
      <tspan font-family="monospace">nvidia-smi mig </tspan>
      <tspan>or the GPU Operator MIG </tspan>
      <tspan x="140" dy="31">manager before </tspan>
      <tspan font-family="monospace">slurmd </tspan>
      <tspan>starts; no dynamic MIG partitioning; static and fragmenting, a </tspan>
      <tspan x="140" dy="31">3g.20gb instance cannot be merged; no NVLink or multi-GPU use; </tspan>
      <tspan font-family="monospace">AutoDetect=nvml </tspan>
      <tspan>is the only </tspan>
      <tspan x="140" dy="31">mode that handles MIG</tspan>
    </text>
  </g>

  <!-- ==================== 3. MPS ROW ==================== -->
  <g id="row-mps">
    <rect x="40" y="584" width="1520" height="104" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Multi-Process Service Icon (56px, stroke 4) -->
    <g transform="translate(62, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="20"/>
      <circle cx="28" cy="28" r="8" fill="#e8f1ea"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="44" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="17" y2="17"/>
      <line x1="39" y1="39" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="17" y2="39"/>
      <line x1="39" y1="17" x2="45" y2="11"/>
    </g>
    <text x="140" y="630" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Many cooperating small processes, throughput, trusted users: </tspan>
      <tspan font-weight="bold" fill="#207448">MPS; </tspan>
      <tspan font-family="monospace">gres/mps count, </tspan>
      <tspan x="140" dy="32" font-family="monospace">Gres=gpu:2,mps:200 </tspan>
      <tspan>means 100 per GPU</tspan>
    </text>
  </g>

  <!-- ==================== 4. SHARDING ROW ==================== -->
  <g id="row-sharding">
    <rect x="40" y="730" width="1520" height="126" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Sharding / Grid Slices Icon (56px, stroke 4) -->
    <g transform="translate(62, 765)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="4"/>
      <line x1="6" y1="20" x2="50" y2="20"/>
      <line x1="6" y1="35" x2="50" y2="35"/>
      <line x1="20" y1="6" x2="20" y2="50"/>
      <line x1="36" y1="6" x2="36" y2="50"/>
    </g>
    <text x="140" y="767" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Maximum density, trusted workloads, simple: </tspan>
      <tspan font-weight="bold" fill="#207448">sharding; </tspan>
      <tspan x="140" dy="32" font-family="monospace">gres/shard, Gres=gpu:2,shard:64 </tspan>
      <tspan>gives 32 shards per GPU; </tspan>
      <tspan x="140" dy="32">by default it does not fence the processes or constrain device memory</tspan>
    </text>
  </g>

  <!-- ==================== 5. KUBERNETES ROW ==================== -->
  <g id="row-kubernetes">
    <rect x="40" y="898" width="1520" height="104" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <!-- Platform / Helm Steering Wheel Icon (56px, stroke 4) -->
    <g transform="translate(62, 922)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="16"/>
      <circle cx="28" cy="28" r="6" fill="#e8f1ea"/>
      <line x1="28" y1="4" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="45" y2="11"/>
    </g>
    <text x="140" y="944" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Fractional GPUs for notebooks and serving across a platform: </tspan>
      <tspan x="140" dy="32">consider Kubernetes (time-slicing, MIG, DRA)</tspan>
    </text>
  </g>

  <!-- ==================== 6. TIP / TAKEAWAY BAR ==================== -->
  <g id="row-tip">
    <rect x="40" y="1044" width="1520" height="104" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <!-- Tip / Diagnostic Check Icon (56px, stroke 4) -->
    <g transform="translate(62, 1068)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="18,28 25,36 38,20"/>
    </g>
    <text x="140" y="1090" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">keep MIG partitions and whole-GPU partitions separate; </tspan>
      <tspan>check with a one-GPU test in each </tspan>
      <tspan x="140" dy="32">and compare </tspan>
      <tspan font-family="monospace">nvidia-smi -L; </tspan>
      <tspan>MIG layout must be recreated before </tspan>
      <tspan font-family="monospace">slurmd </tspan>
      <tspan>after reboot</tspan>
    </text>
  </g>
</svg>