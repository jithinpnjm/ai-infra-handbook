<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>How iptables picks a backend: the 1 over N minus i chain</title>
  <desc>Worked example showing how iptables uses random probabilities 1/(N-i) across rules so each of four backends receives 25 percent of new connections.</desc>

  <!-- Background -->
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  <!-- Infographic Title (48px bold) -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">How iptables picks a backend: </tspan>
    <tspan x="800" dy="56">the 1 over N minus i chain</tspan>
  </text>

  <!-- ==================== MAIN CONTAINER: KUBE-SVC CHAIN ==================== -->
  <g id="chain-container">
    <rect x="40" y="155" width="1520" height="515" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <rect x="40" y="155" width="1520" height="55" rx="16" fill="#e8f1ea"/>
    <rect x="40" y="190" width="1520" height="20" fill="#e8f1ea"/>
    <line x1="40" y1="210" x2="1560" y2="210" stroke="#207448" stroke-width="2"/>
    <text x="800" y="192" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Worked example with four backends AAAA, BBBB, CCCC, DDDD in a KUBE-SVC-XXXX chain</text>

    <!-- RULE 1 -->
    <g id="rule-1">
      <rect x="65" y="230" width="1470" height="75" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Gear (56px) -->
      <g transform="translate(85, 240)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="11" fill="#e8f1ea"/>
        <path d="M 28 7 L 28 13 M 28 43 L 28 49 M 7 28 L 13 28 M 43 28 L 49 28 M 13 13 L 17.5 17.5 M 38.5 38.5 L 43 43 M 13 43 L 17.5 38.5 M 38.5 17.5 L 43 13"/>
      </g>
      <text x="160" y="277" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rule 1</text>
      <!-- Monospace rule command (width 880px, text width 818.4px, >30px padding on each side) -->
      <rect x="275" y="244" width="880" height="48" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
      <text x="715" y="276" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">statistic mode random probability 0.25 -&gt; KUBE-SEP-AAAA</text>
      <!-- Probability badge -->
      <rect x="1200" y="244" width="315" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="1357" y="276" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">(1/4)</text>
    </g>

    <!-- RULE 2 -->
    <g id="rule-2">
      <rect x="65" y="345" width="1470" height="75" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Gear (56px) -->
      <g transform="translate(85, 355)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="11" fill="#e8f1ea"/>
        <path d="M 28 7 L 28 13 M 28 43 L 28 49 M 7 28 L 13 28 M 43 28 L 49 28 M 13 13 L 17.5 17.5 M 38.5 38.5 L 43 43 M 13 43 L 17.5 38.5 M 38.5 17.5 L 43 13"/>
      </g>
      <text x="160" y="392" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rule 2</text>
      <!-- Monospace rule command (width 600px, text width 535.7px, >32px padding on each side) -->
      <rect x="275" y="359" width="600" height="48" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
      <text x="575" y="391" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">probability 0.33333 -&gt; KUBE-SEP-BBBB</text>
      <!-- Probability badge -->
      <rect x="925" y="359" width="590" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="1220" y="391" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">(1/3 of the remaining 3/4)</text>
    </g>

    <!-- RULE 3 -->
    <g id="rule-3">
      <rect x="65" y="460" width="1470" height="75" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <!-- Icon: Gear (56px) -->
      <g transform="translate(85, 470)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="11" fill="#e8f1ea"/>
        <path d="M 28 7 L 28 13 M 28 43 L 28 49 M 7 28 L 13 28 M 43 28 L 49 28 M 13 13 L 17.5 17.5 M 38.5 38.5 L 43 43 M 13 43 L 17.5 38.5 M 38.5 17.5 L 43 13"/>
      </g>
      <text x="160" y="507" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rule 3</text>
      <!-- Monospace rule command (width 560px, text width 491px, >34px padding on each side) -->
      <rect x="275" y="474" width="560" height="48" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
      <text x="555" y="506" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">probability 0.50 -&gt; KUBE-SEP-CCCC</text>
      <!-- Probability badge -->
      <rect x="885" y="474" width="630" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="1200" y="506" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">(1/2 of the remaining)</text>
    </g>

    <!-- RULE 4 (Orange highlight on the terminal fallback rule) -->
    <g id="rule-4">
      <rect x="65" y="575" width="1470" height="75" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
      <!-- Icon: Target / Check (56px) in orange -->
      <g transform="translate(85, 585)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="20" fill="#fff2e5"/>
        <polyline points="18 28 25 35 38 20"/>
      </g>
      <text x="160" y="622" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rule 4</text>
      <!-- Monospace rule command (width 500px, text width 431.5px, >34px padding on each side) -->
      <rect x="275" y="589" width="500" height="48" rx="8" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
      <text x="525" y="621" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">no condition -&gt; KUBE-SEP-DDDD</text>
      <!-- Probability explanation badge -->
      <rect x="825" y="589" width="690" height="48" rx="8" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
      <text x="1170" y="621" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">always matches because nothing is left</text>
    </g>
  </g>

  <!-- ==================== PROBABILITY BAR SECTION ==================== -->
  <g id="probability-section">
    <rect x="40" y="710" width="1520" height="175" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Icon: Chart (56px) -->
    <g transform="translate(65, 725)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="#e8f1ea"/>
      <line x1="16" y1="38" x2="16" y2="28"/>
      <line x1="28" y1="38" x2="28" y2="18"/>
      <line x1="40" y1="38" x2="40" y2="24"/>
    </g>
    <!-- Header -->
    <text x="800" y="750" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">each backend ends up with 25 percent of new connections</text>

    <!-- Probability Bar Segments (total width 1440 from 80 to 1520, each 360 wide) -->
    <rect x="80" y="775" width="1440" height="90" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2.5"/>
    <path d="M 90 775 H 440 V 865 H 90 A 10 10 0 0 1 80 855 V 785 A 10 10 0 0 1 90 775 Z" fill="#e8f1ea"/>
    <rect x="800" y="775" width="360" height="90" fill="#e8f1ea"/>
    <line x1="440" y1="775" x2="440" y2="865" stroke="#207448" stroke-width="2"/>
    <line x1="800" y1="775" x2="800" y2="865" stroke="#207448" stroke-width="2"/>
    <line x1="1160" y1="775" x2="1160" y2="865" stroke="#207448" stroke-width="2"/>

    <!-- Segment 1: Backend AAAA -->
    <text x="260" y="830" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">0.25</text>

    <!-- Segment 2: Backend BBBB -->
    <text x="620" y="817" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="620" dy="0">0.75 x 0.3333 </tspan>
      <tspan x="620" dy="32">= 0.25</tspan>
    </text>

    <!-- Segment 3: Backend CCCC -->
    <text x="980" y="817" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="980" dy="0">0.75 x 0.6667 x 0.5 </tspan>
      <tspan x="980" dy="32">= 0.25</tspan>
    </text>

    <!-- Segment 4: Backend DDDD -->
    <text x="1340" y="830" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">remainder 0.25</text>
  </g>

  <!-- ==================== NOTES SECTION ==================== -->
  <!-- Note 1: conntrack & round robin note -->
  <g id="note-1">
    <rect x="40" y="925" width="1520" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Shield (56px) -->
    <g transform="translate(65, 942)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 L 48 16 V 30 C 48 42 28 48 28 48 C 28 48 8 42 8 30 V 16 Z" fill="#ffffff"/>
      <polyline points="20 28 26 34 36 22"/>
    </g>
    <text x="830" y="962" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="830" dy="0">random, not real round robin; applies to new connections only; </tspan>
      <tspan x="830" dy="32">established flows stay on their backend via conntrack</tspan>
    </text>
  </g>

  <!-- Note 2: General formula card -->
  <g id="note-2">
    <rect x="40" y="1055" width="1520" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Icon: Formula / Sliders (56px) -->
    <g transform="translate(65, 1065)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="5" fill="#e8f1ea"/>
      <line x1="14" y1="20" x2="32" y2="20"/>
      <circle cx="36" cy="20" r="3" fill="#207448"/>
      <line x1="22" y1="34" x2="40" y2="34"/>
      <circle cx="18" cy="34" r="3" fill="#207448"/>
    </g>
    <text x="800" y="1102" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">rule i uses 1 / (N - i)</text>
  </g>
</svg>