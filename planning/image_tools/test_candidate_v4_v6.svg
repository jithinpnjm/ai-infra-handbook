<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>IPv4 and IPv6 headers side by side: what moved, what went away</title>
  <desc>Visual comparison of IPv4 and IPv6 header fields side by side showing what moved, what went away, simplified hardware parsing, and flexible extension headers.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <!-- Diagram Title -->
  <text x="800" y="44" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">IPv4 and IPv6 headers side by side: </tspan>
    <tspan x="800" dy="52">what moved, what went away</tspan>
  </text>
  <!-- ==================== LEFT COLUMN: IPv4 ==================== -->
  <g id="col-ipv4">
    <rect x="40" y="104" width="620" height="1008" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="58" y="116" width="584" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(72, 132)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="42" height="12" rx="3"/>
      <rect x="2" y="19" width="42" height="12" rx="3"/>
      <rect x="2" y="34" width="42" height="8" rx="2" stroke-dasharray="4 3"/>
    </g>
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="130" y="151">IPv4 header, </tspan>
      <tspan x="130" y="183">20 bytes minimum</tspan>
    </text>
    <!-- Card: row-version-v4 -->
    <rect x="58" y="204" width="584" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 212.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="4" width="38" height="38" rx="6"/>
  <path d="M 23 12 v 18 M 15 24 h 16 M 15 16 l 8 -4"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="244.6">Version 4</tspan>
    </text>
    <!-- Card: row-traffic-class-v4 -->
    <rect x="58" y="274" width="584" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 285.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round">
  <line x1="6" y1="13" x2="40" y2="13"/><circle cx="18" cy="13" r="4" fill="#e8f1ea"/>
  <line x1="6" y1="26" x2="40" y2="26"/><circle cx="30" cy="26" r="4" fill="#e8f1ea"/>
  <line x1="6" y1="39" x2="40" y2="39"/><circle cx="14" cy="39" r="4" fill="#e8f1ea"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="317.6">DSCP (6 bits) and ECN (2 bits)</tspan>
    </text>
    <!-- Card: row-ihl-flow-v4 -->
    <rect x="58" y="350" width="584" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 372.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="10" width="38" height="26" rx="4"/>
  <line x1="13" y1="10" x2="13" y2="20"/>
  <line x1="23" y1="10" x2="23" y2="26"/>
  <line x1="33" y1="10" x2="33" y2="20"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="390.6">IHL: header length in 32-bit </tspan>
      <tspan x="130" y="418.6">words, 5 means 20 bytes</tspan>
    </text>
    <!-- Card: row-length-v4 -->
    <rect x="58" y="448" width="584" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 456.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <line x1="6" y1="23" x2="40" y2="23"/>
  <polyline points="14,15 6,23 14,31"/>
  <polyline points="32,15 40,23 32,31"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="488.6">Total Length up to 65,535</tspan>
    </text>
    <!-- Card: row-fragmentation-v4 -->
    <rect x="58" y="518" width="584" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 555.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="14" r="6"/>
  <circle cx="12" cy="32" r="6"/>
  <line x1="17" y1="17" x2="38" y2="35"/>
  <line x1="17" y1="29" x2="38" y2="11"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="553.7">Identification, Flags (DF, MF), </tspan>
      <tspan x="130" y="579.7">Fragment Offset: fragmentation </tspan>
      <tspan x="130" y="605.7">lives in the base header; routers </tspan>
      <tspan x="130" y="631.7">may fragment unless DF is set</tspan>
    </text>
    <!-- Card: row-ttl-hop-v4 -->
    <rect x="58" y="646" width="584" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 668.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="23" cy="23" r="18"/>
  <polyline points="23,12 23,23 32,23"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="681.7">TTL: drops by one per router, at 0 </tspan>
      <tspan x="130" y="709.7">the router drops the packet and </tspan>
      <tspan x="130" y="737.7">sends ICMP Time Exceeded</tspan>
    </text>
    <!-- Card: row-protocol-next-v4 -->
    <rect x="58" y="744" width="584" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 781.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="6" width="34" height="34" rx="4"/>
  <line x1="14" y1="15" x2="32" y2="15"/>
  <line x1="14" y1="23" x2="32" y2="23"/>
  <line x1="14" y1="31" x2="26" y2="31"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="799.6">Protocol: 6 TCP, 17 UDP, 1 ICMP, </tspan>
      <tspan x="130" y="827.6">47 GRE, 50 ESP, 89 OSPF</tspan>
    </text>
    <!-- Card: row-checksum-v4 -->
    <rect x="58" y="872" width="584" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 883.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="6" width="34" height="34" rx="5"/>
  <path d="M 31 14 H 16 L 24 23 L 16 32 H 31"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="907.7">Header checksum: recomputed at </tspan>
      <tspan x="130" y="935.7">every hop because the TTL changes</tspan>
    </text>
    <!-- Card: row-addresses-v4 -->
    <rect x="58" y="948" width="584" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 959.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 23 6 C 15 6 10 12 10 19 C 10 28 23 41 23 41 C 23 41 36 28 36 19 C 36 12 31 6 23 6 Z"/>
  <circle cx="23" cy="18" r="4"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="983.7">source and destination 32-bit </tspan>
      <tspan x="130" y="1011.7">addresses</tspan>
    </text>
    <!-- Card: row-options-v4 -->
    <rect x="58" y="1024" width="584" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(72, 1031.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="23" cy="23" r="10"/>
  <path d="M 23 5 v 6 M 23 35 v 6 M 5 23 h 6 M 35 23 h 6 M 10 10 l 4 4 M 32 32 l 4 4 M 10 36 l 4 -4 M 32 10 l 4 4"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" y="1063.6">options (rare)</tspan>
    </text>
  </g>
  <!-- ==================== RIGHT COLUMN: IPv6 ==================== -->
  <g id="col-ipv6">
    <rect x="940" y="104" width="620" height="1008" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="958" y="116" width="584" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(972, 132)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="42" height="16" rx="3"/>
      <rect x="2" y="24" width="42" height="16" rx="3"/>
      <line x1="12" y1="12" x2="34" y2="12"/>
      <line x1="12" y1="32" x2="34" y2="32"/>
    </g>
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1030" y="151">IPv6 header, </tspan>
      <tspan x="1030" y="183">40 bytes fixed</tspan>
    </text>
    <!-- Card: row-version-v6 -->
    <rect x="958" y="204" width="584" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 212.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="4" width="38" height="38" rx="6"/>
  <circle cx="23" cy="27" r="7"/>
  <path d="M 27 13 c -4 -2 -11 3 -11 14"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="244.6">Version 4 bits</tspan>
    </text>
    <!-- Card: row-traffic-class-v6 -->
    <rect x="958" y="274" width="584" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 285.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 6 38 L 18 10 L 30 26 L 40 16"/>
  <polyline points="32,16 40,16 40,24"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="309.7">Traffic Class 8 bits = DSCP 6 + </tspan>
      <tspan x="1030" y="337.7">ECN 2</tspan>
    </text>
    <!-- Card: row-ihl-flow-v6 -->
    <rect x="958" y="350" width="584" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 372.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 6 14 C 18 14 20 32 38 32"/>
  <path d="M 6 32 C 18 32 20 14 38 14"/>
  <polyline points="32,10 38,14 32,18"/>
  <polyline points="32,28 38,32 32,36"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="385.7">Flow Label 20 bits: helps routers </tspan>
      <tspan x="1030" y="413.7">keep a flow on one path when ECMP </tspan>
      <tspan x="1030" y="441.7">spreads traffic</tspan>
    </text>
    <!-- Card: row-length-v6 -->
    <rect x="958" y="448" width="584" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 456.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="8" width="34" height="30" rx="4"/>
  <line x1="6" y1="18" x2="40" y2="18"/>
  <line x1="23" y1="18" x2="23" y2="38"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="488.6">Payload Length 16</tspan>
    </text>
    <!-- Card: row-fragmentation-v6 -->
    <rect x="958" y="518" width="584" height="120" rx="8" fill="#fef8f2" stroke="#db8129" stroke-width="2.2"/>
<g transform="translate(972, 555.0)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="23" cy="23" r="18"/>
  <line x1="10" y1="10" x2="36" y2="36"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#db8129">
      <tspan x="1030" y="553.7">no fragmentation fields in the </tspan>
      <tspan x="1030" y="579.7">base header: only the source host </tspan>
      <tspan x="1030" y="605.7">may fragment, through an extension </tspan>
      <tspan x="1030" y="631.7">header; routers never do</tspan>
    </text>
    <line x1="1028" y1="546.7" x2="1462.0" y2="546.7" stroke="#db8129" stroke-width="2.2" opacity="0.85"/>
    <line x1="1028" y1="572.7" x2="1505.2" y2="572.7" stroke="#db8129" stroke-width="2.2" opacity="0.85"/>
    <line x1="1028" y1="598.7" x2="1519.6" y2="598.7" stroke="#db8129" stroke-width="2.2" opacity="0.85"/>
    <line x1="1028" y1="624.7" x2="1375.6" y2="624.7" stroke="#db8129" stroke-width="2.2" opacity="0.85"/>
    <!-- Card: row-ttl-hop-v6 -->
    <rect x="958" y="646" width="584" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 668.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 8 6 H 38 L 27 23 L 38 40 H 8 L 19 23 Z"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="686.6">Hop Limit 8: plays the role of the </tspan>
      <tspan x="1030" y="714.6">TTL</tspan>
    </text>
    <!-- Card: row-protocol-next-v6 -->
    <rect x="958" y="744" width="584" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 781.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="14" width="20" height="18" rx="6"/>
  <rect x="20" y="14" width="20" height="18" rx="6"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="779.7">Next Header 8: extension headers </tspan>
      <tspan x="1030" y="805.7">chained (hop-by-hop, routing, </tspan>
      <tspan x="1030" y="831.7">fragment, destination options, AH, </tspan>
      <tspan x="1030" y="857.7">ESP)</tspan>
    </text>
    <!-- Card: row-checksum-v6 -->
    <rect x="958" y="872" width="584" height="68" rx="8" fill="#fef8f2" stroke="#db8129" stroke-width="2.2"/>
<g transform="translate(972, 883.0)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 23 5 L 39 12 V 22 C 39 33 23 41 23 41 C 23 41 7 33 7 22 V 12 Z"/>
  <line x1="15" y1="18" x2="31" y2="28"/>
  <line x1="31" y1="18" x2="15" y2="28"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#db8129">
      <tspan x="1030" y="907.7">no header checksum (link and </tspan>
      <tspan x="1030" y="935.7">transport layers cover errors)</tspan>
    </text>
    <line x1="1028" y1="900.7" x2="1433.2" y2="900.7" stroke="#db8129" stroke-width="2.2" opacity="0.85"/>
    <line x1="1028" y1="928.7" x2="1462.0" y2="928.7" stroke="#db8129" stroke-width="2.2" opacity="0.85"/>
    <!-- Card: row-addresses-v6 -->
    <rect x="958" y="948" width="584" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
<g transform="translate(972, 959.0)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="23" cy="23" r="18"/>
  <ellipse cx="23" cy="23" rx="8" ry="18"/>
  <line x1="5" y1="23" x2="41" y2="23"/>
</g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1030" y="983.7">source and destination 128-bit </tspan>
      <tspan x="1030" y="1011.7">addresses</tspan>
    </text>
  </g>
  <!-- ==================== ARROWS BETWEEN COLUMNS ==================== -->
  <g id="corridor-arrows">
    <!-- Arrow: DSCP+ECN to Traffic Class -->
    <line x1="645" y1="308.0" x2="955" y2="308.0" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <text x="800" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="800" dy="0">DSCP+ECN to </tspan>
      <tspan x="800" dy="28">Traffic Class</tspan>
    </text>
    <!-- Arrow: TTL to Hop Limit -->
    <line x1="645" y1="691.0" x2="955" y2="691.0" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <text x="800" y="681.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">TTL to Hop Limit</text>
    <!-- Arrow: Protocol to Next Header -->
    <line x1="645" y1="804.0" x2="955" y2="804.0" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <text x="800" y="782.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="800" dy="0">Protocol to </tspan>
      <tspan x="800" dy="28">Next Header</tspan>
    </text>
  </g>
  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="1124" width="1520" height="56" rx="12" fill="#207448"/>
    <g transform="translate(65, 1132)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 4 L 36 10 V 20 C 36 30 20 38 20 38 C 20 38 4 30 4 20 V 10 Z"/>
      <polyline points="12,19 18,25 28,15"/>
    </g>
    <text x="125" y="1160" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">A fixed header keeps hardware parsing simple, and extension headers keep the design flexible</text>
  </g>
</svg>