<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From a failed unit message or status code to the layer that broke</title>
  <desc>Visual guide mapping systemctl and journal failure messages and systemd status codes to their root causes, with first-look commands and diagnostic workflow.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">From a failed unit message or status code to the layer that broke</text>
  <!-- Left Column Container -->
  <rect x="40" y="95" width="730" height="875" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Left Column Header -->
  <g transform="translate(60, 105)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 4 L 36 4 L 48 16 L 48 52 L 8 52 Z" />
    <path d="M 36 4 L 36 16 L 48 16" stroke-width="3" />
    <line x1="16" y1="26" x2="40" y2="26" stroke-width="3.5" />
    <line x1="16" y1="34" x2="40" y2="34" stroke-width="3.5" />
    <line x1="16" y1="42" x2="28" y2="42" stroke-width="3.5" />
  </g>
  <text x="130" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Message from systemctl or the journal</text>
  <!-- Left Card 1: Message -->
  <rect x="55" y="175" width="325" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="217.5" y="226.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="217.5" dy="0">Failed to start X:</tspan>
    <tspan x="217.5" dy="28">Unit X not found</tspan>
  </text>
  <!-- Left Card 1: Arrow -->
  <line x1="380" y1="232.5" x2="408" y2="232.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Left Card 1: Cause -->
  <rect x="410" y="175" width="345" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="582.5" y="212.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="582.5" dy="0">wrong name, path or</tspan>
    <tspan x="582.5" dy="28">alias; daemon-reload</tspan>
    <tspan x="582.5" dy="28">may fix it</tspan>
  </text>
  <!-- Left Card 2: Message -->
  <rect x="55" y="330" width="325" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="217.5" y="361.0" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="217.5" dy="0">Job for X failed</tspan>
    <tspan x="217.5" dy="28">because the control</tspan>
    <tspan x="217.5" dy="28">process exited with</tspan>
    <tspan x="217.5" dy="28">error code</tspan>
  </text>
  <!-- Left Card 2: Arrow -->
  <line x1="380" y1="395.0" x2="408" y2="395.0" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Left Card 2: Cause -->
  <rect x="410" y="330" width="345" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="582.5" y="403.0" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="582.5" dy="0">read journalctl -xeu X</tspan>
  </text>
  <!-- Left Card 3: Message -->
  <rect x="55" y="500" width="325" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="217.5" y="559.0" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="217.5" dy="0">start request</tspan>
    <tspan x="217.5" dy="28">repeated too quickly</tspan>
  </text>
  <!-- Left Card 3: Arrow -->
  <line x1="380" y1="565.0" x2="408" y2="565.0" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Left Card 3: Cause -->
  <rect x="410" y="500" width="345" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="582.5" y="531.0" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="582.5" dy="0">start limit hit:</tspan>
    <tspan x="582.5" dy="28">reset-failed, fix the</tspan>
    <tspan x="582.5" dy="28">cause, lengthen</tspan>
    <tspan x="582.5" dy="28">RestartSec</tspan>
  </text>
  <!-- Left Card 4: Message -->
  <rect x="55" y="670" width="325" height="105" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="217.5" y="716.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="217.5" dy="0">Dependency failed</tspan>
    <tspan x="217.5" dy="28">for X</tspan>
  </text>
  <!-- Left Card 4: Arrow -->
  <line x1="380" y1="722.5" x2="408" y2="722.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Left Card 4: Cause -->
  <rect x="410" y="670" width="345" height="105" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="582.5" y="716.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="582.5" dy="0">a Requires dependency</tspan>
    <tspan x="582.5" dy="28">failed</tspan>
  </text>
  <!-- Left Card 5: Message -->
  <rect x="55" y="815" width="325" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="217.5" y="880.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="217.5" dy="0">Unit is masked</tspan>
  </text>
  <!-- Left Card 5: Arrow -->
  <line x1="380" y1="872.5" x2="408" y2="872.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Left Card 5: Cause -->
  <rect x="410" y="815" width="345" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="582.5" y="866.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="582.5" dy="0">the unit cannot be</tspan>
    <tspan x="582.5" dy="28">started at all</tspan>
  </text>
  <!-- Right Column Container -->
  <rect x="810" y="95" width="750" height="875" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <!-- Right Column Header -->
  <g transform="translate(830, 105)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="12" />
    <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12.5 12.5 L 16.7 16.7 M 39.3 39.3 L 43.5 43.5 M 12.5 43.5 L 16.7 39.3 M 39.3 16.7 L 43.5 12.5" />
  </g>
  <text x="910" y="142" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">status= code</text>
  <!-- Right Card 1: Code -->
  <rect x="825" y="175" width="255" height="130" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="952.5" y="248.0" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="952.5" dy="0">203/EXEC</tspan>
  </text>
  <!-- Right Card 1: Arrow -->
  <line x1="1080" y1="240.0" x2="1108" y2="240.0" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <!-- Right Card 1: Cause -->
  <rect x="1110" y="175" width="435" height="130" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="1327.5" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">ExecStart binary cannot run:</tspan>
    <tspan x="1327.5" dy="28">path, permissions, a noexec</tspan>
    <tspan x="1327.5" dy="28">mount, wrong architecture,</tspan>
    <tspan x="1327.5" dy="28">or a bad shebang</tspan>
  </text>
  <!-- Right Card 2: Code -->
  <rect x="825" y="320" width="255" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="952.5" y="365.5" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="952.5" dy="0">200/CHDIR</tspan>
  </text>
  <!-- Right Card 2: Arrow -->
  <line x1="1080" y1="357.5" x2="1108" y2="357.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Right Card 2: Cause -->
  <rect x="1110" y="320" width="435" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1327.5" y="365.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">bad WorkingDirectory=</tspan>
  </text>
  <!-- Right Card 3: Code -->
  <rect x="825" y="410" width="255" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="952.5" y="455.5" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="952.5" dy="0">217/USER</tspan>
  </text>
  <!-- Right Card 3: Arrow -->
  <line x1="1080" y1="447.5" x2="1108" y2="447.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Right Card 3: Cause -->
  <rect x="1110" y="410" width="435" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1327.5" y="455.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">bad User=</tspan>
  </text>
  <!-- Right Card 4: Code -->
  <rect x="825" y="500" width="255" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="952.5" y="545.5" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="952.5" dy="0">226/NAMESPACE</tspan>
  </text>
  <!-- Right Card 4: Arrow -->
  <line x1="1080" y1="537.5" x2="1108" y2="537.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Right Card 4: Cause -->
  <rect x="1110" y="500" width="435" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1327.5" y="545.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">sandbox mount problem</tspan>
  </text>
  <!-- Right Card 5: Code -->
  <rect x="825" y="590" width="255" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="952.5" y="635.5" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="952.5" dy="0">1/FAILURE</tspan>
  </text>
  <!-- Right Card 5: Arrow -->
  <line x1="1080" y1="627.5" x2="1108" y2="627.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Right Card 5: Cause -->
  <rect x="1110" y="590" width="435" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1327.5" y="635.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">the program's own exit</tspan>
  </text>
  <!-- Right Card 6: Code -->
  <rect x="825" y="680" width="255" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="952.5" y="721.5" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="952.5" dy="0">signal=KILL or</tspan>
    <tspan x="952.5" dy="28">code=killed</tspan>
  </text>
  <!-- Right Card 6: Arrow -->
  <line x1="1080" y1="727.5" x2="1108" y2="727.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Right Card 6: Cause -->
  <rect x="1110" y="680" width="435" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1327.5" y="721.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">killed by the OOM killer</tspan>
    <tspan x="1327.5" dy="28">or a timeout</tspan>
  </text>
  <!-- Right Card 7: Code -->
  <rect x="825" y="790" width="255" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="952.5" y="835.5" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="952.5" dy="0">Result: timeout</tspan>
  </text>
  <!-- Right Card 7: Arrow -->
  <line x1="1080" y1="827.5" x2="1108" y2="827.5" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <!-- Right Card 7: Cause -->
  <rect x="1110" y="790" width="435" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1327.5" y="835.5" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1327.5" dy="0">unit ran past its time limit</tspan>
  </text>
  <!-- Bottom Strip: First-look Commands -->
  <rect x="40" y="1010" width="1520" height="65" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="65" y="1018" width="290" height="49" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="210.0" y="1051" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">systemctl status</text>
  <rect x="385" y="1018" width="360" height="49" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="565.0" y="1051" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">journalctl -u NAME -b</text>
  <rect x="775" y="1018" width="250" height="49" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="900.0" y="1051" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">systemctl cat</text>
  <rect x="1055" y="1018" width="480" height="49" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1295.0" y="1051" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">systemd-analyze verify FILE</text>
  <!-- Bottom Bar: Takeaway -->
  <rect x="40" y="1115" width="1520" height="45" rx="10" fill="#207448" />
  <text x="800" y="1147" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Start with the status code, then read the journal for that unit</text>
</svg>