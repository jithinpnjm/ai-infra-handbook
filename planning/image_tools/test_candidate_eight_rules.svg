<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Eight rules that keep many servers acting as one</title>
  <desc>Eight rules that keep many servers acting as one around a central illusion of a giant computer with three failure examples.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Eight rules that keep many servers acting as one</text>

  <!-- ================= ROW 1 ================= -->
  <!-- Tile 1: (x=40, y=115, w=480, h=215) -->
  <g id="tile-1">
    <rect x="40" y="115" width="480" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Server stack / software layer (52x52 at 62, 137) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="62" y="141" width="44" height="12" rx="3"/>
      <rect x="62" y="159" width="44" height="12" rx="3"/>
      <rect x="62" y="177" width="44" height="12" rx="3"/>
      <line x1="72" y1="147" x2="74" y2="147"/>
      <line x1="72" y1="165" x2="74" y2="165"/>
      <line x1="72" y1="183" x2="74" y2="183"/>
    </g>
    <!-- Text: Tile 1 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="124" y="165" font-size="30" font-weight="bold">1 Identical software</tspan>
      <tspan x="124" y="197" font-size="30" font-weight="bold">state:</tspan>
      <tspan x="62" y="240">same OS image, kernel patch</tspan>
      <tspan x="62" y="270">level, GPU driver,</tspan>
      <tspan x="62" y="300">NIC firmware</tspan>
    </text>
  </g>

  <!-- Tile 2: (x=560, y=115, w=480, h=215) -->
  <g id="tile-2">
    <rect x="560" y="115" width="480" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Clock for time sync (52x52 at 582, 141) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="604" cy="165" r="22"/>
      <polyline points="604,151 604,165 614,171"/>
    </g>
    <!-- Text: Tile 2 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="644" y="165" font-size="30" font-weight="bold">2 Synchronized time</tspan>
      <tspan x="644" y="197" font-size="30" font-weight="bold">and identity:</tspan>
      <tspan x="582" y="250">chrony or NTP; same numeric</tspan>
      <tspan x="582" y="286">UID and GID everywhere</tspan>
    </text>
  </g>

  <!-- Tile 3: (x=1080, y=115, w=480, h=215) -->
  <g id="tile-3">
    <rect x="1080" y="115" width="480" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Network nodes / fabric (52x52 at 1102, 141) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="1112" cy="151" r="7"/>
      <circle cx="1146" cy="151" r="7"/>
      <circle cx="1129" cy="181" r="7"/>
      <line x1="1118" y1="154" x2="1140" y2="154"/>
      <line x1="1116" y1="157" x2="1125" y2="175"/>
      <line x1="1142" y1="157" x2="1133" y2="175"/>
    </g>
    <!-- Text: Tile 3 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1164" y="165" font-size="30" font-weight="bold">3 Predictable naming</tspan>
      <tspan x="1164" y="197" font-size="30" font-weight="bold">and networking:</tspan>
      <tspan x="1102" y="240">DNS, hosts, DHCP and PXE,</tspan>
      <tspan x="1102" y="270">out-of-band management</tspan>
      <tspan x="1102" y="300">network, compute fabric</tspan>
    </text>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- Tile 8: (x=40, y=370, w=480, h=200) -->
  <g id="tile-8">
    <rect x="40" y="370" width="480" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Spare parts / SLA shield (52x52 at 62, 396) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 84,396 L 104,404 L 104,422 C 104,436 84,446 84,446 C 84,446 64,436 64,422 L 64,404 Z"/>
      <polyline points="74,420 81,427 94,414"/>
    </g>
    <!-- Text: Tile 8 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="124" y="420" font-size="30" font-weight="bold">8 Spares and SLA</tspan>
      <tspan x="124" y="452" font-size="30" font-weight="bold">discipline:</tspan>
      <tspan x="62" y="504">on-site stock of key spares,</tspan>
      <tspan x="62" y="540">vendor replacement SLAs</tspan>
    </text>
  </g>

  <!-- Central Box: (x=560, y=370, w=480, h=200) -->
  <g id="center-node">
    <!-- Single Orange item in the diagram -->
    <rect x="560" y="370" width="480" height="200" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    <!-- Central icon: Supercomputer / unified cube -->
    <g stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="780" y="394" width="40" height="40" rx="6"/>
      <line x1="780" y1="414" x2="820" y2="414"/>
      <line x1="800" y1="394" x2="800" y2="434"/>
      <circle cx="800" cy="414" r="5" fill="#db8129"/>
    </g>
    <!-- Text: Central label -->
    <text x="800" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" y="474">one illusion of a</tspan>
      <tspan x="800" y="516">giant computer</tspan>
    </text>
  </g>

  <!-- Tile 4: (x=1080, y=370, w=480, h=200) -->
  <g id="tile-4">
    <rect x="1080" y="370" width="480" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Storage cylinders (52x52 at 1102, 396) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="1126" cy="410" rx="20" ry="7"/>
      <path d="M 1106,410 L 1106,426 C 1106,430 1115,433 1126,433 C 1137,433 1146,430 1146,426 L 1146,410"/>
      <path d="M 1106,426 L 1106,442 C 1106,446 1115,449 1126,449 C 1137,449 1146,446 1146,442 L 1146,426"/>
    </g>
    <!-- Text: Tile 4 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1164" y="420" font-size="30" font-weight="bold">4 Uniform shared</tspan>
      <tspan x="1164" y="452" font-size="30" font-weight="bold">storage:</tspan>
      <tspan x="1102" y="504">same mount paths,</tspan>
      <tspan x="1102" y="540">enforced quotas</tspan>
    </text>
  </g>

  <!-- ================= ROW 3 ================= -->
  <!-- Tile 7: (x=40, y=610, w=480, h=320) -->
  <g id="tile-7">
    <rect x="40" y="610" width="480" height="320" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Provisioning / repeat cycle (52x52 at 62, 636) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 98,648 A 18 18 0 1 0 102,668"/>
      <polyline points="94,641 102,648 94,656"/>
      <rect x="76" y="658" width="16" height="14" rx="2"/>
    </g>
    <!-- Text: Tile 7 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="124" y="660" font-size="30" font-weight="bold">7 Repeatable</tspan>
      <tspan x="124" y="692" font-size="30" font-weight="bold">provisioning:</tspan>
      <tspan x="62" y="746">a replacement server boots</tspan>
      <tspan x="62" y="782">into an identical state within</tspan>
      <tspan x="62" y="818">minutes</tspan>
    </text>
  </g>

  <!-- Tile 6: (x=560, y=610, w=480, h=320) -->
  <g id="tile-6">
    <rect x="560" y="610" width="480" height="320" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Observability / sensor pulse (52x52 at 582, 636) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="582" y="638" width="44" height="40" rx="6"/>
      <polyline points="590,660 598,660 603,649 607,671 612,660 618,660"/>
    </g>
    <!-- Text: Tile 6 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="644" y="660" font-size="30" font-weight="bold">6 Comprehensive</tspan>
      <tspan x="644" y="692" font-size="30" font-weight="bold">observability:</tspan>
      <tspan x="582" y="742">node health, temperatures,</tspan>
      <tspan x="582" y="774">power supplies,</tspan>
      <tspan x="582" y="806">air conditioning, UPS,</tspan>
      <tspan x="582" y="838">fabric symbol errors,</tspan>
      <tspan x="582" y="870">GPU faults</tspan>
    </text>
  </g>

  <!-- Tile 5: (x=1080, y=610, w=480, h=320) -->
  <g id="tile-5">
    <rect x="1080" y="610" width="480" height="320" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Icon: Central scheduler / queue orchestration (52x52 at 1102, 636) -->
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="1104" y="638" width="42" height="42" rx="5"/>
      <line x1="1104" y1="652" x2="1146" y2="652"/>
      <line x1="1116" y1="638" x2="1116" y2="652"/>
      <line x1="1134" y1="638" x2="1134" y2="652"/>
      <circle cx="1116" cy="664" r="3" fill="#207448"/>
      <circle cx="1132" cy="664" r="3" fill="#207448"/>
    </g>
    <!-- Text: Tile 5 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1164" y="658" font-size="30" font-weight="bold">5 Centralized</tspan>
      <tspan x="1164" y="688" font-size="30" font-weight="bold">scheduling and</tspan>
      <tspan x="1164" y="718" font-size="30" font-weight="bold">accounting:</tspan>
      <tspan x="1102" y="754">users never start work on</tspan>
      <tspan x="1102" y="784">compute nodes directly;</tspan>
      <tspan x="1102" y="814">scheduler places jobs,</tspan>
      <tspan x="1102" y="844">isolates them in cgroups,</tspan>
      <tspan x="1102" y="874">logs usage</tspan>
    </text>
  </g>

  <!-- ================= ROW 4 (Failure Examples) ================= -->
  <!-- Fail 1: (x=40, y=970, w=480, h=190) -->
  <g id="fail-1">
    <rect x="40" y="970" width="480" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8,5"/>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="62" y="1018">clock drift of a few seconds</tspan>
      <tspan x="62" y="1052">makes ranks disagree and</tspan>
      <tspan x="62" y="1086">looks like an application</tspan>
      <tspan x="62" y="1120">bug</tspan>
    </text>
  </g>

  <!-- Fail 2: (x=560, y=970, w=480, h=190) -->
  <g id="fail-2">
    <rect x="560" y="970" width="480" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8,5"/>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="582" y="1012">one node with an older GPU</tspan>
      <tspan x="582" y="1042">driver runs slightly slower</tspan>
      <tspan x="582" y="1072">or different and nothing in</tspan>
      <tspan x="582" y="1102">the job log points to it;</tspan>
      <tspan x="582" y="1132">compare driver versions</tspan>
    </text>
  </g>

  <!-- Fail 3: (x=1080, y=970, w=480, h=190) -->
  <g id="fail-3">
    <rect x="1080" y="970" width="480" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8,5"/>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1102" y="1026">a different UID makes a user</tspan>
      <tspan x="1102" y="1064">unable to read their own</tspan>
      <tspan x="1102" y="1102">checkpoint</tspan>
    </text>
  </g>
</svg>