<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Timeline overview</title>
  <desc>Sequence diagram illustrating the end-to-end lifecycle of a Kubernetes Pod from user submission through scheduling, kubelet admission, GPU device plugin allocation, CSI volume mounting, containerd CRI sandbox and CNI networking, runc kernel container creation, steady-state running probes, and graceful termination.</desc>
