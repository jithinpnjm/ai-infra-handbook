    </g>
    <text x="148" y="104" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="148" dy="0">User / </tspan><tspan x="148" dy="25">controller</tspan></text>
  </g>
  <g id="participant-S">
