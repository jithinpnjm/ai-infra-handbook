  <line x1="1126" y1="134" x2="1126" y2="1155" stroke="#b8c9c0" stroke-width="2.5" stroke-dasharray="8 6" />
  <line x1="1452" y1="134" x2="1452" y2="1155" stroke="#b8c9c0" stroke-width="2.5" stroke-dasharray="8 6" />
  <line x1="311" y1="222" x2="311" y2="1155" stroke="#b8c9c0" stroke-width="2.5" stroke-dasharray="8 6" />
  <line x1="637" y1="222" x2="637" y2="1155" stroke="#b8c9c0" stroke-width="2.5" stroke-dasharray="8 6" />
