<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Model hosting: shared on demand versus dedicated always on</title>
  <desc>Visual infographic contrasting cost-optimised shared on-demand model hosting with latency-optimised dedicated always-on replicas, highlighting cold start latency risks and the warm pool resident cache recipe.</desc>

  <!-- Background -->
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  <!-- Title (48px bold) -->
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" y="60">Model hosting: shared on demand</tspan>
    <tspan x="800" y="116">versus dedicated always on</tspan>
  </text>

  <!-- ==================== TOP ROW: TWO HOSTING SHAPES ==================== -->

  <!-- Card 1: Cost-optimised (Top Left) -->
  <g id="box-cost">
    <rect x="45" y="150" width="730" height="410" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <!-- Shared Server / Bin-packed instances outline icon (56x56, green stroke 4) -->
    <g transform="translate(85, 172)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4"/>
      <line x1="6" y1="21" x2="50" y2="21"/>
      <line x1="6" y1="35" x2="50" y2="35"/>
      <line x1="28" y1="8" x2="28" y2="21"/>
      <line x1="20" y1="21" x2="20" y2="35"/>
      <line x1="36" y1="21" x2="36" y2="35"/>
      <circle cx="12" cy="42" r="2" fill="#207448"/>
      <circle cx="18" cy="42" r="2" fill="#207448"/>
    </g>

    <text font-family="sans-serif" fill="#303a36" font-size="24">
      <tspan x="90" y="275" font-size="30" font-weight="bold" fill="#207448">Cost-optimised:</tspan>
      <tspan x="90" y="312" font-size="24">shares instances across many models,</tspan>
      <tspan x="90" y="347" font-size="24">loads on demand, bin-packs (fitting as many</tspan>
      <tspan x="90" y="382" font-size="24">models onto each machine as possible, like</tspan>
      <tspan x="90" y="417" font-size="24">boxes in a van); cheap but reactive, surges</tspan>
      <tspan x="90" y="452" font-size="24">hurt; maps to Nebius serverless endpoints</tspan>
      <tspan x="90" y="487" font-size="24">for shared pools of popular models</tspan>
      <tspan x="90" y="522" font-size="24">(my reading)</tspan>
    </text>
  </g>

  <!-- Card 2: Latency-optimised (Top Right) -->
  <g id="box-latency">
    <rect x="825" y="150" width="730" height="410" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <!-- Dedicated GPU Chip outline icon (56x56, green stroke 4) -->
    <g transform="translate(865, 172)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4"/>
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#e8f1ea"/>
      <line x1="20" y1="4" x2="20" y2="12"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="36" y1="4" x2="36" y2="12"/>
      <line x1="20" y1="44" x2="20" y2="52"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="36" y1="44" x2="36" y2="52"/>
      <line x1="4" y1="20" x2="12" y2="20"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="4" y1="36" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="52" y2="20"/>
      <line x1="44" y1="28" x2="52" y2="28"/>
      <line x1="44" y1="36" x2="52" y2="36"/>
    </g>

    <text font-family="sans-serif" fill="#303a36" font-size="24">
      <tspan x="870" y="275" font-size="30" font-weight="bold" fill="#207448">Latency-optimised:</tspan>
      <tspan x="870" y="312" font-size="24">dedicated always-on replicas;</tspan>
      <tspan x="870" y="347" font-size="24">customer chooses GPU type, GPUs per replica</tspan>
      <tspan x="870" y="382" font-size="24">and the replica range; maps to Nebius</tspan>
      <tspan x="870" y="417" font-size="24">dedicated endpoints</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM ROW: COLD START & WARM POOL ==================== -->

  <!-- Card 3: Cold start box (Bottom Left - Single Most Important Item with Orange Outline) -->
  <g id="box-cold">
    <rect x="45" y="610" width="730" height="410" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5"/>

    <!-- Clock / Timer outline icon in orange (56x56, orange stroke 4) -->
    <g transform="translate(85, 632)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28,14 28,28 38,28"/>
      <line x1="28" y1="2" x2="28" y2="6"/>
      <line x1="48" y1="10" x2="45" y2="13" stroke-width="3"/>
      <line x1="8" y1="10" x2="11" y2="13" stroke-width="3"/>
    </g>

    <text font-family="sans-serif" fill="#303a36" font-size="24">
      <tspan x="90" y="735" font-size="30" font-weight="bold" fill="#db8129">a tenant calls a model</tspan>
      <tspan x="90" y="771" font-size="30" font-weight="bold" fill="#db8129">no replica holds;</tspan>
      <tspan x="90" y="813" font-size="24">tens of GB of weights must load onto a GPU,</tspan>
      <tspan x="90" y="848" font-size="24">which takes seconds to minutes; cold start</tspan>
      <tspan x="90" y="883" font-size="24">latency can cause timeouts and cascading</tspan>
      <tspan x="90" y="918" font-size="24">failures</tspan>
    </text>
  </g>

  <!-- Card 4: Warm pool recipe (Bottom Right) -->
  <g id="box-warm">
    <rect x="825" y="610" width="730" height="410" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <!-- Storage Disk Cylinder / Cache outline icon (56x56, green stroke 4) -->
    <g transform="translate(865, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="8"/>
      <path d="M 8 14 V 42 C 8 46.4 17 50 28 50 C 39 50 48 46.4 48 42 V 14"/>
      <path d="M 8 28 C 8 32.4 17 36 28 36 C 39 36 48 32.4 48 28"/>
      <circle cx="38" cy="42" r="2.5" fill="#207448"/>
    </g>

    <text font-family="sans-serif" fill="#303a36" font-size="24">
      <tspan x="870" y="735" font-size="30" font-weight="bold" fill="#207448">keep popular models</tspan>
      <tspan x="870" y="771" font-size="30" font-weight="bold" fill="#207448">always resident</tspan>
      <tspan x="870" y="813" font-size="24">with at least two replicas; keep weights on</tspan>
      <tspan x="870" y="848" font-size="24">local NVMe or a node-local cache so a new</tspan>
      <tspan x="870" y="883" font-size="24">replica does not download from the object</tspan>
      <tspan x="870" y="918" font-size="24">store</tspan>
    </text>
  </g>
</svg>