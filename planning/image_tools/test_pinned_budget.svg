<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Pinned memory budget for a 24 GiB pod</title>
  <desc>A worked host-memory budget where four workers with pinned and runtime memory total 28 GiB against a 24 GiB limit, so an OOM kill is expected.</desc>

  <defs>
    <pattern id="hatchCache" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#e8f1ea"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#a9c4b3" stroke-width="4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  <!-- Title (48px bold) -->
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pinned memory budget for a 24 GiB pod</text>

  <!-- ================= ROW 1: THREE COLUMNS ================= -->

  <!-- LEFT COLUMN: Hypothetical inference pod (x=60, y=110, w=360, h=510) -->
  <g id="input-card">
    <rect x="60" y="110" width="360" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <!-- Pod / Container icon (48x40, stroke 4) -->
    <g transform="translate(85, 135)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="38" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18"/>
      <circle cx="14" cy="12" r="2.5" fill="#207448"/>
      <circle cx="24" cy="12" r="2.5" fill="#207448"/>
    </g>
    
    <!-- Title: Hypothetical inference pod (30px bold) -->
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" y="155">Hypothetical </tspan>
      <tspan x="150" y="190">inference pod</tspan>
    </text>

    <!-- Item 1: Limit: 24 GiB (24px bold) -->
    <rect x="80" y="215" width="320" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="240" y="249" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Limit: 24 GiB</text>

    <!-- Item 2: Worker processes: 4 (24px) -->
    <rect x="80" y="280" width="320" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="240" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Worker processes: 4</text>

    <!-- Item 3: Pinned staging buffers per worker: 4 GiB (24px) -->
    <rect x="80" y="345" width="320" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="100" y="373">Pinned staging </tspan>
      <tspan x="100" y="403">buffers per </tspan>
      <tspan x="100" y="433">worker: 4 GiB</tspan>
    </text>

    <!-- Item 4: Runtime memory per worker: 3 GiB (24px) -->
    <rect x="80" y="452" width="320" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="100" y="482">Runtime memory </tspan>
      <tspan x="100" y="512">per worker: 3 GiB</tspan>
    </text>

    <!-- Item 5: Cached weights: 15 GiB (24px) -->
    <rect x="80" y="538" width="320" height="66" rx="10" fill="#ffffff" stroke="#a9c4b3" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="100" y="567">Cached weights: </tspan>
      <tspan x="100" y="595">15 GiB</tspan>
    </text>
  </g>

  <!-- MIDDLE COLUMN: Stacked bar 'Cannot be reclaimed' (x=460, y=110, w=700, h=510) -->
  <g id="stacked-bar-card">
    <rect x="460" y="110" width="700" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <!-- Chip / Memory icon (stroke 4) -->
    <g transform="translate(485, 135)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="#ffffff"/>
      <rect x="18" y="18" width="20" height="20" rx="3" fill="#e8f1ea"/>
      <line x1="18" y1="2" x2="18" y2="8"/>
      <line x1="28" y1="2" x2="28" y2="8"/>
      <line x1="38" y1="2" x2="38" y2="8"/>
      <line x1="18" y1="48" x2="18" y2="54"/>
      <line x1="28" y1="48" x2="28" y2="54"/>
      <line x1="38" y1="48" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="8" y2="18"/>
      <line x1="2" y1="28" x2="8" y2="28"/>
      <line x1="2" y1="38" x2="8" y2="38"/>
      <line x1="48" y1="18" x2="54" y2="18"/>
      <line x1="48" y1="28" x2="54" y2="28"/>
      <line x1="48" y1="38" x2="54" y2="38"/>
    </g>
    
    <!-- Card Title: Cannot be reclaimed (30px bold) -->
    <text x="550" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cannot be reclaimed</text>

    <!-- Sub-container for the stacked bar and its scale -->
    <rect x="480" y="215" width="660" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    <!-- Stacked Bar (4 segments of 7 GiB totalling 28 GiB, width = 660 px, x=480, y=290, h=140) -->
    <!-- Scale: 28 GiB = 660 px -> 7 GiB = 165 px. 24 GiB = 565.71 px -> x = 1046 px -->
    
    <!-- Segment 1: Worker 1 (4 + 3) (x=480, w=165) -->
    <rect x="480" y="290" width="163" height="140" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="562" y="350">Worker 1 </tspan>
      <tspan x="562" y="385">(4 + 3)</tspan>
    </text>

    <!-- Segment 2: Worker 2 (4 + 3) (x=645, w=165) -->
    <rect x="645" y="290" width="163" height="140" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="727" y="350">Worker 2 </tspan>
      <tspan x="727" y="385">(4 + 3)</tspan>
    </text>

    <!-- Segment 3: Worker 3 (4 + 3) (x=810, w=165) -->
    <rect x="810" y="290" width="163" height="140" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="892" y="350">Worker 3 </tspan>
      <tspan x="892" y="385">(4 + 3)</tspan>
    </text>

    <!-- Segment 4: Worker 4 (4 + 3) (x=975, w=165) -->
    <rect x="975" y="290" width="165" height="140" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="1057" y="350">Worker 4 </tspan>
      <tspan x="1057" y="385">(4 + 3)</tspan>
    </text>

    <!-- Vertical Marker at 24 GiB: x = 1046 px -->
    <line x1="1046" y1="215" x2="1046" y2="475" stroke="#207448" stroke-width="4" stroke-dasharray="8 6"/>
    
    <!-- Marker Label box: Limit (24px bold) -->
    <rect x="988" y="215" width="116" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1046" y="256" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Limit</text>

    <!-- Overflow bracket / indicator showing segment 4 breaches limit -->
    <path d="M 1046 490 L 1046 510 L 1140 510 L 1140 490" fill="none" stroke="#207448" stroke-width="2"/>
    <circle cx="1093" cy="510" r="4" fill="#207448"/>
  </g>

  <!-- RIGHT COLUMN: Verdict box in orange outline (x=1200, y=110, w=340, h=510) -->
  <g id="verdict-box">
    <rect x="1200" y="110" width="340" height="510" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
    <!-- Alert / Warning octagon icon in orange -->
    <g transform="translate(1342, 160)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="16,0 40,0 56,16 56,40 40,56 16,56 0,40 0,16"/>
      <line x1="28" y1="16" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>

    <!-- Verdict text: OOM kill expected: 28.0 GiB cannot be reclaimed, limit is lower (24px bold) -->
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1370" y="280">OOM kill expected: </tspan>
      <tspan x="1370" y="322">28.0 GiB cannot </tspan>
      <tspan x="1370" y="364">be reclaimed, </tspan>
      <tspan x="1370" y="406">limit is lower</tspan>
    </text>

    <!-- Graphic barrier block -->
    <rect x="1230" y="460" width="280" height="60" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="1265" cy="490" r="14" fill="#db8129"/>
    <line x1="1258" y1="490" x2="1272" y2="490" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ================= ROW 2: SECOND SCENARIO CARD ================= -->
  <!-- Below, a second scenario card with a 40 GiB limit (x=60, y=660, w=1480, h=180) -->
  <g id="second-scenario-card">
    <rect x="60" y="660" width="1480" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <!-- Refresh / Cycle / Cache checkmark icon (stroke 4) -->
    <g transform="translate(95, 705)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <path d="M 16 28 L 24 36 L 40 20"/>
    </g>

    <!-- Main verdict of scenario 2: Fits, but page cache will be reclaimed constantly (30px bold) -->
    <text x="175" y="742" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Fits, but page cache will be reclaimed constantly</text>

    <!-- Visual budget bar illustrating 40 GiB limit vs 28 unreclaimable + 15 cache = 43 total -->
    <!-- Scale: 45 GiB = 900 px -> 1 GiB = 20 px. -->
    <!-- Unreclaimable (28 GiB): 28 * 20 = 560 px. Cache (15 GiB): 15 * 20 = 300 px. Total = 860 px (43 GiB) -->
    <!-- Limit (40 GiB): 40 * 20 = 800 px -> x = 175 + 800 = 975 px -->
    <rect x="175" y="770" width="560" height="42" rx="6" fill="#207448"/>
    <rect x="735" y="770" width="300" height="42" rx="6" fill="url(#hatchCache)" stroke="#207448" stroke-width="2"/>
    
    <!-- Marker at 40 GiB: 175 + 800 = 975 px -->
    <line x1="975" y1="755" x2="975" y2="825" stroke="#207448" stroke-width="4"/>
    <polygon points="975,750 967,762 983,762" fill="#207448"/>
    
    <!-- Overflow tail indicator -->
    <rect x="975" y="770" width="60" height="42" rx="4" fill="#207448" fill-opacity="0.25" stroke="#207448" stroke-width="2"/>
  </g>

  <!-- ================= ROW 3: FORMULA & NOTE ================= -->
  <!-- Formula strip at bottom in monospace (x=60, y=880, w=820, h=75) -->
  <g id="formula-strip">
    <rect x="60" y="880" width="820" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="470" y="927" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">unreclaimable = workers x (pinned + runtime)</text>
  </g>

  <!-- Note: 'Page cache is left out of the sum.' (x=920, y=880, w=620, h=75) -->
  <g id="note-box">
    <rect x="920" y="880" width="620" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1230" y="927" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Page cache is left out of the sum.</text>
  </g>

</svg>