<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>A command line that passes review and still preempts</title>
  <desc>Three-step capacity arithmetic showing a 389,100 token KV cache overflowing with 128 sequences at 4,000 average tokens, causing vLLM preemption and showing the fix.</desc>

  <!-- Background -->
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A command line that passes review and still preempts</text>

  <!-- ==================== COMMAND STRIP ==================== -->
  <g id="command-strip">
    <rect x="60" y="100" width="1480" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <!-- Terminal CLI outline icon (56px) -->
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="88" y="132" width="52" height="42" rx="6"/>
      <path d="M 99 146 L 110 153 L 99 160"/>
      <line x1="115" y1="160" x2="128" y2="160"/>
    </g>
    <text x="165" y="145" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="165" dy="0">--max-model-len=16384 --max-num-seqs=128 --max-num-batched-tokens=8192 </tspan>
      <tspan x="165" dy="38">--gpu-memory-utilization=0.90 on one H100 serving Llama 3.1 8B</tspan>
    </text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g id="step-1">
    <rect x="60" y="250" width="466" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <!-- Number circle 1 -->
    <circle cx="106" cy="292" r="24" fill="#207448"/>
    <text x="106" y="300" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <!-- Outline icon: Document / Log file (56px) -->
    <g transform="translate(450, 264)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="44" rx="4"/>
      <line x1="12" y1="18" x2="32" y2="18" stroke-width="3"/>
      <line x1="12" y1="26" x2="32" y2="26" stroke-width="3"/>
      <line x1="12" y1="34" x2="24" y2="34" stroke-width="3"/>
      <circle cx="34" cy="36" r="7" stroke-width="3"/>
      <line x1="39" y1="41" x2="48" y2="48" stroke-width="3"/>
    </g>
    <!-- Step 1 text -->
    <text x="92" y="360" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="92" dy="0" font-size="30" font-weight="bold">Step 1: </tspan>
      <tspan x="92" dy="40">read the start-up log for </tspan>
      <tspan x="92" dy="34">GPU KV cache size; with the </tspan>
      <tspan x="92" dy="34">section 3 inputs the cache </tspan>
      <tspan x="92" dy="34">holds about 389,100 tokens</tspan>
    </text>
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g id="step-2">
    <rect x="566" y="250" width="466" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <!-- Number circle 2 -->
    <circle cx="612" cy="292" r="24" fill="#207448"/>
    <text x="612" y="300" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <!-- Outline icon: Math / Division (56px) -->
    <g transform="translate(956, 264)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8"/>
      <line x1="14" y1="28" x2="42" y2="28" stroke-width="4"/>
      <circle cx="28" cy="18" r="3.5" fill="#207448"/>
      <circle cx="28" cy="38" r="3.5" fill="#207448"/>
    </g>
    <!-- Step 2 text -->
    <text x="598" y="360" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="598" dy="0" font-size="30" font-weight="bold">Step 2: </tspan>
      <tspan x="598" dy="40">divide by max-num-seqs: </tspan>
      <tspan x="598" dy="34">389,100 / 128 is about </tspan>
      <tspan x="598" dy="34">3,040 tokens, the average </tspan>
      <tspan x="598" dy="34">request length at which </tspan>
      <tspan x="598" dy="34">128 running requests fill </tspan>
      <tspan x="598" dy="34">the cache</tspan>
    </text>
  </g>

  <!-- ==================== STEP 3 (Single Orange Stroke Accent) ==================== -->
  <g id="step-3">
    <rect x="1072" y="250" width="466" height="430" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    <!-- Number circle 3 -->
    <circle cx="1118" cy="292" r="24" fill="#207448"/>
    <text x="1118" y="300" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <!-- Outline icon: Warning / Alert (56px) -->
    <g transform="translate(1462, 264)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 46 L 6 46 Z"/>
      <line x1="28" y1="20" x2="28" y2="31" stroke-width="4"/>
      <circle cx="28" cy="39" r="2" fill="#207448"/>
    </g>
    <!-- Step 3 text -->
    <text x="1104" y="360" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1104" dy="0" font-size="30" font-weight="bold">Step 3: </tspan>
      <tspan x="1104" dy="38">compare with traffic: </tspan>
      <tspan x="1104" dy="32">if the afternoon average </tspan>
      <tspan x="1104" dy="32">prompt plus output is 4,000 </tspan>
      <tspan x="1104" dy="32">tokens the cache cannot </tspan>
      <tspan x="1104" dy="32">hold the batch, so vLLM </tspan>
      <tspan x="1104" dy="32">preempts and recomputes; </tspan>
      <tspan x="1104" dy="32">preemptions climb every </tspan>
      <tspan x="1104" dy="32">afternoon</tspan>
    </text>
  </g>

  <!-- ==================== FIX BOX ==================== -->
  <g id="fix-box">
    <rect x="60" y="720" width="1480" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <!-- Outline icon: Wrench / Tuning tool (56px) -->
    <g transform="translate(88, 765)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 44 14 C 40 10 33 11 29 15 C 26 18 26 22 28 25 L 12 41 C 10 43 10 46 12 48 C 14 50 17 50 19 48 L 35 32 C 38 34 42 34 45 31 C 49 27 50 20 46 16 L 39 23 L 33 17 Z"/>
    </g>
    <text x="165" y="764" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="165" dy="0">lower max-num-seqs to what the cache holds at the real average length: </tspan>
      <tspan x="165" dy="36">389,100 / 4,000 is about 97, so a cap near 90 leaves margin; </tspan>
      <tspan x="165" dy="36">or quantise to grow the cache</tspan>
    </text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="footer-bar">
    <rect x="60" y="915" width="1480" height="75" rx="12" fill="#207448"/>
    <text x="800" y="961" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">the reviewer prints this as information when you give it the log token count</text>
  </g>
</svg>