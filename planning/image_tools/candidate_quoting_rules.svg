<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>When a value must be quoted, and what each quote style does</title>
  <desc>Visual infographic explaining YAML quoting rules, single versus double quote styles, indentation guidelines, and key fix examples.</desc>
  <rect width="1600" height="1180" fill="#f5f8f5"/>
  <!-- Title -->
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">When a value must be quoted, </tspan><tspan x="800" dy="54">and what each quote style does</tspan></text>
  <!-- Table Headers -->
  <rect x="40" y="140" width="430" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(58, 148)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="28" height="32" rx="4"/>
    <line x1="10" y1="12" x2="26" y2="12"/>
    <line x1="10" y1="20" x2="26" y2="20"/>
    <line x1="10" y1="28" x2="18" y2="28"/>
  </g>
  <text x="285" y="178" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">You write</text>
  <rect x="490" y="140" width="670" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(510, 148)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="9"/>
    <line x1="20" y1="4" x2="20" y2="8"/>
    <line x1="20" y1="32" x2="20" y2="36"/>
    <line x1="4" y1="20" x2="8" y2="20"/>
    <line x1="32" y1="20" x2="36" y2="20"/>
    <line x1="9" y1="9" x2="12" y2="12"/>
    <line x1="28" y1="28" x2="31" y2="31"/>
    <line x1="9" y1="31" x2="12" y2="28"/>
    <line x1="28" y1="12" x2="31" y2="9"/>
  </g>
  <text x="855" y="178" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Parser reads</text>
  <rect x="1180" y="140" width="380" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1200, 148)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 8 L 20 4 L 34 8 V 20 C 34 28 20 36 20 36 C 20 36 6 28 6 20 Z"/>
    <polyline points="13,20 18,25 27,15"/>
  </g>
  <text x="1400" y="178" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Fix</text>
  <!-- Row 1 -->
  <rect x="40" y="206" width="430" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="255" y="250" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">msg: Disk full: retry</text>
  <rect x="490" y="206" width="670" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="825" y="236" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="825" dy="0">a second colon followed by a space: </tspan><tspan x="825" dy="28">it can no longer tell where the key ends</tspan></text>
  <rect x="1180" y="206" width="380" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="1370" y="250" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">msg: &quot;Disk full: retry&quot;</text>
  <!-- Row 2 -->
  <rect x="40" y="290" width="430" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="255" y="346" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">path: /data #1</text>
  <rect x="490" y="290" width="670" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="825" y="318" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="825" dy="0">a hash after a space starts a comment, </tspan><tspan x="825" dy="26">so only /data is stored </tspan><tspan x="825" dy="26">and no error appears</tspan></text>
  <rect x="1180" y="290" width="380" height="98" rx="8" fill="#fff7f0" stroke="#db8129" stroke-width="2.5"/>
  <text x="1370" y="346" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">quote the value</text>
  <!-- Row 3 -->
  <rect x="40" y="398" width="430" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="255" y="439" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">mode: 0644</text>
  <rect x="490" y="398" width="670" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="825" y="439" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">octal number in YAML 1.1</text>
  <rect x="1180" y="398" width="380" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="1370" y="439" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">mode: &quot;0644&quot;</text>
  <!-- Row 4 -->
  <rect x="40" y="474" width="430" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="255" y="506" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36"><tspan x="255" dy="0">value starts with </tspan><tspan x="255" dy="28">* &amp; ! % @ backtick { [ | &gt;</tspan></text>
  <rect x="490" y="474" width="670" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="825" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">special syntax</text>
  <rect x="1180" y="474" width="380" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="1370" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">quote it</text>
  <!-- Row 5 -->
  <rect x="40" y="562" width="430" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="255" y="603" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">msg: {{ var }}</text>
  <rect x="490" y="562" width="670" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="825" y="603" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">opening brace starts a flow mapping</text>
  <rect x="1180" y="562" width="380" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <text x="1370" y="603" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">msg: &quot;{{ var }}&quot;</text>
  <!-- Quote styles panel -->
  <rect x="40" y="648" width="1520" height="136" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="56" y="660" width="740" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <g transform="translate(72, 684)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 12 Q 10 24 16 30 Q 18 20 18 16 Q 18 12 12 12 Z"/>
    <circle cx="15" cy="16" r="3" fill="#207448"/>
  </g>
  <text x="446" y="686" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="446" dy="0">single quotes are literal: </tspan><tspan x="446" dy="28">C:\temp keeps its backslash; </tspan><tspan x="446" dy="28">only two single quotes escape a quote inside</tspan></text>
  <rect x="824" y="660" width="740" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
  <g transform="translate(840, 684)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 12 Q 6 24 12 30 Q 14 20 14 16 Q 14 12 8 12 Z"/>
    <path d="M 22 12 Q 20 24 26 30 Q 28 20 28 16 Q 28 12 22 12 Z"/>
  </g>
  <text x="1214" y="686" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="1214" dy="0">double quotes support escapes such as \n, \t </tspan><tspan x="1214" dy="28">and the e-acute character: </tspan><tspan x="1214" dy="28">&quot;line one\nline two&quot; holds a real line break</tspan></text>
  <!-- Rule panel -->
  <rect x="40" y="802" width="1520" height="78" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 820)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 22 C 8 18 8 12 14 8 C 20 4 28 8 28 14 C 28 18 24 22 22 26 L 16 26 Z"/>
    <line x1="16" y1="31" x2="22" y2="31"/>
    <line x1="17" y1="36" x2="21" y2="36"/>
  </g>
  <text x="825" y="835" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan x="825" dy="0">a quoted string is never reinterpreted and a reader </tspan><tspan x="825" dy="28">sees at a glance the value is meant to be text</tspan></text>
  <!-- Indentation strip -->
  <rect x="40" y="898" width="1520" height="136" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 940)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="10" x2="38" y2="10"/>
    <line x1="16" y1="22" x2="38" y2="22"/>
    <line x1="26" y1="34" x2="38" y2="34"/>
    <polyline points="6,26 12,22 6,18"/>
  </g>
  <text x="825" y="934" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="825" dy="0">spaces only, never tabs: a tab breaks the count even when it looks like two spaces; </tspan><tspan x="825" dy="30">use two spaces per level; key:\n- a and key:\n  - a are both valid, </tspan><tspan x="825" dy="30">pick one style across the repository</tspan></text>
  <!-- Bottom bar -->
  <rect x="40" y="1052" width="1520" height="70" rx="12" fill="#207448"/>
  <g transform="translate(64, 1068)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="14"/>
    <polyline points="11,18 16,23 25,13"/>
  </g>
  <text x="825" y="1097" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">When in doubt, quote the value</text>
</svg>