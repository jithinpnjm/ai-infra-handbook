<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1125" viewBox="0 0 1600 1125">
  <title>The template task options, and what each protects</title>
  <desc>Visual explanation of Ansible template task options including src, dest, backup, validate, and notify, alongside analogy and story strips.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="1125" fill="#f5f8f5" />

  <!-- Title -->
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The template task options, and what each protects</text>

  <!-- Analogy Strip -->
  <g id="analogy-strip">
    <rect x="40" y="115" width="1520" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Icon: Form Letter / Document with Blanks -->
    <g transform="translate(62, 132)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="44" height="48" rx="4" fill="#ffffff" />
      <line x1="14" y1="16" x2="32" y2="16" />
      <line x1="38" y1="16" x2="44" y2="16" stroke-dasharray="2 2" />
      <line x1="14" y1="26" x2="24" y2="26" />
      <line x1="30" y1="26" x2="44" y2="26" stroke-dasharray="2 2" />
      <line x1="14" y1="36" x2="44" y2="36" />
    </g>
    <text x="135" y="152" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">a template is a form letter with blanks: the text is fixed and each blank is filled</tspan>
      <tspan x="135" dy="30">from the data for that host or that run</tspan>
    </text>
  </g>

  <!-- Story Strip -->
  <g id="story-strip">
    <rect x="40" y="225" width="1520" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Icon: GPU Cluster / Server Node -->
    <g transform="translate(62, 257)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="18" rx="3" fill="#ffffff" />
      <circle cx="12" cy="15" r="2" fill="#207448" />
      <line x1="22" y1="15" x2="44" y2="15" />
      <rect x="4" y="32" width="48" height="18" rx="3" fill="#ffffff" />
      <circle cx="12" cy="41" r="2" fill="#207448" />
      <line x1="22" y1="41" x2="44" y2="41" />
    </g>
    <text x="135" y="260" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">a new GPU node joins and the Slurm configuration must list it: editing by hand risks missing</tspan>
      <tspan x="135" dy="30">a controller or a CPU count typed from memory; a template renders the file from data</tspan>
      <tspan x="135" dy="30">every time so the new node appears automatically</tspan>
    </text>
  </g>

  <!-- Annotated Task Container -->
  <g id="annotated-task">
    <rect x="40" y="365" width="1520" height="630" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <!-- Task Header -->
    <g id="task-header">
      <!-- Task Icon: Playbook / Task check -->
      <g transform="translate(62, 383)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="44" height="48" rx="4" fill="#e8f1ea" />
        <polyline points="16,28 24,36 40,20" stroke-width="4" />
      </g>
      <text x="135" y="418" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Render slurm.conf</text>
    </g>

    <!-- Option 1: src -->
    <g id="opt-src">
      <rect x="70" y="450" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <!-- Icon: Source file / Jinja2 -->
      <g transform="translate(92, 467)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 10 4 L 36 4 L 46 14 L 46 50 L 10 50 Z" fill="#ffffff" />
        <polyline points="36,4 36,14 46,14" />
        <path d="M 22 24 C 18 27 18 31 22 34" />
        <path d="M 34 24 C 38 27 38 31 34 34" />
      </g>
      <text x="165" y="487" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="165" dy="0">src: slurm.conf.j2: .j2 marks a Jinja2 template, read from the role&apos;s</tspan>
        <tspan x="165" dy="30">templates/ directory or any path you give</tspan>
      </text>
    </g>

    <!-- Option 2: dest -->
    <g id="opt-dest">
      <rect x="70" y="552" width="1460" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <!-- Icon: Destination path / Folder -->
      <g transform="translate(92, 563)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 12 L 22 12 L 28 18 L 48 18 L 48 44 L 6 44 Z" fill="#ffffff" />
        <line x1="16" y1="30" x2="38" y2="30" />
      </g>
      <text x="165" y="593" font-family="monospace" font-size="24" fill="#303a36">dest: /etc/slurm/slurm.conf; owner slurm, group slurm, mode 0644</text>
    </g>

    <!-- Option 3: backup -->
    <g id="opt-backup">
      <rect x="70" y="632" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <!-- Icon: Backup snapshot / disk history -->
      <g transform="translate(92, 649)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 10 14 C 10 8 46 8 46 14 C 46 20 10 20 10 14" fill="#ffffff" />
        <path d="M 10 14 V 40 C 10 46 46 46 46 40 V 14" />
        <path d="M 10 27 C 10 33 46 33 46 27" />
      </g>
      <text x="165" y="669" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="165" dy="0">backup: true keeps a timestamped copy when the file changes, so a bad render</tspan>
        <tspan x="165" dy="30">can be undone by copying the old file back</tspan>
      </text>
    </g>

    <!-- Option 4: validate (ORANGE - Most important protection) -->
    <g id="opt-validate">
      <rect x="70" y="734" width="1460" height="120" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2.5" />
      <!-- Icon: Shield / validation check in orange -->
      <g transform="translate(92, 767)" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 6 L 48 14 V 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 V 14 Z" fill="#ffffff" />
        <polyline points="18,28 25,35 38,20" stroke="#db8129" stroke-width="3.5" />
      </g>
      <text x="165" y="769" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="165" dy="0">validate: slurmd -f %s -C (an example; check the tool&apos;s actual option support):</tspan>
        <tspan x="165" dy="30">checks the rendered file before it replaces the live one; if the checker fails</tspan>
        <tspan x="165" dy="30">the live file stays as it was, protecting a running scheduler from a broken config</tspan>
      </text>
    </g>

    <!-- Option 5: notify -->
    <g id="opt-notify">
      <rect x="70" y="868" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <!-- Icon: Reload notify bell -->
      <g transform="translate(92, 885)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 8 A 16 16 0 0 0 12 24 C 12 34 8 38 8 38 L 48 38 C 48 38 44 34 44 24 A 16 16 0 0 0 28 8 Z" fill="#ffffff" />
        <path d="M 24 44 A 4 4 0 0 0 32 44" />
        <line x1="28" y1="4" x2="28" y2="8" />
      </g>
      <text x="165" y="905" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="165" dy="0">notify: Reload slurmctld: the handler runs only when the rendered file changed,</tspan>
        <tspan x="165" dy="30">so the scheduler reloads only when there was something to apply</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom bar -->
  <g id="bottom-bar">
    <rect x="40" y="1020" width="1520" height="65" rx="10" fill="#207448" />
    <text x="800" y="1062" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Render, validate, then replace</text>
  </g>
</svg>