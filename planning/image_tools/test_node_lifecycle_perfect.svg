<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <title>Node lifecycle</title>
  <desc>State diagram showing Slurm node lifecycle states and transitions</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="1100" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Node lifecycle</text>

  <!-- ==================== TRANSITION ARROWS & LABELS ==================== -->

  <!-- 1. [*] -> IDLE -->
  <circle cx="320" cy="110" r="16" fill="#207448"/>
  <path d="M 320 126 L 320 200" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 2. IDLE -> ALLOCATED (job starts) -->
  <path d="M 520 215 L 1080 215" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="700" y="145" width="200" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="180" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job starts</text>

  <!-- 3. ALLOCATED -> IDLE (job ends) -->
  <path d="M 1080 275 L 520 275" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="710" y="290" width="180" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job ends</text>

  <!-- 4. IDLE -> DRAINED (scontrol drain / health check) -->
  <path d="M 320 290 L 320 560" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 5. DRAINED -> IDLE (scontrol resume) -->
  <path d="M 440 560 L 440 290" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="465" y="370" width="270" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="600" y="405" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">scontrol resume</text>

  <!-- 6. ALLOCATED -> DRAINING (scontrol drain / health check) -->
  <path d="M 1220 290 L 1220 560" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Shared trigger label for IDLE->DRAINED and ALLOCATED->DRAINING -->
  <rect x="560" y="460" width="480" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="495" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">scontrol drain / health check</text>
  <line x1="340" y1="487" x2="560" y2="487" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1040" y1="487" x2="1200" y2="487" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 7. DRAINING -> DRAINED (running jobs finish) -->
  <path d="M 1080 625 L 520 625" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="630" y="550" width="340" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="585" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">running jobs finish</text>

  <!-- 8. ALLOCATED -> DOWN (node failure (jobs requeued or failed)) -->
  <path d="M 1360 245 L 1550 245 L 1550 965 L 940 965" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="955" y="890" width="580" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1245" y="925" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">node failure (jobs requeued or failed)</text>

  <!-- 9. IDLE -> DOWN (slurmd not responding (SlurmdTimeout) / admin) -->
  <path d="M 240 260 L 150 260 L 150 945 L 660 945" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="180" y="855" width="450" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="405" y="888" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="405" dy="0">slurmd not responding</tspan>
    <tspan x="405" dy="30">(SlurmdTimeout) / admin</tspan>
  </text>

  <!-- 10. DOWN -> IDLE (resume or ReturnToService on valid registration) -->
  <path d="M 760 1010 L 760 1060 L 70 1060 L 70 220 L 240 220" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="150" y="968" width="490" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="395" y="1001" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="395" dy="0">resume or ReturnToService</tspan>
    <tspan x="395" dy="30">on valid registration</tspan>
  </text>

  <!-- ==================== STATE NODES ==================== -->

  <!-- Node: IDLE -->
  <g id="node-idle">
    <rect x="240" y="200" width="280" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <!-- Icon: Server chassis standby -->
    <rect x="255" y="218" width="54" height="54" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="272" cy="245" r="4" fill="#207448"/>
    <line x1="286" y1="245" x2="297" y2="245" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="410" y="256" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">IDLE</text>
  </g>

  <!-- Node: ALLOCATED -->
  <g id="node-allocated">
    <rect x="1080" y="200" width="280" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <!-- Icon: CPU chip with active pins -->
    <rect x="1095" y="218" width="54" height="54" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="1108" y="231" width="28" height="28" rx="4" fill="#207448"/>
    <text x="1250" y="256" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">ALLOCATED</text>
  </g>

  <!-- Node: DRAINED -->
  <g id="node-drained">
    <rect x="240" y="560" width="280" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <!-- Icon: Maintenance shield -->
    <path d="M 282 575 Q 306 582 306 597 Q 306 618 282 626 Q 258 618 258 597 Q 258 582 282 575 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="282" y1="588" x2="282" y2="606" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="410" y="616" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">DRAINED</text>
  </g>

  <!-- Node: DRAINING -->
  <g id="node-draining">
    <rect x="1080" y="560" width="280" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <!-- Icon: Timer hourglass -->
    <path d="M 1102 575 L 1142 575 L 1122 602 L 1142 629 L 1102 629 L 1122 602 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <text x="1250" y="616" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">DRAINING</text>
  </g>

  <!-- Node: DOWN (Orange highlight as the critical failure state) -->
  <g id="node-down">
    <rect x="660" y="920" width="280" height="90" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    <!-- Icon: Alert triangle -->
    <path d="M 702 935 L 727 982 L 677 982 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="702" y1="952" x2="702" y2="966" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="702" cy="974" r="2.5" fill="#db8129"/>
    <text x="830" y="976" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">DOWN</text>
  </g>
</svg>