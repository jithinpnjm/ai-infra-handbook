<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1175" width="1600" height="1175">
  <title>Borrowing and lending quota inside a cohort</title>
  <desc>Infographic explaining borrowing and lending quota inside a cohort with worked example numbers for ClusterQueue research, preemption settings, and workload preemption story.</desc>

  <defs>
    <pattern id="diagonalHatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#207448" stroke-width="3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="1175" fill="#f5f8f5" />

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Borrowing and lending quota inside a cohort</text>

  <!-- ==================== SECTION 1: WORKED EXAMPLE OVERVIEW ==================== -->
  <g id="overview-panel">
    <rect x="40" y="125" width="1520" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Chip / Hardware Icon (56px) -->
    <g transform="translate(68, 162)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="36" height="36" rx="4" />
      <line x1="16" y1="2" x2="16" y2="8" /><line x1="26" y1="2" x2="26" y2="8" /><line x1="36" y1="2" x2="36" y2="8" />
      <line x1="16" y1="44" x2="16" y2="50" /><line x1="26" y1="44" x2="26" y2="50" /><line x1="36" y1="44" x2="36" y2="50" />
      <line x1="2" y1="16" x2="8" y2="16" /><line x1="2" y1="26" x2="8" y2="26" /><line x1="2" y1="36" x2="8" y2="36" />
      <line x1="44" y1="16" x2="50" y2="16" /><line x1="44" y1="26" x2="50" y2="26" /><line x1="44" y1="36" x2="50" y2="36" />
    </g>
    <text x="825" y="162" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="825" dy="0">Worked example with the chapter's numbers for ClusterQueue research, flavor h100-ondemand, </tspan>
      <tspan x="825" dy="32">resource nvidia.com/gpu: nominalQuota 128, borrowingLimit 64, lendingLimit 32; </tspan>
      <tspan x="825" dy="32">cpu nominalQuota 1024, memory nominalQuota 8Ti.</tspan>
    </text>
  </g>

  <!-- ==================== SECTION 2: QUOTA BARS ==================== -->
  <g id="quota-bars-panel">
    <rect x="40" y="295" width="1520" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Visual Bar Representation -->
    <!-- 128 Owned Quota Bar (x=70 to 1030, width=960) -->
    <rect x="70" y="318" width="960" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Marked slice of 32 lendable GPUs (x=790 to 1030, width=240) -->
    <rect x="790" y="318" width="240" height="46" rx="8" fill="url(#diagonalHatch)" stroke="#207448" stroke-width="2" opacity="0.85" />
    <!-- Dashed extension of up to 64 borrowed GPUs (x=1050 to 1510, width=460) -->
    <rect x="1050" y="318" width="460" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />

    <!-- Card 1: 128 GPUs owned by research -->
    <rect x="70" y="385" width="450" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Server / Base Icon (48px) -->
    <g transform="translate(90, 436)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="14" rx="3" /><rect x="6" y="26" width="36" height="14" rx="3" />
      <circle cx="14" cy="15" r="2" fill="#207448" /><circle cx="14" cy="33" r="2" fill="#207448" />
    </g>
    <text x="315" y="468" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">128 GPUs owned by research</text>

    <!-- Card 2: 32 GPUs that research may lend out when idle -->
    <rect x="560" y="385" width="450" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Share / Outward Slice Icon (48px) -->
    <g transform="translate(580, 436)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="24" r="5" /><circle cx="36" cy="12" r="5" /><circle cx="36" cy="36" r="5" />
      <line x1="16" y1="22" x2="32" y2="14" /><line x1="16" y1="26" x2="32" y2="34" />
    </g>
    <text x="805" y="450" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="805" dy="0">32 GPUs that research </tspan>
      <tspan x="805" dy="32">may lend out when idle</tspan>
    </text>

    <!-- Card 3: up to 64 GPUs borrowed from idle quota of other ClusterQueues in cohort gpu-fleet -->
    <rect x="1050" y="385" width="460" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1280" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1280" dy="0">up to 64 GPUs borrowed </tspan>
      <tspan x="1280" dy="28">from idle quota of other </tspan>
      <tspan x="1280" dy="28">ClusterQueues in </tspan>
      <tspan x="1280" dy="28">cohort gpu-fleet</tspan>
    </text>
  </g>

  <!-- ==================== SECTION 3: PREEMPTION SETTINGS ==================== -->
  <!-- Single Orange Highlight on the most important item: reclaimWithinCohort Any -->
  <g id="preemption-settings">
    <!-- Setting 1 (Orange highlight) -->
    <rect x="70" y="595" width="450" height="190" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <!-- Shield / Reclaim Icon (48px) in orange -->
    <g transform="translate(271, 608)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 5 L 42 12 L 42 24 C 42 35 24 43 24 43 C 24 43 6 35 6 24 L 6 12 Z" />
      <polyline points="17,23 22,28 31,18" />
    </g>
    <text x="295" y="685" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="295" dy="0" font-weight="bold">reclaimWithinCohort Any: </tspan>
      <tspan x="295" dy="30">take back lent quota </tspan>
      <tspan x="295" dy="30">from borrowers</tspan>
    </text>

    <!-- Setting 2 -->
    <rect x="560" y="595" width="450" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Sliders / Policy Icon (48px) -->
    <g transform="translate(761, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="10" x2="40" y2="10" /><line x1="8" y1="24" x2="40" y2="24" /><line x1="8" y1="38" x2="40" y2="38" />
      <circle cx="18" cy="10" r="3.5" fill="#207448" /><circle cx="32" cy="24" r="3.5" fill="#207448" /><circle cx="16" cy="38" r="3.5" fill="#207448" />
    </g>
    <text x="785" y="685" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="785" dy="0" font-weight="bold">borrowWithinCohort policy </tspan>
      <tspan x="785" dy="30">LowerPriority with </tspan>
      <tspan x="785" dy="30">maxPriorityThreshold 100</tspan>
    </text>

    <!-- Setting 3 -->
    <rect x="1050" y="595" width="460" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Queue Layers Icon (48px) -->
    <g transform="translate(1256, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="24,6 42,15 24,24 6,15" />
      <polyline points="6,23 24,32 42,23" />
      <polyline points="6,31 24,40 42,31" />
    </g>
    <text x="1280" y="700" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1280" dy="0" font-weight="bold">withinClusterQueue </tspan>
      <tspan x="1280" dy="32">LowerPriority</tspan>
    </text>
  </g>

  <!-- ==================== SECTION 4: STORY (3 STEPS) ==================== -->
  <g id="story-steps">
    <!-- Step 1 Card -->
    <rect x="70" y="825" width="450" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="295" cy="862" r="24" fill="#207448" />
    <text x="295" y="871" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="295" y="930" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="295" dy="0">Team A borrows </tspan>
      <tspan x="295" dy="32">idle quota</tspan>
    </text>

    <!-- Step 2 Card -->
    <rect x="560" y="825" width="450" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="785" cy="862" r="24" fill="#207448" />
    <text x="785" y="871" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="785" y="922" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="785" dy="0">Team B submits a job </tspan>
      <tspan x="785" dy="28">and reclaims its own quota </tspan>
      <tspan x="785" dy="28">through preemption</tspan>
    </text>

    <!-- Step 3 Card -->
    <rect x="1050" y="825" width="460" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1280" cy="862" r="24" fill="#207448" />
    <text x="1280" y="871" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1280" y="930" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1280" dy="0">watch Workload </tspan>
      <tspan x="1280" dy="32">conditions</tspan>
    </text>
  </g>

  <!-- ==================== SECTION 5: TAKEAWAY FOOTER BAR ==================== -->
  <g id="footer-bar">
    <rect x="40" y="1055" width="1520" height="70" rx="12" fill="#207448" />
    <text x="800" y="1099" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">WorkloadPriorityClass sets queueing priority independent of pod priority</text>
  </g>
</svg>