<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Drill 3: a liveness probe kills a slow load</title>
  <desc>Visual explanation of slow model load killed by premature liveness probe versus protected by a 300-second startup probe window.</desc>
  <defs>
    <marker id="marker-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="1180" fill="#f5f8f5" />
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Drill 3: a liveness probe kills a slow load</text>
  <!-- Lane 1 Container: what exists -->
  <rect x="50" y="95" width="1500" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="70" y="110" width="260" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="12" rx="22" ry="8" />
    <path d="M 6 12 V 28 C 6 32 16 36 28 36 C 40 36 50 32 50 28 V 12" />
    <path d="M 6 28 V 44 C 6 48 16 52 28 52 C 40 52 50 48 50 44 V 28" />
  </g>
  <text x="160" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="160" dy="0">what</tspan>
    <tspan x="160" dy="34">exists</tspan>
  </text>
  <rect x="350" y="110" width="1180" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="370" y="123" width="400" height="10" rx="5" fill="#207448" opacity="0.25" />
  <rect x="370" y="123" width="248" height="10" rx="5" fill="#207448" />
  <text x="370" y="156" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="370" dy="0">weights load for about 90 seconds</tspan>
    <tspan x="370" dy="34">(&apos;loading weights 62%&apos; then nothing in the previous logs)</tspan>
  </text>
  <!-- Lane 2 Container: broken probes -->
  <rect x="50" y="265" width="1500" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="70" y="275" width="260" height="250" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(172, 300)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <path d="M 12 28 L 20 28 L 25 18 L 31 38 L 36 28 L 44 28" />
  </g>
  <text x="200" y="395" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="200" dy="0">broken</tspan>
    <tspan x="200" dy="38">probes</tspan>
  </text>
  <rect x="350" y="275" width="670" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="370" y="310" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="370" dy="0">liveness initialDelaySeconds 5,</tspan>
    <tspan x="370" dy="31">periodSeconds 10, failureThreshold 1,</tspan>
    <tspan x="370" dy="31">no startup probe</tspan>
  </text>
  <rect x="1040" y="275" width="490" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1065" y="328" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1065" dy="0">restart count 40,</tspan>
    <tspan x="1065" dy="34">one restart every four minutes</tspan>
  </text>
  <rect x="350" y="425" width="1180" height="100" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <path d="M 370 477 L 388 445 L 406 477 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
  <line x1="388" y1="455" x2="388" y2="465" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  <circle cx="388" cy="471" r="1.5" fill="#db8129" />
  <text x="426" y="460" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="426" dy="0">first check near 5 s fails, event &apos;Unhealthy: Liveness probe failed&apos;</tspan>
    <tspan x="426" dy="34">three times then &apos;Killing: failed liveness probe, will be restarted&apos;</tspan>
  </text>
  <line x1="685" y1="395" x2="685" y2="423" stroke="#207448" stroke-width="3" marker-end="url(#marker-green)" />
  <!-- Lane 3 Container: fixed -->
  <rect x="50" y="575" width="1500" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="70" y="585" width="260" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 612)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 14 V 28 C 48 42 28 52 28 52 C 28 52 8 42 8 28 V 14 Z" />
    <polyline points="18,28 25,35 38,20" />
  </g>
  <text x="165" y="650" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">fixed</text>
  <rect x="350" y="585" width="680" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="370" y="626" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="370" dy="0">startup probe with failureThreshold 30 and</tspan>
    <tspan x="370" dy="34">period 10 gives a 300 second window</tspan>
  </text>
  <rect x="1070" y="585" width="460" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1090" y="626" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1090" dy="0">liveness only starts after</tspan>
    <tspan x="1090" dy="34">the startup probe passes</tspan>
  </text>
  <line x1="1030" y1="640" x2="1068" y2="640" stroke="#207448" stroke-width="3" marker-end="url(#marker-green)" />
  <!-- Restart Delay Strip -->
  <rect x="50" y="745" width="1500" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 757)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22" />
    <polyline points="28,14 28,28 38,28" />
    <path d="M 22 2 L 34 2" />
  </g>
  <text x="155" y="792" font-family="sans-serif" font-size="24" fill="#303a36">starts at 10 s, doubles, capped at 300 s, resets after ten clean minutes</text>
  <!-- Contrast Panel -->
  <rect x="50" y="865" width="1500" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 892)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="40" rx="6" />
    <line x1="4" y1="20" x2="52" y2="20" />
    <circle cx="12" cy="14" r="2" fill="#207448" />
    <circle cx="20" cy="14" r="2" fill="#207448" />
    <line x1="14" y1="32" x2="26" y2="32" />
    <line x1="14" y1="40" x2="38" y2="40" />
  </g>
  <text x="155" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="155" dy="0">OOM kill shows Last State Terminated, Reason OOMKilled, Exit Code 137;</tspan>
    <tspan x="155" dy="34">here Reason is Error and no OOMKilled</tspan>
  </text>
  <!-- Prevention Takeaway Bar -->
  <rect x="50" y="1015" width="1500" height="100" rx="14" fill="#207448" />
  <text x="800" y="1055" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">liveness answers is this process stuck, not is it ready;</tspan>
    <tspan x="800" dy="34">slow starters get a startup probe sized to a measured load time</tspan>
  </text>
</svg>