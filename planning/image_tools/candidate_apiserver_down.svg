<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>When the API servers are down: what still works and what stops</title>
  <desc>Visual comparison showing what workloads keep running versus what operations stop when Kubernetes API servers are down, along with timeline of node lease expiration and pod eviction.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#207448" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1150" fill="#f5f8f5" />

  <!-- Title (wrapped onto 2 lines with trailing space on line 1 for proper text joining) -->
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">When the API servers are down: </tspan>
    <tspan x="800" dy="56">what still works and what stops</tspan>
  </text>

  <!-- LEFT COLUMN: Keeps working -->
  <g>
    <!-- Column Container -->
    <rect x="60" y="170" width="720" height="610" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="420" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Keeps working</text>

    <!-- Card 1: Running pods (kubelet and runtime continue) -->
    <rect x="90" y="245" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(115, 294)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8" />
      <path d="M 4 20 L 52 20" />
      <circle cx="14" cy="12" r="2" fill="#207448" />
      <circle cx="22" cy="12" r="2" fill="#207448" />
      <polyline points="18 36, 26 44, 38 30" />
    </g>
    <text x="195" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="195" dy="0">Running pods </tspan>
      <tspan x="195" dy="36">(kubelet and runtime continue)</tspan>
    </text>

    <!-- Card 2: kube-proxy keeps existing rules -->
    <rect x="90" y="425" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(115, 474)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6" />
      <line x1="16" y1="20" x2="16" y2="36" />
      <line x1="28" y1="20" x2="28" y2="36" />
      <line x1="40" y1="20" x2="40" y2="36" />
      <circle cx="16" cy="28" r="3" fill="#207448" />
      <circle cx="28" cy="22" r="3" fill="#207448" />
      <circle cx="40" cy="32" r="3" fill="#207448" />
    </g>
    <text x="195" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">kube-proxy keeps existing rules</text>

    <!-- Card 3: An in-progress multi-node NCCL training job -->
    <rect x="90" y="605" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(115, 654)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6" />
      <circle cx="28" cy="28" r="6" fill="#207448" />
      <line x1="18" y1="2" x2="18" y2="10" />
      <line x1="28" y1="2" x2="28" y2="10" />
      <line x1="38" y1="2" x2="38" y2="10" />
      <line x1="18" y1="46" x2="18" y2="54" />
      <line x1="28" y1="46" x2="28" y2="54" />
      <line x1="38" y1="46" x2="38" y2="54" />
      <line x1="2" y1="18" x2="10" y2="18" />
      <line x1="2" y1="28" x2="10" y2="28" />
      <line x1="2" y1="38" x2="10" y2="38" />
      <line x1="46" y1="18" x2="54" y2="18" />
      <line x1="46" y1="28" x2="54" y2="28" />
      <line x1="46" y1="38" x2="54" y2="38" />
    </g>
    <text x="195" y="674" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="195" dy="0">An in-progress </tspan>
      <tspan x="195" dy="36">multi-node NCCL training job</tspan>
    </text>
  </g>

  <!-- RIGHT COLUMN: Stops -->
  <g>
    <!-- Column Container -->
    <rect x="820" y="170" width="720" height="610" rx="16" fill="#fff5f5" stroke="#c53030" stroke-width="2" />
    <text x="1180" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#c53030">Stops</text>

    <!-- Card 1: Scheduling -->
    <rect x="850" y="245" width="660" height="72" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5" />
    <g transform="translate(866, 253)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="42" rx="6" />
      <line x1="6" y1="20" x2="50" y2="20" />
      <line x1="18" y1="4" x2="18" y2="12" />
      <line x1="38" y1="4" x2="38" y2="12" />
      <line x1="16" y1="32" x2="40" y2="32" />
    </g>
    <text x="940" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Scheduling</text>

    <!-- Card 2: Scaling -->
    <rect x="850" y="331" width="660" height="72" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5" />
    <g transform="translate(866, 339)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14 24, 6 32, 14 40" />
      <polyline points="42 24, 50 32, 42 40" />
      <line x1="8" y1="32" x2="48" y2="32" />
      <line x1="28" y1="16" x2="28" y2="48" />
    </g>
    <text x="940" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Scaling</text>

    <!-- Card 3: New deployments -->
    <rect x="850" y="417" width="660" height="72" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5" />
    <g transform="translate(866, 425)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 C 28 6, 42 16, 42 32 L 36 38 L 20 38 L 14 32 C 14 16, 28 6, 28 6 Z" />
      <circle cx="28" cy="22" r="4" fill="#c53030" />
      <line x1="28" y1="38" x2="28" y2="48" />
      <line x1="20" y1="44" x2="36" y2="44" />
    </g>
    <text x="940" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">New deployments</text>

    <!-- Card 4: kubectl -->
    <rect x="850" y="503" width="660" height="72" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5" />
    <g transform="translate(866, 511)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <polyline points="16 22, 24 28, 16 34" />
      <line x1="28" y1="34" x2="38" y2="34" />
    </g>
    <text x="940" y="548" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">kubectl</text>

    <!-- Card 5: Replacing crashed pods that need a controller -->
    <rect x="850" y="589" width="660" height="88" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5" />
    <g transform="translate(866, 605)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 44 28 A 18 18 0 1 1 28 10" />
      <polyline points="28 4, 28 14, 38 14" />
      <line x1="22" y1="22" x2="34" y2="34" />
      <line x1="34" y1="22" x2="22" y2="34" />
    </g>
    <text x="940" y="627" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="940" dy="0">Replacing crashed pods </tspan>
      <tspan x="940" dy="32">that need a controller</tspan>
    </text>

    <!-- Card 6: Autoscalers and operators -->
    <rect x="850" y="691" width="660" height="72" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5" />
    <g transform="translate(866, 699)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <line x1="28" y1="6" x2="28" y2="12" />
      <line x1="28" y1="44" x2="28" y2="50" />
      <line x1="6" y1="28" x2="12" y2="28" />
      <line x1="44" y1="28" x2="50" y2="28" />
      <line x1="12" y1="12" x2="17" y2="17" />
      <line x1="39" y1="39" x2="44" y2="44" />
      <line x1="12" y1="44" x2="17" y2="39" />
      <line x1="39" y1="17" x2="44" y2="12" />
    </g>
    <text x="940" y="736" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Autoscalers and operators</text>
  </g>

  <!-- TAKEAWAY BANNER -->
  <g>
    <rect x="60" y="820" width="1480" height="70" rx="12" fill="#207448" />
    <text x="800" y="864" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Running workloads do not depend on the control plane being up. Only changes do.</text>
  </g>

  <!-- BOTTOM STRIP TIMELINE -->
  <g>
    <!-- Timeline node 1: node leases expire after about 40 s -->
    <rect x="60" y="930" width="460" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(262, 945)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28 14, 28 28, 38 28" />
      <line x1="28" y1="2" x2="28" y2="6" />
    </g>
    <text x="290" y="1030" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="290" dy="0">node leases expire </tspan>
      <tspan x="290" dy="30">after about 40 s</tspan>
    </text>

    <!-- Timeline Arrow (then) -->
    <line x1="520" y1="1005" x2="598" y2="1005" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

    <!-- Timeline node 2: eviction timeout trap (Highlighted with #db8129) -->
    <rect x="600" y="930" width="940" height="150" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <g transform="translate(1042, 945)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28 6, 52 48, 4 48" />
      <line x1="28" y1="20" x2="28" y2="34" />
      <circle cx="28" cy="41" r="1.5" fill="#db8129" />
    </g>
    <text x="1070" y="1030" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1070" dy="0">after the 5 min eviction timeout, pods may be evicted </tspan>
      <tspan x="1070" dy="30">when the API returns and nodes look NotReady</tspan>
    </text>
  </g>
</svg>