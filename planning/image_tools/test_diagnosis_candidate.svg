<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Which diagnosis tool answers which question</title>
  <desc>A reference table pairing Python concurrency and systems diagnosis questions with the appropriate tools, including faulthandler, py-spy, thread inspection, ss, lsof, strace, perf, and tracemalloc, alongside key health metrics and a diagnostic sequence.</desc>
  <rect width="1600" height="1160" fill="#f5f8f5"/>
  <text x="800" y="76" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which diagnosis tool answers which question</text>
  <!-- Column Headers -->
  <rect x="40" y="108" width="580" height="66" rx="8" fill="#207448"/>
  <text x="330" y="151" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Question</text>
  <rect x="640" y="108" width="920" height="66" rx="8" fill="#207448"/>
  <text x="1100" y="151" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Tool</text>
  <!-- ==================== TABLE ROWS ==================== -->
  <!-- Row: stuck -->
  <rect x="40" y="186" width="580" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(56,222)">
    <circle cx="24" cy="24" r="21" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="18" y1="14" x2="18" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="14" x2="30" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="122" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Where is every thread</tspan>
    <tspan x="122" dy="34">stuck right now?</tspan>
  </text>
  <rect x="640" y="186" width="920" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="664" y="222" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="664" dy="0">faulthandler.enable(),</tspan>
    <tspan x="664" dy="28">faulthandler.dump_traceback_later(timeout, repeat=True),</tspan>
    <tspan x="664" dy="28">kill -SIGUSR1 with faulthandler.register</tspan>
  </text>
  <!-- Row: running -->
  <rect x="40" y="318" width="580" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(56,344)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="30" y1="30" x2="42" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="4" fill="#207448"/>
  </g>
  <text x="122" y="361" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Look at a running process</tspan>
    <tspan x="122" dy="34">without changing its code</tspan>
  </text>
  <rect x="640" y="318" width="920" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="664" y="370" font-family="monospace" font-size="24" fill="#303a36">py-spy dump, py-spy top, py-spy record</text>
  <!-- Row: threads -->
  <rect x="40" y="430" width="580" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(56,456)">
    <circle cx="10" cy="24" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="15" y1="24" x2="25" y2="24" stroke="#207448" stroke-width="3"/>
    <path d="M 25 24 L 32 12 M 25 24 L 33 24 M 25 24 L 32 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="12" r="4" fill="#207448"/>
    <circle cx="39" cy="24" r="4" fill="#207448"/>
    <circle cx="38" cy="36" r="4" fill="#207448"/>
  </g>
  <text x="122" y="473" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">What threads and</tspan>
    <tspan x="122" dy="34">tasks exist?</tspan>
  </text>
  <rect x="640" y="430" width="920" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="664" y="475" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="664" dy="0">threading.enumerate(), sys._current_frames(),</tspan>
    <tspan x="664" dy="28">asyncio.all_tasks(), psutil.Process().num_threads()</tspan>
  </text>
  <!-- Row: sockets -->
  <rect x="40" y="542" width="580" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(56,561)">
    <rect x="6" y="10" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="14" y1="18" x2="14" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="18" x2="24" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="18" x2="34" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="122" y="595" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Sockets and descriptors</text>
  <rect x="640" y="542" width="920" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="664" y="594" font-family="monospace" font-size="24" fill="#303a36">ss -s, lsof -p</text>
  <!-- Row: syscalls -->
  <rect x="40" y="640" width="580" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(56,659)">
    <rect x="10" y="10" width="28" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="18" y="18" width="12" height="12" rx="2" fill="#207448"/>
    <line x1="16" y1="3" x2="16" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="3" x2="24" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="3" x2="32" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="38" x2="16" y2="45" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="38" x2="24" y2="45" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="32" y2="45" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3" y1="16" x2="10" y2="16" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3" y1="24" x2="10" y2="24" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3" y1="32" x2="10" y2="32" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="16" x2="45" y2="16" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="24" x2="45" y2="24" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="32" x2="45" y2="32" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="122" y="693" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">System calls and CPU</text>
  <rect x="640" y="640" width="920" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="664" y="692" font-family="monospace" font-size="24" fill="#303a36">strace -f -p, perf</text>
  <!-- Row: memory -->
  <rect x="40" y="738" width="580" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(56,757)">
    <rect x="5" y="12" width="38" height="24" rx="2" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="10" y="16" width="6" height="8" rx="1" fill="#207448"/>
    <rect x="21" y="16" width="6" height="8" rx="1" fill="#207448"/>
    <rect x="32" y="16" width="6" height="8" rx="1" fill="#207448"/>
    <line x1="8" y1="36" x2="8" y2="40" stroke="#207448" stroke-width="2"/>
    <line x1="14" y1="36" x2="14" y2="40" stroke="#207448" stroke-width="2"/>
    <line x1="20" y1="36" x2="20" y2="40" stroke="#207448" stroke-width="2"/>
    <line x1="28" y1="36" x2="28" y2="40" stroke="#207448" stroke-width="2"/>
    <line x1="34" y1="36" x2="34" y2="40" stroke="#207448" stroke-width="2"/>
    <line x1="40" y1="36" x2="40" y2="40" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="122" y="791" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Where memory grows</text>
  <rect x="640" y="738" width="920" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="664" y="790" font-family="monospace" font-size="24" fill="#303a36">tracemalloc</text>
  <!-- Row: metrics -->
  <rect x="40" y="836" width="580" height="86" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(56,855)">
    <polyline points="4,24 14,24 20,10 28,38 34,18 40,24 44,24" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="122" y="889" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Health metrics to track</text>
  <rect x="640" y="836" width="920" height="86" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
  <text x="664" y="888" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">in-flight tasks, queue depth, latency percentiles</text>
  <!-- ==================== CHAIN STRIP ==================== -->
  <rect x="40" y="938" width="1520" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(58,954)">
    <rect x="4" y="10" width="22" height="14" rx="7" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="18" y="22" width="22" height="14" rx="7" fill="none" stroke="#207448" stroke-width="3.5"/>
  </g>
  <text x="122" y="986" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">symptom, then faulthandler dump or py-spy dump, then the cause in the pitfall table</text>
  <!-- ==================== BOTTOM BAR ==================== -->
  <rect x="40" y="1034" width="1520" height="64" rx="8" fill="#207448"/>
  <text x="800" y="1074" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Sample the live process before you guess</text>
</svg>