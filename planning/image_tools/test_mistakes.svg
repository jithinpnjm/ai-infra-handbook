<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Common mistakes in errors, files and subprocesses, grouped</title>
  <desc>A grouped table of common mistakes and fixes across exceptions, files, subprocess, global state, re-runs, signals, and untrusted input.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <!-- ==================== TITLE ==================== -->
  <text x="800" y="44" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Common mistakes in errors, files</tspan>
    <tspan x="800" dy="52">and subprocesses, grouped</tspan>
  </text>
  <!-- ==================== TABLE HEADERS ==================== -->
  <rect x="40" y="100" width="270" height="44" rx="6" fill="#207448"/>
  <text x="175" y="132" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Area</text>
  <rect x="325" y="100" width="715" height="44" rx="6" fill="#207448"/>
  <text x="682" y="132" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Mistake</text>
  <rect x="1055" y="100" width="505" height="44" rx="6" fill="#207448"/>
  <text x="1307" y="132" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Fix</text>
  <!-- ==================== TABLE ROWS ==================== -->
  <!-- Row: exceptions -->
  <rect x="40" y="150" width="270" height="104" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <polygon points="76,184 96,218 56,218" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="76" y1="196" x2="76" y2="206" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="76" cy="212" r="2" fill="#207448"/>
  <text x="108" y="212" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Exceptions</text>
  <rect x="325" y="150" width="715" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="345" y="184" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="345" dy="0">bare except and except Exception: pass;</tspan>
    <tspan x="345" dy="25">catching too much around too much code</tspan>
    <tspan x="345" dy="25">loses tracebacks and hides bugs</tspan>
  </text>
  <rect x="1055" y="150" width="505" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="184" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">catch the narrowest exception,</tspan>
    <tspan x="1075" dy="25">log once at the top</tspan>
  </text>
  <!-- Row: files -->
  <rect x="40" y="260" width="270" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 62 307 L 82 307 L 92 317 L 92 343 L 62 343 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 82 307 L 82 317 L 92 317" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="68" y1="325" x2="86" y2="325" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="333" x2="82" y2="333" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="108" y="335" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Files</text>
  <rect x="325" y="260" width="715" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="345" y="294" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="345" dy="0">writing in place leads to partial writes;</tspan>
    <tspan x="345" dy="25">declaring success before an fsync;</tspan>
    <tspan x="345" dy="25">exists-then-create checks leave gaps; no</tspan>
    <tspan x="345" dy="25">explicit encoding; mixing bytes and str</tspan>
  </text>
  <rect x="1055" y="260" width="505" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="294" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">atomic replace, fsync, attempt</tspan>
    <tspan x="1075" dy="25">then handle, encoding=utf-8</tspan>
  </text>
  <!-- Row: subprocess -->
  <rect x="40" y="396" width="270" height="178" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="56" y="469" width="40" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="62,479 68,485 62,491" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="72" y1="491" x2="82" y2="491" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <text x="108" y="495" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Subprocess</text>
  <rect x="325" y="396" width="715" height="178" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="345" y="430" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="345" dy="0">shell=True with interpolated input; missing</tspan>
    <tspan x="345" dy="25">timeouts; ignored return codes; parsing</tspan>
    <tspan x="345" dy="25">human-formatted output; secrets in command</tspan>
    <tspan x="345" dy="25">lines; capturing huge output in memory; pipe</tspan>
    <tspan x="345" dy="25">deadlocks; unreaped children; os.system,</tspan>
    <tspan x="345" dy="25">os.popen and the deprecated commands module</tspan>
  </text>
  <rect x="1055" y="396" width="505" height="178" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="430" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">argument list, timeout, check,</tspan>
    <tspan x="1075" dy="25">machine-readable output,</tspan>
    <tspan x="1075" dy="25">communicate, wait</tspan>
  </text>
  <!-- Row: global_state -->
  <rect x="40" y="580" width="270" height="104" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="76" cy="632" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
    <ellipse cx="76" cy="632" rx="8" ry="18" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="58" y1="632" x2="94" y2="632" stroke="#207448" stroke-width="3"/>
  <text x="108" y="626" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="108" dy="0">Global</tspan>
    <tspan x="108" dy="32">state</tspan>
  </text>
  <rect x="325" y="580" width="715" height="104" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
  <text x="345" y="614" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="345" dy="0">mutating os.environ or os.chdir inside a</tspan>
    <tspan x="345" dy="25">library affects every caller; assuming the</tspan>
    <tspan x="345" dy="25">current directory</tspan>
  </text>
  <rect x="1055" y="580" width="505" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="614" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">copy the environment for the</tspan>
    <tspan x="1075" dy="25">child, pass explicit paths</tspan>
  </text>
  <!-- Row: reruns -->
  <rect x="40" y="690" width="270" height="104" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 76 726 A 16 16 0 1 1 62 744" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="76,721 76,732 84,726" fill="#207448"/>
  <text x="108" y="752" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Re-runs</text>
  <rect x="325" y="690" width="715" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="345" y="750" font-family="monospace" font-size="24" fill="#303a36">scripts unsafe to re-run</text>
  <rect x="1055" y="690" width="505" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="724" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">dry-run mode, a lock against</tspan>
    <tspan x="1075" dy="25">overlapping runs, UTC timestamps</tspan>
    <tspan x="1075" dy="25">rather than naive ones</tspan>
  </text>
  <!-- Row: signals -->
  <rect x="40" y="800" width="270" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="76" y1="835" x2="76" y2="857" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="76" cy="831" r="4" fill="#207448"/>
    <path d="M 66 825 A 14 14 0 0 1 86 825" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 819 A 22 22 0 0 1 92 819" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="108" y="849" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Signals</text>
  <rect x="325" y="800" width="715" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="345" y="834" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="345" dy="0">heavy work in signal handlers;</tspan>
    <tspan x="345" dy="25">ignoring SIGTERM in containers</tspan>
  </text>
  <rect x="1055" y="800" width="505" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="847" font-family="sans-serif" font-size="24" fill="#303a36">set a flag, finish and exit</text>
  <!-- Row: untrusted_input -->
  <rect x="40" y="884" width="270" height="104" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 76 918 L 92 924 C 92 942 76 952 76 952 C 76 952 60 942 60 924 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="76" y1="928" x2="76" y2="938" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="76" cy="943" r="2" fill="#207448"/>
  <text x="108" y="930" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="108" dy="0">Untrusted</tspan>
    <tspan x="108" dy="32">input</tspan>
  </text>
  <rect x="325" y="884" width="715" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="345" y="918" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="345" dy="0">extracting tar or zip archives without</tspan>
    <tspan x="345" dy="25">validating paths; yaml.load or pickle on</tspan>
    <tspan x="345" dy="25">data from the network</tspan>
  </text>
  <rect x="1055" y="884" width="505" height="104" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="918" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">validate member paths,</tspan>
    <tspan x="1075" dy="25">filter=data, safe_load</tspan>
  </text>
  <!-- ==================== STORIES STRIP ==================== -->
  <rect x="40" y="1000" width="1520" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1032" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">a cleanup script runs twice because its lock was checked before it was taken,</tspan>
    <tspan x="800" dy="28">and the second run deletes the checkpoint the first one was writing</tspan>
  </text>
  <!-- ==================== BOTTOM BAR ==================== -->
  <rect x="40" y="1088" width="1520" height="50" rx="8" fill="#207448"/>
  <text x="800" y="1122" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A second attempt after a failure should be boring</text>
</svg>