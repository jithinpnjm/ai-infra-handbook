<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Ten common mistakes and the chapter idea that fixes each</title>
  <desc>A two column table mapping ten common Python mistakes to their corresponding fixes and principles.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="50" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Ten common mistakes and the chapter idea that fixes each</text>
  <rect x="40" y="72" width="890" height="58" rx="8" fill="#207448"/>
  <text x="485" y="113" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Mistake</text>
  <rect x="950" y="72" width="610" height="58" rx="8" fill="#207448"/>
  <text x="1255" y="113" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Fix from this chapter</text>
  <rect x="40" y="140" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="177" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Treating names as boxes;</tspan>
    <tspan x="64" dy="28">mutating a list through an alias</tspan>
  </text>
  <rect x="950" y="140" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="177" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="974" dy="0">names are labels, assignment binds;</tspan>
    <tspan x="974" dy="28">copy when you need independence</tspan>
  </text>
  <rect x="40" y="237" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="274" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Mutable default arguments, module-level</tspan>
    <tspan x="64" dy="28">mutable state, defaults computed at import time</tspan>
  </text>
  <rect x="950" y="237" width="610" height="88" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <text x="974" y="287" font-family="sans-serif" font-size="24" fill="#303a36">nodes=None idiom; ruff B006 flags it</text>
  <rect x="40" y="334" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="371" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Comparing with is instead of ==, except None;</tspan>
    <tspan x="64" dy="28">using == with floats; relying on round or interning</tspan>
  </text>
  <rect x="950" y="334" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="384" font-family="sans-serif" font-size="24" fill="#303a36">is only for singletons; math.isclose</text>
  <rect x="40" y="431" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="468" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Modifying a collection while iterating;</tspan>
    <tspan x="64" dy="28">list for membership on large data</tspan>
  </text>
  <rect x="950" y="431" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="481" font-family="sans-serif" font-size="24" fill="#303a36">iterate a copy; use a set</text>
  <rect x="40" y="528" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="565" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Building strings by += in loops; building</tspan>
    <tspan x="64" dy="28">commands or queries from untrusted input</tspan>
  </text>
  <rect x="950" y="528" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="565" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="974" dy="0">join; argument lists and</tspan>
    <tspan x="974" dy="28">parameterised queries</tspan>
  </text>
  <rect x="40" y="625" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="662" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Catching exceptions too broadly</tspan>
    <tspan x="64" dy="28">or silently, except: pass</tspan>
  </text>
  <rect x="950" y="625" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="675" font-family="sans-serif" font-size="24" fill="#303a36">catch narrow exceptions (chapter 3.5)</text>
  <rect x="40" y="722" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="759" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">from module import *; shadowing</tspan>
    <tspan x="64" dy="28">built-ins list, dict, id, type, input</tspan>
  </text>
  <rect x="950" y="722" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="772" font-family="sans-serif" font-size="24" fill="#303a36">explicit imports, other names</text>
  <rect x="40" y="819" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="856" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Mixing tabs and spaces; unversioned</tspan>
    <tspan x="64" dy="28">global pip install into the system Python</tspan>
  </text>
  <rect x="950" y="819" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="869" font-family="sans-serif" font-size="24" fill="#303a36">four spaces; virtual environments</text>
  <rect x="40" y="916" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="953" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">Trusting dynamic types without validation at boundaries:</tspan>
    <tspan x="64" dy="28">API input, config files, environment variables</tspan>
  </text>
  <rect x="950" y="916" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="966" font-family="sans-serif" font-size="24" fill="#303a36">validate at the boundary, type hints</text>
  <rect x="40" y="1013" width="890" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="64" y="1063" font-family="sans-serif" font-size="24" fill="#303a36">Optimising without measuring</text>
  <rect x="950" y="1013" width="610" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="974" y="1050" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="974" dy="0">timeit, cProfile, py-spy; gains</tspan>
    <tspan x="974" dy="28">usually come from algorithms and I/O</tspan>
  </text>
  <rect x="40" y="1117" width="1520" height="56" rx="8" fill="#207448"/>
  <text x="800" y="1155" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Read once now, and once more before you hand a script to production</text>
</svg>