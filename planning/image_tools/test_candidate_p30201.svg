<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Two ways to find the broken layer: bottom up, or bisect from the middle</title>
  <desc>Comparison of bottom-up network layer testing against bisection troubleshooting from the gateway.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <!-- Title -->
  <text x="800" y="46" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Two ways to find the broken layer:</tspan>
    <tspan x="800" dy="54">bottom up, or bisect from the middle</tspan>
  </text>
  <!-- Left Panel Container: Test bottom up -->
  <rect x="40" y="122" width="575" height="826" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="325" y="164" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Test bottom up</text>
  <!-- Bracket for left panel -->
  <path d="M 175 180 C 145 180 145 545 135 545 C 145 545 145 910 175 910" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="110" y="490" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="110" dy="0">each</tspan>
    <tspan x="110" dy="28">layer</tspan>
    <tspan x="110" dy="28">fails</tspan>
    <tspan x="110" dy="28">in its</tspan>
    <tspan x="110" dy="28">own way</tspan>
  </text>
  <!-- Left Box 1: link -->
  <rect x="185" y="175" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 189)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="13" height="15" rx="2" fill="#e8f1ea"/>
    <line x1="15" y1="14.5" x2="23" y2="14.5"/>
    <circle cx="26" cy="14.5" r="2.5"/>
  </g>
  <text x="408" y="216" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">link</text>
  <line x1="395" y1="233" x2="395" y2="250" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 2: address -->
  <rect x="185" y="250" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 264)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="28" height="21" rx="3" fill="#e8f1ea"/>
    <line x1="7" y1="11" x2="15" y2="11"/>
    <line x1="7" y1="18" x2="21" y2="18"/>
  </g>
  <text x="408" y="291" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">address</text>
  <line x1="395" y1="308" x2="395" y2="325" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 3: route -->
  <rect x="185" y="325" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 339)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="23" x2="18" y2="7"/>
    <polyline points="9,7 18,7 18,16"/>
    <line x1="18" y1="7" x2="28" y2="7"/>
  </g>
  <text x="408" y="366" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">route</text>
  <line x1="395" y1="383" x2="395" y2="400" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 4: ARP -->
  <rect x="185" y="400" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 414)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="9" x2="23" y2="9"/>
    <polyline points="18,5 23,9 18,13"/>
    <line x1="25" y1="20" x2="5" y2="20"/>
    <polyline points="10,16 5,20 10,24"/>
  </g>
  <text x="408" y="441" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ARP</text>
  <line x1="395" y1="458" x2="395" y2="475" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 5: ping the gateway -->
  <rect x="185" y="475" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 489)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="16" r="3.5" fill="#207448"/>
    <path d="M 15 9 A 10 10 0 0 1 15 23"/>
    <path d="M 21 3 A 18 18 0 0 1 21 29"/>
  </g>
  <text x="408" y="516" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ping the gateway</text>
  <line x1="395" y1="533" x2="395" y2="550" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 6: ping the destination -->
  <rect x="185" y="550" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 564)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15" cy="15" r="12"/>
    <circle cx="15" cy="15" r="5.5"/>
    <circle cx="15" cy="15" r="2" fill="#207448"/>
  </g>
  <text x="408" y="591" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ping the destination</text>
  <line x1="395" y1="608" x2="395" y2="625" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 7: DNS -->
  <rect x="185" y="625" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 639)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15" cy="15" r="12"/>
    <line x1="3" y1="15" x2="27" y2="15"/>
    <ellipse cx="15" cy="15" rx="5.5" ry="12"/>
  </g>
  <text x="408" y="666" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DNS</text>
  <line x1="395" y1="683" x2="395" y2="700" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 8: TCP port -->
  <rect x="185" y="700" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 714)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="6" width="11" height="17" rx="2" fill="#e8f1ea"/>
    <rect x="18" y="6" width="8" height="17" rx="2"/>
    <line x1="14" y1="11" x2="18" y2="11"/>
    <line x1="14" y1="18" x2="18" y2="18"/>
  </g>
  <text x="408" y="741" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TCP port</text>
  <line x1="395" y1="758" x2="395" y2="775" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 9: TLS -->
  <rect x="185" y="775" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 789)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="12" width="19" height="15" rx="3" fill="#e8f1ea"/>
    <path d="M 9.5 12 V 6.5 A 5 5 0 0 1 19.5 6.5 V 12"/>
  </g>
  <text x="408" y="816" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TLS</text>
  <line x1="395" y1="833" x2="395" y2="850" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Left Box 10: HTTP -->
  <rect x="185" y="850" width="420" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(196, 864)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="25" height="21" rx="3" fill="#e8f1ea"/>
    <line x1="3" y1="11" x2="28" y2="11"/>
    <circle cx="7.5" cy="7.5" r="1.5" fill="#207448"/>
    <circle cx="12.5" cy="7.5" r="1.5" fill="#207448"/>
  </g>
  <text x="408" y="891" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">HTTP</text>
  <!-- Right Panel Container: Bisect from the middle -->
  <rect x="635" y="122" width="925" height="826" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="1097" y="164" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Bisect from the middle</text>
  <!-- Diamond 1 -->
  <polygon points="665,230 850,176 1035,230 850,284" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="850" y="223" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="850" dy="0">Can you reach</tspan>
    <tspan x="850" dy="30">the gateway?</tspan>
  </text>
  <line x1="1035" y1="230" x2="1080" y2="230" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="1057" y="218" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">No</text>
  <!-- Leaf 1 -->
  <rect x="1080" y="184" width="455" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1098, 210)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="6" x2="24" y2="6"/>
    <line x1="4" y1="14" x2="28" y2="14"/>
    <line x1="4" y1="22" x2="20" y2="22"/>
    <line x1="28" y1="26" x2="28" y2="36"/>
    <polyline points="24,30 28,36 32,30"/>
  </g>
  <text x="1325" y="222" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1325" dy="0">look below:</tspan>
    <tspan x="1325" dy="32">link, address, route, ARP</tspan>
  </text>
  <line x1="850" y1="284" x2="850" y2="321" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="875" y="310" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Yes</text>
  <!-- Diamond 2 (Orange Outline) -->
  <polygon points="665,375 850,321 1035,375 850,429" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <text x="850" y="357" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="850" dy="0">Can you reach</tspan>
    <tspan x="850" dy="25">an IP on the</tspan>
    <tspan x="850" dy="25">Internet?</tspan>
  </text>
  <line x1="1035" y1="375" x2="1080" y2="375" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="1057" y="363" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">No</text>
  <!-- Leaf 2 -->
  <rect x="1080" y="329" width="455" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1098, 357)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 6 H 28 V 22 C 28 30 16 34 16 34 C 16 34 4 30 4 22 Z"/>
    <line x1="4" y1="14" x2="28" y2="14"/>
    <line x1="16" y1="6" x2="16" y2="34"/>
  </g>
  <text x="1330" y="367" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1330" dy="0">routing, NAT, firewall</tspan>
    <tspan x="1330" dy="32">beyond the gateway</tspan>
  </text>
  <line x1="850" y1="429" x2="850" y2="466" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="875" y="455" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Yes</text>
  <!-- Diamond 3 -->
  <polygon points="665,520 850,466 1035,520 850,574" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="850" y="513" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="850" dy="0">Can you</tspan>
    <tspan x="850" dy="30">resolve names?</tspan>
  </text>
  <line x1="1035" y1="520" x2="1080" y2="520" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="1057" y="508" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">No</text>
  <!-- Leaf 3 -->
  <rect x="1080" y="474" width="455" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1098, 502)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <line x1="2" y1="16" x2="30" y2="16"/>
    <ellipse cx="16" cy="16" rx="6" ry="14"/>
  </g>
  <text x="1330" y="512" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1330" dy="0">DNS: resolver,</tspan>
    <tspan x="1330" dy="32">search domains, port 53</tspan>
  </text>
  <line x1="850" y1="574" x2="850" y2="620" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="875" y="600" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Yes</text>
  <!-- Leaf 4 -->
  <rect x="655" y="620" width="530" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(670, 648)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="36" height="26" rx="4" fill="#e8f1ea"/>
    <polyline points="8,12 14,17 8,22"/>
    <line x1="18" y1="22" x2="28" y2="22"/>
  </g>
  <text x="935" y="658" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="935" dy="0">TCP, TLS or HTTP:</tspan>
    <tspan x="935" dy="32">use curl -v and the exit code</tspan>
  </text>
  <!-- Comparison note card -->
  <rect x="655" y="748" width="880" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(695, 806)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 28 C 4 22 2 14 8 7 C 14 0 26 0 32 7 C 38 14 36 22 28 28 L 26 34 H 14 Z" fill="#e8f1ea"/>
    <line x1="14" y1="39" x2="26" y2="39"/>
    <line x1="17" y1="44" x2="23" y2="44"/>
    <line x1="20" y1="-6" x2="20" y2="-1"/>
    <line x1="38" y1="2" x2="33" y2="6"/>
    <line x1="2" y1="2" x2="7" y2="6"/>
  </g>
  <text x="1135" y="803" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1135" dy="0">Bisecting is like finding a break</tspan>
    <tspan x="1135" dy="36">in a long string of lights by</tspan>
    <tspan x="1135" dy="36">testing the middle bulb first</tspan>
  </text>
  <!-- Footer Container -->
  <rect x="40" y="988" width="1520" height="84" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1024" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Start with the layer the message points to, and test one layer at a time;</tspan>
    <tspan x="800" dy="28">check the client side first, including proxy settings and the DNS view</tspan>
  </text>
  <!-- Bottom Takeaway Bar -->
  <rect x="40" y="1100" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="1140" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Method details are in chapter 2.30</text>
</svg>