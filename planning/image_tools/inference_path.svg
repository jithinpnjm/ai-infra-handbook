<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The whiteboard path for an inference service, and the metrics to watch on it</title>
  <desc>Whiteboard path for an inference service across gateways, L7 router, endpoint picker, inference pods, metrics, streaming hygiene, and L4 scaling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The whiteboard path for an inference service,</tspan>
    <tspan x="800" dy="50">and the metrics to watch on it</tspan>
  </text>
  <!-- Node 1: Client -->
  <g id="node-client">
    <rect x="40" y="125" width="150" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(87, 137)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="32" rx="4" fill="#ffffff" />
      <line x1="28" y1="36" x2="28" y2="44" />
      <line x1="16" y1="44" x2="40" y2="44" />
    </g>
    <text x="115" y="222" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client</text>
  </g>
  <!-- Hop 1: Client to Gateway -->
  <line x1="190" y1="185" x2="400" y2="185" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <circle cx="295" cy="185" r="7" fill="#db8129" stroke="#ffffff" stroke-width="2" />
  <line x1="295" y1="192" x2="295" y2="255" stroke="#db8129" stroke-width="2" stroke-dasharray="4 4" />
  <!-- Annotation on first hop -->
  <g id="annotation-hop1">
    <rect x="50" y="255" width="330" height="135" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="215" y="284" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="215" dy="0">where pinning</tspan>
      <tspan x="215" dy="28">happens at L4</tspan>
    </text>
    <line x1="70" y1="324" x2="360" y2="324" stroke="#e8f1ea" stroke-width="1.5" />
    <text x="215" y="352" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="215" dy="0">L7 or client-side</tspan>
      <tspan x="215" dy="28">balancing fixes it</tspan>
    </text>
  </g>
  <!-- Node 2: Gateways -->
  <g id="node-gateway">
    <rect x="400" y="125" width="275" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(510, 137)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="26" rx="4" fill="#ffffff" />
      <circle cx="16" cy="19" r="3" fill="#207448" />
      <circle cx="28" cy="19" r="3" fill="#207448" />
      <circle cx="40" cy="19" r="3" fill="#207448" />
      <line x1="12" y1="32" x2="8" y2="44" />
      <line x1="44" y1="32" x2="48" y2="44" />
    </g>
    <text x="537" y="224" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="537" dy="0">anycast or ECMP</tspan>
      <tspan x="537" dy="32">to a fleet of L4</tspan>
      <tspan x="537" dy="32">and L7 gateways</tspan>
      <tspan x="537" dy="32">(BGP VIP, BFD)</tspan>
    </text>
  </g>
  <!-- Hop 2: Gateway to TLS Routing -->
  <line x1="675" y1="250" x2="705" y2="250" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <!-- Node 3: TLS Routing -->
  <g id="node-tls">
    <rect x="705" y="125" width="285" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(820, 137)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 10 L 28 4 L 48 10 C 48 28 28 42 28 42 C 28 42 8 28 8 10 Z" fill="#ffffff" />
      <circle cx="28" cy="22" r="4" fill="#207448" />
      <line x1="28" y1="26" x2="28" y2="32" stroke="#207448" stroke-width="3" />
    </g>
    <text x="847" y="224" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="847" dy="0">TLS termination</tspan>
      <tspan x="847" dy="32">and L7 routing</tspan>
      <tspan x="847" dy="32">with per-request,</tspan>
      <tspan x="847" dy="32">per-tenant policy</tspan>
    </text>
  </g>
  <!-- Hop 3: TLS to Picker -->
  <line x1="990" y1="250" x2="1020" y2="250" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <!-- Node 4: Endpoint Picker -->
  <g id="node-picker">
    <rect x="1020" y="125" width="250" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(1117, 137)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="6" x2="28" y2="42" />
      <line x1="8" y1="16" x2="48" y2="16" />
      <path d="M 8 16 L 3 32 H 17 Z" fill="#ffffff" />
      <path d="M 48 16 L 43 32 H 57 Z" fill="#ffffff" />
      <line x1="16" y1="42" x2="40" y2="42" />
    </g>
    <text x="1145" y="235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1145" dy="0">load- and</tspan>
      <tspan x="1145" dy="34">cache-aware</tspan>
      <tspan x="1145" dy="34">endpoint picker</tspan>
    </text>
  </g>
  <!-- Hop 4: Picker to Inference Pods -->
  <line x1="1270" y1="250" x2="1300" y2="250" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <!-- Node 5: Inference Pods -->
  <g id="node-pods">
    <rect x="1300" y="125" width="260" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(1402, 137)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="34" rx="5" fill="#ffffff" />
      <line x1="16" y1="16" x2="24" y2="16" />
      <line x1="16" y1="24" x2="24" y2="24" />
      <line x1="16" y1="32" x2="24" y2="32" />
      <circle cx="38" cy="18" r="3" fill="#207448" />
      <circle cx="38" cy="28" r="3" fill="#207448" />
    </g>
    <text x="1430" y="215" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1430" dy="0">inference pods</tspan>
      <tspan x="1430" dy="30">with readiness,</tspan>
      <tspan x="1430" dy="30">drain and GPU</tspan>
      <tspan x="1430" dy="30">health</tspan>
      <tspan x="1430" dy="30">integration</tspan>
    </text>
  </g>
  <!-- Left Panel: Watch per backend -->
  <g id="panel-metrics">
    <rect x="40" y="415" width="740" height="430" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(65, 427)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="38" height="28" rx="4" fill="#ffffff" />
      <polyline points="10,24 18,14 26,20 34,10" />
    </g>
    <text x="125" y="452" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Watch per backend</text>
    <rect x="65" y="475" width="335" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="232" y="510" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">request counts</text>
    <rect x="420" y="475" width="335" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="587" y="510" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">in-flight requests</text>
    <rect x="65" y="539" width="335" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="232" y="576" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">queue time</text>
    <rect x="420" y="539" width="335" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="587" y="563" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="587" dy="0">error and</tspan>
      <tspan x="587" dy="26">retry rates</tspan>
    </text>
    <rect x="65" y="609" width="335" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="232" y="633" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="232" dy="0">TTFT and ITL</tspan>
      <tspan x="232" dy="26">percentiles</tspan>
    </text>
    <rect x="420" y="609" width="335" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="587" y="646" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">ejection events</text>
    <rect x="65" y="679" width="690" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="410" y="713" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">hot-backend alerts</text>
    <rect x="65" y="741" width="690" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="410" y="774" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="410" dy="0">trace each request across the gateway,</tspan>
      <tspan x="410" dy="30">the router and the engine</tspan>
    </text>
  </g>
  <!-- Right Panel: Streaming Hygiene -->
  <g id="panel-streaming">
    <rect x="820" y="415" width="740" height="430" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="845" y="435" width="690" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1190" y="470" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">disable proxy buffering for SSE</text>
    <rect x="845" y="501" width="690" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1190" y="534" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1190" dy="0">read and stream-idle timeouts</tspan>
      <tspan x="1190" dy="30">above the maximum generation time</tspan>
    </text>
    <rect x="845" y="589" width="240" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="965" y="624" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">heartbeats</text>
    <rect x="1105" y="589" width="430" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1320" y="624" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">avoid Connection: close</text>
    <rect x="845" y="655" width="690" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1190" y="690" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">HTTP/2 end to end where possible</text>
    <rect x="845" y="721" width="690" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1190" y="753" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1190" dy="0">measure time-to-first-token (TTFT) and</tspan>
      <tspan x="1190" dy="28">inter-token latency at the proxy with</tspan>
      <tspan x="1190" dy="28">$upstream_response_time or Envoy stats</tspan>
    </text>
  </g>
  <!-- Strip: Scaling the L4 tier -->
  <g id="strip-l4">
    <rect x="40" y="865" width="1520" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="904" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">BGP convergence sets how quickly a failed node's traffic moves; BFD detects in under a second;</tspan>
      <tspan x="800" dy="32">resilient or consistent hashing in the router moves only the failed node's flows;</tspan>
      <tspan x="800" dy="32">announce the VIP only while the node can serve; a route change can move a flow to a different site,</tspan>
      <tspan x="800" dy="32">which breaks long-lived TCP; fabric ECMP caveats: elephant flows,</tspan>
      <tspan x="800" dy="32">RoCE varies UDP source ports per QP, tunnels need inner-header hashing,</tspan>
      <tspan x="800" dy="32">adaptive routing reacts to load</tspan>
    </text>
  </g>
  <!-- Bottom Bar: Takeaway -->
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="52" rx="10" fill="#207448" />
    <text x="800" y="1161" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Decide your failover budget first</text>
  </g>
</svg>