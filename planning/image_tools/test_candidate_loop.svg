<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>During and after an incident: evidence, updates, review</title>
  <desc>Three-stage loop for incident management showing evidence collection, communication, and blameless review, alongside game day drills.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Canvas Title -->
  <text x="800" y="54" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">During and after an incident: </tspan>
    <tspan x="800" dy="54">evidence, updates, review</tspan>
  </text>

  <!-- ==================== CARD 1: COLLECT AS YOU GO (ORANGE BORDER) ==================== -->
  <g id="card-1">
    <rect x="50" y="105" width="710" height="490" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    <!-- Step Circle 1 -->
    <circle cx="95" cy="150" r="24" fill="#207448" />
    <text x="95" y="159" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    <!-- Icon 1: Clipboard / Log -->
    <g transform="translate(135, 124)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="42" rx="4" />
      <path d="M 16 8 V 4 H 32 V 8" />
      <line x1="14" y1="19" x2="34" y2="19" />
      <line x1="14" y1="27" x2="34" y2="27" />
      <line x1="14" y1="35" x2="26" y2="35" />
    </g>
    <!-- Card 1 Text -->
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" y="160" font-size="30" font-weight="bold" fill="#207448">Collect as you go: </tspan>
      <tspan x="85" y="215">incident log with UTC timeline, </tspan>
      <tspan x="85" dy="30">observations, commands run, </tspan>
      <tspan x="85" dy="30">changes made, who did what; </tspan>
      <tspan x="85" dy="30">exact error strings; </tspan>
      <tspan x="85" dy="30"><tspan font-family="monospace">kubectl get -o yaml</tspan> snapshots, </tspan>
      <tspan x="85" dy="30"><tspan font-family="monospace">describe</tspan> output, pod logs including </tspan>
      <tspan x="85" dy="30"><tspan font-family="monospace">--previous</tspan>, node journals, <tspan font-family="monospace">dmesg</tspan>, </tspan>
      <tspan x="85" dy="30"><tspan font-family="monospace">pcaps</tspan>, metric screenshots </tspan>
      <tspan x="85" dy="30">with time ranges, <tspan font-family="monospace">nvidia-bug-report</tspan>, </tspan>
      <tspan x="85" dy="30"><tspan font-family="monospace">Hubble</tspan> flows, audit log excerpts; </tspan>
      <tspan x="85" dy="30">for support <tspan font-family="monospace">kubectl cluster-info dump</tspan>, </tspan>
      <tspan x="85" dy="30"><tspan font-family="monospace">sosreport</tspan>, vendor bundles</tspan>
    </text>
  </g>

  <!-- ==================== CARD 2: COMMUNICATE ==================== -->
  <g id="card-2">
    <rect x="840" y="105" width="710" height="490" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Step Circle 2 -->
    <circle cx="885" cy="150" r="24" fill="#207448" />
    <text x="885" y="159" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    <!-- Icon 2: Communication / Broadcast -->
    <g transform="translate(925, 124)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 10 H 40 C 43 10 45 12 45 15 V 33 C 45 36 43 38 40 38 H 22 L 14 45 V 38 H 8 C 5 38 3 36 3 33 V 15 C 3 12 5 10 8 10 Z" />
      <line x1="13" y1="20" x2="35" y2="20" />
      <line x1="13" y1="28" x2="27" y2="28" />
    </g>
    <!-- Card 2 Text -->
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="995" y="160" font-size="30" font-weight="bold" fill="#207448">Communicate: </tspan>
      <tspan x="875" y="240">status updates at fixed intervals, </tspan>
      <tspan x="875" dy="45">state the impact clearly, </tspan>
      <tspan x="875" dy="45">give an ETA only when you </tspan>
      <tspan x="875" dy="45">have a basis for it</tspan>
    </text>
  </g>

  <!-- ==================== CARD 3: BLAMELESS REVIEW ==================== -->
  <g id="card-3">
    <rect x="840" y="655" width="710" height="490" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Step Circle 3 -->
    <circle cx="885" cy="700" r="24" fill="#207448" />
    <text x="885" y="709" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
    <!-- Icon 3: Review / Shield with Checkmark -->
    <g transform="translate(925, 674)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 6 L 42 12 V 26 C 42 38 24 46 24 46 C 24 46 6 38 6 26 V 12 Z" />
      <polyline points="15,26 21,32 33,18" />
    </g>
    <!-- Card 3 Text -->
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="995" y="710" font-size="30" font-weight="bold" fill="#207448">Blameless review: </tspan>
      <tspan x="875" y="770">timeline, contributing factors </tspan>
      <tspan x="875" dy="38">(not one single root cause), </tspan>
      <tspan x="875" dy="38">detection gaps, how well </tspan>
      <tspan x="875" dy="38">the mitigation worked, </tspan>
      <tspan x="875" dy="38">action items with owners for </tspan>
      <tspan x="875" dy="38">automation, alerts, guardrails, </tspan>
      <tspan x="875" dy="38">docs and tests; turn recurring </tspan>
      <tspan x="875" dy="38">manual diagnosis into automated checks</tspan>
    </text>
  </g>

  <!-- ==================== CARD 4: GAME DAY (SIDE) ==================== -->
  <g id="card-4">
    <rect x="50" y="655" width="710" height="490" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Icon 4: Target / Drill -->
    <g transform="translate(85, 674)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <circle cx="24" cy="24" r="8" />
      <line x1="24" y1="2" x2="24" y2="46" />
      <line x1="2" y1="24" x2="46" y2="24" />
    </g>
    <!-- Card 4 Text -->
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" y="710" font-size="30" font-weight="bold" fill="#207448">game day: </tspan>
      <tspan x="85" y="775">planned drill with a fault the team </tspan>
      <tspan x="85" dy="42">has not seen; measure time-to-detect </tspan>
      <tspan x="85" dy="42">and time-to-recover; tools <tspan font-family="monospace">tc netem</tspan>, </tspan>
      <tspan x="85" dy="42"><tspan font-family="monospace">Chaos Mesh NetworkChaos</tspan>, </tspan>
      <tspan x="85" dy="42">kill pods and nodes, fill disks, </tspan>
      <tspan x="85" dy="42">stop <tspan font-family="monospace">kubelet</tspan>, break CNI</tspan>
    </text>
  </g>

  <!-- ==================== LOOP ARROWS (EXACTLY 3) ==================== -->
  <!-- Arrow 1: Card 1 -> Card 2 -->
  <line x1="760" y1="350" x2="838" y2="350" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  <!-- Arrow 2: Card 2 -> Card 3 -->
  <line x1="1195" y1="595" x2="1195" y2="653" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  <!-- Arrow 3: Card 3 -> Card 1 (Loop back) -->
  <path d="M 840 870 H 800 V 625 H 405 V 597" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
</svg>