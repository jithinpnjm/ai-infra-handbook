<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>The GPU count probe, and the pipe that hides a failure</title>
  <desc>Visual infographic explaining how a shell pipeline probe for GPU count can hide an nvidia-smi failure behind wc, and how bash pipefail fixes it.</desc>

  <!-- Background -->
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  <!-- Title (48px bold) -->
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">The GPU count probe, </tspan><tspan x="800" dy="54">and the pipe that hides a failure</tspan></text>

  <!-- ==================== LEFT COLUMN: PROBE & WALK ==================== -->

  <!-- Card 1: Annotated Task (Top Left) -->
  <g id="card-annotated-task">
    <rect x="40" y="150" width="740" height="380" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <!-- GPU Chip Icon (56x56) at top right of Card 1 -->
    <g transform="translate(694, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8"/>
      <rect x="16" y="16" width="24" height="24" rx="4" fill="#e8f1ea" stroke-width="3"/>
      <!-- Top pins -->
      <line x1="20" y1="0" x2="20" y2="4" stroke-width="3"/>
      <line x1="28" y1="0" x2="28" y2="4" stroke-width="3"/>
      <line x1="36" y1="0" x2="36" y2="4" stroke-width="3"/>
      <!-- Bottom pins -->
      <line x1="20" y1="52" x2="20" y2="56" stroke-width="3"/>
      <line x1="28" y1="52" x2="28" y2="56" stroke-width="3"/>
      <line x1="36" y1="52" x2="36" y2="56" stroke-width="3"/>
      <!-- Left pins -->
      <line x1="0" y1="20" x2="4" y2="20" stroke-width="3"/>
      <line x1="0" y1="28" x2="4" y2="28" stroke-width="3"/>
      <line x1="0" y1="36" x2="4" y2="36" stroke-width="3"/>
      <!-- Right pins -->
      <line x1="52" y1="20" x2="56" y2="20" stroke-width="3"/>
      <line x1="52" y1="28" x2="56" y2="28" stroke-width="3"/>
      <line x1="52" y1="36" x2="56" y2="36" stroke-width="3"/>
    </g>

    <!-- Card 1 Text -->
    <text x="70" y="202" font-size="24" fill="#303a36"><tspan x="70" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Count visible GPUs:</tspan> <tspan x="70" dy="42" font-family="ui-monospace, monospace">shell nvidia-smi -L | wc -l,</tspan> <tspan x="70" dy="36" font-family="ui-monospace, monospace">args executable /bin/bash,</tspan> <tspan x="70" dy="36" font-family="ui-monospace, monospace">register gpu_count,</tspan> <tspan x="70" dy="36"><tspan font-family="ui-monospace, monospace">changed_when false </tspan><tspan font-family="system-ui, -apple-system, sans-serif">(read-only, never changed),</tspan></tspan> <tspan x="70" dy="36" font-family="ui-monospace, monospace">failed_when gpu_count.rc != 0 or</tspan> <tspan x="70" dy="36" font-family="ui-monospace, monospace">(gpu_count.stdout | int) != expected_gpus,</tspan> <tspan x="70" dy="36"><tspan font-family="ui-monospace, monospace">check_mode false </tspan><tspan font-family="system-ui, -apple-system, sans-serif">(run even under --check,</tspan></tspan> <tspan x="70" dy="36" font-family="system-ui, -apple-system, sans-serif">safe because read-only)</tspan></text>
  </g>

  <!-- Card 2: Walk (Bottom Left) -->
  <g id="card-walk">
    <rect x="40" y="570" width="740" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <!-- Process / Gear Icon (56x56) at top right of Card 2 -->
    <g transform="translate(694, 595)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="16"/>
      <circle cx="28" cy="28" r="6" fill="#207448"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="44" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="17" y2="17"/>
      <line x1="39" y1="39" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="17" y2="39"/>
      <line x1="39" y1="17" x2="45" y2="11"/>
    </g>

    <!-- Card 2 Text -->
    <text x="70" y="622" font-size="24" fill="#303a36"><tspan x="70" dy="0" font-family="system-ui, -apple-system, sans-serif">Ansible starts <tspan font-family="ui-monospace, monospace">/bin/bash</tspan>, which runs</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">nvidia-smi -L</tspan> and pipes the listing into</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">wc -l</tspan>; the count comes back as text in</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">gpu_count.stdout</tspan>; <tspan font-family="ui-monospace, monospace">failed_when</tspan> converts</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif">it with <tspan font-family="ui-monospace, monospace">int</tspan> and compares with the expected</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif">count; a node showing seven GPUs when eight</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif">are expected fails the task at once and</tspan> <tspan x="70" dy="38" font-family="system-ui, -apple-system, sans-serif">the message names the task</tspan></text>
  </g>

  <!-- ==================== RIGHT COLUMN: THE TRAP & FIX ==================== -->

  <!-- Card 3: The Trap (Top Right, Orange) -->
  <g id="card-the-trap">
    <rect x="820" y="150" width="740" height="380" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>

    <!-- Warning / Alert Triangle Icon (56x56, Orange) at top right of Card 3 -->
    <g transform="translate(1474, 175)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 52 48 A 2 2 0 0 1 50 51 L 6 51 A 2 2 0 0 1 4 48 Z"/>
      <line x1="28" y1="20" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>

    <!-- Card 3 Text -->
    <text x="850" y="220" font-size="24" fill="#303a36"><tspan x="850" dy="0" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">nvidia-smi</tspan> fails with an error while</tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">wc</tspan> succeeds on empty output: the pipeline</tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif">reports success and the playbook believes</tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif">the node has no GPUs and moves on</tspan></text>
  </g>

  <!-- Card 4: Fix (Bottom Right) -->
  <g id="card-fix">
    <rect x="820" y="570" width="740" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <!-- Security Shield / Tool Icon (56x56) at top right of Card 4 -->
    <g transform="translate(1474, 595)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 V 14 Z"/>
      <path d="M 18 28 L 25 35 L 38 20"/>
    </g>

    <!-- Card 4 Text -->
    <text x="850" y="635" font-size="24" fill="#303a36"><tspan x="850" dy="0" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">set -o pipefail</tspan> works only in bash,</tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif">so the probe needs executable <tspan font-family="ui-monospace, monospace">/bin/bash</tspan></tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif">and <tspan font-family="ui-monospace, monospace">set -o pipefail</tspan>; if that gets</tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif">fragile keep the probe simple or split</tspan> <tspan x="850" dy="42" font-family="system-ui, -apple-system, sans-serif">it into a module call plus Jinja filters</tspan></text>
  </g>

  <!-- ==================== BOTTOM BAR: TAKEAWAY ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="970" width="1520" height="70" rx="12" fill="#207448"/>
    <!-- Spark / Key takeaway icon in white -->
    <g transform="translate(68, 987)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="14"/>
      <polyline points="11,18 16,23 25,13"/>
    </g>
    <text x="800" y="1014" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">A pipe takes the exit code of its last command</text>
  </g>
</svg>