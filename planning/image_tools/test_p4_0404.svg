<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>How the parser resolves gpu01 and gpu02 from node_defaults</title>
  <desc>Visual trace showing YAML parser loading node_defaults anchor into gpu01 and overriding gpus to 4 in gpu02, with limits and results.</desc>

  <!-- Background -->
  <rect width="1600" height="1170" fill="#f5f8f5"/>

  <!-- Title (48px bold) -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">How the parser resolves gpu01 and gpu02</tspan>
    <tspan x="800" dy="54">from node_defaults</tspan>
  </text>

  <!-- Story strip -->
  <g id="story-strip">
    <rect x="40" y="132" width="1520" height="64" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- GPU cluster icon (56px) -->
    <g transform="translate(56, 136)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="12" rx="3"/>
      <rect x="6" y="24" width="44" height="12" rx="3"/>
      <rect x="6" y="40" width="44" height="12" rx="3"/>
      <circle cx="14" cy="14" r="2" fill="#207448"/>
      <circle cx="14" cy="30" r="2" fill="#207448"/>
      <circle cx="14" cy="46" r="2" fill="#207448"/>
    </g>
    <text x="834" y="172" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">forty identical GPU machines: change one shared value and thirty-nine entries need no edit</text>
  </g>

  <!-- ==================== THREE STEPS ==================== -->
  <!-- Step 1 -->
  <g id="step-1">
    <rect x="40" y="222" width="486" height="400" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Number Circle 1 -->
    <circle cx="84" cy="264" r="24" fill="#207448"/>
    <text x="84" y="273" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <!-- Parser / Document Icon (56px) -->
    <g transform="translate(450, 236)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 6 L 36 6 L 48 18 L 48 50 L 8 50 Z"/>
      <polyline points="36,6 36,18 48,18"/>
      <line x1="16" y1="26" x2="32" y2="26"/>
      <line x1="16" y1="34" x2="40" y2="34"/>
      <line x1="16" y1="42" x2="28" y2="42"/>
    </g>
    <!-- Content Card -->
    <rect x="60" y="308" width="446" height="294" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="283" y="354" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="283" dy="0">parser reads defaults:</tspan>
      <tspan x="283" dy="36">&amp;node_defaults with</tspan>
      <tspan x="283" dy="36">gpus: 8, os: ubuntu-22.04,</tspan>
      <tspan x="283" dy="36">tags: [h100] and</tspan>
      <tspan x="283" dy="36">stores it under the name</tspan>
      <tspan x="283" dy="36">node_defaults</tspan>
    </text>
  </g>

  <!-- Step 2 -->
  <g id="step-2">
    <rect x="557" y="222" width="486" height="400" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Number Circle 2 -->
    <circle cx="601" cy="264" r="24" fill="#207448"/>
    <text x="601" y="273" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <!-- Clone / Copy Icon (56px) -->
    <g transform="translate(967, 236)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="14" width="34" height="34" rx="4"/>
      <path d="M 10 38 L 6 38 A 4 4 0 0 1 2 34 L 2 10 A 4 4 0 0 1 6 6 L 30 6 A 4 4 0 0 1 34 10 L 34 14"/>
      <line x1="22" y1="28" x2="38" y2="28"/>
      <line x1="22" y1="36" x2="34" y2="36"/>
    </g>
    <!-- Content Card -->
    <rect x="577" y="308" width="446" height="294" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="800" y="394" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">gpu01:</tspan>
      <tspan x="800" dy="40">&lt;&lt;: *node_defaults</tspan>
      <tspan x="800" dy="40">copies gpus 8, os</tspan>
      <tspan x="800" dy="40">and tags into the node</tspan>
    </text>
  </g>

  <!-- Step 3 -->
  <g id="step-3">
    <rect x="1074" y="222" width="486" height="400" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Number Circle 3 -->
    <circle cx="1118" cy="264" r="24" fill="#207448"/>
    <text x="1118" y="273" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <!-- Override / Edit Icon (56px) -->
    <g transform="translate(1484, 236)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 32 8 L 44 20 L 18 46 L 6 48 L 8 36 Z"/>
      <line x1="26" y1="14" x2="38" y2="26"/>
    </g>
    <!-- Content Card 1: Copy and replace -->
    <rect x="1094" y="308" width="446" height="162" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1317" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1317" dy="0">gpu02:</tspan>
      <tspan x="1317" dy="28">the same copy first,</tspan>
      <tspan x="1317" dy="28">then the local key</tspan>
      <tspan x="1317" dy="28">gpus: 4 replaces</tspan>
      <tspan x="1317" dy="28">the copied 8</tspan>
    </text>
    <!-- Content Card 2: Orange Override Badge -->
    <rect x="1094" y="484" width="446" height="118" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="1317" y="522" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="1317" dy="0">the override wins because</tspan>
      <tspan x="1317" dy="32">the local key comes</tspan>
      <tspan x="1317" dy="32">after the merge</tspan>
    </text>
  </g>

  <!-- ==================== RESULT TABLE & LIMITS PANEL ==================== -->
  <!-- Result table (Left) -->
  <g id="result-table">
    <rect x="40" y="648" width="560" height="408" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Table Grid Icon (56px) -->
    <g transform="translate(524, 664)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="4"/>
      <line x1="6" y1="20" x2="50" y2="20"/>
      <line x1="6" y1="34" x2="50" y2="34"/>
      <line x1="22" y1="6" x2="22" y2="50"/>
    </g>
    <!-- Result Row 1 -->
    <rect x="64" y="736" width="512" height="136" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="320" y="794" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="320" dy="0">gpu01: gpus 8,</tspan>
      <tspan x="320" dy="36">os ubuntu-22.04, tags [h100]</tspan>
    </text>
    <!-- Result Row 2 -->
    <rect x="64" y="896" width="512" height="136" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="320" y="954" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="320" dy="0">gpu02: gpus 4,</tspan>
      <tspan x="320" dy="36">os ubuntu-22.04, tags [h100]</tspan>
    </text>
  </g>

  <!-- Limits panel (Right) -->
  <g id="limits-panel">
    <rect x="630" y="648" width="930" height="408" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <!-- Shield / Warning Icon (56px) -->
    <g transform="translate(1484, 664)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 V 14 Z"/>
      <line x1="28" y1="20" x2="28" y2="30"/>
      <circle cx="28" cy="38" r="2" fill="#207448"/>
    </g>
    <!-- Limits Content Card -->
    <rect x="654" y="736" width="882" height="296" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1095" y="768" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1095" dy="0">anchors work inside a single file only, not across files;</tspan>
      <tspan x="1095" dy="30">&lt;&lt; is a YAML 1.1 convention supported by PyYAML and</tspan>
      <tspan x="1095" dy="30">Kubernetes tooling, not part of the YAML 1.2 core,</tspan>
      <tspan x="1095" dy="30">and not every parser honours it;</tspan>
      <tspan x="1095" dy="30">overused anchors make diffs harder, a reviewer has to</tspan>
      <tspan x="1095" dy="30">scroll to the top to learn what the node contains,</tspan>
      <tspan x="1095" dy="30">and chains of anchors make it longer;</tspan>
      <tspan x="1095" dy="30">higher-level reuse: GitLab extends and</tspan>
      <tspan x="1095" dy="30">GitHub Actions reusable workflows</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <rect x="40" y="1080" width="1520" height="60" rx="10" fill="#207448"/>
  <text x="800" y="1118" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The local key after the merge wins</text>
</svg>