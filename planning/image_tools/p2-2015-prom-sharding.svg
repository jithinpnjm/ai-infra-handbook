<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Shard Prometheus by function, federate only aggregates</title>
  <desc>Visual infographic explaining functional sharding of Prometheus into platform, tenant workloads, and GPU exporters, federating only aggregated metrics to the global Prometheus server while keeping raw per-pod series local.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#d9383a"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#f5f8f5"/>

  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Shard Prometheus by function,</tspan>
    <tspan x="800" dy="56">federate only aggregates</tspan>
  </text>

  <rect x="60" y="135" width="1480" height="175" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>

  <g transform="translate(100, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="22" rx="4"/>
    <circle cx="16" cy="17" r="3" fill="#207448"/>
    <line x1="28" y1="17" x2="42" y2="17"/>
    <rect x="4" y="36" width="48" height="22" rx="4"/>
    <circle cx="16" cy="47" r="3" fill="#207448"/>
    <line x1="28" y1="47" x2="42" y2="47"/>
    <line x1="12" y1="66" x2="44" y2="66"/>
    <line x1="20" y1="58" x2="16" y2="66"/>
    <line x1="36" y1="58" x2="40" y2="66"/>
  </g>

  <text x="180" y="215" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">One server holds all</tspan>
    <tspan x="180" dy="38">active series in memory</tspan>
  </text>

  <g transform="translate(680, 180)">
    <rect x="0" y="6" width="450" height="68" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(18, 18)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="30" height="26" rx="2"/>
      <line x1="12" y1="3" x2="12" y2="8"/>
      <line x1="21" y1="3" x2="21" y2="8"/>
      <line x1="30" y1="3" x2="30" y2="8"/>
      <line x1="12" y1="34" x2="12" y2="39"/>
      <line x1="21" y1="34" x2="21" y2="39"/>
      <line x1="30" y1="34" x2="30" y2="39"/>
      <line x1="1" y1="15" x2="6" y2="15"/>
      <line x1="1" y1="23" x2="6" y2="23"/>
      <line x1="1" y1="31" x2="6" y2="31"/>
      <line x1="36" y1="15" x2="41" y2="15"/>
      <line x1="36" y1="23" x2="41" y2="23"/>
      <line x1="36" y1="31" x2="41" y2="31"/>
    </g>
    <rect x="74" y="20" width="350" height="40" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <rect x="76" y="22" width="330" height="36" rx="4" fill="#db8129"/>
    <line x1="390" y1="16" x2="390" y2="64" stroke="#d9383a" stroke-width="3" stroke-dasharray="3,3"/>
  </g>

  <rect x="1200" y="186" width="280" height="72" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="1340" y="231" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">query timeout</text>

  <rect x="60" y="350" width="460" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(100, 400)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="10"/>
    <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 18 L 42 14"/>
  </g>
  <text x="315" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="315" dy="0">Shard 1:</tspan>
    <tspan x="315" dy="38">platform</tspan>
  </text>

  <rect x="570" y="350" width="460" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(610, 400)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="40" rx="4"/>
    <line x1="6" y1="20" x2="50" y2="20"/>
    <circle cx="14" cy="14" r="2" fill="#207448"/>
    <circle cx="22" cy="14" r="2" fill="#207448"/>
    <circle cx="30" cy="14" r="2" fill="#207448"/>
    <rect x="14" y="28" width="12" height="12" rx="2"/>
    <rect x="30" y="28" width="12" height="12" rx="2"/>
  </g>
  <text x="825" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="825" dy="0">Shard 2:</tspan>
    <tspan x="825" dy="38">tenant workloads</tspan>
  </text>

  <rect x="1080" y="350" width="460" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1115, 400)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <line x1="18" y1="4" x2="18" y2="10"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
    <line x1="38" y1="4" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="52"/>
    <line x1="28" y1="46" x2="28" y2="52"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="4" y1="18" x2="10" y2="18"/>
    <line x1="4" y1="28" x2="10" y2="28"/>
    <line x1="4" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="52" y2="18"/>
    <line x1="46" y1="28" x2="52" y2="28"/>
    <line x1="46" y1="38" x2="52" y2="38"/>
  </g>
  <text x="1335" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1335" dy="0">Shard 3:</tspan>
    <tspan x="1335" dy="38">GPU and node exporters</tspan>
  </text>

  <line x1="190" y1="510" x2="190" y2="713" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <line x1="600" y1="510" x2="600" y2="713" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <path d="M 1140 510 L 1140 540 L 990 540 L 990 713" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="240" y="570" width="340" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="410" y="618" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="410" dy="0">Only aggregates and</tspan>
    <tspan x="410" dy="34">SLI series upward</tspan>
  </text>

  <line x1="790" y1="510" x2="790" y2="560" stroke="#d9383a" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <g stroke="#d9383a" stroke-width="4" stroke-linecap="round">
    <line x1="775" y1="525" x2="805" y2="555"/>
    <line x1="805" y1="525" x2="775" y2="555"/>
  </g>

  <rect x="630" y="570" width="320" height="105" rx="12" fill="#ffffff" stroke="#d9383a" stroke-width="2.5"/>
  <text x="790" y="618" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#d9383a">
    <tspan x="790" dy="0">Never federate</tspan>
    <tspan x="790" dy="34">raw per-pod series</tspan>
  </text>

  <rect x="60" y="725" width="960" height="175" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(100, 770)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="42" cy="42" r="32"/>
    <ellipse cx="42" cy="42" rx="16" ry="32"/>
    <line x1="10" y1="42" x2="74" y2="42"/>
    <line x1="17" y1="24" x2="67" y2="24"/>
    <line x1="17" y1="60" x2="67" y2="60"/>
  </g>
  <g transform="translate(210, 765)">
    <rect x="0" y="10" width="760" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="35" cy="44" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <path d="M 27 44 L 33 50 L 44 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="75" y1="34" x2="720" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="54" x2="580" y2="54" stroke="#a9c4b3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="1070" y="725" width="470" height="175" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="1305" y="782" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1305" dy="0" font-weight="bold">Cost: fragmented data,</tspan>
    <tspan x="1305" dy="36">a question across shards</tspan>
    <tspan x="1305" dy="36">needs two queries and a join</tspan>
  </text>

  <rect x="60" y="945" width="1480" height="80" rx="14" fill="#207448"/>
  <text x="800" y="996" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Shard by function or region first, aggregate with recording rules.</text>

</svg>