<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>Pinned memory budget for a 24 GiB pod</title>
  <desc>A worked host-memory budget where four workers with pinned and runtime memory total 28 GiB against a 24 GiB limit, so an OOM kill is expected.</desc>

  <defs>
    <pattern id="hatchCache" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#e8f1ea"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#a9c4b3" stroke-width="4"/>
    </pattern>
  </defs>

    <rect width="1600" height="1060" fill="#f5f8f5"/>

    <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pinned memory budget for a 24 GiB pod</text>

  
    <g id="input-card">
    <rect x="50" y="110" width="380" height="565" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
        <g transform="translate(75, 135)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="38" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18"/>
      <circle cx="14" cy="12" r="2.5" fill="#207448"/>
      <circle cx="24" cy="12" r="2.5" fill="#207448"/>
    </g>
    
        <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="145" y="156">Hypothetical </tspan>
      <tspan x="145" y="192">inference pod</tspan>
    </text>

        <rect x="70" y="212" width="340" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="240" y="252" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Limit: 24 GiB</text>

        <rect x="70" y="280" width="340" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="240" y="320" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Worker processes: 4</text>

        <rect x="70" y="348" width="340" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="388">Pinned staging </tspan>
      <tspan x="90" y="416">buffers per </tspan>
      <tspan x="90" y="444">worker: 4 GiB</tspan>
    </text>

        <rect x="70" y="472" width="340" height="86" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="512">Runtime memory </tspan>
      <tspan x="90" y="540">per worker: 3 GiB</tspan>
    </text>

        <rect x="70" y="568" width="340" height="86" rx="10" fill="#ffffff" stroke="#a9c4b3" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="608">Cached weights: </tspan>
      <tspan x="90" y="636">15 GiB</tspan>
    </text>
  </g>

    <g id="stacked-bar-card">
    <rect x="470" y="110" width="700" height="565" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
        <g transform="translate(495, 135)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="#ffffff"/>
      <rect x="18" y="18" width="20" height="20" rx="3" fill="#e8f1ea"/>
      <line x1="18" y1="2" x2="18" y2="8"/>
      <line x1="28" y1="2" x2="28" y2="8"/>
      <line x1="38" y1="2" x2="38" y2="8"/>
      <line x1="18" y1="48" x2="18" y2="54"/>
      <line x1="28" y1="48" x2="28" y2="54"/>
      <line x1="38" y1="48" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="8" y2="18"/>
      <line x1="2" y1="28" x2="8" y2="28"/>
      <line x1="2" y1="38" x2="8" y2="38"/>
      <line x1="48" y1="18" x2="54" y2="18"/>
      <line x1="48" y1="28" x2="54" y2="28"/>
      <line x1="48" y1="38" x2="54" y2="38"/>
    </g>
    
        <text x="560" y="166" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cannot be reclaimed</text>

        <rect x="490" y="212" width="660" height="442" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

            
        <rect x="490" y="310" width="163" height="160" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="572" y="368">Worker 1 </tspan>
      <tspan x="572" y="412">(4 + 3)</tspan>
    </text>

        <rect x="655" y="310" width="163" height="160" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="737" y="368">Worker 2 </tspan>
      <tspan x="737" y="412">(4 + 3)</tspan>
    </text>

        <rect x="820" y="310" width="163" height="160" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="902" y="368">Worker 3 </tspan>
      <tspan x="902" y="412">(4 + 3)</tspan>
    </text>

        <rect x="985" y="310" width="165" height="160" rx="8" fill="#207448"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="1067" y="368">Worker 4 </tspan>
      <tspan x="1067" y="412">(4 + 3)</tspan>
    </text>

        <line x1="1056" y1="230" x2="1056" y2="520" stroke="#207448" stroke-width="4" stroke-dasharray="8 6"/>
    
        <rect x="998" y="230" width="116" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1056" y="271" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Limit</text>

        <path d="M 1056 540 L 1056 565 L 1150 565 L 1150 540" fill="none" stroke="#207448" stroke-width="2"/>
    <circle cx="1103" cy="565" r="4" fill="#207448"/>
  </g>

    <g id="verdict-box">
    <rect x="1210" y="110" width="340" height="565" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
        <g transform="translate(1352, 160)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="16,0 40,0 56,16 56,40 40,56 16,56 0,40 0,16"/>
      <line x1="28" y1="16" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>

        <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1380" y="290">OOM kill expected: </tspan>
      <tspan x="1380" y="332">28.0 GiB cannot </tspan>
      <tspan x="1380" y="374">be reclaimed, </tspan>
      <tspan x="1380" y="416">limit is lower</tspan>
    </text>

        <rect x="1240" y="500" width="280" height="60" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="1275" cy="530" r="14" fill="#db8129"/>
    <line x1="1268" y1="530" x2="1282" y2="530" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

      <g id="second-scenario-card">
    <rect x="50" y="715" width="1500" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
        <g transform="translate(85, 735)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <path d="M 16 28 L 24 36 L 40 20"/>
    </g>

        <text x="170" y="770" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Fits, but page cache will be reclaimed constantly</text>

                    <rect x="170" y="805" width="560" height="42" rx="6" fill="#207448"/>
    <rect x="730" y="805" width="300" height="42" rx="6" fill="url(#hatchCache)" stroke="#207448" stroke-width="2"/>
    
        <line x1="970" y1="790" x2="970" y2="860" stroke="#207448" stroke-width="4"/>
    <polygon points="970,785 962,797 978,797" fill="#207448"/>
    
        <rect x="970" y="805" width="60" height="42" rx="4" fill="#207448" fill-opacity="0.25" stroke="#207448" stroke-width="2"/>
  </g>

      <g id="formula-strip">
    <rect x="50" y="935" width="840" height="80" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="470" y="982" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">unreclaimable = workers x (pinned + runtime)</text>
  </g>

    <g id="note-box">
    <rect x="930" y="935" width="620" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1240" y="982" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Page cache is left out of the sum.</text>
  </g>

</svg>