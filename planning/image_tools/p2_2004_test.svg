<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What one open call does, step by step</title>
  <desc>Visual infographic explaining the five steps of an open call from program passing a file name to returning a slot number, with a kernel panel enclosing directory walking, open file description creation, and process table pointer assignment.</desc>

  <defs>
    <!-- Proportional green arrowhead (18px) -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>

    <!-- Card shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What one open call does, step by step</text>

  <!-- ==================== TOP PROGRAM NODE ==================== -->
  <g id="node-program" filter="url(#card-shadow)">
    <rect x="100" y="90" width="940" height="68" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Process Icon (56px) -->
    <g transform="translate(130, 96)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <polyline points="14,28 20,33 14,38" />
      <line x1="24" y1="38" x2="36" y2="38" />
    </g>
    <text x="210" y="136" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Program</text>
  </g>

  <!-- ==================== STEP 1 (OUTSIDE KERNEL PANEL) ==================== -->
  <g id="step-1" filter="url(#card-shadow)">
    <rect x="100" y="198" width="940" height="80" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 1 -->
    <circle cx="145" cy="238" r="24" fill="#207448" />
    <text x="145" y="247" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    <!-- File/document icon -->
    <g transform="translate(195, 210)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 6 L 36 6 L 46 16 L 46 50 L 12 50 Z" />
      <polyline points="36,6 36,16 46,16" />
      <line x1="20" y1="28" x2="38" y2="28" />
      <line x1="20" y1="38" x2="34" y2="38" />
    </g>
    <text x="280" y="248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Program passes a file name</text>
  </g>

  <!-- ==================== KERNEL PANEL ENCLOSING STEPS 2 TO 4 ==================== -->
  <rect x="60" y="318" width="1020" height="478" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  <!-- ==================== STEP 2 (INSIDE KERNEL PANEL) ==================== -->
  <g id="step-2" filter="url(#card-shadow)">
    <rect x="100" y="358" width="940" height="104" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 2 -->
    <circle cx="145" cy="410" r="24" fill="#207448" />
    <text x="145" y="419" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    <!-- Folder tree icon -->
    <g transform="translate(195, 382)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 14 L 22 14 L 28 22 L 48 22 L 48 46 L 8 46 Z" />
      <line x1="18" y1="34" x2="38" y2="34" />
    </g>
    <text x="280" y="401" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Kernel walks the directory names</tspan>
      <tspan x="280" dy="36">until it reaches the inode</tspan>
    </text>
  </g>

  <!-- ==================== STEP 3 (INSIDE KERNEL PANEL) ==================== -->
  <g id="step-3" filter="url(#card-shadow)">
    <rect x="100" y="502" width="940" height="104" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 3 -->
    <circle cx="145" cy="554" r="24" fill="#207448" />
    <text x="145" y="563" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
    <!-- Open file description / offset icon -->
    <g transform="translate(195, 526)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="4" />
      <line x1="8" y1="24" x2="48" y2="24" />
      <circle cx="28" cy="35" r="4" fill="#207448" />
      <line x1="16" y1="35" x2="40" y2="35" />
    </g>
    <text x="280" y="545" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Creates an open file description</tspan>
      <tspan x="280" dy="36">with its own offset</tspan>
    </text>
  </g>

  <!-- ==================== STEP 4 (INSIDE KERNEL PANEL - ORANGE OUTLINE) ==================== -->
  <g id="step-4" filter="url(#card-shadow)">
    <rect x="100" y="646" width="940" height="110" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <!-- Number circle 4 -->
    <circle cx="145" cy="701" r="24" fill="#207448" />
    <text x="145" y="710" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>
    <!-- Table / slot grid icon -->
    <g transform="translate(195, 673)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" />
      <line x1="6" y1="22" x2="50" y2="22" />
      <line x1="6" y1="34" x2="50" y2="34" />
      <line x1="22" y1="8" x2="22" y2="48" />
    </g>
    <text x="280" y="689" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Places a pointer in the first free slot</tspan>
      <tspan x="280" dy="36">of the process table</tspan>
    </text>
  </g>

  <!-- ==================== STEP 5 (OUTSIDE KERNEL PANEL) ==================== -->
  <g id="step-5" filter="url(#card-shadow)">
    <rect x="100" y="836" width="940" height="80" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Number circle 5 -->
    <circle cx="145" cy="876" r="24" fill="#207448" />
    <text x="145" y="885" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">5</text>
    <!-- Return / slot number icon -->
    <g transform="translate(195, 848)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="8" width="36" height="40" rx="4" />
      <polyline points="20,24 28,16 36,24" />
      <line x1="28" y1="18" x2="28" y2="36" />
    </g>
    <text x="280" y="886" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Returns the slot number, for example 3</text>
  </g>

  <!-- ==================== UNDER STEP 5: DASHED ARROW INTO KERNEL PANEL ==================== -->
  <path d="M 690 980 L 1140 980 L 1140 701 L 1082 701" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />
  <rect x="100" y="956" width="560" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="380" y="989" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Later read and write name only the slot</text>

  <!-- ==================== SIDE NOTE ==================== -->
  <g id="side-note" filter="url(#card-shadow)">
    <rect x="1130" y="358" width="410" height="190" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Shield / protection outline icon -->
    <g transform="translate(1307, 380)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 C 48 34 38 46 28 52 C 18 46 8 34 8 14 Z" />
      <line x1="18" y1="28" x2="38" y2="28" />
    </g>
    <text x="1335" y="468" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1335" dy="0">The program never touches</tspan>
      <tspan x="1335" dy="36">the inode directly.</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM GREEN BAR ==================== -->
  <g id="takeaway-bar">
    <rect x="60" y="1094" width="1480" height="66" rx="14" fill="#207448" />
    <text x="800" y="1136" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each error in this chapter has a place on this path.</text>
  </g>
</svg>