<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>The latency ladder with ratios to a memory read</title>
  <desc>Visual infographic of the latency ladder showing operations from L1 cache to intercontinental network round trip, with times and ratios to a main memory read.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="1040" fill="#f5f8f5" />
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The latency ladder with ratios to a memory read</text>
  <line x1="45" y1="135" x2="45" y2="940" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="70" y="525" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="70" dy="0">Each rung down </tspan>
    <tspan x="70" dy="34">costs more</tspan>
  </text>
  <rect x="1080" y="135" width="480" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="1320" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1320" dy="0">Figures from the 2009 slide: </tspan>
    <tspan x="1320" dy="29">use the order of magnitude </tspan>
    <tspan x="1320" dy="29">and say the year.</tspan>
  </text>
  <rect x="320" y="135" width="710" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(336, 152)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4" />
    <line x1="18" y1="3" x2="18" y2="10" /><line x1="28" y1="3" x2="28" y2="10" /><line x1="38" y1="3" x2="38" y2="10" />
    <line x1="18" y1="46" x2="18" y2="53" /><line x1="28" y1="46" x2="28" y2="53" /><line x1="38" y1="46" x2="38" y2="53" />
    <line x1="3" y1="18" x2="10" y2="18" /><line x1="3" y1="28" x2="10" y2="28" /><line x1="3" y1="38" x2="10" y2="38" />
    <line x1="46" y1="18" x2="53" y2="18" /><line x1="46" y1="28" x2="53" y2="28" /><line x1="46" y1="38" x2="53" y2="38" />
    <rect x="20" y="20" width="16" height="16" rx="2" fill="#207448" />
  </g>
  <text x="410" y="189" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" y="189" font-weight="bold">L1 cache reference: </tspan>
    <tspan x="726" y="189">0.5 ns, ratio 0.005</tspan>
  </text>
  <rect x="320" y="300" width="790" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <path d="M 320 314 A 14 14 0 0 1 334 300 L 342 300 L 342 390 L 334 390 A 14 14 0 0 1 320 376 Z" fill="#207448" />
  <g transform="translate(1040, 318)">
    <rect x="0" y="0" width="54" height="54" rx="10" fill="#207448" />
    <circle cx="27" cy="27" r="14" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="27" cy="27" r="5" fill="#ffffff" />
  </g>
  <g transform="translate(336, 317)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="14" width="44" height="28" rx="3" />
    <rect x="12" y="20" width="8" height="10" rx="1" fill="#207448" />
    <rect x="24" y="20" width="8" height="10" rx="1" fill="#207448" />
    <rect x="36" y="20" width="8" height="10" rx="1" fill="#207448" />
    <line x1="10" y1="42" x2="10" y2="47" /><line x1="16" y1="42" x2="16" y2="47" /><line x1="22" y1="42" x2="22" y2="47" />
    <line x1="28" y1="42" x2="28" y2="47" /><line x1="34" y1="42" x2="34" y2="47" /><line x1="40" y1="42" x2="40" y2="47" /><line x1="46" y1="42" x2="46" y2="47" />
  </g>
  <text x="410" y="354" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" y="354" font-weight="bold">Main memory reference: </tspan>
    <tspan x="768" y="354">100 ns, ratio 1</tspan>
  </text>
  <rect x="320" y="435" width="930" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(336, 452)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="18" r="10" />
    <rect x="8" y="38" width="14" height="12" rx="2" />
    <rect x="34" y="38" width="14" height="12" rx="2" />
    <line x1="28" y1="28" x2="28" y2="34" />
    <line x1="15" y1="34" x2="41" y2="34" />
    <line x1="15" y1="34" x2="15" y2="38" /><line x1="41" y1="34" x2="41" y2="38" />
  </g>
  <text x="410" y="489" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" y="489" font-weight="bold">Send 2K bytes over 1 Gbps network: </tspan>
    <tspan x="936" y="489">20,000 ns, ratio 200</tspan>
  </text>
  <rect x="320" y="570" width="1040" height="90" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  <g transform="translate(336, 587)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="40" height="44" rx="4" />
    <line x1="8" y1="18" x2="48" y2="18" /><line x1="8" y1="30" x2="48" y2="30" /><line x1="8" y1="42" x2="48" y2="42" />
    <circle cx="15" cy="12" r="2" fill="#207448" /><circle cx="15" cy="24" r="2" fill="#207448" /><circle cx="15" cy="36" r="2" fill="#207448" />
  </g>
  <text x="410" y="624" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" y="624" font-weight="bold">Round trip within same datacenter: </tspan>
    <tspan x="952" y="624">500,000 ns, ratio 5,000</tspan>
  </text>
  <rect x="320" y="705" width="1140" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(336, 722)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="14" rx="20" ry="8" />
    <path d="M 8 14 L 8 42 A 20 8 0 0 0 48 42 L 48 14" />
    <path d="M 8 28 A 20 8 0 0 0 48 28" />
  </g>
  <text x="410" y="759" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" y="759" font-weight="bold">Disk seek: </tspan>
    <tspan x="952" y="759">10,000,000 ns, ratio 100,000</tspan>
  </text>
  <rect x="320" y="840" width="1240" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(336, 857)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22" />
    <line x1="6" y1="28" x2="50" y2="28" />
    <ellipse cx="28" cy="28" rx="11" ry="22" />
    <line x1="28" y1="6" x2="28" y2="50" />
  </g>
  <text x="410" y="894" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" y="894" font-weight="bold">Send packet CA to Netherlands and back: </tspan>
    <tspan x="1024" y="894">150,000,000 ns, ratio 1,500,000</tspan>
  </text>
</svg>