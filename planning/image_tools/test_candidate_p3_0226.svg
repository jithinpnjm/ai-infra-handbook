<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Handshake outcomes: a missing SYN-ACK, a reset, or a repeating SYN</title>
  <desc>Visual explanation of TCP handshake outcomes: healthy three-way handshake, connection reset from a closed port, and silence from packet drops with server-side capture diagnostics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Handshake outcomes: a missing SYN-ACK, a reset, or a repeating SYN</text>

  <!-- ==================== LADDER A: Healthy ==================== -->
  <g id="ladder-a">
    <rect x="40" y="100" width="480" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <!-- Shield / Health Icon (56px) -->
    <g transform="translate(65, 118)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 14 V 28 C 50 42 28 50 28 50 C 28 50 6 42 6 28 V 14 Z" />
      <polyline points="18,27 25,34 38,20" />
    </g>
    <text x="135" y="156" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Healthy</text>

    <!-- Client and Server Lifelines -->
    <circle cx="105" cy="205" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="455" cy="205" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <line x1="105" y1="219" x2="105" y2="650" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />
    <line x1="455" y1="219" x2="455" y2="650" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />

    <!-- Arrow 1: SYN with options -->
    <rect x="65" y="235" width="350" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="240" y="267" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="240" dy="0">SYN with options MSS,</tspan>
      <tspan x="240" dy="32">SACK permitted,</tspan>
      <tspan x="240" dy="32">timestamps, window</tspan>
      <tspan x="240" dy="32">scale</tspan>
    </text>
    <line x1="105" y1="395" x2="437" y2="395" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <!-- Arrow 2: SYN-ACK -->
    <line x1="455" y1="490" x2="123" y2="490" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <rect x="175" y="468" width="150" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="250" y="499" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">SYN-ACK</text>

    <!-- Arrow 3: ACK -->
    <line x1="105" y1="580" x2="437" y2="580" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <rect x="195" y="558" width="110" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="250" y="589" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">ACK</text>
  </g>

  <!-- ==================== LADDER B: Reset ==================== -->
  <g id="ladder-b">
    <rect x="560" y="100" width="480" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <!-- Closed Port / Refusal Icon (56px) -->
    <g transform="translate(585, 118)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <line x1="12" y1="28" x2="44" y2="28" />
    </g>
    <text x="655" y="156" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Reset</text>

    <!-- Client and Server Lifelines -->
    <circle cx="625" cy="205" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="975" cy="205" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <line x1="625" y1="219" x2="625" y2="470" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />
    <line x1="975" y1="219" x2="975" y2="470" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />

    <!-- Arrow 4: SYN -->
    <line x1="625" y1="290" x2="957" y2="290" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <rect x="745" y="268" width="110" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="299" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">SYN</text>

    <!-- Arrow 5: RST -->
    <line x1="975" y1="395" x2="643" y2="395" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <rect x="745" y="373" width="110" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="404" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">RST</text>

    <!-- Card: a reset means someone is refusing you -->
    <rect x="600" y="500" width="400" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="542" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">a reset means someone is</tspan>
      <tspan x="800" dy="34">refusing you; usually</tspan>
      <tspan x="800" dy="34">the port is closed</tspan>
    </text>
  </g>

  <!-- ==================== LADDER C: Silence (orange) ==================== -->
  <g id="ladder-c">
    <rect x="1080" y="100" width="480" height="580" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

    <!-- Silence / Sound-off Icon (56px) -->
    <g transform="translate(1105, 118)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6,20 18,20 32,10 32,46 18,36 6,36" />
      <line x1="40" y1="20" x2="52" y2="36" />
      <line x1="52" y1="20" x2="40" y2="36" />
    </g>
    <text x="1175" y="156" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Silence</text>

    <!-- Client and Server Lifelines -->
    <circle cx="1145" cy="205" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1495" cy="205" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <line x1="1145" y1="219" x2="1145" y2="470" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />
    <line x1="1495" y1="219" x2="1495" y2="470" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />

    <!-- Arrow 6: initial SYN -->
    <line x1="1145" y1="275" x2="1477" y2="275" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <!-- Arrow 7: repeated SYN -->
    <line x1="1145" y1="415" x2="1477" y2="415" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <!-- Label for repeating SYN -->
    <rect x="1160" y="295" width="320" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1320" y="327" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">SYN, then the same</tspan>
      <tspan x="1320" dy="30">SYN repeated, each</tspan>
      <tspan x="1320" dy="30">a little later</tspan>
    </text>

    <!-- Card: silence means someone is ignoring you -->
    <rect x="1120" y="500" width="400" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1320" y="542" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">silence means someone is</tspan>
      <tspan x="1320" dy="34">ignoring you: a drop, a</tspan>
      <tspan x="1320" dy="34">block or a missing route</tspan>
    </text>
  </g>

  <!-- ==================== EXTRA STRIP ==================== -->
  <g id="extra-strip">
    <rect x="40" y="710" width="1000" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Middlebox / Filter Icon (56px) -->
    <g transform="translate(65, 745)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="16" x2="48" y2="16" />
      <circle cx="20" cy="16" r="6" fill="#ffffff" />
      <line x1="8" y1="36" x2="48" y2="36" />
      <circle cx="36" cy="36" r="6" fill="#ffffff" />
    </g>
    <rect x="140" y="725" width="875" height="320" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="577" y="800" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="577" dy="0">Options: one SYN with window scale and the other without</tspan>
      <tspan x="577" dy="44">suggests a middlebox stripping options; throughput then</tspan>
      <tspan x="577" dy="44">limited to 64 KB per RTT. Fix belongs to the middlebox,</tspan>
      <tspan x="577" dy="44">not the application</tspan>
    </text>
  </g>

  <!-- ==================== BRANCHING CHECK UNDER C ==================== -->
  <g id="branching-check">
    <rect x="1080" y="710" width="480" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <rect x="1100" y="725" width="440" height="320" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1320" y="774" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">Check the server's</tspan>
      <tspan x="1320" dy="28">capture next: SYN there</tspan>
      <tspan x="1320" dy="28">but no SYN-ACK leaves =</tspan>
      <tspan x="1320" dy="28">the server or a firewall</tspan>
      <tspan x="1320" dy="28">in front of it is</tspan>
      <tspan x="1320" dy="28">ignoring the port;</tspan>
      <tspan x="1320" dy="28">SYN never appears on</tspan>
      <tspan x="1320" dy="28">the server = the path</tspan>
      <tspan x="1320" dy="28">between the two hosts</tspan>
      <tspan x="1320" dy="28">is the suspect</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="1090" width="1520" height="70" rx="14" fill="#207448" />
    <text x="800" y="1134" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Silence means ignored, a reset means refused</text>
  </g>
</svg>