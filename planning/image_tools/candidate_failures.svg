<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Eight early failures and where to look</title>
  <desc>A table of eight early Slurm failures with symptom, likely cause and the first diagnosis step.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Eight early failures and where to look</text>
  <!-- Card 1 -->
  <g id="card-1">
    <rect x="40" y="85" width="740" height="232" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    <g transform="translate(58, 103)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 22 4 L 38 10 V 22 C 38 31 22 38 22 38 C 22 38 6 31 6 22 V 10 Z"/>
        <circle cx="22" cy="18" r="3" fill="#207448"/>
        <line x1="22" y1="21" x2="22" y2="27"/>
      </g>
    <text x="116" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" font-size="30" font-weight="bold" fill="#207448">1 Invalid authentication credential</tspan>
      <tspan x="116" dy="35" font-size="30" font-weight="bold" fill="#207448">or Unable to contact slurm</tspan>
      <tspan x="116" dy="35" font-size="30" font-weight="bold" fill="#207448">controller:</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">different munge keys, clock skew over a</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">few minutes, munged not running, wrong</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">permissions on /etc/munge or /run/munge</tspan>
    </text>
  </g>
  <!-- Card 2 -->
  <g id="card-2">
    <rect x="820" y="85" width="740" height="232" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(838, 103)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="12" width="36" height="20" rx="3"/>
        <line x1="10" y1="32" x2="10" y2="38"/><line x1="16" y1="32" x2="16" y2="38"/><line x1="22" y1="32" x2="22" y2="38"/><line x1="28" y1="32" x2="28" y2="38"/><line x1="34" y1="32" x2="34" y2="38"/>
        <rect x="8" y="16" width="6" height="10" rx="1" fill="#207448"/>
        <rect x="18" y="16" width="6" height="10" rx="1" fill="#207448"/>
        <rect x="28" y="16" width="6" height="10" rx="1" fill="#207448"/>
      </g>
    <text x="896" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" font-size="30" font-weight="bold" fill="#207448">2 Node invalid or drain</tspan>
      <tspan x="896" dy="35" font-size="30" font-weight="bold" fill="#207448">with Low RealMemory:</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">node line does not match what slurmd</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">discovers; run slurmd -C</tspan>
    </text>
  </g>
  <!-- Card 3 -->
  <g id="card-3">
    <rect x="40" y="335" width="740" height="242" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(58, 353)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="22" cy="10" rx="16" ry="6"/>
        <path d="M 6 10 V 34 C 6 38 13 41 22 41 C 31 41 38 38 38 34 V 10"/>
        <path d="M 6 22 C 6 26 13 29 22 29 C 31 29 38 26 38 22"/>
      </g>
    <text x="116" y="375" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" font-size="30" font-weight="bold" fill="#207448">3 Jobs rejected or sacctmgr hangs,</tspan>
      <tspan x="116" dy="35" font-size="30" font-weight="bold" fill="#207448">Invalid account or</tspan>
      <tspan x="116" dy="35" font-size="30" font-weight="bold" fill="#207448">account/partition combination:</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">slurmdbd not running, wrong DB credentials,</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">max_allowed_packet too small, blocked port, no</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">association; follow the request: command to</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">slurmdbd to database to login</tspan>
    </text>
  </g>
  <!-- Card 4 -->
  <g id="card-4">
    <rect x="820" y="335" width="740" height="242" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(838, 353)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="32" height="28" rx="4"/>
        <line x1="6" y1="26" x2="38" y2="26"/>
        <circle cx="31" cy="31" r="2" fill="#207448"/>
        <path d="M 12 18 L 18 18 L 22 14 L 32 14"/>
      </g>
    <text x="896" y="375" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" font-size="30" font-weight="bold" fill="#207448">4 Controller will not start</tspan>
      <tspan x="896" dy="35" font-size="30" font-weight="bold" fill="#207448">or empty queue:</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">StateSaveLocation not writable,</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">full, not shared, wiped</tspan>
    </text>
  </g>
  <!-- Card 5 -->
  <g id="card-5">
    <rect x="40" y="595" width="740" height="222" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(58, 613)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="32" height="34" rx="4"/>
        <line x1="18" y1="6" x2="26" y2="6" stroke-width="4"/>
        <circle cx="22" cy="18" r="5"/>
        <path d="M 13 32 C 13 27 17 26 22 26 C 27 26 31 27 31 32"/>
      </g>
    <text x="116" y="635" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" font-size="30" font-weight="bold" fill="#207448">5 Can't find an address, wrong user,</tspan>
      <tspan x="116" dy="35" font-size="30" font-weight="bold" fill="#207448">Invalid user id:</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">NodeName differs from hostname with no</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">NodeHostname or NodeAddr, DNS or hosts</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">inconsistencies, UID mismatch</tspan>
    </text>
  </g>
  <!-- Card 6 -->
  <g id="card-6">
    <rect x="820" y="595" width="740" height="222" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(838, 613)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="7"/>
        <path d="M 22 5 L 22 10 M 22 34 L 22 39 M 5 22 L 10 22 M 34 22 L 39 22 M 10 10 L 14 14 M 30 30 L 34 34 M 10 34 L 14 30 M 30 14 L 34 10" stroke-width="3.5"/>
      </g>
    <text x="896" y="635" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" font-size="30" font-weight="bold" fill="#207448">6 slurmd will not start</tspan>
      <tspan x="896" dy="35" font-size="30" font-weight="bold" fill="#207448">after an OS upgrade:</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">OS switched to cgroup v2 while Slurm built without</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">v2, cgroup.conf forces v1, missing systemd</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">delegation; stat -fc %T /sys/fs/cgroup</tspan>
    </text>
  </g>
  <!-- Card 7 -->
  <g id="card-7">
    <rect x="40" y="835" width="740" height="252" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(58, 853)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="17"/>
        <polyline points="22,12 22,22 30,22"/>
        <line x1="22" y1="2" x2="22" y2="5"/>
      </g>
    <text x="116" y="875" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" font-size="30" font-weight="bold" fill="#207448">7 Socket timed out on</tspan>
      <tspan x="116" dy="35" font-size="30" font-weight="bold" fill="#207448">send/recv operation:</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">polling loops from hundreds of clients running</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">squeue every second, too small MaxJobCount,</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">accounting back-pressure; run sdiag, look at RPC</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">statistics by type and by user; use sacct for</tspan>
      <tspan x="116" dy="31" font-size="24" font-weight="normal" fill="#303a36">history, exporters that poll once, RPC rate limiting</tspan>
    </text>
  </g>
  <!-- Card 8 -->
  <g id="card-8">
    <rect x="820" y="835" width="740" height="252" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(838, 853)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="22" cy="9" rx="14" ry="5"/>
        <path d="M 8 9 V 23 C 8 26 14 28 22 28 C 30 28 36 26 36 23 V 9"/>
        <rect x="17" y="24" width="16" height="13" rx="2" fill="#e8f1ea"/>
        <path d="M 21 24 V 20 C 21 17 29 17 29 20 V 24"/>
      </g>
    <text x="896" y="875" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" font-size="30" font-weight="bold" fill="#207448">8 squeue and sinfo time out</tspan>
      <tspan x="896" dy="35" font-size="30" font-weight="bold" fill="#207448">but running jobs continue:</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">accounting database under strain, very wide sacct</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">or sreport query; sdiag thread count and agent</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">queue, slurmdbd.log lock waits,</tspan>
      <tspan x="896" dy="31" font-size="24" font-weight="normal" fill="#303a36">SHOW FULL PROCESSLIST in the database</tspan>
    </text>
  </g>
  <!-- Takeaway bar -->
  <g id="takeaway-bar">
    <rect x="40" y="1105" width="1520" height="70" rx="14" fill="#207448"/>
    <text x="800" y="1149" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">read the first error, not the last</text>
  </g>
</svg>