<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The life of a job</title>
  <desc>Sequence diagram illustrating the lifecycle of a Slurm batch job from submission to completion across login node, controller, database daemon, and compute nodes.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-left" viewBox="0 0 18 18" refX="2" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 16 3 L 2 9 L 16 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange-left" viewBox="0 0 18 18" refX="2" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 16 3 L 2 9 L 16 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The life of a job</text>
  <g id="participant-U">
    <rect x="50" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(158, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="44" height="28" rx="4"/>
      <path d="M 22 28 v 8 M 12 36 h 20"/>
      <path d="M 7 10 l 6 4 -6 4 M 19 18 h 10"/>
    </g>
    <text x="180" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="180" dy="0">User on</tspan><tspan x="180" dy="30"> login node</tspan></text>
  </g>
  <g id="participant-C">
    <rect x="360" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(470, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="18" r="9"/>
      <path d="M 20 2 v 5 M 20 29 v 5 M 4 18 h 5 M 31 18 h 5 M 8 7 l 4 4 M 28 27 l 4 4 M 8 29 l 4 -4 M 28 9 l 4 -4"/>
    </g>
    <text x="490" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">slurmctld</text>
  </g>
  <g id="participant-DBD">
    <rect x="670" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(781, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="19" cy="8" rx="18" ry="6"/>
      <path d="M 1 8 v 20 c 0 3.5 8 6 18 6 s 18 -2.5 18 -6 v -20"/>
      <path d="M 1 18 c 0 3.5 8 6 18 6 s 18 -2.5 18 -6"/>
    </g>
    <text x="800" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">slurmdbd</text>
  </g>
  <g id="participant-D1">
    <rect x="980" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1090, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="28" height="28" rx="4"/>
      <rect x="13" y="11" width="14" height="14" rx="2"/>
      <path d="M 14 0 v 4 M 26 0 v 4 M 14 32 v 4 M 26 32 v 4 M 2 13 h 4 M 2 23 h 4 M 34 13 h 4 M 34 23 h 4"/>
    </g>
    <text x="1110" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="1110" dy="0">slurmd on</tspan><tspan x="1110" dy="30"> node A</tspan></text>
  </g>
  <g id="participant-D2">
    <rect x="1290" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1400, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="28" height="28" rx="4"/>
      <rect x="13" y="11" width="14" height="14" rx="2"/>
      <path d="M 14 0 v 4 M 26 0 v 4 M 14 32 v 4 M 26 32 v 4 M 2 13 h 4 M 2 23 h 4 M 34 13 h 4 M 34 23 h 4"/>
    </g>
    <text x="1420" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="1420" dy="0">slurmd on</tspan><tspan x="1420" dy="30"> node B</tspan></text>
  </g>
  <line x1="180" y1="185" x2="180" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="490" y1="185" x2="490" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="800" y1="185" x2="800" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1110" y1="185" x2="1110" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1420" y1="185" x2="1420" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <!-- Step 1 -->
  <g id="step-1">
    <circle cx="180" cy="230" r="24" fill="#207448" />
    <text x="180" y="238" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <line x1="204" y1="230" x2="490" y2="230" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="214" y="194" width="640" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="234" y="218" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">sbatch job.sh</tspan><tspan font-family="sans-serif"> (RPC with munge credential)</tspan></text>
  </g>
  <!-- Step 2 -->
  <g id="step-2">
    <circle cx="490" cy="296" r="24" fill="#207448" />
    <text x="490" y="304" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <path d="M 514 296 H 545 V 324 H 490" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="545" y="280" width="1010" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="565" y="305" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="sans-serif">authenticate, run </tspan><tspan font-family="monospace">job_submit</tspan><tspan font-family="sans-serif"> plugin, check limits and associations</tspan></text>
  </g>
  <!-- Step 3 -->
  <g id="step-3">
    <circle cx="490" cy="366" r="24" fill="#207448" />
    <text x="490" y="374" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <line x1="466" y1="366" x2="180" y2="366" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green-left)" />
    <rect x="200" y="316" width="255" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="327.5" y="335" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="327.5" dy="0" text-anchor="middle" font-family="sans-serif">Submitted batch</tspan>
      <tspan x="327.5" dy="22" text-anchor="middle" font-family="sans-serif">job 4217</tspan>
    </text>
  </g>
  <!-- Step 4 -->
  <g id="step-4">
    <circle cx="490" cy="432" r="24" fill="#207448" />
    <text x="490" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <path d="M 514 432 H 545 V 460 H 490" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="555" y="416" width="920" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="575" y="441" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">job PENDING in queue, scheduler loop and backfill evaluate it</text>
  </g>
  <!-- Step 5 -->
  <g id="step-5">
    <circle cx="490" cy="498" r="24" fill="#db8129" />
    <text x="490" y="506" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <path d="M 514 498 H 545 V 526 H 490" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange-left)" />
    <rect x="555" y="482" width="850" height="34" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="575" y="507" text-anchor="start" font-family="sans-serif" font-weight="bold" font-size="24" fill="#303a36">resources found: allocate nodes A and B, state RUNNING</text>
  </g>
  <!-- Step 6 -->
  <g id="step-6">
    <circle cx="490" cy="564" r="24" fill="#207448" />
    <text x="490" y="572" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <line x1="514" y1="564" x2="1110" y2="564" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="525" y="530" width="570" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="810" y="554" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">launch batch step (RPC tree fan-out)</text>
  </g>
  <!-- Step 7 -->
  <g id="step-7">
    <circle cx="490" cy="630" r="24" fill="#207448" />
    <text x="490" y="638" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
    <line x1="514" y1="630" x2="1420" y2="630" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="525" y="596" width="360" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="705" y="620" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">prepare node (prolog)</text>
  </g>
  <!-- Step 8 -->
  <g id="step-8">
    <circle cx="1110" cy="696" r="24" fill="#207448" />
    <text x="1110" y="704" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
    <path d="M 1086 696 H 1055 V 724 H 1110" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="335" y="680" width="705" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="355" y="705" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="sans-serif">prolog, fork </tspan><tspan font-family="monospace">slurmstepd,</tspan><tspan font-family="sans-serif"> run the batch script</tspan></text>
  </g>
  <!-- Step 9 -->
  <g id="step-9">
    <circle cx="1110" cy="762" r="24" fill="#207448" />
    <text x="1110" y="770" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">9</text>
    <line x1="1134" y1="762" x2="1420" y2="762" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="365" y="746" width="710" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="385" y="770" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="sans-serif">script runs </tspan><tspan font-family="monospace">srun,</tspan><tspan font-family="sans-serif"> steps launched on both nodes</tspan></text>
  </g>
  <!-- Step 10 -->
  <g id="step-10">
    <circle cx="1110" cy="828" r="24" fill="#207448" />
    <text x="1110" y="836" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">10</text>
    <path d="M 1086 828 H 1055 V 856 H 1110" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="590" y="812" width="450" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="815" y="837" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">epilog, cleanup of processes</text>
  </g>
  <!-- Step 11 -->
  <g id="step-11">
    <circle cx="1420" cy="894" r="24" fill="#207448" />
    <text x="1420" y="902" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">11</text>
    <path d="M 1396 894 H 1365 V 922 H 1420" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="900" y="878" width="450" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1125" y="903" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">epilog, cleanup of processes</text>
  </g>
  <!-- Step 12 -->
  <g id="step-12">
    <circle cx="1110" cy="960" r="24" fill="#207448" />
    <text x="1110" y="968" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">12</text>
    <line x1="1086" y1="960" x2="490" y2="960" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="650" y="926" width="280" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="790" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job complete RPC</text>
  </g>
  <!-- Step 13 -->
  <g id="step-13">
    <circle cx="490" cy="1026" r="24" fill="#207448" />
    <text x="490" y="1034" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">13</text>
    <line x1="514" y1="1026" x2="800" y2="1026" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="515" y="992" width="720" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="875" y="1016" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job record: times, resources, exit code, usage</text>
  </g>
  <!-- Step 14 -->
  <g id="step-14">
    <circle cx="490" cy="1092" r="24" fill="#207448" />
    <text x="490" y="1100" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">14</text>
    <path d="M 514 1092 H 545 V 1120 H 490" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="555" y="1076" width="610" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="575" y="1101" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">free nodes A and B, run scheduler again</text>
  </g>
</svg>