<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The Kubernetes Service path: seven checks in order</title>
  <desc>A vertical ladder of seven numbered rungs from top to bottom showing diagnostic checks for a failing Kubernetes Service.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="74" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">When a Service fails, confirm in order</text>

  <!-- Down the left side a thin arrow -->
  <line x1="50" y1="124" x2="50" y2="1064" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="68" y="580" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="68" dy="0">read</tspan>
    <tspan x="68" dy="28">top to</tspan>
    <tspan x="68" dy="28">bottom</tspan>
  </text>

  <!-- ==================== RUNG 1: Pod ==================== -->
  <g id="rung-1">
    <rect x="175" y="124" width="975" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 1 -->
    <circle cx="215" cy="172" r="24" fill="#207448" />
    <text x="215" y="180" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <!-- Pod Outline Icon (56x56) -->
    <g transform="translate(250, 144)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 50,18 50,42 28,54 6,42 6,18" />
      <line x1="28" y1="6" x2="28" y2="30" />
      <line x1="6" y1="18" x2="28" y2="30" />
      <line x1="50" y1="18" x2="28" y2="30" />
      <line x1="28" y1="30" x2="28" y2="54" />
    </g>
    <!-- Text -->
    <text x="325" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pod</text>
    <text x="325" y="198" font-family="monospace" font-size="24" fill="#303a36">call the pod IP and pod port directly from another pod</text>
  </g>

  <!-- ==================== RIGHT SIDE: Small Box Note ==================== -->
  <g id="small-box">
    <rect x="1190" y="124" width="370" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1215" y="168" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1215" dy="0">the first failing rung</tspan>
      <tspan x="1215" dy="28">is where to look</tspan>
    </text>
  </g>

  <!-- ==================== RUNG 2: Service ==================== -->
  <g id="rung-2">
    <rect x="175" y="260" width="1385" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 2 -->
    <circle cx="215" cy="308" r="24" fill="#207448" />
    <text x="215" y="316" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <!-- Service Gear Outline Icon (56x56) -->
    <g transform="translate(250, 280)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" stroke-width="4" />
    </g>
    <!-- Text -->
    <text x="325" y="304" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Service</text>
    <text x="325" y="334" font-family="monospace" font-size="24" fill="#303a36">the Service exists, otherwise lookup fails with Name or service not known</text>
  </g>

  <!-- ==================== RUNG 3: DNS ==================== -->
  <g id="rung-3">
    <rect x="175" y="396" width="1385" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 3 -->
    <circle cx="215" cy="444" r="24" fill="#207448" />
    <text x="215" y="452" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <!-- DNS Globe Outline Icon (56x56) -->
    <g transform="translate(250, 416)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <ellipse cx="28" cy="28" rx="10" ry="22" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    <!-- Text -->
    <text x="325" y="440" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">DNS</text>
    <text x="325" y="470" font-family="monospace" font-size="24" fill="#303a36">short, namespaced and full names resolve</text>
  </g>

  <!-- ==================== RUNG 4: Endpoints ==================== -->
  <g id="rung-4">
    <rect x="175" y="532" width="765" height="124" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 4 -->
    <circle cx="215" cy="594" r="24" fill="#207448" />
    <text x="215" y="602" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <!-- Endpoints Nodes Outline Icon (56x56) -->
    <g transform="translate(250, 566)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="6" />
      <circle cx="40" cy="16" r="6" />
      <circle cx="28" cy="42" r="6" />
      <line x1="16" y1="16" x2="28" y2="42" />
      <line x1="40" y1="16" x2="28" y2="42" />
      <line x1="16" y1="16" x2="40" y2="16" />
    </g>
    <!-- Text -->
    <text x="325" y="576" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Endpoints</text>
    <text x="325" y="606" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="325" dy="0">kubectl get endpointslices</tspan>
      <tspan x="325" dy="28">-l kubernetes.io/service-name=hostnames</tspan>
    </text>
  </g>

  <!-- ==================== ORANGE CALLOUT BESIDE RUNG 4 ==================== -->
  <!-- Single most important item highlighted in orange #db8129 -->
  <g id="orange-callout">
    <rect x="980" y="532" width="580" height="124" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <text x="1010" y="576" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1010" dy="0" font-weight="bold" fill="#db8129">ENDPOINTS shows none means</tspan>
      <tspan x="1010" dy="28">the Service selector does not</tspan>
      <tspan x="1010" dy="28">match pod labels</tspan>
    </text>
  </g>

  <!-- ==================== RUNG 5: Ports ==================== -->
  <g id="rung-5">
    <rect x="175" y="696" width="1385" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 5 -->
    <circle cx="215" cy="744" r="24" fill="#207448" />
    <text x="215" y="752" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <!-- Ports Plug Outline Icon (56x56) -->
    <g transform="translate(250, 716)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6" />
      <path d="M 18 10 L 18 24 L 24 24 L 24 38 L 32 38 L 32 24 L 38 24 L 38 10" />
    </g>
    <!-- Text -->
    <text x="325" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ports</text>
    <text x="325" y="770" font-family="monospace" font-size="24" fill="#303a36">Service port listed, targetPort correct, named port matched</text>
  </g>

  <!-- ==================== RUNG 6: kube-proxy rules ==================== -->
  <g id="rung-6">
    <rect x="175" y="832" width="1385" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 6 -->
    <circle cx="215" cy="880" r="24" fill="#207448" />
    <text x="215" y="888" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <!-- Shield / Rules Outline Icon (56x56) -->
    <g transform="translate(250, 852)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 L 8 14 Z" />
      <line x1="18" y1="26" x2="38" y2="26" />
      <line x1="28" y1="18" x2="28" y2="36" />
    </g>
    <!-- Text -->
    <text x="325" y="876" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">kube-proxy rules</text>
    <text x="325" y="906" font-family="monospace" font-size="24" fill="#303a36">iptables-save grep hostnames, or ipvsadm -ln</text>
  </g>

  <!-- ==================== RUNG 7: Conntrack ==================== -->
  <g id="rung-7">
    <rect x="175" y="968" width="1385" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Number circle 7 -->
    <circle cx="215" cy="1016" r="24" fill="#207448" />
    <text x="215" y="1024" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
    <!-- Conntrack Table Outline Icon (56x56) -->
    <g transform="translate(250, 988)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" />
      <line x1="8" y1="20" x2="48" y2="20" />
      <line x1="8" y1="32" x2="48" y2="32" />
      <circle cx="15" cy="14" r="2" fill="#207448" />
      <circle cx="15" cy="26" r="2" fill="#207448" />
      <circle cx="15" cy="38" r="2" fill="#207448" />
    </g>
    <!-- Text -->
    <text x="325" y="1012" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Conntrack</text>
    <text x="325" y="1042" font-family="monospace" font-size="24" fill="#303a36">table usage, since iptables Service load balancing depends on connection tracking</text>
  </g>

  <!-- ==================== TAKEAWAY BAR ==================== -->
  <rect x="40" y="1104" width="1520" height="56" rx="12" fill="#207448" />
  <text x="800" y="1140" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Pod, Service, DNS, endpoints, ports, kube-proxy rules, then conntrack</text>
</svg>