<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Collection traps: shared inner lists, mutating while iterating, and slow membership</title>
  <desc>Visual infographic explaining Python collection traps: shared inner lists in nested lists, dict.fromkeys sharing one list, mutating collections while iterating, slow linear list membership, collection operation costs, hashable key rules, and type performance trade-offs.</desc>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Collection traps: shared inner lists,</tspan>
    <tspan x="800" dy="56">mutating while iterating, and slow membership</tspan>
  </text>

  <!-- ======================================================== -->
  <!-- TOP ROW: Panel 1 (left) and Panel 2 (right)              -->
  <!-- ======================================================== -->

  <!-- Panel 1: grid = [[0] * 3] * 3 -->
  <g id="panel-1">
    <rect x="40" y="145" width="740" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <!-- Grid outline icon (56px, stroke 4) -->
    <g transform="translate(65, 162)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="48" height="48" rx="6" />
      <line x1="18" y1="2" x2="18" y2="50" stroke-width="3" />
      <line x1="34" y1="2" x2="34" y2="50" stroke-width="3" />
      <line x1="2" y1="18" x2="50" y2="18" stroke-width="3" />
      <line x1="2" y1="34" x2="50" y2="34" stroke-width="3" />
    </g>

    <!-- Title: grid = [[0] * 3] * 3 -->
    <text x="135" y="196" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">grid = [[0] * 3] * 3</text>

    <!-- Problem card (orange #db8129 highlight - single most important item) -->
    <rect x="60" y="226" width="700" height="64" rx="8" fill="#fff9f3" stroke="#db8129" stroke-width="2.5" />
    <text x="78" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="78" dy="0">three references to the same inner list,</tspan>
      <tspan x="78" dy="28">so changing one row changes all</tspan>
    </text>

    <!-- Fix card -->
    <rect x="60" y="300" width="700" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="78" y="332" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">[[0] * 3 for _ in range(3)]</text>
  </g>

  <!-- Panel 2: d = dict.fromkeys(keys, []) -->
  <g id="panel-2">
    <rect x="820" y="145" width="740" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Key outline icon (56px, stroke 4) -->
    <g transform="translate(845, 162)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="26" r="12" />
      <line x1="28" y1="26" x2="48" y2="26" />
      <line x1="40" y1="26" x2="40" y2="34" />
      <line x1="48" y1="26" x2="48" y2="34" />
    </g>

    <!-- Title: d = dict.fromkeys(keys, []) -->
    <text x="915" y="196" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">d = dict.fromkeys(keys, [])</text>

    <!-- Problem card -->
    <rect x="840" y="226" width="700" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="858" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">one list shared across all keys</text>

    <!-- Fix card -->
    <rect x="840" y="282" width="700" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="858" y="309" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="858" dy="0">fix with a comprehension</tspan>
      <tspan x="858" dy="28">that makes a new list per key</tspan>
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM ROW: Panel 3 (left) and Panel 4 (right)           -->
  <!-- ======================================================== -->

  <!-- Panel 3: for x in lst: lst.remove(x) -->
  <g id="panel-3">
    <rect x="40" y="400" width="740" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Loop/cycle outline icon (56px, stroke 4) -->
    <g transform="translate(65, 417)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 26 8 A 18 18 0 1 1 10 32" />
      <polyline points="26,2 26,10 34,10" />
      <line x1="20" y1="26" x2="32" y2="26" stroke-width="3" />
    </g>

    <!-- Title: for x in lst: lst.remove(x) -->
    <text x="135" y="451" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">for x in lst: lst.remove(x)</text>

    <!-- Skips elements card -->
    <rect x="60" y="470" width="700" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="78" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">skips elements</text>

    <!-- Dict RuntimeError card -->
    <rect x="60" y="518" width="700" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="78" y="543" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="78" dy="0">mutating a dict's size during iteration</tspan>
      <tspan x="78" dy="26">raises RuntimeError</tspan>
    </text>

    <!-- Fix card -->
    <rect x="60" y="584" width="700" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="78" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">iterate over a copy or build a new collection</text>
  </g>

  <!-- Panel 4: x in list on large data -->
  <g id="panel-4">
    <rect x="820" y="400" width="740" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Search/gauge outline icon (56px, stroke 4) -->
    <g transform="translate(845, 417)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="15" />
      <line x1="31" y1="31" x2="47" y2="47" />
      <polyline points="14,20 20,20 24,15" stroke-width="3" />
    </g>

    <!-- Title: x in list on large data -->
    <text x="915" y="451" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">x in list on large data</text>

    <!-- Linear card -->
    <rect x="840" y="470" width="700" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="858" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">linear</text>

    <!-- Recommendation card -->
    <rect x="840" y="518" width="700" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="858" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="858" dy="0">use sets or dicts for repeated in checks;</tspan>
      <tspan x="858" dy="34">set and dict lookup O(1) average</tspan>
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- COST TABLE: 6 collection types                           -->
  <!-- ======================================================== -->
  <g id="cost-table">
    <rect x="40" y="675" width="1520" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Table row 1: list -->
    <rect x="58" y="688" width="1484" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="714" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">list: index O(1), append amortised O(1), insert or delete at front O(n), in O(n)</text>

    <!-- Table row 2: tuple -->
    <rect x="58" y="730" width="1484" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">tuple: index O(1), hashable if elements are</text>

    <!-- Table row 3: dict -->
    <rect x="58" y="772" width="1484" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="798" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">dict: lookup and insert O(1) average, insertion-ordered since 3.7, keys must be hashable</text>

    <!-- Table row 4: set -->
    <rect x="58" y="814" width="1484" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="840" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">set: in O(1) average, empty is set()</text>

    <!-- Table row 5: frozenset -->
    <rect x="58" y="856" width="1484" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">frozenset: immutable set</text>

    <!-- Table row 6: deque -->
    <rect x="58" y="898" width="1484" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="924" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">deque: O(1) at both ends</text>
  </g>

  <!-- ======================================================== -->
  <!-- MINI RULE: Hashable keys                                 -->
  <!-- ======================================================== -->
  <g id="mini-rule">
    <rect x="40" y="985" width="1520" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Lock / shield outline icon (stroke 4) -->
    <g transform="translate(60, 997)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="20" width="38" height="28" rx="6" />
      <path d="M 12 20 V 12 A 11 11 0 0 1 34 12 V 20" />
      <circle cx="23" cy="32" r="3" fill="#207448" />
    </g>

    <text x="125" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0">dict keys must be hashable: strings, numbers, tuples of hashables,</tspan>
      <tspan x="125" dy="29">frozensets; lists and dicts cannot be keys</tspan>
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM TAKEAWAY BAR                                      -->
  <!-- ======================================================== -->
  <g id="bottom-bar">
    <rect x="40" y="1100" width="1520" height="64" rx="14" fill="#207448" />
    <text x="800" y="1141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">The type you pick sets how fast the script runs and which bugs it carries</text>
  </g>
</svg>