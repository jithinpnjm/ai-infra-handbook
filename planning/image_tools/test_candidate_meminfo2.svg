<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
  <title>Where did my RAM go: reading free and /proc/meminfo</title>
  <desc>Visual explanation of Linux free command output, MemAvailable, and RAM breakdown from /proc/meminfo.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="88" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Where did my RAM go:</tspan>
    <tspan x="800" dy="54">reading free and /proc/meminfo</tspan>
  </text>
  <!-- Terminal output box -->
  <rect x="40" y="175" width="1520" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="65" cy="197" r="6" fill="#207448" opacity="0.3"/>
  <circle cx="85" cy="197" r="6" fill="#207448" opacity="0.3"/>
  <circle cx="105" cy="197" r="6" fill="#207448" opacity="0.3"/>
  <text x="135" y="218" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" xml:space="preserve">total 1.9Ti  used 120Gi  free 40Gi  shared 1.2Gi  buff/cache 1.7Ti  available 1.7Ti</text>
  <text x="135" y="250" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">0B 0B 0B</text>
  <!-- Card: free -->
  <rect x="40" y="300" width="680" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 368)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24"/>
    <line x1="28" y1="28" x2="28" y2="14"/>
    <line x1="28" y1="28" x2="38" y2="28"/>
  </g>
  <text x="150" y="372" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">free</text>
  <text x="150" y="428" font-family="sans-serif" font-size="24" fill="#303a36">idle memory, deliberately small</text>
  <!-- Card: available -->
  <rect x="760" y="300" width="800" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(788, 368)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="4"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <circle cx="12" cy="12" r="2" fill="#207448"/>
    <circle cx="18" cy="12" r="2" fill="#207448"/>
  </g>
  <rect x="865" y="318" width="202" height="61" rx="20" fill="none" stroke="#db8129" stroke-width="3"/>
  <text x="885" y="358" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">available</text>
  <text x="866" y="416" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="866" dy="0">MemAvailable: how much you can use to start</tspan>
    <tspan x="866" dy="28">new applications without swapping; counts</tspan>
    <tspan x="866" dy="28">reclaimable page cache and slab</tspan>
  </text>
  <!-- Stacked Bar of RAM Container -->
  <rect x="40" y="530" width="990" height="530" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="54" y="538" width="962" height="81" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 54 548 A 10 10 0 0 1 64 538 L 74 538 L 74 619 L 64 619 A 10 10 0 0 1 54 609 Z" fill="#207448"/>
<g transform="translate(88, 550)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="28,8 48,18 28,28 8,18"/>
              <polyline points="8,26 28,36 48,26"/>
              <polyline points="8,34 28,44 48,34"/>
            </g>
  <text x="164" y="587" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">AnonPages: process private heap and stack</text>
  <rect x="54" y="624" width="962" height="81" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 54 634 A 10 10 0 0 1 64 624 L 74 624 L 74 705 L 64 705 A 10 10 0 0 1 54 695 Z" fill="#207448"/>
<g transform="translate(88, 636)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="28" cy="14" rx="20" ry="8"/>
              <path d="M8,14 v22 c0,4.4 9,8 20,8 s20,-3.6 20,-8 v-22"/>
              <path d="M8,25 c0,4.4 9,8 20,8 s20,-3.6 20,-8"/>
            </g>
  <text x="164" y="659" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="164" dy="0">Cached: page cache, including mapped files</tspan>
    <tspan x="164" dy="26">and tmpfs through Shmem</tspan>
  </text>
  <rect x="54" y="710" width="962" height="81" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 54 720 A 10 10 0 0 1 64 710 L 74 710 L 74 791 L 64 791 A 10 10 0 0 1 54 781 Z" fill="#207448"/>
<g transform="translate(88, 722)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="28" cy="28" r="10"/>
              <path d="M28,6 v6 M28,44 v6 M6,28 h6 M44,28 h6 M12,12 l5,5 M39,39 l5,5 M12,44 l5,-5 M39,17 l5,-5"/>
            </g>
  <text x="164" y="759" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Slab = SReclaimable (can be freed) + SUnreclaim (cannot)</text>
  <rect x="54" y="796" width="962" height="81" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 54 806 A 10 10 0 0 1 64 796 L 74 796 L 74 877 L 64 877 A 10 10 0 0 1 54 867 Z" fill="#207448"/>
<g transform="translate(88, 808)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="12" y="12" width="32" height="32" rx="4"/>
              <line x1="20" y1="4" x2="20" y2="12"/><line x1="28" y1="4" x2="28" y2="12"/><line x1="36" y1="4" x2="36" y2="12"/>
              <line x1="20" y1="44" x2="20" y2="52"/><line x1="28" y1="44" x2="28" y2="52"/><line x1="36" y1="44" x2="36" y2="52"/>
              <line x1="4" y1="20" x2="12" y2="20"/><line x1="4" y1="28" x2="12" y2="28"/><line x1="4" y1="36" x2="12" y2="36"/>
              <line x1="44" y1="20" x2="52" y2="20"/><line x1="44" y1="28" x2="52" y2="28"/><line x1="44" y1="36" x2="52" y2="36"/>
            </g>
  <text x="164" y="845" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">PageTables and KernelStack: kernel overhead</text>
  <rect x="54" y="882" width="962" height="81" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 54 892 A 10 10 0 0 1 64 882 L 74 882 L 74 963 L 64 963 A 10 10 0 0 1 54 953 Z" fill="#207448"/>
<g transform="translate(88, 894)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="8" width="40" height="40" rx="4"/>
              <line x1="8" y1="28" x2="48" y2="28"/>
              <line x1="28" y1="8" x2="28" y2="48"/>
            </g>
  <text x="164" y="917" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="164" dy="0">HugePages_*: explicitly reserved,</tspan>
    <tspan x="164" dy="26">ordinary allocation cannot use it</tspan>
  </text>
  <rect x="54" y="968" width="962" height="81" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 54 978 A 10 10 0 0 1 64 968 L 74 968 L 74 1049 L 64 1049 A 10 10 0 0 1 54 1039 Z" fill="#207448"/>
<g transform="translate(88, 980)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="10" y="22" width="36" height="26" rx="4"/>
              <path d="M18,22 v-8 a10,10 0 0,1 20,0 v8"/>
              <circle cx="28" cy="35" r="3" fill="#207448"/>
            </g>
  <text x="164" y="1017" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Mlocked and Unevictable: reclaim cannot touch</text>
  <!-- Side Box -->
  <rect x="1070" y="530" width="490" height="530" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1287, 680)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28,6 L48,16 V32 C48,44 28,52 28,52 C28,52 8,44 8,32 V16 Z"/>
    <line x1="28" y1="20" x2="28" y2="34"/>
    <circle cx="28" cy="40" r="2" fill="#207448"/>
  </g>
  <text x="1315" y="785" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1315" dy="0">In buff/cache, shared and</tspan>
    <tspan x="1315" dy="36">tmpfs pages and mlocked</tspan>
    <tspan x="1315" dy="36">pages are not reclaimable</tspan>
  </text>
  <!-- Bottom Takeaway Bar -->
  <rect x="40" y="1095" width="1520" height="65" rx="12" fill="#207448"/>
  <text x="800" y="1136" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Read available, not free</text>
</svg>