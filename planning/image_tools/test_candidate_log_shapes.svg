<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Three log shapes worth recognising</title>
  <desc>Visual infographic explaining three critical Slurm log shapes: node flapping, job killed for memory, and invalid RPC after an upgrade.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three log shapes worth recognising</text>

  <!-- ==================== CARD 1: Node flapping ==================== -->
  <g id="card-1">
    <rect x="50" y="115" width="460" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <!-- Icon: Server node with signal pulse -->
    <g transform="translate(74, 140)">
      <rect x="4" y="6" width="48" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="14" cy="16" r="3" fill="#207448"/>
      <line x1="24" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 6 36 L 16 36 L 22 28 L 30 44 L 38 36 L 50 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Title 1 -->
    <text x="144" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Node flapping</text>
    <line x1="74" y1="210" x2="486" y2="210" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Log Snippets Container -->
    <rect x="74" y="230" width="412" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    <!-- Log Line 1 Container -->
    <rect x="88" y="242" width="384" height="102" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
    <text x="110" y="272" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="110" dy="0">slurmctld: error:</tspan>
      <tspan x="110" dy="28">Nodes dgx-h100-14</tspan>
      <tspan x="110" dy="28">not responding</tspan>
    </text>

    <!-- Alternating arrows between Line 1 and Line 2 -->
    <path d="M 225 347 L 225 371" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M 335 373 L 335 349" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

    <!-- Log Line 2 Container -->
    <rect x="88" y="376" width="384" height="108" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
    <text x="110" y="405" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="110" dy="0">slurmctld: Node</tspan>
      <tspan x="110" dy="28">dgx-h100-14 now</tspan>
      <tspan x="110" dy="28">responding</tspan>
    </text>

    <!-- Cause Container -->
    <rect x="74" y="515" width="412" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="98" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="98" dy="0">rarely Slurm: packets</tspan>
      <tspan x="98" dy="34">dropped on the management</tspan>
      <tspan x="98" dy="34">network, or the node so</tspan>
      <tspan x="98" dy="34">loaded that slurmd cannot</tspan>
      <tspan x="98" dy="34">answer the ping in time</tspan>
    </text>

    <!-- Action Container -->
    <rect x="74" y="750" width="412" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="98" y="788" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="98" dy="0">investigate the network</tspan>
      <tspan x="98" dy="32">and node CPU and I/O load</tspan>
      <tspan x="98" dy="32">before touching Slurm</tspan>
      <tspan x="98" dy="32">settings; changing a</tspan>
      <tspan x="98" dy="32">timeout to hide a</tspan>
      <tspan x="98" dy="32">flapping node hides the</tspan>
      <tspan x="98" dy="32">fault</tspan>
    </text>
  </g>

  <!-- ==================== CARD 2: Job killed for memory ==================== -->
  <g id="card-2">
    <rect x="570" y="115" width="460" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <!-- Icon: Memory chip module -->
    <g transform="translate(594, 140)">
      <rect x="4" y="10" width="48" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="10" y="16" width="8" height="14" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
      <rect x="24" y="16" width="8" height="14" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
      <rect x="38" y="16" width="8" height="14" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
      <line x1="8" y1="42" x2="14" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="42" x2="26" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="42" x2="38" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="44" y1="42" x2="48" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Title 2 -->
    <text x="664" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="664" dy="0">Job killed for</tspan>
      <tspan x="664" dy="36">memory</tspan>
    </text>
    <line x1="594" y1="210" x2="1006" y2="210" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Log Symptom Container -->
    <rect x="594" y="230" width="412" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="618" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="618" dy="0">slurmd log shows a step</tspan>
      <tspan x="618" dy="34">dying with signal 9 and a</tspan>
      <tspan x="618" dy="34">memory-limit message for</tspan>
      <tspan x="618" dy="34">the job's cgroup</tspan>
    </text>

    <!-- Cause & Explanation Container -->
    <rect x="594" y="515" width="412" height="480" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="618" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="618" dy="0">user asked for less</tspan>
      <tspan x="618" dy="34">memory than the job used;</tspan>
      <tspan x="618" dy="34">the kernel out-of-memory</tspan>
      <tspan x="618" dy="34">killer acting at the</tspan>
      <tspan x="618" dy="34">cgroup limit ended the</tspan>
      <tspan x="618" dy="34">job</tspan>
    </text>

    <!-- Visual cgroup limit diagram -->
    <g transform="translate(630, 780)">
      <rect x="0" y="0" width="340" height="185" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <!-- Memory bar total -->
      <rect x="25" y="45" width="290" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <!-- Requested limit fill -->
      <rect x="25" y="45" width="180" height="34" rx="4" fill="#207448" fill-opacity="0.3"/>
      <!-- Cgroup limit line -->
      <line x1="205" y1="30" x2="205" y2="95" stroke="#207448" stroke-width="3.5" stroke-dasharray="6 4"/>
      <!-- Process usage overshooting limit -->
      <path d="M 25 135 L 260 135" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="260" cy="135" r="8" fill="#207448"/>
      <!-- Kill indicator -->
      <line x1="252" y1="127" x2="268" y2="143" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="268" y1="127" x2="252" y2="143" stroke="#ffffff" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ==================== CARD 3: Invalid RPC after an upgrade ==================== -->
  <g id="card-3">
    <rect x="1090" y="115" width="460" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <!-- Icon: Upgrade sync / gears -->
    <g transform="translate(1114, 140)">
      <circle cx="24" cy="24" r="16" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="24" cy="24" r="7" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="24" y1="4" x2="24" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="38" x2="24" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="24" x2="10" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="24" x2="44" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 38 12 L 48 12 L 48 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Title 3 -->
    <text x="1184" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1184" dy="0">Invalid RPC after</tspan>
      <tspan x="1184" dy="36">an upgrade</tspan>
    </text>
    <line x1="1114" y1="210" x2="1526" y2="210" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Rule & Mechanism Container -->
    <rect x="1114" y="230" width="412" height="765" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1138" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1138" dy="0">a compute node logs it</tspan>
      <tspan x="1138" dy="34">received an RPC it does</tspan>
      <tspan x="1138" dy="34">not understand or a</tspan>
      <tspan x="1138" dy="34">message with zero bytes;</tspan>
      <tspan x="1138" dy="34">version mismatch; slurmd</tspan>
      <tspan x="1138" dy="34">must never be newer than</tspan>
      <tspan x="1138" dy="34">slurmctld; nodes may be</tspan>
      <tspan x="1138" dy="34">older than the controller</tspan>
      <tspan x="1138" dy="34">during a rolling upgrade</tspan>
    </text>

    <!-- Visual hierarchy showing slurmctld >= slurmd order -->
    <g transform="translate(1150, 620)">
      <rect x="0" y="0" width="340" height="345" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <!-- Controller level -->
      <rect x="30" y="30" width="280" height="58" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="58" cy="59" r="13" fill="#207448"/>
      <path d="M 52 59 L 57 64 L 65 55" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="88" y="50" width="180" height="18" rx="3" fill="#207448" fill-opacity="0.25"/>

      <!-- Version compatibility relation (>=) -->
      <path d="M 160 115 L 180 130 L 160 145" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="160" y1="157" x2="180" y2="157" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

      <!-- Compute node level -->
      <rect x="30" y="185" width="280" height="58" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="58" cy="214" r="13" fill="#207448"/>
      <path d="M 52 214 L 57 219 L 65 210" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="88" y="205" width="130" height="18" rx="3" fill="#207448" fill-opacity="0.25"/>

      <!-- Rolling upgrade direction -->
      <path d="M 170 265 L 170 315" fill="none" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4"/>
      <polyline points="163,307 170,315 177,307" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================== FOOTER TAKEAWAY BAR ==================== -->
  <rect x="50" y="1055" width="1500" height="65" rx="12" fill="#207448"/>
  <text x="800" y="1096" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">exact wording differs between versions; learn the shape</text>
</svg>