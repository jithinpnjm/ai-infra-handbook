<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where Jinja appears in a playbook, and the quoting rule for each place</title>
  <desc>Visual infographic explaining where Jinja2 syntax appears in Ansible playbooks, quoting rules for YAML and conditionals, control node evaluation, and variable scope pitfalls.</desc>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- ==================== TITLE (48px bold) ==================== -->
  <text x="800" y="64" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Where Jinja appears in a playbook,</tspan>
    <tspan x="800" dy="50">and the quoting rule for each place</tspan>
  </text>

  <!-- ==================== SECTION 1: TABLE (y = 155 to 630, h = 475) ==================== -->
  <g id="table-places-rules">
    <!-- Outer Table Border / Container -->
    <rect x="40" y="155" width="1520" height="475" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    <!-- Table Header (y = 155 to 225, h = 70) -->
    <path d="M 40 167 A 12 12 0 0 1 52 155 L 1548 155 A 12 12 0 0 1 1560 167 L 1560 225 L 40 225 Z" fill="#e8f1ea" />
    <line x1="40" y1="225" x2="1560" y2="225" stroke="#207448" stroke-width="2" />
    <line x1="520" y1="155" x2="520" y2="550" stroke="#207448" stroke-width="2" />

    <!-- Header Col 1: Place -->
    <g transform="translate(60, 172)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="18" cy="18" r="14" fill="#ffffff" />
      <circle cx="18" cy="18" r="5" fill="#207448" />
    </g>
    <text x="120" y="201" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Place</text>

    <!-- Header Col 2: Rule -->
    <g transform="translate(545, 172)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="4" y="4" width="28" height="30" rx="4" fill="#ffffff" />
      <line x1="10" y1="12" x2="26" y2="12" />
      <line x1="10" y1="18" x2="26" y2="18" />
      <line x1="10" y1="24" x2="20" y2="24" />
    </g>
    <text x="605" y="201" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rule</text>

    <!-- Row 1: task arguments, vars, loop (y = 225 to 345, h = 120) -->
    <line x1="40" y1="345" x2="1560" y2="345" stroke="#207448" stroke-width="1.5" stroke-dasharray="2 0" />
    <!-- Icon: Braces / Loop (56x56, stroke 4, green) -->
    <g transform="translate(60, 247)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="10" fill="#e8f1ea" />
      <path d="M 22 18 C 16 18 16 23 16 28 C 16 33 16 38 22 38" />
      <path d="M 34 18 C 40 18 40 23 40 28 C 40 33 40 38 34 38" />
    </g>
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="135" y="273">task arguments,</tspan>
      <tspan x="135" y="311">vars, loop</tspan>
    </text>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="550" y="267">a YAML value that starts with {{ must be quoted:</tspan>
      <tspan x="550" y="297">msg: &quot;{{ var }}&quot;; mixing is fine:</tspan>
      <tspan x="550" y="327">path: &quot;/data/{{ project }}/{{ env }}&quot;</tspan>
    </text>

    <!-- Row 2 (ORANGE): when, failed_when, changed_when (y = 345 to 460, h = 115) -->
    <rect x="41" y="346" width="1518" height="113" fill="#fff9f2" />
    <rect x="41" y="346" width="1518" height="113" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="520" y1="345" x2="520" y2="460" stroke="#db8129" stroke-width="2" />
    <!-- Icon: Decision Diamond / Condition (56x56, stroke 4, orange) -->
    <g transform="translate(60, 362)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 50,28 28,50 6,28" fill="#ffeacc" />
      <polyline points="20,28 26,34 38,22" stroke="#db8129" />
    </g>
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="135" y="393">when, failed_when,</tspan>
      <tspan x="135" y="429">changed_when</tspan>
    </text>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="550" y="391">already a Jinja expression: write</tspan>
      <tspan x="550" y="431">when: ansible_distribution == Ubuntu, not when: &quot;{{ ... }}&quot;</tspan>
    </text>

    <!-- Row 3: template module files (y = 460 to 550, h = 90) -->
    <line x1="40" y1="550" x2="1560" y2="550" stroke="#207448" stroke-width="1.5" />
    <!-- Icon: Template Document (56x56, stroke 4, green) -->
    <g transform="translate(60, 477)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 6 L 36 6 L 46 16 L 46 50 L 12 50 Z" fill="#e8f1ea" />
      <polyline points="36,6 36,16 46,16" />
      <line x1="18" y1="26" x2="38" y2="26" />
      <line x1="18" y1="34" x2="38" y2="34" />
    </g>
    <text x="135" y="517" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">template module files</text>
    <text x="550" y="517" font-family="monospace" font-size="24" fill="#303a36">src: nccl.conf.j2 rendered on the control node</text>

    <!-- Row 4: inventory variables (y = 550 to 630, h = 80, spanned) -->
    <!-- Icon: Inventory / Server Nodes (56x56, stroke 4, green) -->
    <g transform="translate(60, 562)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="16" rx="4" fill="#e8f1ea" />
      <circle cx="14" cy="16" r="2" fill="#207448" />
      <rect x="6" y="32" width="44" height="16" rx="4" fill="#e8f1ea" />
      <circle cx="14" cy="40" r="2" fill="#207448" />
    </g>
    <text x="135" y="600" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">inventory variables</text>
  </g>

  <!-- ==================== SECTION 2: CORE SPLIT PANEL (y = 670 to 895, h = 225) ==================== -->
  <g id="core-split-panel">
    <rect x="40" y="670" width="1520" height="225" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <!-- Left Sub-card: Control Node -->
    <rect x="60" y="685" width="705" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Laptop / CI Runner Icon (56x56, stroke 4, green) -->
    <g transform="translate(85, 705)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="26" rx="3" fill="#e8f1ea" />
      <line x1="4" y1="42" x2="52" y2="42" />
      <line x1="22" y1="42" x2="34" y2="42" stroke-width="5" />
    </g>

    <!-- Right Sub-card: Target Servers -->
    <rect x="835" y="685" width="705" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Server Rack Icon (56x56, stroke 4, green) -->
    <g transform="translate(860, 705)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="40" height="14" rx="3" fill="#e8f1ea" />
      <line x1="16" y1="13" x2="20" y2="13" />
      <circle cx="40" cy="13" r="2" fill="#207448" />
      <rect x="8" y="24" width="40" height="14" rx="3" fill="#e8f1ea" />
      <line x1="16" y1="31" x2="20" y2="31" />
      <circle cx="40" cy="31" r="2" fill="#207448" />
      <rect x="8" y="42" width="40" height="14" rx="3" fill="#e8f1ea" />
      <line x1="16" y1="49" x2="20" y2="49" />
      <circle cx="40" cy="49" r="2" fill="#207448" />
    </g>

    <!-- Label 11: Single text element with tspans in left and right cards -->
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="160" y="730" font-weight="bold">Ansible evaluates templates on the</tspan>
      <tspan x="160" y="766" font-weight="bold">control node, not on the servers:</tspan>
      <tspan x="160" y="808">a template task fills its blanks on</tspan>
      <tspan x="160" y="842">your laptop or CI runner</tspan>
      <tspan x="935" y="750">then copies finished text to the target;</tspan>
      <tspan x="935" y="798">a shell task runs on the target</tspan>
    </text>
  </g>

  <!-- ==================== SECTION 3: FAILURE STORY STRIP (y = 935 to 1055, h = 120) ==================== -->
  <g id="failure-story-strip">
    <rect x="40" y="935" width="1520" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- Warning / Alert Triangle Icon (56x56, stroke 4, green) -->
    <g transform="translate(65, 963)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,8 50,48 6,48" fill="#e8f1ea" />
      <line x1="28" y1="22" x2="28" y2="34" />
      <circle cx="28" cy="41" r="2" fill="#207448" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" y="975" font-weight="bold">AnsibleUndefinedVariable on one host while the same playbook works on others:</tspan>
      <tspan x="145" y="1009">the variable is defined only in a different inventory group,</tspan>
      <tspan x="145" y="1039">or in a file the play never loads</tspan>
    </text>
  </g>

  <!-- ==================== SECTION 4: BOTTOM TAKEAWAY BAR (y = 1095 to 1160, h = 65) ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="1095" width="1520" height="65" rx="12" fill="#207448" />
    <text x="800" y="1137" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Know where Ansible evaluates the template to know where to look first</text>
  </g>
</svg>