<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>One PyTorch job is a tree of processes and threads</title>
  <desc>A tree of processes and threads in a PyTorch training job, showing the launcher, per-GPU processes, Python interpreter and runtime threads, and DataLoader worker processes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  <!-- Title (48px bold) -->
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">One PyTorch job is a tree of processes and threads</text>

  <!-- ==================== 1. TOP NODE: PyTorch job ==================== -->
  <g id="pytorch-job-node">
    <rect x="580" y="125" width="440" height="78" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <!-- Gear icon (about 56px, outline, green stroke 4) -->
    <g transform="translate(604, 136)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10"/>
      <path d="M 25 5 L 31 5 L 32 11 L 24 11 Z
               M 25 45 L 31 45 L 32 51 L 24 51 Z
               M 5 25 L 5 31 L 11 32 L 11 24 Z
               M 45 25 L 45 31 L 51 32 L 51 24 Z
               M 12 12 L 16 8 L 21 13 L 17 17 Z
               M 40 40 L 44 36 L 49 41 L 45 45 Z
               M 12 44 L 8 40 L 13 35 L 17 39 Z
               M 40 16 L 36 12 L 41 7 L 45 11 Z"/>
      <circle cx="28" cy="28" r="18"/>
    </g>
    <text x="680" y="176" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">PyTorch job</text>
  </g>

  <!-- Tree branch connecting PyTorch job to Launcher (line with no arrowhead) -->
  <line x1="800" y1="203" x2="800" y2="245" stroke="#207448" stroke-width="3"/>

  <!-- ==================== 2. NODE: Launcher ==================== -->
  <g id="launcher-node">
    <rect x="620" y="245" width="360" height="74" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <!-- Terminal / Launch icon (outline, stroke 4, green) -->
    <g transform="translate(644, 254)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6"/>
      <polyline points="15,21 24,27 15,33"/>
      <line x1="28" y1="33" x2="41" y2="33"/>
    </g>
    <text x="715" y="293" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Launcher</text>
  </g>

  <!-- ==================== ARROW 1: starts one process per GPU ==================== -->
  <!-- Vertical arrow down from Launcher to distribution bus -->
  <line x1="800" y1="319" x2="800" y2="398" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <!-- Arrow label pill -->
  <rect x="550" y="336" width="500" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="367" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">starts one process per GPU</text>

  <!-- Tree branch bus to both Process per GPU boxes -->
  <path d="M 420,418 V 398 H 1180 V 418" fill="none" stroke="#207448" stroke-width="3.5"/>

  <!-- ==================== 3. ROW OF TWO PROCESS BOXES ==================== -->
  <!-- Left Process Box: Process per GPU -->
  <g id="process-box-left">
    <rect x="80" y="418" width="680" height="296" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <!-- GPU chip outline icon (about 56px, stroke 4, green) -->
    <g transform="translate(108, 432)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <rect x="19" y="19" width="18" height="18" rx="2"/>
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="10" y2="18"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="4" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="52" y2="18"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="46" y1="38" x2="52" y2="38"/>
    </g>
    <text x="180" y="471" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Process per GPU</text>

    <!-- Sub-box 1: Main thread -->
    <g id="left-main-thread">
      <rect x="108" y="499" width="624" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(126, 521)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="24" r="10"/>
        <path d="M 16 6 L 16 14"/>
        <path d="M 16 34 L 16 42"/>
      </g>
      <text x="175" y="538" font-family="sans-serif" font-size="25" fill="#303a36">
        <tspan x="175" dy="0" font-weight="bold">Main thread: </tspan>
        <tspan x="175" dy="31">runs the Python interpreter</tspan>
      </text>
    </g>

    <!-- Sub-box 2: Extra threads -->
    <g id="left-extra-threads">
      <rect x="108" y="605" width="624" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(126, 627)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 10 C 14 10, 14 38, 20 38"/>
        <path d="M 18 10 C 24 10, 24 38, 30 38"/>
        <path d="M 28 10 C 34 10, 34 38, 40 38"/>
      </g>
      <text x="175" y="644" font-family="sans-serif" font-size="25" fill="#303a36">
        <tspan x="175" dy="0" font-weight="bold">Extra threads: </tspan>
        <tspan x="175" dy="31">CUDA callbacks, NCCL and autograd</tspan>
      </text>
    </g>
  </g>

  <!-- Right Process Box: Process per GPU -->
  <g id="process-box-right">
    <rect x="840" y="418" width="680" height="296" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <!-- GPU chip outline icon (about 56px, stroke 4, green) -->
    <g transform="translate(868, 432)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <rect x="19" y="19" width="18" height="18" rx="2"/>
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="10" y2="18"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="4" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="52" y2="18"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="46" y1="38" x2="52" y2="38"/>
    </g>
    <text x="940" y="471" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Process per GPU</text>

    <!-- Sub-box 1: Main thread -->
    <g id="right-main-thread">
      <rect x="868" y="499" width="624" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(886, 521)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="24" r="10"/>
        <path d="M 16 6 L 16 14"/>
        <path d="M 16 34 L 16 42"/>
      </g>
      <text x="935" y="538" font-family="sans-serif" font-size="25" fill="#303a36">
        <tspan x="935" dy="0" font-weight="bold">Main thread: </tspan>
        <tspan x="935" dy="31">runs the Python interpreter</tspan>
      </text>
    </g>

    <!-- Sub-box 2: Extra threads -->
    <g id="right-extra-threads">
      <rect x="868" y="605" width="624" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(886, 627)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 10 C 14 10, 14 38, 20 38"/>
        <path d="M 18 10 C 24 10, 24 38, 30 38"/>
        <path d="M 28 10 C 34 10, 34 38, 40 38"/>
      </g>
      <text x="935" y="644" font-family="sans-serif" font-size="25" fill="#303a36">
        <tspan x="935" dy="0" font-weight="bold">Extra threads: </tspan>
        <tspan x="935" dy="31">CUDA callbacks, NCCL and autograd</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== ARROW 2: forks (orange) ==================== -->
  <!-- From left process box down to DataLoader -->
  <line x1="420" y1="714" x2="420" y2="766" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  
  <!-- Arrow label pill -->
  <rect x="360" y="721" width="120" height="38" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="420" y="748" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">forks</text>

  <!-- ==================== 4. NODE: DataLoader with num_workers=N ==================== -->
  <g id="dataloader-node">
    <rect x="80" y="766" width="680" height="144" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <!-- Disk cylinder / Storage icon (outline, stroke 4, green, about 56px) -->
    <g transform="translate(108, 778)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="26" cy="14" rx="20" ry="8"/>
      <path d="M 6 14 V 40 C 6 44 15 48 26 48 C 37 48 46 44 46 40 V 14"/>
      <path d="M 6 27 C 6 31 15 35 26 35 C 37 35 46 31 46 27"/>
    </g>
    <text x="175" y="813" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">DataLoader with num_workers=N</text>

    <!-- Sub-box: N more processes -->
    <g id="n-more-processes-node">
      <rect x="175" y="834" width="530" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <!-- Process hierarchy / fork icon -->
      <g transform="translate(193, 844)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="5"/>
        <circle cx="28" cy="10" r="5"/>
        <circle cx="19" cy="30" r="5"/>
        <line x1="10" y1="15" x2="16" y2="25"/>
        <line x1="28" y1="15" x2="22" y2="25"/>
      </g>
      <text x="245" y="874" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">N more processes</text>
    </g>
  </g>

  <!-- ==================== 5. NOTE UNDER THE TREE ==================== -->
  <g id="note-under-tree">
    <rect x="80" y="955" width="1440" height="68" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="800" y="998" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Processes, not threads: Python's global interpreter lock limits CPU parallelism in threads.</text>
  </g>

  <!-- ==================== 6. CAPTION AT THE BOTTOM ==================== -->
  <g id="caption-bottom">
    <rect x="80" y="1063" width="1440" height="62" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1102" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">Threads share one process. Processes are started for data loading.</text>
  </g>

</svg>