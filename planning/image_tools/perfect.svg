<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Logging rules: who configures, which level, which destination</title>
  <desc>Infographic explaining rules, destinations, and structured logging best practices in Python.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #303a36; text-anchor: middle; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #207448; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; fill: #303a36; }
      .mono-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 24px; fill: #303a36; }
      .story-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; fill: #303a36; text-anchor: middle; }
      .takeaway-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .panel-bg { fill: #e8f1ea; stroke: #207448; stroke-width: 2; }
      .card-bg { fill: #ffffff; stroke: #207448; stroke-width: 1.5; }
      .card-orange { fill: #ffffff; stroke: #db8129; stroke-width: 2.5; }
      .card-code { fill: #ffffff; stroke: #207448; stroke-width: 1.5; }
      .icon-stroke { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" class="bg" />

  <!-- Title -->
  <text x="800" y="54" class="title-text">Logging rules: who configures, which level, which destination</text>

  <!-- Opening story -->
  <rect x="40" y="76" width="1520" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="108" class="story-text">the useful line scrolled away and the next run overwrote the file</text>

  <!-- ================= LEFT COLUMN: Rules ================= -->
  <!-- Width: 780, from x=40 to 820 -->
  <rect x="40" y="140" width="780" height="826" rx="12" class="panel-bg" />

  <!-- Rules Icon (Sliders / Controls) -->
  <g transform="translate(62, 154)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <line x1="12" y1="18" x2="44" y2="18" class="icon-stroke" />
    <circle cx="20" cy="18" r="4" fill="#207448" />
    <line x1="12" y1="28" x2="44" y2="28" class="icon-stroke" />
    <circle cx="36" cy="28" r="4" fill="#207448" />
    <line x1="12" y1="38" x2="44" y2="38" class="icon-stroke" />
    <circle cx="26" cy="38" r="4" fill="#207448" />
  </g>
  <text x="134" y="193" class="section-title">Rules</text>

  <!-- Rules Item 1: print vs logging (2 lines, height: 80) -->
  <rect x="58" y="222" width="744" height="80" rx="8" class="card-bg" />
  <text x="78" y="254" class="body-text">
    <tspan x="78" dy="0">print for program output, logging for diagnostics</tspan>
    <tspan x="78" dy="28">with levels, destinations and structure</tspan>
  </text>

  <!-- Rules Item 2: levels & setup_logging (5 lines, height: 164) -->
  <rect x="58" y="312" width="744" height="164" rx="8" class="card-bg" />
  <text x="78" y="344" class="body-text">
    <tspan x="78" dy="0">levels DEBUG, INFO, WARNING, ERROR, CRITICAL, set</tspan>
    <tspan x="78" dy="28">through configuration or environment variables,</tspan>
    <tspan x="78" dy="28">not by editing code; setup_logging(verbosity):</tspan>
    <tspan x="78" dy="28">0 gives WARNING, 1 gives INFO,</tspan>
    <tspan x="78" dy="28">anything higher DEBUG</tspan>
  </text>

  <!-- Rules Item 3: %s placeholders (ORANGE ACCENT) (2 lines, height: 80) -->
  <rect x="58" y="486" width="744" height="80" rx="8" class="card-orange" />
  <rect x="58" y="486" width="8" height="80" rx="4" fill="#db8129" />
  <text x="82" y="518" class="body-text">
    <tspan x="82" dy="0">use %s placeholders, not f-strings: arguments are</tspan>
    <tspan x="82" dy="28">formatted only when the record is emitted</tspan>
  </text>

  <!-- Rules Item 4: one logger per module (2 lines, height: 80) -->
  <rect x="58" y="576" width="744" height="80" rx="8" class="card-bg" />
  <text x="78" y="608" class="body-text">
    <tspan x="78" dy="0">one logger per module:</tspan>
    <tspan x="78" dy="28" class="mono-text">log = logging.getLogger(__name__)</tspan>
  </text>

  <!-- Rules Item 5: libraries NullHandler vs app startup (3 lines, height: 108) -->
  <rect x="58" y="666" width="744" height="108" rx="8" class="card-bg" />
  <text x="78" y="698" class="body-text">
    <tspan x="78" dy="0">libraries get a logger and add</tspan>
    <tspan x="78" dy="28">logging.NullHandler(); applications</tspan>
    <tspan x="78" dy="28">configure handlers once at startup</tspan>
  </text>

  <!-- Rules Item 6: exc_info=True & exception() (3 lines, height: 108) -->
  <rect x="58" y="784" width="744" height="108" rx="8" class="card-bg" />
  <text x="78" y="816" class="body-text">
    <tspan x="78" dy="0">log.error(..., exc_info=True) attaches the</tspan>
    <tspan x="78" dy="28">current traceback; log.exception() inside</tspan>
    <tspan x="78" dy="28">except does the same at ERROR level</tspan>
  </text>

  <!-- Rules Item 7: tight loops (2 lines, height: 80) -->
  <rect x="58" y="902" width="744" height="80" rx="8" class="card-bg" />
  <text x="78" y="934" class="body-text">
    <tspan x="78" dy="0">do not log inside tight loops at INFO: log</tspan>
    <tspan x="78" dy="28">summaries and sampled details, include units</tspan>
  </text>

  <!-- ================= RIGHT COLUMN: Destinations ================= -->
  <!-- Width: 710, from x=850 to 1560 -->
  <rect x="850" y="140" width="710" height="826" rx="12" class="panel-bg" />

  <!-- Destinations Icon (Disks / Routing) -->
  <g transform="translate(872, 154)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <ellipse cx="28" cy="18" rx="16" ry="6" class="icon-stroke" />
    <path d="M12 18 v12 c0 3.3 7.2 6 16 6 s16 -2.7 16 -6 v-12" class="icon-stroke" />
    <path d="M12 30 v10 c0 3.3 7.2 6 16 6 s16 -2.7 16 -6 v-10" class="icon-stroke" />
  </g>
  <text x="944" y="193" class="section-title">Destinations</text>

  <!-- Destinations Item 1: stderr & journal (3 lines, height: 114) -->
  <rect x="868" y="222" width="674" height="114" rx="8" class="card-bg" />
  <text x="888" y="254" class="body-text">
    <tspan x="888" dy="0">stderr is a good default, stdout stays</tspan>
    <tspan x="888" dy="28">clean for data; containers and systemd</tspan>
    <tspan x="888" dy="28">capture it into the journal</tspan>
  </text>

  <!-- Destinations Item 2: Handlers (4 lines, height: 142) -->
  <rect x="868" y="352" width="674" height="142" rx="8" class="card-bg" />
  <text x="888" y="384" class="body-text">
    <tspan x="888" dy="0">RotatingFileHandler,</tspan>
    <tspan x="888" dy="28">TimedRotatingFileHandler, SysLogHandler,</tspan>
    <tspan x="888" dy="28">SocketHandler, QueueHandler for</tspan>
    <tspan x="888" dy="28">non-blocking logging</tspan>
  </text>

  <!-- Destinations Item 3: dictConfig (2 lines, height: 86) -->
  <rect x="868" y="510" width="674" height="86" rx="8" class="card-bg" />
  <text x="888" y="542" class="body-text">
    <tspan x="888" dy="0">logging.config.dictConfig for declarative</tspan>
    <tspan x="888" dy="28">setups</tspan>
  </text>

  <!-- Destinations Item 4: containers (2 lines, height: 86) -->
  <rect x="868" y="612" width="674" height="86" rx="8" class="card-bg" />
  <text x="888" y="644" class="body-text">
    <tspan x="888" dy="0">in containers log to stdout and stderr and</tspan>
    <tspan x="888" dy="28">let the platform ship them</tspan>
  </text>

  <!-- Format example (2 lines monospace, height: 100) -->
  <rect x="868" y="714" width="674" height="100" rx="8" class="card-code" />
  <text x="888" y="752" class="mono-text">
    <tspan x="888" dy="0">%(asctime)s %(levelname)-8s</tspan>
    <tspan x="888" dy="28">%(name)s: %(message)s</tspan>
  </text>

  <!-- ================= BOTTOM PANEL: Structured logging ================= -->
  <!-- Width: 1520, from x=40 to 1560 -->
  <rect x="40" y="980" width="1520" height="114" rx="12" class="panel-bg" />

  <!-- Structured Logging Icon (JSON / document / curly braces) -->
  <g transform="translate(62, 990)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M22 16 c-4 0 -6 3 -6 6 v3 c0 3 -3 5 -5 5 c2 0 5 2 5 5 v3 c0 3 2 6 6 6" class="icon-stroke" />
    <path d="M34 16 c4 0 6 3 6 6 v3 c0 3 3 5 5 5 c-2 0 -5 2 -5 5 v3 c0 3 -2 6 -6 6" class="icon-stroke" />
  </g>
  <text x="134" y="1027" class="panel-title">Structured logging</text>

  <rect x="420" y="990" width="1122" height="94" rx="8" class="card-bg" />
  <text x="438" y="1026" class="body-text">
    <tspan x="438" dy="0">JSON lines with fields such as host, job_id and duration_ms; structlog,</tspan>
    <tspan x="438" dy="28">python-json-logger or a custom Formatter; include a correlation</tspan>
    <tspan x="438" dy="28">or request id; redact secrets and personal data</tspan>
  </text>

  <!-- ================= BOTTOM BAR: Takeaway ================= -->
  <rect x="40" y="1108" width="1520" height="60" rx="8" fill="#207448" />
  <text x="800" y="1147" class="takeaway-text">Applications configure handlers once, libraries never do</text>

</svg>