<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>A lossless Ethernet class needs every piece set the same, end to end</title>
  <desc>A lossless Ethernet class needs every piece set the same, end to end: network chain, checklist, failure modes, InfiniBand contrast, and rail-optimised fabric.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1180" fill="#f5f8f5" />
  <!-- 1. Title -->
  <text x="40" y="88" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">A lossless Ethernet class needs</tspan>
    <tspan x="40" dy="54">every piece set the same, end to end</tspan>
  </text>
  <!-- Checklist Container -->
  <rect x="40" y="165" width="980" height="400" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="55" y="178" width="950" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="212" r="14" fill="#207448" /><path d="M 79 212 L 83 217 L 92 207" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="206" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">PFC (802.1Qbb) for the RoCE priority, on the NIC and on</tspan>
    <tspan x="115" dy="28">every switch</tspan>
  </text>
  <rect x="55" y="254" width="950" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="278" r="14" fill="#207448" /><path d="M 79 278 L 83 283 L 92 273" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="286" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">ECN marking with DCQCN or similar rate control</tspan>
  </text>
  <rect x="55" y="310" width="950" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="334" r="14" fill="#207448" /><path d="M 79 334 L 83 339 L 92 329" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="342" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">DSCP and PCP trust and mapping set correctly</tspan>
  </text>
  <rect x="55" y="366" width="950" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="400" r="14" fill="#207448" /><path d="M 79 400 L 83 405 L 92 395" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="394" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">buffer allocation and headroom sized for each port speed</tspan>
    <tspan x="115" dy="28">and cable length</tspan>
  </text>
  <rect x="55" y="442" width="950" height="108" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="85" cy="496" r="14" fill="#207448" /><path d="M 79 496 L 83 501 L 92 491" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="115" y="470" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">per-port counters watched: CRC, FEC uncorrected, symbol</tspan>
    <tspan x="115" dy="28">errors, PFC pause counts per priority, ECN-marked packets,</tspan>
    <tspan x="115" dy="28">buffer occupancy, link flaps, optical power (DOM)</tspan>
  </text>
  <!-- Node 1: NIC -->
  <rect x="40" y="585" width="150" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(87, 605)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="40" rx="4" />
    <line x1="14" y1="44" x2="14" y2="52" /><line x1="22" y1="44" x2="22" y2="52" /><line x1="30" y1="44" x2="30" y2="52" /><line x1="38" y1="44" x2="38" y2="52" />
    <circle cx="28" cy="24" r="8" />
  </g>
  <text x="115" y="715" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="115" dy="0">NIC</tspan>
  </text>
  <line x1="190" y1="682.5" x2="247.5" y2="682.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 2: Leaf switch port -->
  <rect x="247.5" y="585" width="150" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(294.5, 601)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="34" rx="4" />
    <line x1="12" y1="25" x2="44" y2="25" />
    <polyline points="18,19 12,25 18,31" />
    <polyline points="38,19 44,25 38,31" />
  </g>
  <text x="322.5" y="687" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="322.5" dy="0">Leaf</tspan>
    <tspan x="322.5" dy="34">switch</tspan>
    <tspan x="322.5" dy="34">port</tspan>
  </text>
  <line x1="397.5" y1="682.5" x2="455" y2="682.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 3: Spine switch port -->
  <rect x="455" y="585" width="150" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(502, 601)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="38" rx="4" />
    <line x1="12" y1="18" x2="44" y2="18" /><line x1="12" y1="32" x2="44" y2="32" />
    <circle cx="28" cy="25" r="4" fill="#207448" />
  </g>
  <text x="530" y="687" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="530" dy="0">Spine</tspan>
    <tspan x="530" dy="34">switch</tspan>
    <tspan x="530" dy="34">port</tspan>
  </text>
  <line x1="605" y1="682.5" x2="662.5" y2="682.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 4: Leaf switch port -->
  <rect x="662.5" y="585" width="150" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(709.5, 601)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="34" rx="4" />
    <line x1="12" y1="25" x2="44" y2="25" />
    <polyline points="18,19 12,25 18,31" />
    <polyline points="38,19 44,25 38,31" />
  </g>
  <text x="737.5" y="687" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="737.5" dy="0">Leaf</tspan>
    <tspan x="737.5" dy="34">switch</tspan>
    <tspan x="737.5" dy="34">port</tspan>
  </text>
  <line x1="812.5" y1="682.5" x2="870" y2="682.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Node 5: NIC -->
  <rect x="870" y="585" width="150" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(917, 605)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="40" rx="4" />
    <line x1="14" y1="44" x2="14" y2="52" /><line x1="22" y1="44" x2="22" y2="52" /><line x1="30" y1="44" x2="30" y2="52" /><line x1="38" y1="44" x2="38" y2="52" />
    <circle cx="28" cy="24" r="8" />
  </g>
  <text x="945" y="715" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="945" dy="0">NIC</tspan>
  </text>
  <!-- Bar spanning chain -->
  <rect x="40" y="790" width="980" height="60" rx="10" fill="#207448" />
  <text x="530" y="827" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="530" dy="0">the lossless class works only end to end</tspan>
  </text>
  <!-- Right Panel: Failure modes -->
  <rect x="1060" y="165" width="500" height="350" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="1078" y="180" width="464" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <line x1="1102" y1="205" x2="1102" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="1126" y="226" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">PFC missing on one switch</tspan>
    <tspan x="1126" dy="32">port: drops, and RDMA</tspan>
    <tspan x="1126" dy="32">retransmits are costly</tspan>
  </text>
  <rect x="1078" y="345" width="464" height="150" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <line x1="1102" y1="375" x2="1102" y2="465" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <text x="1126" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1126" dy="0">misconfigured the other</tspan>
    <tspan x="1126" dy="32">way: pause storms and</tspan>
    <tspan x="1126" dy="32">deadlocks</tspan>
  </text>
  <!-- Side Contrast: InfiniBand -->
  <rect x="1060" y="535" width="500" height="312" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1286, 545)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="40" height="32" rx="6" />
    <path d="M 12 20 C 18 12, 30 12, 36 20" />
    <path d="M 12 20 C 18 28, 30 28, 36 20" />
  </g>
  <text x="1100" y="624" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">InfiniBand: credit-based</tspan>
    <tspan x="1100" dy="28">flow control per virtual</tspan>
    <tspan x="1100" dy="28">lane, lossless by</tspan>
    <tspan x="1100" dy="28">construction; LIDs and GIDs</tspan>
    <tspan x="1100" dy="28">replace MACs and IPs; the</tspan>
    <tspan x="1100" dy="28">Subnet Manager programs</tspan>
    <tspan x="1100" dy="28">forwarding tables</tspan>
  </text>
  <!-- Footer: Rail-optimised -->
  <rect x="40" y="865" width="1520" height="170" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(60, 922)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="6" />
    <circle cx="28" cy="28" r="12" />
    <line x1="28" y1="4" x2="28" y2="16" /><line x1="28" y1="40" x2="28" y2="52" />
    <line x1="4" y1="28" x2="16" y2="28" /><line x1="40" y1="28" x2="52" y2="28" />
  </g>
  <text x="135" y="915" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">Rail-optimised: one NIC per GPU, often its own subnet, VLAN or VRF; 8 x 400G</tspan>
    <tspan x="135" dy="34">back end; a single x4 link at 100G instead of 400G slows the whole job</tspan>
    <tspan x="135" dy="34">because collectives move at the speed of the slowest participant</tspan>
  </text>
  <!-- Bottom Takeaway Bar -->
  <rect x="40" y="1050" width="1520" height="66" rx="10" fill="#207448" />
  <text x="800" y="1089" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="800" dy="0">Treat a PFC change on one switch as a change to the whole fabric</tspan>
  </text>
</svg>