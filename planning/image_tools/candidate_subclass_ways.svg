<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Four ways a subclass talks to its superclass, plus mixins and delegation</title>
  <desc>Visual infographic explaining the four subclass patterns (Inheritor, Replacer, Extender, Provider), Mixins with MRO ordering and collections.UserDict warning, and Composition and delegation.</desc>

  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#303a36" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- Infographic Title (48px bold) -->
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Four ways a subclass talks to its superclass, plus mixins and delegation</text>

  <!-- ==================== CONTAINER 1: FOUR PATTERNS TABLE ==================== -->
  <g id="table-four-patterns">
    <rect x="40" y="82" width="1520" height="334" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    <!-- Row 1: Inheritor -->
    <!-- Icon 1: Pass-through hierarchy (48x48) -->
    <g transform="translate(62, 91)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="10" r="7"/>
      <circle cx="24" cy="38" r="7"/>
      <line x1="24" y1="17" x2="24" y2="31"/>
      <path d="M 18 25 L 24 31 L 30 25"/>
    </g>
    <text x="135" y="122" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0" font-weight="bold" font-family="monospace">Inheritor(Super): pass, inherits methods unchanged</tspan>
    </text>

    <!-- Divider 1 -->
    <line x1="40" y1="148" x2="1560" y2="148" stroke="#cfe0d4" stroke-width="1.5"/>

    <!-- Row 2: Replacer -->
    <!-- Icon 2: Full override / replacement (48x48) -->
    <g transform="translate(62, 157)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="32" rx="4"/>
      <line x1="14" y1="16" x2="34" y2="32"/>
      <line x1="34" y1="16" x2="14" y2="32"/>
    </g>
    <text x="135" y="188" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0" font-weight="bold" font-family="monospace">Replacer(Super): overrides method(self) completely</tspan>
    </text>

    <!-- Divider 2 -->
    <line x1="40" y1="214" x2="1560" y2="214" stroke="#cfe0d4" stroke-width="1.5"/>

    <!-- Row 3: Extender -->
    <!-- Icon 3: Callback / extension loop (48x48) -->
    <g transform="translate(62, 240)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="16"/>
      <polyline points="24,14 34,24 24,34"/>
      <path d="M 14 24 L 32 24"/>
      <path d="M 24 8 A 16 16 0 0 0 8 24 A 16 16 0 0 0 24 40"/>
    </g>
    <text x="135" y="246" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0" font-weight="bold" font-family="monospace">Extender(Super): overrides method(self) and calls back Super.method(self);</tspan>
      <tspan x="135" dy="27">example Manager.giveRaise(self, percent, bonus=.10) calls</tspan>
      <tspan x="135" dy="27">Person.giveRaise(self, percent + bonus)</tspan>
    </text>

    <!-- Divider 3 -->
    <line x1="40" y1="322" x2="1560" y2="322" stroke="#cfe0d4" stroke-width="1.5"/>

    <!-- Row 4: Provider (orange highlight) -->
    <path d="M 40 322 L 1560 322 L 1560 404 A 12 12 0 0 1 1548 416 L 52 416 A 12 12 0 0 1 40 404 Z" fill="#fff9f2"/>
    <path d="M 40 322 L 48 322 L 48 416 L 52 416 A 12 12 0 0 1 40 404 Z" fill="#db8129"/>
    <!-- Icon 4: Provider hook / template interface (48x48, orange) -->
    <g transform="translate(62, 345)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="32" rx="4"/>
      <path d="M 18 8 V 16 A 6 6 0 0 0 30 16 V 8"/>
      <circle cx="24" cy="28" r="4" fill="#db8129"/>
    </g>
    <text x="135" y="358" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0" font-weight="bold" fill="#db8129" font-family="monospace">Provider(Super): implements the abstract action(self) hook that</tspan>
      <tspan x="135" dy="28">Super.delegate(self) expects, the Template Method pattern</tspan>
    </text>
  </g>

  <!-- ==================== CONTAINER 2: MIXINS (LEFT) ==================== -->
  <g id="panel-mixins">
    <rect x="40" y="432" width="740" height="538" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <!-- Banner -->
    <path d="M 40 444 A 12 12 0 0 1 52 432 L 768 432 A 12 12 0 0 1 780 444 L 780 488 L 40 488 Z" fill="#e8f1ea"/>
    <!-- Icon: Interlocking modular blocks (42x42) -->
    <g transform="translate(60, 439)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="18" height="18" rx="2"/>
      <rect x="22" y="4" width="18" height="18" rx="2"/>
      <rect x="13" y="22" width="18" height="18" rx="2"/>
    </g>
    <text x="120" y="470" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Mixins</text>

    <!-- Mixin description -->
    <text x="64" y="516" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">a small class named ...Mixin adding one</tspan>
      <tspan x="64" dy="26">independent capability through multiple</tspan>
      <tspan x="64" dy="26">inheritance: AttrDisplay, ListInstance</tspan>
      <tspan x="64" dy="26">(inspects self.__dict__), ListInherited</tspan>
      <tspan x="64" dy="26">(dir(self)), ListTree (climbs __class__ and</tspan>
      <tspan x="64" dy="26">__bases__); UpperCaseMixin uppercases string</tspan>
      <tspan x="64" dy="26">keys with super().__setitem__(_upper(key),</tspan>
      <tspan x="64" dy="26">item) and must be listed first: class</tspan>
      <tspan x="64" dy="26">UpperDict(UpperCaseMixin,</tspan>
      <tspan x="64" dy="26">collections.UserDict): pass, so it intercepts</tspan>
      <tspan x="64" dy="26">calls before UserDict on the MRO</tspan>
    </text>

    <!-- Warning Card inside Mixins -->
    <rect x="58" y="802" width="704" height="154" rx="8" fill="#fef8f2" stroke="#db8129" stroke-width="1.5"/>
    <!-- Warning Icon (40x40) -->
    <g transform="translate(74, 859)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="20,4 38,36 2,36"/>
      <line x1="20" y1="16" x2="20" y2="24"/>
      <circle cx="20" cy="30" r="2" fill="#db8129"/>
    </g>
    <text x="132" y="836" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="132" dy="0">subclassing a built-in C type such</tspan>
      <tspan x="132" dy="25">as dict or list directly is risky</tspan>
      <tspan x="132" dy="25">because C methods ignore Python</tspan>
      <tspan x="132" dy="25">overrides; use collections.UserDict,</tspan>
      <tspan x="132" dy="25">UserList or UserString</tspan>
    </text>
  </g>

  <!-- ==================== CONTAINER 3: COMPOSITION AND DELEGATION (RIGHT) ==================== -->
  <g id="panel-composition">
    <rect x="820" y="432" width="740" height="538" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <!-- Banner -->
    <path d="M 820 444 A 12 12 0 0 1 832 432 L 1548 432 A 12 12 0 0 1 1560 444 L 1560 488 L 820 488 Z" fill="#e8f1ea"/>
    <!-- Icon: Embedded object / delegation wrapper (42x42) -->
    <g transform="translate(840, 439)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="34" height="30" rx="4"/>
      <rect x="14" y="14" width="14" height="14" rx="2" fill="#e8f1ea"/>
    </g>
    <text x="898" y="470" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Composition and delegation</text>

    <!-- Composition and delegation description -->
    <text x="844" y="518" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="844" dy="0">inheritance models is-a (PizzaRobot is a</tspan>
      <tspan x="844" dy="27">Chef, a Chef is an Employee); composition</tspan>
      <tspan x="844" dy="27">models has-a (PizzaShop contains Server,</tspan>
      <tspan x="844" dy="27">PizzaRobot and Oven; Department gathers</tspan>
      <tspan x="844" dy="27">Person and Manager objects); delegation: a</tspan>
      <tspan x="844" dy="27">wrapper holds an embedded object and</tspan>
      <tspan x="844" dy="27">forwards requests with def</tspan>
      <tspan x="844" dy="27">__getattr__(self, attr): return</tspan>
      <tspan x="844" dy="27">getattr(self.person, attr); special</tspan>
      <tspan x="844" dy="27">operators such as __str__ or __add__ are</tspan>
      <tspan x="844" dy="27">looked up on the class directly, so they</tspan>
      <tspan x="844" dy="27">bypass instance-level __getattr__</tspan>
    </text>
  </g>

  <!-- ==================== CONTAINER 4: BOTTOM STRIP (ISINSTANCE / LISKOV) ==================== -->
  <g id="bottom-strip">
    <rect x="40" y="986" width="1520" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <!-- Icon: Balance scale / Liskov contract (44x44) -->
    <g transform="translate(62, 1021)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="6" x2="22" y2="38"/>
      <line x1="12" y1="38" x2="32" y2="38"/>
      <line x1="8" y1="14" x2="36" y2="14"/>
      <path d="M 8 14 L 4 26 L 12 26 Z"/>
      <path d="M 36 14 L 32 26 L 40 26 Z"/>
    </g>
    <text x="135" y="1022" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">isinstance(x, Base) and issubclass respect inheritance; type(x) is T checks the exact</tspan>
      <tspan x="135" dy="26">type, rarely wanted; Liskov: a subclass accepts at least what the base accepts, returns</tspan>
      <tspan x="135" dy="26">no less than the base promises, and adds no surprising exceptions</tspan>
    </text>
  </g>

  <!-- ==================== TAKEAWAY BAR (BOTTOM) ==================== -->
  <g id="takeaway-bar">
    <rect x="40" y="1116" width="1520" height="64" rx="8" fill="#207448"/>
    <!-- Icon: Lightbulb / key takeaway in white -->
    <g transform="translate(64, 1125)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 8 A 12 12 0 0 0 10 20 C 10 26 14 30 16 34 L 28 34 C 30 30 34 26 34 20 A 12 12 0 0 0 22 8 Z"/>
      <line x1="18" y1="38" x2="26" y2="38"/>
    </g>
    <text x="800" y="1156" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Customize a component without touching its source</text>
  </g>
</svg>