<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Kueue objects from team quota to a running Job</title>
  <desc>A chain of Kueue objects from flavor and cluster queue to a suspended Job that is admitted as a whole.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="1100" fill="#f5f8f5" />

  <!-- Title -->
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Kueue objects from team quota to a running Job</text>

  <!-- ==================== ROW 1: ResourceFlavor -> ClusterQueue ==================== -->

  <!-- Box 1: ResourceFlavor -->
  <g id="node-resourceflavor">
    <rect x="40" y="110" width="720" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Chip Icon (56px) -->
    <g transform="translate(65, 135)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="32" height="32" rx="4" />
      <line x1="16" y1="2" x2="16" y2="8" />
      <line x1="24" y1="2" x2="24" y2="8" />
      <line x1="32" y1="2" x2="32" y2="8" />
      <line x1="16" y1="40" x2="16" y2="46" />
      <line x1="24" y1="40" x2="24" y2="46" />
      <line x1="32" y1="40" x2="32" y2="46" />
      <line x1="2" y1="16" x2="8" y2="16" />
      <line x1="2" y1="24" x2="8" y2="24" />
      <line x1="2" y1="32" x2="8" y2="32" />
      <line x1="40" y1="16" x2="46" y2="16" />
      <line x1="40" y1="24" x2="46" y2="24" />
      <line x1="40" y1="32" x2="46" y2="32" />
      <circle cx="24" cy="24" r="5" />
    </g>
    <text x="130" y="148" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0" font-weight="bold">ResourceFlavor h100-ondemand: </tspan>
      <tspan x="130" dy="29">nodeLabels nvidia.com/gpu.product </tspan>
      <tspan x="130" dy="29">NVIDIA-H100-80GB-HBM3 and pool </tspan>
      <tspan x="130" dy="29">h100-ondemand, plus the nvidia.com/gpu </tspan>
      <tspan x="130" dy="29">toleration, injected into admitted </tspan>
      <tspan x="130" dy="29">workloads</tspan>
    </text>
  </g>

  <!-- Arrow 1: ResourceFlavor to ClusterQueue -->
  <line x1="760" y1="215" x2="840" y2="215" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Box 2: ClusterQueue -->
  <g id="node-clusterqueue">
    <rect x="840" y="110" width="720" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Gear / Service Icon (56px) -->
    <g transform="translate(865, 135)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="10" />
      <path d="M 24 6 L 24 10 M 24 38 L 24 42 M 6 24 L 10 24 M 38 24 L 42 24 M 11.3 11.3 L 14.1 14.1 M 33.9 33.9 L 36.7 36.7 M 11.3 36.7 L 14.1 33.9 M 33.9 14.1 L 36.7 11.3" />
    </g>
    <text x="930" y="158" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="930" dy="0" font-weight="bold">ClusterQueue research: cohortName </tspan>
      <tspan x="930" dy="32">gpu-fleet, queueingStrategy </tspan>
      <tspan x="930" dy="32">BestEffortFIFO, namespaceSelector team </tspan>
      <tspan x="930" dy="32">research, quota per flavor</tspan>
    </text>
  </g>

  <!-- ==================== ROW 2: Job & LocalQueue -> ClusterQueue ==================== -->

  <!-- Box 3: Job -->
  <g id="node-job">
    <rect x="40" y="350" width="720" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Application Window Icon (56px) -->
    <g transform="translate(65, 375)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="32" rx="4" />
      <line x1="6" y1="16" x2="42" y2="16" />
      <circle cx="12" cy="12" r="1" fill="#207448" />
      <circle cx="18" cy="12" r="1" fill="#207448" />
      <polyline points="14,24 20,29 14,34" />
      <line x1="24" y1="34" x2="34" y2="34" />
    </g>
    <text x="130" y="388" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0" font-weight="bold">Job pretrain-llama in research-ns: </tspan>
      <tspan x="130" dy="29">labels kueue.x-k8s.io/queue-name </tspan>
      <tspan x="130" dy="29">research-gpu and priority-class </tspan>
      <tspan x="130" dy="29">training-normal; spec.suspend true, </tspan>
      <tspan x="130" dy="29">parallelism 8, completions 8, 8-GPU </tspan>
      <tspan x="130" dy="29">pods</tspan>
    </text>
  </g>

  <!-- Box 4: LocalQueue -->
  <g id="node-localqueue">
    <rect x="840" y="350" width="720" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Queue / Buffer Icon (56px) -->
    <g transform="translate(865, 375)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="9" rx="2" />
      <rect x="6" y="20" width="36" height="9" rx="2" />
      <rect x="6" y="32" width="36" height="9" rx="2" />
    </g>
    <text x="930" y="435" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="930" dy="0" font-weight="bold">LocalQueue research-gpu in namespace </tspan>
      <tspan x="930" dy="34">research-ns, clusterQueue research</tspan>
    </text>
  </g>

  <!-- Arrow 2: LocalQueue to ClusterQueue (Points UP) -->
  <line x1="1200" y1="350" x2="1200" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- ==================== STEPS 1 to 5 ==================== -->

  <!-- Step 1 Card -->
  <g id="step-1">
    <rect x="40" y="590" width="272" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="176" cy="630" r="24" fill="#207448" />
    <text x="176" y="639" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="176" y="690" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="176" dy="0">1 Job created </tspan>
      <tspan x="176" dy="28">suspended, so </tspan>
      <tspan x="176" dy="28">no pods exist</tspan>
    </text>
  </g>

  <!-- Step 2 Card -->
  <g id="step-2">
    <rect x="352" y="590" width="272" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="488" cy="630" r="24" fill="#207448" />
    <text x="488" y="639" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="488" y="705" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="488" dy="0">2 Kueue builds </tspan>
      <tspan x="488" dy="28">a Workload</tspan>
    </text>
  </g>

  <!-- Step 3 Card (ORANGE HIGHLIGHT: Quota Admission) -->
  <g id="step-3">
    <rect x="664" y="590" width="272" height="260" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <circle cx="800" cy="630" r="24" fill="#db8129" />
    <text x="800" y="639" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="800" y="680" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">3 quota </tspan>
      <tspan x="800" dy="25">available in </tspan>
      <tspan x="800" dy="25">the flavor </tspan>
      <tspan x="800" dy="25">admits the </tspan>
      <tspan x="800" dy="25">whole Workload</tspan>
    </text>
  </g>

  <!-- Step 4 Card -->
  <g id="step-4">
    <rect x="976" y="590" width="272" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1112" cy="630" r="24" fill="#207448" />
    <text x="1112" y="639" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <text x="1112" y="680" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1112" dy="0">4 Kueue </tspan>
      <tspan x="1112" dy="25">unsuspends the </tspan>
      <tspan x="1112" dy="25">Job and </tspan>
      <tspan x="1112" dy="25">injects node </tspan>
      <tspan x="1112" dy="25">labels and </tspan>
      <tspan x="1112" dy="25">tolerations</tspan>
    </text>
  </g>

  <!-- Step 5 Card -->
  <g id="step-5">
    <rect x="1288" y="590" width="272" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1424" cy="630" r="24" fill="#207448" />
    <text x="1424" y="639" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    <text x="1424" y="690" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1424" dy="0">5 </tspan>
      <tspan x="1424" dy="28">kube-scheduler </tspan>
      <tspan x="1424" dy="28">places the </tspan>
      <tspan x="1424" dy="28">pods</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM PANELS: Analogy & Note ==================== -->

  <!-- Analogy Card -->
  <g id="panel-analogy">
    <rect x="40" y="890" width="740" height="170" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <!-- Building / Admissions Icon (56px) -->
    <g transform="translate(65, 945)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="24,6 4,18 44,18" />
      <line x1="8" y1="18" x2="8" y2="40" />
      <line x1="18" y1="18" x2="18" y2="40" />
      <line x1="30" y1="18" x2="30" y2="40" />
      <line x1="40" y1="18" x2="40" y2="40" />
      <line x1="4" y1="40" x2="44" y2="40" />
    </g>
    <text x="135" y="945" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">Kueue is the admissions office, </tspan>
      <tspan x="135" dy="32">the scheduler is the registrar </tspan>
      <tspan x="135" dy="32">assigning classrooms</tspan>
    </text>
  </g>

  <!-- Note Card -->
  <g id="panel-note">
    <rect x="820" y="890" width="740" height="170" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Terminal / Command prompt Icon (56px) -->
    <g transform="translate(845, 945)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="32" rx="4" />
      <line x1="6" y1="16" x2="42" y2="16" />
      <polyline points="14,24 20,29 14,34" />
      <line x1="24" y1="34" x2="34" y2="34" />
    </g>
    <text x="915" y="945" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="915" dy="0">for a Pending Kueue job start with </tspan>
      <tspan x="915" dy="32">kubectl describe workload: until admitted, </tspan>
      <tspan x="915" dy="32">the pods do not exist</tspan>
    </text>
  </g>
</svg>