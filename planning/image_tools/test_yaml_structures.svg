<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The three YAML structures, read through the cluster example</title>
  <desc>Visual infographic explaining the three YAML data structures—scalars, sequences, and mappings—using an annotated cluster manifest alongside syntax rules, JSON equivalents, and parser behaviors.</desc>

  <!-- Background Canvas -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- ==================== TITLE (48px bold) ==================== -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The three YAML structures, </tspan>
    <tspan x="800" dy="54">read through the cluster example</tspan>
  </text>

  <!-- ==================== LEFT COLUMN: ANNOTATED FILE ==================== -->
  <!-- Outer Container (x=40, y=140, w=780, h=920) -->
  <rect x="40" y="140" width="780" height="920" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  <!-- File / Document Outline Icon (56x56 px, stroke 4, green) -->
  <g transform="translate(68, 148)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 4 L 36 4 L 48 16 L 48 50 L 10 50 Z M 36 4 L 36 16 L 48 16" fill="#ffffff"/>
    <line x1="18" y1="26" x2="40" y2="26"/>
    <line x1="18" y1="34" x2="34" y2="34"/>
    <line x1="18" y1="42" x2="38" y2="42"/>
  </g>

  <!-- Inner Code Canvas (x=64, y=208, w=732, h=832) -->
  <rect x="64" y="208" width="732" height="832" rx="10" fill="#ffffff" stroke="#cfded2" stroke-width="1.5"/>

  <!-- Code Gutter / Margin Indicator Line -->
  <line x1="86" y1="208" x2="86" y2="1040" stroke="#e8f1ea" stroke-width="2"/>

  <!-- Visual Structure Guides / Indentation Rails -->
  <line x1="108" y1="345" x2="108" y2="980" stroke="#e8f1ea" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="132" y1="540" x2="132" y2="680" stroke="#e8f1ea" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- YAML Code Lines -->
  <rect x="72" y="224" width="80" height="52" rx="6" fill="#f5f8f5" stroke="#cfded2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="90" y="258" font-family="monospace" font-size="24" fill="#303a36">---</text>
  <rect x="72" y="288" width="155" height="52" rx="6" fill="#e8f1ea" stroke="#cfded2" stroke-width="1"/>
  <text x="90" y="322" font-family="monospace" font-size="24" fill="#303a36">cluster:</text>
  <rect x="96" y="352" width="259" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="386" font-family="monospace" font-size="24" fill="#303a36">name: ai-prod-1</text>
  <rect x="96" y="416" width="318" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="450" font-family="monospace" font-size="24" fill="#303a36">racks: [r1, r2, r3]</text>
  <rect x="96" y="480" width="125" height="52" rx="6" fill="#e8f1ea" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="514" font-family="monospace" font-size="24" fill="#303a36">nodes:</text>
  <rect x="120" y="544" width="660" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="138" y="578" font-family="monospace" font-size="24" fill="#303a36">name: gpu01, gpus: 8, tags: [h100, nvlink]</text>
  <rect x="120" y="608" width="541" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="138" y="642" font-family="monospace" font-size="24" fill="#303a36">name: gpu02, gpus: 8, tags: - h100</text>
  <rect x="96" y="672" width="140" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="706" font-family="monospace" font-size="24" fill="#303a36">motd: |</text>
  <rect x="96" y="736" width="244" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="770" font-family="monospace" font-size="24" fill="#303a36">description: &gt;</text>
  <rect x="96" y="800" width="229" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="834" font-family="monospace" font-size="24" fill="#303a36">enabled: true</text>
  <rect x="96" y="864" width="229" height="52" rx="6" fill="#ffffff" stroke="#cfded2" stroke-width="1"/>
  <text x="114" y="898" font-family="monospace" font-size="24" fill="#303a36">contact: null</text>
  <rect x="72" y="928" width="80" height="52" rx="6" fill="#f5f8f5" stroke="#cfded2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="90" y="962" font-family="monospace" font-size="24" fill="#303a36">...</text>

  <!-- ==================== RIGHT COLUMN: TABLE & NOTES ==================== -->
  <!-- ==================== TOP RIGHT: STRUCTURE TABLE ==================== -->
  <rect x="860" y="140" width="700" height="420" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  <!-- Table Icon (56x56 px, stroke 4, green) -->
  <g transform="translate(884, 148)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="42" rx="6" fill="#ffffff"/>
    <line x1="4" y1="20" x2="52" y2="20"/>
    <line x1="20" y1="6" x2="20" y2="48"/>
    <line x1="36" y1="6" x2="36" y2="48"/>
  </g>

  <!-- Table Column Headers Bar (28px bold) -->
  <rect x="880" y="198" width="660" height="56" rx="6" fill="#207448"/>
  <text x="898" y="236" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Structure</text>
  <text x="1070" y="236" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Syntax</text>
  <text x="1270" y="236" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">JSON or Python</text>

  <!-- Row 1: Scalar -->
  <rect x="880" y="264" width="660" height="84" rx="8" fill="#ffffff" stroke="#cfded2" stroke-width="1.5"/>
  <text x="898" y="296" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="898" dy="0" font-weight="bold" fill="#207448">Scalar: </tspan>
    <tspan font-family="monospace">42, 3.14, true, null, hello, </tspan>
    <tspan x="898" dy="34">&quot;quoted&quot; / number, bool, null, string</tspan>
  </text>

  <!-- Row 2: Sequence -->
  <rect x="880" y="356" width="660" height="84" rx="8" fill="#ffffff" stroke="#cfded2" stroke-width="1.5"/>
  <text x="898" y="388" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="898" dy="0" font-weight="bold" fill="#207448">Sequence: </tspan>
    <tspan font-family="monospace">- item per line, or [a, b] </tspan>
    <tspan x="898" dy="34" fill="#606c66">/ array or list</tspan>
  </text>

  <!-- Row 3: Mapping -->
  <rect x="880" y="448" width="660" height="84" rx="8" fill="#ffffff" stroke="#cfded2" stroke-width="1.5"/>
  <text x="898" y="480" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="898" dy="0" font-weight="bold" fill="#207448">Mapping: </tspan>
    <tspan font-family="monospace">key: value pairs, or </tspan>
    <tspan x="898" dy="34">{a: 1, b: 2} / object or dict</tspan>
  </text>

  <!-- ==================== BOTTOM RIGHT: NOTES PANEL ==================== -->
  <rect x="860" y="600" width="700" height="460" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  <!-- Notes Gear / Filing Tray Icon (56x56 px, stroke 4, green) -->
  <g transform="translate(884, 608)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="16" width="44" height="30" rx="6" fill="#ffffff"/>
    <path d="M 6 28 L 22 28 L 26 34 L 38 34 L 42 28 L 50 28"/>
    <line x1="16" y1="8" x2="40" y2="8"/>
    <line x1="20" y1="12" x2="36" y2="12"/>
  </g>

  <!-- Note 1 (orange highlight: the single most important item) -->
  <rect x="880" y="664" width="660" height="140" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2.5"/>
  <text x="898" y="696" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="898" dy="0">a parser turns each value into a typed </tspan>
    <tspan x="898" dy="28">object before any tool reads it: the </tspan>
    <tspan x="898" dy="28">clerk at a counter files each word as </tspan>
    <tspan x="898" dy="28">number, true or false, or text</tspan>
  </text>

  <!-- Note 2: JSON is valid YAML 1.2 -->
  <rect x="880" y="816" width="660" height="80" rx="8" fill="#ffffff" stroke="#cfded2" stroke-width="1.5"/>
  <text x="898" y="848" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="898" dy="0">JSON is valid YAML 1.2, so {&quot;a&quot;: 1} </tspan>
    <tspan x="898" dy="30">works anywhere YAML does</tspan>
  </text>

  <!-- Note 3: Indentation rules -->
  <rect x="880" y="908" width="660" height="132" rx="8" fill="#ffffff" stroke="#cfded2" stroke-width="1.5"/>
  <text x="898" y="938" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="898" dy="0">indentation tells the parser where each </tspan>
    <tspan x="898" dy="28">item ends, brackets do the same for short </tspan>
    <tspan x="898" dy="28">lists; pick the form a reviewer reads </tspan>
    <tspan x="898" dy="28">fastest and keep it consistent in each file</tspan>
  </text>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <rect x="40" y="1100" width="1520" height="60" rx="10" fill="#207448"/>
  <text x="800" y="1140" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Read the file the way the parser reads it</text>

</svg>