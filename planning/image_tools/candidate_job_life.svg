<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The life of a job</title>
  <desc>Sequence diagram illustrating the lifecycle of a Slurm batch job from submission to completion across login node, controller, database daemon, and compute nodes.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-left" viewBox="0 0 18 18" refX="2" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 16 3 L 2 9 L 16 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange-left" viewBox="0 0 18 18" refX="2" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 16 3 L 2 9 L 16 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The life of a job</text>
  <g id="participant-U status">
    <rect x="50" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(158, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="44" height="28" rx="4"/>
      <path d="M 22 28 v 8 M 12 36 h 20"/>
      <path d="M 7 10 l 6 4 -6 4 M 19 18 h 10"/>
    </g>
    <text x="180" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="180" dy="0">User on</tspan><tspan x="180" dy="30"> login node</tspan></text>
  </g>
  <g id="participant-C status">
    <rect x="360" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(470, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="18" r="9"/>
      <path d="M 20 2 v 5 M 20 29 v 5 M 4 18 h 5 M 31 18 h 5 M 8 7 l 4 4 M 28 27 l 4 4 M 8 29 l 4 -4 M 28 9 l 4 -4"/>
    </g>
    <text x="490" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">slurmctld</text>
  </g>
  <g id="participant-DBD status">
    <rect x="670" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(781, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="19" cy="8" rx="18" ry="6"/>
      <path d="M 1 8 v 20 c 0 3.5 8 6 18 6 s 18 -2.5 18 -6 v -20"/>
      <path d="M 1 18 c 0 3.5 8 6 18 6 s 18 -2.5 18 -6"/>
    </g>
    <text x="800" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">slurmdbd</text>
  </g>
  <g id="participant-D1 status">
    <rect x="980" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1090, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="28" height="28" rx="4"/>
      <rect x="13" y="11" width="14" height="14" rx="2"/>
      <path d="M 14 0 v 4 M 26 0 v 4 M 14 32 v 4 M 26 32 v 4 M 2 13 h 4 M 2 23 h 4 M 34 13 h 4 M 34 23 h 4"/>
    </g>
    <text x="1110" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="1110" dy="0">slurmd on</tspan><tspan x="1110" dy="30"> node A</tspan></text>
  </g>
  <g id="participant-D2 status">
    <rect x="1290" y="75" width="260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1400, 83)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="28" height="28" rx="4"/>
      <rect x="13" y="11" width="14" height="14" rx="2"/>
      <path d="M 14 0 v 4 M 26 0 v 4 M 14 32 v 4 M 26 32 v 4 M 2 13 h 4 M 2 23 h 4 M 34 13 h 4 M 34 23 h 4"/>
    </g>
    <text x="1420" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="1420" dy="0">slurmd on</tspan><tspan x="1420" dy="30"> node B</tspan></text>
  </g>
  <line x1="180" y1="185" x2="180" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="490" y1="185" x2="490" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="800" y1="185" x2="800" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1110" y1="185" x2="1110" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1420" y1="185" x2="1420" y2="1175" stroke="#b8c9c0" stroke-width="3" stroke-dasharray="8 6" />
  <!-- Step 1 -->
  <g id="step-1">
    <circle cx="180" cy="230" r="24" fill="#207448" />
    <text x="180" y="238" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <line x1="204" y1="230" x2="490" y2="230" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="205" y="196" width="640" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="225" y="220" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">sbatch job.sh</tspan><tspan font-family="sans-serif"> (RPC with munge credential)</tspan></text>
  </g>
  <!-- Step 2 -->
  <g id="step-2">
    <circle cx="490" cy="296" r="24" fill="#207448" />
    <text x="490" y="304" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <path d="M 514 296 H 542 V 324 H 490" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="545" y="280" width="1010" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="565" y="305" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="sans-serif">authenticate, run </tspan><tspan font-family="monospace">job_submit</tspan><tspan font-family="sans-serif"> plugin, check limits and associations</tspan></text>
  </g>
  <!-- Step 3 -->
  <g id="step-3">
    <circle cx="490" cy="362" r="24" fill="#207448" />
    <text x="490" y="370" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <line x1="466" y1="362" x2="180" y2="362" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green-left)" />
    <rect x="85" y="328" width="385" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="277.5" y="352" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Submitted batch job 4217</text>
  </g>
  <!-- Step 4 -->
  <g id="step-4">
    <circle cx="490" cy="428" r="24" fill="#207448" />
    <text x="490" y="436" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <path d="M 514 428 H 542 V 456 H 490" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="550" y="412" width="920" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="570" y="437" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">job PENDING in queue, scheduler loop and backfill evaluate it</text>
  </g>
  <!-- Step 5 -->
  <g id="step-5">
    <circle cx="490" cy="494" r="24" fill="#db8129" />
    <text x="490" y="502" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <path d="M 514 494 H 542 V 522 H 490" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange-left)" />
    <rect x="550" y="478" width="850" height="34" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="570" y="503" text-anchor="start" font-family="sans-serif" font-weight="bold" font-size="24" fill="#303a36">resources found: allocate nodes A and B, state RUNNING</text>
  </g>
  <!-- Step 6 -->
  <g id="step-6">
    <circle cx="490" cy="560" r="24" fill="#207448" />
    <text x="490" y="568" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <line x1="514" y1="560" x2="1110" y2="560" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="525" y="526" width="570" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="810" y="550" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">launch batch step (RPC tree fan-out)</text>
  </g>
  <!-- Step 7 -->
  <g id="step-7">
    <circle cx="490" cy="626" r="24" fill="#207448" />
    <text x="490" y="634" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
    <line x1="514" y1="626" x2="1420" y2="626" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="525" y="592" width="360" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="705" y="616" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">prepare node (prolog)</text>
  </g>
  <!-- Step 8 -->
  <g id="step-8">
    <circle cx="1110" cy="692" r="24" fill="#207448" />
    <text x="1110" y="700" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
    <path d="M 1086 692 H 1058 V 720 H 1110" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="350" y="676" width="700" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="370" y="701" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="sans-serif">prolog, fork </tspan><tspan font-family="monospace">slurmstepd</tspan><tspan font-family="sans-serif">, run the batch script</tspan></text>
  </g>
  <!-- Step 9 -->
  <g id="step-9">
    <circle cx="1110" cy="758" r="24" fill="#207448" />
    <text x="1110" y="766" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">9</text>
    <line x1="1134" y1="758" x2="1420" y2="758" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="720" y="724" width="700" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="738" y="748" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="sans-serif">script runs </tspan><tspan font-family="monospace">srun</tspan><tspan font-family="sans-serif">, steps launched on both nodes</tspan></text>
  </g>
  <!-- Step 10 -->
  <g id="step-10">
    <circle cx="1110" cy="824" r="24" fill="#207448" />
    <text x="1110" y="832" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">10</text>
    <path d="M 1086 824 H 1058 V 852 H 1110" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="600" y="808" width="450" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="825" y="833" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">epilog, cleanup of processes</text>
  </g>
  <!-- Step 11 -->
  <g id="step-11">
    <circle cx="1420" cy="890" r="24" fill="#207448" />
    <text x="1420" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">11</text>
    <path d="M 1396 890 H 1368 V 918 H 1420" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="910" y="874" width="450" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1135" y="899" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">epilog, cleanup of processes</text>
  </g>
  <!-- Step 12 -->
  <g id="step-12">
    <circle cx="1110" cy="956" r="24" fill="#207448" />
    <text x="1110" y="964" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">12</text>
    <line x1="1086" y1="956" x2="490" y2="956" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="650" y="922" width="280" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="790" y="946" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job complete RPC</text>
  </g>
  <!-- Step 13 -->
  <g id="step-13">
    <circle cx="490" cy="1022" r="24" fill="#207448" />
    <text x="490" y="1030" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">13</text>
    <line x1="514" y1="1022" x2="800" y2="1022" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="515" y="988" width="720" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="875" y="1012" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job record: times, resources, exit code, usage</text>
  </g>
  <!-- Step 14 -->
  <g id="step-14">
    <circle cx="490" cy="1088" r="24" fill="#207448" />
    <text x="490" y="1096" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">14</text>
    <path d="M 514 1088 H 542 V 1116 H 490" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />
    <rect x="550" y="1072" width="610" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="570" y="1097" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">free nodes A and B, run scheduler again</text>
  </g>
</svg>