<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1115" width="1600" height="1115">
  <title>Name mangling: two __X attributes that survive side by side</title>
  <desc>Diamond-free multiple inheritance diagram illustrating how Python name mangling rewrites __X to _ClassName__X so that attributes from C1 and C2 survive side by side in the instance dictionary.</desc>

  <!-- Canvas background -->
  <rect width="1600" height="1115" fill="#f5f8f5"/>

  <!-- Title: 48px bold -->
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Name mangling: two __X attributes</tspan>
    <tspan x="800" dy="54">that survive side by side</tspan>
  </text>

  <!-- ==================== BASE CLASSES C1 & C2 ==================== -->
  <!-- Class C1 -->
  <g id="node-class-c1">
    <rect x="60" y="140" width="710" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(85, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="52" rx="8"/>
      <line x1="2" y1="18" x2="54" y2="18"/>
      <line x1="12" y1="30" x2="32" y2="30"/>
      <line x1="12" y1="42" x2="44" y2="42"/>
    </g>
    <text x="165" y="188" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Class C1</text>
    <rect x="165" y="202" width="580" height="58" rx="8" fill="#e8f1ea"/>
    <text x="185" y="244" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">self.__X = 88 in meth1</text>
  </g>

  <!-- Class C2 -->
  <g id="node-class-c2">
    <rect x="830" y="140" width="710" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(855, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="52" rx="8"/>
      <line x1="2" y1="18" x2="54" y2="18"/>
      <line x1="12" y1="30" x2="32" y2="30"/>
      <line x1="12" y1="42" x2="44" y2="42"/>
    </g>
    <text x="935" y="188" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Class C2</text>
    <rect x="935" y="202" width="580" height="58" rx="8" fill="#e8f1ea"/>
    <text x="955" y="244" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">self.__X = 99 in metha</text>
  </g>

  <!-- Structural connecting lines (diamond-free multiple inheritance & compile flow) -->
  <line x1="415" y1="275" x2="415" y2="315" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="1185" y1="275" x2="1185" y2="315" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- ==================== COMPILE STEP PANEL ==================== -->
  <g id="panel-compile-step">
    <rect x="40" y="315" width="1520" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 330)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="16" y2="16"/>
      <line x1="40" y1="40" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="16" y2="40"/>
      <line x1="40" y1="16" x2="45" y2="11"/>
    </g>
    <text x="800" y="358" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">inside a class body the compiler rewrites __X to _ClassName__X</text>
    <rect x="60" y="385" width="710" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="415" y="427" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">C1 stores _C1__X</text>
    <rect x="830" y="385" width="710" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1185" y="427" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">C2 stores _C2__X</text>
  </g>

  <line x1="415" y1="470" x2="415" y2="510" stroke="#207448" stroke-width="3"/>
  <line x1="1185" y1="470" x2="1185" y2="510" stroke="#207448" stroke-width="3"/>

  <!-- ==================== SUBCLASS C3 & INSTANCE DICTIONARY ==================== -->
  <g id="node-class-c3">
    <rect x="60" y="510" width="710" height="155" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(85, 558)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="2" width="20" height="16" rx="3"/>
      <line x1="28" y1="18" x2="28" y2="32"/>
      <line x1="12" y1="32" x2="44" y2="32"/>
      <line x1="12" y1="32" x2="12" y2="40"/>
      <line x1="44" y1="32" x2="44" y2="40"/>
      <rect x="4" y="40" width="16" height="14" rx="2"/>
      <rect x="36" y="40" width="16" height="14" rx="2"/>
    </g>
    <text x="435" y="598" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">C3(C1, C2): pass</text>
  </g>

  <line x1="770" y1="587" x2="830" y2="587" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Instance dictionary box (orange highlight) -->
  <g id="box-instance-dict">
    <rect x="830" y="510" width="710" height="155" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(855, 558)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <line x1="28" y1="4" x2="28" y2="52"/>
      <circle cx="16" cy="16" r="4"/>
      <circle cx="40" cy="16" r="4"/>
      <circle cx="16" cy="40" r="4"/>
      <circle cx="40" cy="40" r="4"/>
    </g>
    <text x="1205" y="565" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">{'_C1__X': 88, '_C2__X': 99}</text>
    <text x="1205" y="618" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1205" dy="0">both values survive because</tspan>
      <tspan x="1205" dy="30">the names differ</tspan>
    </text>
  </g>

  <!-- ==================== ACCESS NOTE & CONVENTION PANEL ==================== -->
  <g id="panel-access-note">
    <rect x="40" y="705" width="740" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 745)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="22" width="40" height="30" rx="6"/>
      <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22"/>
      <circle cx="28" cy="36" r="3" fill="#207448"/>
      <line x1="28" y1="39" x2="28" y2="45"/>
    </g>
    <text x="145" y="756" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">I._C1__X is still readable: mangling</tspan>
      <tspan x="145" dy="32">prevents collisions in deep hierarchies,</tspan>
      <tspan x="145" dy="32">it does not prevent deliberate access,</tspan>
      <tspan x="145" dy="32">much as Java private fields can be read</tspan>
      <tspan x="145" dy="32">through setAccessible(True) reflection</tspan>
    </text>
  </g>

  <g id="panel-convention">
    <rect x="820" y="705" width="740" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(845, 745)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 6 L 36 6 L 46 16 L 46 50 L 10 50 Z"/>
      <path d="M 36 6 L 36 16 L 46 16"/>
      <line x1="18" y1="26" x2="38" y2="26"/>
      <line x1="18" y1="34" x2="38" y2="34"/>
      <line x1="18" y1="42" x2="30" y2="42"/>
    </g>
    <text x="925" y="756" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="925" dy="0">single leading underscore _name: only a</tspan>
      <tspan x="925" dy="32">convention for internal; double leading</tspan>
      <tspan x="925" dy="32">underscore __X: mangled; Python trusts</tspan>
      <tspan x="925" dy="32">programmers, document the public API and</tspan>
      <tspan x="925" dy="32">leave the rest to convention</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM BAR ==================== -->
  <g id="takeaway-bar">
    <rect x="40" y="1005" width="1520" height="70" rx="12" fill="#207448"/>
    <text x="800" y="1049" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Mangling avoids accidental collisions between subclasses</text>
  </g>
</svg>