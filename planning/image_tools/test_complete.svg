<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>ChainMap layering and read-only views for configuration</title>
  <desc>Visual explanation of ChainMap configuration layering, lookup resolution, write behavior, and related read-only views in Python.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">ChainMap layering and read-only views for configuration</text>

  <!-- ==================== LEFT COLUMN: ChainMap Stack & Rules ==================== -->

  <!-- 1. The 4 Layers Stack Container -->
  <g id="chainmap-stack">
    <rect x="50" y="95" width="730" height="475" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    <!-- Lookup Query Node: cfg["timeout"] -->
    <g id="node-lookup">
      <rect x="75" y="112" width="680" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <!-- Search / Magnifying Glass Icon (40px) -->
      <g transform="translate(95, 120)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="14" cy="14" r="10" />
        <line x1="22" y1="22" x2="32" y2="32" />
      </g>
      <text x="430" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">cfg["timeout"]</text>
    </g>

    <!-- Arrow from Lookup to Layer 1 -->
    <line x1="415" y1="164" x2="415" y2="182" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Layer 1: cli_args -->
    <g id="node-layer-1">
      <rect x="75" y="184" width="680" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Terminal Prompt Icon (40px) -->
      <g transform="translate(95, 192)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="34" height="28" rx="4" />
        <polyline points="9,11 16,16 9,21" />
        <line x1="20" y1="21" x2="28" y2="21" />
      </g>
      <text x="155" y="219" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">cli_args</text>
    </g>

    <!-- Arrow from Layer 1 to Layer 2 -->
    <line x1="415" y1="236" x2="415" y2="254" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Layer 2: os.environ (MYOPS_ prefixed, lowercased) -->
    <g id="node-layer-2">
      <rect x="75" y="256" width="680" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Gear / System Icon (40px) -->
      <g transform="translate(95, 268)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="18" r="7" />
        <path d="M18 3 L18 7 M18 29 L18 33 M3 18 L7 18 M29 18 L33 18 M7.5 7.5 L10.5 10.5 M25.5 25.5 L28.5 28.5 M7.5 28.5 L10.5 25.5 M25.5 10.5 L28.5 7.5" />
      </g>
      <text x="155" y="296" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">os.environ (MYOPS_ prefixed, lowercased)</text>
    </g>

    <!-- Arrow from Layer 2 to Layer 3 -->
    <line x1="415" y1="320" x2="415" y2="338" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Layer 3: file_cfg (/etc/myops.json) -->
    <g id="node-layer-3">
      <rect x="75" y="340" width="680" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- File Document Icon (40px) -->
      <g transform="translate(95, 348)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3 L24 3 L32 11 L32 33 L6 33 Z" />
        <polyline points="24,3 24,11 32,11" />
        <line x1="12" y1="18" x2="26" y2="18" />
        <line x1="12" y1="24" x2="22" y2="24" />
      </g>
      <text x="155" y="375" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">file_cfg (/etc/myops.json)</text>
    </g>

    <!-- Arrow from Layer 3 to Layer 4 -->
    <line x1="415" y1="392" x2="415" y2="410" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Layer 4: defaults {retries: 3, timeout: 30} -->
    <g id="node-layer-4">
      <rect x="75" y="412" width="680" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <!-- Sliders / Settings Icon (40px) -->
      <g transform="translate(95, 424)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="10" x2="32" y2="10" />
        <circle cx="12" cy="10" r="4" fill="#207448" />
        <line x1="4" y1="24" x2="32" y2="24" />
        <circle cx="24" cy="24" r="4" fill="#207448" />
      </g>
      <text x="155" y="452" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">defaults {retries: 3, timeout: 30}</text>
    </g>

    <!-- Arrow from Layer 4 to Resolution -->
    <line x1="415" y1="476" x2="415" y2="494" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Resolution Node: first mapping wins -->
    <g id="node-wins">
      <rect x="75" y="496" width="680" height="54" rx="10" fill="#207448" stroke="#207448" stroke-width="2" />
      <!-- Trophy / Award Icon (40px) -->
      <g transform="translate(95, 503)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8 H28 V18 C28 24 23 28 18 28 C13 28 8 24 8 18 Z" />
        <path d="M8 12 H4 C4 18 8 20 8 20" />
        <path d="M28 12 H32 C32 18 28 20 28 20" />
        <line x1="18" y1="28" x2="18" y2="34" />
        <line x1="11" y1="34" x2="25" y2="34" />
      </g>
      <text x="430" y="533" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">first mapping wins</text>
    </g>
  </g>

  <!-- 2. Small Example Card -->
  <g id="node-small-example">
    <rect x="50" y="595" width="730" height="135" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Code Braces Icon (56px) -->
    <g transform="translate(72, 634)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 6 C8 6 8 18 4 22 C8 26 8 38 16 38" />
      <path d="M34 6 C42 6 42 18 46 22 C42 26 42 38 34 38" />
      <line x1="22" y1="14" x2="28" y2="30" />
    </g>
    <text x="145" y="635" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">ChainMap({retries: 5},</tspan>
      <tspan x="145" dy="32">{retries: 3, timeout: 10}):</tspan>
      <tspan x="145" dy="32">cfg[retries] is 5, cfg[timeout] is 10</tspan>
    </text>
  </g>

  <!-- 3. Write Rule (Orange Accent) -->
  <g id="node-write-rule">
    <rect x="50" y="755" width="730" height="110" rx="16" fill="#fffcf7" stroke="#db8129" stroke-width="3" />
    <!-- Write / Edit Pencil Icon (56px) in Orange -->
    <g transform="translate(72, 782)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 6 L44 20 L18 46 L4 46 L4 32 Z" />
      <line x1="24" y1="12" x2="38" y2="26" />
    </g>
    <text x="145" y="803" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">a write such as chain[c] = -1</tspan>
      <tspan x="145" dy="34">changes only the first mapping</tspan>
    </text>
  </g>

  <!-- 4. Note Card: CLI values of None are dropped -->
  <g id="node-cli-note">
    <rect x="50" y="890" width="730" height="175" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <!-- Filter / Funnel Icon (56px) -->
    <g transform="translate(72, 949)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6,6 44,6 28,26 28,42 22,46 22,26" />
    </g>
    <text x="145" y="930" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">CLI values of None are dropped</tspan>
      <tspan x="145" dy="32">so they do not hide lower layers:</tspan>
      <tspan x="145" dy="34" font-weight="bold">{k: v for k, v in cli.items()</tspan>
      <tspan x="145" dy="32" font-weight="bold"> if v is not None}</tspan>
    </text>
  </g>

  <!-- ==================== RIGHT COLUMN: Related Views ==================== -->
  <g id="right-panel">
    <rect x="820" y="95" width="730" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <!-- Header: Related views -->
    <g id="header-related-views">
      <!-- Stacked Views / Layers Icon (56px) -->
      <g transform="translate(850, 115)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="26,6 48,16 26,26 4,16" />
        <polyline points="4,24 26,34 48,24" />
        <polyline points="4,32 26,42 48,32" />
      </g>
      <text x="925" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Related views</text>
    </g>

    <!-- RP Item 1: MappingProxyType (Read-only view) -->
    <g id="rp-item-1">
      <rect x="850" y="185" width="670" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <!-- Padlock / Security Icon (48px) -->
      <g transform="translate(868, 258)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="18" width="28" height="22" rx="4" />
        <path d="M12 18 V11 C12 6.5 15.5 3 20 3 C24.5 3 28 6.5 28 11 V18" />
        <circle cx="20" cy="28" r="3" fill="#207448" />
      </g>
      <text x="930" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="930" dy="0">types.MappingProxyType(d) is a</tspan>
        <tspan x="930" dy="32">read-only view that still reflects</tspan>
        <tspan x="930" dy="32">later updates to d, so callers cannot</tspan>
        <tspan x="930" dy="32">change a hardware pin map while the</tspan>
        <tspan x="930" dy="32">owner keeps it current</tspan>
      </text>
    </g>

    <!-- RP Item 2: dict.keys() and dict.items() (Live views) -->
    <g id="rp-item-2">
      <rect x="850" y="398" width="670" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <!-- Intersecting Rings / Sets Icon (48px) -->
      <g transform="translate(868, 442)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="22" r="12" />
        <circle cx="28" cy="22" r="12" />
      </g>
      <text x="930" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="930" dy="0">dict.keys() and dict.items() are live</tspan>
        <tspan x="930" dy="32">views with no copying and support</tspan>
        <tspan x="930" dy="32">&amp; | - ^</tspan>
      </text>
    </g>

    <!-- RP Item 3: Python scope lookup -->
    <g id="rp-item-3">
      <rect x="850" y="551" width="670" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <!-- Nested Scopes / Boxes Icon (48px) -->
      <g transform="translate(868, 595)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="36" height="36" rx="4" />
        <rect x="10" y="10" width="24" height="24" rx="3" />
        <rect x="16" y="16" width="12" height="12" rx="2" />
      </g>
      <text x="930" y="593" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="930" dy="0">Python scope lookup uses the same</tspan>
        <tspan x="930" dy="32">idea: ChainMap(locals(), globals(),</tspan>
        <tspan x="930" dy="32">vars(builtins))</tspan>
      </text>
    </g>

    <!-- RP Item 4: merge: a | b, {**a, **b}, or ChainMap -->
    <g id="rp-item-4">
      <rect x="850" y="704" width="670" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <!-- Merge / Branching Arrow Icon (48px) -->
      <g transform="translate(868, 748)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8 V20 C8 28 20 28 20 28 V38" />
        <path d="M32 8 V20 C32 28 20 28 20 28" />
        <polyline points="14,32 20,38 26,32" />
      </g>
      <text x="930" y="746" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="930" dy="0">merge: a | b, {**a, **b}, or</tspan>
        <tspan x="930" dy="32">ChainMap; a deep merge needs</tspan>
        <tspan x="930" dy="32">recursion</tspan>
      </text>
    </g>

    <!-- RP Item 5: dicts compare equal regardless of key order -->
    <g id="rp-item-5">
      <rect x="850" y="857" width="670" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <!-- Balance Scale / Comparison Icon (48px) -->
      <g transform="translate(868, 893)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="4" x2="20" y2="38" />
        <line x1="6" y1="12" x2="34" y2="12" />
        <line x1="6" y1="12" x2="2" y2="22" />
        <line x1="6" y1="12" x2="10" y2="22" />
        <path d="M2 22 Q6 26 10 22 Z" />
        <line x1="34" y1="12" x2="30" y2="22" />
        <line x1="34" y1="12" x2="38" y2="22" />
        <path d="M30 22 Q34 26 38 22 Z" />
        <line x1="12" y1="38" x2="28" y2="38" />
      </g>
      <text x="930" y="907" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="930" dy="0">dicts compare equal regardless of key</tspan>
        <tspan x="930" dy="32">order, lists are order-sensitive</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM BAR: Takeaway ==================== -->
  <g id="bottom-bar">
    <rect x="50" y="1100" width="1500" height="60" rx="12" fill="#207448" />
    <text x="800" y="1139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Use ChainMap when the first mapping should win, without copying</text>
  </g>
</svg>