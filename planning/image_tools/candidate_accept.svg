<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Socket activation: Accept=true versus Accept=false</title>
  <desc>Visual comparison of systemd socket activation modes: Accept=true where systemd accepts each connection and spawns per-connection template service instances, versus Accept=false where systemd passes the listening socket to a single daemon via sd_listen_fds.</desc>

  <defs>
    <!-- Arrowhead markers (18px) -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>

    <!-- Card shadow -->
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- ==================== TITLE ==================== -->
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Socket activation: Accept=true versus Accept=false</text>

  <!-- ==================== TOP START STAGE ==================== -->
  <g id="start-stage">
    <!-- Client Box -->
    <rect x="50" y="88" width="460" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    <!-- Client outline icon (56px) -->
    <g transform="translate(68, 108)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="32" rx="4" />
      <line x1="20" y1="46" x2="36" y2="46" />
      <line x1="28" y1="38" x2="28" y2="46" />
      <polyline points="14,18 20,22 14,26" />
      <line x1="24" y1="26" x2="34" y2="26" />
    </g>
    <text x="142" y="130" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="142" dy="0">Client connects to</tspan>
      <tspan x="142" dy="32">port 22222</tspan>
    </text>

    <!-- Connecting arrow: Client -> Socket Box -->
    <line x1="510" y1="136" x2="572" y2="136" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Socket Box (echo.socket) -->
    <rect x="580" y="88" width="970" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    <!-- Socket outline icon (56px) -->
    <g transform="translate(602, 108)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <circle cx="28" cy="28" r="8" fill="#e8f1ea" />
      <line x1="28" y1="6" x2="28" y2="14" />
      <line x1="28" y1="42" x2="28" y2="50" />
      <line x1="6" y1="28" x2="14" y2="28" />
      <line x1="42" y1="28" x2="50" y2="28" />
    </g>
    <text x="676" y="130" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="676" dy="0" font-family="monospace" font-weight="bold">echo.socket: ListenStream=22222</tspan>
      <tspan x="676" dy="32" font-family="sans-serif">(systemd holds the listening socket)</tspan>
    </text>
  </g>

  <!-- Branch arrows from Socket Box to Left & Right lanes -->
  <!-- Left branch arrow to Accept=true -->
  <path d="M 850 184 L 850 206 L 412 206 L 412 218" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Right branch arrow to Accept=false -->
  <path d="M 1250 184 L 1250 206 L 1188 206 L 1188 218" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  <!-- ==================== LEFT LANE: Accept=true ==================== -->
  <g id="lane-accept-true">
    <!-- Lane Container -->
    <rect x="50" y="226" width="725" height="716" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <!-- Lane Header Card -->
    <rect x="70" y="244" width="685" height="52" rx="10" fill="#207448" />
    <text x="412" y="280" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">Accept=true</text>

    <!-- Node 1: systemd itself calls accept() for each connection -->
    <g id="l1-node-1">
      <rect x="70" y="312" width="685" height="88" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 1 -->
      <circle cx="106" cy="356" r="24" fill="#207448" />
      <text x="106" y="364" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      <!-- Icon (56px): gear with accept connector -->
      <g transform="translate(142, 328)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="14" />
        <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28" />
        <polyline points="22,28 27,33 36,23" />
      </g>
      <!-- Text -->
      <text x="216" y="348" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="216" dy="0">systemd itself calls accept()</tspan>
        <tspan x="216" dy="32">for each connection</tspan>
      </text>
    </g>

    <!-- Arrow L1: Node 1 -> Node 2 -->
    <line x1="412" y1="400" x2="412" y2="416" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Node 2: it starts a NEW instance per connection named 'echo@<n>-<local>-<peer>.service' -->
    <g id="l1-node-2">
      <rect x="70" y="424" width="685" height="126" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 2 -->
      <circle cx="106" cy="487" r="24" fill="#207448" />
      <text x="106" y="495" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      
      <!-- Three small instance boxes stacked to show one per connection -->
      <g id="three-stacked-instances" transform="translate(142, 455)" stroke="#207448" stroke-width="2.5" fill="#e8f1ea">
        <rect x="14" y="0" width="38" height="26" rx="4" />
        <rect x="7" y="10" width="38" height="26" rx="4" />
        <rect x="0" y="20" width="38" height="26" rx="4" fill="#ffffff" />
        <!-- internal lines on front instance -->
        <line x1="6" y1="28" x2="22" y2="28" stroke-width="2" />
        <line x1="6" y1="36" x2="30" y2="36" stroke-width="2" />
      </g>

      <!-- Text -->
      <text x="206" y="460" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="206" dy="0" font-weight="bold">it starts a NEW instance</tspan>
        <tspan x="206" dy="30">per connection named </tspan>
        <tspan x="206" dy="30" font-family="monospace" font-weight="bold">'echo@&lt;n&gt;-&lt;local&gt;-&lt;peer&gt;.service'</tspan>
      </text>
    </g>

    <!-- Arrow L1: Node 2 -> Node 3 -->
    <line x1="412" y1="550" x2="412" y2="566" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Node 3: the service file is a template 'echo@.service' with 'StandardInput=socket' and 'ExecStart=/bin/cat' -->
    <g id="l1-node-3">
      <rect x="70" y="574" width="685" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 3 -->
      <circle cx="106" cy="645" r="24" fill="#207448" />
      <text x="106" y="653" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      <!-- Template Document Icon (56px) -->
      <g transform="translate(142, 617)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 6 L 36 6 L 48 18 L 48 50 L 8 50 Z" />
        <polyline points="36,6 36,18 48,18" />
        <line x1="16" y1="28" x2="36" y2="28" />
        <line x1="16" y1="38" x2="30" y2="38" />
      </g>
      <!-- Text -->
      <text x="212" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="212" dy="0">the service file is a template </tspan>
        <tspan x="212" dy="28" font-family="monospace" font-weight="bold">'echo@.service'</tspan>
        <tspan x="212" dy="28">with </tspan>
        <tspan font-family="monospace" font-weight="bold">'StandardInput=socket'</tspan>
        <tspan x="212" dy="28">and </tspan>
        <tspan font-family="monospace" font-weight="bold">'ExecStart=/bin/cat'</tspan>
      </text>
    </g>

    <!-- Arrow L1: Node 3 -> Node 4 -->
    <line x1="412" y1="716" x2="412" y2="732" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Node 4: the connection is the service's standard input and output so it does not need to know it is a network -->
    <g id="l1-node-4">
      <rect x="70" y="740" width="685" height="118" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 4 -->
      <circle cx="106" cy="799" r="24" fill="#207448" />
      <text x="106" y="807" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
      <!-- Standard I/O Icon (56px) -->
      <g transform="translate(142, 771)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="48" height="38" rx="4" />
        <polyline points="12,22 18,27 12,32" />
        <line x1="22" y1="32" x2="32" y2="32" />
        <line x1="38" y1="22" x2="44" y2="27" />
        <line x1="44" y1="27" x2="38" y2="32" />
      </g>
      <!-- Text -->
      <text x="212" y="768" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="212" dy="0">the connection is the service's </tspan>
        <tspan x="212" dy="28">standard input and output </tspan>
        <tspan x="212" dy="28">so it does not need to know </tspan>
        <tspan x="212" dy="28">it is a network</tspan>
      </text>
    </g>

    <!-- Note in Lane 1: suits only simple services -->
    <g id="l1-note">
      <rect x="70" y="868" width="685" height="58" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" />
      <text x="412" y="904" text-anchor="middle" font-family="sans-serif" font-size="25" font-style="italic" fill="#303a36">suits only simple services</text>
    </g>
  </g>

  <!-- ==================== RIGHT LANE: Accept=false (default) ==================== -->
  <g id="lane-accept-false">
    <!-- Lane Container (Orange accent on Accept=false lane) -->
    <rect x="825" y="226" width="725" height="716" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />

    <!-- Lane Header Card with Orange Accent -->
    <rect x="845" y="244" width="685" height="52" rx="10" fill="#db8129" />
    <text x="1188" y="280" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">Accept=false (default)</text>

    <!-- Node 1: systemd passes the LISTENING socket to one service 'echo.service' (not a template) -->
    <g id="l2-node-1">
      <rect x="845" y="312" width="685" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 1 -->
      <circle cx="881" cy="369" r="24" fill="#207448" />
      <text x="881" y="377" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      <!-- Icon (56px): listening socket handoff -->
      <g transform="translate(917, 341)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="28" r="12" />
        <rect x="34" y="16" width="18" height="24" rx="3" />
        <line x1="28" y1="28" x2="34" y2="28" />
        <polyline points="28,24 32,28 28,32" />
      </g>
      <!-- Text -->
      <text x="987" y="348" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="987" dy="0" font-weight="bold">systemd passes the LISTENING </tspan>
        <tspan x="987" dy="30">socket to one service </tspan>
        <tspan font-family="monospace" font-weight="bold">'echo.service' </tspan>
        <tspan x="987" dy="30">(not a template)</tspan>
      </text>
    </g>

    <!-- Arrow L2: Node 1 -> Node 2 -->
    <line x1="1188" y1="426" x2="1188" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Node 2: the service calls accept() itself and keeps control until it exits -->
    <g id="l2-node-2">
      <rect x="845" y="458" width="685" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 2 -->
      <circle cx="881" cy="515" r="24" fill="#207448" />
      <text x="881" y="523" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      <!-- Icon (56px): service event loop control -->
      <g transform="translate(917, 487)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="18" stroke-dasharray="24 6" />
        <polyline points="26,10 32,10 32,16" />
        <rect x="20" y="20" width="16" height="16" rx="2" fill="#e8f1ea" />
      </g>
      <!-- Text -->
      <text x="987" y="494" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="987" dy="0">the service calls accept() </tspan>
        <tspan x="987" dy="30">itself and keeps control </tspan>
        <tspan x="987" dy="30">until it exits</tspan>
      </text>
    </g>

    <!-- Arrow L2: Node 2 -> Node 3 -->
    <line x1="1188" y1="572" x2="1188" y2="596" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Node 3: it receives the descriptor in $LISTEN_FDS starting at descriptor 3 through sd_listen_fds() -->
    <g id="l2-node-3">
      <rect x="845" y="604" width="685" height="136" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Number circle 3 -->
      <circle cx="881" cy="672" r="24" fill="#207448" />
      <text x="881" y="680" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      <!-- Icon (56px): file descriptor table / sd_listen_fds -->
      <g transform="translate(917, 644)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="44" height="44" rx="4" />
        <line x1="6" y1="20" x2="50" y2="20" />
        <line x1="22" y1="20" x2="22" y2="50" />
        <path d="M 12 28 Q 16 28 16 33 Q 16 38 12 38 M 16 33 Q 16 31 13 31" />
        <line x1="28" y1="35" x2="44" y2="35" />
      </g>
      <!-- Text -->
      <text x="987" y="644" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="987" dy="0">it receives the descriptor in </tspan>
        <tspan font-family="monospace" font-weight="bold">$LISTEN_FDS</tspan>
        <tspan x="987" dy="32">starting at descriptor 3 through </tspan>
        <tspan x="987" dy="32" font-family="monospace" font-weight="bold">sd_listen_fds()</tspan>
      </text>
    </g>

    <!-- Arrow L2: Node 3 -> Note -->
    <line x1="1188" y1="740" x2="1188" y2="762" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Note in Lane 2: real servers that understand socket activation use this form -->
    <g id="l2-note">
      <rect x="845" y="770" width="685" height="156" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" filter="url(#card-shadow)" />
      <!-- Star/Server Icon (56px) -->
      <g transform="translate(865, 821)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="14" rx="3" />
        <circle cx="14" cy="15" r="2" fill="#db8129" />
        <rect x="6" y="28" width="44" height="14" rx="3" />
        <circle cx="14" cy="35" r="2" fill="#db8129" />
      </g>
      <!-- Text -->
      <text x="940" y="834" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="940" dy="0">real servers that understand </tspan>
        <tspan x="940" dy="34">socket activation use this form</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER TEST STRIP ==================== -->
  <g id="footer-test-strip">
    <!-- Test Strip Container -->
    <rect x="50" y="960" width="1500" height="136" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <!-- Row 1: Command 1 & Command 2 -->
    <!-- Command 1: sudo systemctl start echo.socket -->
    <g id="cmd-1">
      <rect x="70" y="976" width="715" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(86, 988)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="122" y="1008" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sudo systemctl start echo.socket</text>
    </g>

    <!-- Command 2: ss -ltn | grep 22222 -->
    <g id="cmd-2">
      <rect x="815" y="976" width="715" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(831, 988)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="867" y="1008" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ss -ltn | grep 22222</text>
    </g>

    <!-- Row 2: Command 3 & Command 4 -->
    <!-- Command 3: echo hi | nc localhost 22222 -->
    <g id="cmd-3">
      <rect x="70" y="1034" width="715" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(86, 1046)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="122" y="1066" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">echo hi | nc localhost 22222</text>
    </g>

    <!-- Command 4: systemctl list-sockets -->
    <g id="cmd-4">
      <rect x="815" y="1034" width="715" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(831, 1046)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="867" y="1066" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">systemctl list-sockets</text>
    </g>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="50" y="1116" width="1500" height="60" rx="10" fill="#207448" />
    <text x="800" y="1155" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">With Accept=false the service must support the handoff</text>
  </g>
</svg>