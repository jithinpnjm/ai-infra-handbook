<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>The quality configuration in pyproject.toml and pre-commit, line by line</title>
  <desc>Visual guide to quality gate configurations in pyproject.toml for ruff, strict mypy, and coverage alongside pre-commit hooks, typing conventions, and CI enforcement.</desc>

  <rect width="1600" height="1160" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="40" y="76" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">The quality configuration in pyproject.toml</tspan>
    <tspan x="40" dy="54">and pre-commit, line by line</tspan>
  </text>

  <!-- Left Panel: pyproject.toml quality configuration -->
  <rect x="40" y="165" width="740" height="680" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  <!-- Card 1: [tool.ruff] -->
  <rect x="60" y="185" width="700" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="84" y="219" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="84" dy="0">[tool.ruff]</tspan>
    <tspan x="84" dy="27">line-length = 100, target-version = py311</tspan>
  </text>

  <!-- Card 2: lint select -->
  <rect x="60" y="279" width="700" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="84" y="313" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="84" dy="0">lint select = E, F, I, B, UP, S, C4, SIM,</tspan>
    <tspan x="84" dy="27">PT, RUF, ASYNC, T20: pycodestyle, pyflakes,</tspan>
    <tspan x="84" dy="27">isort, bugbear, upgrade, bandit and more</tspan>
  </text>

  <!-- Card 3: ignore and per-file-ignores -->
  <rect x="60" y="401" width="700" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="84" y="435" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="84" dy="0">ignore = [S101]: asserts allowed in tests;</tspan>
    <tspan x="84" dy="27">per-file-ignores tests/** = [S, T20]</tspan>
  </text>

  <!-- Card 4: [tool.mypy] -->
  <rect x="60" y="495" width="700" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="84" y="529" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="84" dy="0">[tool.mypy] python_version 3.11,</tspan>
    <tspan x="84" dy="27">strict = true, warn_unused_ignores = true,</tspan>
    <tspan x="84" dy="27">exclude build/</tspan>
  </text>

  <!-- Card 5: [tool.coverage.run] -->
  <rect x="60" y="617" width="700" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="84" y="651" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="84" dy="0">[tool.coverage.run]</tspan>
    <tspan x="84" dy="27">branch = true, source = [fleetctl]</tspan>
  </text>

  <!-- Card 6: [tool.coverage.report] - ORANGE highlight -->
  <rect x="60" y="711" width="700" height="114" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="84" y="743" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="84" dy="0">[tool.coverage.report] <tspan fill="#db8129" font-weight="bold">fail_under = 85</tspan>,</tspan>
    <tspan x="84" dy="26">show_missing = true, exclude_also:</tspan>
    <tspan x="84" dy="26">if TYPE_CHECKING, raise NotImplementedError,</tspan>
    <tspan x="84" dy="26">if __name__ == __main__</tspan>
  </text>

  <!-- Right Panel: pre-commit configuration -->
  <rect x="820" y="165" width="740" height="680" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  <!-- Card 7: ruff-pre-commit -->
  <rect x="840" y="195" width="700" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="864" y="241" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="864" dy="0">ruff-pre-commit rev v0.6.9:</tspan>
    <tspan x="864" dy="30">ruff with --fix, and ruff-format</tspan>
  </text>

  <!-- Card 8: mirrors-mypy -->
  <rect x="840" y="326" width="700" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="864" y="375" font-family="monospace" font-size="24" fill="#303a36">mirrors-mypy rev v1.11.2 with types-PyYAML</text>

  <!-- Card 9: pre-commit-hooks -->
  <rect x="840" y="434" width="700" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="864" y="476" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="864" dy="0">pre-commit-hooks rev v4.6.0: check-yaml,</tspan>
    <tspan x="864" dy="29">end-of-file-fixer, trailing-whitespace,</tspan>
    <tspan x="864" dy="29">detect-private-key</tspan>
  </text>

  <!-- Card 10: Notes -->
  <rect x="840" y="595" width="700" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="864" y="639" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="864" dy="0">the versions are examples; pin the versions</tspan>
    <tspan x="864" dy="32">you have reviewed; run the same hooks in CI</tspan>
    <tspan x="864" dy="32">so nobody can bypass them</tspan>
  </text>

  <!-- Typing Strip -->
  <rect x="40" y="885" width="1520" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <!-- Typing Icon (56px) -->
  <g transform="translate(65, 917)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16,12 4,28 16,44"/>
    <polyline points="40,12 52,28 40,44"/>
    <line x1="32" y1="8" x2="24" y2="48"/>
  </g>

  <text x="150" y="923" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">annotate public functions; Protocol for injected collaborators so fakes type-check;</tspan>
    <tspan x="150" dy="28">TypedDict, dataclasses or pydantic for payloads; avoid Any creep;</tspan>
    <tspan x="150" dy="28">type checker is a required CI check, not only an editor feature</tspan>
  </text>

  <!-- Bottom Bar -->
  <rect x="40" y="1045" width="1520" height="70" rx="10" fill="#207448"/>
  
  <!-- Bottom Bar Icon -->
  <g transform="translate(65, 1055)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="25" cy="25" r="20"/>
    <polyline points="16,25 22,31 34,19"/>
  </g>

  <text x="800" y="1089" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Configure the gates once in pyproject.toml and the hooks file</text>
</svg>