<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Which host veth belongs to this pod: pairing by ifindex</title>
  <desc>Visual explanation of finding which host veth interface corresponds to a Kubernetes pod by matching peer_ifindex from ethtool inside the pod with the interface index on the host.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1050" fill="#f5f8f5" />

  <!-- Title (48px bold) -->
  <text x="800" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Which host veth belongs to this pod: </tspan>
    <tspan x="800" dy="54">pairing by ifindex</tspan>
  </text>

  <!-- ==================== PROCESS FLOW TOP ==================== -->
  <!-- Process Step 1: crictl pods -->
  <g id="step-1">
    <rect x="50" y="135" width="290" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(173, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="36" height="32" rx="4" fill="#ffffff" />
      <line x1="4" y1="16" x2="40" y2="16" />
      <circle cx="12" cy="10" r="2" fill="#207448" />
      <circle cx="20" cy="10" r="2" fill="#207448" />
    </g>
    <text x="195" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="195" dy="0">crictl pods </tspan>
      <tspan x="195" dy="30">--name trainer-0</tspan>
    </text>
  </g>

  <!-- Process Step 2: crictl inspectp -->
  <g id="step-2">
    <rect x="360" y="135" width="320" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(498, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="12" fill="#ffffff" />
      <line x1="27" y1="27" x2="38" y2="38" />
    </g>
    <text x="520" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="520" dy="0">crictl inspectp </tspan>
      <tspan x="520" dy="28">&lt;pod-id&gt; | </tspan>
      <tspan x="520" dy="28">jq .info.pid</tspan>
    </text>
  </g>

  <!-- Process Step 3: nsenter netns -->
  <g id="step-3">
    <rect x="700" y="135" width="380" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(868, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="28" rx="4" fill="#ffffff" />
      <polyline points="12,16 18,20 12,24" />
      <line x1="22" y1="24" x2="30" y2="24" />
    </g>
    <text x="890" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="890" dy="0">nsenter -t &lt;pid&gt; -n </tspan>
      <tspan x="890" dy="28">ip -br addr, </tspan>
      <tspan x="890" dy="28">ip route, ss -tulpn</tspan>
    </text>
  </g>

  <!-- Process Step 4: kubectl debug -->
  <g id="step-4">
    <rect x="1100" y="135" width="450" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(1303, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="28" rx="4" fill="#ffffff" />
      <circle cx="14" cy="20" r="3" fill="#207448" />
      <line x1="22" y1="20" x2="32" y2="20" />
    </g>
    <text x="1325" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1325" dy="0">kubectl debug -it trainer-0 </tspan>
      <tspan x="1325" dy="28">--image=nicolaka/netshoot </tspan>
      <tspan x="1325" dy="28">--target=pytorch</tspan>
    </text>
  </g>

  <!-- ==================== MAIN PANELS ==================== -->
  <!-- LEFT PANEL: Inside the pod namespace -->
  <g id="left-panel">
    <rect x="50" y="310" width="570" height="470" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(75, 330)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 52 16 L 52 40 L 28 52 L 4 40 L 4 16 Z" fill="#ffffff" />
      <circle cx="28" cy="28" r="8" fill="#e8f1ea" />
    </g>
    <text x="150" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Inside the pod namespace</text>

    <rect x="75" y="405" width="520" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="335" y="443" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="335" dy="0">eth0 </tspan>
      <tspan x="335" dy="32">(the pod end of the veth pair)</tspan>
    </text>

    <rect x="75" y="520" width="520" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="335" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="335" dy="0">sudo nsenter -t &lt;pid&gt; -n </tspan>
      <tspan x="335" dy="28">ethtool -S eth0 | </tspan>
      <tspan x="335" dy="28">grep peer_ifindex</tspan>
    </text>

    <rect x="75" y="650" width="520" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="335" y="710" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">peer_ifindex: N</text>
  </g>

  <!-- ==================== CONNECTING ARROW & LABEL ==================== -->
  <g id="pairing-label-card">
    <rect x="640" y="480" width="320" height="160" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="800" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">same number: </tspan>
      <tspan x="800" dy="32">this host veth is </tspan>
      <tspan x="800" dy="32">the other end of </tspan>
      <tspan x="800" dy="32">the pod's eth0</tspan>
    </text>
  </g>

  <!-- Single key connection arrow (orange) -->
  <line x1="595" y1="700" x2="1005" y2="700" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  <!-- ==================== RIGHT PANEL: On the host ==================== -->
  <g id="right-panel">
    <rect x="980" y="310" width="570" height="470" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1005, 330)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="18" rx="4" fill="#ffffff" />
      <rect x="4" y="30" width="48" height="18" rx="4" fill="#ffffff" />
      <circle cx="12" cy="15" r="2" fill="#207448" />
      <circle cx="20" cy="15" r="2" fill="#207448" />
      <circle cx="12" cy="39" r="2" fill="#207448" />
      <circle cx="20" cy="39" r="2" fill="#207448" />
      <line x1="36" y1="15" x2="44" y2="15" />
      <line x1="36" y1="39" x2="44" y2="39" />
    </g>
    <text x="1080" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">On the host</text>

    <rect x="1005" y="405" width="520" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1265" y="440" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">ip -o link | grep ^N:</text>

    <rect x="1005" y="470" width="520" height="42" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="1025" y="500" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">lo</text>

    <rect x="1005" y="522" width="520" height="42" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="1025" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">eth0 or the uplink</text>

    <rect x="1005" y="574" width="520" height="42" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="1025" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">cni0 or the node's routing device</text>

    <rect x="1005" y="650" width="520" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="1025" y="687" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448">vethXXX (index N)</text>

    <rect x="1005" y="718" width="520" height="42" rx="6" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="1025" y="748" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">vethYYY</text>
  </g>

  <!-- ==================== USE CASES BENEATH ==================== -->
  <g id="use-case-1">
    <rect x="50" y="810" width="720" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(75, 830)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <circle cx="28" cy="28" r="12" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
      <line x1="28" y1="6" x2="28" y2="28" />
    </g>
    <text x="155" y="868" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">capture on the pod's veth from the host</text>
  </g>

  <g id="use-case-2">
    <rect x="830" y="810" width="720" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(855, 830)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="48" height="36" rx="6" fill="#ffffff" />
      <circle cx="16" cy="28" r="4" fill="#207448" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
      <circle cx="40" cy="28" r="4" fill="#207448" />
      <line x1="16" y1="20" x2="16" y2="24" />
      <line x1="28" y1="20" x2="28" y2="24" />
      <line x1="40" y1="20" x2="40" y2="24" />
    </g>
    <text x="935" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="935" dy="0">find which bridge port or </tspan>
      <tspan x="935" dy="32">Calico caliXXXX route belongs to the pod</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM BAR ==================== -->
  <g id="bottom-takeaway">
    <rect x="50" y="935" width="1500" height="75" rx="12" fill="#207448" />
    <text x="800" y="982" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">nsenter runs the tools of the host inside the namespace of the pod</text>
  </g>

</svg>