<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Why all spines share one ASN</title>
  <desc>Visual infographic explaining how sharing one ASN across all spines prevents valley paths in eBGP Clos fabrics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1060" fill="#f5f8f5" />

  <!-- Diagram Title -->
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why all spines share one ASN</text>

  <!-- Main Panel: Leaf-spine slice -->
  <g id="leaf-spine-slice">
    <rect x="40" y="80" width="1520" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="75" y="125" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Leaf-spine slice</text>

    <!-- Spine Tier Grouping: same ASN -->
    <g id="spine-tier">
      <rect x="350" y="145" width="700" height="175" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" />
      <text x="375" y="180" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">same ASN</text>

      <!-- Node: spine1 -->
      <g id="node-spine1" transform="translate(375, 195)">
        <rect width="310" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
        <g transform="translate(25, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
          <line x1="12" y1="14" x2="44" y2="14" />
          <polyline points="38,9 44,14 38,19" />
          <line x1="44" y1="24" x2="12" y2="24" />
          <polyline points="18,19 12,24 18,29" />
        </g>
        <text x="105" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">spine1</text>
      </g>

      <!-- Node: spine2 -->
      <g id="node-spine2" transform="translate(715, 195)">
        <rect width="310" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
        <g transform="translate(25, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
          <line x1="12" y1="14" x2="44" y2="14" />
          <polyline points="38,9 44,14 38,19" />
          <line x1="44" y1="24" x2="12" y2="24" />
          <polyline points="18,19 12,24 18,29" />
        </g>
        <text x="105" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">spine2</text>
      </g>
    </g>

    <!-- Node: leaf3 -->
    <g id="node-leaf3" transform="translate(75, 460)">
      <rect width="270" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(25, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
        <line x1="12" y1="14" x2="44" y2="14" />
        <polyline points="38,9 44,14 38,19" />
        <line x1="44" y1="24" x2="12" y2="24" />
        <polyline points="18,19 12,24 18,29" />
      </g>
      <text x="105" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">leaf3</text>
    </g>

    <!-- Node: leaf2 -->
    <g id="node-leaf2" transform="translate(580, 460)">
      <rect width="270" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(25, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="56" height="38" rx="6" fill="#e8f1ea" />
        <line x1="12" y1="14" x2="44" y2="14" />
        <polyline points="38,9 44,14 38,19" />
        <line x1="44" y1="24" x2="12" y2="24" />
        <polyline points="18,19 12,24 18,29" />
      </g>
      <text x="105" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">leaf2</text>
    </g>

    <!-- Step 1 Callout: route starts at leaf3 -->
    <g id="step1-callout" transform="translate(75, 595)">
      <rect width="360" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="35" cy="35" r="20" fill="#207448" />
      <text x="35" y="35" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="75" y="43" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">route starts at leaf3</text>
    </g>

    <!-- Arrow 1: leaf3 up to spine1 -->
    <path d="M 210 460 C 210 370, 360 300, 430 300" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Arrow 2: spine1 down to leaf2 -->
    <path d="M 600 300 C 600 380, 680 380, 680 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Failed Link at leaf2 with orange X -->
    <g id="failed-link-group">
      <line x1="715" y1="565" x2="715" y2="665" stroke="#db8129" stroke-width="4" stroke-dasharray="8,6" />
      <circle cx="715" cy="615" r="22" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      <line x1="704" y1="604" x2="726" y2="626" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />
      <line x1="726" y1="604" x2="704" y2="626" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Step 2 Callout: a failed link leaves only one remaining path -->
    <g id="step2-callout" transform="translate(465, 675)">
      <rect width="520" height="95" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
      <circle cx="35" cy="47" r="20" fill="#207448" />
      <text x="35" y="47" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="75" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="75" dy="0">a failed link</tspan>
        <tspan x="75" dy="32">leaves only one remaining path</tspan>
      </text>
    </g>

    <!-- Arrow 3: leaf2 passes route up to spine2 -->
    <path d="M 780 460 C 820 400, 840 360, 840 300" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Step 3 Callout: then leaf2 passes the route up to spine2 -->
    <g id="step3-callout" transform="translate(1015, 465)">
      <rect width="455" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="35" cy="47" r="20" fill="#207448" />
      <text x="35" y="47" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      <text x="75" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="75" dy="0">then leaf2 passes</tspan>
        <tspan x="75" dy="32">the route up to spine2</tspan>
      </text>
    </g>

    <!-- Step 4 Rejection at spine2: green check -->
    <g id="step4-rejection" transform="translate(1075, 175)">
      <rect width="455" height="145" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="45" cy="72" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <polyline points="35,72 42,79 56,65" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="85" y="45" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="85" dy="0">spine2 sees its own ASN</tspan>
        <tspan x="85" dy="32">already in the path</tspan>
        <tspan x="85" dy="32">and rejects it</tspan>
      </text>
    </g>
  </g>

  <!-- Second Small Panel in Orange -->
  <g id="second-panel" transform="translate(40, 815)">
    <rect width="1520" height="120" rx="16" fill="#fff9f3" stroke="#db8129" stroke-width="2.5" />
    <g transform="translate(30, 35)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="26,4 50,44 2,44" fill="#fff0e0" />
      <line x1="26" y1="18" x2="26" y2="30" stroke="#db8129" stroke-width="3.5" />
      <circle cx="26" cy="37" r="2" fill="#db8129" />
    </g>
    <text x="105" y="52" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="105" dy="0">different spine ASNs: no repeated ASN, the valley path is installed,</tspan>
      <tspan x="105" dy="38">forwarding becomes suboptimal and latency rises</tspan>
    </text>
  </g>

  <!-- Note: per-rack leaf ASN 65101, 65102 -->
  <g id="note-callout" transform="translate(40, 955)">
    <rect width="1520" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(28, 18)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="16" fill="#e8f1ea" />
      <line x1="20" y1="14" x2="20" y2="18" stroke-width="3.5" />
      <line x1="20" y1="22" x2="20" y2="28" stroke-width="3.5" />
    </g>
    <text x="85" y="47" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Note: per-rack leaf ASN 65101, 65102</text>
  </g>
</svg>