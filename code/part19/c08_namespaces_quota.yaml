# Namespaces and native ResourceQuota guard for the MIG tenants (Chapter 19.8).
# Extended resources accept only the requests. prefix in a ResourceQuota.
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-search
  labels:
    c08/tenant: search
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mig-slices
  namespace: team-search
spec:
  hard:
    requests.nvidia.com/mig-1g.10gb: "16"
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-chat
  labels:
    c08/tenant: chat
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mig-slices
  namespace: team-chat
spec:
  hard:
    requests.nvidia.com/mig-3g.40gb: "4"
---
