# Loki chart 7.5.0 (app 3.6.16), single binary, filesystem storage.
# For a lab and for small platforms. Production volume needs object storage
# and the distributed mode (Chapter 20.15).
# Install:
#   helm install loki grafana/loki --version 7.5.0 -n monitoring -f c07_values_loki.yaml
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    # Required for OTLP ingestion. On by default in Loki 3.0 and later.
    allow_structured_metadata: true
    retention_period: 168h

singleBinary:
  replicas: 1
  persistence:
    size: 50Gi

# Zero out the other deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# No object store and no caches in this layout.
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Scraped by the kube-prometheus-stack Prometheus (job label: loki).
monitoring:
  serviceMonitor:
    enabled: true
