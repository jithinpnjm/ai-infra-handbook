apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-llama31-8b
  namespace: inference
spec:
  annotations:
    prometheus.kserve.io/port: "8080"
    prometheus.kserve.io/path: "/metrics"
  supportedModelFormats:
    - name: vLLM
      version: "1"
      autoSelect: true
  multiModel: false
  volumes:
    - name: devshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  containers:
    - name: kserve-container
      # The image entrypoint is "vllm serve". The model id and the memory caps are
      # appended from the InferenceService, because KServe concatenates args.
      image: vllm/vllm-openai:v0.32.0
      imagePullPolicy: IfNotPresent
      args:
        - --port=8080
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      volumeMounts:
        - name: devshm
          mountPath: /dev/shm
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 90
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
