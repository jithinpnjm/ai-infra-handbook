apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: llama31-8b-nim
  namespace: inference
spec:
  source:
    ngc:
      # Tag taken from the k8s-nim-operator v3.1.3 samples README. Confirm that it lists an A100 40 GB profile.
      modelPuller: nvcr.io/nim/meta/llama-3.1-8b-instruct:1.15.5
      pullSecret: ngc-secret
      authSecret: ngc-api-secret
      model:
        engine: tensorrt_llm
        tensorParallelism: "1"
        gpus:
          - product: a100
  storage:
    pvc:
      create: true
      size: 100Gi
      volumeAccessMode: ReadWriteOnce
---
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: llama31-8b-nim
  namespace: inference
spec:
  image:
    repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
    tag: "1.15.5"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    nimCache:
      name: llama31-8b-nim
      # Leave profile empty to let the operator pick, or set one id from the NIMCache status.
      profile: ""
  replicas: 1
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100
  resources:
    limits:
      nvidia.com/gpu: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
