---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpuhealth-manager
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - platform.example.com
  resources:
  - gpuhealthpolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.example.com
  resources:
  - gpuhealthpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - platform.example.com
  resources:
  - gpuhealthpolicies/status
  verbs:
  - get
  - patch
  - update
