apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue-standard
spec:
  cohort: default
  flavorQuotas:
    - name: h100-sxm5-80gb
      resources:
        - name: cpu
          nominalQuota: 200
        - name: memory
          nominalQuota: 1Ti
        - name: nvidia.com/gpu
          nominalQuota: 16
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors: ["h100-sxm5-80gb"]
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue-production
spec:
  cohort: default
  flavorQuotas:
    - name: h100-sxm5-80gb
      resources:
        - name: cpu
          nominalQuota: 800
        - name: memory
          nominalQuota: 4Ti
        - name: nvidia.com/gpu
          nominalQuota: 64
