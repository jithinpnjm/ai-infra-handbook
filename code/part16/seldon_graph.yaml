apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  name: rag-pipeline
spec:
  predictors:
    - name: default
      replicas: 1
      componentSpecs:
        - spec:
            containers:
              - name: retriever
                image: registry.example.com/rag/retriever:1.0
              - name: generator
                image: registry.example.com/rag/generator:1.0
      graph:
        name: retriever
        type: MODEL
        children:
          - name: generator
            type: MODEL
            children: []
