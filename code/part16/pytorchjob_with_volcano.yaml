apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: churn-distributed
  annotations:
    scheduling.volcano.sh/group-name: "churn-distributed"
    scheduling.volcano.sh/group-min-member: "8"
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            scheduling.volcano.sh/group-name: "churn-distributed"
        spec:
          containers:
            - name: pytorch
              image: registry.example.com/ml/churn-train:PINNED_TAG
              command: ["torchrun", "train.py"]
              resources:
                limits:
                  nvidia.com/gpu: 1
    Worker:
      replicas: 7
      template:
        metadata:
          annotations:
            scheduling.volcano.sh/group-name: "churn-distributed"
        spec:
          containers:
            - name: pytorch
              image: registry.example.com/ml/churn-train:PINNED_TAG
              command: ["torchrun", "train.py"]
              resources:
                limits:
                  nvidia.com/gpu: 1
