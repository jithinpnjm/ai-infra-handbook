# A pod that pulls an artifact with no cosign signature. The admission policy from the chapter
# (not included here) is what should reject it; the pod itself is ordinary.
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-model-test
  namespace: mlops
  annotations:
    models.example.com/artifact: model.pkl
spec:
  containers:
    - name: serve
      image: busybox:1.36
      command: [sleep, "3600"]
