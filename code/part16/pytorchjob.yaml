apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: churn-distributed
spec:
  runPolicy:
    cleanPodPolicy: None
    ttlSecondsAfterFinished: 600
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: my-training-image:v1
              command: [python, train.py]
              args: ["--dataset-id", "churn-v3", "--backend", "nccl"]
              resources:
                limits:
                  cpu: "16"
                  memory: "64Gi"
                  nvidia.com/gpu: "8"
    Worker:
      replicas: 7
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: my-training-image:v1
              command: [python, train.py]
              args: ["--dataset-id", "churn-v3", "--backend", "nccl"]
              resources:
                limits:
                  cpu: "16"
                  memory: "64Gi"
                  nvidia.com/gpu: "8"
