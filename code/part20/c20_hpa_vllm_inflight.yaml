# code/part20/c20_hpa_vllm_inflight.yaml
# HPA on in-flight requests per pod. The metric name below is an example. It must be produced by a
# metrics adapter rule (for example prometheus-adapter) that sums vllm:num_requests_running and
# vllm:num_requests_waiting per pod. The adapter rule is not shown here and was not run.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-llama
  namespace: llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-llama
  minReplicas: 3
  maxReplicas: 16
  metrics:
    - type: Pods
      pods:
        metric:
          name: vllm_requests_inflight
        target:
          type: AverageValue
          averageValue: "11"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 900
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
