# Chapter 20.23: the fixed states. Compare each object with c23_manifests_broken.yaml.
# Drill 1: toleration for the taint the GPU node pool carries.
apiVersion: v1
kind: Pod
metadata:
  name: llama-gpu
  namespace: serving
spec:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: llama
      image: registry.example/llama:v1
      resources:
        limits:
          nvidia.com/gpu: 1
---
# Drills 3 and 9: a startup probe covers slow model loading, then liveness stays quick.
# Requests are set so that CPU utilisation has a denominator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-server
  namespace: serving
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-server
  template:
    metadata:
      labels:
        app: llm-server
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: server
          image: registry.example/llm-server:v3
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
# Drill 8: the selector now matches the Pod label.
apiVersion: v1
kind: Service
metadata:
  name: llm-server
  namespace: serving
spec:
  selector:
    app: llm-server
  ports:
    - port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-server
  namespace: serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-server
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Drill 6: one voluntary eviction at a time, and unhealthy Pods may be evicted.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-server
  namespace: serving
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: llm-server
---
# Drill 10: tolerates the GPU taint, and runs at node-critical priority.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: gpu-device-plugin
  template:
    metadata:
      labels:
        name: gpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: plugin
          image: registry.example/gpu-device-plugin:v1
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
---
# Drill 12: fail open, short timeout, and never match kube-system or the webhook's own namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: policy-defaults
webhooks:
  - name: defaults.policy.example.com
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "policy-system"]
    clientConfig:
      service:
        namespace: policy-system
        name: policy-webhook
        path: /mutate
        port: 8443
      caBundle: Q0FfUExBQ0VIT0xERVI=
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 3
    failurePolicy: Ignore
