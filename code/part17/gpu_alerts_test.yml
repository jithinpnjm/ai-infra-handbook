# promtool test rules gpu_alerts_test.yml
# Series use the 4.9.0 names (ratio, hertz, bytes) and the 4.8.x names (percent, MHz, MiB).
rule_files:
  - gpu_alerts.yaml
evaluation_interval: 30s
tests:
  - interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{gpu="0",node="n49"}'
        values: '0.97+0x15'
      - series: 'DCGM_FI_DEV_GPU_UTIL{gpu="0",node="n48"}'
        values: '97+0x15'
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{gpu="1",node="n49"}'
        values: '0.50+0x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{gpu="0",node="n49"}'
        values: '90+0x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP{gpu="0",node="n48"}'
        values: '90+0x15'
      - series: 'DCGM_FI_DEV_XID_ERROR{gpu="2",node="n49"}'
        values: '0 79 79 79'
      - series: 'DCGM_FI_DEV_XID_ERRORS{gpu="2",node="n48"}'
        values: '0 79 79 79'
      - series: 'DCGM_FI_DEV_FB_USED_BYTES{gpu="0",node="n49"}'
        values: '78383153152+0x15'
      - series: 'DCGM_FI_DEV_FB_CAPACITY_BYTES{gpu="0",node="n49"}'
        values: '85899345920+0x15'
      - series: 'DCGM_FI_DEV_FB_USED{gpu="0",node="n48"}'
        values: '74752+0x15'
      - series: 'DCGM_FI_DEV_FB_FREE{gpu="0",node="n48"}'
        values: '8192+0x15'
      - series: 'DCGM_FI_DEV_SM_CLOCK_HERTZ{gpu="0",node="n49"}'
        values: '1200000000+0x15'
      - series: 'DCGM_FI_DEV_SM_CLOCK{gpu="0",node="n48"}'
        values: '1200+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: GPUHighUtilization
        exp_alerts:
          - exp_labels: {severity: warning, gpu: "0", node: n49}
            exp_annotations: {summary: "GPU 0 on n49 is over-utilised"}
          - exp_labels: {severity: warning, gpu: "0", node: n48}
            exp_annotations: {summary: "GPU 0 on n48 is over-utilised"}
      - eval_time: 12m
        alertname: GPUThermalThrottle
        exp_alerts:
          - exp_labels: {severity: warning, gpu: "0", node: n49}
            exp_annotations: {summary: "GPU 0 on n49 is thermal-throttling"}
          - exp_labels: {severity: warning, gpu: "0", node: n48}
            exp_annotations: {summary: "GPU 0 on n48 is thermal-throttling"}
      - eval_time: 3m
        alertname: GPUXidError
        exp_alerts:
          - exp_labels: {severity: critical, gpu: "2", node: n49}
            exp_annotations: {summary: "GPU 2 on n49 has Xid errors"}
          - exp_labels: {severity: critical, gpu: "2", node: n48}
            exp_annotations: {summary: "GPU 2 on n48 has Xid errors"}
      - eval_time: 8m
        alertname: GPUMemoryPressure
        exp_alerts:
          - exp_labels: {severity: warning, gpu: "0", node: n49}
            exp_annotations: {summary: "GPU 0 on n49 is under memory pressure"}
          - exp_labels: {severity: warning, gpu: "0", node: n48}
            exp_annotations: {summary: "GPU 0 on n48 is under memory pressure"}
      - eval_time: 12m
        alertname: GPUClockThrottle
        exp_alerts:
          - exp_labels: {severity: warning, gpu: "0", node: n49}
            exp_annotations: {summary: "GPU 0 on n49 is clock-throttling"}
          - exp_labels: {severity: warning, gpu: "0", node: n48}
            exp_annotations: {summary: "GPU 0 on n48 is clock-throttling"}
