apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nvke-api-clients
  namespace: nvke-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nvke-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.10.0/24
        - ipBlock:
            cidr: 10.0.20.0/24
      ports:
        - port: 8080
          protocol: TCP
